<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pflichten-Showdown – WiSo Modul 3</title>
<style>
:root{--bg:#f3efe4;--ink:#1d1d1f;--navy:#13275a;--gold:#b8901c;--paper:#fbf9f3;--line:#d8d1bf;--muted:#5d5a52;--ok:#2d6b3a;--bad:#a32626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:14px 20px 40px}
header{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-top:3px double var(--ink);border-bottom:2px solid var(--ink);padding:10px 0 8px;margin-bottom:16px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:44px;margin:0;line-height:1;letter-spacing:-.5px}
.sub{letter-spacing:.16em;font-size:12.5px;text-transform:uppercase;color:#333;flex:1;padding-bottom:4px;min-width:260px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hbtn{background:var(--paper);border:1px solid #9c9584;border-radius:5px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.hbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl{display:block;font-size:.86em;color:#4b5a86;font-weight:400;unicode-bidi:plaintext;margin-top:2px}
.tl[dir=rtl],.tl:lang(ar){text-align:right}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 26px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.center{max-width:1000px;margin:0 auto}
h2{font-family:Georgia,serif;font-size:30px;margin:0 0 6px}
.intro{color:var(--muted);margin:0 0 16px}
.rule{display:flex;gap:14px;background:#ece7d8;border-radius:6px;padding:12px 16px;margin-bottom:10px}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.rule h3{margin:0 0 3px;font-size:17px}
.rule p{margin:0}
.big{display:block;width:100%;border:0;border-radius:5px;background:var(--gold);color:#fff;font-family:inherit;font-weight:700;font-size:19px;line-height:1.2;padding:13px;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #8a6a10}
.big .tl,.btn .tl{color:#fff;opacity:.85}
.big:disabled{opacity:.45;cursor:default}
.navy{background:var(--navy);box-shadow:0 3px 0 #0b1838}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.cnt button{border:2px solid #b9b19d;background:var(--paper);border-radius:6px;padding:12px;font-family:inherit;font-weight:700;font-size:19px;cursor:pointer}
.cnt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.nrow{display:flex;gap:12px;align-items:center;margin:8px 0}
.nrow input{flex:1;font:inherit;font-size:19px;padding:10px 14px;border:1px solid #bdb5a2;border-radius:5px;background:#fff}
.dot{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;border:3px solid #fff;box-shadow:0 0 0 1px #888}
.hint{color:var(--muted);font-size:15px;margin-top:8px}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.game{grid-template-columns:1fr}h1{font-size:34px}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:6px 14px 6px 8px;min-width:150px}
.chip.cur{border-color:currentColor}
.chip b{display:block;color:var(--ink)}
.chip small{color:var(--muted)}
.board{border:2px solid var(--navy);border-radius:4px;overflow:hidden;background:#fff}
.bhead{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:Georgia,serif;font-weight:700;font-size:17px;min-height:46px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.cell{position:relative;aspect-ratio:1.12/1;border-right:1px solid #ddd6c3;border-bottom:1px solid #ddd6c3;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell:nth-child(odd){background:#f6f3ea}.cell:nth-child(even){background:#ece8dc}
.cell .n{position:absolute;top:3px;left:6px;font-size:13px;font-weight:600;color:#333}
.cell .ic{font-size:30px;line-height:1}
.cell .lb{font-size:9.5px;letter-spacing:.03em;overflow-wrap:anywhere;text-transform:uppercase;color:#444;margin-top:4px;text-align:center}
.cell.w{background:#f3eab8 !important}.cell.p{background:#cfe0f2 !important}.cell.g{background:#f1d4d4 !important}
.cell.z{background:#1b1b22 !important;color:#fff}.cell.z .n,.cell.z .lb{color:#fff}
.toks{position:absolute;bottom:3px;right:3px;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.tok{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
.tok.hop{transform:translateY(-6px) scale(1.15)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:8px;color:#333}
.legend span .tl{display:inline;margin-left:4px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 22px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.who small{letter-spacing:.14em;text-transform:uppercase;color:#555;font-size:12px}
.who .nm{font-family:Georgia,serif;font-weight:700;font-size:22px;display:block}
.drow{display:flex;gap:16px;align-items:center;margin:8px 0 6px}
.die{width:62px;height:62px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-shadow:0 3px 0 #333}
.die i{display:block;width:11px;height:11px;border-radius:50%;margin:auto}
.die i.on{background:var(--ink)}
.die.roll{animation:wob .12s linear infinite}
@keyframes wob{50%{transform:rotate(12deg)}}
.btn{border:0;border-radius:5px;background:var(--navy);color:#fff;font-family:inherit;font-weight:700;font-size:18px;padding:12px 22px;cursor:pointer;box-shadow:0 3px 0 #0b1838}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #8a6a10}
.qcard{background:#fff;border:2px solid var(--gold);border-radius:8px;padding:12px 16px;margin:10px 0 14px;position:relative}
.qcard .lbl{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#7a6418;font-weight:700}
.qcard .q{font-family:Georgia,serif;font-size:23px;font-weight:700;margin-top:4px}
.qcard .sit{font-size:17px;margin-top:4px}
h4{margin:12px 0 6px;font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:2px solid #c9c1ad;background:#fff;border-radius:6px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;line-height:1.25}
.opt small{font-weight:400;color:#666}
.opt.sel{border-color:var(--navy);background:#e4e9f5}
.opt.right{border-color:var(--ok);background:#dcefdf}
.opt.wrong{border-color:var(--bad);background:#f6dada}
.opt:disabled{cursor:default;color:var(--ink)}
.res{border-radius:6px;padding:10px 14px;margin-top:12px;background:#eef1f7;border-left:5px solid var(--navy)}
.res p{margin:4px 0}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.move{font-size:19px;font-weight:700;margin:12px 0 4px}
.spec{font-size:19px;margin:6px 0 4px}
#win{position:fixed;inset:0;background:rgba(19,39,90,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#win .card{max-width:620px;width:100%;text-align:center}
#win .trophy{font-size:70px;line-height:1}
#win h2{font-size:34px}
.rank{text-align:left;margin:14px 0}
.rank div{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #e3ddcd;font-size:18px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
.hide{display:none !important}
.panel.ro button{pointer-events:none;opacity:.55}
.rob{background:#eef1f7;border-left:5px solid var(--navy);padding:8px 12px;margin-bottom:10px;font-weight:700}
.rob.me{background:#fdf0cc;border-color:var(--gold)}
.cd{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c33;margin-left:4px}.cd.up{background:#3a3}
.lob{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;margin:10px 0}
.lob canvas{background:#fff;border:1px solid var(--line);border-radius:6px;max-width:100%}
</style>
</head>
<body>
<canvas id="cf"></canvas>

</header>
<main id="main"></main>
</div>
<div id="win"><div class="card" id="wincard"></div></div>

/* ---------------- Netz: MQTT über WebSocket (wie Ecken-Sortierer), Ausweich: BroadcastChannel ---------------- */
const TE=new TextEncoder(),TD=new TextDecoder();
function mqStr(s){const b=TE.encode(s);return [b.length>>8,b.length&255,...b];}
function mqLen(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;}
function mqPacket(h,body){return new Uint8Array([h,...mqLen(body.length),...body]);}
class MqttLink{
  constructor(url,cid,onMsg,onStatus){this.url=url;this.cid=cid;this.onMsg=onMsg;this.onStatus=onStatus;this.subs=new Set();this.up=false;this.buf=new Uint8Array(0);this.pid=1;this.tries=0;this.connect();}
  connect(){clearTimeout(this.rt);clearInterval(this.ping);let ws;
    try{ws=new WebSocket(this.url,["mqtt"]);}catch(e){this.retry();return;}
    this.ws=ws;ws.binaryType="arraybuffer";
    const guard=setTimeout(()=>{if(!this.up){try{ws.close();}catch(e){}}},9000);
    ws.onopen=()=>{ws.send(mqPacket(0x10,[...mqStr("MQTT"),4,0x02,0,30,...mqStr(this.cid+"-"+Math.random().toString(36).slice(2,6))]));};
    ws.onmessage=(ev)=>{const d=new Uint8Array(ev.data);const nb=new Uint8Array(this.buf.length+d.length);nb.set(this.buf);nb.set(d,this.buf.length);this.buf=nb;this.parse();};
    ws.onclose=()=>{clearTimeout(guard);this.up=false;clearInterval(this.ping);this.onStatus();this.retry();};
    ws.onerror=()=>{};}
  retry(){this.tries++;const w=Math.min(15000,800*Math.pow(1.6,this.tries));this.rt=setTimeout(()=>this.connect(),w);}
  parse(){while(this.buf.length>=2){let mult=1,len=0,i=1,b;
      do{if(i>=this.buf.length)return;b=this.buf[i++];len+=(b&127)*mult;mult*=128;}while(b&128);
      if(this.buf.length<i+len)return;
      const type=this.buf[0]>>4,flags=this.buf[0]&15,body=this.buf.subarray(i,i+len);this.buf=this.buf.slice(i+len);
      if(type===2){if(body[1]===0){this.up=true;this.tries=0;for(const t of this.subs)this.sendSub(t);
          this.ping=setInterval(()=>{try{this.ws.send(new Uint8Array([0xC0,0]));}catch(e){}},20000);this.onStatus(true);}else{try{this.ws.close();}catch(e){}}}
      else if(type===3){const tl=(body[0]<<8)|body[1];const topic=TD.decode(body.subarray(2,2+tl));let p=2+tl;const qos=(flags>>1)&3;
        if(qos>0){const id=(body[p]<<8)|body[p+1];p+=2;if(qos===1){try{this.ws.send(new Uint8Array([0x40,2,id>>8,id&255]));}catch(e){}}}
        let payload=null;try{payload=JSON.parse(TD.decode(body.subarray(p)));}catch(e){}
        if(payload!==null)this.onMsg(topic,payload);}}}
  sendSub(t){const id=this.pid=(this.pid%60000)+1;try{this.ws.send(mqPacket(0x82,[id>>8,id&255,...mqStr(t),0]));}catch(e){}}
  subscribe(t){this.subs.add(t);if(this.up)this.sendSub(t);}
  publish(t,obj,retain){if(!this.up)return false;const body=[...mqStr(t),...TE.encode(JSON.stringify(obj))];
    try{this.ws.send(mqPacket(retain?0x31:0x30,body));return true;}catch(e){return false;}}
}
class BcLink{ /* nur zum Testen in einem Browser: ?broker=bc */
  constructor(cid,onMsg,onStatus){this.up=true;this.subs=new Set();this.ch=new BroadcastChannel("wisops");this.ch.onmessage=(e)=>{if(this.subs.has(e.data.t))onMsg(e.data.t,e.data.p);};setTimeout(()=>onStatus(true),50);}
  subscribe(t){this.subs.add(t);} publish(t,obj){this.ch.postMessage({t,p:obj});return true;}
}
const params=new URLSearchParams(location.search);
const BR=params.get("broker");
const BROKERS=BR&&BR!=="bc"?[BR]:["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt"];
const NS="wisops1/";
function rnd(n){const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s;}
function codeGen(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(4));for(const x of r)s+=a[x%a.length];return s;}
class Net{
  constructor(onMsg,onStatus){this.cid="c"+rnd(9);this.seen=new Map();this.onMsg=onMsg;
    const cb=()=>onStatus(this.count());
    this.links=BR==="bc"?[new BcLink(this.cid,(t,p)=>this.recv(t,p),cb)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p)=>this.recv(t,p),cb));}
  count(){return {up:this.links.filter(l=>l.up).length,all:this.links.length};}
  recv(t,p){if(p&&p.mid){if(this.seen.has(p.mid))return;this.seen.set(p.mid,Date.now());if(this.seen.size>4000)this.seen.clear();}this.onMsg(t.slice(NS.length),p);}
  sub(t){this.links.forEach(l=>l.subscribe(NS+t));}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true;});return ok;}
}
function store(k,v,ses){try{const st=ses?sessionStorage:localStorage;if(v===undefined)return JSON.parse(st.getItem(k));st.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function clean(s,max){return String(s==null?"":s).replace(/[\u0000-\u001f\u007f]/g," ").trim().slice(0,max);}
function drawQR(canvas,text){const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!text){ctx.fillStyle="#999";ctx.font="bold 18px sans-serif";ctx.textAlign="center";ctx.fillText("Datei erst hochladen (GitHub Pages)",canvas.width/2,canvas.height/2);return;}
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();const n=q.getModuleCount(),quiet=2,cell=Math.floor(canvas.width/(n+quiet*2)),off=Math.floor((canvas.width-cell*n)/2);
  ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const $=id=>document.getElementById(id);
const main=$("main");

function draw(){
  if(!S.deck.length)S.deck=shuffle(CARDS.map((_,i)=>i));
  const c=CARDS[S.deck.pop()];
  /* richtige Pflicht + 3 andere: mindestens eine von der anderen Seite */
  const same=shuffle(PK.filter(k=>k!==c.p&&PF[k].w===PF[c.p].w)),other=shuffle(PK.filter(k=>PF[k].w!==PF[c.p].w));
  S.opts=shuffle([c.p,same[0],same[1],other[0]]);
  return c;
}
function drawW(){
  if(!S.wdeck.length)S.wdeck=shuffle(RF.map((_,i)=>i));
  return RF[S.wdeck.pop()];
}
const whoTag=k=>PF[k].w?`🏪 ${D("betrieb")}`:`👤 ${D("azubi")}`;
const pfName=k=>PF[k].n+(PF[k].x?` <small>(${PF[k].x})</small>`:"");

  $("sub").innerHTML=T("sub");
  let h=LANGS.map(([c,n])=>`<button class="hbtn ${c===lang?"on":""}" data-lang="${c}">${n}</button>`).join("");
  if(ON)h+=`<span class="hbtn" style="cursor:default">🔌 ${ROOM}<span class="cd ${conn?"up":""}"></span></span>`;
  if(S.screen==="game"){
    h+=`<button class="hbtn" id="hRules">${D("regeln")}</button><button class="hbtn" id="hEnd">${S.endAsk?D("ende2"):D("ende")}</button>`;
  }
  $("hbtns").innerHTML=h;
  $("hbtns").querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("ps_lang",lang);}catch(e){}render();});
  if($("hRules"))$("hRules").onclick=()=>{rulesFromGame=true;if(ON){localRules=true;render();return;}S.screen="rules";render();};

    if(!S.endAsk){S.endAsk=true;renderHead();setTimeout(()=>{S.endAsk=false;if(S.screen==="game")renderHead();},4000);return;}

function startGame(){
  S.players=ON?S.players.map((p,i)=>({id:p.id,name:p.name,pos:0,color:COLORS[i]})):S.names.slice(0,S.count).map((n,i)=>({name:n.trim(),pos:0,color:COLORS[i]}));
  S.cur=0;S.phase="roll";S.deck=shuffle(CARDS.map((_,i)=>i));S.wdeck=shuffle(RF.map((_,i)=>i));S.screen="game";S.won=false;S.msgk="";winShown=false;
  $("win").style.display="none";render();sync();
}

/* ---------- Spiel ---------- */
function tokHTML(i,p){return `<div class="tok" id="tok${i}" style="background:${p.color}">${i+1}</div>`;}
function renderBoard(){
  let h=`<div class="chips">`;
  S.players.forEach((p,i)=>{h+=`<div class="chip ${i===S.cur?"cur":""}" style="color:${p.color}"><div class="dot" style="background:${p.color}">${i+1}</div><div><b>${esc(p.name)}</b><small>${D("feld")} ${p.pos} ${D("von18")}</small></div></div>`;});
  h+=`</div><div class="board"><div class="bhead"><span>${D("bstart")}</span><span style="display:flex;gap:4px">`;
  S.players.forEach((p,i)=>{if(p.pos===0)h+=tokHTML(i,p);});
  h+=`</span></div><div class="grid">`;
  for(const f of ORDER){
    const t=FT[f];
    h+=`<div class="cell ${t||""}"><span class="n">${f}</span>`;
    if(t)h+=`<span class="ic">${FI[t][0]}</span><span class="lb">${D(FI[t][1])}</span>`;
    h+=`<div class="toks">`;
    S.players.forEach((p,i)=>{if(p.pos===f)h+=tokHTML(i,p);});
    h+=`</div></div>`;
  }
  h+=`</div></div><div class="legend">`;
  h+=`<span>⚖️ ${D("rechtsfall")} (+2)${tl(U.rechtsfall.slice(1))}</span><span>💶 ${D("zahltag")} (+2)${tl(U.zahltag.slice(1))}</span><span>⚠️ ${D("abmahnung")} (−2)${tl(U.abmahnung.slice(1))}</span><span>🎓 ${D("ziel")}${tl(U.ziel.slice(1))}</span></div>`;
  return h;
}
function dieHTML(n,rolling){let h=`<div class="die ${rolling?"roll":""}" id="die">`;for(let i=0;i<9;i++)h+=`<i class="${PIPS[n].includes(i)?"on":""}"></i>`;return h+`</div>`;}

function renderPanel(){
  const p=S.players[S.cur];
  let h=`<div class="panel${canAct()?"":" ro"}">${roBanner()}<div class="who"><div class="dot" style="background:${p.color};width:42px;height:42px;font-size:18px">${S.cur+1}</div><div><small>${D("amzug")}</small>${lang!=="de"?`<small style="letter-spacing:0;text-transform:none"> · ${U.amzug[LI[lang]+1]}</small>`:""}<span class="nm">${esc(p.name)}</span></div></div>`;
  if(S.phase==="roll"){
    h+=`<p style="margin:4px 0 8px">${D("wuerfle")}${tl(U.wuerfle.slice(1))}</p><div class="drow">${dieHTML(S.roll)}<button class="btn" id="rollBtn">${D("wuerfeln")}</button></div>`;
  } else if(S.phase==="card"||S.phase==="result"){
    const c=S.card,pf=PF[c.p],done=S.phase==="result";
    h+=`<div class="drow">${dieHTML(S.roll)}<b style="font-size:18px">${D("gewuerfelt")} ${S.roll}</b></div>`;
    h+=`<div class="qcard"><div class="lbl">${D("fall")}${tl(U.fall.slice(1))}</div><div class="sit" style="font-size:19px;font-weight:600">${esc(c.c)}</div>${tl(c.ct)}</div>`;
    h+=`<h4>${T("f1")}</h4><div class="opts">`;
    S.opts.forEach(k=>{
      let cls="opt";
      if(done){if(k===c.p)cls+=" right";else if(k===S.a1)cls+=" wrong";}
      else if(S.a1===k)cls+=" sel";
      h+=`<button class="${cls}" data-a1="${k}" ${done?"disabled":""}>${pfName(k)}${tl(PF[k].t)}</button>`;
    });
    h+=`</div><h4>${T("f2")}</h4><div class="opts">`;
    [[1,"ja"],[0,"nein"]].forEach(([v,k])=>{
      let cls="opt";
      if(done){if(v===c.ok)cls+=" right";else if(v===S.a2)cls+=" wrong";}
      else if(S.a2===v)cls+=" sel";
      h+=`<button class="${cls}" data-a2="${v}" ${done?"disabled":""}>${v?"✅":"⛔"} ${D(k)}${tl(U[k].slice(1))}</button>`;
    });
    h+=`</div>`;
    if(!done){
      const ready=S.a1!==null&&S.a2!==null;
      h+=`<div style="margin-top:14px"><button class="btn gold" id="solveBtn" ${ready?"":"disabled"}>${D("aufloesen")}</button>${ready?"":`<span class="hint" style="margin-left:10px">${D("waehle")}</span>`}</div>`;
    } else {
      const r1=S.a1===c.p,r2=S.a2===c.ok,steps=(r1?S.roll:0)+(r2?1:0);
      h+=`<div class="res"><p>① <span class="${r1?"okc":"badc"}">${r1?"✔ "+D("richtig"):"✘ "+D("falsch")}</span> &nbsp; ② <span class="${r2?"okc":"badc"}">${r2?"✔ "+D("richtig"):"✘ "+D("falsch")}</span></p>`;
      h+=`<p><b>${D("loesung")}: ${pf.n}</b> (${pf.g})${tl(pf.t)}</p>`;
      h+=`<p>${D("werpf")} <b>${whoTag(c.p)}</b>${tl([U.werpf[1]+" "+(pf.w?U.betrieb[1]:U.azubi[1])])}</p>`;
      h+=`<p>${D("warum")} ${esc(c.e)}${tl(c.et)}</p></div>`;
      h+=`<div class="move">${steps?`➜ ${steps} ${D(steps===1?"vor1":"vor")}`:D("stehen")}${steps?tl(U[steps===1?"vor1":"vor"].slice(1).map(s=>steps+" "+s)):tl(U.stehen.slice(1))}</div>`;
      h+=`<button class="btn" id="moveBtn">${steps?D("ziehen"):D("weiter")}</button>`;
    }
  } else if(S.phase==="wunsch"||S.phase==="wresult"){
    const w=S.wcard,done=S.phase==="wresult";
    h+=`<div class="qcard"><div class="lbl">${D("rfkarte")}${tl(U.rfkarte.slice(1))}</div><div class="sit">${esc(w.s)}</div>${tl(w.st)}</div><h4>${T("passt")}</h4><div class="opts one">`;
    w.o.forEach((o,i)=>{
      let cls="opt";
      if(done){if(i===w.r)cls+=" right";else if(i===S.wa)cls+=" wrong";}
      h+=`<button class="${cls}" data-w="${i}" ${done?"disabled":""}>${esc(o[0])}${tl(o[1])}</button>`;
    });
    h+=`</div>`;
    if(done){
      const ok=S.wa===w.r,pf=PF[w.p];
      h+=`<div class="res"><p><b>${pf.n}</b> (${pf.g}) – ${whoTag(w.p)}${tl(pf.t)}</p></div>`;
      h+=`<div class="move">${ok?D("w_ok"):D("w_bad")}${tl(U[ok?"w_ok":"w_bad"].slice(1))}</div><button class="btn" id="wBtn">${ok?D("ziehen"):D("weiter")}</button>`;
    }
  } else if(S.phase==="next"){
    if(S.msgk)h+=`<div class="spec">${msgHTML()}</div>`;
    const nx=S.players[(S.cur+1)%S.players.length];
    h+=`<div style="margin-top:14px"><button class="btn" id="nextBtn">${D("naechste")} ${esc(nx.name)}</button></div>`;
  } else if(S.phase==="busy"){
    if(S.msgk)h+=`<div class="spec">${msgHTML()}</div>`;
  }
  return h+`</div>`;
}

function renderGame(){
  main.innerHTML=`<div class="game"><div>${renderBoard()}</div><div id="pan">${renderPanel()}</div></div>`;
  bindPanel();
}
function refreshPanel(){$("pan").innerHTML=renderPanel();bindPanel();if(canAct())sync();}
function refreshBoardOnly(){const g=main.querySelector(".game>div");if(g)g.innerHTML=renderBoard();if(canAct())sync();}

function bindPanel(){
  const b=id=>$(id);
  if(!canAct())return;
  if(b("rollBtn"))b("rollBtn").onclick=doRoll;
  main.querySelectorAll("[data-a1]").forEach(x=>x.onclick=()=>{S.a1=x.dataset.a1;refreshPanel();});
  main.querySelectorAll("[data-a2]").forEach(x=>x.onclick=()=>{S.a2=+x.dataset.a2;refreshPanel();});
  if(b("solveBtn"))b("solveBtn").onclick=()=>{S.phase="result";refreshPanel();};
  if(b("moveBtn"))b("moveBtn").onclick=()=>{
    const c=S.card,steps=(S.a1===c.p?S.roll:0)+(S.a2===c.ok?1:0);
    if(!steps){toNext("");return;}
    S.phase="busy";S.msgk="";refreshPanel();
    moveBy(steps,afterLand);
  };
  main.querySelectorAll("[data-w]").forEach(x=>x.onclick=()=>{S.wa=+x.dataset.w;S.phase="wresult";refreshPanel();});
  if(b("wBtn"))b("wBtn").onclick=()=>{
    if(S.wa===S.wcard.r){S.phase="busy";S.msgk="";refreshPanel();moveBy(2,()=>{if(!checkWin())toNext("");});}
    else toNext("");
  };
  if(b("nextBtn"))b("nextBtn").onclick=()=>{S.cur=(S.cur+1)%S.players.length;S.phase="roll";S.msgk="";render();sync();};
}

function doRoll(){
  if(S.busy)return;S.busy=true;
  let n=0;const btn=$("rollBtn");btn.disabled=true;
  const it=setInterval(()=>{
    S.roll=1+Math.floor(Math.random()*6);
    const d=$("die");if(d)d.outerHTML=dieHTML(S.roll,true);
    if(++n>=11){clearInterval(it);S.busy=false;S.card=draw();S.a1=null;S.a2=null;S.phase="card";refreshPanel();}
  },80);
}

function moveBy(steps,done){
  const p=S.players[S.cur];const dir=steps>0?1:-1;let left=Math.abs(steps);
  const step=()=>{
    if(left===0||(dir>0&&p.pos>=GOAL)||(dir<0&&p.pos<=0)){done();return;}
    p.pos+=dir;left--;refreshBoardOnly();
    const t=$("tok"+S.cur);if(t){t.classList.add("hop");setTimeout(()=>t.classList.remove("hop"),180);}
    setTimeout(step,300);
  };
  setTimeout(step,150);
}

function afterLand(){
  if(checkWin())return;
  const p=S.players[S.cur],t=FT[p.pos];
  if(t==="p"){
    S.phase="busy";S.msgk="p";refreshPanel();
    setTimeout(()=>moveBy(2,()=>{if(!checkWin())toNext("p");}),900);
  } else if(t==="g"){
    S.phase="busy";S.msgk="g";refreshPanel();
    setTimeout(()=>moveBy(-2,()=>toNext("g")),900);
  } else if(t==="w"){
    S.wcard=drawW();S.wa=null;S.phase="wunsch";refreshPanel();
  } else toNext("");
}
function toNext(k){S.msgk=k;S.phase="next";refreshPanel();refreshBoardOnly();}

function checkWin(){
  const p=S.players[S.cur];
  if(p.pos<GOAL)return false;
  p.pos=GOAL;S.won=true;refreshBoardOnly();sync();showWin();return true;
}
function showWin(){
  winShown=true;
  const p=S.players[S.cur];
  const rank=S.players.map((q,i)=>({...q,i})).sort((a,b)=>(a.i===S.cur?-1:b.i===S.cur?1:b.pos-a.pos));
  let h=`<div class="trophy">🎓🎉</div><h2>${esc(p.name)} ${D("feierabend")}</h2>${tl(U.feierabend.slice(1).map(s=>p.name+" "+s))}<div class="rank">`;
  rank.forEach((q,k)=>{h+=`<div><b style="width:70px">${k+1}. ${D("platz")}</b><span class="dot" style="background:${q.color};width:28px;height:28px">${q.i+1}</span><span style="flex:1">${esc(q.name)}</span><span>${D("feld")} ${q.pos}</span></div>`;});
  h+=`</div><button class="big" id="again">${T("nochmal")}</button><button class="big navy" id="newnames">${ON?T("ende"):T("neuenamen")}</button>`;
  $("wincard").innerHTML=h;$("win").style.display="flex";
  $("again").onclick=()=>{cfStop=true;startGame();};
  $("newnames").onclick=()=>{if(ON){leaveRoom();return;}cfStop=true;$("win").style.display="none";S.screen="names";render();};
  confetti();
}

/* ---------- Konfetti ---------- */
let cfStop=false;
function confetti(){
  cfStop=false;
  const c=$("cf");c.style.display="block";const x=c.getContext("2d");
  let W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#b8901c","#13275a","#a32626","#2d6b3a","#e7c35a","#22508f","#f28c28","#d94f8c","#3fb6a8"];
  const P=[];
  for(let i=0;i<360;i++)P.push({x:Math.random()*W,y:-Math.random()*H*1.3,w:6+Math.random()*8,h:9+Math.random()*10,vy:2.2+Math.random()*3.8,vx:-1.5+Math.random()*3,r:Math.random()*6.28,vr:-.22+Math.random()*.44,c:cols[i%cols.length],s:Math.random()*6.28,round:Math.random()<.25});
  const t0=performance.now();
  function f(t){
    if(cfStop){x.clearRect(0,0,W,H);c.style.display="none";return;}
    x.clearRect(0,0,W,H);let alive=false;
    for(const p of P){
      p.y+=p.vy;p.x+=p.vx+Math.sin(t/380+p.s)*1.3;p.r+=p.vr;
      if(t-t0<5000&&p.y>H+20){p.y=-20;p.x=Math.random()*W;}
      if(p.y<H+20)alive=true;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,6.28);x.fill();}
      else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.max(.15,Math.abs(Math.cos(p.r*1.3))));
      x.restore();
    }
    if(alive)requestAnimationFrame(f);else c.style.display="none";
  }
  requestAnimationFrame(f);
}

/* ---------- Online-Modus: jeder am eigenen Gerät ---------- */
let ON=false,ROOM=null,net=null,isHost=false,conn=0,modeOnline=false,localRules=false,hostSub=false,joinName="",draftName="",winShown=false;
const idKey="ps_id"+(params.get("t")||"");
let myId=store(idKey);if(!myId){myId="p"+rnd(9);store(idKey,myId);}
const canAct=()=>!ON||(!!S.players[S.cur]&&S.players[S.cur].id===myId);
const seated=()=>ON&&S.players.some(p=>p.id===myId);
function tli(a){return lang==="de"||!a||!a[LI[lang]+1]?"":`<span class="tl" style="color:inherit;opacity:.85" lang="${lang}" dir="${lang==="ar"?"rtl":"ltr"}">${esc(a[LI[lang]+1])}</span>`;}
function msgHTML(){
  if(S.msgk==="p")return U.p_msg[0]+tl(U.p_msg.slice(1));
  if(S.msgk==="g")return U.g_msg[0]+tl(U.g_msg.slice(1))+`<div class="hint">${U.g_why[0]}${tl(U.g_why.slice(1))}</div>`;
  return "";
}
function roBanner(){
  if(!ON||S.screen!=="game"||!S.players[S.cur])return "";
  if(canAct())return `<div class="rob me">🎲 ${D("duamzug")}${tl(U.duamzug.slice(1))}</div>`;
  const p=S.players[S.cur];
  return `<div class="rob">⏳ ${esc(p.name)} ${D("zuschauen")}${tl(U.zuschauen.slice(1).map(x=>p.name+" "+x))}</div>`;
}
function joinUrl(){return location.protocol.startsWith("http")?location.origin+location.pathname+"?r="+ROOM+(BR?"&broker="+encodeURIComponent(BR):""):"";}
function pubNow(){if(ON&&net)net.pub(ROOM+"/st",{k:"st",seq:S.seq,S:S},true);}
function sync(){if(!ON||!net)return;S.seq=(S.seq||0)+1;pubNow();}
function modeToggle(){
  return `<div class="cnt" style="grid-template-columns:1fr 1fr;margin-top:0"><button data-mode="0" class="${modeOnline?"":"on"}">${D("modelocal")}${tli(U.modelocal)}</button><button data-mode="1" class="${modeOnline?"on":""}">${D("modeonline")}${tli(U.modeonline)}</button></div>`;
}
function bindMode(){main.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{saveNames();modeOnline=b.dataset.mode==="1";renderNames();});}
function renderOnlineSetup(){
  const nm=store("ps_name")||"";
  main.innerHTML=`<div class="card center" style="max-width:760px">${modeToggle()}<h2>${D("modeonline")}</h2>${tl(U.modeonline.slice(1))}<p class="intro">${D("raumhint")}${tl(U.raumhint.slice(1))}</p>
   <div class="nrow"><div class="dot" style="background:${COLORS[0]}">1</div><input id="hostName" maxlength="18" placeholder="${D("deinname")}" value="${esc(nm)}" autocomplete="off"></div>
   <button class="big" id="mkRoom" disabled>${T("raumneu")}</button></div>`;
  bindMode();
  const chk=()=>{$("mkRoom").disabled=!$("hostName").value.trim();};
  $("hostName").oninput=chk;chk();
  $("hostName").onkeydown=e=>{if(e.key==="Enter"&&!$("mkRoom").disabled)$("mkRoom").click();};
  $("mkRoom").onclick=()=>createRoom($("hostName").value.trim());
  $("hostName").focus();
}
function connect(){
  net=new Net(onNet,(c)=>{const was=conn;conn=(c&&c.up)||0;renderHead();if(conn&&!was&&isHost&&S.screen==="lobby")pubNow();});
  net.sub(ROOM+"/st");
  if(isHost)subHost();
}
function subHost(){if(hostSub||!net)return;hostSub=true;net.sub(ROOM+"/in");}
function createRoom(name){
  ON=true;isHost=true;ROOM=codeGen();
  store("ps_name",name);
  S.screen="lobby";S.hostId=myId;S.won=false;S.seq=0;S.players=[{id:myId,name,pos:0,color:COLORS[0]}];
  connect();
  const u=joinUrl();if(u)try{history.replaceState(null,"",u);}catch(e){}
  sync();render();
}
function joinRoom(code){
  ON=true;isHost=false;ROOM=code;S.screen="join";S.players=[];
  draftName=store("ps_name")||"";
  connect();render();
}
function leaveRoom(){location.href=location.pathname+(BR?"?broker="+encodeURIComponent(BR):"");}
function onNet(t,p){
  if(!p)return;
  if(t===ROOM+"/st"&&p.k==="st"&&p.S){
    if(p.seq<=(S.seq||0)&&S.screen!=="join")return;
    S=p.S;S.seq=p.seq;S.busy=false;
    if(S.hostId===myId){isHost=true;subHost();}
    render();afterRemote();
  } else if(t===ROOM+"/in"&&isHost&&p.k==="hi"){
    const id=clean(p.id,16),n=clean(p.n,18);
    if(!id||!n||S.screen!=="lobby"||S.players.some(q=>q.id===id)||S.players.length>=4)return;
    S.players.push({id,name:n,pos:0,color:COLORS[S.players.length]});
    sync();render();
  }
}
function afterRemote(){
  if(S.won&&S.screen==="game"){if(!winShown)showWin();}
  else{winShown=false;cfStop=true;$("win").style.display="none";}
}
function renderLobby(){
  const url=joinUrl(),inRoom=S.screen==="lobby";
  let h=`<div class="card center" style="max-width:860px"><h2>${D("raumcode")}: <span style="letter-spacing:.2em">${ROOM}</span></h2>${tl(U.raumcode.slice(1).map(x=>x+": "+ROOM))}<div class="lob">`;
  if(inRoom)h+=`<div><canvas id="qr" width="260" height="260"></canvas></div>`;
  h+=`<div style="flex:1;min-width:240px">`;
  if(inRoom)h+=`<p>${D("scanhint")}${tl(U.scanhint.slice(1))}</p><h4>${T("inraum")} (${S.players.length}/4)</h4>`;
  else h+=`<p>${D("verbinde")}${tl(U.verbinde.slice(1))}</p>`;
  S.players.forEach((p,i)=>{h+=`<div class="nrow"><div class="dot" style="background:${p.color}">${i+1}</div><b style="font-size:19px">${esc(p.name)}${p.id===myId?" ✓":""}</b></div>`;});
  h+=`</div></div>`;
  if(inRoom&&!seated()){
    h+=`<p>${D("beitritttxt")}${tl(U.beitritttxt.slice(1))}</p><div class="nrow"><input id="jn" maxlength="18" placeholder="${D("deinname")}" value="${esc(draftName)}" autocomplete="off"></div><button class="big" id="jbtn" disabled>${T("beitreten")}</button>`;
  } else if(inRoom&&isHost){
    h+=`<button class="big" id="startOnline" ${S.players.length>=2?"":"disabled"}>${T("start")}</button>${S.players.length>=2?"":`<p class="hint">${D("mind2")}${tl(U.mind2.slice(1))}</p>`}`;
  } else if(inRoom){
    h+=`<p class="hint">${T("wartehost")}</p>`;
  }
  h+=`</div>`;
  main.innerHTML=h;
  if($("qr"))drawQR($("qr"),url);
  if($("startOnline"))$("startOnline").onclick=()=>{if(S.players.length>=2)startGame();};
  if($("jn")){
    const chk=()=>{draftName=$("jn").value;$("jbtn").disabled=!draftName.trim();};
    $("jn").oninput=chk;chk();
    $("jn").onkeydown=e=>{if(e.key==="Enter"&&!$("jbtn").disabled)$("jbtn").click();};
    $("jbtn").onclick=()=>{joinName=clean(draftName,18);if(!joinName)return;store("ps_name",joinName);sendHi();};
    if(draftName){$("jn").focus();const l=$("jn").value.length;try{$("jn").setSelectionRange(l,l);}catch(e){}}
  }
}
function sendHi(){if(ON&&!isHost&&joinName&&net&&S.screen==="lobby"&&!seated())net.pub(ROOM+"/in",{k:"hi",id:myId,n:joinName});}
setInterval(sendHi,2500);
setInterval(()=>{if(isHost&&S.screen==="lobby")pubNow();},6000);
function boot(){
  const r=(params.get("r")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  if(r)joinRoom(r);else render();
}

addEventListener("resize",()=>{const c=$("cf");if(c.style.display==="block"){c.width=innerWidth;c.height=innerHeight;}});

function render(){
  renderHead();
  if(localRules)renderRules();
  else if(S.screen==="lobby"||S.screen==="join")renderLobby();
  else if(S.screen==="rules")renderRules();
  else if(S.screen==="names")renderNames();
  else renderGame();
}
boot();
</script>
