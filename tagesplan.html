<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unser Plan für heute</title>
<style>
@font-face{font-family:"Noto Sans Ethiopic";font-weight:400;src:url(i18n/fonts/noto-sans-ethiopic-ethiopic-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Noto Sans Ethiopic";font-weight:700;src:url(i18n/fonts/noto-sans-ethiopic-ethiopic-700-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Noto Sans Arabic";font-weight:400;src:url(i18n/fonts/noto-sans-arabic-arabic-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Noto Sans Arabic";font-weight:700;src:url(i18n/fonts/noto-sans-arabic-arabic-700-normal.woff2) format("woff2");font-display:swap}
:root{--bg:#f3f5fa;--card:#fff;--ink:#14213d;--mut:#4a5873;--line:#d5dcea;--pri:#1f4fbf;--priink:#fff;--acc:#e8710a;--accbg:#fff3e3;--ok:#14894c;--fs:1}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--card:#192030;--ink:#eef2fb;--mut:#a9b6cf;--line:#2e3a52;--pri:#7ea4f5;--priink:#0b1020;--acc:#ffb05c;--accbg:#2f2415;--ok:#4cd08a}}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;font-size:14px}
.top .sp{flex:1}
.top button,.top select,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.top button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.top button:hover,.btn:hover{border-color:var(--pri)}
.tabs{display:flex;gap:6px}
main{max-width:1500px;margin:0 auto;padding:18px 22px 60px}
.slide{display:none}.slide.on{display:block}
h1{font-size:clamp(2rem,4.4vw,4.2rem);line-height:1.1;margin:.1em 0 .15em;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:clamp(1rem,1.5vw,1.5rem);margin:0 0 .6em}
.meta{color:var(--mut);font-size:clamp(.95rem,1.4vw,1.35rem);margin:.2em 0 .8em}
.leit{background:var(--accbg);border:3px solid var(--acc);border-radius:16px;padding:.6em .9em;margin:.4em 0 .9em;font-size:clamp(1.25rem,2.4vw,2.4rem);font-weight:600;line-height:1.3}
.leit b{color:var(--acc);margin-inline-end:.35em}
.leit .tt{display:block;font-size:.6em;font-weight:400;color:var(--mut);margin-top:.3em}
.auf{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:a}
.auf.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.auf li{counter-increment:a;display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.auf li::before{content:counter(a);flex:none;width:2.3em;height:2.3em;border-radius:50%;background:var(--pri);color:var(--priink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.1rem,1.8vw,1.8rem)}
.auf .lab{flex:1;min-width:0;font-size:clamp(1.15rem,2.2vw,2.2rem);font-weight:700;line-height:1.25;color:var(--pri);text-decoration:none;overflow-wrap:anywhere}
.auf a.lab:hover{text-decoration:underline}
.auf .lab small{display:block;font-size:.5em;font-weight:400;color:var(--mut)}
.auf .qr{flex:none;width:clamp(86px,9vw,150px);height:auto;aspect-ratio:1;image-rendering:pixelated;background:#fff;border:6px solid #fff;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.chk{flex:none;width:clamp(46px,4.4vw,66px);height:clamp(46px,4.4vw,66px);border-radius:14px;border:3px solid var(--line);background:var(--card);color:transparent;font-size:clamp(1.5rem,2.6vw,2.4rem);line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.chk:hover{border-color:var(--ok)}
.chk[aria-checked=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.auf li.done{border-color:var(--ok)}.auf li.done .lab{opacity:.6}.auf li.done .qr{opacity:.45}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 12px;font-size:clamp(1rem,1.6vw,1.5rem);font-weight:700}
.prog .pb{flex:1;min-width:140px;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.prog small{flex-basis:100%;font-weight:400;color:var(--mut);font-size:.8em}
.hint{color:var(--mut);font-size:.95rem;margin:.5em 0 0}
.own{margin-top:1em;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:.7em 1em;font-size:clamp(1.05rem,1.8vw,1.8rem);white-space:pre-wrap}
.slide{counter-reset:k}
.kp{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:12px}
.kp li{counter-increment:k;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.kp li::before{content:counter(k);grid-row:1/3;width:2.2em;height:2.2em;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.1rem,1.8vw,1.8rem)}
.kp .de{font-size:clamp(1.2rem,2.3vw,2.3rem);font-weight:700;line-height:1.25}
.kp .tr{font-size:clamp(1.05rem,1.9vw,1.9rem);color:var(--mut);line-height:1.3}
.kp.own{counter-reset:none}
.kp li.hid{visibility:hidden}
.kp li.new{outline:4px solid var(--acc);outline-offset:2px}
.modh{font-size:clamp(1.1rem,1.8vw,1.7rem);margin:1em 0 .4em;color:var(--mut);font-weight:700}
.empty{color:var(--mut);font-size:1.2rem;padding:1em 0}
[dir=rtl]{text-align:right}
.navbar{display:flex;gap:10px;justify-content:space-between;margin-top:1.2em}
.navbar button{font:inherit;font-size:1.1rem;border:2px solid var(--pri);background:var(--card);color:var(--pri);border-radius:12px;padding:.6em 1.2em;cursor:pointer;font-weight:700;min-height:48px}
#ov{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.9);display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#ov .bx{background:#fff;color:#111;border-radius:18px;padding:20px 24px;text-align:center;max-width:96vw}
#ov canvas{width:min(70vh,84vw,640px);height:auto;aspect-ratio:1;display:block;margin:0 auto 10px;image-rendering:pixelated}
#ov h2{margin:0 0 8px;font-size:clamp(1.2rem,2.6vw,2rem)}
#ov p{margin:4px auto;font-size:12px;color:#444;word-break:break-all;max-width:560px}
#ov button{margin-top:10px;padding:10px 26px;font:700 16px system-ui;border:0;border-radius:10px;background:#13275a;color:#fff;cursor:pointer}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14213d;color:#fff;padding:9px 16px;border-radius:99px;display:none;z-index:60}
.err{background:#fde4e3;border:2px solid #c9302c;color:#7a1412;border-radius:12px;padding:12px 14px;margin:1em 0}
@media(max-width:700px){main{padding:12px 12px 50px}.auf li{flex-wrap:wrap}.auf .qr{width:96px}.top .hide-sm{display:none}}
@media print{.top,.navbar,.hint,#toast,#ov{display:none!important}.slide{display:block!important;break-after:page}.kp li.hid{visibility:visible}body{background:#fff}}
@media(prefers-reduced-motion:no-preference){.kp li{transition:opacity .2s}}
</style>
</head>
<body>
<div class="top" id="top">
 <div class="tabs" id="tabs"></div>
 <span class="sp"></span>
 <button id="bMinus" title="Schrift kleiner" aria-label="Schrift kleiner">A−</button>
 <button id="bPlus" title="Schrift größer" aria-label="Schrift größer">A+</button>
 <select id="lang" aria-label="Sprache / Language"></select>
 <button id="bQr" class="hide-sm">📱 QR</button>
 <button id="bCopy" class="hide-sm">🔗 Link</button>
 <button id="bShare">⤴ Teilen</button>
 <button id="bFull" class="hide-sm" title="Vollbild">⛶</button>
</div>
<main id="app"></main>
<div id="ov"><div class="bx"><h2 id="ovT"></h2><canvas id="ovC" width="560" height="560"></canvas><p id="ovU"></p><button id="ovX" type="button">OK</button></div></div>
<div id="toast"></div>
<script src="uebersicht_qr.js"></script>
<script>
'use strict';
/* Tagesplan: Smartboard-Seite 1 (Plan mit Aufträgen und QR-Codes) und Seite 2 (Key Learning Points).
   Der ganze Plan steckt im Link (#z=… komprimiert oder #p=… unkomprimiert) – es braucht keinen Server.
   Plan = {v:1, d:Datum, k:Klasse, h:Kopfzeile, q:Leitfrage, x:eigener Text, m:[Modul-Schlüssel], kx:[eigene Punkte], i:[[Bezeichnung, Adresse], …]} */
const LANGS=[['de','Deutsch'],['vi','Tiếng Việt'],['ar','العربية'],['uk','Українська'],['ti','ትግርኛ'],['pt','Português'],['es','Español'],['ru','Русский'],['tr','Türkçe']];
const RTL={ar:1};
/* Oberflächentexte (maschinell übersetzt; es gilt das Deutsche) */
const UI={
 de:{done:'Erledigt',prog:'{n} von {m} erledigt',all:'Alles erledigt! 🎉',plan:'Unser Plan für heute:',leit:'Leitfrage:',kp:'Key Learning Points',take:'Das nehmen wir mit:',tab1:'Plan',tab2:'Key Learning Points',hint:'Tippe auf einen Auftrag oder scanne den QR-Code mit dem Handy.',next:'Weiter',back:'Zurück',nodata:'Zu diesem Plan gibt es keine Key Learning Points.',tr:'Übersetzung maschinell erstellt – es gilt das Deutsche.'},
 vi:{done:'Đã xong',prog:'Đã xong {n}/{m}',all:'Xong hết rồi! 🎉',plan:'Kế hoạch của chúng ta hôm nay:',leit:'Câu hỏi chủ đạo:',kp:'Key Learning Points',take:'Điều chúng ta mang theo:',tab1:'Kế hoạch',tab2:'Key Learning Points',hint:'Chạm vào một nhiệm vụ hoặc quét mã QR bằng điện thoại.',next:'Tiếp',back:'Quay lại',nodata:'Kế hoạch này chưa có Key Learning Points.',tr:'Bản dịch tự động – bản tiếng Đức là bản chuẩn.'},
 ar:{done:'تم',prog:'تم إنجاز {n} من {m}',all:'تم إنجاز كل شيء! 🎉',plan:'خطتنا لليوم:',leit:'السؤال المحوري:',kp:'Key Learning Points',take:'ما نأخذه معنا:',tab1:'الخطة',tab2:'Key Learning Points',hint:'اضغط على مهمة أو امسح رمز QR بالهاتف.',next:'التالي',back:'السابق',nodata:'لا توجد نقاط تعلم رئيسية لهذه الخطة.',tr:'ترجمة آلية – النص الألماني هو المعتمد.'},
 uk:{done:'Готово',prog:'Виконано {n} з {m}',all:'Усе виконано! 🎉',plan:'Наш план на сьогодні:',leit:'Ключове питання:',kp:'Key Learning Points',take:'Що ми беремо з собою:',tab1:'План',tab2:'Key Learning Points',hint:'Торкніться завдання або відскануйте QR-код телефоном.',next:'Далі',back:'Назад',nodata:'Для цього плану немає ключових пунктів.',tr:'Машинний переклад – чинною є німецька версія.'},
 ti:{done:'ተወዲኡ',prog:'{n} ካብ {m} ተወዲኡ',all:'ኩሉ ተወዲኡ! 🎉',plan:'ናይ ሎሚ መደብና፡',leit:'መራሒ ሕቶ፡',kp:'Key Learning Points',take:'እዚ ንወስዶ፡',tab1:'መደብ',tab2:'Key Learning Points',hint:'ኣብ ዕዮ ጠውቑ ወይ QR-ኮድ ብተሌፎን ስካን ግበሩ።',next:'ቀጻሊ',back:'ተመለስ',nodata:'ንዚ መደብ Key Learning Points የለን።',tr:'ብማሽን ዝተተርጐመ – ጀርመንኛ እዩ ዝሰርሕ።'},
 pt:{done:'Feito',prog:'{n} de {m} concluídos',all:'Tudo feito! 🎉',plan:'O nosso plano para hoje:',leit:'Pergunta orientadora:',kp:'Key Learning Points',take:'O que levamos connosco:',tab1:'Plano',tab2:'Key Learning Points',hint:'Toque numa tarefa ou leia o código QR com o telemóvel.',next:'Seguinte',back:'Voltar',nodata:'Este plano não tem Key Learning Points.',tr:'Tradução automática – vale a versão alemã.'},
 es:{done:'Hecho',prog:'{n} de {m} hechos',all:'¡Todo hecho! 🎉',plan:'Nuestro plan para hoy:',leit:'Pregunta guía:',kp:'Key Learning Points',take:'Lo que nos llevamos:',tab1:'Plan',tab2:'Key Learning Points',hint:'Toca una tarea o escanea el código QR con el móvil.',next:'Siguiente',back:'Atrás',nodata:'Este plan no tiene Key Learning Points.',tr:'Traducción automática – vale la versión alemana.'},
 ru:{done:'Готово',prog:'Выполнено {n} из {m}',all:'Всё выполнено! 🎉',plan:'Наш план на сегодня:',leit:'Ключевой вопрос:',kp:'Key Learning Points',take:'Что мы забираем с собой:',tab1:'План',tab2:'Key Learning Points',hint:'Нажмите на задание или отсканируйте QR-код телефоном.',next:'Далее',back:'Назад',nodata:'Для этого плана нет ключевых пунктов.',tr:'Машинный перевод – действует немецкий текст.'},
 tr:{done:'Tamam',prog:'{n}/{m} tamamlandı',all:'Hepsi tamam! 🎉',plan:'Bugünkü planımız:',leit:'Yol gösterici soru:',kp:'Key Learning Points',take:'Yanımıza aldıklarımız:',tab1:'Plan',tab2:'Key Learning Points',hint:'Bir göreve dokun ya da QR kodunu telefonla tara.',next:'İleri',back:'Geri',nodata:'Bu plan için Key Learning Points yok.',tr:'Makine çevirisi – geçerli olan Almanca metindir.'}
};
const $=id=>document.getElementById(id);
const LSK='ds_lang',ZK='tp_zoom';
let PLAN=null,LANG='de',PAGE=0,KP=[],REV=false,SHOWN=0,DONE=new Set();
/* Abhaken: bleibt auf dem Gerät des Schülers (localStorage), je Tag und Klasse */
const DK=()=>'tp_done:'+(PLAN.d||'')+'|'+(PLAN.k||'')+'|'+(PLAN.q||'').slice(0,30);
const itemKey=it=>(it[1]||'')+'|'+it[0];
function loadDone(){try{DONE=new Set(JSON.parse(lsGet(DK())||'[]'));}catch(e){DONE=new Set();}}
function saveDone(){lsSet(DK(),JSON.stringify([...DONE]));}
function fillProg(box,total){
 const n=[...document.querySelectorAll('.auf li.done')].length;
 box.querySelector('i').style.width=(total?n*100/total:0)+'%';
 const f=(l,k)=>((UI[l]||UI.de)[k]).replace('{n}',n).replace('{m}',total);
 const main=box.querySelector('.pt'),sm=box.querySelector('small');
 main.textContent=n===total?UI.de.all:f('de','prog');
 if(LANG!=='de'){sm.textContent=n===total?T('all'):f(LANG,'prog');sm.dir=RTL[LANG]?'rtl':'ltr';sm.style.display='';}else sm.style.display='none';
}
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const T=k=>(UI[LANG]&&UI[LANG][k])||UI.de[k]||'';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200);}

/* ---------- Link ↔ Plan ---------- */
const b64u=bytes=>{let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;};
async function pipe(bytes,stream){const r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer());}
async function decodePlan(h){
 h=(h||'').replace(/^#/,'');
 const m=/^([zp])=(.+)$/.exec(h);if(!m)return null;
 let bytes=unb64u(m[2]);
 if(m[1]==='z'){if(typeof DecompressionStream==='undefined')throw new Error('Dein Browser ist zu alt für diesen Link. Bitte aktualisieren.');bytes=await pipe(bytes,new DecompressionStream('deflate-raw'));}
 return JSON.parse(new TextDecoder().decode(bytes));
}
const safeUrl=u=>{u=(u||'').trim();if(!u)return '';try{const x=new URL(u,location.href);return /^(https?:|file:)$/.test(x.protocol)?x.href:'';}catch(e){return '';}};

/* ---------- Key Learning Points laden ---------- */
window.TPD={D:{},add(pid,o){Object.keys(o).forEach(c=>this.D[pid+'.'+c]=o[c]);}};
function loadPart(pid){return new Promise(res=>{if(TPD['_'+pid])return res();TPD['_'+pid]=1;const s=document.createElement('script');s.src='tagesplan_daten/'+encodeURIComponent(pid)+'.js';s.charset='utf-8';s.onload=s.onerror=()=>res();document.head.appendChild(s);});}
async function loadKp(){
 const mods=(PLAN.m||[]).filter(k=>/^[A-Za-z0-9-]+\.[A-Za-z0-9]+$/.test(k));
 await Promise.all([...new Set(mods.map(k=>k.split('.')[0]))].map(loadPart));
 KP=mods.map(k=>({k,d:TPD.D[k]})).filter(x=>x.d);
}

/* ---------- Darstellung ---------- */
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
function drawQr(cv,url){
 try{
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(url);q.make();
  const n=q.getModuleCount(),quiet=2,cell=Math.max(1,Math.floor(cv.width/(n+quiet*2))),off=Math.floor((cv.width-cell*n)/2),x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(off+c*cell,off+r*cell,cell,cell);
  return true;
 }catch(e){return false;}
}
function dateLine(){
 const p=PLAN;let s='';
 if(p.d&&/^\d{4}-\d{2}-\d{2}$/.test(p.d)){const [y,m,d]=p.d.split('-').map(Number),dt=new Date(y,m-1,d);s=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][dt.getDay()]+', '+String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.'+y;}
 return [s,p.k,p.h].filter(Boolean).join(' · ');
}
function transLine(){ /* übersetzter Modultitel unter der Leitfrage */
 if(LANG==='de')return '';
 return KP.map(x=>x.d.tt&&x.d.tt[LANG]).filter(Boolean).join(' · ');
}
function pagePlan(){
 const s=el('section','slide'+(PAGE===0?' on':''));s.id='s0';
 const h=el('h1',null,UI.de.plan);s.appendChild(h);
 if(LANG!=='de'){const t=el('p','sub',T('plan'));t.dir=RTL[LANG]?'rtl':'ltr';s.appendChild(t);}
 const dl=dateLine();if(dl)s.appendChild(el('p','meta',dl));
 if(PLAN.q){
  const l=el('div','leit');l.appendChild(el('b',null,UI.de.leit));l.appendChild(document.createTextNode(PLAN.q));
  const tl=transLine();if(tl){const t=el('span','tt',T('leit')+' '+tl);t.dir=RTL[LANG]?'rtl':'ltr';l.appendChild(t);}
  s.appendChild(l);
 }
 const items=(PLAN.i||[]).filter(x=>x&&x[0]);
 if(items.length){
  const pg=el('div','prog');const pb=el('div','pb');pb.appendChild(document.createElement('i'));pg.append(el('span','pt'),pb,el('small'));s.appendChild(pg);
  const ol=el('ol','auf'+(items.length>5?' two':''));
  items.forEach(it=>{
   const li=document.createElement('li'),u=safeUrl(it[1]);
   if(u){const a=el('a','lab',it[0]);a.href=u;a.target='_blank';a.rel='noopener';li.appendChild(a);const cv=el('canvas','qr');cv.width=cv.height=300;cv.setAttribute('role','img');cv.setAttribute('aria-label','QR-Code: '+it[0]);if(drawQr(cv,u))li.appendChild(cv);}
   else li.appendChild(el('span','lab',it[0]));
   const k=itemKey(it),cb=el('button','chk','✓');cb.type='button';cb.setAttribute('role','checkbox');cb.title=T('done');cb.setAttribute('aria-label',T('done')+': '+it[0]);
   const sync=()=>{const on=DONE.has(k);cb.setAttribute('aria-checked',on);li.classList.toggle('done',on);};
   cb.onclick=()=>{if(DONE.has(k))DONE.delete(k);else DONE.add(k);saveDone();sync();fillProg(pg,items.length);};
   li.appendChild(cb);sync();
   ol.appendChild(li);
  });
  s.appendChild(ol);fillProg(pg,items.length);
  if(items.some(x=>safeUrl(x[1]))){const hp=el('p','hint',UI.de.hint);s.appendChild(hp);if(LANG!=='de'){const t=el('p','hint',T('hint'));t.dir=RTL[LANG]?'rtl':'ltr';s.appendChild(t);}}
 }
 if(PLAN.x)s.appendChild(el('div','own',PLAN.x));
 return s;
}
function pageKp(){
 const s=el('section','slide'+(PAGE===1?' on':''));s.id='s1';
 s.appendChild(el('h1',null,UI.de.kp));
 const sub=el('p','sub',UI.de.take+(LANG!=='de'?'  ·  '+T('take'):''));s.appendChild(sub);
 let n=0;
 KP.forEach(x=>{
  if(KP.length>1||(PLAN.m||[]).length>1)s.appendChild(el('h2','modh',x.d.t));
  const ul=el('ol','kp');
  x.d.p.forEach(p=>{
   const li=el('li',REV&&n>=SHOWN?'hid':''),de=el('div','de',p.de),tr=p[LANG];
   li.appendChild(de);
   if(LANG!=='de'){const t=el('div','tr',tr||'');if(!tr)t.textContent='';t.dir=RTL[LANG]?'rtl':'ltr';t.lang=LANG;li.appendChild(t);}else li.style.gridTemplateRows='auto';
   li.dataset.n=n++;ul.appendChild(li);
  });
  s.appendChild(ul);
 });
 (PLAN.kx||[]).filter(Boolean).forEach(t=>{
  if(!s.querySelector('ol.kp.own')){const ul=el('ol','kp own');ul.dataset.own=1;s.appendChild(ul);}
  const ul=s.querySelector('ol.kp.own'),li=el('li',REV&&n>=SHOWN?'hid':''),de=el('div','de',t);li.appendChild(de);li.style.gridTemplateRows='auto';li.dataset.n=n++;ul.appendChild(li);
 });
 if(!n)s.appendChild(el('p','empty',T('nodata')));
 s.dataset.total=n;
 if(LANG!=='de'&&n)s.appendChild(el('p','hint',T('tr')));
 return s;
}
function render(){
 const app=$('app');app.textContent='';
 if(!PLAN){return;}
 app.appendChild(pagePlan());app.appendChild(pageKp());
 const nav=el('div','navbar');const b1=el('button',null,'◀ '+UI.de.back),b2=el('button',null,UI.de.next+' ▶');
 b1.onclick=()=>go(PAGE-1);b2.onclick=()=>go(PAGE+1);nav.append(b1,b2);app.appendChild(nav);
 document.documentElement.lang=LANG;
 /* Reiter */
 const tb=$('tabs');tb.textContent='';
 [['1 · '+UI.de.tab1,0],['2 · '+UI.de.tab2,1]].forEach(([t,i])=>{const b=el('button',PAGE===i?'on':'',t);b.onclick=()=>go(i);tb.appendChild(b);});
 if(PAGE===1){const b=el('button',REV?'on':'','👁 Nacheinander');b.title='Punkte nacheinander aufdecken (Leertaste / Tippen)';b.onclick=()=>{REV=!REV;SHOWN=REV?0:SHOWN;render();};tb.appendChild(b);}
 document.title=UI.de.plan.replace(/:$/,'')+(PLAN.d?' · '+PLAN.d:'')+(PLAN.k?' · '+PLAN.k:'');
}
function go(n){PAGE=Math.max(0,Math.min(1,n));render();window.scrollTo(0,0);}
function revealNext(){
 const s=$('s1');if(!s)return;const tot=+s.dataset.total||0;if(SHOWN<tot){SHOWN++;render();const li=document.querySelector('.kp li[data-n="'+(SHOWN-1)+'"]');if(li){li.classList.add('new');li.scrollIntoView({block:'nearest'});}}
}

/* ---------- Bedienung ---------- */
function fillLang(){const s=$('lang');s.textContent='';LANGS.forEach(([c,n])=>{const o=el('option',null,n);o.value=c;if(c===LANG)o.selected=true;s.appendChild(o);});}
function setLang(l){if(!UI[l])l='de';LANG=l;lsSet(LSK,l);fillLang();render();}
function setZoom(z){z=Math.max(.7,Math.min(2,z));document.documentElement.style.setProperty('--fs',z);lsSet(ZK,String(z));}
const zoom=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||1;
function showQr(){
 const u=location.href;$('ovT').textContent='📱 '+UI.de.plan;
 const cv=$('ovC');if(!drawQr(cv,u)){$('ovU').textContent='QR konnte nicht erzeugt werden (Link zu lang).';}else $('ovU').textContent=/^file:/.test(u)?'Hinweis: Die Datei ist nur lokal geöffnet – der Code funktioniert erst online.':u;
 $('ov').classList.add('on');
}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Link kopiert');}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Link kopiert');}catch(_){toast('Kopieren nicht möglich');}a.remove();}}
$('bMinus').onclick=()=>setZoom(zoom()-.1);$('bPlus').onclick=()=>setZoom(zoom()+.1);
$('lang').onchange=e=>setLang(e.target.value);
$('bQr').onclick=showQr;$('bCopy').onclick=()=>copy(location.href);
$('bShare').onclick=async()=>{const d={title:UI.de.plan,text:UI.de.plan+' '+dateLine(),url:location.href};if(navigator.share){try{await navigator.share(d);}catch(e){}}else copy(location.href);};
$('bFull').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen();};
$('ovX').onclick=()=>$('ov').classList.remove('on');$('ov').onclick=e=>{if(e.target.id==='ov')$('ov').classList.remove('on');};
document.addEventListener('keydown',e=>{
 if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key==='Escape')$('ov').classList.remove('on');
 else if(e.key==='ArrowRight'||e.key==='PageDown')go(PAGE+1);
 else if(e.key==='ArrowLeft'||e.key==='PageUp')go(PAGE-1);
 else if((e.key===' '||e.key==='Enter')&&PAGE===1&&REV){e.preventDefault();revealNext();}
});
document.addEventListener('click',e=>{if(PAGE===1&&REV&&e.target.closest&&e.target.closest('#s1')&&!e.target.closest('button'))revealNext();});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>80){go(PAGE+(dx<0?1:-1));}},{passive:true});
window.addEventListener('hashchange',()=>location.reload());

(async function init(){
 const z=parseFloat(lsGet(ZK));if(z)setZoom(z);
 const q=new URLSearchParams(location.search),ql=q.get('lang'),sl=lsGet(LSK);
 LANG=UI[ql]?ql:(UI[sl]?sl:'de');
 if(UI[ql])lsSet(LSK,ql);
 fillLang();
 try{PLAN=await decodePlan(location.hash);}catch(e){$('app').appendChild(el('div','err',String(e.message||e)));return;}
 if(!PLAN||typeof PLAN!=='object'){$('app').appendChild(el('div','err','Kein Plan im Link gefunden. Bitte den Plan im Stundenplan unter „🖥️ Tagesplan“ erstellen und den dort angezeigten Link benutzen.'));return;}
 if(q.get('seite')==='2')PAGE=1;
 loadDone();await loadKp();render();
})();
</script>
</body>
</html>
