<!DOCTYPE html>
<html lang="de">
<head>

<title>Lernfeld 4 – Waren präsentieren · Überblick V26/1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1b2d;font-family:"Segoe UI",system-ui,-apple-system,Arial,"Noto Sans Ethiopic","Kefa",sans-serif;color:#fff;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{--tz:1;width:min(100vw,177.78vh);height:min(56.25vw,100vh);position:relative;overflow:hidden;background:#13233b;font-size:calc(min(100vw,177.78vh)/100*var(--tz))}
.slide{position:absolute;inset:0;padding:4.5% 6% 9%;display:flex;flex-direction:column;overflow:auto;animation:fadein .7s ease both}

h1{font-size:5.2em;line-height:1.08;font-weight:800}
h2{font-size:3.3em;font-weight:800;line-height:1.1;margin-bottom:.45em}
.sub{font-size:2.1em;opacity:.9;margin-top:.5em;line-height:1.3}
.tag{display:inline-block;background:#ffb703;color:#13233b;font-weight:800;border-radius:2em;padding:.25em 1em;font-size:1.5em;margin-bottom:.7em;align-self:flex-start}
.tag .tr{color:#13233b;display:inline;margin-left:.5em;font-size:.85em}
.tr{display:block;color:#ffd166;font-size:.86em;font-weight:600;line-height:1.3;margin-top:.15em}
.tag .de,.tag .tr{display:inline}
.grid{display:grid;gap:1.6%;flex:1;min-height:0}
.card{background:rgba(255,255,255,.09);border:.15em solid rgba(255,255,255,.16);border-radius:1.2em;padding:1em 1.3em;display:flex;flex-direction:column;opacity:0;animation:up .6s ease forwards}
.card .ic{font-size:3.8em;line-height:1}
.card .nr{font-size:1.45em;font-weight:800;color:#ffb703;margin-top:.3em}
.card .nr .tr{color:#ffb703;display:inline;margin-left:.4em;font-size:.9em}
.card .tt{font-size:2.1em;font-weight:800;line-height:1.15;margin:.1em 0 .3em}
.card .tt .tr{font-size:.75em}
.card .tx{font-size:1.55em;line-height:1.3;opacity:.95}
.card .tx .tr{font-size:.92em}
@keyframes up{from{opacity:0;transform:translateY(2em)}to{opacity:1;transform:none}}
.box{background:rgba(255,255,255,.09);border-radius:1.2em;padding:1.1em 1.4em;font-size:1.9em;line-height:1.35;margin-bottom:.6em;opacity:0;animation:up .6s ease forwards}
.box .tr{font-size:.82em}
.row{display:flex;gap:3%;flex:1;min-height:0;align-items:center}
.row>*{flex:1;min-width:0}
svg{max-width:100%;max-height:100%}

@keyframes blink{50%{opacity:.2}}
.qrbox{background:#fff;color:#13233b;border-radius:1.2em;padding:1em;text-align:center;font-weight:700;font-size:1.5em;line-height:1.25}
.qrbox svg{width:100%;height:auto;display:block;margin-bottom:.4em}
.qrbox .tr{color:#1d4e89}
.qrbox small{display:block;font-weight:600;font-size:.7em;opacity:.8;word-break:break-all;margin-top:.3em}
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:.45em 1em}
.ov{display:flex;gap:.5em;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:.8em;padding:.3em .6em}
.ov .ic{font-size:1.9em;line-height:1}
.ov .t{font-size:1.25em;font-weight:700;line-height:1.15}
.ov .t b{color:#ffb703;margin-right:.3em}
.ov .tr{font-size:.85em;font-weight:600}
.etr{display:flex;gap:.6em;margin-bottom:.6em;flex-wrap:wrap}
.etr span{border-radius:.5em;padding:.1em .7em;font-size:1.2em;font-weight:800}
.c1{background:#e63946}.c2{background:#2a9d8f}.c3{background:#f4a261;color:#13233b}.c4{background:#7b6cf6}
/* Leiste */
#bar{position:absolute;left:0;right:0;bottom:0;height:7%;background:rgba(0,0,0,.5);display:flex;align-items:center;gap:1%;padding:0 1.5%;z-index:5;font-size:calc(min(100vw,177.78vh)/100)}
#bar button,#bar select{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:.6em;font-size:1.9em;padding:.12em .55em;cursor:pointer;font-family:inherit}
#bar select option{color:#000}
#bar button:hover{background:rgba(255,255,255,.3)}
#prog{flex:1;height:.7em;background:rgba(255,255,255,.18);border-radius:1em;overflow:hidden;min-width:3em}
#fill{height:100%;width:0;background:#ffb703}
#cnt{font-size:1.5em;opacity:.8;min-width:3.6em;text-align:right}
#vol{width:6em;accent-color:#ffb703}
#tzGrp{display:flex;align-items:center;gap:.4em;border-left:.15em solid rgba(255,255,255,.3);padding-left:1%}
#tzGrp span{font-size:1.5em;min-width:3em;text-align:center}
#bar button:disabled{opacity:.35;cursor:default}
#start{position:absolute;inset:0;z-index:10;background:linear-gradient(135deg,#13233b,#1d4e89);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2em}
#start h1{font-size:5.6em}
#start button{font-size:3em;font-weight:800;background:#ffb703;color:#13233b;border:0;border-radius:2em;padding:.4em 1.6em;cursor:pointer;font-family:inherit;box-shadow:0 .3em 1.2em rgba(0,0,0,.4)}
#start p{font-size:1.9em;opacity:.85}
/* Handy-Ansicht */
body.mobile,body.mobile html{overflow:auto;height:auto}
html:has(body.mobile){overflow:auto;height:auto}
body.mobile #stage{position:static;display:block}

body.mobile h1{font-size:4em}

body.mobile .row{flex-direction:column;align-items:stretch}

body.mobile .qrbox{display:none}
body.mobile .card,body.mobile .box{animation-duration:.01s;animation-delay:0s!important}
body.mobile #bar{position:fixed;top:0;bottom:auto;left:0;right:0;height:11vw;font-size:2.15vw;justify-content:center}
body.mobile #bar>*:not(#langBox){display:none!important}
body.mobile #langBox select{font-size:3.4em}
</style>

/* ---------- Player ---------- */
const slidesEl=document.getElementById('slides'),fill=document.getElementById('fill'),cnt=document.getElementById('cnt'),bPlay=document.getElementById('bPlay');
const mobile=matchMedia('(max-width: 820px), (max-aspect-ratio: 1/1)').matches;
let S=build(),idx=0,timer=null,playing=true,started=false,t0=0,remain=0;
const dur=s=>s.d*1000*(lang==='de'?1:1.5);
function setDir(){document.getElementById('deck').dir='ltr';}
function show(i){
  clearTimeout(timer);
  idx=(i+S.length)%S.length;
  slidesEl.innerHTML='<div class="slide">'+S[idx].h+'</div>';
  cnt.textContent=(idx+1)+' / '+S.length;
  fill.style.transition='none';
  if(S[idx].last){
    fill.style.width='100%';bPlay.textContent='↻';bPlay.title='Nochmal von vorn';
    music.fade(false);return;
  }
  fill.style.width='0';
  bPlay.textContent=playing?'⏸':'▶';bPlay.title='Pause / Weiter';
  remain=dur(S[idx]);
  if(playing){music.fade(true);run();}
}
function run(){
  clearTimeout(timer);
  const total=dur(S[idx]),done=total-remain;
  fill.style.transition='none';fill.style.width=(done/total*100)+'%';
  void fill.offsetWidth;
  fill.style.transition='width '+remain+'ms linear';fill.style.width='100%';
  t0=Date.now();
  timer=setTimeout(()=>show(idx+1),remain);
}
function pause(){playing=false;clearTimeout(timer);remain-=Date.now()-t0;const total=dur(S[idx]);fill.style.transition='none';fill.style.width=((total-remain)/total*100)+'%';bPlay.textContent='▶';music.setPlaying(false)}
function resume(){playing=true;bPlay.textContent='⏸';music.setPlaying(true);run()}
bPlay.onclick=()=>{
  if(S[idx].last){playing=true;show(0);return;}
  playing?pause():resume();
};
document.getElementById('bNext').onclick=()=>show(idx+1);
document.getElementById('bPrev').onclick=()=>show(idx-1);
document.getElementById('bFull').onclick=()=>{try{document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('keydown',e=>{
  if(!started||mobile)return;
  if(e.key==='ArrowRight')show(idx+1);
  else if(e.key==='ArrowLeft')show(idx-1);
  else if(e.key===' '){e.preventDefault();bPlay.onclick();}
});

const deck=document.getElementById('deck'),tzGrp=document.getElementById('tzGrp');
const STUFEN=[90,100,110,120,130];let tz=100;
function tzApply(){deck.style.setProperty('--tz',tz/100);document.getElementById('tzWert').textContent=tz+' %';
  document.getElementById('tzMinus').disabled=tz<=STUFEN[0];document.getElementById('tzPlus').disabled=tz>=STUFEN[STUFEN.length-1];ST.set('lf4ueb-tz',tz);}
document.getElementById('tzMinus').onclick=()=>{tz=STUFEN[Math.max(0,STUFEN.indexOf(tz)-1)];tzApply()};
document.getElementById('tzPlus').onclick=()=>{tz=STUFEN[Math.min(STUFEN.length-1,STUFEN.indexOf(tz)+1)];tzApply()};

/* ---------- Musik (selbst erzeugt, rechtefrei) ---------- */
const music=(()=>{
  let ctx,master,filt,running=false,nextT=0,step=0,muted=false,vol=.24,target=1;
  const bpm=96,beat=60/bpm;
  const chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  const mf=n=>440*Math.pow(2,(n-69)/12);
  function note(t,n,dur,type,g){
    const o=ctx.createOscillator(),a=ctx.createGain();
    o.type=type;o.frequency.value=mf(n);
    a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(g,t+.04);a.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(a);a.connect(filt);o.start(t);o.stop(t+dur+.05);
  }
  function tick(){
    while(nextT<ctx.currentTime+.6){
      const bar=Math.floor(step/8)%4,s=step%8,ch=chords[bar];
      if(s===0){ch.forEach(n=>note(nextT,n-12,beat*4,'triangle',.07));note(nextT,ch[0]-24,beat*4,'sine',.12);}
      note(nextT,ch[[0,1,2,1,2,1,2,1][s]]+12,beat*.9,'sine',.07);
      if(s===4||s===6)note(nextT,ch[2]+24,beat*.6,'triangle',.025);
      nextT+=beat/2;step++;
    }
  }
  const lvl=()=>muted?0:vol*target;
  return{
    start(){
      if(running)return;
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=lvl();
      filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=2200;
      const d=ctx.createDelay(1);d.delayTime.value=beat*.75;const fb=ctx.createGain();fb.gain.value=.35;
      filt.connect(master);filt.connect(d);d.connect(fb);fb.connect(d);d.connect(master);
      master.connect(ctx.destination);
      nextT=ctx.currentTime+.1;running=true;setInterval(tick,200);tick();
    },
    setPlaying(p){if(ctx)p?ctx.resume():ctx.suspend();},
    setVol(v){vol=v;if(master)master.gain.setTargetAtTime(lvl(),ctx.currentTime,.05);},
    toggleMute(){muted=!muted;if(master)master.gain.setTargetAtTime(lvl(),ctx.currentTime,.05);return muted;},
    fade(on){ if(!ctx)return; target=on?1:0; if(on)ctx.resume(); master.gain.setTargetAtTime(lvl(),ctx.currentTime,on?.3:1.2); }
  };
})();
document.getElementById('vol').oninput=e=>music.setVol(e.target.value/100*.8);
document.getElementById('bMute').onclick=e=>{e.target.textContent=music.toggleMute()?'🔇':'🔊'};
