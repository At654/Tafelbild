<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fragen-Showdown – LF 2 Modul 6</title>
<style>
:root{--bg:#f3efe4;--ink:#1d1d1f;--navy:#13275a;--gold:#b8901c;--paper:#fbf9f3;--line:#d8d1bf;--muted:#5d5a52;--ok:#2d6b3a;--bad:#a32626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:14px 20px 40px}
header{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-top:3px double var(--ink);border-bottom:2px solid var(--ink);padding:10px 0 8px;margin-bottom:16px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:44px;margin:0;line-height:1;letter-spacing:-.5px}
.sub{letter-spacing:.16em;font-size:12.5px;text-transform:uppercase;color:#333;flex:1;padding-bottom:4px;min-width:260px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hbtn{background:var(--paper);border:1px solid #9c9584;border-radius:5px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.hbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl{display:block;font-size:.86em;color:#4b5a86;font-weight:400;unicode-bidi:plaintext;margin-top:2px}
.tl[dir=rtl],.tl:lang(ar){text-align:right}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:22px 26px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.center{max-width:1000px;margin:0 auto}
h2{font-family:Georgia,serif;font-size:30px;margin:0 0 6px}
.intro{color:var(--muted);margin:0 0 16px}
.rule{display:flex;gap:14px;background:#ece7d8;border-radius:6px;padding:12px 16px;margin-bottom:10px}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.rule h3{margin:0 0 3px;font-size:17px}
.rule p{margin:0}
.big{display:block;width:100%;border:0;border-radius:5px;background:var(--gold);color:#fff;font-family:inherit;font-weight:700;font-size:19px;line-height:1.2;padding:13px;cursor:pointer;margin-top:12px;box-shadow:0 3px 0 #8a6a10}
.big .tl,.btn .tl{color:#fff;opacity:.85}
.big:disabled{opacity:.45;cursor:default}
.navy{background:var(--navy);box-shadow:0 3px 0 #0b1838}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.cnt button{border:2px solid #b9b19d;background:var(--paper);border-radius:6px;padding:12px;font-family:inherit;font-weight:700;font-size:19px;cursor:pointer}
.cnt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.nrow{display:flex;gap:12px;align-items:center;margin:8px 0}
.nrow input{flex:1;font:inherit;font-size:19px;padding:10px 14px;border:1px solid #bdb5a2;border-radius:5px;background:#fff}
.dot{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;border:3px solid #fff;box-shadow:0 0 0 1px #888}
.hint{color:var(--muted);font-size:15px;margin-top:8px}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.game{grid-template-columns:1fr}h1{font-size:34px}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:6px 14px 6px 8px;min-width:150px}
.chip.cur{border-color:currentColor}
.chip b{display:block;color:var(--ink)}
.chip small{color:var(--muted)}
.board{border:2px solid var(--navy);border-radius:4px;overflow:hidden;background:#fff}
.bhead{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-family:Georgia,serif;font-weight:700;font-size:17px;min-height:46px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.cell{position:relative;aspect-ratio:1.12/1;border-right:1px solid #ddd6c3;border-bottom:1px solid #ddd6c3;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell:nth-child(odd){background:#f6f3ea}.cell:nth-child(even){background:#ece8dc}
.cell .n{position:absolute;top:3px;left:6px;font-size:13px;font-weight:600;color:#333}
.cell .ic{font-size:30px;line-height:1}
.cell .lb{font-size:9.5px;letter-spacing:.03em;overflow-wrap:anywhere;text-transform:uppercase;color:#444;margin-top:4px;text-align:center}
.cell.w{background:#f3eab8 !important}.cell.p{background:#cfe0f2 !important}.cell.g{background:#f1d4d4 !important}
.cell.z{background:#1b1b22 !important;color:#fff}.cell.z .n,.cell.z .lb{color:#fff}
.toks{position:absolute;bottom:3px;right:3px;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.tok{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
.tok.hop{transform:translateY(-6px) scale(1.15)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:8px;color:#333}
.legend span .tl{display:inline;margin-left:4px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 22px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.who small{letter-spacing:.14em;text-transform:uppercase;color:#555;font-size:12px}
.who .nm{font-family:Georgia,serif;font-weight:700;font-size:22px;display:block}
.drow{display:flex;gap:16px;align-items:center;margin:8px 0 6px}
.die{width:62px;height:62px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-shadow:0 3px 0 #333}
.die i{display:block;width:11px;height:11px;border-radius:50%;margin:auto}
.die i.on{background:var(--ink)}
.die.roll{animation:wob .12s linear infinite}
@keyframes wob{50%{transform:rotate(12deg)}}
.btn{border:0;border-radius:5px;background:var(--navy);color:#fff;font-family:inherit;font-weight:700;font-size:18px;padding:12px 22px;cursor:pointer;box-shadow:0 3px 0 #0b1838}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #8a6a10}
.qcard{background:#fff;border:2px solid var(--gold);border-radius:8px;padding:12px 16px;margin:10px 0 14px;position:relative}
.qcard .lbl{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#7a6418;font-weight:700}
.qcard .q{font-family:Georgia,serif;font-size:23px;font-weight:700;margin-top:4px}
.qcard .sit{font-size:17px;margin-top:4px}
h4{margin:12px 0 6px;font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:2px solid #c9c1ad;background:#fff;border-radius:6px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;line-height:1.25}
.opt small{font-weight:400;color:#666}
.opt.sel{border-color:var(--navy);background:#e4e9f5}
.opt.right{border-color:var(--ok);background:#dcefdf}
.opt.wrong{border-color:var(--bad);background:#f6dada}
.opt:disabled{cursor:default;color:var(--ink)}
.res{border-radius:6px;padding:10px 14px;margin-top:12px;background:#eef1f7;border-left:5px solid var(--navy)}
.res p{margin:4px 0}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
.move{font-size:19px;font-weight:700;margin:12px 0 4px}
.spec{font-size:19px;margin:6px 0 4px}
#win{position:fixed;inset:0;background:rgba(19,39,90,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#win .card{max-width:620px;width:100%;text-align:center}
#win .trophy{font-size:70px;line-height:1}
#win h2{font-size:34px}
.rank{text-align:left;margin:14px 0}
.rank div{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #e3ddcd;font-size:18px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
.hide{display:none !important}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="wrap">
<header>
  <h1>Fragen-Showdown</h1>
  <div class="sub" id="sub"></div>
  <div class="hbtns" id="hbtns"></div>
</header>
<main id="main"></main>
</div>
<div id="win"><div class="card" id="wincard"></div></div>

/* UI-Texte: [de, tr, vi, ar] */
const U={
 sub:["Brettspiel zu Fragearten · LF 2 Modul 6 · KLA Bremerhaven","Soru türleri üzerine masa oyunu","Trò chơi bàn cờ về các loại câu hỏi","لعبة لوحية عن أنواع الأسئلة"],
 regeln:["Regeln","Kurallar","Luật chơi","القواعد"],

 intro:["Lest euch die Regeln kurz durch, dann geht es los. Ihr könnt sie im Spiel jederzeit über „Regeln“ nochmal aufrufen.","Kuralları kısaca okuyun, sonra başlıyoruz. Kurallara oyunda her zaman „Regeln“ düğmesinden tekrar bakabilirsiniz.","Hãy đọc nhanh luật chơi rồi bắt đầu. Trong khi chơi, bạn có thể mở lại luật bất cứ lúc nào bằng nút „Regeln“.","اقرؤوا القواعد بسرعة، ثم نبدأ. يمكنكم فتحها في أي وقت أثناء اللعب عبر زر «Regeln»."],
 r1t:["Ziel","Hedef","Mục tiêu","الهدف"],
 r1:["Ihr startet morgens bei der <b>Ladenöffnung</b> und wollt als Erste/r den <b>Feierabend</b> 🎉 (Feld 18) erreichen. Gespielt wird reihum an einem Gerät.","Sabah mağaza açılışında başlıyorsunuz ve iş çıkışına 🎉 (18. alan) ilk ulaşan olmak istiyorsunuz. Sırayla tek bir cihazda oynanır.","Các bạn bắt đầu lúc cửa hàng mở cửa buổi sáng và muốn là người đầu tiên đến giờ tan ca 🎉 (ô 18). Mọi người chơi lần lượt trên một thiết bị.","تبدؤون صباحًا عند افتتاح المتجر، ويريد كل واحد أن يصل أولًا إلى نهاية الدوام 🎉 (الخانة 18). يلعب الجميع بالدور على جهاز واحد."],
 r2t:["Würfeln & Karte ziehen","Zar at ve kart çek","Tung xúc xắc và rút thẻ","ارمِ النرد واسحب بطاقة"],
 r2:["Wer dran ist, würfelt und bekommt eine <b>Kundenkarte</b> mit einer Frage aus einem Verkaufsgespräch, zum Beispiel „Zahlen Sie bar oder mit Karte?“.","Sırası gelen zar atar ve bir satış konuşmasından bir soru içeren bir müşteri kartı alır.","Người đến lượt tung xúc xắc và nhận một thẻ khách hàng có một câu hỏi trong cuộc trò chuyện bán hàng.","من عليه الدور يرمي النرد ويحصل على بطاقة زبون فيها سؤال من محادثة بيع."],
 r3t:["Zwei Fragen beantworten","İki soruyu cevapla","Trả lời hai câu hỏi","أجب عن سؤالين"],
 r3:["① Welche <b>Frageart</b> ist das? (offene Frage, geschlossene Frage, Alternativfrage, Suggestivfrage, rhetorische Frage)<br>② Sollte man so im Verkaufsgespräch fragen – <b>ja</b> oder <b>lieber vermeiden</b>?<br>Die Mitspielenden dürfen mitraten, am Ende entscheidet die Person am Zug.","① Bu hangi soru türü? ② Satış konuşmasında böyle sorulmalı mı – evet mi, yoksa kaçınmak mı daha iyi? Diğer oyuncular da tahmin edebilir, son kararı sırası gelen verir.","① Đây là loại câu hỏi nào? ② Có nên hỏi như vậy khi bán hàng không – có, hay nên tránh? Những người khác được đoán cùng, người đến lượt quyết định cuối cùng.","① ما نوع هذا السؤال؟ ② هل يجب أن نسأل هكذا في محادثة البيع – نعم أم الأفضل تجنّبه؟ يمكن للآخرين المساعدة، والقرار الأخير لمن عليه الدور."],
 r4t:["Ziehen","İlerle","Di chuyển","التقدّم"],
 r4:["<b>Frageart richtig:</b> so viele Felder, wie du gewürfelt hast.<br><b>② richtig:</b> +1 Feld extra.<br>Beides falsch: Du bleibst stehen. Danach siehst du die Lösung mit Begründung.","Soru türü doğru: zarda çıkan sayı kadar ilerle. ② doğru: +1 alan. İkisi de yanlış: yerinde kalırsın. Sonra çözümü ve açıklamasını görürsün.","Đúng loại câu hỏi: đi số ô bằng số xúc xắc. ② đúng: thêm 1 ô. Sai cả hai: đứng yên. Sau đó bạn xem lời giải và lý do.","نوع السؤال صحيح: تتقدّم بعدد النرد. ② صحيح: خانة إضافية. الاثنان خطأ: تبقى مكانك. بعد ذلك ترى الحل مع التعليل."],
 r5t:["Besondere Felder","Özel alanlar","Ô đặc biệt","خانات خاصة"],

 verstanden:["Verstanden – weiter zu den Namen","Anladım – isimlere geç","Đã hiểu – tiếp tục nhập tên","فهمت – إلى الأسماء"],

 start:["Spiel starten","Oyunu başlat","Bắt đầu chơi","ابدأ اللعب"],

  if($("hRules"))$("hRules").onclick=()=>{rulesFromGame=true;S.screen="rules";render();};
  if($("hEnd"))$("hEnd").onclick=()=>{
    if(!S.endAsk){S.endAsk=true;renderHead();setTimeout(()=>{S.endAsk=false;if(S.screen==="game")renderHead();},4000);return;}
    S.endAsk=false;S.screen="names";render();
  };
}

/* ---------- Regeln ---------- */
function renderRules(){
  let h=`<div class="card center"><h2>${D("howto")}</h2><p class="intro">${D("intro")}${tl(U.intro.slice(1))}</p>`;
  for(let i=1;i<=5;i++){
    h+=`<div class="rule"><div class="num">${i}</div><div><h3>${T("r"+i+"t")}</h3><p>${U["r"+i][0]}${tl(U["r"+i].slice(1))}</p></div></div>`;
  }
  h+=`<button class="big" id="go">${rulesFromGame?T("zurueck"):T("verstanden")}</button></div>`;
  main.innerHTML=h;
  $("go").onclick=()=>{S.screen=rulesFromGame?"game":"names";rulesFromGame=false;render();};
}

/* ---------- Namen ---------- */
function renderNames(){
  let h=`<div class="card center" style="max-width:760px"><h2>${D("wer")}</h2><p class="intro">${D("wieviele")}${tl(U.wieviele.slice(1))}</p><div class="cnt">`;
  for(const n of [2,3,4])h+=`<button data-n="${n}" class="${S.count===n?"on":""}">${n} ${D("personen")}${lang!=="de"?`<span class="tl" style="color:inherit;opacity:.8" dir="auto">${n} ${U.personen[LI[lang]+1]}</span>`:""}</button>`;
  h+=`</div>`;
  for(let i=0;i<S.count;i++)h+=`<div class="nrow"><div class="dot" style="background:${COLORS[i]}">${i+1}</div><input id="nm${i}" maxlength="18" placeholder="${D("namevon")} ${i+1}" value="${esc(S.names[i])}" autocomplete="off"></div>`;
  h+=`<button class="big" id="startBtn">${T("start")}</button><p class="hint" id="nhint"></p></div>`;
  main.innerHTML=h;
  main.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{saveNames();S.count=+b.dataset.n;renderNames();});
  const check=()=>{saveNames();const ok=S.names.slice(0,S.count).every(n=>n.trim());$("startBtn").disabled=!ok;$("nhint").innerHTML=ok?"":T("allenamen");};
  for(let i=0;i<S.count;i++){$("nm"+i).oninput=check;$("nm"+i).onkeydown=e=>{if(e.key==="Enter"){const nx=$("nm"+(i+1));if(nx)nx.focus();else if(!$("startBtn").disabled)$("startBtn").click();}};}
  check();
  $("startBtn").onclick=()=>{saveNames();startGame();};
  const first=[...Array(S.count).keys()].find(i=>!S.names[i].trim());
  if(first!==undefined)$("nm"+first).focus();
}
function saveNames(){for(let i=0;i<4;i++){const el=$("nm"+i);if(el)S.names[i]=el.value;}}
function startGame(){
  S.players=S.names.slice(0,S.count).map((n,i)=>({name:n.trim(),pos:0,color:COLORS[i]}));
  S.cur=0;S.phase="roll";S.deck=shuffle(CARDS.map((_,i)=>i));S.wdeck=shuffle(WUENSCHE.map((_,i)=>i));S.screen="game";
  $("win").style.display="none";render();
}

/* ---------- Spiel ---------- */
function tokHTML(i,p){return `<div class="tok" id="tok${i}" style="background:${p.color}">${i+1}</div>`;}
function renderBoard(){
  let h=`<div class="chips">`;
  S.players.forEach((p,i)=>{h+=`<div class="chip ${i===S.cur?"cur":""}" style="color:${p.color}"><div class="dot" style="background:${p.color}">${i+1}</div><div><b>${esc(p.name)}</b><small>${D("feld")} ${p.pos} ${D("von18")}</small></div></div>`;});
  h+=`</div><div class="board"><div class="bhead"><span>${D("bstart")}</span><span style="display:flex;gap:4px">`;
  S.players.forEach((p,i)=>{if(p.pos===0)h+=tokHTML(i,p);});
  h+=`</span></div><div class="grid">`;
  for(const f of ORDER){
    const t=FT[f];
    h+=`<div class="cell ${t||""}"><span class="n">${f}</span>`;
    if(t)h+=`<span class="ic">${FI[t][0]}</span><span class="lb">${D(FI[t][1])}</span>`;
    h+=`<div class="toks">`;
    S.players.forEach((p,i)=>{if(p.pos===f)h+=tokHTML(i,p);});
    h+=`</div></div>`;
  }
  h+=`</div></div><div class="legend">`;
  h+=`<span>🛍️ ${D("wunsch")} (+2)${tl(U.wunsch.slice(1))}</span><span>☕ ${D("pause")} (+2)${tl(U.pause.slice(1))}</span><span>😠 ${D("genervt")} (−2)${tl(U.genervt.slice(1))}</span><span>🎉 ${D("ziel")}${tl(U.ziel.slice(1))}</span></div>`;
  return h;
}
function dieHTML(n,rolling){let h=`<div class="die ${rolling?"roll":""}" id="die">`;for(let i=0;i<9;i++)h+=`<i class="${PIPS[n].includes(i)?"on":""}"></i>`;return h+`</div>`;}

function renderPanel(){
  const p=S.players[S.cur];
  let h=`<div class="panel"><div class="who"><div class="dot" style="background:${p.color};width:42px;height:42px;font-size:18px">${S.cur+1}</div><div><small>${D("amzug")}</small>${lang!=="de"?`<small style="letter-spacing:0;text-transform:none"> · ${U.amzug[LI[lang]+1]}</small>`:""}<span class="nm">${esc(p.name)}</span></div></div>`;
  if(S.phase==="roll"){
    h+=`<p style="margin:4px 0 8px">${D("wuerfle")}${tl(U.wuerfle.slice(1))}</p><div class="drow">${dieHTML(S.roll)}<button class="btn" id="rollBtn">${D("wuerfeln")}</button></div>`;
  } else if(S.phase==="card"||S.phase==="result"){
    const c=S.card,ty=TY[c.k],done=S.phase==="result";
    h+=`<div class="drow">${dieHTML(S.roll)}<b style="font-size:18px">${D("gewuerfelt")} ${S.roll}</b></div>`;
    h+=`<div class="qcard"><div class="lbl">${D("fragt")}${tl(U.fragt.slice(1))}</div><div class="q">„${esc(c.q)}“</div>${tl(c.t)}</div>`;
    h+=`<h4>${T("f1")}</h4><div class="opts">`;
    TY.forEach((t,i)=>{
      let cls="opt";
      if(done){if(i===c.k)cls+=" right";else if(i===S.a1)cls+=" wrong";}
      else if(S.a1===i)cls+=" sel";
      h+=`<button class="${cls}" data-a1="${i}" ${done?"disabled":""}>${t.n} <small>(${t.a})</small>${tl(t.tr)}</button>`;
    });
    h+=`</div><h4>${T("f2")}</h4><div class="opts">`;
    [[1,"ja"],[0,"nein"]].forEach(([v,k])=>{
      let cls="opt";
      if(done){if(v===ty.ok)cls+=" right";else if(v===S.a2)cls+=" wrong";}
      else if(S.a2===v)cls+=" sel";
      h+=`<button class="${cls}" data-a2="${v}" ${done?"disabled":""}>${v?"👍":"✋"} ${D(k)}${tl(U[k].slice(1))}</button>`;
    });
    h+=`</div>`;
    if(!done){
      const ready=S.a1!==null&&S.a2!==null;
      h+=`<div style="margin-top:14px"><button class="btn gold" id="solveBtn" ${ready?"":"disabled"}>${D("aufloesen")}</button>${ready?"":`<span class="hint" style="margin-left:10px">${D("waehle")}</span>`}</div>`;
    } else {
      const r1=S.a1===c.k,r2=S.a2===ty.ok,steps=(r1?S.roll:0)+(r2?1:0);
      h+=`<div class="res"><p>① <span class="${r1?"okc":"badc"}">${r1?"✔ "+D("richtig"):"✘ "+D("falsch")}</span> &nbsp; ② <span class="${r2?"okc":"badc"}">${r2?"✔ "+D("richtig"):"✘ "+D("falsch")}</span></p>`;
      h+=`<p><b>${D("loesung")}: ${ty.n}</b> (${ty.a})${tl(ty.tr)}</p>`;
      h+=`<p>${D("signal")} <i>${esc(c.s)}</i></p>`;
      h+=`<p>${D("merkmal")} ${ty.m}${tl(ty.mt)}</p>`;
      h+=`<p>${D("wirkung")} ${ty.e}${tl(ty.et)}</p></div>`;
      h+=`<div class="move">${steps?`➜ ${steps} ${D(steps===1?"vor1":"vor")}`:D("stehen")}${steps?tl(U[steps===1?"vor1":"vor"].slice(1).map(s=>steps+" "+s)):tl(U.stehen.slice(1))}</div>`;
      h+=`<button class="btn" id="moveBtn">${steps?D("ziehen"):D("weiter")}</button>`;
    }
  } else if(S.phase==="wunsch"||S.phase==="wresult"){
    const w=S.wcard,done=S.phase==="wresult";
    h+=`<div class="qcard"><div class="lbl">${D("wunschkarte")}${tl(U.wunschkarte.slice(1))}</div><div class="sit">${esc(w.s)}</div>${tl(w.st)}</div><h4>${T("passt")}</h4><div class="opts one">`;
    w.o.forEach((o,i)=>{
      let cls="opt";
      if(done){if(i===w.r)cls+=" right";else if(i===S.wa)cls+=" wrong";}
      h+=`<button class="${cls}" data-w="${i}" ${done?"disabled":""}>„${esc(o[0])}“${done?` <small>– ${TY[o[1]].n}</small>`:""}${tl(o[2])}</button>`;
    });
    h+=`</div>`;
    if(done){
      const ok=S.wa===w.r,ty=TY[w.o[w.r][1]];
      h+=`<div class="res"><p><b>${ty.n}</b>${tl(ty.tr)}</p><p>${ty.e}${tl(ty.et)}</p></div>`;
      h+=`<div class="move">${ok?D("w_ok"):D("w_bad")}${tl(U[ok?"w_ok":"w_bad"].slice(1))}</div><button class="btn" id="wBtn">${ok?D("ziehen"):D("weiter")}</button>`;
    }
  } else if(S.phase==="next"){
    if(S.msg)h+=`<div class="spec">${S.msg}</div>`;
    const nx=S.players[(S.cur+1)%S.players.length];
    h+=`<div style="margin-top:14px"><button class="btn" id="nextBtn">${D("naechste")} ${esc(nx.name)}</button></div>`;
  } else if(S.phase==="busy"){
    if(S.msg)h+=`<div class="spec">${S.msg}</div>`;
  }
  return h+`</div>`;
}

function renderGame(){
  main.innerHTML=`<div class="game"><div>${renderBoard()}</div><div id="pan">${renderPanel()}</div></div>`;
  bindPanel();
}
function refreshPanel(){$("pan").innerHTML=renderPanel();bindPanel();}
function refreshBoardOnly(){const g=main.querySelector(".game>div");if(g)g.innerHTML=renderBoard();}

function bindPanel(){
  const b=id=>$(id);
  if(b("rollBtn"))b("rollBtn").onclick=doRoll;
  main.querySelectorAll("[data-a1]").forEach(x=>x.onclick=()=>{S.a1=+x.dataset.a1;refreshPanel();});
  main.querySelectorAll("[data-a2]").forEach(x=>x.onclick=()=>{S.a2=+x.dataset.a2;refreshPanel();});
  if(b("solveBtn"))b("solveBtn").onclick=()=>{S.phase="result";refreshPanel();};
  if(b("moveBtn"))b("moveBtn").onclick=()=>{
    const c=S.card,steps=(S.a1===c.k?S.roll:0)+(S.a2===TY[c.k].ok?1:0);
    if(!steps){toNext("");return;}
    S.phase="busy";S.msg="";refreshPanel();
    moveBy(steps,afterLand);
  };
  main.querySelectorAll("[data-w]").forEach(x=>x.onclick=()=>{S.wa=+x.dataset.w;S.phase="wresult";refreshPanel();});
  if(b("wBtn"))b("wBtn").onclick=()=>{
    if(S.wa===S.wcard.r){S.phase="busy";S.msg="";refreshPanel();moveBy(2,()=>{if(!checkWin())toNext("");});}
    else toNext("");
  };
  if(b("nextBtn"))b("nextBtn").onclick=()=>{S.cur=(S.cur+1)%S.players.length;S.phase="roll";S.msg="";render();};
}

function doRoll(){
  if(S.busy)return;S.busy=true;
  let n=0;const btn=$("rollBtn");btn.disabled=true;
  const it=setInterval(()=>{
    S.roll=1+Math.floor(Math.random()*6);
    const d=$("die");if(d)d.outerHTML=dieHTML(S.roll,true);
    if(++n>=11){clearInterval(it);S.busy=false;S.card=draw();S.a1=null;S.a2=null;S.phase="card";refreshPanel();}
  },80);
}

function moveBy(steps,done){
  const p=S.players[S.cur];const dir=steps>0?1:-1;let left=Math.abs(steps);
  const step=()=>{
    if(left===0||(dir>0&&p.pos>=GOAL)||(dir<0&&p.pos<=0)){done();return;}
    p.pos+=dir;left--;refreshBoardOnly();
    const t=$("tok"+S.cur);if(t){t.classList.add("hop");setTimeout(()=>t.classList.remove("hop"),180);}
    setTimeout(step,300);
  };
  setTimeout(step,150);
}

function afterLand(){
  if(checkWin())return;
  const p=S.players[S.cur],t=FT[p.pos];
  if(t==="p"){
    S.phase="busy";S.msg=U.p_msg[0]+tl(U.p_msg.slice(1));refreshPanel();
    setTimeout(()=>moveBy(2,()=>{if(!checkWin())toNext(U.p_msg[0]+tl(U.p_msg.slice(1)));}),900);
  } else if(t==="g"){
    const m=U.g_msg[0]+tl(U.g_msg.slice(1))+`<div class="hint">${U.g_why[0]}${tl(U.g_why.slice(1))}</div>`;
    S.phase="busy";S.msg=m;refreshPanel();
    setTimeout(()=>moveBy(-2,()=>toNext(m)),900);
  } else if(t==="w"){
    S.wcard=drawW();S.wa=null;S.phase="wunsch";refreshPanel();
  } else toNext("");
}
function toNext(msg){S.msg=msg;S.phase="next";refreshPanel();refreshBoardOnly();}

function checkWin(){
  const p=S.players[S.cur];
  if(p.pos<GOAL)return false;
  p.pos=GOAL;refreshBoardOnly();
  const rank=S.players.map((q,i)=>({...q,i})).sort((a,b)=>(a.i===S.cur?-1:b.i===S.cur?1:b.pos-a.pos));
  let h=`<div class="trophy">🏆🎉</div><h2>${esc(p.name)} ${D("feierabend")}</h2>${tl(U.feierabend.slice(1).map(s=>p.name+" "+s))}<div class="rank">`;
  rank.forEach((q,k)=>{h+=`<div><b style="width:70px">${k+1}. ${D("platz")}</b><span class="dot" style="background:${q.color};width:28px;height:28px">${q.i+1}</span><span style="flex:1">${esc(q.name)}</span><span>${D("feld")} ${q.pos}</span></div>`;});
  h+=`</div><button class="big" id="again">${T("nochmal")}</button><button class="big navy" id="newnames">${T("neuenamen")}</button>`;
  $("wincard").innerHTML=h;$("win").style.display="flex";
  $("again").onclick=()=>{$("cf").style.display="none";cfStop=true;startGame();};
  $("newnames").onclick=()=>{$("cf").style.display="none";cfStop=true;$("win").style.display="none";S.screen="names";render();};
  confetti();
  return true;
}

/* ---------- Konfetti ---------- */
let cfStop=false;
function confetti(){
  cfStop=false;
  const c=$("cf");c.style.display="block";const x=c.getContext("2d");
  let W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#b8901c","#13275a","#a32626","#2d6b3a","#e7c35a","#22508f","#f28c28","#d94f8c","#3fb6a8"];
  const P=[];
  for(let i=0;i<360;i++)P.push({x:Math.random()*W,y:-Math.random()*H*1.3,w:6+Math.random()*8,h:9+Math.random()*10,vy:2.2+Math.random()*3.8,vx:-1.5+Math.random()*3,r:Math.random()*6.28,vr:-.22+Math.random()*.44,c:cols[i%cols.length],s:Math.random()*6.28,round:Math.random()<.25});
  const t0=performance.now();
  function f(t){
    if(cfStop){x.clearRect(0,0,W,H);c.style.display="none";return;}
    x.clearRect(0,0,W,H);let alive=false;
    for(const p of P){
      p.y+=p.vy;p.x+=p.vx+Math.sin(t/380+p.s)*1.3;p.r+=p.vr;
      if(t-t0<5000&&p.y>H+20){p.y=-20;p.x=Math.random()*W;}
      if(p.y<H+20)alive=true;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,6.28);x.fill();}
      else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.max(.15,Math.abs(Math.cos(p.r*1.3))));
      x.restore();
    }
    if(alive)requestAnimationFrame(f);else c.style.display="none";
  }
  requestAnimationFrame(f);
}
addEventListener("resize",()=>{const c=$("cf");if(c.style.display==="block"){c.width=innerWidth;c.height=innerHeight;}});

/* ---------- Hauptschleife ---------- */
function render(){
  document.documentElement.lang=lang==="de"?"de":"de";
  renderHead();
  if(S.screen==="rules")renderRules();
  else if(S.screen==="names")renderNames();
  else renderGame();
  if(S.screen==="game"&&$("win").style.display==="flex"&&S.players.some(p=>p.pos>=GOAL)){/* Siegerbildschirm bleibt */}
}
render();
</script>
