quy định giá được cao bao nhiêu.","quiz":{"q":{"de":"Wen schützt die Preisangabenverordnung?","vi":"Wen schützt die Preisangabenverordnung?\n🇻🇳 Preisangabenverordnung bảo vệ ai?"},"o":["die Lieferanten","die Verbraucher","das Finanzamt"],"a":1,"why":{"de":"Richtig ist: die Verbraucher","vi":"Đáp án đúng: người tiêu dùng"}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Was muss auf dem Preisschild stehen?","vi":"Was muss auf dem Preisschild stehen? · Trên bảng giá phải có gì?"},"instr":{"de":"Markiere die Pflichtangaben.","vi":"Markiere die Pflichtangaben.\n🇻🇳 Đánh dấu các thông tin bắt buộc."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Pflicht ist der [[Endpreis]]. Das ist der Preis, den der Kunde wirklich zahlt – mit Umsatzsteuer. Bei Ware nach Gewicht, Volumen oder Länge ist auch der [[Grundpreis]] Pflicht. Das ist der Preis je 1 kg, 1 l oder 1 m. So kann man verschieden große Packungen vergleichen. Dazu kommen [[Menge und Art der Ware]]. Der Preis muss gut lesbar und der Ware zugeordnet sein – am Artikel, am Regal oder im Schaufenster. Der Bezugspreis steht nicht auf dem Preisschild."],"vi":"Bắt buộc phải có Endpreis. Đó là giá khách thực sự trả – đã gồm thuế. Với hàng bán theo khối lượng, thể tích hoặc chiều dài thì Grundpreis cũng bắt buộc. Đó là giá cho 1 kg, 1 l hoặc 1 m. Nhờ đó có thể so sánh các gói có kích cỡ khác nhau. Ngoài ra còn có số lượng và loại hàng. Giá phải dễ đọc và gắn rõ với hàng – trên mặt hàng, trên kệ hoặc trong tủ kính. Bezugspreis không có trên bảng giá.","quiz":{"q":{"de":"Was ist der Endpreis?","vi":"Was ist der Endpreis?\n🇻🇳 Endpreis là gì?"},"o":["der Preis ohne Umsatzsteuer","der Preis mit Umsatzsteuer","der Preis je 1 kg"],"a":1,"why":{"de":"Richtig ist: der Preis mit Umsatzsteuer","vi":"Đáp án đúng: giá đã gồm thuế"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"Der falsche Preis am Regal","vi":"Der falsche Preis am Regal · Giá sai trên kệ"},"instr":{"de":"Markiere, was das Preisschild rechtlich ist und wo der Kaufvertrag entsteht.","vi":"Markiere, was das Preisschild rechtlich ist und wo der Kaufvertrag entsteht.\n🇻🇳 Đánh dấu bảng giá là gì về mặt pháp lý và hợp đồng mua bán hình thành ở đâu."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Am Regal steht 2,30 €, an der Kasse kostet der Artikel 3,20 €. Muss der Laden 2,30 € verlangen? Nein. Das Preisschild ist nur eine [[Aufforderung]] an den Kunden, ein Angebot zu machen. Der Kaufvertrag entsteht erst [[an der Kasse]]. Der Kunde hat [[keinen Anspruch]] auf den falschen Preis. Gute Verkäufer handeln trotzdem [[kulant]] und berichtigen das Schild sofort. Der Kaufvertrag entsteht nicht am Regal."],"vi":"Trên kệ ghi 2,30 €, ở quầy thu ngân mặt hàng có giá 3,20 €. Cửa hàng có phải lấy 2,30 € không? Không. Bảng giá chỉ là lời mời khách đưa ra đề nghị mua. Hợp đồng mua bán chỉ hình thành ở quầy thu ngân. Khách không có quyền đòi giá sai. Người bán hàng giỏi vẫn chiều khách (kulant) và sửa bảng giá ngay. Hợp đồng mua bán không hình thành ở kệ hàng.","quiz":{"q":{"de":"Wo entsteht der Kaufvertrag?","vi":"Wo entsteht der Kaufvertrag?\n🇻🇳 Hợp đồng mua bán hình thành ở đâu?"},"o":["am Regal","im Schaufenster","an der Kasse"],"a":2,"why":{"de":"Richtig ist: an der Kasse","vi":"Đáp án đúng: ở quầy thu ngân"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Den Grundpreis berechnen</h4><p>Beispiel: Frikadellen 520 g für 9,88 €</p><p>1. Menge in kg (oder l) umrechnen: 520 g = 0,520 kg</p><p>2. Preis durch Menge teilen: 9,88 : 0,52 = 19,00 € je kg</p><h4>Pflichtangaben auf dem Preisschild</h4><p>Endpreis: Der Preis, den der Kunde wirklich zahlt – mit Umsatzsteuer (= Bruttoverkaufspreis).</p><p>Grundpreis: Bei Ware nach Gewicht, Volumen oder Länge: Preis je 1 kg, 1 l oder 1 m.</p><p>Menge und Art der Ware: z. B. „Honig, 500 g“; ggf. Güteklasse (bei Obst und Gemüse)</p><p>gut lesbar und zugeordnet: am Artikel, am Regal oder im Schaufenster – der Kunde muss sehen, welcher Preis zu welcher Ware gehört.</p><p><b>Merke:</b> Rechtliche Grundlage für Preisschilder: Preisangabenverordnung. Pflicht: Endpreis mit Umsatzsteuer und Grundpreis je 1 kg / 1 l. Regalauszeichnung ist erlaubt.</p>","vi":"Tính Grundpreis\nVí dụ: thịt viên 520 g giá 9,88 €\n1. Đổi lượng sang kg (hoặc l): 520 g = 0,520 kg\n2. Chia giá cho lượng: 9,88 : 0,52 = 19,00 € mỗi kg\nThông tin bắt buộc trên bảng giá\nEndpreis: giá khách thực sự trả – đã gồm thuế (= Bruttoverkaufspreis).\nGrundpreis: với hàng bán theo khối lượng, thể tích hoặc chiều dài: giá cho 1 kg, 1 l hoặc 1 m.\nSố lượng và loại hàng: ví dụ „Honig, 500 g“; nếu cần thì hạng chất lượng (với rau quả)\ndễ đọc và gắn rõ với hàng: trên mặt hàng, trên kệ hoặc trong tủ kính – khách phải thấy giá nào thuộc hàng nào.\nGhi nhớ: Cơ sở pháp lý cho bảng giá: Preisangabenverordnung. Bắt buộc: Endpreis đã gồm thuế và Grundpreis cho 1 kg / 1 l. Ghi giá trên kệ là được phép."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: der Kilopreis","vi":"Vorgemacht: der Kilopreis · Làm mẫu: giá mỗi ki-lô-gam"},"html":"<p><b>Aufgabe der IHK:</b> Eine Packung Frikadellen (520 g) kostet 9,88 €. Nach der Preisangabenverordnung muss auch der Kilopreis angegeben werden. Berechnen Sie den Kilopreis!</p><p><b>Gramm in kg:</b> 520 g : 1000 = 0,520 kg</p><p><b>Preis durch Menge:</b> 9,88 : 0,52 = 19,00 € je kg</p><p><b>Prüfen:</b> Etwa das Doppelte, weil etwa ein halbes Kilo – passt. ✓</p><p><b>Taschenrechner:</b> 9,88 ÷ 0,52 = → 19 oder: 9,88 ÷ 520 × 1000 =</p>","vi":"Đề của IHK: Một gói thịt viên (520 g) có giá 9,88 €. Theo Preisangabenverordnung phải ghi cả giá mỗi ki-lô-gam. Hãy tính giá mỗi ki-lô-gam!\nGam sang kg: 520 g : 1000 = 0,520 kg\nGiá chia cho lượng: 9,88 : 0,52 = 19,00 € mỗi kg\nKiểm tra: Khoảng gấp đôi, vì khoảng nửa ki-lô – hợp lý. ✓\nMáy tính: 9,88 ÷ 0,52 = → 19 hoặc: 9,88 ÷ 520 × 1000 ="},{"id":"g2","no":"Aufgabe 3","title":{"de":"Lückenschema und geführte Übung: Grundpreise","vi":"Lückenschema und geführte Übung: Grundpreise · Sơ đồ điền chỗ trống và bài tập có hướng dẫn: Grundpreis"},"instr":{"de":"Rechne die Menge zuerst in kg oder l um. Dann Preis : Menge.","vi":"Rechne die Menge zuerst in kg oder l um. Dann Preis : Menge.\n🇻🇳 Trước tiên đổi lượng sang kg hoặc l. Sau đó giá : lượng."},"tip":{"de":"Rechne die Menge zuerst in kg oder l um: 520 g = 0,520 kg, 300 ml = 0,3 l. Grundpreis = Preis : Menge (in kg oder l).","vi":"Trước tiên đổi lượng sang kg hoặc l: 520 g = 0,520 kg, 300 ml = 0,3 l. Grundpreis = giá : lượng (tính bằng kg hoặc l)."},"type":"calc","parts":[{"q":{"de":"Eine Packung Kaffee (500 g) kostet 6,49 €. Berechne den Grundpreis je kg.","vi":"Eine Packung Kaffee (500 g) kostet 6,49 €. Berechne den Grundpreis je kg.\n🇻🇳 Một gói cà phê (500 g) có giá 6,49 €. Tính Grundpreis mỗi kg."},"u":"€","a":12.98,"tol":0.005,"steps":["6,49 : 0,5 = 12,98 € je kg"],"work":true},{"q":{"de":"Shampoo, 300 ml, 2,85 €. Berechne den Grundpreis je Liter.","vi":"Shampoo, 300 ml, 2,85 €. Berechne den Grundpreis je Liter.\n🇻🇳 Dầu gội, 300 ml, 2,85 €. Tính Grundpreis mỗi lít."},"u":"€","a":9.5,"tol":0.005,"steps":["2,85 : 0,3 = 9,50 € je l"],"work":true},{"q":{"de":"Orangensaft, 1,5 l, 2,19 €. Berechne den Grundpreis je Liter.","vi":"Orangensaft, 1,5 l, 2,19 €. Berechne den Grundpreis je Liter.\n🇻🇳 Nước cam, 1,5 l, 2,19 €. Tính Grundpreis mỗi lít."},"u":"€","a":1.46,"tol":0.005,"steps":["2,19 : 1,5 = 1,46 € je l"],"work":true},{"q":{"de":"Müsli, 750 g, 3,99 €. Berechne den Grundpreis je kg.","vi":"Müsli, 750 g, 3,99 €. Berechne den Grundpreis je kg.\n🇻🇳 Ngũ cốc, 750 g, 3,99 €. Tính Grundpreis mỗi kg."},"u":"€","a":5.32,"tol":0.005,"steps":["3,99 : 0,75 = 5,32 € je kg"],"work":true},{"q":{"de":"Welche Packung Nudeln ist günstiger? A: 500 g für 1,29 €. B: 1 kg für 2,49 €. Vergleiche über den Kilopreis: Um wie viel Euro je kg ist die günstigere Packung günstiger?","vi":"Welche Packung Nudeln ist günstiger? A: 500 g für 1,29 €. B: 1 kg für 2,49 €. Vergleiche über den Kilopreis: Um wie viel Euro je kg ist die günstigere Packung günstiger?\n🇻🇳 Gói mì nào rẻ hơn? A: 500 g giá 1,29 €. B: 1 kg giá 2,49 €. So sánh qua giá mỗi kg: gói rẻ hơn thì rẻ hơn bao nhiêu euro mỗi kg?"},"u":"€","a":0.09,"tol":0.005,"steps":[{"de":"A: 1,29 : 0,5 = 2,58 €/kg; B: 2,49 €/kg → B ist günstiger (um 0,09 € je kg).","vi":"A: 1,29 : 0,5 = 2,58 €/kg; B: 2,49 €/kg → B rẻ hơn (0,09 € mỗi kg)."}],"work":true}],"pts":5.5},{"id":"g3","no":"Aufgabe 4","title":{"de":"Fachgespräch-Karte: „Warum steht da ein Preis pro Kilo?“","vi":"Fachgespräch-Karte: „Warum steht da ein Preis pro Kilo?“ · Thẻ vấn đáp: „Vì sao ở đó có giá mỗi ki-lô?“"},"instr":{"de":"Eine Kundin steht vor dem Kaffeeregal: „Da steht 6,49 € und darunter 12,98 € pro Kilo. Muss ich jetzt 12,98 € bezahlen?“ Beantworte die Fragen. Wortgeländer: weil · damit · zum Beispiel · deshalb · im Vergleich zu · also.","vi":"Eine Kundin steht vor dem Kaffeeregal: „Da steht 6,49 € und darunter 12,98 € pro Kilo. Muss ich jetzt 12,98 € bezahlen?“ Beantworte die Fragen. Wortgeländer: weil · damit · zum Beispiel · deshalb · im Vergleich zu · also.\n🇻🇳 Một khách đứng trước kệ cà phê: „Ở đó ghi 6,49 € và bên dưới 12,98 € mỗi ki-lô. Vậy tôi phải trả 12,98 € à?“ Hãy trả lời các câu hỏi. Từ nối: weil · damit · zum Beispiel · deshalb · im Vergleich zu · also."},"tip":{"de":"Die Preisangabenverordnung schützt die Verbraucher: Preise sollen klar und vergleichbar sein. Pflicht sind der Endpreis (mit Umsatzsteuer) und der Grundpreis (je 1 kg oder 1 l).","vi":"Preisangabenverordnung bảo vệ người tiêu dùng: giá phải rõ ràng và so sánh được. Bắt buộc phải có Endpreis (đã gồm thuế) và Grundpreis (cho 1 kg hoặc 1 l)."},"type":"free","parts":[{"q":{"de":"Was antwortest du der Kundin? Schreibe in Kundensprache.","vi":"Was antwortest du der Kundin? Schreibe in Kundensprache.\n🇻🇳 Em trả lời khách thế nào? Viết bằng ngôn ngữ dành cho khách."},"m":{"de":"„Sie bezahlen nur 6,49 €. Die 12,98 € zeigen, was ein ganzes Kilo kosten würde. So sehen Sie sofort, welche Packung günstiger ist.“ In der Prüfung: Nach der Preisangabenverordnung muss bei Waren nach Gewicht oder Volumen neben dem Gesamtpreis der Grundpreis je 1 kg oder 1 l stehen, damit Kunden Preise vergleichen können.","vi":"„Sie bezahlen nur 6,49 €. Die 12,98 € zeigen, was ein ganzes Kilo kosten würde. So sehen Sie sofort, welche Packung günstiger ist.“ In der Prüfung: Nach der Preisangabenverordnung muss bei Waren nach Gewicht oder Volumen neben dem Gesamtpreis der Grundpreis je 1 kg oder 1 l stehen, damit Kunden Preise vergleichen können.\n🇻🇳 „Chị chỉ trả 6,49 €. Con số 12,98 € cho biết nguyên một ki-lô sẽ có giá bao nhiêu. Nhờ vậy chị thấy ngay gói nào rẻ hơn.“ Trong kỳ thi: theo Preisangabenverordnung, với hàng bán theo khối lượng hoặc thể tích, bên cạnh giá tổng phải ghi Grundpreis cho 1 kg hoặc 1 l để khách so sánh giá."},"w":["der Endpreis","der Grundpreis","vergleichen","die Packung"],"s":["Sie bezahlen nur …","Der Preis pro Kilo zeigt, …"]},{"q":{"de":"P1 Bei welchen Waren muss kein Grundpreis stehen?","vi":"P1 Bei welchen Waren muss kein Grundpreis stehen?\n🇻🇳 P1 Với những hàng nào thì không cần ghi Grundpreis?"},"m":{"de":"Wenn der Grundpreis mit dem Gesamtpreis übereinstimmt (z. B. genau 1 kg) oder wenn die Ware nicht nach Gewicht, Volumen, Länge oder Fläche angeboten wird (z. B. eine Jeans).","vi":"Wenn der Grundpreis mit dem Gesamtpreis übereinstimmt (z. B. genau 1 kg) oder wenn die Ware nicht nach Gewicht, Volumen, Länge oder Fläche angeboten wird (z. B. eine Jeans).\n🇻🇳 Khi Grundpreis trùng với giá tổng (ví dụ đúng 1 kg) hoặc khi hàng không được bán theo khối lượng, thể tích, chiều dài hay diện tích (ví dụ một chiếc quần jeans)."},"w":["die Stückware","das Gewicht","das Volumen","übereinstimmen"],"s":["Kein Grundpreis muss stehen, wenn …"]}],"pts":1},{"id":"g3_1","no":"Aufgabe 4","title":{"de":"Fachgespräch-Karte: „Warum steht da ein Preis pro Kilo?“","vi":"Fachgespräch-Karte: „Warum steht da ein Preis pro Kilo?“ · Thẻ vấn đáp: „Vì sao ở đó có giá mỗi ki-lô?“"},"instr":{"de":"Eine Kundin steht vor dem Kaffeeregal: „Da steht 6,49 € und darunter 12,98 € pro Kilo. Muss ich jetzt 12,98 € bezahlen?“ Beantworte die Fragen. Wortgeländer: weil · damit · zum Beispiel · deshalb · im Vergleich zu · also.","vi":"Eine Kundin steht vor dem Kaffeeregal: „Da steht 6,49 € und darunter 12,98 € pro Kilo. Muss ich jetzt 12,98 € bezahlen?“ Beantworte die Fragen. Wortgeländer: weil · damit · zum Beispiel · deshalb · im Vergleich zu · also.\n🇻🇳 Một khách đứng trước kệ cà phê: „Ở đó ghi 6,49 € và bên dưới 12,98 € mỗi ki-lô. Vậy tôi phải trả 12,98 € à?“ Hãy trả lời các câu hỏi. Từ nối: weil · damit · zum Beispiel · deshalb · im Vergleich zu · also."},"tip":{"de":"Rechne die Menge zuerst in kg oder l um: 520 g = 0,520 kg, 300 ml = 0,3 l. Grundpreis = Preis : Menge (in kg oder l).","vi":"Trước tiên đổi lượng sang kg hoặc l: 520 g = 0,520 kg, 300 ml = 0,3 l. Grundpreis = giá : lượng (tính bằng kg hoặc l)."},"type":"calc","parts":[{"q":{"de":"P2 Berechnen Sie den Grundpreis für 250 g zu 2,49 €.","vi":"P2 Berechnen Sie den Grundpreis für 250 g zu 2,49 €.\n🇻🇳 P2 Hãy tính Grundpreis cho 250 g giá 2,49 €."},"u":"€","a":9.96,"tol":0.005,"steps":["2,49 : 0,25 = 9,96 € je kg"]}],"pts":0.5},{"id":"g4","no":"Aufgabe 5","title":{"de":"Prüfungs-Check","vi":"Prüfungs-Check · Kiểm tra kiểu thi"},"instr":{"de":"6 Aufgaben · etwa 15 Minuten. So fragt die IHK in der Abschlussprüfung.","vi":"6 Aufgaben · etwa 15 Minuten. So fragt die IHK in der Abschlussprüfung.\n🇻🇳 6 bài · khoảng 15 phút. IHK hỏi như thế này trong kỳ thi tốt nghiệp."},"tip":{"de":"Die Preisangabenverordnung schützt die Verbraucher: Preise sollen klar und vergleichbar sein. Pflicht sind der Endpreis (mit Umsatzsteuer) und der Grundpreis (je 1 kg oder 1 l).","vi":"Preisangabenverordnung bảo vệ người tiêu dùng: giá phải rõ ràng và so sánh được. Bắt buộc phải có Endpreis (đã gồm thuế) và Grundpreis (cho 1 kg hoặc 1 l)."},"type":"free","parts":[{"q":{"de":"Sie sollen Preisschilder für eine Werbeaktion schreiben. Welche rechtliche Vorgabe müssen Sie beachten? (1 Punkt)","vi":"Sie sollen Preisschilder für eine Werbeaktion schreiben. Welche rechtliche Vorgabe müssen Sie beachten? (1 Punkt)\n🇻🇳 Em phải viết bảng giá cho một đợt quảng cáo. Em phải tuân theo quy định pháp lý nào? (1 điểm)"},"m":"die Preisangabenverordnung (PAngV)","w":["die Verordnung","das Preisschild"],"s":["Ich muss … beachten."]},{"q":{"de":"Nennen Sie zwei Angaben, die nach der Preisangabenverordnung auf Preisschildern stehen müssen. (2 Punkte)","vi":"Nennen Sie zwei Angaben, die nach der Preisangabenverordnung auf Preisschildern stehen müssen. (2 Punkte)\n🇻🇳 Nêu hai thông tin mà theo Preisangabenverordnung phải có trên bảng giá. (2 điểm)"},"m":{"de":"Endpreis (Bruttoverkaufspreis einschließlich Umsatzsteuer) · Grundpreis (je kg oder l) / Mengeneinheit / Gütebezeichnung","vi":"Endpreis (Bruttoverkaufspreis einschließlich Umsatzsteuer) · Grundpreis (je kg oder l) / Mengeneinheit / Gütebezeichnung\n🇻🇳 Endpreis (Bruttoverkaufspreis đã gồm thuế) · Grundpreis (cho mỗi kg hoặc l) / đơn vị đo lượng / hạng chất lượng"},"w":["die Umsatzsteuer","je kg","die Menge"],"s":["Erstens …","Zweitens …"]},{"q":{"de":"In Ihrer Abteilung sind die Waren nur am Regal, nicht auf jedem Artikel ausgezeichnet. Ein Kunde beschwert sich. Ist das zulässig? Begründen Sie. (3 Punkte)","vi":"In Ihrer Abteilung sind die Waren nur am Regal, nicht auf jedem Artikel ausgezeichnet. Ein Kunde beschwert sich. Ist das zulässig? Begründen Sie. (3 Punkte)\n🇻🇳 Ở quầy của em, hàng chỉ được ghi giá trên kệ, không ghi trên từng mặt hàng. Một khách phàn nàn. Như vậy có được phép không? Hãy giải thích. (3 điểm)"},"m":{"de":"Ja, das ist zulässig. Die Preisangabenverordnung erlaubt die Auszeichnung am Regal, wenn der Preis gut lesbar und eindeutig der Ware zugeordnet ist.","vi":"Ja, das ist zulässig. Die Preisangabenverordnung erlaubt die Auszeichnung am Regal, wenn der Preis gut lesbar und eindeutig der Ware zugeordnet ist.\n🇻🇳 Có, điều đó được phép. Preisangabenverordnung cho phép ghi giá trên kệ nếu giá dễ đọc và gắn rõ ràng với hàng."},"w":["zulässig","gut lesbar","zugeordnet","das Regal"],"s":["Ja / Nein, das ist …, weil …"]},{"q":{"de":"Am Regal ist ein Artikel mit 2,30 € ausgezeichnet. An der Kasse werden 3,20 € berechnet. Der Kunde besteht auf 2,30 €. a) Nennen Sie zwei mögliche Gründe für den Fehler. (2 Punkte) b) Erläutern Sie die Rechtslage. (3 Punkte) c) Wie verhalten Sie sich kundenorientiert? (2 Punkte)","vi":"Am Regal ist ein Artikel mit 2,30 € ausgezeichnet. An der Kasse werden 3,20 € berechnet. Der Kunde besteht auf 2,30 €. a) Nennen Sie zwei mögliche Gründe für den Fehler. (2 Punkte) b) Erläutern Sie die Rechtslage. (3 Punkte) c) Wie verhalten Sie sich kundenorientiert? (2 Punkte)\n🇻🇳 Trên kệ một mặt hàng được ghi giá 2,30 €. Ở quầy thu ngân tính 3,20 €. Khách nhất định đòi 2,30 €. a) Nêu hai lý do có thể gây ra lỗi. (2 điểm) b) Giải thích tình trạng pháp lý. (3 điểm) c) Em cư xử hướng đến khách hàng như thế nào? (2 điểm)"},"m":{"de":"a) Preis im Warenwirtschaftssystem geändert, Regalschild nicht ausgetauscht; Ware im falschen Regalfach; Tippfehler beim Schild. b) Die Preisauszeichnung ist nur eine Aufforderung, ein Angebot abzugeben. Der Kaufvertrag entsteht erst an der Kasse. Der Kunde hat keinen Rechtsanspruch auf den ausgezeichneten Preis. c) Entschuldigen, aus Kulanz den niedrigeren Preis gewähren (oder Rücksprache mit Vorgesetzten), Regalschild sofort berichtigen.","vi":"a) Preis im Warenwirtschaftssystem geändert, Regalschild nicht ausgetauscht; Ware im falschen Regalfach; Tippfehler beim Schild. b) Die Preisauszeichnung ist nur eine Aufforderung, ein Angebot abzugeben. Der Kaufvertrag entsteht erst an der Kasse. Der Kunde hat keinen Rechtsanspruch auf den ausgezeichneten Preis. c) Entschuldigen, aus Kulanz den niedrigeren Preis gewähren (oder Rücksprache mit Vorgesetzten), Regalschild sofort berichtigen.\n🇻🇳 a) Giá trong hệ thống quản lý hàng hóa đã đổi nhưng bảng giá trên kệ chưa thay; hàng nằm sai ngăn kệ; lỗi đánh máy trên bảng giá. b) Việc ghi giá chỉ là lời mời đưa ra đề nghị mua. Hợp đồng mua bán chỉ hình thành ở quầy thu ngân. Khách không có quyền pháp lý đòi giá đã ghi. c) Xin lỗi, vì chiều khách (Kulanz) mà bán theo giá thấp hơn (hoặc hỏi ý kiến cấp trên), sửa bảng giá trên kệ ngay."},"w":["das Regalschild","die Aufforderung","der Kaufvertrag","die Kulanz"],"s":["a) Ein Grund ist …","b) Das Preisschild ist nur …","c) Ich entschuldige mich und …"]}],"pts":4.5},{"id":"g4_1","no":"Aufgabe 5","title":{"de":"Prüfungs-Check","vi":"Prüfungs-Check · Kiểm tra kiểu thi"},"instr":{"de":"6 Aufgaben · etwa 15 Minuten. So fragt die IHK in der Abschlussprüfung.","vi":"6 Aufgaben · etwa 15 Minuten. So fragt die IHK in der Abschlussprüfung.\n🇻🇳 6 bài · khoảng 15 phút. IHK hỏi như thế này trong kỳ thi tốt nghiệp."},"tip":{"de":"Die Preisangabenverordnung schützt die Verbraucher: Preise sollen klar und vergleichbar sein. Pflicht sind der Endpreis (mit Umsatzsteuer) und der Grundpreis (je 1 kg oder 1 l).","vi":"Preisangabenverordnung bảo vệ người tiêu dùng: giá phải rõ ràng và so sánh được. Bắt buộc phải có Endpreis (đã gồm thuế) và Grundpreis (cho 1 kg hoặc 1 l)."},"type":"mc","qs":[{"q":{"de":"Welche Erläuterung zur Preisangabenverordnung ist richtig?","vi":"Welche Erläuterung zur Preisangabenverordnung ist richtig?\n🇻🇳 Lời giải thích nào về Preisangabenverordnung là đúng?"},"o":["Sie legt fest, wie hoch Preise sein dürfen.","Sie soll den Verbrauchern Preisinformationen geben und Preisvergleiche ermöglichen.","Sie gilt nur für Onlinehändler.","Sie schreibt vor, dass Preise mit ,99 enden.","Sie verbietet Sonderangebote."],"a":1,"why":{"de":"Verbraucherschutz durch Preisklarheit.","vi":"Bảo vệ người tiêu dùng nhờ giá rõ ràng."}}],"pts":1},{"id":"g4_2","no":"Aufgabe 5","title":{"de":"Prüfungs-Check","vi":"Prüfungs-Check · Kiểm tra kiểu thi"},"instr":{"de":"6 Aufgaben · etwa 15 Minuten. So fragt die IHK in der Abschlussprüfung.","vi":"6 Aufgaben · etwa 15 Minuten. So fragt die IHK in der Abschlussprüfung.\n🇻🇳 6 bài · khoảng 15 phút. IHK hỏi như thế này trong kỳ thi tốt nghiệp."},"tip":{"de":"Rechne für beide Packungen den Preis je 100 g aus. 500 g sind 5 · 100 g, 250 g sind 2,5 · 100 g.","vi":"Tính giá mỗi 100 g cho cả hai gói. 500 g là 5 · 100 g, 250 g là 2,5 · 100 g."},"type":"calc","parts":[{"q":{"de":"Honig wird in zwei Größen angeboten: 500 g für 6,00 € und 250 g für 3,50 €. Um wie viel Euro sind 100 g in der großen Packung günstiger?","vi":"Honig wird in zwei Größen angeboten: 500 g für 6,00 € und 250 g für 3,50 €. Um wie viel Euro sind 100 g in der großen Packung günstiger?\n🇻🇳 Mật ong được bán theo hai cỡ: 500 g giá 6,00 € và 250 g giá 3,50 €. 100 g trong gói lớn rẻ hơn bao nhiêu euro?"},"u":"€","a":0.2,"tol":0.005,"steps":[{"de":"500 g: 6,00 : 5 = 1,20 € je 100 g; 250 g: 3,50 : 2,5 = 1,40 € je 100 g; Unterschied 0,20 €","vi":"500 g: 6,00 : 5 = 1,20 € mỗi 100 g; 250 g: 3,50 : 2,5 = 1,40 € mỗi 100 g; chênh lệch 0,20 €"}],"work":true}],"pts":1},{"id":"g5","no":"Aufgabe 6","title":{"de":"Für Profis","vi":"Für Profis · Dành cho người giỏi"},"instr":{"de":"Zum Weiterdenken – ganze Sätze, mit Begründung.","vi":"Zum Weiterdenken – ganze Sätze, mit Begründung.\n🇻🇳 Để suy nghĩ thêm – viết câu đầy đủ, có giải thích."},"tip":{"de":"Die Preisangabenverordnung schützt die Verbraucher: Preise sollen klar und vergleichbar sein. Pflicht sind der Endpreis (mit Umsatzsteuer) und der Grundpreis (je 1 kg oder 1 l).","vi":"Preisangabenverordnung bảo vệ người tiêu dùng: giá phải rõ ràng và so sánh được. Bắt buộc phải có Endpreis (đã gồm thuế) và Grundpreis (cho 1 kg hoặc 1 l)."},"type":"free","parts":[{"q":{"de":"Ein Online-Shop zeigt den Preis „49,99 € zzgl. Versand“. Prüfen Sie, ob das mit der Preisangabenverordnung vereinbar ist.","vi":"Ein Online-Shop zeigt den Preis „49,99 € zzgl. Versand“. Prüfen Sie, ob das mit der Preisangabenverordnung vereinbar ist.\n🇻🇳 Một cửa hàng online ghi giá „49,99 € zzgl. Versand“ (chưa gồm phí gửi). Hãy kiểm tra xem điều đó có phù hợp với Preisangabenverordnung không."},"m":{"de":"Ja, wenn die Versandkosten klar genannt werden und der Preis die Umsatzsteuer enthält (Endpreis). Nur die Umsatzsteuer darf nicht „zzgl.“ sein.","vi":"Ja, wenn die Versandkosten klar genannt werden und der Preis die Umsatzsteuer enthält (Endpreis). Nur die Umsatzsteuer darf nicht „zzgl.“ sein.\n🇻🇳 Có, nếu phí gửi hàng được nêu rõ và giá đã gồm thuế (Endpreis). Chỉ riêng thuế thì không được ghi „zzgl.“."},"w":["die Versandkosten","der Endpreis","enthalten","zuzüglich"],"s":["Das ist vereinbar, wenn …"]},{"q":{"de":"Frau Kaya ist Kundin und will die Hose aus dem Schaufenster (Preisschild 39,99 €), an der Kasse kostet sie 49,99 €. Beurteilen Sie, ob Frau Kaya 39,99 € verlangen kann.","vi":"Frau Kaya ist Kundin und will die Hose aus dem Schaufenster (Preisschild 39,99 €), an der Kasse kostet sie 49,99 €. Beurteilen Sie, ob Frau Kaya 39,99 € verlangen kann.\n🇻🇳 Bà Kaya là khách và muốn mua chiếc quần trong tủ kính (bảng giá 39,99 €), ở quầy thu ngân nó có giá 49,99 €. Hãy đánh giá xem bà Kaya có thể đòi giá 39,99 € không."},"m":{"de":"Nein. Auch das Schaufensterschild ist nur eine Aufforderung zum Angebot; der Kaufvertrag entsteht an der Kasse. Kulanz ist aber sinnvoll, das Schild muss berichtigt werden.","vi":"Nein. Auch das Schaufensterschild ist nur eine Aufforderung zum Angebot; der Kaufvertrag entsteht an der Kasse. Kulanz ist aber sinnvoll, das Schild muss berichtigt werden.\n🇻🇳 Không. Bảng giá trong tủ kính cũng chỉ là lời mời đưa ra đề nghị mua; hợp đồng mua bán hình thành ở quầy thu ngân. Nhưng chiều khách là hợp lý, và bảng giá phải được sửa."},"w":["das Schaufenster","die Aufforderung","der Kaufvertrag","die Kulanz"],"s":["Nein, denn …","Trotzdem ist es sinnvoll, …"]}],"pts":2},{"id":"vg6","no":"Aufgabe 7","title":{"de":"Vertiefung","vi":"Vertiefung · Nâng cao"},"instr":{"de":"Nur in der Ebene „Vertiefung“. Begründe in ganzen Sätzen. Diese Aufgaben geben Bonuspunkte und senken deine 20 Punkte nie.","vi":"Nur in der Ebene „Vertiefung“. Begründe in ganzen Sätzen. Diese Aufgaben geben Bonuspunkte und senken deine 20 Punkte nie.\n🇻🇳 Chỉ ở mức „Vertiefung“. Giải thích bằng câu đầy đủ. Các bài này cho điểm thưởng và không bao giờ làm giảm 20 điểm của em."},"level":"v","tip":{"de":"Rechne die Menge zuerst in kg oder l um: 520 g = 0,520 kg, 300 ml = 0,3 l. Grundpreis = Preis : Menge (in kg oder l).","vi":"Trước tiên đổi lượng sang kg hoặc l: 520 g = 0,520 kg, 300 ml = 0,3 l. Grundpreis = giá : lượng (tính bằng kg hoặc l)."},"type":"free","parts":[{"q":{"de":"Warum hilft der Grundpreis den Kunden mehr als der Endpreis, wenn Packungen verschieden groß sind? Begründe mit dem Honig (500 g für 6,00 €, 250 g für 3,50 €).","vi":"Warum hilft der Grundpreis den Kunden mehr als der Endpreis, wenn Packungen verschieden groß sind? Begründe mit dem Honig (500 g für 6,00 €, 250 g für 3,50 €).\n🇻🇳 Vì sao Grundpreis giúp khách nhiều hơn Endpreis khi các gói có kích cỡ khác nhau? Giải thích bằng ví dụ mật ong (500 g giá 6,00 €, 250 g giá 3,50 €)."},"m":{"de":"Die Endpreise kann man nicht direkt vergleichen, weil die Mengen verschieden sind. Der Grundpreis rechnet beide auf dieselbe Menge um: 12,00 € je kg gegen 14,00 € je kg. So sieht man sofort, dass die große Packung günstiger ist.","vi":"Die Endpreise kann man nicht direkt vergleichen, weil die Mengen verschieden sind. Der Grundpreis rechnet beide auf dieselbe Menge um: 12,00 € je kg gegen 14,00 € je kg. So sieht man sofort, dass die große Packung günstiger ist.\n🇻🇳 Không thể so sánh trực tiếp các Endpreis vì lượng hàng khác nhau. Grundpreis quy cả hai về cùng một lượng: 12,00 € mỗi kg so với 14,00 € mỗi kg. Nhờ đó thấy ngay gói lớn rẻ hơn."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Warum ist „5,99 € zzgl. MwSt.“ auf einem Preisschild im Laden nicht erlaubt? Begründe.","vi":"Warum ist „5,99 € zzgl. MwSt.“ auf einem Preisschild im Laden nicht erlaubt? Begründe.\n🇻🇳 Vì sao „5,99 € zzgl. MwSt.“ trên bảng giá trong cửa hàng là không được phép? Hãy giải thích."},"m":{"de":"Verbraucher müssen den Endpreis sehen, also den Preis, den sie wirklich zahlen – mit Umsatzsteuer. Sonst müssten sie selbst rechnen und könnten Preise nicht klar erkennen und vergleichen.","vi":"Verbraucher müssen den Endpreis sehen, also den Preis, den sie wirklich zahlen – mit Umsatzsteuer. Sonst müssten sie selbst rechnen und könnten Preise nicht klar erkennen und vergleichen.\n🇻🇳 Người tiêu dùng phải thấy Endpreis, tức là giá họ thực sự trả – đã gồm thuế. Nếu không họ phải tự tính và không thể nhận ra và so sánh giá một cách rõ ràng."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Was würde passieren, wenn ein falsches Regalschild nicht sofort berichtigt wird? Begründe.","vi":"Was würde passieren, wenn ein falsches Regalschild nicht sofort berichtigt wird? Begründe.\n🇻🇳 Điều gì xảy ra nếu một bảng giá sai trên kệ không được sửa ngay? Hãy giải thích."},"m":{"de":"Weitere Kunden sehen den falschen Preis und beschweren sich an der Kasse. Das kostet Zeit, verärgert Kunden und schadet dem Image. Außerdem entspricht das Schild nicht der Preisangabenverordnung, weil der Preis nicht stimmt.","vi":"Weitere Kunden sehen den falschen Preis und beschweren sich an der Kasse. Das kostet Zeit, verärgert Kunden und schadet dem Image. Außerdem entspricht das Schild nicht der Preisangabenverordnung, weil der Preis nicht stimmt.\n🇻🇳 Những khách khác thấy giá sai và phàn nàn ở quầy thu ngân. Điều đó tốn thời gian, làm khách bực mình và hại đến hình ảnh cửa hàng. Ngoài ra bảng giá không đúng với Preisangabenverordnung vì giá không chính xác."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":3}]};

<script>

const UI={

 name:{de:'Name',vi:'Họ và tên'},date:{de:'Datum',vi:'Ngày'},can:{de:'Das kann ich danach',vi:'Sau bài này em có thể'},
 eval:{de:'Auswertung anzeigen',vi:'Xem kết quả'},pdf:{de:'Als PDF speichern / drucken',vi:'Lưu PDF / in ra'},
 restart:{de:'Neu starten',vi:'Làm lại từ đầu'},ask:{de:'Alles löschen und neu anfangen? Deine Antworten in diesem Arbeitsblatt gehen verloren.',vi:'Xóa hết và bắt đầu lại? Các câu trả lời của em trong phiếu này sẽ mất.'},
 yes:{de:'Ja, löschen',vi:'Có, xóa'},no:{de:'Abbrechen',vi:'Hủy'},
 rate:{de:'Wie gut war deine Antwort? Vergleiche mit der Musterlösung.',vi:'Câu trả lời của em tốt đến đâu? Hãy so với bài mẫu.'},
 y:{de:'Geschafft',vi:'Đạt'},p:{de:'Teilweise',vi:'Một phần'},n:{de:'Noch nicht',vi:'Chưa đạt'},

 res:{de:'Deine Auswertung',vi:'Kết quả của em'},pts:{de:'Punkte',vi:'điểm'},bonus:{de:'Bonus (Vertiefung)',vi:'Điểm thưởng (Nâng cao)'},
 mine:{de:'Deine Antwort',vi:'Câu trả lời của em'},sol:{de:'Richtige Lösung',vi:'Đáp án đúng'},why:{de:'Erklärung',vi:'Giải thích'},
 path:{de:'Rechenweg',vi:'Cách tính'},empty:{de:'(keine Antwort)',vi:'(chưa trả lời)'},

 level:{de:'Ebene',vi:'Mức độ'},selfeval:{de:'Selbsteinschätzung',vi:'Tự đánh giá'},unrated:{de:'noch nicht eingeschätzt',vi:'chưa tự đánh giá'},
 of:{de:'von',vi:'trên'},right:{de:'richtig',vi:'đúng'},found:{de:'Schlüsselbegriffe gefunden',vi:'từ khóa đã tìm thấy'},extra:{de:'zu viel markiert',vi:'đánh dấu thừa'},
 allright:{de:'Alles richtig!',vi:'Tất cả đều đúng!'},notall:{de:'Noch nicht alles richtig. Rot = falsch. Versuche es noch einmal.',vi:'Chưa đúng hết. Màu đỏ = sai. Em thử lại nhé.'},

 readfb:{de:'Lesetraining (ohne Punkte)',vi:'Luyện đọc (không tính điểm)'},hint:{de:'Mit Hilfe von Claude erstellt – bitte prüfen lassen.',vi:''},
 done:{de:'bearbeitet',vi:'đã làm'},
 printhint:{de:'Tipp: Im Druckfenster „Als PDF sichern“ wählen.',vi:'Gợi ý: Trong cửa sổ in, chọn “Lưu dưới dạng PDF”.'}
};
UI.bonusw={de:'Bonus',vi:'Điểm thưởng'};UI.workph={de:'Rechenweg (aufschreiben)',vi:'Cách tính (viết ra)'};
if(D.ui)for(const l in D.ui)for(const k in D.ui[l]){if(UI[k])UI[k][l]=D.ui[l][k]}
const RTL={ar:1};
const u=k=>UI[k][S.lang]||UI[k].de;
const T=x=>x==null?'':typeof x==='string'?x:(x[S.lang]||x.de||'');
function def(){return{lang:'de',level:'b',name:'',date:new Date().toLocaleDateString('de-DE'),ans:{},checked:{},shown:{},can:{},sub:false}}
let S=def();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(def(),o);return true}}catch(e){}return false}
let st=null;function save(){clearTimeout(st);st=setTimeout(saveNow,400)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function clearStore(){try{localStorage.removeItem(KEY)}catch(e){}}
const A=id=>S.ans[id]||(S.ans[id]={});
function hashSeed(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9%€., ]/g,' ').replace(/\s+/g,' ').trim()}
function num(s){s=String(s==null?'':s).replace(/[€%\s]|[a-zA-Z²³]+/g,'');if(!s)return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const fnum=n=>n.toLocaleString('de-DE',{maximumFractionDigits:4});
/* ---------- Teile je Typ ---------- */
function cells(it){const o=[];it.rows.forEach((r,ri)=>r.forEach((c,ci)=>{if(c&&typeof c==='object')o.push({ri,ci,a:c.a,o:c.o||(it.colOpts||[])[ci],typed:c.typed,why:c.why})}));return o}
function parts(it){switch(it.type){case'mc':return it.qs;case'tf':return it.st;case'gap':return it.gaps;case'match':return it.rows;case'table':return cells(it);case'calc':case'free':return it.parts;default:return[]}}
function matchOpts(it){return shuf([...new Set(it.rows.map(r=>r.a).concat(it.extra||[]))],it.id)}
function visible(it){return it.level==='v'?S.level==='v':true}
function scored(it){return['mc','tf','gap','match','table','calc','free'].indexOf(it.type)>=0}
function counted(it){return scored(it)||it.type==='read'}
/* ---------- Bewertung ---------- */
function mcTxt(p,idx){return String(idx).split(',').filter(x=>x!=='').map(i=>p.o[+i]).join(' / ')}
function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='de'?'Bonus':u('bonusw')):fmt(it.pts)+' '+(S.lang==='de'?(it.pts===1?'Punkt':'Punkte'):u('pts'))}
function sum(it){return (it.sum&&it.sum[S.lang])||(S.lang==='vi'?it.vi:'')||''}
function autoDir(){if(!RTL[S.lang])return;$$('p,h1,h2,h3,h4,li,summary,label,.info,.vis,.qt,.st,.instr,.opt span,.chip,.fb,.model,.sub,.cnt').forEach(e=>e.setAttribute('dir','auto'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(sum(it)?`<div class="vis" lang="${S.lang}">${rich(sum(it))}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang;
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 autoDir();progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
