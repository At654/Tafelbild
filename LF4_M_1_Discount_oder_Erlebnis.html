.seg button{border:2px solid #b9b19d;background:#fff;border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg button.on .tl{color:#dfe6fb}
.opt{display:block;width:100%;text-align:left;border:2px solid #c9c1ad;background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#dcefdf}
.opt.wrong{border-color:var(--bad);background:#f6dada}
.note{margin:10px 0;font-size:15px;padding:10px 12px;border-radius:10px}
.note.good{background:#dcefdf;border-left:5px solid var(--ok)}
.note.bad{background:#f6dada;border-left:5px solid var(--bad)}
.stars{color:var(--gold);letter-spacing:3px}
.end{text-align:center}
.end h2{font-size:30px}
.end table{width:100%;border-collapse:collapse;margin:12px 0;text-align:left}
.end td{padding:6px 4px;border-bottom:1px solid #e3ddcd;vertical-align:top}
.merke{background:#fdf0cc;border-radius:10px;padding:10px 12px;text-align:left;margin:12px 0}

.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#555}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .3s ease-out}
.tl[dir=rtl]{text-align:right}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.side{border-radius:10px;padding:8px 10px;font-size:14px}
.side small{display:block;color:#555}
.side.d{background:#fff1d6;border:2px solid #e2b04a}
.side.e{background:#e6edfb;border:2px solid #7d95d6;text-align:right}
.stage{min-height:250px;display:flex;align-items:center;justify-content:center;padding:6px 0}
.scard{width:100%;max-width:420px;background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:22px 20px;text-align:center;touch-action:none;user-select:none;cursor:grab;transition:transform .25s}
.scard .em{font-size:70px;line-height:1}
.scard .txt{font-size:21px;font-weight:700;margin-top:10px;font-family:Georgia,serif}

.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.sd{background:#c98a12;box-shadow:0 3px 0 #8a5d08}

.mini{background:#fff;border-radius:12px;padding:10px 12px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
h4{margin:12px 0 4px}

  w:["Ein Zusatzangebot: Die Eltern kaufen in Ruhe ein und bleiben länger.","Un servicio extra: los padres compran tranquilos y se quedan más tiempo.","Um serviço extra: os pais compram com calma e ficam mais tempo.","Дополнительная услуга: родители спокойно покупают и остаются дольше.","ተወሳኺ ኣገልግሎት፡ ወለዲ ብህድኣት ይዕድጉ፡ ነዊሕ ድማ ይጸንሑ።","Ek hizmet: Ebeveynler rahatça alışveriş yapar ve daha uzun kalır.","Dịch vụ thêm: bố mẹ mua sắm thong thả và ở lại lâu hơn.","عرض إضافي: يتسوّق الأهل بهدوء ويبقون وقتًا أطول."],
  x:["Kinderbetreuung macht die Preise niedriger.","El cuidado de niños baja los precios.","O cuidado de crianças baixa os preços.","Присмотр за детьми снижает цены.","ምክንኻን ቆልዑ ዋጋታት የንኣኣስ።","Çocuk bakımı fiyatları düşürür.","Trông trẻ làm giá thấp hơn.","رعاية الأطفال تجعل الأسعار أقل."]},
 {e:"🔁",a:0,t:["Kaum Dekoration, das Sortiment ist klein und wechselt selten.","Casi sin decoración; el surtido es pequeño y cambia poco.","Quase sem decoração; o sortido é pequeno e muda pouco.","Почти нет декора, ассортимент маленький и редко меняется.","መጌጽ ዳርጋ የለን፡ እቲ ዓይነት ኣቕሑ ንእሽቶ እዩ፡ ሳሕቲ ድማ ይቕየር።","Neredeyse hiç dekorasyon yok, ürün yelpazesi küçük ve nadiren değişiyor.","Hầu như không trang trí, danh mục hàng nhỏ và ít thay đổi.","ديكور شبه معدوم، والتشكيلة صغيرة وتتغيّر نادرًا."],
  w:["Wenig Aufwand und große Mengen weniger Artikel – so kauft der Laden günstig ein.","Poco esfuerzo y grandes cantidades de pocos artículos; así la tienda compra barato.","Pouco esforço e grandes quantidades de poucos artigos; assim a loja compra barato.","Мало затрат и большие объёмы немногих товаров — так магазин дёшево закупает.","ውሑድ ጻዕርን ብዙሕ ብዝሒ ውሑዳት ኣቕሑን – ከምዚ እቲ ድኳን ብሕሱር ይዕድግ።","Az çaba ve az çeşitten büyük miktarlar – böylece mağaza ucuza satın alır.","Ít công sức và số lượng lớn của ít mặt hàng – nhờ vậy cửa hàng nhập hàng rẻ.","جهد قليل وكميات كبيرة من أصناف قليلة – وهكذا يشتري المتجر بسعر رخيص."],

const LSKEY="sw_lang";

const LANGSET=[["de","Deutsch"],["es","Español"],["pt","Português"],["ru","Русский"],["ti","ትግርኛ"],["tr","Türkçe"],["vi","Tiếng Việt"],["ar","العربية"]];
const LANGS=(typeof LANGSET!=="undefined")?LANGSET:[["de","Deutsch"],["es","Español"],["pt","Português"],["ru","Русский"],["ti","ትግርኛ"]];
const LI={};LANGS.slice(1).forEach((l,i)=>LI[l[0]]=i);
let lang="de";
try{const s=localStorage.getItem(LSKEY);if(s&&LANGS.some(l=>l[0]===s))lang=s;}catch(e){}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tl=a=>{if(lang==="de"||!a)return "";const s=a[LI[lang]+1];return s?`<span class="tl" lang="${lang}" dir="${lang==="ar"?"rtl":"ltr"}">${esc(s)}</span>`:"";};
const L=a=>esc(a[0])+tl(a);
const T=k=>L(U[k]);
const D=k=>U[k][0];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function head(){
  $("sub").innerHTML=T("sub");
  $("langs").innerHTML=LANGS.map(([c,n])=>`<button class="${c===lang?"on":""}" data-l="${c}">${n}</button>`).join("");
  $("langs").querySelectorAll("button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem(LSKEY,lang);}catch(e){}render();});
}
function startScreen(S,onGo,extra){
  return `<div class="pop"><h2>${D("head")}</h2>${tl(U.head)}<p>${T("intro")}</p>${extra||""}
  <label><b>${D("name")}</b>${tl(U.name)}</label><input class="nm" id="nm" maxlength="30" value="${esc(S.name)}" autocomplete="off">
  <b>${D("stufe")}</b>${tl(U.stufe)}<div class="seg"><button id="b0" class="${S.profi?"":"on"}">${T("basis")}</button><button id="b1" class="${S.profi?"on":""}">${T("profi")}</button></div>
  <button class="btn gold" id="go">${T("los")}</button></div>`;
}
function bindStart(S,onGo){
  $("nm").oninput=e=>S.name=e.target.value;
  $("b0").onclick=()=>{S.profi=false;render();};
  $("b1").onclick=()=>{S.profi=true;render();};
  $("go").onclick=()=>{S.name=$("nm").value.trim();onGo();};
}
let cfStop=false;
function confetti(){
  cfStop=false;const c=$("cf");c.style.display="block";const x=c.getContext("2d");
  let W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#b8901c","#13275a","#a32626","#2d6b3a","#e7c35a","#22508f","#f28c28","#d94f8c","#3fb6a8"];
  const P=[];for(let i=0;i<320;i++)P.push({x:Math.random()*W,y:-Math.random()*H*1.3,w:6+Math.random()*8,h:9+Math.random()*10,vy:2.2+Math.random()*3.8,vx:-1.5+Math.random()*3,r:Math.random()*6.28,vr:-.22+Math.random()*.44,c:cols[i%cols.length],s:Math.random()*6.28,round:Math.random()<.25});
  const t0=performance.now();
  function f(t){
    if(cfStop){x.clearRect(0,0,W,H);c.style.display="none";return;}
    x.clearRect(0,0,W,H);let alive=false;
    for(const p of P){p.y+=p.vy;p.x+=p.vx+Math.sin(t/380+p.s)*1.3;p.r+=p.vr;
      if(t-t0<5000&&p.y>H+20){p.y=-20;p.x=Math.random()*W;}
      if(p.y<H+20)alive=true;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,6.28);x.fill();}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.max(.15,Math.abs(Math.cos(p.r*1.3))));
      x.restore();}
    if(alive)requestAnimationFrame(f);else c.style.display="none";
  }
  requestAnimationFrame(f);
}

let S={screen:"start",name:"",profi:false,order:[],i:0,phase:"swipe",choice:null,rq:null,ropts:[],pts:0,ok:0,log:[]};
const N=CARDS.length;
const card=()=>CARDS[S.order[S.i]];

function renderGame(){
  const c=card(),m=$("main");
  let h=`<div class="meta"><span>${D("karte")} ${S.i+1} ${D("von")} ${N}</span><span>${S.pts} ${D("punkte")}</span></div><div class="prog"><i style="width:${S.i/N*100}%"></i></div>`;
  h+=`<div class="sides"><div class="side d"><b>🏷️ ${D("disc")}</b>${tl(U.disc)}<small>${D("dhint")}</small>${tl(U.dhint)}</div><div class="side e"><b>✨ ${D("erl")}</b>${tl(U.erl)}<small>${D("ehint")}</small>${tl(U.ehint)}</div></div>`;
  if(S.phase==="swipe")h+=`<div class="stage"><div class="scard" id="sc"><div class="em">${c.e}</div><div class="txt">${esc(c.t[0])}</div>${tl(c.t)}<div class="hint">⬅️ 🏷️ · ✨ ➡️</div></div></div>`;
  if(S.phase==="swipe"){
    h+=`<div class="sbtns"><button class="btn sd" id="bd">⬅️ 🏷️ ${D("disc")}</button><button class="btn se" id="be">✨ ${D("erl")} ➡️</button></div>`;
  } else {
    const ok=S.choice===c.a;
    h+=`<div class="pop"><div class="mini">${c.e} ${esc(c.t[0])}${tl(c.t)}</div>`;
    h+=`<div class="note ${ok?"good":"bad"}"><b>${ok?"✔ "+D("richtig"):"✘ "+D("falsch")}</b>${tl(U[ok?"richtig":"falsch"])}<div>${D("strategie")} <b>${c.a?"✨ "+D("erl"):"🏷️ "+D("disc")}</b>${tl([U.strategie[0]].concat(U.strategie.slice(1).map((s,k)=>s+" "+(c.a?U.erl:U.disc)[k+1])))}</div>`;
    if(!S.profi||S.rq!==null)h+=`<div style="margin-top:6px">💡 ${L(c.w)}</div>`;
    h+=`</div>`;
    if(S.profi&&S.rq===null){
      h+=`<h4>${D("warum")}${tl(U.warum)}</h4>`;
      S.ropts.forEach((r,k)=>{h+=`<button class="opt" data-r="${k}">${L(r?c.w:c.x)}</button>`;});
    } else {
      if(S.profi){const rok=S.ropts[S.rq]===1;h+=`<div class="note ${rok?"good":"bad"}">${D("warum")} ${rok?"✔":"✘"}</div>`;}
      h+=`<button class="btn ${S.i===N-1?"gold":""}" id="nx">${T("weiter")}</button>`;
    }
    h+=`</div>`;
  }
  m.innerHTML=h;
  if(S.phase==="swipe"){
    $("bd").onclick=()=>decide(0);$("be").onclick=()=>decide(1);
    drag($("sc"));
  }
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.rq=+b.dataset.r;if(S.ropts[S.rq]===1){S.pts+=50;}S.log[S.log.length-1].r=S.ropts[S.rq]===1;renderGame();});
  if($("nx"))$("nx").onclick=next;
}
function drag(el){
  let x0=null,dx=0;
  el.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;el.setPointerCapture(e.pointerId);el.style.transition="none";});
  el.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;el.style.background=dx<-30?"#fff1d6":dx>30?"#e6edfb":"#fff";});
  const up=()=>{if(x0===null)return;x0=null;el.style.transition="transform .25s";
    if(dx<-90)decide(0);else if(dx>90)decide(1);else{el.style.transform="";el.style.background="#fff";}};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
function decide(a){
  const el=$("sc");
  if(el){el.style.transition="transform .3s, opacity .3s";el.style.transform=`translateX(${a?400:-400}px) rotate(${a?25:-25}deg)`;el.style.opacity="0";}
  const c=card(),ok=a===c.a;
  if(ok){S.pts+=100;S.ok++;}
  S.log.push({e:c.e,t:c.t,ok,r:null});
  S.choice=a;S.rq=null;S.ropts=shuffle([1,0]);
  setTimeout(()=>{S.phase="result";renderGame();},280);
}
function next(){
  if(S.i<N-1){S.i++;S.phase="swipe";renderGame();window.scrollTo(0,0);}
  else{S.screen="end";render();confetti();}
}
function renderEnd(){
  const tk=S.ok>=N-1?"t3":S.ok>=N-4?"t2":"t1";
  let h=`<div class="end pop"><div style="font-size:60px">🏆</div><h2>${D("geschafft")}</h2>${tl(U.geschafft)}`;
  if(S.name)h+=`<div style="font-size:20px;font-weight:700">${esc(S.name)}</div>`;
  h+=`<div class="stars" style="font-size:30px">✔ ${S.ok} / ${N}</div><div style="font-size:20px;font-weight:700">${S.pts} ${D("punkte")}</div><div style="font-size:22px;margin-top:6px"><b>${D(tk)}</b>${tl(U[tk])}</div><table>`;
  for(const r of S.log)h+=`<tr><td>${r.e}</td><td>${esc(r.t[0])}</td><td>${r.ok?"✔":"✘"}${r.r===null?"":r.r?" ✔":" ✘"}</td></tr>`;
  h+=`</table><div class="merke"><b>💡 ${D("merke")}</b>${tl(U.merke)}<div>${esc(U.merktext[0])}</div>${tl(U.merktext)}</div><button class="btn gold" id="again">${T("neustart")}</button></div>`;
  $("main").innerHTML=h;window.scrollTo(0,0);
  $("again").onclick=()=>{cfStop=true;S.screen="start";render();};
}
function render(){
  head();
  if(S.screen==="start"){$("main").innerHTML=startScreen(S)+"";bindStart(S,()=>{S.order=shuffle(CARDS.map((_,i)=>i));S.i=0;S.pts=0;S.ok=0;S.log=[];S.phase="swipe";S.screen="game";render();});}
  else if(S.screen==="game")renderGame();
  else renderEnd();
}
render();

</script>
