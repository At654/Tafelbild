:"Ankommen: Was weißt du noch aus Modul 2? · Khởi động: em còn nhớ gì từ mô-đun 2?"},"tip":{"de":"Halte die Reihenfolge ein: erst Rabatt, dann Skonto, dann Bezugskosten. Kette: Menge · Preis · Rabatt-Faktor · Skonto-Faktor + Bezugskosten. Immer ohne Umsatzsteuer. Für ein Stück: am Ende durch die Stückzahl teilen.","vi":"Giữ đúng thứ tự: trước tiên Rabatt, sau đó Skonto, rồi Bezugskosten. Chuỗi tính: số lượng · giá · hệ số Rabatt · hệ số Skonto + Bezugskosten. Luôn không có thuế. Cho một chiếc: cuối cùng chia cho số lượng."},"type":"calc","parts":[{"q":{"de":"40 Stück zu je 10,00 €, 20 % Rabatt, 10,00 € Fracht. Bezugspreis je Stück?","vi":"40 Stück zu je 10,00 €, 20 % Rabatt, 10,00 € Fracht. Bezugspreis je Stück?\n🇻🇳 40 chiếc, mỗi chiếc 10,00 €, 20 % Rabatt, 10,00 € cước. Bezugspreis mỗi chiếc?"},"u":"€","a":8.25,"tol":0.005,"steps":["40 · 10,00 · 0,8 + 10,00 = 330,00 € : 40 = 8,25 €"]}],"pts":0.5},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher · Wortspeicher (kho từ)"},"html":"<p>der Bezugspreis · die Handlungskosten · die Selbstkosten · der Gewinn · der Nettoverkaufspreis · die Umsatzsteuer · der Bruttoverkaufspreis · der Wareneinsatz · der Handlungskostenzuschlag · der Gewinnzuschlag · die Preisuntergrenze · der Verlust</p>","vi":"Bezugspreis = giá nhập hàng · Handlungskosten = chi phí hoạt động của doanh nghiệp · Selbstkosten = giá thành (Bezugspreis + Handlungskosten) · Gewinn = lợi nhuận · Nettoverkaufspreis = giá bán chưa thuế · Umsatzsteuer = thuế doanh thu · Bruttoverkaufspreis = giá bán đã có thuế · Wareneinsatz = giá vốn hàng đã bán · Handlungskostenzuschlag = tỉ lệ cộng thêm cho Handlungskosten · Gewinnzuschlag = tỉ lệ cộng thêm cho lợi nhuận · Preisuntergrenze = mức giá thấp nhất · Verlust = lỗ"},{"id":"r1","no":"Lesen 1","type":"read","title":{"de":"Vier Teile in jedem Preis","vi":"Vier Teile in jedem Preis · Bốn phần trong mỗi giá bán"},"instr":{"de":"Markiere die vier Teile, aus denen jeder Verkaufspreis besteht.","vi":"Markiere die vier Teile, aus denen jeder Verkaufspreis besteht.\n🇻🇳 Đánh dấu bốn phần tạo nên mỗi giá bán."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Der [[Bezugspreis]] ist das, was die Ware im Einkauf gekostet hat. Dazu kommen die [[Handlungskosten]]. Das sind alle Kosten im eigenen Betrieb: Personal, Miete, Energie, Werbung, Lager, Versicherungen, Büro. Bezugspreis und Handlungskosten zusammen sind die Selbstkosten. Dazu kommt der [[Gewinn]]. Er ist der Lohn für den Unternehmer und das Risiko. Am Ende kommt die [[Umsatzsteuer]] dazu. Sie geht an das Finanzamt. Der Skonto ist kein Teil des Verkaufspreises."],"vi":"Bezugspreis là số tiền hàng hóa đã tốn khi mua vào. Cộng thêm Handlungskosten. Đó là mọi chi phí trong doanh nghiệp: nhân sự, tiền thuê, điện năng, quảng cáo, kho, bảo hiểm, văn phòng. Bezugspreis và Handlungskosten cộng lại là Selbstkosten. Cộng thêm Gewinn. Đó là tiền công cho chủ doanh nghiệp và cho rủi ro. Cuối cùng cộng Umsatzsteuer. Nó được nộp cho sở thuế. Skonto không phải là một phần của giá bán.","quiz":{"q":"Bezugspreis + Handlungskosten = …?","o":["Selbstkosten","Nettoverkaufspreis","Bruttoverkaufspreis"],"a":0,"why":{"de":"Richtig ist: Selbstkosten","vi":"Đáp án đúng: Selbstkosten"}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Bezugskosten oder Handlungskosten?","vi":"Bezugskosten oder Handlungskosten? · Bezugskosten hay Handlungskosten?"},"instr":{"de":"Markiere nur die Bezugskosten.","vi":"Markiere nur die Bezugskosten.\n🇻🇳 Chỉ đánh dấu các Bezugskosten."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Bezugskosten erhöhen den Bezugspreis. Dazu gehören [[Fracht]], [[Porto]], [[Rollgeld]], die Verpackung des Lieferanten, die [[Transportversicherung]] und [[Zoll]]. Handlungskosten entstehen im eigenen Betrieb. Dazu gehören Löhne und Gehälter, Miete, Energie, Werbung, Lagerkosten und Reparaturen. Faustregel: Alles, was anfällt, bis die Ware bei uns ankommt, sind Bezugskosten. Alles, was danach im Betrieb anfällt, sind Handlungskosten."],"vi":"Bezugskosten làm tăng Bezugspreis. Thuộc về đó là Fracht (cước), Porto (bưu phí), Rollgeld (phí chở đến), bao bì của nhà cung cấp, Transportversicherung (bảo hiểm vận chuyển) và Zoll (thuế hải quan). Handlungskosten phát sinh trong doanh nghiệp. Thuộc về đó là lương, tiền thuê, điện năng, quảng cáo, chi phí kho và sửa chữa. Quy tắc dễ nhớ: mọi thứ phát sinh cho đến khi hàng về tới chỗ chúng ta là Bezugskosten. Mọi thứ phát sinh sau đó trong doanh nghiệp là Handlungskosten.","quiz":{"q":{"de":"Die Miete für das Lager ist …","vi":"Die Miete für das Lager ist …\n🇻🇳 Tiền thuê kho là …"},"o":["Bezugskosten","Handlungskosten","Gewinn"],"a":1,"why":{"de":"Richtig ist: Handlungskosten","vi":"Đáp án đúng: Handlungskosten"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"Zuschläge und Preisuntergrenze","vi":"Zuschläge und Preisuntergrenze · Các tỉ lệ cộng thêm và mức giá thấp nhất"},"instr":{"de":"Markiere die beiden Formeln und die Preisuntergrenze.","vi":"Markiere die beiden Formeln und die Preisuntergrenze.\n🇻🇳 Đánh dấu hai công thức và mức giá thấp nhất."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Den Handlungskostenzuschlag in Prozent berechnest du so: [[Handlungskosten : Wareneinsatz · 100]]. Der Wareneinsatz sind die Bezugspreise aller verkauften Waren. Den Gewinnzuschlag in Prozent berechnest du so: [[Gewinn : Selbstkosten · 100]]. Die Preisuntergrenze sind die [[Selbstkosten plus Umsatzsteuer]]. Verkauft der Betrieb darunter, macht er mit diesem Artikel Verlust. Die Preisuntergrenze ist nicht der Listeneinkaufspreis."],"vi":"Handlungskostenzuschlag theo phần trăm được tính như sau: Handlungskosten : Wareneinsatz · 100. Wareneinsatz là tổng Bezugspreis của tất cả hàng đã bán. Gewinnzuschlag theo phần trăm được tính như sau: Gewinn : Selbstkosten · 100. Preisuntergrenze là Selbstkosten cộng Umsatzsteuer. Nếu doanh nghiệp bán dưới mức đó thì bị lỗ với mặt hàng này. Preisuntergrenze không phải là Listeneinkaufspreis.","quiz":{"q":{"de":"Worauf bezieht sich der Handlungskostenzuschlag?","vi":"Worauf bezieht sich der Handlungskostenzuschlag?\n🇻🇳 Handlungskostenzuschlag được tính trên cái gì?"},"o":["auf den Umsatz","auf den Wareneinsatz","auf den Gewinn"],"a":1,"why":{"de":"Richtig ist: auf den Wareneinsatz","vi":"Đáp án đúng: auf den Wareneinsatz"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Wohin geht mein Euro? Das Hemd für 27,69 €</h4><p>Einkauf (Bezugspreis): 14,50 €</p><p>Kosten im Betrieb (Handlungskosten): 7,25 €</p><p>Gewinn: 1,52 €</p><p>Staat (Umsatzsteuer): 4,42 € · Summe: 27,69 €</p><h4>Vier Teile in jedem Preis</h4><p>Bezugspreis + Handlungskosten = Selbstkosten</p><p>Selbstkosten + Gewinn = Nettoverkaufspreis</p><p>Nettoverkaufspreis + Umsatzsteuer (19 %, bei Lebensmitteln und Büchern 7 %) = Bruttoverkaufspreis</p><p><b>Merke:</b> Preis = Bezugspreis + Handlungskosten + Gewinn + Umsatzsteuer. Bezugskosten gehören zum Einkauf, Handlungskosten zum eigenen Betrieb. Handlungskostenzuschlag = Handlungskosten : Wareneinsatz · 100.</p>","vi":"Đồng euro của tôi đi đâu? Chiếc áo sơ mi giá 27,69 €\nMua vào (Bezugspreis): 14,50 €\nChi phí trong doanh nghiệp (Handlungskosten): 7,25 €\nLợi nhuận (Gewinn): 1,52 €\nNhà nước (Umsatzsteuer): 4,42 € · Tổng: 27,69 €\nBốn phần trong mỗi giá bán\nBezugspreis + Handlungskosten = Selbstkosten\nSelbstkosten + Gewinn = Nettoverkaufspreis\nNettoverkaufspreis + Umsatzsteuer (19 %, với thực phẩm và sách là 7 %) = Bruttoverkaufspreis\nGhi nhớ: Giá = Bezugspreis + Handlungskosten + Gewinn + Umsatzsteuer. Bezugskosten thuộc về việc mua hàng, Handlungskosten thuộc về chính doanh nghiệp. Handlungskostenzuschlag = Handlungskosten : Wareneinsatz · 100."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: der Handlungskostenzuschlag der Sportabteilung","vi":"Vorgemacht: der Handlungskostenzuschlag der Sportabteilung · Làm mẫu: Handlungskostenzuschlag của quầy thể thao"},"html":"<p><b>Zahlen aus dem letzten Jahr:</b> Wareneinsatz der Sportabteilung: 820.000,00 € · Handlungskosten: 369.000,00 €</p><p><b>Was ist gesucht?</b> Handlungskostenzuschlag in Prozent</p><p><b>Formel:</b> Handlungskosten : Wareneinsatz · 100</p><p><b>Rechnung:</b> 369.000 : 820.000 · 100 = 45 %</p><p><b>Bedeutung:</b> Auf jeden Euro Bezugspreis kommen 45 Cent Handlungskosten.</p>","vi":"Số liệu năm ngoái: Wareneinsatz của quầy thể thao: 820.000,00 € · Handlungskosten: 369.000,00 €\nĐề hỏi gì? Handlungskostenzuschlag theo phần trăm\nCông thức: Handlungskosten : Wareneinsatz · 100\nPhép tính: 369.000 : 820.000 · 100 = 45 %\nÝ nghĩa: Cứ mỗi euro Bezugspreis thì có thêm 45 cent Handlungskosten."},{"id":"g2","no":"Aufgabe 3","title":{"de":"Lückenschema: Handlungskostenzuschlag der Schmuckabteilung","vi":"Lückenschema: Handlungskostenzuschlag der Schmuckabteilung · Sơ đồ điền chỗ trống: Handlungskostenzuschlag của quầy trang sức"},"instr":{"de":"Schmuckabteilung: Wareneinsatz 640.000,00 €, Handlungskosten 224.000,00 €. Das Schema ist dasselbe wie im Beispiel.","vi":"Schmuckabteilung: Wareneinsatz 640.000,00 €, Handlungskosten 224.000,00 €. Das Schema ist dasselbe wie im Beispiel.\n🇻🇳 Quầy trang sức: Wareneinsatz 640.000,00 €, Handlungskosten 224.000,00 €. Sơ đồ giống như trong ví dụ."},"tip":{"de":"Welche zwei Jahreszahlen brauchst du? Welche Zahl ist der Grundwert? Handlungskostenzuschlag = Handlungskosten : Wareneinsatz · 100. Gewinnzuschlag = Gewinn : Selbstkosten · 100.","vi":"Em cần hai con số nào chlag = Gewinn : Selbstkosten · 100.","vi":"Em cần hai con số nào của năm? Số nào là giá trị gốc? Handlungskostenzuschlag = Handlungskosten : Wareneinsatz · 100. Gewinnzuschlag = Gewinn : Selbstkosten · 100."},"type":"calc","parts":[{"q":{"de":"Wareneinsatz der Spielwarenabteilung 1.250.000,00 €, Handlungskosten 500.000,00 €. Berechne den Handlungskostenzuschlag in Prozent.","vi":"Wareneinsatz der Spielwarenabteilung 1.250.000,00 €, Handlungskosten 500.000,00 €. Berechne den Handlungskostenzuschlag in Prozent.\n🇻🇳 Wareneinsatz của quầy đồ chơi 1.250.000,00 €, Handlungskosten 500.000,00 €. Tính Handlungskostenzuschlag theo phần trăm."},"u":"%","a":40,"tol":0.01,"steps":["500.000 : 1.250.000 · 100 = 40 %"],"work":true},{"q":{"de":"Selbstkosten der Abteilung 1.750.000,00 €, Gewinn 140.000,00 €. Berechne den Gewinnzuschlag in Prozent.","vi":"Selbstkosten der Abteilung 1.750.000,00 €, Gewinn 140.000,00 €. Berechne den Gewinnzuschlag in Prozent.\n🇻🇳 Selbstkosten của quầy 1.750.000,00 €, Gewinn 140.000,00 €. Tính Gewinnzuschlag theo phần trăm."},"u":"%","a":8,"tol":0.01,"steps":["140.000 : 1.750.000 · 100 = 8 %"],"work":true}],"pts":2},{"id":"g5","no":"Aufgabe 6","title":{"de":"Geführte Übung: Was ändert sich?","vi":"Geführte Übung: Was ändert sich? · Bài tập có hướng dẫn: cái gì thay đổi?"},"instr":{"de":"Wähle: Bezugspreis, Handlungskosten oder Gewinn – und ob er steigt oder sinkt.","vi":"Wähle: Bezugspreis, Handlungskosten oder Gewinn – und ob er steigt oder sinkt.\n🇻🇳 Chọn: Bezugspreis, Handlungskosten hay Gewinn – và nó tăng hay giảm."},"tip":{"de":"Jeder Preis hat vier Teile: Bezugspreis, Handlungskosten, Gewinn, Umsatzsteuer. Welcher Teil ist betroffen? Einkauf und Anlieferung gehören zum Bezugspreis. Kosten im eigenen Betrieb sind Handlungskosten.","vi":"Mỗi giá bán có bốn phần: Bezugspreis, Handlungskosten, Gewinn, Umsatzsteuer. Phần nào bị ảnh hưởng? Mua hàng và vận chuyển đến thuộc về Bezugspreis. Chi phí trong doanh nghiệp là Handlungskosten."},"type":"match"," er Prozentsatz – was sind hier 100 %? Begründe mit „weil“ und zeige es an einem Zahlenbeispiel.","vi":"Hãy nghĩ: số phần trăm này tính trên cái gì – ở đây 100 % là gì? Giải thích bằng „weil“ và cho thấy bằng một ví dụ số."},"type":"free","parts":[{"q":{"de":"Warum ist die Preisuntergrenze „Selbstkosten plus Umsatzsteuer“ und nicht nur „Bezugspreis plus Umsatzsteuer“? Begründe.","vi":"Warum ist die Preisuntergrenze „Selbstkosten plus Umsatzsteuer“ und nicht nur „Bezugspreis plus Umsatzsteuer“? Begründe.\n🇻🇳 Vì sao Preisuntergrenze là „Selbstkosten cộng thuế“ chứ không chỉ là „Bezugspreis cộng thuế“? Hãy giải thích."},"m":{"de":"Der Betrieb muss nicht nur den Einkauf bezahlen, sondern auch seine eigenen Kosten (Personal, Miete, Energie). Erst die Selbstkosten decken beides. Unter den Selbstkosten plus Umsatzsteuer macht der Betrieb mit dem Artikel Verlust.","vi":"Der Betrieb muss nicht nur den Einkauf bezahlen, sondern auch seine eigenen Kosten (Personal, Miete, Energie). Erst die Selbstkosten decken beides. Unter den Selbstkosten plus Umsatzsteuer macht der Betrieb mit dem Artikel Verlust.\n🇻🇳 Doanh nghiệp không chỉ phải trả tiền mua hàng mà còn cả chi phí của chính mình (nhân sự, tiền thuê, điện năng). Chỉ Selbstkosten mới bù đắp cả hai. Dưới mức Selbstkosten cộng thuế thì doanh nghiệp bị lỗ với mặt hàng đó."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Was würde mit dem Gewinn passieren, wenn die Handlungskosten steigen, der Verkaufspreis aber gleich bleibt? Begründe mit dem Hemd (27,69 €).","vi":"Was würde mit dem Gewinn passieren, wenn die Handlungskosten steigen, der Verkaufspreis aber gleich bleibt? Begründe mit dem Hemd (27,69 €).\n🇻🇳 Điều gì xảy ra với Gewinn nếu Handlungskosten tăng nhưng giá bán giữ nguyên? Giải thích bằng ví dụ chiếc áo sơ mi (27,69 €)."},"m":{"de":"Der Gewinn sinkt. Beim Hemd bleiben nur 1,52 € Gewinn. Steigen die Handlungskosten von 7,25 € um mehr als 1,52 €, macht der Betrieb mit dem Hemd Verlust.","vi":"Der Gewinn sinkt. Beim Hemd bleiben nur 1,52 € Gewinn. Steigen die Handlungskosten von 7,25 € um mehr als 1,52 €, macht der Betrieb mit dem Hemd Verlust.\n🇻🇳 Gewinn giảm. Với chiếc áo chỉ còn 1,52 € Gewinn. Nếu Handlungskosten từ 7,25 € tăng thêm hơn 1,52 € thì doanh nghiệp bị lỗ với chiếc áo."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Warum gehört die Verpackung des Lieferanten zu den Bezugskosten, die Tragetasche an der Kasse aber zu den Handlungskosten? Begründe.","vi":"Warum gehört die Verpackung des Lieferanten zu den Bezugskosten, die Tragetasche an der Kasse aber zu den Handlungskosten? Begründe.\n🇻🇳 Vì sao bao bì của nhà cung cấp thuộc Bezugskosten, còn túi xách ở quầy thu ngân lại thuộc Handlungskosten? Hãy giải thích."},"m":{"de":"Die Verpackung des Lieferanten fällt an, bis die Ware bei uns ankommt – sie erhöht den Bezugspreis. Die Tragetasche fällt danach im eigenen Betrieb an, beim Verkauf – sie gehört zu den Handlungskosten.","vi":"Die Verpackung des Lieferanten fällt an, bis die Ware bei uns ankommt – sie erhöht den Bezugspreis. Die Tragetasche fällt danach im eigenen Betrieb an, beim Verkauf – sie gehört zu den Handlungskosten.\n🇻🇳 Bao bì của nhà cung cấp phát sinh cho đến khi hàng về tới chỗ chúng ta – nó làm tăng Bezugspreis. Túi xách phát sinh sau đó trong chính doanh nghiệp, khi bán hàng – nó thuộc Handlungskosten."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":3}]};

   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;

   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
