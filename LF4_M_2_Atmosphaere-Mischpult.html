<html lang="de">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f3efe4;--ink:#1d1d1f;--navy:#13275a;--gold:#b8901c;--paper:#fbf9f3;--line:#d8d1bf;--ok:#2d6b3a;--bad:#a32626}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.top{background:var(--navy);color:#fff;padding:10px 14px 8px}
.top h1{font-family:Georgia,serif;font-size:24px;margin:0;line-height:1.1}
.top .sub{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.top .sub .tl{color:#c9d4f0}
.langs{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.langs button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.langs button.on{background:#fff;color:var(--navy)}
.tl{display:block;font-size:.86em;color:#4b5a86;font-weight:400;margin-top:2px}
.main{flex:1;padding:16px}
.btn{border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:12px 20px;cursor:pointer;width:100%;box-shadow:0 3px 0 #0b1838}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #8a6a10}
.btn:disabled{opacity:.45;cursor:default}
.btn .tl{color:#fff;opacity:.85}
h2{font-family:Georgia,serif;font-size:26px;margin:0 0 8px}
input.nm{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1px solid #bdb5a2;border-radius:8px;margin:6px 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.seg button{border:2px solid #b9b19d;background:#fff;border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg button.on .tl{color:#dfe6fb}
.opt{display:block;width:100%;text-align:left;border:2px solid #c9c1ad;background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#dcefdf}
.opt.wrong{border-color:var(--bad);background:#f6dada}
.note{margin:10px 0;font-size:15px;padding:10px 12px;border-radius:10px}
.note.good{background:#dcefdf;border-left:5px solid var(--ok)}
.note.bad{background:#f6dada;border-left:5px solid var(--bad)}
.stars{color:var(--gold);letter-spacing:3px}
.end{text-align:center}
.end h2{font-size:30px}
.end table{width:100%;border-collapse:collapse;margin:12px 0;text-align:left}
.end td{padding:6px 4px;border-bottom:1px solid #e3ddcd;vertical-align:top}
.merke{background:#fdf0cc;border-radius:10px;padding:10px 12px;text-align:left;margin:12px 0}
.prog{height:8px;background:#e5e0d2;border-radius:4px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:#555}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.pop{animation:pop .3s ease-out}
.task{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:10px}
.tem{font-size:40px;line-height:1}
.scwrap{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--navy);margin-bottom:10px;scroll-margin-top:10px}
.scene{display:block;width:100%;height:auto}
.crowd{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:34px;animation:pop .5s}
.notes text{animation:fl 3s ease-in-out infinite}
.notes.fast text{animation-duration:.7s}
@keyframes fl{50%{transform:translateY(-10px)}}
.scent{animation:sc 2.5s ease-in-out infinite}
@keyframes sc{50%{opacity:.4}}
.ch{background:#2b2f3a;border-radius:12px;padding:8px 10px;margin:8px 0;color:#fff}
.chl{font-weight:700;margin-bottom:6px}
.chl .tl{color:#c9d4f0}
.chb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mb{border:2px solid #555b6b;background:#3a3f4d;color:#fff;border-radius:10px;padding:8px 6px;font:inherit;font-size:14px;cursor:pointer;text-align:center;line-height:1.2}
.mb .ic{display:block;font-size:24px;margin-bottom:3px}
.mb .tl{color:#c9d4f0;font-size:12px}
.mb.on{border-color:#ffcf6b;background:#5a4a1e;box-shadow:0 0 0 2px #ffcf6b inset}
.mb.right{border-color:#5fd07a;background:#1f4d2c}
.mb.wrong{border-color:#ff6b6b;background:#5a1f1f}
.mb:disabled{cursor:default}
.ch .note{color:var(--ink);margin:8px 0 2px;font-size:14px}
.opt.on{border-color:var(--navy);background:#e4e9f5}
.hint{color:#666;font-size:14px;margin:6px 0}
.sumline{font-size:24px;color:var(--gold);text-align:center;margin:12px 0 8px;font-weight:700}
h4{margin:14px 0 4px}
.opt.on.wrong,.opt.wrong{border-color:var(--bad);background:#f6dada}.opt.on.right{border-color:var(--ok);background:#dcefdf}

</style>
</head>

const LSKEY="mp_lang";

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tl=a=>{if(lang==="de"||!a)return "";const s=a[LI[lang]+1];return s?`<span class="tl" lang="${lang}">${esc(s)}</span>`:"";};

let cfStop=false;
function confetti(){
  cfStop=false;const c=$("cf");c.style.display="block";const x=c.getContext("2d");
  let W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#b8901c","#13275a","#a32626","#2d6b3a","#e7c35a","#22508f","#f28c28","#d94f8c","#3fb6a8"];
  const P=[];for(let i=0;i<320;i++)P.push({x:Math.random()*W,y:-Math.random()*H*1.3,w:6+Math.random()*8,h:9+Math.random()*10,vy:2.2+Math.random()*3.8,vx:-1.5+Math.random()*3,r:Math.random()*6.28,vr:-.22+Math.random()*.44,c:cols[i%cols.length],s:Math.random()*6.28,round:Math.random()<.25});
  const t0=performance.now();
  function f(t){
    if(cfStop){x.clearRect(0,0,W,H);c.style.display="none";return;}
    x.clearRect(0,0,W,H);let alive=false;
    for(const p of P){p.y+=p.vy;p.x+=p.vx+Math.sin(t/380+p.s)*1.3;p.r+=p.vr;
      if(t-t0<5000&&p.y>H+20){p.y=-20;p.x=Math.random()*W;}
      if(p.y<H+20)alive=true;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,6.28);x.fill();}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.max(.15,Math.abs(Math.cos(p.r*1.3))));
      x.restore();}
    if(alive)requestAnimationFrame(f);else c.style.display="none";
  }
  requestAnimationFrame(f);
}

      let cls="mb";if(v===i)cls+=" on";
      if(done){if(sh.ok[c.k].includes(i))cls+=" right";else if(v===i)cls+=" wrong";}
      h+=`<button class="${cls}" data-c="${c.k}" data-v="${i}" ${done?"disabled":""}><span class="ic">${c.ic[i]}</span>${esc(o[0])}${tl(o)}</button>`;
    });
    h+=`</div>`;
    if(done){const ok=sh.ok[c.k].includes(v);h+=`<div class="note ${ok?"good":"bad"}">${ok?"✔ "+D("passt"):"✘ "+D("passtnicht")} – ${L(sh.r[c.k])}</div>`;}
    h+=`</div>`;
  }
  if(S.profi){
    h+=`<h4>${D("zielq")}${tl(U.zielq)}</h4>`;
    GOALS.forEach((g,i)=>{let cls="opt";if(S.goal===i)cls+=" on";if(done){if(i===sh.g)cls+=" right";else if(i===S.goal)cls+=" wrong";}
      h+=`<button class="${cls}" data-g="${i}" ${done?"disabled":""}>${L(g)}</button>`;});
  }
  if(!done){
    const ready=CTRL.every(c=>S.set[c.k]!=null)&&(!S.profi||S.goal!=null);
    h+=`<button class="btn gold" id="open" ${ready?"":"disabled"} style="margin-top:12px">${T("oeffnen")}</button>${ready?"":`<p class="hint">${D("alle")}${tl(U.alle)}</p>`}`;
  } else {
    const last=S.i===N-1;
    h+=`<div class="sumline">${"★".repeat(S.res[S.i].s)}${"☆".repeat(3-S.res[S.i].s)} · +${S.res[S.i].p} ${D("punkte")}</div><button class="btn ${last?"gold":""}" id="nx">${last?T("auswertung"):T("naechster")}</button>`;
  }
  $("main").innerHTML=h;
  $("main").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.set[b.dataset.c]=+b.dataset.v;renderGame();});
  $("main").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;renderGame();});
  if($("open"))$("open").onclick=openShop;
  if($("nx"))$("nx").onclick=()=>{if(S.i<N-1){S.i++;S.set={};S.goal=null;S.phase="set";renderGame();window.scrollTo(0,0);}else{S.screen="end";render();confetti();}};
}
function openShop(){
  const sh=shop();let n=0;
  for(const c of CTRL)if(sh.ok[c.k].includes(S.set[c.k]))n++;
  let p=n*25;if(S.profi&&S.goal===sh.g)p+=25;
  S.pts+=p;S.res[S.i]={nm:sh.nm,em:sh.em,n,p,s:n===4?3:n===3?2:1};
  S.phase="result";renderGame();
  const sc=document.querySelector(".scwrap");if(sc)sc.scrollIntoView({behavior:"smooth",block:"start"});
}
function renderEnd(){
  const tot=S.res.reduce((a,r)=>a+r.s,0),max=N*3;
  const tk=tot>=max-2?"t3":tot>=max-6?"t2":"t1";
  let h=`<div class="end pop"><div style="font-size:60px">🏆</div><h2>${D("geschafft")}</h2>${tl(U.geschafft)}`;
  if(S.name)h+=`<div style="font-size:20px;font-weight:700">${esc(S.name)}</div>`;
  h+=`<div class="stars" style="font-size:30px">★ ${tot} / ${max}</div><div style="font-size:20px;font-weight:700">${S.pts} ${D("punkte")}</div><div style="font-size:22px;margin-top:6px"><b>${D(tk)}</b>${tl(U[tk])}</div><table>`;
  for(const r of S.res)h+=`<tr><td>${r.em} ${esc(r.nm)}</td><td class="stars">${"★".repeat(r.s)}${"☆".repeat(3-r.s)}</td><td style="text-align:right">${r.p} ${D("punkte")}</td></tr>`;
  h+=`</table><div class="merke"><b>💡 ${D("merke")}</b>${tl(U.merke)}<div>${esc(U.merktext[0])}</div>${tl(U.merktext)}</div><button class="btn gold" id="again">${T("neustart")}</button></div>`;
  $("main").innerHTML=h;window.scrollTo(0,0);
  $("again").onclick=()=>{cfStop=true;S.screen="start";render();};
}
function render(){
  head();
  if(S.screen==="start"){$("main").innerHTML=startScreen(S);bindStart(S,()=>{S.i=0;S.pts=0;S.res=[];S.set={};S.goal=null;S.phase="set";S.screen="game";render();});}
  else if(S.screen==="game")renderGame();
  else renderEnd();
}
render();

</script>
</body>
</html>
