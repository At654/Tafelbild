{"d": "Die Krankheitstage werden nicht als Urlaub angerechnet.", "s": "Los días de enfermedad no cuentan como vacaciones."}, {"d": "Die Tage sind weg.", "s": "Los días se pierden."}, {"d": "Der Chef entscheidet allein.", "s": "Decide solo el jefe."}, {"d": "Er muss sofort zurück zur Arbeit.", "s": "Tiene que volver al trabajo enseguida."}], "ok": 0, "why": {"d": "Mit Attest zählen die Krankheitstage nicht als Urlaub (BUrlG § 9).", "s": "Con certificado, los días de enfermedad no cuentan como vacaciones (BUrlG § 9)."}, "w": 1, "comp": "txt"}}, {"h": {"d": "Experte C · Mutterschutzgesetz (MuSchG)", "s": "Experta C · Ley de protección de la maternidad (MuSchG)"}, "sents": [{"d": "Das MuSchG gilt für alle [[schwangeren und stillenden]] Beschäftigten, auch Auszubildende.", "s": "La MuSchG vale para todas las empleadas embarazadas y lactantes, también aprendices."}, {"d": "Schutzfrist: [[6 Wochen vor]] der Geburt (freiwillig arbeiten möglich) und [[8 Wochen nach]] der Geburt (bei Früh- und Mehrlingsgeburten 12) – danach Beschäftigungsverbot.", "s": "Plazo de protección: 6 semanas antes del parto (se puede trabajar voluntariamente) y 8 semanas después (12 en partos prematuros y múltiples); en ese tiempo hay prohibición de empleo."}, {"d": "Keine schweren körperlichen Arbeiten (z. B. regelmäßig mehr als 5 kg heben), keine Arbeit mit gefährlichen Stoffen, nach dem 5. Monat nicht dauernd stehen.", "s": "Ningún trabajo físico pesado (p. ej. levantar regularmente más de 5 kg), ningún trabajo con sustancias peligrosas, desde el 5.º mes no estar de pie continuamente."}, {"d": "Höchstens 8,5 Stunden täglich (unter 18: 8 Stunden); keine Arbeit zwischen 20 und 6 Uhr (Ausnahmen mit Genehmigung bis 22 Uhr).", "s": "Como máximo 8,5 horas al día (menores de 18: 8 horas); ningún trabajo entre las 20 y las 6 horas (excepciones con permiso hasta las 22)."}, {"d": "[[Kündigungsschutz]] während der Schwangerschaft und bis 4 Monate nach der Geburt.", "s": "Protección contra el despido durante el embarazo y hasta 4 meses después del parto."}, {"d": "Die Schwangere soll den Betrieb informieren, sobald sie es weiß.", "s": "La embarazada debe informar a la empresa en cuanto lo sepa."}], "q": {"type": "mc", "q": {"d": "Wie lange nach einer normalen Geburt gilt das Beschäftigungsverbot?", "s": "¿Cuánto tiempo después de un parto normal vale la prohibición de empleo?"}, "opts": [{"d": "6 Wochen", "s": "6 semanas"}, {"d": "8 Wochen", "s": "8 semanas"}, {"d": "12 Wochen", "s": "12 semanas"}, {"d": "4 Monate", "s": "4 meses"}], "ok": 1, "why": {"d": "8 Wochen; bei Früh- und Mehrlingsgeburten 12 Wochen (MuSchG § 6).", "s": "8 semanas; en partos prematuros y múltiples 12 semanas (MuSchG § 6)."}, "w": 1, "comp": "txt"}}, {"h": {"d": "Experte D · Elternzeit und Elterngeld (BEEG)", "s": "Experto D · Permiso parental y Elterngeld (BEEG)"}, "sents": [{"d": "Das BEEG gilt für [[Mütter und Väter]].", "s": "La BEEG vale para madres y padres."}, {"d": "Elternzeit: bis zu [[3 Jahre]] je Elternteil, unbezahlt; der Arbeitgeber muss nicht zustimmen, aber rechtzeitig informiert werden.", "s": "Permiso parental (Elternzeit): hasta 3 años por progenitor, sin sueldo; el empleador no tiene que aprobarlo, pero hay que informarle a tiempo."}, {"d": "Kündigungsschutz ab dem Antrag und während der Elternzeit.", "s": "Protección contra el despido desde la solicitud y durante el permiso parental."}, {"d": "Elterngeld: rund [[65–67 %]] des wegfallenden Nettoeinkommens, mindestens 300 €, höchstens 1.800 € im Monat.", "s": "Elterngeld: alrededor del 65–67 % del ingreso neto que se pierde, mínimo 300 €, máximo 1.800 € al mes."}, {"d": "Basiselterngeld gibt es 12 Monate, mit Partnermonaten 14. ElterngeldPlus ist halb so hoch, läuft aber doppelt so lange – gut bei Teilzeit.", "s": "El Basiselterngeld dura 12 meses, con los meses de pareja 14. El ElterngeldPlus es la mitad, pero dura el doble: bueno con jornada parcial."}, {"d": "Das Elterngeld beantragt man bei der [[Elterngeldstelle]], nicht beim Arbeitgeber.", "s": "El Elterngeld se solicita en la oficina del Elterngeld (Elterngeldstelle), no al empleador."}], "q": {"type": "mc", "q": {"d": "Wo beantragt man das Elterngeld?", "s": "¿Dónde se solicita el Elterngeld?"}, "opts": [{"d": "beim Arbeitgeber", "s": "al empleador"}, {"d": "bei der Elterngeldstelle", "s": "en la oficina del Elterngeld"}, {"d": "bei der Gewerbeaufsicht", "s": "en la inspección de trabajo"}, {"d": "bei der Berufsschule", "s": "en la escuela profesional"}], "ok": 1, "why": {"d": "Bei der Elterngeldstelle, nicht beim Arbeitgeber.", "s": "En la Elterngeldstelle, no al empleador."}, "w": 1, "comp": "txt"}}]}, {"id": "a2", "eb": {"d": "Aufgabe 2", "s": "Tarea 2"}, "title": {"d": "Streit im Pausenraum: Wer hat recht?", "s": "Disputa en la sala de descanso: ¿quién tiene razón?"}, "info": [{"d": "Im Pausenraum der Nordstadt-Kauf GmbH wird diskutiert. Tippe zuerst aus dem Bauch („Bauch“). Nach dem Lesen der Expertenblätter prüfst du mit dem Gesetz („nach dem Lesen“).", "s": "En la sala de descanso de Nordstadt-Kauf GmbH se discute. Primero responde por intuición („Intuición“). Después de leer las hojas de expertos compruebas con la ley („tras leer“)."}], "tip": [{"d": "Lies die passende Expertenblatt-Zeile genau: Zahl und Gesetz.", "s": "Lee con atención la frase de la hoja que corresponde: número y ley."}, {"d": "Achtung: Eine Aussage stimmt wirklich!", "s": "¡Atención: una afirmación sí es correcta!"}], "items": [{"id": "a2-1", "type": "duo", "nr": "1.", "q": {"d": "Jana (19): „Ich habe heute zehn Stunden gearbeitet. Das ist doch verboten!“", "s": "Jana (19): „Hoy he trabajado diez horas. ¡Eso está prohibido!“"}, "ok": false, "par": "ArbZG § 3", "why": {"d": "Bis 10 Stunden sind erlaubt, wenn der Durchschnitt bei 8 Stunden bleibt.", "s": "Hasta 10 horas está permitido si el promedio se queda en 8 horas."}, "w": 0.5, "comp": "wis"}, {"id": "a2-2", "type": "duo", "nr": "2.", "q": {"d": "Murat (25): „Bei sieben Stunden Arbeit brauche ich gar e ich sofort zurück, wenn ich mich fit fühle.“", "s": "Svenja (28): „Después del parto vuelvo enseguida si me siento bien.“"}, "ok": false, "par": "MuSchG § 3", "why": {"d": "Acht Wochen Beschäftigungsverbot nach der Geburt.", "s": "Ocho semanas de prohibición de empleo después del parto."}, "w": 0.5, "comp": "wis"}, {"id": "a2-8", "type": "duo", "nr": "8.", "q": {"d": "Tom (30): „Wenn ich in Elternzeit gehe, kann mich der Chef einfach rauswerfen.“", "s": "Tom (30): „Si me voy de permiso parental, el jefe puede simplemente despedirme.“"}, "ok": false, "par": "BEEG § 18", "why": {"d": "Kündigungsschutz ab dem Antrag und während der Elternzeit.", "s": "Protección contra el despido desde la solicitud y durante el permiso parental."}, "w": 0.5, "comp": "wis"}]}, {"id": "a3", "eb": {"d": "Aufgabe 3", "s": "Tarea 3"}, "title": {"d": "Stammgruppe: Unsere Übersicht", "s": "Grupo base: nuestra visión de conjunto"}, "info": [{"d": "Zurück am 4er-Tisch erklärt jede Person ihr Gesetz in zwei Minuten. Alle füllen die Übersicht aus.", "s": "De vuelta en la mesa de cuatro, cada persona explica su ley en dos minutos. Todos completan la tabla."}], "tip": [{"d": "Schreibe Stichworte: Für wen? Zahlen? Besondere Regel?", "s": "Escribe palabras clave: ¿para quién? ¿números? ¿regla especial?"}, {"d": "Nutze die Expertenblätter oben.", "s": "Usa las hojas de expertos de arriba."}], "wg": {"words": [{"d": "die Ruhezeit", "s": "el descanso"}, {"d": "die Schutzfrist", "s": "el plazo de protección"}, {"d": "der Kündigungsschutz", "s": "la protección contra el despido"}, {"d": "die Wartezeit", "s": "el tiempo de espera"}], "chips": [{"d": "Das Gesetz gilt für …", "s": "La ley vale para …"}, {"d": "Wichtige Regeln sind …", "s": "Reglas importantes son …"}]}, "items": [{"id": "a3-1", "type": "t", "nr": "ArbZG", "q": {"d": "Für wen gilt das Gesetz? Nenne drei wichtige Regeln.", "s": "¿Para quién vale la ley? Menciona tres reglas importantes."}, "kw": [["18", "erwachsen"], ["8", "10"], ["pause", "30", "45"], ["11", "ruhezeit"]], "min": 3, "model": {"d": "Beschäftigte ab 18 · 8 Std. (bis 10); Pause 30/45 Min.; 11 Std. Ruhezeit", "s": "Empleados desde 18 años · 8 h (hasta 10); pausa 30/45 min; 11 h de descanso"}, "w": 0.5, "comp": "txt", "open": true}, {"id": "a3-2", "type": "t", "nr": "BUrlG", "q": {"d": "Für wen gilt das Gesetz? Nenne drei wichtige Regeln.", "s": "¿Para quién vale la ley? Menciona tres reglas importantes."}, "kw": [["alle", "beschaeftigte"], ["24"], ["6 monate", "wartezeit", "sechs monate"], ["krank", "attest"]], "min": 3, "model": {"d": "alle Beschäftigten · 24 Werktage; Wartezeit 6 Monate; Krankheit mit Attest zählt nicht", "s": "todos los empleados · 24 días laborables; espera de 6 meses; enfermedad con certificado no cuenta"}, "w": 0.5, "comp": "txt", "open": true}, {"id": "a3-3", "type": "t", "nr": "MuSchG", "q": {"d": "Für wen gilt das Gesetz? Nenne drei wichtige Regeln.", "s": "¿Para quién vale la ley? Menciona tres reglas importantes."}, "kw": [["schwanger", "stillend"], ["6 wochen", "8 wochen", "schutzfrist", "sechs", "acht"], ["schwer", "5 kg", "keine arbeit"], ["kuendigung"]], "min": 3, "model": {"d": "Schwangere und Stillende · 6 Wochen vor, 8 Wochen nach der Geburt; keine schweren Arbeiten; Kündigungsschutz bis 4 Monate nach der Geburt", "s": "embarazadas y lactantes · 6 semanas antes, 8 después del parto; sin trabajos pesados; protección contra el despido hasta 4 meses tras el parto"}, "w": 0.5, "comp": "txt", "open": true}, {"id": "a3-4", "type": "t", "nr": "BEEG", "q": {"d": "Für wen gilt das Gesetz? Nenne drei wichtige Regeln.", "s": "¿Para quién vale la ley? Menciona tres reglas importantes."}, "kw": [["mutter", "vater", "eltern"], ["3 jahre", "drei jahre", "elternzeit"], ["kuendigung"], ["65", "67", "elterngeld"]], "min": 3, "model": {"d": "Mütter und Väter · Elternzeit bis 3 Jahre; Kündigungsschutz; Elterngeld 65–67 % des Nettos", "s": "madres y padres · permiso parental hasta 3 años; protección contra el despido; Elterng  if(t.dataset.flag){var p=t.dataset.flag.split(':'),it=find(p[0]);if(S.chk[it.id]){paint(it);return}var a=S.ans[it.id]||[],i=+p[1],k=a.indexOf(i);if(t.checked&&k<0)a.push(i);if(!t.checked&&k>=0)a.splice(k,1);S.ans[it.id]=a;save()}});

function wipe(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
/* eval */
var COMP=D.comps;
function evalCalc(){var tot=0,got=0,c={},bon=0,bmax=0,rep=[];Object.keys(COMP).forEach(function(k){c[k]={g:0,m:0}});
 ITEMS.forEach(function(it){var w=wOf(it);if(w<=0)return;var f=frac(it);if(isV(it)){bmax+=w;bon+=w*f;if(S.level==='v'&&f<1)rep.push(it);return}
  tot+=w;got+=w*f;var k=it.comp||it.task.comp;c[k].m+=w;c[k].g+=w*f;if(f<1)rep.push(it)});
 var pts=tot?got/tot*20:0;return {pts:Math.round(pts*2)/2,c:c,bon:Math.round(bon),bmax:bmax,rep:rep}}
function pctOf(x){return x.m?Math.round(x.g/x.m*100):0}
function cls(p){return p>=80?['ok','Super! / ¡Muy bien!']:p>=50?['mid','Noch etwas Übung / Un poco más de práctica']:['lo','Übungsbedarf / Necesitas practicar']}
function code(r){var L={vor:'V',txt:'T',trans:'A',wis:'F',refl:'B'},nm=(S.name||'?').toUpperCase().replace(/[^A-ZÄÖÜ]/g,'').slice(0,6)||'X';var dd=(S.date||'').replace(/[^0-9.]/g,'').slice(0,6)||'--';
 var s=nm+'|'+dd+'|'+r.pts+'/20|'+Object.keys(COMP).map(function(k){return (L[k]||k[0].toUpperCase())+pctOf(r.c[k])}).join('-')+'|'+D.short+(S.level==='v'?'V+'+r.bon:'B');var sum=0;for(var i=0;i<s.length;i++)sum=(sum*31+s.charCodeAt(i))%1296;return s+'|'+('0'+sum.toString(36)).slice(-2).toUpperCase()}
function evalShow(){var r=evalCalc(),h='<div class="score">'+r.pts+' / 20</div>'+(S.level==='v'?'<div class="big">+'+r.bon+' Bonus (Vertiefung, max. '+r.bmax+')</div>':'')+'<div class="bars">';
 Object.keys(COMP).forEach(function(k){var p=pctOf(r.c[k]),cl=cls(p);h+='<div class="br"><b>'+T(COMP[k])+'</b> – '+p+' % · '+cl[1].replace(' / ',' · ')+'<div class="bar"><i style="width:'+p+'%"></i></div></div>'});
 h+='</div>';
 if(r.rep.length){h+='<details><summary>'+U('rep')+' ('+r.rep.length+')</summary>';r.rep.forEach(function(it){h+='<div class="item"><div class="q">'+(it.q?T(it.q):'')+'</div><div class="mod">'+modelOf(it)+'</div></div>'});h+='</details>'}
 h+='<p><b>'+U('res')+'</b></p><code class="code" id="codetx">'+esc(code(r))+'</code><div><button type="button" class="btn" id="png">'+U('png')+'</button><button type="button" class="btn sec" id="copy">'+U('copy')+'</button><button type="button" class="btn sec" id="next">'+U('next')+'</button></div><div id="cmsg" class="pgh"></div>';
 $('#evalbox').innerHTML=h}
function modelOf(it){if(it.type==='mc')return T(it.opts[it.ok])+(it.why?'<br>'+T(it.why):'');if(it.type==='mcm')return it.ok.map(function(i){return T(it.opts[i])}).join('<br>');if(it.type==='ed')return (it.ok?'erlaubt':'verboten')+' · '+esc(it.par)+(it.why?'<br>'+T(it.why):'');if(it.type==='duo')return (it.ok?esc(UI.yes[0]):esc(UI.no[0]))+' · '+esc(it.par)+'<br>'+T(it.why);if(it.type==='flags')return it.fl.filter(function(f){return f.ok}).map(function(f){return T(f.t)+' → '+T(f.why)}).join('<br>');return T(it.model)}
function copyCode(){var c=$('#codetx').textContent;try{navigator.clipboard.writeText(c).then(function(){$('#cmsg').textContent='✔ kopiert / copiado'},fb)}catch(e){fb()}function fb(){var r=document.createRange();r.selectNodeContents($('#codetx'));var s=getSelection();s.removeAllRanges();s.addRange(r);$('#cmsg').textContent='Code markiert – bitte kopieren / Código seleccionado'}}
function png(){var r=evalCalc(),cv=document.createElement('canvas');cv.width=900;cv.height=520;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,900,520);g.fillStyle='#1F4E79';g.fillRect(0,0,900,70);g.fillStyle='#fff';g.font='bold 28px sans-serif';g.fillText(D.cardTitle,24,45);
 g.fillStyle='#1a2430';g.font='24px sans-serif';g.fillText('Name: '+(S.name||'–')+'    Datum: '+(S.date||'–'),24,115);g.font='bold 54px sans-serif';g.fillStyle='#1F4E79';g.fillText(r.pts+' / 20',24,185);g.font='22px sans-serif';g.fillStyle='#1a2430';g.fillText('Ebene: '+(S.level==='v'?'Vertiefung (+'+r.bon+' Bonus)':'Basis'),340,175);
 var y=225;Object.keys(COMP).forEach(function(k){var p=pctOf(r.c[k]);g.fillStyle='#1a2430';g.font='20px sans-serif';g.fillText(txt(COMP[k])+' – '+p+' %',24,y);g.fillStyle='#e3e9ef';g.fillRect(24,y+8,600,16);g.fillStyle='#1F4E79';g.fillRect(24,y+8,6*p,16);y+=48});
 g.fillStyle='#57667a';g.font='15px monospace';g.fillText(code(r),24,500);
 cv.toBlob(function(b){var f=new File([b],'ergebnis.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}}catch(e){}var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ergebnis.png';a.click()})}
