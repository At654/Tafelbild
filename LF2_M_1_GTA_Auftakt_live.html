<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LF 2 Auftakt: GTA VI (live, 5 Sprachen)</title>
<style>
:root{
  --bg:#ffffff; --fg:#14181d; --muted:#586270; --line:#c9d1da;
  --blau:#1F4E79; --blauhell:#9DC3E6; --flaeche:#EAF1F8;
  --acc:#7A3E00; --accbg:#FFF1D6; --accline:#D9A441; --ok:#2E6B45;
  --sans: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --fg:#e8edf2; --muted:#9aa6b4; --line:#2e3946;
    --blau:#8fc1ee; --blauhell:#2d5a85; --flaeche:#16222e;
    --acc:#ffd9a0; --accbg:#3a2a12; --accline:#9a7330; --ok:#6fcf97;
  }
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans)}
button{font:inherit; cursor:pointer}
[hidden]{display:none !important}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:#c0392b; margin-right:6px}
.dot.on{background:var(--ok)}

/* ---------- Tafel (Lehrkraft) ---------- */
#tafel{min-height:100vh; display:flex; flex-direction:column}
.tkopf{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 18px; background:var(--flaeche); border-bottom:2px solid var(--blauhell)}
.tkopf .ti{font-weight:700; color:var(--blau); font-size:1.05rem; margin-right:auto}
.tkopf button{border:2px solid var(--blau); background:var(--bg); color:var(--blau); border-radius:8px; padding:8px 16px; font-weight:700; font-size:1rem; min-height:44px}
.tkopf button.pri{background:var(--blau); color:var(--bg)}
.tkopf .mini{display:flex; align-items:center; gap:10px; font-size:.9rem; color:var(--muted)}
.tkopf canvas{width:64px; height:64px; border:1px solid var(--line); background:#fff}
#tmain{flex:1; padding:3vh 5vw 6vh; font-size:clamp(1.3rem, 2.9vw, 2.9rem); line-height:1.4}
#tmain h1{font-size:1.25em; color:var(--blau); margin:0 0 .5em; border-bottom:3px solid var(--blauhell); padding-bottom:.2em}
#tmain p{margin:.3em 0 .6em}
#tmain ul{margin:.2em 0 .6em; padding-left:1.2em} #tmain li{margin:.25em 0}
.q{background:var(--accbg); border-left:8px solid var(--accline); padding:.4em .8em; margin:.5em 0; border-radius:6px}
.hh{font-weight:800; color:var(--blau); margin-top:.6em}
.pair{display:flex; flex-wrap:wrap; gap:.2em 1em; align-items:baseline; padding:.25em 0; border-bottom:1px solid var(--line)}
.pair .x{font-weight:800; min-width:11em; color:var(--blau)}
.pair .y{flex:1}
.verdeckt{border:3px dashed var(--line); border-radius:8px; color:var(--muted); padding:.2em .8em; margin:.4em 0; font-size:.8em}
.join{display:grid; grid-template-columns:minmax(260px, 38%) 1fr; gap:4vw; align-items:center}
.join canvas{width:100%; max-width:560px; height:auto; aspect-ratio:1; background:#fff; border:2px solid var(--line); border-radius:8px}
.code{font-weight:800; letter-spacing:.15em; font-size:1.3em; color:var(--blau)}
.muted{color:var(--muted); font-size:.62em}
.sprachen{display:grid; gap:.3em; margin-top:.8em}
.sprachen div{padding:.3em .7em; background:var(--flaeche); border-radius:8px; font-size:.7em}
.sprachen [lang="ar"]{direction:rtl; text-align:right; font-size:.78em}
.urlbox{display:block; margin-top:.8em; font-size:.55em; color:var(--muted)}
.urlbox input{display:block; width:100%; font:inherit; font-size:1.1em; padding:6px 8px; margin-top:4px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg)}
.zaehler{font-size:.9rem}
@media (max-width:760px){ .join{grid-template-columns:1fr} }

/* ---------- Handy (Schüler) ---------- */
#handy{min-height:100vh; display:flex; flex-direction:column; max-width:640px; margin:0 auto}
.hkopf{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:2px solid var(--blauhell); padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.hkopf button{border:2px solid var(--blau); background:var(--bg); color:var(--blau); border-radius:22px; padding:6px 14px; font-weight:700; font-size:.95rem; min-height:42px}
.hkopf button[aria-pressed="true"]{background:var(--blau); color:var(--bg)}
.hkopf .st{margin-left:auto; font-size:.8rem; color:var(--muted)}
.hkopf .bigtr{flex-basis:100%}
button.bigtr{width:100%; min-height:52px; font-size:1.15rem; border-radius:12px; background:var(--acc); color:var(--bg); border:0}
button.bigtr[aria-pressed="false"]{background:var(--bg); color:var(--acc); border:2px solid var(--accline)}
#hmain{flex:1; padding:14px 14px 100px}
#hmain h1{font-size:1.35rem; color:var(--blau); margin:.2em 0 .5em; border-bottom:2px solid var(--blauhell); padding-bottom:.25em}
.item{margin:.55em 0}
.item .de{font-size:1.02rem; line-height:1.5}
.item .tl{display:block; margin-top:.25em; background:var(--accbg); color:var(--acc); border-radius:8px; padding:.35em .7em; font-size:1.12rem; line-height:1.55}
.item .tl.ar{direction:rtl; text-align:right; font-size:1.25rem}
.item.q .de{font-weight:600}
.item.li{display:list-item; margin-left:1.2em}
.item.hh .de{font-weight:800; color:var(--blau)}
.item.pair .x .de{font-weight:800; color:var(--blau)}
.pairbox{border-bottom:1px solid var(--line); padding:.4em 0}
.nurde .tl{display:none}
.hfuss{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:2px solid var(--blauhell)}
.hfuss .in{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 12px}
.hfuss button{min-height:48px; min-width:56px; border-radius:10px; border:2px solid var(--blau); background:var(--bg); color:var(--blau); font-size:1.3rem; font-weight:800}
.hfuss .mid{flex:1; text-align:center; font-size:.9rem; color:var(--muted)}
.hfuss .mid button{font-size:.95rem; padding:4px 10px; min-height:40px}
.sprachwahl{display:grid; gap:14px; padding:6vh 16px}
.sprachwahl h2{margin:0 0 4px; text-align:center; color:var(--blau)}
.sprachwahl button{min-height:72px; font-size:1.6rem; font-weight:800; border-radius:14px; border:3px solid var(--blau); background:var(--bg); color:var(--blau)}
.antwortbtn{display:block; width:100%; min-height:50px; margin:12px 0; border-radius:10px; border:2px dashed var(--accline); background:var(--bg); color:var(--acc); font-weight:700}
@keyframes neu{from{background:var(--accbg)} to{background:transparent}}
.neu{animation:neu 1.2s ease-out}

.opt{display:flex;align-items:center;gap:.6em;padding:.3em .7em;margin:.35em 0;border:3px solid var(--line);border-radius:10px}
.opt .ol{font-weight:800;min-width:1.7em;height:1.7em;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--blau);color:var(--bg);font-size:.8em}
.opt .ot{flex:1}
.opt .bar{flex:0 0 26%;height:.7em;background:var(--flaeche);border-radius:6px;overflow:hidden}
.opt .bar i{display:block;height:100%;background:var(--blau)}
.opt .cn{min-width:1.8em;text-align:right}
.opt.ok{border-color:var(--ok);background:rgba(46,107,69,.14)}
.opt.dim{opacity:.5}
.c0{--oc:#c0392b}.c1{--oc:#1F6FB5}.c2{--oc:#9a6a00}.c3{--oc:#2E7D4F}
.opt.qz .ol{background:var(--oc)}
.timer{height:16px;background:var(--flaeche);border-radius:8px;overflow:hidden;margin:.3em 0 .5em}
.timer i{display:block;height:100%;background:var(--acc);width:100%}
.dia{display:grid;grid-template-columns:1fr 1fr;gap:3vw}
.dia .col{border:3px solid var(--line);border-radius:12px;padding:.4em .8em}
.dia h2{margin:.1em 0 .3em;font-size:.85em;color:var(--blau)}
.ln{margin:.3em 0;font-size:.68em}.ln b{display:inline-block;min-width:1.5em;color:var(--blau)}.ln.K{color:var(--muted)}
.cust{background:var(--accbg);border-left:8px solid var(--accline);padding:.4em .8em;border-radius:6px;margin:.4em 0}
.expl{background:var(--flaeche);border-left:8px solid var(--ok);padding:.4em .8em;border-radius:6px;margin:.6em 0;font-size:.85em}
.podium{display:flex;gap:2vw;align-items:flex-end;justify-content:center;margin:3vh 0}
.podium .p{text-align:center;background:var(--flaeche);border:3px solid var(--blauhell);border-radius:10px 10px 0 0;padding:.4em 1em;min-width:20%}
.podium .p1{height:11em}.podium .p2{height:8.5em}.podium .p3{height:6.5em}
.chip{display:inline-block;padding:.1em .6em;margin:.15em;border:2px solid var(--line);border-radius:20px;background:var(--bg);color:var(--fg);font-size:.55em;cursor:pointer}
.tag{display:inline-block;background:var(--acc);color:var(--bg);border-radius:6px;padding:.05em .5em;font-size:.6em;font-weight:700;margin-right:.4em;vertical-align:middle}
.tkopf input[type=range]{width:90px}
.hint{color:var(--muted);font-size:.7em}
.lead{font-size:.75em;margin:.2em 0}
.dbox{border:2px solid var(--line);border-radius:12px;padding:.2em .8em .5em;margin:.7em 0}
.dbox h2{font-size:1.05rem;margin:.4em 0;color:var(--blau)}
.item.lnK .de{color:var(--muted)}
.op{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;margin:.55em 0;padding:.6em .8em;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
.op .sh{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:50%;background:var(--blau);color:var(--bg);font-weight:800}
.op.c0 .sh{background:#c0392b}.op.c1 .sh{background:#1F6FB5}.op.c2 .sh{background:#9a6a00}.op.c3 .sh{background:#2E7D4F}
.op .tb{flex:1}
.op.sel{border-color:var(--blau);box-shadow:0 0 0 3px var(--blauhell)}
.op.ok{border-color:var(--ok);background:rgba(46,107,69,.14)}
.op.bad{border-color:#c0392b;background:rgba(192,57,43,.12)}
.op:disabled{opacity:.85}
.fb{font-size:1.4rem;font-weight:800;margin:.6em 0}.fb.ok{color:var(--ok)}.fb.bad{color:#c0392b}
.expl.item{font-size:1rem}
.namebox{display:grid;gap:14px;padding:6vh 16px}
.namebox input{font:inherit;font-size:1.4rem;padding:12px;border:3px solid var(--blau);border-radius:12px;background:var(--bg);color:var(--fg)}
.namebox button{min-height:60px;font-size:1.4rem;font-weight:800;border-radius:14px;border:0;background:var(--blau);color:var(--bg)}
.rank{font-size:1.6rem;font-weight:800;text-align:center;margin:1em 0;color:var(--blau)}
.plist{margin-top:.5em}

.op .tb .tl,.fb .tl,h1 .tl{display:block;margin-top:.3em;font-weight:600}
.op .tb .tl{background:var(--accbg);color:var(--acc);border-radius:8px;padding:.3em .6em;font-size:1.05rem}
.fb .tl{font-size:1.2rem;color:var(--acc)}
h1 .tl{font-size:1.05rem;color:var(--acc)}
.item.ln .de,.item.lnV .de,.item.lnK .de{display:block}

/* ===== Theme: neon sunset / Stadt-Nacht (eigenes Design, angelehnt an den Look, ohne Logos oder Figuren) ===== */
:root,:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#150822; --fg:#fff6ff; --muted:#cdb8e6; --line:#5a2f80;
  --blau:#ff4fa3; --blauhell:#8a3dff; --flaeche:#26103d;
  --acc:#ffc233; --accbg:#33194d; --accline:#ff8a1f; --ok:#2ef2b0;
  --head:"Arial Black","Impact","Haettenschweiler","Arial Narrow",system-ui,sans-serif;
}
html{background:linear-gradient(180deg,#12061d 0%,#2b0b45 55%,#3d1048 85%,#5a1650 100%) fixed;min-height:100%}
body{background:transparent!important;position:relative;min-height:100vh}
html,body{color:var(--fg)}
body::before{content:"";position:fixed;left:50%;bottom:-22vh;width:62vh;height:62vh;border-radius:50%;transform:translateX(-50%);z-index:-1;pointer-events:none;opacity:.16;
  background:repeating-linear-gradient(180deg,transparent 0 9%,#150822 9% 11%),linear-gradient(#ffd23f,#ff3d7f)}
#tafel,#handy{background:transparent}
.tkopf{background:linear-gradient(90deg,#26103d,#3a1458);border-bottom:4px solid transparent;border-image:linear-gradient(90deg,#ff4fa3,#ffc233,#2ef2b0) 1}
.tkopf .ti{font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.tkopf button{border-color:var(--blau);background:#1c0b2e;color:var(--fg)}
.tkopf button.pri,.tkopf button[aria-pressed="true"]{background:var(--blau);color:#150822;box-shadow:0 0 14px rgba(255,79,163,.6)}
.tkopf button:disabled{opacity:.45}
#tmain h1,#hmain h1{font-family:var(--head);text-transform:uppercase;letter-spacing:.04em;line-height:1.15;background:linear-gradient(90deg,#ff4fa3,#ffc233);-webkit-background-clip:text;background-clip:text;color:transparent;border-bottom:3px solid var(--blau);text-shadow:none}
#hmain h1 .tl,#tmain h1 .tl{text-transform:none;font-family:system-ui,sans-serif}
.hkopf{background:#1c0b2e;border-bottom:3px solid var(--blau)}
.hkopf button{background:#26103d;color:var(--fg);border-color:var(--blauhell)}
.hkopf button[aria-pressed="true"]{background:var(--blau);color:#150822;border-color:var(--blau)}
button.bigtr{background:var(--acc);color:#150822}
button.bigtr[aria-pressed="false"]{background:#26103d;color:var(--acc);border:2px solid var(--accline)}
.sprachwahl button,.namebox input{background:#26103d;color:var(--fg);border-color:var(--blau)}
.namebox button{background:var(--blau);color:#150822}
.opt,.op,.dia .col,.dbox{background:rgba(38,16,61,.82);border-color:var(--blauhell)}
.opt.ok,.op.ok{border-color:var(--ok);background:rgba(46,242,176,.16);box-shadow:0 0 14px rgba(46,242,176,.45)}
.op.bad{border-color:#ff4d6d;background:rgba(255,77,109,.18)}
.op.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,194,51,.45)}
.opt .ol,.op .sh{color:#150822}
.opt .ol{background:var(--blau)}.op .sh{background:var(--blau)}
.opt.qz .ol{color:#fff}.op.c0 .sh,.op.c1 .sh,.op.c2 .sh,.op.c3 .sh{color:#fff}
.opt .bar{background:#150822}.opt .bar i{background:linear-gradient(90deg,#ff4fa3,#ffc233)}
.cust{background:rgba(51,25,77,.9);border-left-color:var(--acc)}
.expl{background:rgba(38,16,61,.9);border-left-color:var(--ok)}
.timer{background:#150822;border:1px solid var(--blauhell)}
.timer i{background:linear-gradient(90deg,#2ef2b0,#ffc233,#ff4fa3)}
.tag{background:var(--acc);color:#150822;font-family:var(--head);text-transform:uppercase;letter-spacing:.04em}
.fb.ok{color:var(--ok)}.fb.bad{color:#ff6b86}
.rank,.code{color:var(--acc);font-family:var(--head)}
.podium .p{background:rgba(38,16,61,.9);border-color:var(--blauhell)}
.podium .p1{border-color:#ffd23f;box-shadow:0 0 22px rgba(255,210,63,.5)}
.podium .p2{border-color:#cfd8e3}.podium .p3{border-color:#ff9a4d}
.chip{background:#26103d;color:var(--fg);border-color:var(--blauhell)}
.sprachen div{background:rgba(38,16,61,.85)}
.op .tb .tl{background:rgba(255,194,51,.14);color:var(--acc)}
.item .tl{background:rgba(255,194,51,.14);color:var(--acc)}
.hint,.muted{color:var(--muted)}
.urlbox input{background:#26103d;color:var(--fg);border-color:var(--blauhell)}
.q,.hh{color:var(--fg)}

</style>
</head>
<body>
<div id="tafel" hidden>
  <div class="tkopf" id="tkopf"></div>
  <main id="tmain"></main>
</div>
<div id="handy" hidden>
  <div class="hkopf" id="hkopf"></div>
  <main id="hmain"></main>
</div>

 var m=u.match(/[?&]s=([A-Za-z0-9]+)/);o.querySelector(".qc").textContent=code()||(m?m[1].toUpperCase():"");o.querySelectorAll("p")[0].textContent=u;

   {w:"V",x:X("„Guten Tag! Schön, dass Sie da sind. Suchen Sie etwas Bestimmtes?“","«¡Buenos días! Qué bien que esté aquí. ¿Busca algo en concreto?»","«Bom dia! Que bom que está aqui. Procura algo em especial?»","«Здравствуйте! Рады вас видеть. Вы ищете что-то конкретное?»","«ደሓን መጻእኩም! ብምምጽኦም ሕጉስ እየ። ፍሉይ ነገር ትደልዩ ዲኹም?»")},
   {w:"K",x:X("„Ich suche GTA VI.“","«Busco GTA VI.»","«Procuro GTA VI.»","«Я ищу GTA VI.»","«GTA VI እደሊ ኣለኹ።»")},
   {w:"V",x:X("„Gute Wahl! Für welche Konsole soll es sein?“","«¡Buena elección! ¿Para qué consola es?»","«Boa escolha! Para qual console?»","«Хороший выбор! Для какой консоли?»","«ጽቡቕ ምርጫ! ንየናይ ኮንሶል እዩ?»")},

 vote:{q:X("Bei welchem Verkäufer kaufst du gern ein?","¿En qué vendedor compras con gusto?","Com qual vendedor você gosta de comprar?","У какого продавца ты охотно купишь?","ካብ ኣየናይ ሸያጢ ክትገዝእ ትደሊ?")},
 why:{
  q:X("Was war bei Verkäufer A der größte Fehler?","¿Cuál fue el mayor error del vendedor A?","Qual foi o maior erro do vendedor A?","Какая самая большая ошибка продавца A?","ናይ ሸያጢ A ዝዓበየ ጌጋ እንታይ እዩ?"),
  o:[
   X("Er hat nicht gegrüßt und nicht hingeschaut.","No saludó ni miró al cliente.","Não cumprimentou nem olhou para o cliente.","Он не поздоровался и не посмотрел на клиента.","ሰላምታ ኣይሃበን፡ ኣብ ዓሚል ድማ ኣይጠመተን።"),
   X("Er hat nicht gefragt, was ich brauche.","No preguntó qué necesito.","Não perguntou do que preciso.","Он не спросил, что мне нужно.","እንታይ ከም ዝደሊ ኣይሓተተን።"),

 typ:{
  q:X("Welcher Satz passt zum Kunden?","¿Qué frase le va bien al cliente?","Qual frase combina com o cliente?","Какая фраза подходит клиенту?","እንታይ ሓረግ እዩ ንዓሚል ዝምጥን?"),
  rounds:[
   {d:X("Jonas, 19, zockt jeden Tag. Er steht schon länger vor dem Regal.","Jonas, 19 años, juega todos los días. Lleva un rato frente al estante.","Jonas, 19 anos, joga todo dia. Está há um tempo na frente da prateleira.","Йонас, 19 лет, играет каждый день. Он уже давно стоит у полки.","ዮናስ፡ 19 ዓመት፡ ኩሉ ዕለት ይጻወት። ቅድሚ ሕጂ ኣብ ቅድሚ ሸልፍ ደው ኢሉ ኣሎ።"),
    o:[
     X("„Kann ich helfen?“","«¿Puedo ayudar?»","«Posso ajudar?»","«Могу я помочь?»","«ክሕግዝ ዶ?»"),
     X("„Hallo! Suchen Sie etwas Bestimmtes, oder darf ich Ihnen die Neuheiten zeigen?“","«¡Hola! ¿Busca algo en concreto o le puedo mostrar las novedades?»","«Olá! Procura algo específico ou posso mostrar as novidades?»","«Здравствуйте! Вы ищете что-то конкретное, или показать вам новинки?»","«ሰላም! ፍሉይ ነገር ትደልዩ ዲኹም ወይ ሓደስቲ ኣቕሑ ከርእየኩም?»"),
     X("„Dieses Regal ist nur für Kunden.“","«Este estante es solo para clientes.»","«Esta prateleira é só para clientes.»","«Эта полка только для покупателей.»","«እዚ ሸልፍ ንዓመላት ጥራይ እዩ።»")
    ],c:1,
    e:X("Zwei Möglichkeiten zur Wahl: Der Kunde kann nicht einfach „Nein“ sagen und fühlt sich eingeladen.","Ofrece dos opciones: el cliente no puede decir simplemente «no» y se siente invitado.","Oferece duas opções: o cliente não pode simplesmente dizer «não» e se sente convidado.","Два варианта на выбор: клиент не может просто сказать «нет» и чувствует приглашение.","ክልተ ኣማራጺ ይህብ፡ ዓሚል ብቐሊሉ «ኣይፋልን» ክብል ኣይክእልን፡ ተኸቢሩ ይስምዖ።")},
   {d:X("Frau Weber, 45, wirkt unsicher. Auf ihrem Zettel steht: „Das Spiel, das alle wollen.“","La Sra. Weber, 45 años, parece insegura. En su nota dice: «El juego que todos quieren».","A Sra. Weber, 45 anos, parece insegura. No papel dela está escrito: «O jogo que todos querem».","Фрау Вебер, 45 лет, выглядит неуверенно. На её бумажке написано: «Игра, которую все хотят».","ወይዘሮ ዌበር፡ 45 ዓመት፡ ርግጸኛ ዘይኮነት ትመስል። ኣብ ወረቐታ «እቲ ኩሉ ዝደልዮ ጸወታ» ተጻሒፉ ኣሎ።"),
    o:[
     X("„Wir haben viele Spiele. Schauen Sie sich einfach um.“","«Tenemos muchos juegos. Mire con calma.»","«Temos muitos jogos. Fique à vontade para olhar.»","«У нас много игр. Просто осмотритесь.»","«ብዙሕ ጸወታታት ኣለና። ጥራይ ርኣዩ።»"),
     X("„Guten Tag! Für wen suchen Sie das Spiel? Dann finde ich das Passende.“","«¡Buenos días! ¿Para quién busca el juego? Así encuentro el adecuado.»","«Bom dia! Para quem é o jogo? Assim encontro o adequado.»","«Здравствуйте! Для кого вы ищете игру? Тогда я подберу подходящую.»","«ደሓን መጻእኩም! ንመን እዩ እቲ ጸወታ? ሽዑ ዝምጥን ክረኽበልኩም እየ።»"),
     X("„Das ist GTA. Nehmen Sie das, das kauft jeder.“","«Es GTA. Llévese ese, lo compra todo el mundo.»","«É o GTA. Leve esse, todo mundo compra.»","«Это GTA. Берите, его покупают все.»","«እዚ GTA እዩ። እዚ ውሰዱ፡ ኩሉ ሰብ ይገዝእ።»")
    ],c:1,
    e:X("Erst fragen, dann beraten. So findet man den echten Bedarf.","Primero preguntar, luego asesorar. Así se descubre la necesidad real.","Primeiro perguntar, depois aconselhar. Assim se descobre a necessidade real.","Сначала спросить, потом консультировать. Так выясняется настоящая потребность.","ቐዳማይ ሕተት፡ ደሓር ሓሳብ ሃብ። ከምዚ ብሓቂ እንታይ ከም ዝደሊ ትፈልጥ።")},
   {d:X("Frau Krüger, 70, hat einen Zettel von ihrem Enkel: „irgendwas mit Autos“.","La Sra. Krüger, 70 años, tiene una nota de su nieto: «algo con coches».","A Sra. Krüger, 70 anos, tem um bilhete do neto: «algo com carros».","Фрау Крюгер, 70 лет, держит записку от внука: «что-нибудь про машины».","ወይዘሮ ክሩገር፡ 70 ዓመት፡ ካብ ወዲ ወዲኣ ወረቐት ኣለዋ፦ «ገለ ብዛዕባ መካይን»።"),
    o:[
     X("„Das steht alles im Internet.“","«Eso está todo en internet.»","«Isso está tudo na internet.»","«Всё это есть в интернете.»","«እዚ ኩሉ ኣብ ኢንተርነት ኣሎ።»"),
     X("„Guten Tag! Darf ich einen Blick auf den Zettel werfen? Dann suchen wir es zusammen.“","«¡Buenos días! ¿Puedo echar un vistazo a la nota? Así lo buscamos juntos.»","«Bom dia! Posso dar uma olhada no bilhete? Assim procuramos juntos.»","«Здравствуйте! Можно взглянуть на записку? Тогда поищем вместе.»","«ደሓን መጻእኩም! ነታ ወረቐት ክርእያ ይፍቀደለይ? ሽዑ ብሓባር ንደልዮ።»"),
     X("„Autos? Dann nehmen Sie GTA VI, das ist das Beste.“","«¿Coches? Entonces lleve GTA VI, es lo mejor.»","«Carros? Então leve o GTA VI, é o melhor.»","«Машины? Тогда берите GTA VI, это лучшее.»","«መካይን? እንተኾነ GTA VI ውሰዱ፡ ዝበለጸ እዩ።»")
    ],c:1,
    e:X("Nicht raten! Der Zettel zeigt den Wunsch. GTA ist nur für Erwachsene und passt hier nicht.","¡No adivinar! La nota muestra el deseo. GTA es solo para adultos y aquí no encaja.","Não adivinhar! O bilhete mostra o desejo. GTA é só para adultos e não combina aqui.","Не угадывать! Записка показывает желание. GTA только для взрослых и здесь не подходит.","ኣይትገምት! እታ ወረቐት ድሌት የርእይ። GTA ንዓበይቲ ጥራይ እዩ፡ ኣብዚ ኣይምዕብልን።")}
  ]
 },
 js:{
  t:X("Jugendschutz","Protección de menores","Proteção de menores","Защита несовершеннолетних","ሓለዋ ቈልዑ"),
  d:X("Frau Weber sagt: „Mein Sohn ist 13 und wünscht sich GTA VI. Geben Sie mir das bitte.“ Was sagst du?","La Sra. Weber dice: «Mi hijo tiene 13 años y quiere GTA VI. Deme eso, por favor.» ¿Qué dices?","A Sra. Weber diz: «Meu filho tem 13 anos e quer GTA VI. Me dê esse, por favor.» O que você diz?","Фрау Вебер говорит: «Моему сыну 13, и он хочет GTA VI. Дайте мне это, пожалуйста.» Что ты скажешь?","ወይዘሮ ዌበር ትብል፦ «ወደይ 13 ዓመት እዩ፡ GTA VI ይደሊ። ሃቡኒ በጃኹም።» ንስኻ እንታይ ትብል?"),
  o:[
   X("„Sehr gern, ich packe es Ihnen ein.“","«Con mucho gusto, se lo empaqueto.»","«Com prazer, vou embrulhar para a senhora.»","«С удовольствием, сейчас упакую.»","«ብሓጐስ፡ ከሸግረልኩም እየ።»"),
   X("„Das Spiel ist ab 18 freigegeben. Darf ich Ihnen eine passende Alternative für 13-Jährige zeigen? Die Entscheidung liegt natürlich bei Ihnen.“","«El juego está calificado para mayores de 18. ¿Puedo mostrarle una alternativa adecuada para chicos de 13? La decisión es suya, por supuesto.»","«O jogo é classificado para maiores de 18. Posso mostrar uma alternativa adequada para crianças de 13 anos? A decisão é da senhora, claro.»","«Игра имеет возрастное ограничение 18+. Могу показать подходящую альтернативу для 13-летних? Решение, конечно, за вами.»","«እዚ ጸወታ ካብ 18 ዓመት ንላዕሊ እዩ። ንናይ 13 ዓመት ዝምጥን ካልእ ኣማራጺ ከርእየኩም ይፍቀደለይ? እቲ ውሳኔ ናትኩም እዩ።»"),
   X("„Das darf ich Ihnen auf keinen Fall verkaufen!“","«¡No puedo venderle eso bajo ningún concepto!»","«Eu não posso de jeito nenhum vender isso à senhora!»","«Я ни в коем случае не могу вам это продать!»","«ብዝኾነ ኣገባብ ክሸጠልኩም ኣይክእልን እየ!»")
  ],c:1,
  e:X("Beraten, nicht belehren: auf die Altersfreigabe hinweisen, Alternative anbieten, die Kundin entscheiden lassen.","Asesorar, no sermonear: señalar la clasificación por edad, ofrecer una alternativa y dejar decidir a la clienta.","Aconselhar, não dar bronca: indicar a classificação etária, oferecer alternativa e deixar a cliente decidir.","Консультировать, а не отчитывать: указать возрастное ограничение, предложить альтернативу, оставить выбор клиентке.","ምኽሪ ሃብ፡ ኣይትግሸጽ፦ ዕድመ ኣመልክት፡ ኣማራጺ ሃብ፡ ዓሚል ትውስን።")
 },
 merk:{
  t:X("Das merkst du dir","Esto debes recordar","Isto você deve lembrar","Запомни","እዚ ዝክሮ"),
  b:[
   X("Verkäufer B war ein Gesprächsförderer: Er hat zugehört, freundlich gesprochen und gefragt.","El vendedor B fue un facilitador de la conversación: escuchó, habló con amabilidad y preguntó.","O vendedor B foi um facilitador da conversa: ouviu, falou com simpatia e perguntou.","Продавец B был «помощником разговора»: слушал, говорил вежливо и спрашивал.","ሸያጢ B ሓጋዚ ዕላል ነበረ፦ ሰምዐ፡ ብሕጉስ ኣገባብ ተዛረበ፡ ሓተተ።"),
   X("Verkäufer A war ein Gesprächsstörer: Er hat nicht zugehört, nicht gefragt und keine Lösung angeboten.","El vendedor A fue un obstáculo para la conversación: no escuchó, no preguntó y no ofreció solución.","O vendedor A foi um obstáculo na conversa: não ouviu, não perguntou e não ofereceu solução.","Продавец A был «помехой разговору»: не слушал, не спрашивал и не предложил решения.","ሸያጢ A ዕንቅፋት ዕላል ነበረ፦ ኣይሰምዐን፡ ኣይሓተተን፡ ፍታሕ ኣየቕረበን።"),
   X("Merksatz: Erst fragen, dann beraten.","Regla: primero preguntar, luego asesorar.","Regra: primeiro perguntar, depois aconselhar.","Правило: сначала спросить, потом консультировать.","ሕጊ፦ ቐዳማይ ሕተት፡ ደሓር ሓሳብ ሃብ።"),
   X("Satzbaustein: „Der Verkäufer hat …, deshalb fühlt sich der Kunde …“","Frase modelo: «El vendedor ha …, por eso el cliente se siente …»","Frase modelo: «O vendedor …, por isso o cliente se sente …»","Образец фразы: «Продавец …, поэтому клиент чувствует себя …»","ናሙና ሓረግ፦ «እቲ ሸያጢ …፡ ስለዚ እቲ ዓሚል …»"),
   X("In den nächsten Modulen übst du: begrüßen (Modul 4) und Fragetechnik (Modul 6).","En los próximos módulos practicas: saludar (módulo 4) y técnica de preguntas (módulo 6).","Nos próximos módulos você pratica: cumprimentar (módulo 4) e técnica de perguntas (módulo 6).","В следующих модулях ты потренируешь: приветствие (модуль 4) и технику вопросов (модуль 6).","ኣብ ዝመጹ ሞዱላት ትለማመድ፦ ሰላምታ (ሞዱል 4) ከምኡውን ኣገባብ ሕቶ (ሞዱል 6)።")
  ],
  basis:X("Basis-Aufgabe: Schreibe in dein Heft, was du zum nächsten Kunden sagst (mit Anführungszeichen).","Tarea básica: escribe en tu cuaderno qué le dices al siguiente cliente (entre comillas).","Tarefa básica: escreva no caderno o que você diz ao próximo cliente (entre aspas).","Базовое задание: запиши в тетрадь, что ты скажешь следующему клиенту (в кавычках).","መሰረታዊ ዕዮ፦ ኣብ ደብተርካ ጽሓፍ፡ ነቲ ዝቕጽል ዓሚል እንታይ ትብሎ (ኣብ ውሽጢ ምልክት ትእምርቲ)።"),
  profi:X("Profi-Aufgabe: Schreibe, was du Frau Weber sagst (wörtliche Rede). Begründe in einem Satz, warum du so fragst.","Tarea Pro: escribe qué le dices a la Sra. Weber (discurso directo). Explica en una frase por qué preguntas así.","Tarefa Pro: escreva o que você diz à Sra. Weber (discurso direto). Explique em uma frase por que pergunta assim.","Задание для профи: запиши, что ты скажешь фрау Вебер (прямой речью). Объясни одним предложением, почему так спрашиваешь.","ዕዮ ንተዓዋትቲ፦ ንወይዘሮ ዌበር እንታይ ከም እትብል ጽሓፍ (ቀጥታዊ ዘረባ)። ስለምንታይ ከምኡ ከም እትሓትት ብሓደ ሓረግ ግለጽ።")

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clean(s,max){return String(s==null?"":s).replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g," ").trim().slice(0,max);}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const PIDRE=/^[a-z2-9]{8}$/;
function drawQR(canvas,text){
  const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 18px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
  const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
  ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}

function labelsOf(s){
  if(s.k==="vote")return [D.scene.la,D.scene.lb];
  if(s.k==="why")return D.why.o;
  if(s.k==="typ")return D.typ.rounds[s.r].o;
  if(s.k==="js")return D.js.o;
  if(s.k==="chk")return D.chk[s.q].o;
  return null;}
function corrOf(s){if(s.k==="typ")return D.typ.rounds[s.r].c;if(s.k==="js")return D.js.c;if(s.k==="chk")return D.chk[s.q].c;return -1;}
function explOf(s){if(s.k==="typ")return D.typ.rounds[s.r].e;if(s.k==="js")return D.js.e;if(s.k==="chk")return D.chk[s.q].e;return null;}

/* ---------- Musik (nur Tafel, Web Audio, keine Dateien) ---------- */
const Mus={on:!!lsGet(KP+"mus"),vol:(typeof lsGet(KP+"vol")==="number")?lsGet(KP+"vol"):0.3,ctx:null,iv:null,fast:false,n:0,
  ensure(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return false;}}
    if(this.ctx.state==="suspended"){try{this.ctx.resume();}catch(e){}}return true;},
  tone(f,t,d,type,v){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v*this.vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);},
  play(fast){if(!this.on)return;if(this.iv&&this.fast===fast)return;this.stopLoop();if(!this.ensure())return;this.fast=fast;
    const bass=[55,55,82.41,55,65.41,65.41,98,65.41],arp=[220,261.63,329.63,261.63,246.94,293.66,369.99,293.66];
    const ms=fast?150:210;
    this.iv=setInterval(()=>{const t=this.ctx.currentTime+0.02,i=this.n++%8;
      this.tone(bass[i],t,ms/1000*0.9,"sawtooth",0.5);
      if(i%2===0||fast)this.tone(arp[i],t,ms/1000*0.7,"square",0.18);
      if(i===0||i===4)this.tone(40,t,0.12,"sine",0.9);},ms);},
  stopLoop(){if(this.iv){clearInterval(this.iv);this.iv=null;}},
  stop(){this.stopLoop();},
  tusch(){if(!this.on||!this.ensure())return;const t=this.ctx.currentTime+0.02;[523.25,659.25,783.99,1046.5].forEach((f,k)=>this.tone(f,t+k*0.11,0.35,"triangle",0.6));},
  set(on){this.on=on;lsSet(KP+"mus",on);if(on)this.ensure();else this.stop();}};

/* ======================= Lehrkraft / Tafel ======================= */
function startTafel(){
  document.title="Tafel – "+D.meta.tafel;
  $("tafel").hidden=false;
  let ST=lsGet(KP+"T");
  if(!ST||typeof ST!=="object"||!ST.code)ST={code:codeGen()};
  Object.assign(ST,Object.assign({i:0,rev:false,t0:0,dur:20000,players:{},votes:{},ans:{},qs:{},ban:{},url:""},ST));
  const save=()=>lsSet(KP+"T",ST);save();
  let conn={up:0,all:0};
  const cur=()=>STEPS[ST.i];
  const net=new Net((t,p)=>{if(t===NS+ST.code+"/in")inMsg(p);},(c)=>{conn=net.count();renderHead();if(c)pub();});
  net.sub(ST.code+"/in");
  const nPl=()=>Object.keys(ST.players).length;
  const active=()=>Object.keys(ST.players).filter(p=>Date.now()-ST.players[p].t<45000);
  function total(pid){let s=0;for(const k in ST.qs)s+=ST.qs[k][pid]||0;return s;}
  function ranks(){const arr=Object.keys(ST.players).map(p=>[p,total(p)]).sort((a,b)=>b[1]-a[1]);const r={};arr.forEach((e,i)=>{r[e[0]]=[e[1],i+1];});return r;}
  function left(){const s=cur();if(s.k!=="chk"||ST.rev)return 0;return Math.max(0,ST.t0+ST.dur-Date.now());}
  function akMap(){const s=cur();const m={};
    if(s.k==="chk"){const a=ST.ans["q"+ST.i]||{};for(const p in a)m[p]=a[p].v;}
    else if(labelsOf(s)){const a=ST.votes["s"+ST.i]||{};for(const p in a)m[p]=a[p];}
    return m;}
  function pub(){
    const s=cur();const qp=(s.k==="chk"&&ST.rev&&ST.qs["q"+ST.i])?ST.qs["q"+ST.i]:{};
    net.pub(ST.code+"/st",{i:ST.i,rev:ST.rev,left:left(),dur:ST.dur,pl:Object.keys(ST.players),ak:akMap(),sc:ranks(),qp:qp,ts:Date.now()},true);}
  setInterval(pub,5000);
  function counts(){const s=cur(),n=labelsOf(s).length,c=new Array(n).fill(0);
    const src=s.k==="chk"?(ST.ans["q"+ST.i]||{}):(ST.votes["s"+ST.i]||{});
    for(const p in src){const v=s.k==="chk"?src[p].v:src[p];if(v>=0&&v<n)c[v]++;}return c;}
  function inMsg(p){
    if(!p||typeof p!=="object")return;
    const pid=clean(p.pid,8);if(!PIDRE.test(pid)||ST.ban[pid])return;
    if(p.type==="hi"){
      const name=clean(p.name,14)||"?",lang=LK.includes(p.lang)?p.lang:"de";
      if(!ST.players[pid]&&nPl()>=80)return;
      ST.players[pid]={name:name,lang:lang,t:Date.now()};save();pub();renderHead();renderLive();return;}
    const pl=ST.players[pid];if(!pl)return;pl.t=Date.now();
    const s=cur();if(p.sid!==ST.i||ST.rev)return;
    const labs=labelsOf(s);if(!labs)return;
    const v=p.v|0;if(!(v>=0&&v<labs.length))return;
    if(p.type==="v"&&s.k!=="chk"){(ST.votes["s"+ST.i]=ST.votes["s"+ST.i]||{})[pid]=v;save();pub();renderLive();}
    else if(p.type==="a"&&s.k==="chk"){
      const a=(ST.ans["q"+ST.i]=ST.ans["q"+ST.i]||{});if(a[pid])return;
      if(Date.now()>ST.t0+ST.dur+1500)return;
      a[pid]={v:v,t:Date.now()};save();pub();renderLive();
      if(Object.keys(a).filter(x=>active().includes(x)).length>=active().length&&active().length>0)reveal();}
  }
  function reveal(){
    const s=cur();if(!hasRev(s)||ST.rev)return;
    ST.rev=true;
    if(s.k==="chk"){const a=ST.ans["q"+ST.i]||{},c=D.chk[s.q].c,m={};
      for(const pid in a){if(a[pid].v===c){const el=Math.max(0,a[pid].t-ST.t0);m[pid]=1000+Math.round(500*Math.max(0,1-el/ST.dur));}}
      ST.qs["q"+ST.i]=m;}
    save();Mus.stop();Mus.tusch();pub();render();}
  function go(i){
    i=Math.max(0,Math.min(STEPS.length-1,i));if(i===ST.i)return;
    ST.i=i;ST.rev=false;const s=cur();
    if(s.k==="chk"){delete ST.ans["q"+i];delete ST.qs["q"+i];ST.dur=D.chk[s.q].pro?30000:20000;ST.t0=Date.now();}
    save();pub();render();musicSync();if(s.k==="end"){Mus.stop();Mus.tusch();}}
  function goGroup(g){const i=STEPS.findIndex(s=>s.g===g);if(i>=0){ST.i=-1;go(i);}}
  function musicSync(){const s=cur();const l=left();
    if(Mus.on&&s.k==="chk"&&!ST.rev&&l>0)Mus.play(l<=8000);else Mus.stop();}
  document.addEventListener("visibilitychange",()=>{if(document.hidden)Mus.stop();else musicSync();});
  setInterval(()=>{const s=cur();
    if(s.k==="chk"&&!ST.rev){const l=left();const b=$("tbar"),tl=$("tleft");
      if(b)b.style.width=Math.round(100*l/ST.dur)+"%";if(tl)tl.textContent=Math.ceil(l/1000);
      if(l<=0)reveal();else musicSync();}},250);

  function joinUrl(){
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+ST.code+(LOCAL?"&bc=1":"");
    if(ST.url){const u=ST.url.trim();return u+(u.includes("?")?"&":"?")+"s="+ST.code+(LOCAL?"&bc=1":"");}
    if(LOCAL)return location.href.split("?")[0]+"?s="+ST.code+"&bc=1";return "";}
  function langCounts(){const c={};LK.forEach(k=>c[k]=0);for(const p in ST.players)c[ST.players[p].lang]=(c[ST.players[p].lang]||0)+1;return c;}
  function renderHead(){
    const c=langCounts(),s=cur();
    $("tkopf").innerHTML=`<span class="ti">${esc(D.meta.tafel)}</span>
      <span class="mini"><canvas id="qrSmall" width="128" height="128"></canvas><span>Code <b>${esc(ST.code)}</b><br>${nPl()} Handys (${LK.map(k=>k.toUpperCase()+" "+c[k]).join(" · ")})<br><span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}</span></span>
      ${GROUPS.map((g,k)=>`<button data-g="${k}" ${s.g===k?'class="pri"':""}>${g}</button>`).join("")}
      <button id="bM" title="Musik (nur Tafel)" aria-pressed="${Mus.on}">${Mus.on?"🔊":"🔈"} Musik ${Mus.on?"an":"aus"}</button>
      <input type="range" id="rV" min="0" max="100" value="${Math.round(Mus.vol*100)}" aria-label="Lautstärke">
      <button id="bZ">‹ Zurück</button><button id="bR" ${hasRev(s)&&!ST.rev?"":"disabled"}>Auflösung</button><button id="bW" class="pri">Weiter ›</button>`;
    drawQR($("qrSmall"),joinUrl());if(window.QRBIG)QRBIG(drawQR,joinUrl);
    $("tkopf").querySelectorAll("button[data-g]").forEach(b=>b.onclick=()=>goGroup(+b.dataset.g));
    $("bZ").onclick=()=>go(ST.i-1);$("bW").onclick=next;$("bR").onclick=reveal;
    $("bM").onclick=()=>{Mus.set(!Mus.on);renderHead();musicSync();};
    $("rV").oninput=e=>{Mus.vol=(+e.target.value)/100;lsSet(KP+"vol",Mus.vol);};
  }
  function next(){go(ST.i+1);}
  document.addEventListener("keydown",e=>{
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();next();}
    else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();go(ST.i-1);}
    else if(e.key==="r"||e.key==="R"){reveal();}
  });

  function bars(labs,cnt,c,show,quiz){
    const mx=Math.max(1,...cnt);
    return labs.map((l,k)=>`<div class="opt ${quiz?"qz c"+k:""} ${show&&c===k?"ok":""} ${show&&c>=0&&c!==k?"dim":""}"><span class="ol">${quiz?SHAPES[k]:LET[k]}</span><span class="ot">${esc(l.de)}</span><span class="bar"><i style="width:${Math.round(100*cnt[k]/mx)}%"></i></span><b class="cn">${cnt[k]}</b></div>`).join("");}
  function plainOpts(labs,quiz){return labs.map((l,k)=>`<div class="opt ${quiz?"qz c"+k:""}"><span class="ol">${quiz?SHAPES[k]:LET[k]}</span><span class="ot">${esc(l.de)}</span></div>`).join("");}
  function lines(arr){return arr.map(l=>`<div class="ln ${l.w}"><b>${l.w}</b> ${esc(l.x.de)}</div>`).join("");}
  function podium(){
    const r=ranks(),arr=Object.keys(ST.players).map(p=>({p:p,n:ST.players[p].name,s:r[p][0]})).sort((a,b)=>b.s-a.s);
    const t=arr.slice(0,3),ord=[t[1],t[0],t[2]],cls=["p2","p1","p3"],med=["2.","1.","3."];
    return `<div class="podium">${ord.map((e,k)=>e?`<div class="p ${cls[k]}"><div style="font-size:1.4em">${med[k]}</div><b>${esc(e.n)}</b><br>${e.s}</div>`:"").join("")}</div>`+
      `<div class="hint">${arr.slice(3,10).map((e,k)=>`${k+4}. ${esc(e.n)} (${e.s})`).join(" · ")}</div>`;}
  function render(){
    renderHead();
    const M=$("tmain"),s=cur();let h="";
    if(s.k==="start"){
      const u=joinUrl();
      M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="560" height="560"></canvas></div>
        <div><h1>${esc(D.meta.start)}</h1>
        <p class="muted" style="font-size:.8em">Code: <span class="code">${esc(ST.code)}</span></p>
        <div class="sprachen">${LK.map(k=>`<div lang="${k}">${esc(UI.start[k])}</div>`).join("")}</div>
        <div class="plist" id="plist"></div>
        ${location.protocol.startsWith("http")||LOCAL?"":`<label class="urlbox">Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist, z. B. https://…github.io/…/index.html)<input id="tUrl" value="${esc(ST.url)}" placeholder="https://"></label>`}
        <p class="muted" id="jU" style="word-break:break-all"></p>
        <button class="chip" id="bNew">Neue Sitzung (alles zurücksetzen)</button></div></div>`;
      drawQR($("qrBig"),u);$("jU").textContent=u;
      const ti=$("tUrl");if(ti)ti.oninput=()=>{ST.url=ti.value;save();renderHead();drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();};
      $("bNew").onclick=()=>{if(confirm("Neue Sitzung starten? Alle Handys und Punkte werden zurückgesetzt.")){try{localStorage.removeItem(KP+"T");}catch(e){}location.reload();}};
      renderLive();return;}
    if(s.k==="scene"){
      h=`<h1>${esc(D.scene.t.de)}</h1><div class="lead">${esc(D.scene.intro.de)}</div><div class="dia"><div class="col"><h2>${esc(D.scene.la.de)}</h2>${lines(D.scene.A)}</div><div class="col"><h2>${esc(D.scene.lb.de)}</h2>${lines(D.scene.B)}</div></div>`;}
    else if(s.k==="vote"||s.k==="why"){
      const q=s.k==="vote"?D.vote.q:D.why.q;
      h=`<h1>${esc(q.de)}</h1>${bars(labelsOf(s),counts(),-1,true,false)}<div class="hint">${Object.keys(ST.votes["s"+ST.i]||{}).length} von ${nPl()} haben abgestimmt.</div>`;}
    else if(s.k==="typ"||s.k==="js"){
      const r=s.k==="typ"?D.typ.rounds[s.r]:D.js;
      h=`<h1>${esc(s.k==="typ"?D.typ.q.de:D.js.t.de)}</h1><div class="cust">${esc(r.d.de)}</div>`+
        (ST.rev?bars(r.o,counts(),r.c,true,false)+`<div class="expl">${esc(r.e.de)}</div>`:plainOpts(r.o,false)+`<div class="hint">${Object.keys(ST.votes["s"+ST.i]||{}).length} von ${nPl()} haben abgestimmt. „Auflösung“ zeigt das Ergebnis.</div>`);}
    else if(s.k==="merk"){
      h=`<h1>${esc(D.merk.t.de)}</h1><div style="font-size:.8em"><ul>${D.merk.b.map(b=>`<li>${esc(b.de)}</li>`).join("")}</ul><div class="cust"><span class="tag">Basis</span>${esc(D.merk.basis.de)}</div><div class="cust"><span class="tag">★ Profi</span>${esc(D.merk.profi.de)}</div></div>`;}
    else if(s.k==="chk"){
      const c=D.chk[s.q];
      h=`<div class="lead">${esc(UI.frage.de)} ${s.q+1} / ${D.chk.length} ${c.pro?'<span class="tag">★ Profi-Frage</span>':""}${c.wh?`<span class="tag">${esc(D.meta.wh)}</span>`:""}</div><h1>${esc(c.q.de)}</h1>`+
        (ST.rev?`<div class="hint">${Object.keys(ST.ans["q"+ST.i]||{}).length} Antworten</div>`+bars(c.o,counts(),c.c,true,true)+`<div class="expl">${esc(c.e.de)}</div>`+top5():
         `<div class="timer"><i id="tbar" style="width:${Math.round(100*left()/ST.dur)}%"></i></div><div class="hint">noch <b id="tleft">${Math.ceil(left()/1000)}</b> s · <span id="aCnt">${Object.keys(ST.ans["q"+ST.i]||{}).length}</span> Antworten</div>`+plainOpts(c.o,true));}
    else if(s.k==="end"){
      h=`<h1>${esc(D.end.t.de)}</h1><div class="lead">${esc(D.end.s.de)}</div>`+podium();}
    M.innerHTML=h;
  }
  function top5(){const r=ranks(),arr=Object.keys(ST.players).map(p=>({n:ST.players[p].name,s:r[p][0]})).sort((a,b)=>b.s-a.s).slice(0,5);
    return `<div class="hint" style="margin-top:.6em">Spitzenplätze: ${arr.map((e,k)=>`${k+1}. ${esc(e.n)} (${e.s})`).join(" · ")}</div>`;}
  function renderLive(){
    const s=cur();
    if(s.k==="start"){const pl=$("plist");if(pl){pl.innerHTML=Object.keys(ST.players).map(p=>`<button class="chip" data-p="${p}" title="Antippen = entfernen">${esc(ST.players[p].name)} · ${ST.players[p].lang.toUpperCase()}</button>`).join("");
      pl.querySelectorAll("button").forEach(b=>b.onclick=()=>{ST.ban[b.dataset.p]=1;delete ST.players[b.dataset.p];save();pub();renderHead();renderLive();});}}
    else if(s.k==="chk"&&!ST.rev){const a=$("aCnt");if(a)a.textContent=Object.keys(ST.ans["q"+ST.i]||{}).length;}
    else render();
  }
  render();musicSync();
}

/* ======================= Schüler / Handy ======================= */
function startHandy(){
  const code=params.get("s"),SK=params.get("t")||"";
  $("handy").hidden=false;document.title=D.meta.tafel;
  let pid=lsGet(KP+"pid"+SK);if(!PIDRE.test(pid||"")){pid=rnd(8);lsSet(KP+"pid"+SK,pid);}
  const S={lang:lsGet(KP+"lang"+SK),tr:lsGet(KP+"tr"+SK)!==false,name:lsGet(KP+"name"+SK)||"",i:0,rev:false,end:0,dur:20000,got:false,pl:[],ak:{},sc:{},qp:{},my:{}};
  if(S.lang&&!LK.includes(S.lang))S.lang=null;
  let conn={up:0,all:0},lastKey="";
  const net=new Net((t,p)=>{
    if(t===NS+code+"/st"&&p&&typeof p==="object"&&typeof p.i==="number"){
      if(p.i!==S.i||!S.got){delete S.my[p.i];}
      S.got=true;S.i=p.i;S.rev=!!p.rev;S.end=Date.now()+(p.left||0);S.dur=p.dur||20000;
      S.pl=Array.isArray(p.pl)?p.pl:[];S.ak=p.ak&&typeof p.ak==="object"?p.ak:{};S.sc=p.sc&&typeof p.sc==="object"?p.sc:{};S.qp=p.qp&&typeof p.qp==="object"?p.qp:{};
      flush();render();}
  },()=>{conn=net.count();renderKopf();if(conn.up)flush(true);});
  net.sub(code+"/st");
  const pend={};
  function send(o){net.pub(code+"/in",Object.assign({pid:pid},o));}
  function flush(force){
    if(S.name&&S.lang&&(!S.pl.includes(pid)||force))send({type:"hi",name:S.name,lang:S.lang});
    if(pend.v){if(pend.v.done())pend.v=null;else send(pend.v.obj);}
  }
  setInterval(()=>flush(false),2500);
  setInterval(()=>{if(S.name&&S.lang)send({type:"hi",name:S.name,lang:S.lang});},20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)flush(true);});
  const expired=()=>STEPS[S.i].k==="chk"&&!S.rev&&Date.now()>=S.end;
  function tx(x){
    if(S.lang==="de"||!S.tr||!S.lang)return `<span class="de">${esc(x.de)}</span>`;
    return `<span class="de">${esc(x.de)}</span><span class="tl" lang="${S.lang}">${esc(x[S.lang])}</span>`;}
  function setLang(l){S.lang=l;lsSet(KP+"lang"+SK,l);lastKey="";render();if(S.name)flush(true);}
  function renderKopf(){
    if(!S.lang){$("hkopf").innerHTML="";return;}
    const l=S.lang;
    $("hkopf").innerHTML=LANGS.map(e=>`<button data-l="${e[0]}" lang="${e[0]}" aria-pressed="${l===e[0]}">${e[1]}</button>`).join("")+
      `<span class="st"><span class="dot ${conn.up?"on":""}"></span>${esc(UI[conn.up?"verb":"keinev"][l])}</span>`+
      (l!=="de"?`<button class="bigtr" id="bTr" aria-pressed="${S.tr}">${esc(UI.uebers[l])} ${S.tr?"✓":""}</button>`:"");
    $("hkopf").querySelectorAll("button[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
    const bt=$("bTr");if(bt)bt.onclick=()=>{S.tr=!S.tr;lsSet(KP+"tr"+SK,S.tr);lastKey="";renderKopf();render();};
  }
  function optsView(s){
    const labs=labelsOf(s),c=corrOf(s),my=S.my[S.i],isChk=s.k==="chk";
    const locked=S.rev||(isChk&&(my!==undefined||expired()));
    return labs.map((x,k)=>{let cls="op "+(isChk?"c"+k:"");if(my===k)cls+=" sel";
      if(S.rev&&c>=0){if(k===c)cls+=" ok";else if(my===k)cls+=" bad";}
      return `<button class="${cls}" data-k="${k}" ${locked?"disabled":""}><span class="sh">${isChk?SHAPES[k]:LET[k]}</span><span class="tb">${tx(x)}</span></button>`;}).join("");}
  function feedback(s){
    const c=corrOf(s),my=S.my[S.i];if(!S.rev||c<0)return "";
    let h="";
    if(my===undefined)h+=`<div class="fb bad">${tx(UI.zeit)}</div>`;
    else if(my===c)h+=`<div class="fb ok">${tx(UI.richtig)}${s.k==="chk"&&S.qp[pid]?" +"+S.qp[pid]:""}</div>`;
    else h+=`<div class="fb bad">${tx(UI.falsch)}</div>`;
    h+=`<div class="item"><b>${tx(UI.korrekt)}</b></div><div class="item">${tx(labelsOf(s)[c])}</div><div class="item expl">${tx(explOf(s))}</div>`;
    if(s.k==="chk"){const r=S.sc[pid];if(r)h+=`<div class="rank">${esc(UI.platz[S.lang])} ${r[1]} · ${r[0]} ${esc(UI.pkt[S.lang])}</div>`;}
    return h;}
  function view(){
    const s=STEPS[S.i]||STEPS[0],my=S.my[S.i];let h="";
    if(s.k==="start")return `<h1>${tx(UI.willk)}</h1>${S.got?"":`<div class="item">${tx(UI.warte)}</div>`}`;
    if(s.k==="scene"){
      h=`<h1>${tx(D.scene.t)}</h1><div class="item">${tx(D.scene.intro)}</div>`;
      for(const [lab,arr] of [[D.scene.la,D.scene.A],[D.scene.lb,D.scene.B]])
        h+=`<div class="dbox"><h2>${tx(lab)}</h2>${arr.map(l=>`<div class="item ln${l.w}"><b>${l.w}</b> ${tx(l.x)}</div>`).join("")}</div>`;
      return h;}
    if(s.k==="vote"||s.k==="why"){
      h=`<h1>${tx(s.k==="vote"?D.vote.q:D.why.q)}</h1>`+optsView(s);
      if(my!==undefined)h+=`<div class="item">${tx(UI.gewaehlt)}</div>`;return h;}
    if(s.k==="typ"||s.k==="js"){
      const r=s.k==="typ"?D.typ.rounds[s.r]:D.js;
      h=`<h1>${tx(s.k==="typ"?D.typ.q:D.js.t)}</h1><div class="item">${tx(r.d)}</div>`+optsView(s);
      if(!S.rev&&my!==undefined)h+=`<div class="item">${tx(UI.gewaehlt)}</div>`;
      return h+feedback(s);}
    if(s.k==="merk"){
      h=`<h1>${tx(D.merk.t)}</h1>`+D.merk.b.map(b=>`<div class="item li">${tx(b)}</div>`).join("");
      h+=`<div class="dbox"><div class="item">${tx(D.merk.basis)}</div></div><div class="dbox"><div class="item">★ ${tx(D.merk.profi)}</div></div>`;return h;}
    if(s.k==="chk"){
      const c=D.chk[s.q];
      h=`<h1>${esc(UI.frage.de)} ${s.q+1} / ${D.chk.length}${c.pro?" · ★ "+esc(UI.profi.de):""}${(S.lang!=="de"&&S.tr)?`<span class="tl" lang="${S.lang}">${esc(UI.frage[S.lang])} ${s.q+1} / ${D.chk.length}${c.pro?" · ★ "+esc(UI.profi[S.lang]):""}</span>`:""}</h1>`;
      if(!S.rev&&!expired())h+=`<div class="timer"><i id="pT" style="width:${Math.max(0,Math.min(100,100*(S.end-Date.now())/S.dur))}%"></i></div>`;
      h+=`<div class="item">${tx(c.q)}</div>`+optsView(s);
      if(!S.rev&&my!==undefined)h+=`<div class="item">${tx(UI.gesendet)}</div>`;
      if(!S.rev&&my===undefined&&expired())h+=`<div class="item">${tx(UI.zeit)}</div>`;
      return h+feedback(s);}
    if(s.k==="end"){
      const r=S.sc[pid];h=`<h1>${tx(D.end.t)}</h1><div class="item">${tx(D.end.s)}</div>`;
      if(r)h+=`<div class="rank">${esc(UI.platz[S.lang])} ${r[1]} · ${r[0]} ${esc(UI.pkt[S.lang])}</div>`;return h;}
    return "";}
  function render(){
    const M=$("hmain");renderKopf();
    if(!S.lang){M.innerHTML=`<div class="sprachwahl"><h2>${LK.map(k=>UI.wahl[k]).join(" · ")}</h2>${LANGS.map(e=>`<button data-l="${e[0]}" lang="${e[0]}">${e[1]}</button>`).join("")}</div>`;
      M.querySelectorAll("button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));return;}
    if(!S.name){M.innerHTML=`<div class="namebox"><h2>${tx(UI.name)}</h2><input id="inN" maxlength="14" autocomplete="off" placeholder="…"><button id="bGo">${esc(UI.los[S.lang])}</button></div>`;
      const go=()=>{const n=clean($("inN").value,14);if(!n)return;S.name=n;lsSet(KP+"name"+SK,n);lastKey="";render();flush(true);};
      $("bGo").onclick=go;$("inN").onkeydown=e=>{if(e.key==="Enter")go();};return;}
    const key=[S.lang,S.tr,S.i,S.rev,S.my[S.i],S.pl.includes(pid),expired(),S.got,(S.sc[pid]||[]).join(),S.qp[pid]||0].join("|");
    if(key===lastKey)return;lastKey=key;
    M.className=(S.lang==="de"||!S.tr)?"nurde":"";
    M.innerHTML=view();
    M.querySelectorAll("button.op").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
    window.scrollTo(0,0);
  }
  function choose(k){
    const s=STEPS[S.i],sid=S.i;
    if(s.k==="chk"){if(S.my[sid]!==undefined||S.rev||expired())return;S.my[sid]=k;
      pend.v={obj:{type:"a",sid:sid,v:k},done:()=>S.i!==sid||S.ak[pid]===k};}
    else{if(S.rev)return;S.my[sid]=k;pend.v={obj:{type:"v",sid:sid,v:k},done:()=>S.i!==sid||S.ak[pid]===k};}
    send(pend.v.obj);lastKey="";render();
  }
  setInterval(()=>{const t=$("pT");if(t){t.style.width=Math.max(0,Math.min(100,100*(S.end-Date.now())/S.dur))+"%";}
    if(S.name&&S.lang&&STEPS[S.i].k==="chk")render();},300);
  render();
}
if(STUDENT)startHandy();else startTafel();

</script>
