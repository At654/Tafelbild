undenansprache an der Kasse beim Bezahlen mit Bargeld. (aus LF 3)","vi":"A2 Nenne die vier Schritte der Kundenansprache an der Kasse beim Bezahlen mit Bargeld. (aus LF 3)\n🇻🇳 A2 Nêu bốn bước nói với khách ở quầy thu ngân khi khách trả bằng tiền mặt. (từ LF 3)"},"m":{"de":"Betrag nennen – Geld annehmen und Wert nennen – Geld auf die Kasse legen – Rückgeld vorzählen","vi":"Betrag nennen – Geld annehmen und Wert nennen – Geld auf die Kasse legen – Rückgeld vorzählen\n🇻🇳 Nói số tiền – nhận tiền và nói giá trị – đặt tiền lên quầy – đếm tiền thối trước mặt khách"},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":0.5},{"id":"g1","no":"Aufgabe 2","title":{"de":"Ankommen: Prozent im Alltag","vi":"Ankommen: Prozent im Alltag · Khởi động: phần trăm trong đời sống"},"instr":{"de":"Aus dem Kopf, ohne Taschenrechner.","vi":"Aus dem Kopf, ohne Taschenrechner.\n🇻🇳 Tính nhẩm, không dùng máy tính."},"tip":{"de":"Rechne im Kopf: 10 % ist ein Zehntel, 50 % ist die Hälfte, 25 % ist ein Viertel. Teile den Betrag durch 10, durch 2 oder durch 4.","vi":"Tính nhẩm: 10 % là một phần mười, 50 % là một nửa, 25 % là một phần tư. Chia số tiền cho 10, cho 2 hoặc cho 4."},"type":"calc","parts":[{"q":{"de":"a) 10 % von 80 €","vi":"a) 10 % von 80 €\n🇻🇳 a) 10 % của 80 €"},"u":"€","a":8,"tol":0.005,"steps":["8,00 €"]},{"q":{"de":"b) 50 % von 30 €","vi":"b) 50 % von 30 €\n🇻🇳 b) 50 % của 30 €"},"u":"€","a":15,"tol":0.005,"steps":["15,00 €"]},{"q":{"de":"c) 25 % von 200 €","vi":"c) 25 % von 200 €\n🇻🇳 c) 25 % của 200 €"},"u":"€","a":50,"tol":0.005,"steps":["50,00 €"]}],"pts":1.5},{"id":"g1_1","no":"Aufgabe 2","title":{"de":"Ankommen: Prozent im Alltag","vi":"Ankommen: Prozent im Alltag · Khởi động: phần trăm trong đời sống"},"instr":{"de":"Aus dem Kopf, ohne Taschenrechner.","vi":"Aus dem Kopf, ohne Taschenrechner.\n🇻🇳 Tính nhẩm, không dùng máy tính."},"tip":{"de":"„Zuzüglich“ ist das Gegenteil von „abzüglich“. Wird der Betrag größer oder kleiner?","vi":"„Zuzüglich“ là trái nghĩa của „abzüglich“. Số tiền tăng lên hay giảm đi?"},"type":"free","parts":[{"q":{"de":"d) Auf einer Rechnung steht „zuzüglich 19 % Umsatzsteuer“. Was bedeutet das?","vi":"d) Auf einer Rechnung steht „zuzüglich 19 % Umsatzsteuer“. Was bedeutet das?\n🇻🇳 d) Trên hóa đơn ghi „zuzüglich 19 % Umsatzsteuer“. Điều đó nghĩa là gì?"},"m":{"de":"Zum Preis kommen noch 19 % Steuer dazu.","vi":"Zum Preis kommen noch 19 % Steuer dazu.\n🇻🇳 Phải cộng thêm 19 % thuế vào giá."},"w":["die Umsatzsteuer","der Preis","zuzüglich","die Rechnung"],"s":["Das bedeutet: …","Zum Preis …"]}],"pts":0.5},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher · Wortspeicher (kho từ)"},"html":"<p>das Prozent (%) · von Hundert · der Grundwert (das Ganze, 100 %) · der Prozentwert (der Teil) · der Prozentsatz (die Zahl mit %) · der Faktor · multiplizieren (mal) · dividieren (geteilt durch) · der Aufschlag · der Nachlass · runden · die Nachkommastelle</p>","vi":"Prozent (%) = phần trăm · von Hundert = trên một trăm · Grundwert (das Ganze, 100 %) = giá trị gốc (toàn bộ, 100 %) · Prozentwert (der Teil) = giá trị phần trăm (một phần) · Prozentsatz (die Zahl mit %) = tỉ lệ phần trăm (con số có %) · Faktor = hệ số · multiplizieren (mal) = nhân · dividieren (geteilt durch) = chia · Aufschlag = khoản cộng thêm · Nachlass = khoản giảm giá · runden = làm tròn · Nachkommastelle = chữ số sau dấu phẩy"},{"id":"r1","no":"Lesen 1","type":"read","title":{"de":"Was heißt Prozent?","vi":"Was heißt Prozent? · Phần trăm nghĩa là gì?"},"instr":{"de":"Markiere, was Prozent bedeutet und wie viel der Ausgangspreis immer ist.","vi":"Markiere, was Prozent bedeutet und wie viel der Ausgangspreis immer ist.\n🇻🇳 Đánh dấu phần trăm nghĩa là gì và giá ban đầu luôn là bao nhiêu."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Prozent heißt [[von Hundert]]. 19 % sind 19 von 100 – also [[0,19]]. Der Preis, von dem du ausgehst, ist immer [[100 %]]. Er ist nie 19 %."],"vi":"Phần trăm nghĩa là „trên một trăm“. 19 % là 19 trên 100 – tức là 0,19. Giá mà em bắt đầu tính luôn là 100 %. Nó không bao giờ là 19 %.","quiz":{"q":{"de":"Wie schreibt man 19 % als Dezimalzahl?","vi":"Wie schreibt man 19 % als Dezimalzahl?\n🇻🇳 19 % viết thành số thập phân như thế nào?"},"o":["1,9","0,19","19,0"],"a":1,"why":{"de":"Richtig ist: 0,19","vi":"Đáp án đúng: 0,19"}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Der Faktor-Trick","vi":"Der Faktor-Trick · Mẹo dùng hệ số"},"instr":{"de":"Markiere die drei Rechenwege: aufschlagen, abziehen, zurückrechnen.","vi":"Markiere die drei Rechenwege: aufschlagen, abziehen, zurückrechnen.\n🇻🇳 Đánh dấu ba cách tính: cộng thêm, trừ đi, tính ngược lại."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Willst du p % aufschlagen (Steuer, Handlungskosten, Gewinn), rechnest du [[mal (1 + p : 100)]]. Beispiel: + 19 % heißt mal 1,19. Willst du p % abziehen (Rabatt, Skonto, Preissenkung), rechnest du [[mal (1 – p : 100)]]. Beispiel: – 10 % heißt mal 0,9. Willst du zurückrechnen, zum Beispiel von brutto nach netto, rechnest du [[geteilt durch denselben Faktor]]. Du rechnest nicht minus 19."],"vi":"Nếu muốn cộng thêm p % (thuế, Handlungskosten, lợi nhuận), em nhân với (1 + p : 100). Ví dụ: + 19 % nghĩa là nhân 1,19. Nếu muốn trừ p % (Rabatt, Skonto, giảm giá), em nhân với (1 – p : 100). Ví dụ: – 10 % nghĩa là nhân 0,9. Nếu muốn tính ngược lại, ví dụ từ brutto về netto, em chia cho chính hệ số đó. Em không tính trừ 19.","quiz":{"q":{"de":"119,00 € brutto (19 %) – wie rechnest du netto aus?","vi":"119,00 € brutto (19 %) – wie rechnest du netto aus?\n🇻🇳 119,00 € brutto (19 %) – em tính netto như thế nào?"},"o":["119,00 · 0,81","119,00 : 1,19","119,00 – 19"],"a":1,"why":{"de":"Richtig ist: 119,00 : 1,19","vi":"Đáp án đúng: 119,00 : 1,19"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"Mehrere Prozente und Runden","vi":"Mehrere Prozente und Runden · Nhiều phần trăm và làm tròn"},"instr":{"de":"Markiere, wie man mehrere Faktoren verrechnet und wie die IHK rundet.","vi":"Markiere, wie man mehrere Faktoren verrechnet und wie die IHK rundet.\n🇻🇳 Đánh dấu cách tính nhiều hệ số và cách IHK làm tròn."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Faktoren werden [[hintereinander malgenommen]], nie zusammengezählt. Beispiel: 100 € + 10 % + 10 % = 100 · 1,1 · 1,1 = 121 €. Zwischenergebnisse werden [[nicht gerundet]]. Euro rundest du auf [[2 Nachkommastellen]], den Kalkulationsfaktor auf [[4 Nachkommastellen]]."],"vi":"Các hệ số được nhân nối tiếp nhau, không bao giờ cộng lại. Ví dụ: 100 € + 10 % + 10 % = 100 · 1,1 · 1,1 = 121 €. Kết quả trung gian không được làm tròn. Euro làm tròn đến 2 chữ số sau dấu phẩy, Kalkulationsfaktor đến 4 chữ số sau dấu phẩy.","quiz":{"q":{"de":"100 € + 10 % + 10 % sind …","vi":"100 € + 10 % + 10 % sind …\n🇻🇳 100 € + 10 % + 10 % là …"},"o":["120 €","121 €","110 €"],"a":1,"why":{"de":"Richtig ist: 121 €","vi":"Đáp án đúng: 121 €"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Der Faktor-Trick</h4><p>p % aufschlagen (Steuer, Handlungskosten, Gewinn): mal (1 + p : 100) · Beispiel: + 19 % → · 1,19 · + 50 % → · 1,5</p><p>p % abziehen (Rabatt, Skonto, Preissenkung): mal (1 – p : 100) · Beispiel: – 10 % → · 0,9 · – 2 % → · 0,98</p><p>zurückrechnen (z. B. brutto → netto): geteilt durch denselben Faktor · Beispiel: 119,00 € : 1,19 = 100,00 €</p><p>Warum? Aus 100 % werden bei + 19 % genau 119 %. 119 % sind 1,19. Wer mit 1,19 malnimmt, hat Preis und Steuer in einem Schritt.</p><h4>Runden wie die IHK</h4><p>Zwischenergebnisse nicht runden – alles in einer Kette in den Taschenrechner tippen.</p><p>Euro auf 2 Nachkommastellen: 27,694 → 27,69 · 12,566 → 12,57.</p><p>Kalkulationsfaktor auf 4 Nachkommastellen: 1,785714 → 1,7857.</p><p>Prozent: so, wie es in der Aufgabe steht.</p><p><b>Merke:</b> Plus p % heißt mal (1 + p : 100). Minus p % heißt mal (1 – p : 100). Zurück heißt geteilt durch denselben Faktor. Mehrere Prozente: Faktoren nacheinander malnehmen.</p>","vi":"Mẹo dùng hệ số\nCộng thêm p % (thuế, Handlungskosten, lợi nhuận): nhân (1 + p : 100) · Ví dụ: + 19 % → · 1,19 · + 50 % → · 1,5\nTrừ p % (Rabatt, Skonto, giảm giá): nhân (1 – p : 100) · Ví dụ: – 10 % → · 0,9 · – 2 % → · 0,98\nTính ngược lại (ví dụ brutto → netto): chia cho chính hệ số đó · Ví dụ: 119,00 € : 1,19 = 100,00 €\nVì sao? Với + 19 % thì 100 % trở thành đúng 119 %. 119 % là 1,19. Ai nhân với 1,19 thì có cả giá và thuế trong một bước.\nLàm tròn như IHK\nKhông làm tròn kết quả trung gian – bấm tất cả thành một chuỗi vào máy tính.\nEuro đến 2 chữ số sau dấu phẩy: 27,694 → 27,69 · 12,566 → 12,57.\nKalkulationsfaktor đến 4 chữ số sau dấu phẩy: 1,785714 → 1,7857.\nPhần trăm: theo đúng yêu cầu trong đề bài.\nGhi nhớ: Cộng p % nghĩa là nhân (1 + p : 100). Trừ p % nghĩa là nhân (1 – p : 100). Tính ngược lại nghĩa là chia cho chính hệ số đó. Nhiều phần trăm: nhân các hệ số nối tiếp nhau."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: drei Rechnungen mit dem Faktor","vi":"Vorgemacht: drei Rechnungen mit dem Faktor · Làm mẫu: ba phép tính với hệ số"},"html":"<p><b>Jacke 80,00 € netto, + 19 % Umsatzsteuer:</b> + 19 % → · 1,19 · 80,00 · 1,19 = 95,20 €</p><p><b>Rechnung 250,00 €, – 10 % Rabatt:</b> – 10 % → · 0,9 · 250,00 · 0,9 = 225,00 €</p><p><b>Preis 59,50 € brutto – wie viel netto?</b> zurück → geteilt durch 1,19 · 59,50 : 1,19 = 50,00 €</p><p><b>Taschenrechner:</b> 80 × 1,19 = · 250 × 0,9 = · 59,5 ÷ 1,19 =</p>","vi":"Áo khoác 80,00 € netto, + 19 % thuế: + 19 % → · 1,19 · 80,00 · 1,19 = 95,20 €\nHóa đơn 250,00 €, – 10 % Rabatt: – 10 % → · 0,9 · 250,00 · 0,9 = 225,00 €\nGiá 59,50 € brutto – netto là bao nhiêu? tính ngược → chia cho 1,19 · 59,50 : 1,19 = 50,00 €\nMáy tính: 80 × 1,19 = · 250 × 0,9 = · 59,5 ÷ 1,19 ="},{"id":"g2","no":"Aufgabe 3","title":{"de":"Geführte Übung: Prozent in Faktor übersetzen","vi":"Geführte Übung: Prozent in Faktor übersetzen · Bài tập có hướng dẫn: đổi phần trăm thành hệ số"},"instr":{"de":"Übersetze die Prozentangabe in einen Faktor. Schreibe nur die Zahl, z. B. 1,19.","vi":"Übersetze die Prozentangabe in einen Faktor. Schreibe nur die Zahl, z. B. 1,19.\n🇻🇳 Đổi số phần trăm thành hệ số. Chỉ viết con số, ví dụ 1,19."},"tip":{"de":"Plus oder minus? Bei Plus wird der Faktor größer als 1, bei Minus kleiner als 1. Plus p % heißt mal (1 + p : 100). Minus p % heißt mal (1 – p : 100).","vi":"Cộng hay trừ? Khi cộng thì hệ số lớn hơn 1, khi trừ thì hệ số nhỏ hơn 1. Cộng p % nghĩa là nhân (1 + p : 100). Trừ p % nghĩa là nhân (1 – p : 100)."},"type":"calc","parts":[{"q":"+ 19 % → Faktor?","u":"","a":1.19,"tol":0.005,"steps":["1,19"]},{"q":"+ 7 % → Faktor?","u":"","a":1.07,"tol":0.005,"steps":["1,07"]},{"q":"+ 60 % → Faktor?","u":"","a":1.6,"tol":0.05,"steps":["1,6"]},{"q":"+ 25 % → Faktor?","u":"","a":1.25,"tol":0.005,"steps":["1,25"]},{"q":"– 10 % → Faktor?","u":"","a":0.9,"tol":0.05,"steps":["0,9"]},{"q":"– 3 % → Faktor?","u":"","a":0.97,"tol":0.005,"steps":["0,97"]},{"q":"– 20 % → Faktor?","u":"","a":0.8,"tol":0.05,"steps":["0,8"]},{"q":"– 25 % → Faktor?","u":"","a":0.75,"tol":0.005,"steps":["0,75"]}],"pts":4},{"id":"g3","no":"Aufgabe 4","title":{"de":"Geführte Übung: Rechnen mit dem Faktor","vi":"Geführte Übung: Rechnen mit dem Faktor · Bài tập có hướng dẫn: tính với hệ số"},"instr":{"de":"Rechne mit dem Faktor. Vorgemacht: 45,00 € + 19 % Umsatzsteuer = 45,00 · 1,19 = 53,55 €.","vi":"Rechne mit dem Faktor. Vorgemacht: 45,00 € + 19 % Umsatzsteuer = 45,00 · 1,19 = 53,55 €.\n🇻🇳 Tính với hệ số. Làm mẫu: 45,00 € + 19 % thuế = 45,00 · 1,19 = 53,55 €."},"tip":{"de":"Plus oder minus? Bei Plus wird der Faktor größer als 1, bei Minus kleiner als 1. Plus p % heißt mal (1 + p : 100). Minus p % heißt mal (1 – p : 100).","vi":"Cộng hay trừ? Khi cộng thì hệ số lớn hơn 1, khi trừ thì hệ số nhỏ hơn 1. Cộng p % nghĩa là nhân (1 + p : 100). Trừ p % nghĩa là nhân (1 – p : 100)."},"type":"calc","parts":[{"q":{"de":"120,00 € – 15 % Rabatt","vi":"120,00 € – 15 % Rabatt\n🇻🇳 120,00 € – 15 % Rabatt (giảm giá)"},"u":"€","a":102,"tol":0.005,"steps":["120,00 · 0,85 = 102,00 €"]},{"q":{"de":"360,00 € – 2 % Skonto","vi":"360,00 € – 2 % Skonto\n🇻🇳 360,00 € – 2 % Skonto (giảm khi trả nhanh)"},"u":"€","a":352.8,"tol":0.005,"steps":["360,00 · 0,98 = 352,80 €"]},{"q":"23,80 € brutto (19 %) → netto","u":"€","a":20,"tol":0.005,"steps":["23,80 : 1,19 = 20,00 €"]},{"q":"2,14 € brutto (7 %) → netto","u":"€","a":2,"tol":0.005,"steps":["2,14 : 1,07 = 2,00 €"]},{"q":{"de":"50,00 € + 50 %, dann + 10 %","vi":"50,00 € + 50 %, dann + 10 %\n🇻🇳 50,00 € + 50 %, sau đó + 10 %"},"u":"€","a":82.5,"tol":0.005,"steps":["50,00 · 1,5 · 1,1 = 82,50 €"]},{"q":{"de":"Wie viel Prozent sind 36 € von 240 €?","vi":"Wie viel Prozent sind 36 € von 240 €?\n🇻🇳 36 € là bao nhiêu phần trăm của 240 €?"},"u":"%","a":15,"tol":0.01,"steps":["36 : 240 · 100 = 15 %"]}],"pts":5.5},{"id":"g4","no":"Aufgabe 5","title":{"de":"Freie Übung: Prozente im Prospekt","vi":"Freie Übung: Prozente im Prospekt · Bài tập tự do: phần trăm trong tờ quảng cáo"},"instr":{"de":"Berechne den neuen Preis mit dem Faktor. Hier rechnest du mit den Ersatzangeboten. Du kannst zusätzlich drei Angebote aus einem Prospekt rechnen und deiner Lehrkraft zeigen (3 Leistungspunkte).","vi":"Berechne den neuen Preis mit dem Faktor. Hier rechnest du mit den Ersatzangeboten. Du kannst zusätzlich drei Angebote aus einem Prospekt rechnen und deiner Lehrkraft zeigen (3 Leistungspunkte).\n🇻🇳 Tính giá mới bằng hệ số. Ở đây em tính lrabatt. Eine Kollegin kauft einen Artikel für 126,00 €. Wie viel Euro bezahlt sie?\n🇻🇳 Nhân viên được giảm 12,5 % (Personalrabatt). Một đồng nghiệp mua một món hàng giá 126,00 €. Cô ấy trả bao nhiêu euro?"},"u":"€","a":110.25,"tol":0.005,"steps":["126,00 · 0,875 = 110,25 €"],"work":true},{"q":{"de":"Ein Kunde kauft einen Fernseher für 789,00 € und leistet eine Anzahlung von 40 %. Berechnen Sie die Anzahlung in Euro!","vi":"Ein Kunde kauft einen Fernseher für 789,00 € und leistet eine Anzahlung von 40 %. Berechnen Sie die Anzahlung in Euro!\n🇻🇳 Một khách mua ti vi giá 789,00 € và đặt cọc (Anzahlung) 40 %. Hãy tính số tiền đặt cọc bằng euro!"},"u":"€","a":315.6,"tol":0.005,"steps":["789,00 · 0,4 = 315,60 €"],"work":true},{"q":{"de":"Eine Kundin hat einen Coupon über 15 % auf ihren Einkauf. Ihr Einkauf kostet 287,20 €. Wie viel Euro muss sie bezahlen?","vi":"Eine Kundin hat einen Coupon über 15 % auf ihren Einkauf. Ihr Einkauf kostet 287,20 €. Wie viel Euro muss sie bezahlen?\n🇻🇳 Một khách có phiếu giảm giá (Coupon) 15 % cho lần mua hàng. Hàng của cô ấy giá 287,20 €. Cô ấy phải trả bao nhiêu euro?"},"u":"€","a":244.12,"tol":0.005,"steps":["287,20 · 0,85 = 244,12 €"],"work":true}],"pts":3},{"id":"g6","no":"Aufgabe 7","title":{"de":"Für Profis","vi":"Für Profis · Dành cho người giỏi"},"instr":{"de":"Zum Weiterdenken – ganze Sätze, mit Begründung.","vi":"Zum Weiterdenken – ganze Sätze, mit Begründung.\n🇻🇳 Để suy nghĩ thêm – viết câu đầy đủ, có giải thích."},"tip":{"de":"Probiere es mit einem einfachen Zahlenbeispiel, z. B. mit 100 €. Schreibe jeden Rechenschritt auf und erkläre danach in einem Satz, was du siehst.","vi":"Hãy thử với một ví dụ số đơn giản, ví dụ 100 €. Viết từng bước tính, sau đó giải thích bằng một câu điều em thấy."},"type":"free","parts":[{"q":{"de":"Ein Preis wird erst um 10 % erhöht und danach um 10 % gesenkt. Begründen Sie mit einem Zahlenbeispiel, warum er danach nicht wieder so hoch ist wie vorher.","vi":"Ein Preis wird erst um 10 % erhöht und dan aschenrechner und rundet erst am Ende.","vi":"Jede Rundung verändert die Zahl ein wenig. Rechnet man mit gerundeten Zwischenergebnissen weiter, kann das Endergebnis abweichen. Deshalb tippt man alles in einer Kette in den Taschenrechner und rundet erst am Ende.\n🇻🇳 Mỗi lần làm tròn thay đổi con số một chút. Nếu tính tiếp với kết quả trung gian đã làm tròn thì kết quả cuối có thể lệch. Vì vậy ta bấm tất cả thành một chuỗi vào máy tính và chỉ làm tròn ở cuối."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Was würde passieren, wenn man aus 59,50 € brutto den Nettopreis mit „mal 0,81“ berechnet? Rechne und begründe.","vi":"Was würde passieren, wenn man aus 59,50 € brutto den Nettopreis mit „mal 0,81“ berechnet? Rechne und begründe.\n🇻🇳 Điều gì xảy ra nếu tính giá netto từ 59,50 € brutto bằng „nhân 0,81“? Hãy tính và giải thích."},"m":{"de":"59,50 · 0,81 = 48,20 € – das ist zu wenig. Richtig ist 59,50 : 1,19 = 50,00 €. Die 19 % beziehen sich auf den Nettopreis (100 %), nicht auf den Bruttopreis (119 %).","vi":"59,50 · 0,81 = 48,20 € – das ist zu wenig. Richtig ist 59,50 : 1,19 = 50,00 €. Die 19 % beziehen sich auf den Nettopreis (100 %), nicht auf den Bruttopreis (119 %).\n🇻🇳 59,50 · 0,81 = 48,20 € – như vậy là quá ít. Đúng là 59,50 : 1,19 = 50,00 €. 19 % tính trên giá netto (100 %), không phải trên giá brutto (119 %)."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":3}]};

function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9%€., ]/g,' ').replace(/\s+/g,' ').trim()}

 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='de'?'Bonus':u('bonusw')):fmt(it.pts)+' '+(S.lang==='de'?(it.pts===1?'Punkt':'Punkte'):u('pts'))}
function sum(it){return (it.sum&&it.sum[S.lang])||(S.lang==='vi'?it.vi:'')||''}
function autoDir(){if(!RTL[S.lang])return;$$('p,h1,h2,h3,h4,li,summary,label,.info,.vis,.qt,.st,.instr,.opt span,.chip,.fb,.model,.sub,.cnt').forEach(e=>e.setAttribute('dir','auto'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(sum(it)?`<div class="vis" lang="${S.lang}">${rich(sum(it))}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang;
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 autoDir();progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();

</script>
