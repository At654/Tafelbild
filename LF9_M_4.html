itte in Stichworten.\n🇻🇳 Đánh dấu năm bước bằng từ khóa."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Die IHK gibt dir nie ein Schema. Alles steht in einem Satz. Zuerst musst du den [[Bezugspreis finden]]. Dann musst du [[drei Prozentzahlen suchen]]: Handlungskosten, Gewinn, Umsatzsteuer – immer in dieser Reihenfolge. Danach musst du sie [[in Faktoren umwandeln]], zum Beispiel 50 % in 1,5. Dann musst du alles in einer Kette [[durchmultiplizieren]]. Am Ende musst du [[runden und prüfen]]. Du darfst nicht zwischendurch runden."],"vi":"IHK không bao giờ cho em một sơ đồ. Tất cả nằm trong một câu. Trước tiên em phải tìm Bezugspreis. Sau đó em phải tìm ba số phần trăm: Handlungskosten, Gewinn, Umsatzsteuer – luôn theo thứ tự này. Tiếp theo em đổi chúng thành hệ số, ví dụ 50 % thành 1,5. Rồi em nhân tất cả trong một chuỗi. Cuối cùng em làm tròn và kiểm tra. Em không được làm tròn giữa chừng.","quiz":{"q":{"de":"In welcher Reihenfolge stehen die drei Prozentzahlen?","vi":"In welcher Reihenfolge stehen die drei Prozentzahlen?\n🇻🇳 Ba số phần trăm đứng theo thứ tự nào?"},"o":["Gewinn – Handlungskosten – Umsatzsteuer","Handlungskosten – Gewinn – Umsatzsteuer","Umsatzsteuer – Gewinn – Handlungskosten"],"a":1,"why":{"de":"Richtig ist: Handlungskosten – Gewinn – Umsatzsteuer","vi":"Đáp án đúng: Handlungskosten – Gewinn – Umsatzsteuer"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"Nicht addieren!","vi":"Nicht addieren! · Không được cộng!"},"instr":{"de":"Markiere, worauf der Gewinn und worauf die Umsatzsteuer gerechnet werden.","vi":"Markiere, worauf der Gewinn und worauf die Umsatzsteuer gerechnet werden.\n🇻🇳 Đánh dấu Gewinn và Umsatzsteuer được tính trên cái gì."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Jeder Aufschlag rechnet auf das Ergebnis davor. Der Gewinn wird auf die [[Selbstkosten]] gerechnet. Die Umsatzsteuer wird auf den [[Nettoverkaufspreis]] gerechnet. Deshalb darfst du die Prozente nicht addieren: 50 + 7 + 19 = 76 % ist falsch. Mit Faktoren passiert das nicht. Für Lebensmittel, Bücher und Zeitschriften gilt [[7 % Umsatzsteuer]]. Dann rechnest du am Ende mal 1,07 statt mal 1,19."],"vi":"Mỗi khoản cộng thêm được tính trên kết quả trước đó. Gewinn được tính trên Selbstkosten. Umsatzsteuer được tính trên Nettoverkaufspreis. Vì vậy em không được cộng các phần trăm lại: 50 + 7 + 19 = 76 % là sai. Với hệ số thì không xảy ra lỗi đó. Với thực phẩm, sách và tạp chí thì áp dụng 7 % Umsatzsteuer. Khi đó cuối cùng em nhân 1,07 thay vì nhân 1,19.","quiz":{"q":{"de":"Welche Umsatzsteuer gilt für ein Buch?","vi":"Welche Umsatzsteuer gilt für ein Buch?\n🇻🇳 Thuế nào áp dụng cho một cuốn sách?"},"o":["19 %","7 %","0 %"],"a":1,"why":{"de":"Richtig ist: 7 %","vi":"Đáp án đúng: 7 %"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Der Satz-Übersetzer: So steht es in der Prüfung</h4><p>„Berechnen Sie den Bruttoverkaufspreis in Euro für ein Hemd, wenn Sie mit 50 % Handlungskostenzuschlag, 7 % Gewinn und 19 % Umsatzsteuer kalkulieren!“ → Bezugspreis · 1,5 · 1,07 · 1,19</p><p>1. Bezugspreis finden: Steht in der Aufgabe oder im Ergebnis der Aufgabe davor (Modul 2).</p><p>2. Drei Prozentzahlen suchen: Handlungskosten – Gewinn – Umsatzsteuer. Immer in dieser Reihenfolge.</p><p>3. In Faktoren umwandeln: 50 % → 1,5 · 7 % → 1,07 · 19 % → 1,19 (Werkzeugkarte Nr. 1)</p><p>4. Durchmultiplizieren: Alles in einer Kette in den Taschenrechner. Nicht zwischendurch runden.</p><p>5. Runden und prüfen: Auf 2 Stellen runden. Ist der Preis größer als der Bezugspreis? Etwa das 1,5- bis 2,5-Fache?</p><p><b>Merke:</b> Jeder Aufschlag rechnet auf das Ergebnis davor: Gewinn auf die Selbstkosten, Umsatzsteuer auf den Nettoverkaufspreis. Deshalb darfst du die Prozente nicht addieren (50 + 7 + 19 = 76 % ist falsch). Mit Faktoren passiert das nicht.</p>","vi":"Bộ dịch câu đề bài: trong kỳ thi viết như thế này\n„Hãy tính Bruttoverkaufspreis bằng euro cho một chiếc áo sơ mi khi tính giá với 50 % Handlungskostenzuschlag, 7 % Gewinn và 19 % Umsatzsteuer!“ → Bezugspreis · 1,5 · 1,07 · 1,19\n1. Tìm Bezugspreis: có trong đề bài hoặc trong kết quả của bài trước (mô-đun 2).\n2. Tìm ba số phần trăm: Handlungskosten – Gewinn – Umsatzsteuer. Luôn theo thứ tự này.\n3. Đổi thành hệ số: 50 % → 1,5 · 7 % → 1,07 · 19 % → 1,19 (thẻ công cụ số 1)\n4. Nhân liên tiếp: bấm tất cả thành một chuỗi vào máy tính. Không làm tròn giữa chừng.\n5. Làm tròn và kiểm tra: làm tròn đến 2 chữ số. Giá có lớn hơn Bezugspreis không? Khoảng gấp 1,5 đến 2,5 lần?\nGhi nhớ: Mỗi khoản cộng thêm được tính trên kết quả trước đó: Gewinn trên Selbstkosten, Umsatzsteuer trên Nettoverkaufspreis. Vì vậy em không được cộng các phần trăm lại (50 + 7 + 19 = 76 % là sai). Với hệ số thì không xảy ra lỗi đó."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: das Hemd aus Modul 2","vi":"Vorgemacht: das Hemd aus Modul 2 · Làm mẫu: chiếc áo sơ mi từ mô-đun 2"},"html":"<p><b>Aufgabe der IHK:</b> Der Bezugspreis für ein Hemd beträgt 14,50 €. Berechnen Sie den Bruttoverkaufspreis, wenn Sie mit 50 % Handlungskostenzuschlag, 7 % Gewinn und 19 % Umsatzsteuer kalkulieren!</p><p><b>+ 50 % Handlungskosten:</b> 14,50 · 1,5 = 21,75 € (Selbstkosten)</p><p><b>+ 7 % Gewinn:</b> 21,75 · 1,07 = 23,27 € (Nettoverkaufspreis)</p><p><b>+ 19 % Umsatzsteuer:</b> 23,2725 · 1,19 = 27,69 € (Bruttoverkaufspreis)</p><p><b>Taschenrechner:</b> 14,5 × 1,5 × 1,07 × 1,19 = → 27,694… → 27,69 €</p>","vi":"Đề của IHK: Bezugspreis của một chiếc áo sơ mi là 14,50 €. Hãy tính Bruttoverkaufspreis khi tính giá với 50 % Handlungskostenzuschlag, 7 % Gewinn và 19 % Umsatzsteuer!\n+ 50 % Handlungskosten: 14,50 · 1,5 = 21,75 € (Selbstkosten)\n+ 7 % Gewinn: 21,75 · 1,07 = 23,27 € (Nettoverkaufspreis)\n+ 19 % Umsatzsteuer: 23,2725 · 1,19 = 27,69 € (Bruttoverkaufspreis)\nMáy tính: 14,5 × 1,5 × 1,07 × 1,19 = → 27,694… → 27,69 €"},{"id":"g2","no":"Aufgabe 3","title":{"de":"Lückenschema: die Laptoptasche","vi":"Lückenschema: die Laptoptasche · Sơ đồ điền chỗ trống: túi đựng laptop"},"instr":{"de":"Bezugspreis einer Laptoptasche 30,00 €. Kalkuliert wird mit 50 % Handlungskosten, 8 % Gewinn und 19 % Umsatzsteuer. Die erste Stufe ist vorgemacht: 30,00 · 1,5 = 45,00 € (Selbstkosten). Ergänze den Rest.","vi":"Bezugspreis einer Laptoptasche 30,00 €. Kalkuliert wird mit 50 % Handlungskosten, 8 % Gewinn und 19 % Umsatzsteuer. Die erste Stufe ist vorgemacht: 30,00 · 1,5 = 45,00 € (Selbstkosten). Ergänze den Rest.\n🇻🇳 Bezugspreis của một túi đựng laptop là 30,00 €. Tính giá với 50 % Handlungskosten, 8 % Gewinn và 19 % Umsatzsteuer. Bậc đầu tiên đã làm mẫu: 30,00 · 1,5 = 45,00 € (Selbstkosten). Em điền phần còn lại."},"tip":{"de":"Jede Stufe rechnet mit dem Ergebnis der Stufe davor. Bezugspreis → Selbstkosten → Nettoverkaufspreis → Bruttoverkaufspreis.","vi":"Mỗi bậc tính tiếp từ kết quả của bậc trước. Bezugspreis → Selbstkosten → Nettoverkaufspreis → Bruttoverkaufspreis."},"type":"calc","parts":[{"q":"+ 8 % Gewinn: Nettoverkaufspreis?","u":"€","a":48.6,"tol":0.005,"steps":["45,00 · 1,08 = 48,60 €"]},{"q":"+ 19 % Umsatzsteuer: Bruttoverkaufspreis?","u":"€","a":57.83,"tol":0.005,"steps":[{"de":"48,60 · 1,19 = 57,83 € · in einer Kette: 30 × 1,5 × 1,08 × 1,19 = 57,834 → 57,83 €","vi":"48,60 · 1,19 = 57,83 € · trong một chuỗi: 30 × 1,5 × 1,08 × 1,19 = 57,834 → 57,83 €"}]}],"pts":1},{"id":"g3","no":"Aufgabe 4","title":{"de":"Geführte Übung: die Aktentasche","vi":"Geführte Übung: die Aktentasche · Bài tập có hướng dẫn: cặp tài liệu"},"instr":{"de":"Der Bezugspreis einer Aktentasche beträgt 24,00 €. Kalkuliert wird mit 40 % Handlungskosten, 6,25 % Gewinn und 19 % Umsatzsteuer. Fülle zuerst die Tr   if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
