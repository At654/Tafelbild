<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kassen-Quiz live – LF 3 Modul 1–2</title>
<style>
:root{--bg:#F6F3EE;--panel:#fff;--fg:#1F2324;--muted:#5D6466;--line:#D4CEC5;--navy:#13275a;--gold:#b8901c;--ok:#2C7A4B;--ok-soft:#DDEFE3;--bad:#B42318;--bad-soft:#F8E0DD;
 --c0:#c0392b;--c1:#2468b4;--c2:#b8860b;--c3:#2e7d4f;--t0:#1F5F66;--t1:#b5532f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141718;--panel:#1E2325;--fg:#ECEDEA;--muted:#A5ACAD;--line:#394244;--ok-soft:#1C3328;--bad-soft:#3A2220;--navy:#2a4a9a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--navy);color:#fff;padding:10px 18px}
.top h1{margin:0;font:700 22px Georgia,serif}
.top .sp{flex:1}
.top .st{font-size:14px;opacity:.9}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e55;margin-right:6px}.dot.up{background:#5d5}
.btn{border:2px solid var(--navy);background:var(--panel);color:var(--navy);padding:9px 16px;border-radius:8px;font-weight:700}
.btn.prim{background:var(--gold);border-color:var(--gold);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.top .btn{border-color:#fff;background:transparent;color:#fff;padding:6px 12px;font-size:15px}
.top .btn.prim{background:var(--gold);border-color:var(--gold)}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
.chip{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700;margin-right:6px}
.chip.pro{background:var(--gold)}
/* Tafel */
.lobby{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;align-items:start}
@media(max-width:800px){.lobby{grid-template-columns:1fr}}
.qrbox{background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line);text-align:center}
.qrbox canvas{width:100%;max-width:340px;height:auto}
.code{font:700 44px Georgia,serif;letter-spacing:.15em;text-align:center}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pn{background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:600}
.pn.t0{border-color:var(--t0)}.pn.t1{border-color:var(--t1)}
.frage{font:700 clamp(26px,3.6vw,44px)/1.15 Georgia,serif;margin:6px 0 16px;text-wrap:balance}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;border-radius:12px;padding:16px 18px 16px 62px;color:#fff;font-weight:600;font-size:clamp(18px,2.1vw,26px);line-height:1.25;min-height:84px;display:flex;align-items:center}
.tile .L{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:800}
.tile.c0{background:var(--c0)}.tile.c1{background:var(--c1)}.tile.c2{background:var(--c2)}.tile.c3{background:var(--c3)}
.tile.dim{opacity:.3}
.tile .n{position:absolute;right:14px;top:8px;font-size:26px;font-weight:800}
.tile.ok{outline:6px solid var(--ok);outline-offset:2px}
.timer{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:6px 0 14px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.timer i.low{background:var(--bad)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:18px;margin-top:4px}
.erkl{margin:16px 0;border-left:6px solid var(--ok);background:var(--ok-soft);padding:12px 16px;border-radius:0 8px 8px 0;font-size:20px}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h3{margin:0 0 8px;font:700 20px Georgia,serif}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:19px}
.row:last-child{border:0}
.row b{font-variant-numeric:tabular-nums}
.tm{display:flex;gap:12px;margin:10px 0}
.tm div{flex:1;border-radius:10px;padding:10px;text-align:center;color:#fff;font-weight:700}
.tm .a{background:var(--t0)}.tm .b{background:var(--t1)}
.tm span{display:block;font-size:30px}
.podium{display:flex;gap:14px;align-items:flex-end;justify-content:center;margin:20px 0;min-height:260px}
.pod{width:min(30%,220px);text-align:center;border-radius:10px 10px 0 0;color:#fff;padding:10px 6px;font-weight:700}
.pod.p1{background:var(--gold);height:230px}.pod.p2{background:#7b8a96;height:180px}.pod.p3{background:#a0643c;height:140px}
.pod span{display:block;font-size:34px}
.pod em{font-style:normal;font-size:24px;display:block}
/* Handy */
.ph{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.langs button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:99px;padding:4px 12px;font-size:14px}
.langs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.q{font:700 22px/1.25 Georgia,serif;margin:8px 0 4px}
.tl{display:block;color:#4b5a86;font-size:.9em;font-weight:400;margin-top:3px}
@media (prefers-color-scheme: dark){.tl{color:#9db1e6}}
.tl[dir=rtl]{text-align:right}
.ob{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:13px 14px;margin:9px 0;color:#fff;font-weight:600;font-size:17px;line-height:1.3}
.ob .tl{color:#fff;opacity:.92;font-weight:400}
.ob.c0{background:var(--c0)}.ob.c1{background:var(--c1)}.ob.c2{background:var(--c2)}.ob.c3{background:var(--c3)}
.ob:disabled{opacity:.45}.ob.mine{opacity:1;outline:4px solid var(--fg)}.ob.ok{outline:5px solid var(--ok);opacity:1}
.big{font:700 40px Georgia,serif;text-align:center;margin:14px 0}
.res{border-radius:12px;padding:14px;margin:10px 0}
.res.good{background:var(--ok-soft);border-left:6px solid var(--ok)}.res.bad{background:var(--bad-soft);border-left:6px solid var(--bad)}
input.nm{width:100%;font:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:8px;margin:8px 0 14px;background:var(--panel);color:var(--fg)}
.center{text-align:center}
.small{color:var(--muted);font-size:14px}
</style>
</head>

class Net{
  constructor(onMsg,onStatus){this.cid="c"+rnd(9);this.seen=new Map();this.onMsg=onMsg;
    const cb=()=>onStatus(this.count());
    this.links=BR==="bc"?[new BcLink(this.cid,(t,p)=>this.recv(t,p),cb)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p)=>this.recv(t,p),cb));}
  count(){return {up:this.links.filter(l=>l.up).length,all:this.links.length};}

const LANGS=[["de","Deutsch"],["tr","Türkçe"],["vi","Tiếng Việt"],["ar","العربية"]];

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let lang=(store("lf3q_lang")||"de");if(!LANGS.some(l=>l[0]===lang))lang="de";

/* =============================== TAFEL =============================== */
function tafelApp(){
  let T=store("lf3q_T");
  const fresh=()=>({code:codeGen(),ph:"lobby",qi:-1,t0:0,pl:{},cur:{},dist:null,seq:0});
  if(!T||!T.code||!T.pl)T=fresh();
  const save=()=>store("lf3q_T",T);
  let net=null,conn={up:0,all:0},timer=null,lastPub=0;
  const ids=()=>Object.keys(T.pl);
  const rankList=()=>ids().map(i=>({id:i,...T.pl[i]})).sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n));
  const teamScore=(t)=>{const m=ids().filter(i=>T.pl[i].t===t);return m.length?Math.round(m.reduce((a,i)=>a+T.pl[i].s,0)/m.length):0;};
  function pub(force){
    if(!net)return;T.seq++;
    const pl={};ids().forEach(i=>{const p=T.pl[i];pl[i]=[p.n,p.t,p.s,p.l||0];});
    const st={k:"st",ph:T.ph,qi:T.qi,dur:T.qi>=0&&T.qi<NQ?DUR(Q[T.qi]):0,seq:T.seq,ac:Object.keys(T.cur),pl,
      r:T.ph==="rev"?Q[T.qi].r:null,nq:NQ};
    net.pub(T.code+"/st",st,true);lastPub=Date.now();
  }
  function onMsg(t,p){
    if(!p||t!==T.code+"/in")return;
    if(p.k==="hi"){const id=clean(p.id,16),n=clean(p.n,14);if(!id||!n)return;
      if(T.pl[id]){T.pl[id].n=n;}else{const cnt0=ids().filter(i=>T.pl[i].t===0).length,cnt1=ids().length-cnt0;T.pl[id]={n,t:cnt0<=cnt1?0:1,s:0,l:0,c:0};}
      save();pub();draw();}
    else if(p.k==="a"){const id=clean(p.id,16);
      if(T.ph!=="q"||p.q!==T.qi||!T.pl[id]||T.cur[id])return;
      const v=Number.isInteger(p.v)?p.v:-1;if(v<0||v>3)return;
      const el=Date.now()-T.t0,d=DUR(Q[T.qi])*1000;if(el>d+2500)return;
      T.cur[id]={v,el:Math.min(Math.max(el,0),d)};save();pub();
      if(Object.keys(T.cur).length>=ids().length&&ids().length>0)setTimeout(()=>{if(T.ph==="q")reveal();},700);
      draw();}
  }
  function start(){T.pl&&ids().forEach(i=>{T.pl[i].s=0;T.pl[i].l=0;T.pl[i].c=0;});nextQ(0);}
  function nextQ(i){T.qi=i;T.ph="q";T.cur={};T.dist=null;T.t0=Date.now();save();pub();draw();tick();}
  function reveal(){
    if(T.ph!=="q")return;const q=Q[T.qi],d=DUR(q)*1000;
    const dist=[0,0,0,0];
    ids().forEach(i=>{const a=T.cur[i],p=T.pl[i];let pts=0;
      if(a){dist[a.v]++;if(a.v===q.r){pts=500+Math.round(500*(1-a.el/d));p.c=(p.c||0)+1;}}
      p.l=pts;p.s+=pts;});
    T.dist=dist;T.ph="rev";save();pub();draw();
  }
  function after(){ if(T.qi<NQ-1)nextQ(T.qi+1);else{T.ph="end";save();pub();draw();} }
  function reset(){if(!confirm("Neue Sitzung starten? Alle Spieler und Punkte werden gelöscht."))return;T=fresh();save();net.sub(T.code+"/in");pub();draw();}
  function tick(){clearInterval(timer);timer=setInterval(()=>{
    if(T.ph!=="q"){clearInterval(timer);return;}
    const d=DUR(Q[T.qi])*1000,el=Date.now()-T.t0,bar=document.querySelector(".timer i"),sec=document.getElementById("sec");
    if(bar){bar.style.width=Math.max(0,100-el/d*100)+"%";bar.classList.toggle("low",d-el<5000);}
    if(sec)sec.textContent=Math.max(0,Math.ceil((d-el)/1000))+" s";
    if(el>=d)reveal();
    if(Date.now()-lastPub>4500)pub();},200);}
  /* --- Zeichnen --- */
  function head(){
    const q=T.qi>=0&&T.qi<NQ;
    const btns=[];
    if(T.ph==="lobby")btns.push(h("button",{class:"btn prim",disabled:ids().length<1,onclick:start},"Spiel starten ("+ids().length+")"));
    if(T.ph==="q")btns.push(h("button",{class:"btn prim",onclick:reveal},"Jetzt auflösen"));
    if(T.ph==="rev")btns.push(h("button",{class:"btn prim",onclick:after},T.qi<NQ-1?"Nächste Frage":"Zur Siegerehrung"));
    btns.push(h("button",{class:"btn",onclick:reset},"Neue Sitzung"));
    return h("div",{class:"top"},h("h1",null,"Kassen-Quiz live"),h("span",{class:"st"},"LF 3 · Modul 1–2"),
      q?h("span",{class:"st"},"Frage "+(T.qi+1)+" / "+NQ):null,h("span",{class:"sp"}),
      h("span",{class:"st"},h("span",{class:"dot"+(conn.up?" up":"")}),conn.up?"verbunden":"keine Verbindung"),btns);
  }
  function lobby(){
    const c=h("canvas",{width:340,height:340});const url=joinUrl(T.code);
    setTimeout(()=>drawQR(c,url),0);
    const pl=h("div",{class:"plist"},ids().map(i=>h("button",{class:"pn t"+T.pl[i].t,title:"Antippen: Spieler entfernen",onclick:()=>{delete T.pl[i];save();pub();draw();}},T.pl[i].n)));
    return h("div",{class:"wrap"},h("div",{class:"lobby"},
      h("div",null,h("div",{class:"qrbox"},c),h("div",{class:"code"},T.code),h("p",{class:"small center"},url?"QR-Code mit dem Handy scannen oder Code eingeben":"Datei zuerst online stellen (GitHub Pages), dann erscheint der QR-Code.")),
      h("div",null,h("h2",{style:"font:700 30px Georgia,serif;margin:0 0 6px"},"Wer ist dabei?"),
        h("p",{class:"small"},"Jede Person spielt am eigenen Handy. Zwei Teams treten gegeneinander an (Wertung: Durchschnitt pro Person): Team „"+TEAMS[0]+"“ und Team „"+TEAMS[1]+"“. Name antippen entfernt eine Person."),
        pl,
        h("div",{class:"tm"},h("div",{class:"a"},"Team "+TEAMS[0],h("span",null,ids().filter(i=>T.pl[i].t===0).length)),h("div",{class:"b"},"Team "+TEAMS[1],h("span",null,ids().filter(i=>T.pl[i].t===1).length))),
        h("p",null,NQ+" Fragen aus Modul 1 (Kasse und Kassenbon) und Modul 2 (Kassieren). Je Frage 20 Sekunden, Profi-Fragen 30 Sekunden. Je schneller richtig, desto mehr Punkte (500 bis 1000)."))));
  }
  function question(){
    const q=Q[T.qi],ans=Object.keys(T.cur).length;
    const tiles=h("div",{class:"tiles"},q.o.map((o,i)=>h("div",{class:"tile c"+i},h("span",{class:"L"},"ABCD"[i]),o[0])));
    return h("div",{class:"wrap"},h("div",null,h("span",{class:"chip"},"Modul "+q.m),q.pro?h("span",{class:"chip pro"},"PROFI"):null),
      h("div",{class:"frage"},q.t[0]),h("div",{class:"timer"},h("i")),tiles,
      h("div",{class:"meta"},h("span",null,ans+" von "+ids().length+" haben geantwortet"),h("span",{id:"sec",class:"tabnum"},"")));
  }
  function board(limit){
    const r=rankList().slice(0,limit);
    return h("div",{class:"panel"},h("h3",null,"Rangliste"),r.map((p,i)=>h("div",{class:"row"},h("span",null,(i+1)+". "+p.n),h("span",null,(p.l?"+"+p.l+"  ":""),h("b",null,p.s)))));
  }
  function teams(){return h("div",{class:"tm"},h("div",{class:"a"},"Team "+TEAMS[0],h("span",{class:"tabnum"},teamScore(0)),h("small",null,"Ø pro Person")),h("div",{class:"b"},"Team "+TEAMS[1],h("span",{class:"tabnum"},teamScore(1)),h("small",null,"Ø pro Person")));}
  function reveal_view(){
    const q=Q[T.qi],tot=ids().length||1;
    const tiles=h("div",{class:"tiles"},q.o.map((o,i)=>h("div",{class:"tile c"+i+(i===q.r?" ok":" dim")},h("span",{class:"L"},"ABCD"[i]),o[0],h("span",{class:"n"},T.dist?T.dist[i]:0))));
    const right=T.dist?T.dist[q.r]:0;
    return h("div",{class:"wrap"},h("div",{class:"frage"},q.t[0]),tiles,
      h("div",{class:"erkl"},h("b",null,"Richtig: "+"ABCD"[q.r]+". "),q.x[0]),
      h("p",{class:"meta"},right+" von "+ids().length+" richtig ("+Math.round(right/tot*100)+" %)"),
      h("div",{class:"cols"},board(5),teams()));
  }
  function end(){
    const r=rankList();const pod=h("div",{class:"podium"});
    [1,0,2].forEach(k=>{const p=r[k];if(!p)return;pod.append(h("div",{class:"pod p"+(k+1)},h("span",null,["🥇","🥈","🥉"][k]),p.n,h("em",{class:"tabnum"},p.s+" Punkte")));});
    const a=teamScore(0),b=teamScore(1);
    return h("div",{class:"wrap"},h("h2",{style:"font:700 34px Georgia,serif;text-align:center;margin:0"},"Siegerehrung"),pod,
      h("p",{class:"center",style:"font-size:22px"},a===b?"Unentschieden zwischen den Teams!":"Team „"+TEAMS[a>b?0:1]+"“ gewinnt!"),teams(),
      h("div",{class:"cols"},h("div",null,board(30)),h("div",{class:"panel"},h("h3",null,"Zum Merken"),h("p",null,"Scanner liest die GTIN. Die TSE schützt vor Manipulation. Jeder Kunde bekommt einen Beleg. Kassieren: Schein sichtbar halten, Rückgeld vorzählen, dann erst Schein in die Kasse."))));
  }
  function draw(){
    const body=T.ph==="lobby"?lobby():T.ph==="q"?question():T.ph==="rev"?reveal_view():end();
    mount(head(),body);
    if(T.ph==="q")tick();
  }
  net=new Net(onMsg,(c)=>{if(c&&typeof c==="object"){conn=c;}draw();});
  net.sub(T.code+"/in");
  const boot=setInterval(()=>{if(conn.up){pub();clearInterval(boot);}},500);
  setInterval(()=>{if(T.ph!=="q"&&Date.now()-lastPub>5000)pub();},1000);
  draw();
  window.__T=()=>T;
}

/* =============================== HANDY =============================== */
function phoneApp(){
  const code=(params.get("s")||"").toUpperCase().slice(0,8);
  const tag=params.get("t")||"";
  let id=store("lf3q_id"+code+tag);if(!id){id="p"+rnd(8);store("lf3q_id"+code+tag,id);}
  let name=store("lf3q_n"+code+tag)||"";
  let ST=null,conn={up:0,all:0},mine={},lastQ=-9,qStart=0,sig="";
  const net=new Net((t,p)=>{if(t===code+"/st"&&p&&p.k==="st"&&(!ST||p.seq>=ST.seq||p.seq<ST.seq-50)){ST=p;frame();}},(c)=>{if(c&&typeof c==="object")conn=c;frame();});
  net.sub(code+"/st");
  const hi=()=>{if(name)net.pub(code+"/in",{k:"hi",id,n:name});};
  setInterval(()=>{if(name&&(!ST||!ST.pl[id]))hi();},2500);
  setInterval(()=>{if(ST&&ST.ph==="q"&&mine[ST.qi]!=null&&!ST.ac.includes(id))net.pub(code+"/in",{k:"a",id,q:ST.qi,v:mine[ST.qi]});},2000);
  function langBar(){return h("div",{class:"langs"},LANGS.map(([c,n])=>h("button",{class:c===lang?"on":"",onclick:()=>{lang=c;store("lf3q_lang",c);sig="";frame();}},n)));}
  function rankOf(){const r=Object.entries(ST.pl).sort((a,b)=>b[1][2]-a[1][2]);const i=r.findIndex(x=>x[0]===id);return {i:i+1,n:r.length};}
  function frame(){
    const key=[name,!!ST,ST&&ST.ph,ST&&ST.qi,ST&&ST.pl[id]?1:0,lang,name?conn.up:0,mine[ST?ST.qi:-1],ST&&ST.ph==="rev"?1:0,ST&&ST.ph==="end"?ST.pl[id]&&ST.pl[id][2]:0].join("|");
    if(key===sig)return;sig=key;
    const dirAr=lang==="ar";
    if(!name){mount(h("div",{class:"ph"},langBar(),h("h2",{style:"font:700 26px Georgia,serif"},"Kassen-Quiz"),h("p",{class:"small"},"Code: "+code),
      h("label",null,...L(UI.name)),h("input",{class:"nm",id:"nm",maxlength:14,autocomplete:"off"}),
      h("button",{class:"btn prim",style:"width:100%",onclick:()=>{const v=clean($("nm").value,14);if(!v)return;name=v;store("lf3q_n"+code+tag,v);sig="";hi();frame();}},...L(UI.go))));return;}
    if(!ST||!ST.pl[id]){mount(h("div",{class:"ph center"},langBar(),h("div",{class:"big"},"…"),h("p",null,...L(UI.conn)),h("p",{class:"small"},conn.up?"":"keine Verbindung")));return;}
    const me=ST.pl[id],team=TEAMS[me[1]];
    if(ST.ph==="lobby"){mount(h("div",{class:"ph center"},langBar(),h("div",{class:"big"},"👋 "+name),h("p",null,...L(UI.team),": ",h("b",null,team)),h("p",null,...L(UI.wait))));return;}
    if(ST.ph==="end"){const r=rankOf();mount(h("div",{class:"ph center"},langBar(),h("h2",{style:"font:700 30px Georgia,serif"},...L(UI.done)),h("div",{class:"big"},"🏆 "+me[2]),h("p",null,...L(UI.pts)),
      h("p",{style:"font-size:24px"},...L(UI.rank),": ",h("b",null,r.i+" / "+r.n)),h("p",null,...L(UI.team),": ",h("b",null,team))));return;}
    const q=Q[ST.qi];if(!q)return;
    if(ST.qi!==lastQ){lastQ=ST.qi;qStart=Date.now();}
    const opts=(rev)=>q.o.map((o,i)=>{let c="ob c"+i;if(mine[ST.qi]===i)c+=" mine";if(rev&&i===ST.r)c+=" ok";
      return h("button",{class:c,disabled:rev||mine[ST.qi]!=null,onclick:()=>{if(mine[ST.qi]!=null||ST.ph!=="q")return;mine[ST.qi]=i;net.pub(code+"/in",{k:"a",id,q:ST.qi,v:i});sig="";frame();}},
        h("b",null,"ABCD"[i]+"  "),o[0],tl(o));});
    const qhead=h("div",null,h("span",{class:"chip"},ST.qi+1+" / "+ST.nq),q.pro?h("span",{class:"chip pro"},UI.pro[LI[lang]]):null,h("div",{class:"q"},q.t[0]),tl(q.t));
    if(ST.ph==="q"){
      const bar=h("i"),d=ST.dur;const left=Math.max(0,d-(Date.now()-qStart)/1000);
      const tm=h("div",{class:"timer"},bar);bar.style.width=(left/d*100)+"%";
      requestAnimationFrame(()=>{bar.style.transition="width "+left+"s linear";bar.style.width="0%";});
      const wait=mine[ST.qi]!=null?h("div",{class:"res good"},...L(UI.sent)):null;
      mount(h("div",{class:"ph"},langBar(),tm,qhead,opts(false),wait));return;
    }
    /* Auflösung */
    const a=mine[ST.qi],ok=a===ST.r;
    const res=a==null?h("div",{class:"res bad"},h("b",null,...L(UI.noans))):ok?h("div",{class:"res good"},h("b",null,"✔ "),...L(UI.right)):h("div",{class:"res bad"},h("b",null,"✘ "),...L(UI.wrong));
    const r=rankOf();
    mount(h("div",{class:"ph"},langBar(),qhead,opts(true),res,h("div",{class:"res good"},h("b",null,"+"+me[3]+" "),...L(UI.pts),h("br"),h("span",null,UI.rank[0]+" "+r.i+" / "+r.n+" · "+team)),
      h("div",{class:"erkl",style:"font-size:16px"},q.x[0],tl(q.x)),h("p",{class:"small center"},...L(UI.next))));
  }
  frame();
  setInterval(()=>{if(ST&&ST.ph==="q"&&Date.now()-qStart<500)return;},1000);
}
if(params.get("s"))phoneApp();else tafelApp();
</script>
