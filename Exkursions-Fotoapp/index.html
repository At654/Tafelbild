<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exkursions-Fotos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111}
header{background:#1d4ed8;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}header button{background:#fff3;color:#fff;border:0;border-radius:8px;padding:6px 10px;margin-left:6px}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px #0002}
.card img.foto{width:100%;display:block}
.pad{padding:10px 12px}.meta{font-size:13px;color:#555}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin:4px 0}
button.b{background:#1d4ed8;color:#fff;border:0;border-radius:10px;padding:12px 14px;font-size:16px;width:100%;margin:4px 0}
button.s{background:#e5e7eb;color:#111}
.row{display:flex;gap:8px}.row>*{flex:1}
.c{font-size:14px;margin:4px 0}.c b{margin-right:4px}
.tr{border:0;background:none;font-size:13px;padding:0 4px;cursor:pointer}
.tlt{display:block;color:#1d4ed8;font-style:italic;font-size:13px;margin-left:2px}
.ptr{display:block;color:#1d4ed8;font-style:italic;font-size:13px;margin-top:2px}
.x{color:#b91c1c;border:0;background:none;font-size:13px}
.like{border:0;background:none;font-size:18px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;display:none}
@media print{header,.new,.cf,.like,.x,.tr{display:none}.card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}}
</style></head><body>
<script>
// ===== EINSTELLUNGEN (aus Supabase: Project Settings > API) =====
const SUPABASE_URL = "https://bsuxhdricotkdizfojcq.supabase.co";
const SUPABASE_KEY = "sb_publishable_VOvpZRHZOXR_b7Wk-3nLnw_rB1Ua4al";
const LEHRER_PIN   = "0211";   // bitte ändern
// ================================================================
const SPRACHEN = [["","keine Übersetzung"],["vi","Vietnamesisch"],["pt","Portugiesisch"],["ar","Arabisch"],["ti","Tigrinya"],["es","Spanisch"],["uk","Ukrainisch"],["en","Englisch"],["de","Deutsch"]];
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null;
try { me = JSON.parse(localStorage.getItem("fotoapp_me") || "null"); } catch(e) { me = null; }
let teacher = false, timer = null;

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}

function start(){
  document.body.innerHTML = `<header><h1>📸 Exkursions-Fotos</h1></header>
  <main><div class="card pad"><p>Klassencode und dein Name:</p>
  <input id="code" placeholder="Klassencode (z. B. VK25a)" value="${esc(me?.code||"")}">
  <input id="name" placeholder="Dein Vorname" value="${esc(me?.name||"")}">
  <p>Kommentare übersetzen in (optional, nur auf deinem Gerät):</p>
  <select id="lang">${SPRACHEN.map(([v,n])=>`<option value="${v}" ${(me?.lang||"")===v?"selected":""}>${n}</option>`).join("")}</select>
  <button class="b" onclick="login()">Los geht's</button></div></main><div id="toast"></div>`;
}
function login(){
  const code=$("#code").value.trim().toLowerCase(), name=$("#name").value.trim(), lang=$("#lang").value;
  if(!code||!name) return toast("Bitte beides ausfüllen");
  me={code,name,lang}; localStorage.setItem("fotoapp_me",JSON.stringify(me)); feed();
}
function feed(){
  document.body.innerHTML = `<header><h1>📸 ${esc(me.code.toUpperCase())}</h1><div>
    <button onclick="window.print()">PDF</button><button onclick="lehrer()">🔑</button><button onclick="start()">👤</button></div></header>
  <main><div class="card pad new"><div class="row">
    <button class="b" onclick="$('#cam').click()">📷 Foto</button>
    <button class="b s" onclick="$('#gal').click()">🖼️ Galerie</button></div>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden onchange="pick(this)">
    <input type="file" id="gal" accept="image/*" hidden onchange="pick(this)">
    <div id="prev"></div></div>
  <div id="list">Lädt…</div></main><div id="toast"></div>`;
  load(); clearInterval(timer); timer=setInterval(load,15000);
}
let pending=null;
function pick(inp){
  const f=inp.files[0]; if(!f) return;
  const img=new Image(); img.onload=()=>{
    const m=1280, r=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=img.width*r; c.height=img.height*r;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{pending=b;
      $("#prev").innerHTML=`<img src="${URL.createObjectURL(b)}" style="width:100%;border-radius:8px;margin-top:8px">
      <textarea id="cap" rows="2" placeholder="Was zeigt das Foto? (z. B. Schaufenster, Preisschild …)"></textarea>
      <button class="b" onclick="send()">Hochladen</button>`;
    },"image/jpeg",0.8);
  }; img.src=URL.createObjectURL(f); inp.value="";
}
async function send(){
  if(!pending) return;
  const pfad=`${me.code}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  toast("Lädt hoch…");
  const up=await sb.storage.from("fotos").upload(pfad,pending,{contentType:"image/jpeg"});
  if(up.error) return toast("Fehler: "+up.error.message);
  const bild=sb.storage.from("fotos").getPublicUrl(pfad).data.publicUrl;
  const r=await sb.from("posts").insert({klasse:me.code,autor:me.name,text:$("#cap").value,bild,pfad});
  if(r.error) return toast("Fehler: "+r.error.message);
  pending=null; $("#prev").innerHTML=""; toast("Hochgeladen ✔"); load();
}
async function load(){
  const p=await sb.from("posts").select("*").eq("klasse",me.code).order("created_at",{ascending:false});
  if(p.error) return $("#list").textContent="Fehler: "+p.error.message;
  const ids=p.data.map(x=>x.id);
  const [cm,lk]=ids.length?await Promise.all([
    sb.from("comments").select("*").in("post_id",ids).order("created_at"),
    sb.from("likes").select("*").in("post_id",ids)]):[{data:[]},{data:[]}];
  const open=document.activeElement?.id, val=document.activeElement?.value;
  const tb = t => me.lang ? `<button class="tr" data-t="${esc(t)}" onclick="tr(this)" title="übersetzen">🌐</button>` : "";
  $("#list").innerHTML = p.data.length ? p.data.map(x=>{
    const cs=cm.data.filter(c=>c.post_id==x.id), ls=lk.data.filter(l=>l.post_id==x.id);
    const mine=ls.some(l=>l.autor==me.name);
    return `<div class="card"><img class="foto" src="${esc(x.bild)}" loading="lazy">
    <div class="pad"><div class="meta"><b>${esc(x.autor)}</b> · ${new Date(x.created_at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
    ${teacher?`<button class="x" onclick="delPost('${x.id}','${esc(x.pfad)}')">löschen</button>`:""}</div>
    ${x.text?`<p>${esc(x.text)} ${tb(x.text)}</p>`:""}
    <button class="like" onclick="like('${x.id}',${mine})">${mine?"❤️":"🤍"}</button> ${ls.length}
    ${cs.map(c=>`<div class="c"><b>${esc(c.autor)}</b>${esc(c.text)} ${tb(c.text)}${teacher?` <button class="x" onclick="delC('${c.id}')">✕</button>`:""}<span class="tlt"></span></div>`).join("")}
    <div class="row cf"><input id="k${x.id}" placeholder="Kommentar…" onkeydown="if(event.key=='Enter')com('${x.id}')">
    <button class="b" style="flex:0 0 60px" onclick="com('${x.id}')">➤</button></div></div></div>`}).join("")
    : `<p style="text-align:center;color:#666">Noch keine Fotos. Mach das erste! 📷</p>`;
  if(open&&$("#"+open)){$("#"+open).value=val;$("#"+open).focus()}
}
// Übersetzung nur auf Wunsch (🌐), läuft über den kostenlosen Dienst MyMemory; Text wird dabei an diesen Dienst gesendet.
async function tr(btn){
  const out = btn.parentElement.querySelector(".tlt") || btn.parentElement.querySelector(".ptr") || (()=>{const s=document.createElement("span");s.className="ptr";btn.parentElement.appendChild(s);return s})();
  if(out.dataset.open){ out.textContent=""; delete out.dataset.open; return; }
  out.textContent="übersetze…"; out.dataset.open="1";
  try{
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(btn.dataset.t)}&langpair=${encodeURIComponent("Autodetect|"+me.lang)}`);
    const j = await r.json();
    out.textContent = "→ " + (j.responseData?.translatedText || "Übersetzung nicht möglich");
  }catch(e){ out.textContent="Übersetzung nicht möglich (keine Verbindung)"; }
}
async function com(id){const i=$("#k"+id),t=i.value.trim();if(!t)return;
  const r=await sb.from("comments").insert({post_id:id,autor:me.name,text:t});
  if(r.error)return toast(r.error.message);load()}
async function like(id,mine){
  if(mine) await sb.from("likes").delete().eq("post_id",id).eq("autor",me.name);
  else await sb.from("likes").insert({post_id:id,autor:me.name}); load()}
function lehrer(){if(teacher){teacher=false;toast("Lehrermodus aus");return load()}
  if(prompt("PIN")===LEHRER_PIN){teacher=true;toast("Lehrermodus an");load()}else toast("Falsche PIN")}
async function delPost(id,pfad){if(!confirm("Foto löschen?"))return;
  await sb.storage.from("fotos").remove([pfad]);await sb.from("posts").delete().eq("id",id);load()}
async function delC(id){await sb.from("comments").delete().eq("id",id);load()}
me ? feed() : start();
</script></body></html>
