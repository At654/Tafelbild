<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weihnachten – Wörter zum Klicken</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: "Calibri", "Segoe UI", Arial, sans-serif;
    background: #0f1b33;
    color: #1a1a1a;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    color: #fdf0c8;
    font-size: 26px;
    margin: 0 0 24px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.15s ease, border-color 0.15s ease;
    user-select: none;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #f4c04a;
  }
  .card.open {
    border-color: #2e7d4f;
  }
  .card svg {
    width: 100%;
    height: 120px;
  }
  .answer {
    margin-top: 10px;
    min-height: 54px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .answer .de {
    font-size: 20px;
    font-weight: bold;
    color: #1a1a1a;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .answer .vi {
    font-size: 16px;
    font-style: italic;
    color: #777777;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.2s ease 0.05s, transform 0.2s ease 0.05s;
  }
  .card.open .answer .de,
  .card.open .answer .vi {
    opacity: 1;
    transform: translateY(0);
  }
  .hint {
    font-size: 13px;
    color: #999;
  }
  .reset {
    display: block;
    margin: 28px auto 0 auto;
    padding: 10px 22px;
    font-size: 15px;
    background: #2e7d4f;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .reset:hover { background: #256640; }
</style>
</head>
<body>

<h1>Weihnachten in Deutschland – klick auf das Bild</h1>

<div class="grid" id="grid">

  <div class="card" data-de="der Weihnachtsmarkt" data-vi="chợ Giáng sinh">
    <svg viewBox="0 0 160 140"><rect x="20" y="70" width="120" height="55" fill="#8a5a33"/><polygon points="10,70 150,70 130,45 30,45" fill="#6b3f22"/><rect x="35" y="80" width="90" height="35" fill="#3a2414"/><rect x="42" y="86" width="76" height="8" fill="#e8d9b0"/><rect x="42" y="98" width="76" height="8" fill="#e8d9b0"/><rect x="18" y="38" width="124" height="7" fill="#c23b3b"/><circle cx="30" cy="72" r="3" fill="#f4c04a"/><circle cx="60" cy="72" r="3" fill="#f4c04a"/><circle cx="100" cy="72" r="3" fill="#f4c04a"/><circle cx="130" cy="72" r="3" fill="#f4c04a"/></svg>
    <div class="answer"><div class="de"></div><div class="vi"></div></div>
  </div>

  <div class="card" data-de="der Weihnachtsbaum" data-vi="cây thông Noel">
    <svg viewBox="0 0 160 140"><polygon points="80,10 40,70 120,70" fill="#2e6b45"/><polygon points="80,38 32,88 128,88" fill="#2e6b45"/><polygon points="80,64 24,112 136,112" fill="#2e6b45"/><rect x="72" y="112" width="16" height="18" fill="#6b4226"/><circle cx="80" cy="26" r="4" fill="#f4c04a"/><circle cx="58" cy="54" r="4" fill="#d84f4f"/><circle cx="100" cy="58" r="4" fill="#f4c04a"/><circle cx="46" cy="90" r="4" fill="#4f7fd8"/><circle cx="110" cy="96" r="4" fill="#d84f4f"/><circle cx="80" cy="102" r="4" fill="#f4c04a"/></svg>
    <div class="answer"><div class="de"></div><div class="vi"></div></div>
  </div>

  <div class="card" data-de="der Adventskranz" data-vi="vòng hoa mùa Vọng">
    <svg viewBox="0 0 160 140"><ellipse cx="80" cy="80" rx="55" ry="22" fill="none" stroke="#2e6b45" stroke-width="18"/><rect x="34" y="40" width="10" height="26" fill="#d84f4f"/><ellipse cx="39" cy="40" rx="6" ry="3" fill="#f4c04a"/><rect x="70" y="30" width="10" height="26" fill="#d84f4f"/><ellipse cx="75" cy="30" rx="6" ry="3" fill="#f4c04a"/><rect x="106" y="30" width="10" height="26" fill="#d84f4f"/><ellipse cx="111" cy="30" rx="6" ry="3" fill="#f4c04a"/><rect x="138" y="40" width="10" height="26" fill="#d84f4f"/><ellipse cx="143" cy="40" rx="6" ry="3" fill="#f4c04a"/></svg>
    <div class="answer"><div class="de"></div><div class="vi"></div></div>
  </div>

  <div class="card" data-de="die Plätzchen" data-vi="bánh quy Giáng sinh">
    <svg viewBox="0 0 160 140"><g transform="translate(45,45)"><polygon points="20,0 26,14 41,14 29,23 34,38 20,29 6,38 11,23 -1,14 14,14" fill="#c7813f"/></g><circle cx="110" cy="65" r="22" fill="#e3b26a"/><circle cx="104" cy="58" r="3" fill="#8a5a33"/><circle cx="118" cy="60" r="3" fill="#8a5a33"/><circle cx="112" cy="72" r="3" fill="#8a5a33"/><g transform="translate(45,85)"><rect x="0" y="0" width="34" height="12" rx="4" fill="#d84f4f"/><rect x="0" y="0" width="34" height="5" rx="2" fill="#f6e6d0"/></g></svg>
    <div class="answer"><div class="de"></div><div class="vi"></div></div>
  </div>

  <div class="card" data-de="die Geschenke" data-vi="quà tặng">
    <svg viewBox="0 0 160 140"><rect x="25" y="60" width="55" height="45" fill="#4f7fd8"/><rect x="25" y="60" width="55" height="10" fill="#f4c04a"/><rect x="48" y="60" width="9" height="45" fill="#f4c04a"/><rect x="90" y="45" width="45" height="60" fill="#d84f4f"/><rect x="90" y="45" width="45" height="9" fill="#2e6b45"/><rect x="108" y="45" width="9" height="60" fill="#2e6b45"/><ellipse cx="112" cy="40" rx="10" ry="6" fill="#2e6b45"/><ellipse cx="102" cy="40" rx="10" ry="6" fill="#2e6b45"/></svg>
    <div class="answer"><div class="de"></div><div class="vi"></div></div>
  </div>

  <div class="card" data-de="die Lichter / Kerzen" data-vi="đèn / nến">
    <svg viewBox="0 0 160 140"><path d="M20 40 Q 60 15 80 40 Q 100 65 140 40" fill="none" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="20" cy="40" r="5" fill="#f4c04a"/><circle cx="50" cy="20" r="5" fill="#d84f4f"/><circle cx="80" cy="40" r="5" fill="#f4c04a"/><circle cx="110" cy="20" r="5" fill="#4f7fd8"/><circle cx="140" cy="40" r="5" fill="#d84f4f"/><rect x="70" y="80" width="12" height="40" fill="#f6e6d0"/><ellipse cx="76" cy="78" rx="5" ry="8" fill="#f4931e"/></svg>
    <div class="answer"><div class="de"></div><div class="vi"></div></div>
  </div>

</div>

<button class="reset" id="resetBtn">Alle wieder verstecken</button>

<script>
  var cards = document.querySelectorAll('.card');
  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      var opening = !card.classList.contains('open');
      card.classList.toggle('open');
      if (opening) {
        card.querySelector('.de').textContent = card.getAttribute('data-de');
        card.querySelector('.vi').textContent = card.getAttribute('data-vi');
      }
    });
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    cards.forEach(function (card) { card.classList.remove('open'); });
  });
</script>

</body>
</html>
