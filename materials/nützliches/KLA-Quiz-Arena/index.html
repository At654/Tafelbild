<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KLA Quiz-Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef3f9;--surface:#fff;--surface2:#e6edf6;--ink:#14202e;--muted:#566578;--line:#cbd6e3;
  --brand:#1f5fa8;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;--gold:#e0a300;
  --c0:#c9263d;--c1:#1f66c9;--c2:#e8a900;--c3:#1f8a4c;--c4:#7a3fc4;--c5:#0b8d99;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Noto Sans Ethiopic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1722;--surface:#18222f;--surface2:#142030;--ink:#eaf0f7;--muted:#a3b2c4;--line:#2c3a4c;
  --brand:#6fb0ff;--brand-ink:#08111d;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;--gold:#ffd04a;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1722;--surface:#18222f;--surface2:#142030;--ink:#eaf0f7;--muted:#a3b2c4;--line:#2c3a4c;
  --brand:#6fb0ff;--brand-ink:#08111d;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;--gold:#ffd04a;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em;touch-action:manipulation}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:4em}
label{display:block;font-weight:700;margin:10px 0 4px}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.hide{display:none!important}
svg text{font-family:var(--body)}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header .logo{height:44px;width:auto;display:block}
#tafel header h1{font-size:1.3rem;margin:0}
#tafel header .sp{flex:1}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:56px;height:56px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:18px 22px 40px;max-width:1500px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:16px}
.code{font-family:var(--display);font-size:3.2rem;font-weight:800;letter-spacing:.12em}
.lobbyp{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;animation:pop .35s}
.pchip svg{width:38px;height:38px;border-radius:50%}
.pchip.t0{border-color:var(--c0)}.pchip.t1{border-color:var(--c1)}.pchip.t2{border-color:var(--c2)}.pchip.t3{border-color:var(--c3)}.pchip.t4{border-color:var(--c4)}.pchip.t5{border-color:var(--c5)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.settings .box{padding:10px 12px}
.settings label{margin:0 0 4px;font-size:.9rem}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:.35em .7em;font-size:.95rem}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
/* Fragen auf der Tafel */
.qwrap{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 140px)}
.qtop{display:flex;align-items:center;gap:14px}
.qtype{font-family:var(--display);font-weight:800;background:var(--surface);border:2px solid var(--brand);border-radius:999px;padding:.2em .9em;font-size:1rem}
.x2{background:var(--gold);color:#1a1200;border-radius:8px;padding:.1em .6em;font-family:var(--display);font-weight:800}
.qtext{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(1.6rem,3.4vw,3rem);text-align:center;background:var(--surface);border-radius:18px;padding:18px 24px;border:1px solid var(--line)}
.qmid{display:flex;align-items:center;justify-content:center;gap:24px;flex:1}
.qmid img{max-height:44vh;max-width:56vw;border-radius:14px;object-fit:contain;background:#fff}
.imgcr{font-size:.72rem;color:var(--muted);text-align:right}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.1em;text-align:center;border-radius:50%;background:var(--surface);border:6px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center;line-height:1;padding:.1em}
.timer.low{border-color:var(--bad);color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.cnt{font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border-radius:16px;padding:16px 18px;color:#fff;font-size:clamp(1.1rem,2vw,1.7rem);font-weight:700;position:relative;display:flex;align-items:center;gap:14px;min-height:76px}
.opt svg.sh{width:34px;height:34px;flex:none;fill:currentColor}
.opt .n{margin-left:auto;font-family:var(--display);font-size:1.8rem;font-weight:800}
.opt.dim{opacity:.28}
.opt.good{outline:6px solid var(--ok);outline-offset:3px}
.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2);color:#1a1200}.o3{background:var(--c3)}.o4{background:var(--c4)}.o5{background:var(--c5)}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:200px;margin:6px 0}
.bars div{flex:1;max-width:160px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;border-radius:10px 10px 0 0;min-height:4px;transition:height .5s}
.bars b{font-family:var(--display);font-size:1.5rem}
.expl{background:var(--surface);border-left:8px solid var(--brand);border-radius:12px;padding:12px 16px;font-size:1.2rem}
.board{list-style:none;padding:0;margin:0;max-width:900px;margin-inline:auto}
.board li{display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:14px;background:var(--surface);margin-bottom:8px;font-size:1.5rem;border:1px solid var(--line);transition:transform .6s}
.board li .rk{font-family:var(--display);font-weight:800;width:1.6em;color:var(--muted)}
.board li svg{width:48px;height:48px;border-radius:50%;flex:none}
.board li .nm{flex:1;font-weight:700}
.board li .pt{font-family:var(--display);font-weight:800}
.board li .gain{font-size:1rem;color:var(--ok);font-weight:700;min-width:4em;text-align:right}
.board li .fire{color:var(--warn);font-size:1rem}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:20px;min-height:340px}
.podium .pl{min-width:210px;text-align:center}
.podium .pl svg{width:90px;height:90px;border-radius:50%;border:4px solid var(--surface)}
.podium .pl .bl{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;padding:12px 6px;font-family:var(--display);font-weight:800;margin-top:6px;animation:rise 1s both}
.podium .pl.p1 .bl{background:var(--gold);color:#1a1200;height:230px}
.podium .pl.p2 .bl{height:170px}.podium .pl.p3 .bl{height:120px}
.podium .pl .bl big{display:block;font-size:3rem}
@keyframes rise{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.cloud{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:center;padding:16px;background:var(--surface);border-radius:16px;min-height:280px;border:1px solid var(--line)}
.cloud span{font-family:var(--display);font-weight:800;line-height:1.1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cards div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.15rem;cursor:pointer}
.cards div.fav{outline:4px solid var(--gold);font-size:1.6rem;grid-column:span 2}
.tteams{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tteam{border-radius:12px;padding:8px 16px;color:#fff;font-weight:800;font-family:var(--display);font-size:1.2rem}
table.rep{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden}
table.rep th,table.rep td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}
table.rep th{background:var(--surface2);font-size:.85rem}
table.rep td.l,table.rep th.l{text-align:left}
td.g{background:color-mix(in srgb,var(--ok) 25%,var(--surface))}
td.f{background:color-mix(in srgb,var(--bad) 22%,var(--surface))}
.paused{position:fixed;inset:0;background:rgba(10,20,35,.82);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:4rem;font-weight:800;z-index:40;pointer-events:none}
.paused button{pointer-events:auto;font-size:1.4rem;margin-top:14px}
#tafel header{position:relative;z-index:50}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:12px}
.libgrid .box h3{margin-bottom:2px}
/* Editor */
.ed{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.ed .ql{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.ed .ql button{text-align:left;padding:.5em .7em;font-size:.95rem}
.ed .ql button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ed .opt-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.ed .opt-row input[type=checkbox]{width:26px;height:26px;flex:none}
.ed .opt-row input[type=text]{flex:1}
.ed img.th{max-width:220px;max-height:140px;border-radius:10px;display:block;margin:6px 0}
.cand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.cand img{width:100%;height:110px;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent}
.cand img:hover{border-color:var(--brand)}
.pinimg{position:relative;display:inline-block;cursor:crosshair;width:min(100%,720px)}
.pinimg img{width:100%;height:auto;display:block;border-radius:10px}
.pinimg i{position:absolute;border:4px solid var(--ok);border-radius:50%;transform:translate(-50%,-50%);background:rgba(31,122,63,.25);pointer-events:none}
@media (max-width:900px){.join,.opts,.ed{grid-template-columns:1fr}.qmid img{max-width:100%}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:12px 14px 40px;min-height:100vh}
#phone[dir=rtl]{text-align:right}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:.95rem}
.ptop .me{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.ptop .me svg{width:34px;height:34px;border-radius:50%;flex:none}
.ptop .me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop .pts{font-family:var(--display);font-weight:800;font-size:1.1rem}
.lang{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lang button{padding:.4em .8em;font-size:1rem}
.lang button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}
.avg button{padding:2px;border-radius:50%;border:3px solid transparent;background:none;aspect-ratio:1}
.avg button svg{width:100%;height:100%;border-radius:50%;display:block}
.avg button.on{border-color:var(--ink)}
.colg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.colg button{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid transparent}
.colg button.on{border-color:var(--ink)}
.pq{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:6px 0 10px;line-height:1.2}
.pq2{font-size:.95rem;color:var(--muted);margin:-4px 0 10px}
.pimg{width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:#fff;margin-bottom:8px}
.ptimer{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:6px 0 12px}
.ptimer i{display:block;height:100%;background:var(--brand);width:100%}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;padding:16px 14px;border-radius:16px;color:#fff;border:none;font-size:1.1rem;font-weight:700;text-align:start}
.pbtn svg.sh{width:28px;height:28px;fill:currentColor;flex:none}
.pbtn.o2{color:#1a1200}
.pbtn.sel{outline:5px solid var(--ink);outline-offset:2px}
.pbtn.gone{opacity:.15;pointer-events:none}
.ptf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptf .pbtn{justify-content:center;font-size:1.3rem;min-height:110px}
.item{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.item span{flex:1}
.item button{padding:.3em .7em;font-weight:800}
.mpair{display:flex;gap:8px;margin:6px 0;align-items:stretch}
.mpair>div,.mpair>button{flex:1;border-radius:12px;padding:10px;border:3px solid var(--line);background:var(--surface);font-size:1rem;text-align:center}
.mpair .on{outline:4px solid var(--ink)}
.res{text-align:center;padding:26px 12px;border-radius:20px;margin-top:10px}
.res.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
.res.bad{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.res.mid{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.res.neu{background:var(--surface)}
.res h2{font-size:2rem;margin:0 0 6px}
.res .bp{font-family:var(--display);font-size:2.6rem;font-weight:800}
.stat{display:flex;justify-content:center;gap:22px;margin-top:10px;font-size:1rem}
.stat b{display:block;font-family:var(--display);font-size:1.5rem}
.wait{text-align:center;padding:30px 10px}
.wait svg.av{width:120px;height:120px;border-radius:50%}
.pill{display:inline-block;border-radius:999px;padding:.1em .8em;color:#fff;font-weight:800;font-family:var(--display)}
.joker{margin:6px 0;font-weight:800}
.banner{position:fixed;left:0;right:0;bottom:0;background:var(--bad);color:#fff;text-align:center;padding:8px;font-size:.95rem;z-index:30}
.paus{text-align:center;font-family:var(--display);font-size:2.4rem;font-weight:800;padding:70px 10px}
.vote{display:block;width:100%;text-align:start;margin:6px 0;padding:12px;border-radius:12px;font-size:1.05rem}
.vote.sel{outline:4px solid var(--gold);background:var(--surface2)}
</style>
</head>
<body>
<div id="tafel" hidden>
  <header>
    <img class="logo" id="logoImg" alt="KLA Bremerhaven">
    <h1>Quiz-Arena</h1>
    <span class="sp"></span>
    <span id="tctl"></span>
    <div class="mini"><canvas id="qrSmall" width="128" height="128"></canvas><div><b id="miniCode"></b><br><span id="miniN"></span><br><span id="conn"></span></div></div>
  </header>
  <main id="tMain"></main>
</div>
<div id="phone" hidden></div>
<script>

/* =========================================================
   Spannungsmusik (nur Tafel, Web Audio, keine Dateien, keine bekannte Melodie)
   ========================================================= */
const Music=(()=>{
  let ctx=null,master=null,timer=null,step=0,nextT=0,tempo=118,running=false;
  let on=store("klaq_music")===1,vol=store("klaq_vol");if(typeof vol!=="number")vol=0.3;
  const BASS=[55,55,82.4,55,65.4,65.4,73.4,82.4],ARP=[0,3,7,10,12,10,7,3];
  function ensure(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ctx=new C();master=ctx.createGain();master.gain.value=vol*0.6;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}
  function tone(f,t,d,type,g,lp){const o=ctx.createOscillator(),e=ctx.createGain();o.type=type;o.frequency.value=f;
    e.gain.setValueAtTime(0.0001,t);e.gain.exponentialRampToValueAtTime(g,t+0.012);e.gain.exponentialRampToValueAtTime(0.0001,t+d);
    let n=o;if(lp){const b=ctx.createBiquadFilter();b.type="lowpass";b.frequency.value=lp;o.connect(b);n=b;}n.connect(e);e.connect(master);o.start(t);o.stop(t+d+0.05);}
  function play(s,t){const sd=60/tempo/2,bar=Math.floor(s/8)%8;
    if(s%2===0)tone(BASS[bar],t,sd*1.8,"sawtooth",0.22,380);
    tone(220*Math.pow(2,ARP[s%8]/12),t,sd*0.9,"triangle",0.11);
    if(s%4===2)tone(1800,t,0.03,"square",0.03);}
  function sched(){if(!ctx)return;while(nextT<ctx.currentTime+0.18){play(step,nextT);nextT+=60/tempo/2;step++;}}
  const api={
    enabled:()=>on,vol:()=>vol,
    toggle(){on=!on;store("klaq_music",on?1:0);if(on){ensure();}else api.stop();return on;},
    setVol(v){vol=v;store("klaq_vol",v);if(master)master.gain.value=v*0.6;},
    start(){if(!on||running||document.hidden)return;if(!ensure())return;running=true;step=0;nextT=ctx.currentTime+0.05;tempo=118;timer=setInterval(sched,60);master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(vol*0.6,ctx.currentTime,0.05);},
    tempo(b){tempo=b;},
    stop(){if(!running)return;running=false;clearInterval(timer);if(ctx&&master){master.gain.setTargetAtTime(0.0001,ctx.currentTime,0.08);}},
    running:()=>running,
    jingle(kind){if(!on||!ensure())return;if(master)master.gain.setTargetAtTime(vol*0.6,ctx.currentTime+0.01,0.02);const t=ctx.currentTime+0.05;
      const seq=kind==="end"?[[262,0],[330,.14],[392,.28],[523,.42],[392,.6],[523,.74],[659,.9]]:[[392,0],[523,.12],[659,.24]];
      seq.forEach(([f,d])=>{tone(f,t+d,0.35,"triangle",0.22);tone(f*2,t+d,0.25,"sine",0.06);});}
  };
  document.addEventListener("visibilitychange",()=>{if(document.hidden)api.stop();});
  return api;})();

/* =========================================================
   TAFEL (Lehrkraft, Beamer) – Teil 1: Zustand, Netz, Spielablauf
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;$("logoImg").src=LOGO;
  const LIB="klaq_lib",KEY="klaq_game",SETK="klaq_set";
  let lib=store(LIB);if(!Array.isArray(lib))lib=[];
  function saveLib(){try{localStorage.setItem(LIB,JSON.stringify(lib));return true;}catch(e){window.alert("Der Speicher des Browsers ist voll. Bitte exportiere das Quiz als Datei (Knopf „Exportieren“) und lösche alte Quizze.");return false;}}
  let G=store(KEY),Q=null;
  function bindQuiz(){if(!G||!G.code){G=null;Q=null;return;}const base=lib.find(x=>x.id===G.qid);if(!base){G=null;Q=null;return;}
    Q=G.sel?Object.assign({},base,{qs:G.sel.map(id=>base.qs.find(q=>q.id===id)).filter(Boolean)}):base;}
  bindQuiz();
  let view=G?"game":"home",E={qid:null,qi:0,lang:"de"};
  let conn={up:0,all:2},pubT=null,subbed="",dirty=new Set(),favs=new Set();
  const net=new Net(onMsg,c=>{const was=conn.up;conn=c;if(c.up&&c.up!==was&&G){pubQz();pubState();G&&Object.keys(G.pl).forEach(markP);}renderHead();});
  const save=()=>{if(G)store(KEY,G);};
  const players=()=>G?Object.keys(G.pl):[];
  const curQ=()=>Q&&G&&G.qi>=0?Q.qs[G.qi]:null;
  function sub(){if(G&&subbed!==G.code){subbed=G.code;net.sub(G.code+"/in");}}
  const settings=()=>Object.assign({mode:"live",teams:0,rd:5,rank:1,joker:1,rn:0},store(SETK)||{});

  /* ---------- Spiel anlegen ---------- */
  function newGame(base,sel,old){
    const s=old?{mode:old.mode,teams:old.teams,rd:old.rd,rank:old.rank,joker:old.joker,rn:old.rn}:settings();
    G=Object.assign({code:old?old.code:codeGen(),seq:Math.max(Date.now(),old?old.seq+10:0),qv:Date.now(),qid:base.id,sel:sel||null,ph:"lobby",qi:-1,qStart:0,qDur:0,rdEnd:0,pa:false,paT:0,
      pl:{},ans:{},ideas:{},votes:{},bp:"c",il:[],rv:null,perm:{},kick:old?old.kick:[],rj:{}},s);
    if(old){for(const id in old.pl){const o=old.pl[id];G.pl[id]={n:o.n,a:o.a,l:o.l,t:-1,pts:0,st:0,j:0};}}
    bindQuiz();
    Q.qs.forEach((q,i)=>{const n=q.ty==="puzzle"?q.o.length:q.ty==="match"?q.pr.length:0;if(n){let p;let k=0;do{p=shuffle([...Array(n).keys()]);k++;}while(k<12&&p.every((x,j)=>x===j));G.perm[i]=p;}});
    sub();view="game";save();pubQz();pubState();Object.keys(G.pl).forEach(markP);render();}
  function startFromDemo(){let d=lib.find(x=>x.id&&x.id.startsWith("demo-"));if(!d){d=demoQuiz();lib.push(d);saveLib();}return d;}

  /* ---------- Senden ---------- */
  let qzT=0;function pubQzSoon(){if(Date.now()-qzT>3000){qzT=Date.now();pubQz();}}
  function pubQz(){if(!G||!Q)return;
    net.pub(G.code+"/qz",{v:G.qv,n:Q.qs.length,t:Q.title,qs:Q.qs.map((q,i)=>phoneQ(q,G.perm[i]))},true);
    Q.qs.forEach((q,i)=>{if(q.img)net.pub(G.code+"/img/"+i,{v:G.qv,i,d:q.img},true);});}
  function teamPts(){if(!G.teams)return [];const a=[];for(let t=0;t<G.teams;t++){const m=players().filter(id=>G.pl[id].t===t);a.push({t,n:TEAMS[t][0],c:TEAMS[t][1],m:m.length,pts:m.length?Math.round(m.reduce((s,id)=>s+G.pl[id].pts,0)/m.length):0});}return a;}
  function rankMap(){const r=players().map(id=>({id,p:G.pl[id].pts})).sort((a,b)=>b.p-a.p),m={};let rk=0,last=null;r.forEach((x,i)=>{if(x.p!==last){rk=i+1;last=x.p;}m[x.id]=rk;});return m;}
  function ranking(){const m=rankMap();return players().map(id=>Object.assign({id,rk:m[id]},G.pl[id])).sort((a,b)=>a.rk-b.rk||a.n.localeCompare(b.n));}
  function liveAnswered(){if(!G||G.qi<0)return [];const q=curQ();if(q&&q.ty==="brain")return Object.keys((G.bp==="c"?G.ideas[G.qi]:G.votes[G.qi])||{});return Object.keys(G.ans[G.qi]||{});}
  function markP(pid){dirty.add(pid);clearTimeout(markP.t);markP.t=setTimeout(flushP,150);}
  function flushP(){if(!G)return;const rm=rankMap(),np=players().length;
    for(const pid of dirty){const P=G.pl[pid];if(!P)continue;
      net.pub(G.code+"/p/"+pid,{ok:1,seq:++G.seq,n:P.n,a:P.a,t:P.t,tn:P.t>=0?TEAMS[P.t][0]:"",pts:P.pts,rk:rm[pid],np,fb:P.fb||null,jk:P.jk||null,ss:P.ss||"",ci:P.ci==null?-1:P.ci,qr:(P.ss==="q"&&Q.qs[P.ci]&&Q.qs[P.ci].time>0)?Math.max(0,Q.qs[P.ci].time-(Date.now()-P.qs)/1000):null,j:P.j?1:0},true);}
    dirty.clear();}
  function pubState(){clearTimeout(pubT);pubT=setTimeout(doPub,120);}
  function doPub(){if(!G||!Q)return;const q=curQ(),now=Date.now();
    const S={seq:++G.seq,v:G.qv,ph:G.ph,mode:G.mode,qi:G.qi,nq:Q.qs.length,open:G.ph==="q",pa:G.pa,
      rem:G.ph==="q"&&G.qDur>0?Math.max(0,G.qDur-(now-G.qStart)/1000):null,rd:G.ph==="intro"?Math.max(0,(G.rdEnd-now)/1000):0,
      an:liveAnswered(),np:players().length,cfg:{joker:G.joker?1:0,rn:G.rn?1:0,teams:G.teams},bp:G.bp,
      bi:(q&&q.ty==="brain"&&G.ph==="q"&&G.bp==="v")?G.il.map(x=>({i:x.id,t:x.t})):null,rv:(G.ph==="res"||G.ph==="rank")?G.rv:null,tm:G.teams?teamPts():null};
    net.pub(G.code+"/st",S,true);}
  setInterval(()=>{doPub();if(G)Object.keys(G.pl).forEach(markP);},6000);
  setInterval(()=>{if(G&&(G.ph==="lobby"))pubQz();},45000);

  /* ---------- Eingehende Nachrichten (alles wird hier geprüft) ---------- */
  function onMsg(t,p){
    if(!G||t!==NS+G.code+"/in"||!p||typeof p!=="object")return;
    const pid=clean(p.p,12);if(!pid||G.kick.includes(pid))return;
    if(p.k==="hi"){join(pid,p);return;}
    if(p.k==="rq"){pubQzSoon();return;}
    if(p.k==="ri"){const i=+p.i,q=Q.qs[i];if(Number.isInteger(i)&&q&&q.img)net.pub(G.code+"/img/"+i,{v:G.qv,i,d:q.img},true);return;}
    const P=G.pl[pid];if(!P)return;
    if(p.k==="a"){if(G.mode==="self")selfAnswer(pid,p);else liveAnswer(pid,p);}
    else if(p.k==="i")onIdeas(pid,p);
    else if(p.k==="vt")onVote(pid,p);
    else if(p.k==="j")onJoker(pid,p);
    else if(p.k==="nx")selfNext(pid);
    else return;
    save();pubState();render();}
  function uniqueName(n){const used=new Set(players().map(id=>G.pl[id].n.toLowerCase()));if(!used.has(n.toLowerCase()))return n;for(let i=2;i<99;i++){const c=n.slice(0,13)+" "+i;if(!used.has(c.toLowerCase()))return c;}return n;}
  function join(pid,p){
    let n=clean(p.n,16);if(!n)return;const l=LK.includes(p.l)?p.l:"de",a=/^\d{1,2}\.\d$/.test(String(p.a))?String(p.a):"0.0";
    if(!G.pl[pid]){
      if(badName(n)){G.rj[pid]=1;net.pub(G.code+"/p/"+pid,{rj:1,seq:++G.seq},true);return;}
      if(players().length>=60)return;
      G.pl[pid]={n:uniqueName(n),a,l,t:-1,pts:0,st:0,j:0};delete G.rj[pid];
      if(G.teams>0){const c=Array(G.teams).fill(0);players().forEach(id=>{const t=G.pl[id].t;if(t>=0&&t<G.teams)c[t]++;});G.pl[pid].t=c.indexOf(Math.min(...c));}
      if(G.ph==="self")selfStart(pid);
    }else{G.pl[pid].a=a;G.pl[pid].l=l;}
    markP(pid);pubQzSoon();save();pubState();render();}
  function removePlayer(pid){if(!G.pl[pid])return;delete G.pl[pid];G.kick.push(pid);net.pub(G.code+"/p/"+pid,{kick:1,seq:++G.seq},true);save();pubState();render();}

  /* ---------- Antworten ---------- */
  function liveAnswer(pid,p){
    if(G.ph!=="q"||G.pa||p.q!==G.qi)return;const q=curQ();if(!QT[q.ty].sc&&!["poll","cloud","open"].includes(q.ty))return;
    const v=validAns(q,p.v);if(v==null)return;const A=G.ans[G.qi];if(A[pid])return;
    const ms=Date.now()-G.qStart;if(G.qDur>0&&ms>G.qDur*1000+2000)return;
    A[pid]={v,ms};
    if(Object.keys(A).length>=players().length)closeQ();}
  function onIdeas(pid,p){const q=curQ();if(!q||q.ty!=="brain"||G.ph!=="q"||G.bp!=="c"||p.q!==G.qi||G.pa)return;
    if(!Array.isArray(p.v))return;const w=p.v.map(x=>clean(x,90)).filter(Boolean).slice(0,q.max||3);if(!w.length)return;
    const I=(G.ideas[G.qi]=G.ideas[G.qi]||{});if(I[pid])return;I[pid]=w;
    if(Object.keys(I).length>=players().length)closeQ();}
  function onVote(pid,p){const q=curQ();if(!q||q.ty!=="brain"||G.ph!=="q"||G.bp!=="v"||p.q!==G.qi||G.pa||!Array.isArray(p.v))return;
    const ids=[...new Set(p.v)].filter(i=>G.il.some(x=>x.id===i&&x.p!==pid)).slice(0,3);if(!ids.length)return;
    const V=(G.votes[G.qi]=G.votes[G.qi]||{});if(V[pid])return;V[pid]=ids;
    if(Object.keys(V).length>=players().length)closeQ();}
  function onJoker(pid,p){const P=G.pl[pid];if(!G.joker||P.j)return;
    let qi,q;if(G.mode==="self"){qi=P.ci;if(P.ss!=="q"||p.q!==qi)return;}else{qi=G.qi;if(G.ph!=="q"||p.q!==qi)return;}
    q=Q.qs[qi];if(!q||q.ty!=="mc"||q.multi||q.o.length<3)return;
    if(G.mode!=="self"&&(G.ans[qi]||{})[pid])return;
    const wrong=q.o.map((o,i)=>o.ok?-1:i).filter(i=>i>=0),h=shuffle(wrong).slice(0,Math.min(2,wrong.length-0));
    P.j=1;P.jk={q:qi,h};markP(pid);}

  /* ---------- Punkte ---------- */
  function scoreOne(P,q,qi,a){
    if(!QT[q.ty].sc)return {q:qi,ok:null,g:0};
    if(!a){P.st=0;return {q:qi,ok:0,none:1,g:0,st:0};}
    const r=judge(q,a.v,G.perm[qi]),dur=q.time*1000;
    const base=dur>0?Math.round(1000*(1-Math.min(1,a.ms/dur)/2)):1000;
    let g=Math.round(base*r*(q.pts===2?2:1));
    if(r===1){P.st=(P.st||0)+1;if(P.st>=2)g+=Math.min(5,P.st-1)*100;}else P.st=0;
    P.pts+=g;a.r=r;a.g=g;
    return {q:qi,ok:r===1?1:r>0?2:0,g,st:P.st};}

  /* ---------- Ablauf live ---------- */
  function beginQ(i){G.qi=i;G.ans[i]={};G.rv=null;G.bp="c";G.il=[];G.pa=false;const q=Q.qs[i];
    players().forEach(id=>{G.pl[id].jk=null;});
    if(q.ty==="info"){G.ph="q";G.qStart=Date.now();G.qDur=0;}
    else if(G.rd>0){G.ph="intro";G.rdEnd=Date.now()+G.rd*1000;}
    else openQ();
    after();}
  function openQ(){const q=curQ();G.ph="q";G.qStart=Date.now();G.qDur=q.time||0;if(q.time>0)Music.start();after();}
  function closeQ(){const q=curQ(),qi=G.qi;
    if(q.ty==="brain"&&G.bp==="c"){
      const I=G.ideas[qi]||{};G.il=[];Object.keys(I).forEach(pid=>I[pid].forEach(t=>G.il.push({id:"i"+G.il.length,p:pid,t})));G.il=shuffle(G.il);
      if(G.il.length){G.bp="v";G.qStart=Date.now();G.qDur=0;Music.stop();after();return;}
    }
    Music.stop();
    if(q.ty==="brain")G.bp="r";
    const A=G.ans[qi]||{};
    players().forEach(id=>{const P=G.pl[id];P.fb=scoreOne(P,q,qi,A[id]||null);P.jk=P.jk;});
    G.rv={q:qi,c:solution(q,G.perm[qi]),x:q.x||null};
    G.ph="res";Music.jingle("ok");players().forEach(markP);after();}
  function nextQ(){const i=G.qi+1;if(i>=Q.qs.length){endGame();return;}beginQ(i);}
  function advance(){
    if(!G||G.pa)return;const q=curQ();
    if(G.ph==="intro")openQ();
    else if(G.ph==="q"){if(q.ty==="info")nextQ();else closeQ();}
    else if(G.ph==="res"){if(G.rank&&QT[q.ty].sc)G.ph="rank";else{nextQ();return;}after();}
    else if(G.ph==="rank")nextQ();}
  function skipQ(){if(!G||(G.ph!=="q"&&G.ph!=="intro"))return;Music.stop();G.ans[G.qi]={};G.pa=false;nextQ();}
  function endGame(){Music.stop();G.ph="end";G.qi=Q.qs.length;G.rv=null;G.pa=false;Music.jingle("end");players().forEach(markP);after();}
  function after(){save();pubState();render();}
  function togglePause(){if(!G||!["intro","q"].includes(G.ph))return;
    if(!G.pa){G.pa=true;G.paT=Date.now();Music.stop();}else{const d=Date.now()-G.paT;G.qStart+=d;G.rdEnd+=d;G.pa=false;if(G.ph==="q"&&G.qDur>0)Music.start();}after();}
  function addTime(){if(G.ph==="q"&&G.qDur>0){G.qDur+=10;after();}}
  function startGame(){
    if(G.teams>0){const ids=shuffle(players());ids.forEach((id,i)=>{G.pl[id].t=i%G.teams;});}else players().forEach(id=>{G.pl[id].t=-1;});
    if(G.mode==="self"){G.ph="self";players().forEach(selfStart);after();}else nextQ();}

  /* ---------- Schülertempo ---------- */
  function selfIdx(from){for(let i=from;i<Q.qs.length;i++)if(SELF_OK.includes(Q.qs[i].ty))return i;return -1;}
  function selfStart(pid){const P=G.pl[pid];P.ci=-1;P.fb=null;selfAdvance(pid);}
  function selfAdvance(pid){const P=G.pl[pid],i=selfIdx((P.ci==null?-1:P.ci)+1);P.jk=null;
    if(i<0){P.ss="done";P.ci=Q.qs.length;}else{P.ci=i;P.ss="q";P.qs=Date.now();}markP(pid);}
  function selfAnswer(pid,p){const P=G.pl[pid];if(G.ph!=="self"||P.ss!=="q"||p.q!==P.ci)return;const q=Q.qs[P.ci];
    const v=validAns(q,p.v);if(v==null)return;if((G.ans[P.ci]||{})[pid])return;
    const ms=Date.now()-P.qs,late=q.time>0&&ms>q.time*1000+3000;
    const a={v,ms};(G.ans[P.ci]=G.ans[P.ci]||{})[pid]=a;
    P.fb=scoreOne(P,q,P.ci,late?null:a);if(late)a.r=0;P.fb.c=solution(q,G.perm[P.ci]);P.fb.x=q.x||null;P.ss="fb";markP(pid);}
  function selfNext(pid){const P=G.pl[pid];if(G.ph!=="self")return;const q=Q.qs[P.ci];
    if(P.ss==="q"&&q&&q.time>0&&Date.now()-P.qs>=q.time*1000-700){const a=null;P.fb=scoreOne(P,q,P.ci,a);P.fb.c=solution(q,G.perm[P.ci]);P.fb.x=q.x||null;P.ss="fb";markP(pid);return;}
    if(P.ss==="fb")selfAdvance(pid);}

  /* ---------- Uhr ---------- */
  setInterval(()=>{
    if(!G||G.pa||!Q)return;const now=Date.now();

  },250);

  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(!G)return "";
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+G.code+extra;
    const u=(settings().url||"").trim();if(u)return u+(u.includes("?")?"&":"?")+"s="+G.code+extra;
    if(LOCAL)return location.href.split("?")[0]+"?s="+G.code+extra;return "";}
  function drawQR(canvas,text){
    if(!canvas)return;const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){

      <button data-act="music" title="Spannungsmusik an/aus">${mus?"Musik an":"Musik aus"}</button>${mus?` <input type="range" min="0" max="1" step="0.05" value="${Music.vol()}" data-act="vol" style="width:90px;vertical-align:middle">`:""} <button data-act="full">Vollbild</button>`;

  /* ---------- Startseite ---------- */
  function rHome(M){

  /* ---------- Fragen ---------- */
  function counts(q,A){const n=q.ty==="tf"?2:q.o.length,c=Array(n).fill(0);for(const id in A){const v=A[id].v;if(q.ty==="tf")c[v[0]===1?0:1]++;else v.forEach(i=>c[i]++);}return c;}
  function groupAns(A,fmt){const g={};for(const id in A){const k=norm(A[id].v)||String(A[id].v);(g[k]=g[k]||{t:fmt?fmt(A[id].v):A[id].v,n:0,r:A[id].r}).n++;}return Object.values(g).sort((a,b)=>b.n-a.n);}
  function cloudHTML(A){const c={};for(const id in A)for(const w of A[id].v){const k=norm(w)||w.toLowerCase();(c[k]=c[k]||{t:w,n:0}).n++;}
    const arr=Object.values(c).sort((a,b)=>b.n-a.n),mx=arr.length?arr[0].n:1;
    return `<div class="cloud" style="width:100%">${arr.length?arr.map((w,i)=>`<span style="font-size:${(1.3+2.9*w.n/mx).toFixed(2)}rem;color:var(--c${[1,0,3,4,5,2][i%6]})">${h(w.t)}</span>`).join(""):`<span class="muted">Die Wörter erscheinen hier, sobald die Schüler sie senden.</span>`}</div>`;}
  function pinHTML(q,A,res){
    let dots="";for(const id in A){const v=A[id].v;dots+=`<i style="left:${v[0]*100}%;top:${v[1]*100}%;width:16px;height:16px;border:3px solid #fff;background:${A[id].r===1?"var(--ok)":"var(--bad)"};border-radius:50%"></i>`;}
    const p=q.pin;return `<div class="pinimg" style="cursor:default"><img src="${q.img||""}" alt="">${res?`<i style="left:${p.x*100}%;top:${p.y*100}%;width:${p.r*200}%;aspect-ratio:1;"></i>${dots}`:""}</div>`;}
  function qBody(q,res){
    const A=G.ans[G.qi]||{},n=Object.keys(A).length,np=players().length;
    switch(q.ty){
    case "mc":case "tf":case "poll":{
      const opts=q.ty==="tf"?[{t:"Richtig"},{t:"Falsch"}]:q.o.map(o=>({t:tx(o.t,"de")})),c=counts(q,A);
      const good=q.ty==="tf"?[q.ok?0:1]:q.ty==="mc"?q.o.map((o,i)=>o.ok?i:-1).filter(i=>i>=0):[];
      const cols=q.ty==="tf"?["o1","o0"]:null;
      if(q.ty==="poll"&&res){const mx=Math.max(1,...c);return `<div class="bars">${opts.map((o,i)=>`<div><b>${c[i]}</b><i class="o${i}" style="height:${Math.round(c[i]/mx*100)}%"></i><span style="text-align:center">${h(o.t)}</span></div>`).join("")}</div>`;}
      return `<div class="opts">${opts.map((o,i)=>`<div class="opt ${cols?cols[i]:"o"+i} ${res&&q.ty!=="poll"?(good.includes(i)?"good":"dim"):""}">${SHAPES[q.ty==="tf"?(i?3:0):i]}<span>${h(o.t)}</span>${res?`<span class="n">${c[i]}</span>`:""}</div>`).join("")}</div>`;}
    case "puzzle":{
      if(!res)return `<div class="box"><b>Das sind die Teile (gemischt). Auf dem Handy in die richtige Reihenfolge bringen:</b><div class="lobbyp">${G.perm[G.qi].map(i=>`<span class="pchip" style="padding:8px 16px;font-size:1.3rem">${h(tx(q.o[i].t,"de"))}</span>`).join("")}</div></div>`;
      const ex=Object.values(A).filter(a=>a.r===1).length;
      return `<div class="box"><b>Richtige Reihenfolge:</b><ol style="font-size:1.5rem;margin:.4em 0">${q.o.map(o=>`<li>${h(tx(o.t,"de"))}</li>`).join("")}</ol><div class="muted">${ex} von ${n} Antworten ganz richtig.</div></div>`;}
    case "short":{
      if(!res)return `<div class="box muted" style="font-size:1.3rem;text-align:center">Antwort auf dem Handy eintippen.</div>`;
      const g=groupAns(A);
      return `<div class="box"><b>Richtig:</b> <span style="font-size:1.4rem">${q.acc.map(h).join(" · ")}</span><div class="lobbyp">${g.map(x=>`<span class="pchip" style="padding:6px 14px;border-color:var(--${x.r===1?"ok":"bad"});border-width:3px">${h(x.t)}${x.n>1?` ×${x.n}`:""}</span>`).join("")}</div></div>`;}
    case "num":{
      if(!res)return `<div class="box muted" style="font-size:1.3rem;text-align:center">${q.sl?`Schieber auf dem Handy (${fmtNum(q.min)} bis ${fmtNum(q.max)}).`:"Zahl auf dem Handy eintippen."}</div>`;
      const vals=Object.values(A).map(a=>a.v).sort((a,b)=>a-b);
      if(q.sl){const lo=q.min,hi=q.max,X=v=>40+(v-lo)/(hi-lo)*720;
        return `<div class="box"><svg viewBox="0 0 800 130" style="width:100%"><line x1="40" x2="760" y1="80" y2="80" stroke="currentColor" stroke-width="3"/>
          ${vals.map((v,i)=>`<circle cx="${X(v)}" cy="${72-(i%3)*10}" r="8" fill="var(--c1)" opacity=".75"/>`).join("")}
          <line x1="${X(q.ans)}" x2="${X(q.ans)}" y1="30" y2="95" stroke="var(--ok)" stroke-width="5"/><text x="${X(q.ans)}" y="22" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ok)">${fmtNum(q.ans)}</text>
          <text x="40" y="118" font-size="18" fill="currentColor">${fmtNum(lo)}</text><text x="760" y="118" text-anchor="end" font-size="18" fill="currentColor">${fmtNum(hi)}</text></svg></div>`;}
      return `<div class="box"><b>Richtig:</b> <span style="font-size:1.6rem">${fmtNum(q.ans)}</span><div class="lobbyp">${vals.map(v=>`<span class="pchip" style="padding:6px 14px;border-width:3px;border-color:var(--${Math.abs(v-q.ans)<=Math.max(q.tol||0,1e-9)?"ok":"bad"})">${fmtNum(v)}</span>`).join("")}</div></div>`;}
    case "match":{
      const P=G.perm[G.qi];
      if(!res)return `<div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="box">${q.pr.map(p=>`<div class="pchip" style="margin:6px 0;font-size:1.3rem;display:block;border-radius:12px">${h(tx(p.l,"de"))}</div>`).join("")}</div><div class="box">${P.map(i=>`<div class="pchip" style="margin:6px 0;font-size:1.3rem;display:block;border-radius:12px">${h(tx(q.pr[i].r,"de"))}</div>`).join("")}</div></div>`;
      return `<div class="box">${q.pr.map(p=>`<div style="font-size:1.4rem;margin:6px 0"><b>${h(tx(p.l,"de"))}</b> → ${h(tx(p.r,"de"))}</div>`).join("")}<div class="muted">${Object.values(A).filter(a=>a.r===1).length} von ${n} Antworten ganz richtig.</div></div>`;}
    case "pin":return `<div style="text-align:center">${pinHTML(q,A,res)}${res?`<div class="muted">Grün = getroffen, rot = daneben.</div>`:""}</div>`;
    case "cloud":return cloudHTML(A);
    case "open":{const arr=Object.keys(A).map(id=>({id,t:A[id].v}));
      return `<div class="cards">${arr.map(a=>`<div class="${favs.has(a.id)?"fav":""}" data-act="fav" data-id="${h(a.id)}">${h(a.t)}</div>`).join("")||`<span class="muted">Die Antworten erscheinen hier. Antippen = groß anzeigen.</span>`}</div>`;}
    case "brain":{
      if(G.bp==="c")return `<div class="box" style="text-align:center;font-size:1.5rem">Ideen sammeln auf den Handys … <b>${Object.keys(G.ideas[G.qi]||{}).length}</b> von ${np} haben Ideen gesendet.</div>`;
      const V=G.votes[G.qi]||{},cnt={};for(const id in V)V[id].forEach(i=>cnt[i]=(cnt[i]||0)+1);
      if(G.bp==="v")return `<div class="box"><b>Abstimmung läuft: ${Object.keys(V).length} von ${np} haben abgestimmt.</b><div class="cards" style="margin-top:10px">${G.il.map(x=>`<div>${h(x.t)}</div>`).join("")}</div></div>`;
      const r=G.il.slice().sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0));
      return `<div class="board">${r.slice(0,10).map((x,i)=>`<li><span class="rk">${i+1}</span><span class="nm">${h(x.t)}</span><span class="pt">${cnt[x.id]||0}</span></li>`).join("")}</div>`;}
    case "info":return `<div class="qtext" style="font-weight:700;font-size:clamp(1.3rem,2.6vw,2.2rem)">${h(tx(q.body,"de"))}</div>`;
    }return "";}
  function rQuestion(M){
    const q=curQ(),res=G.ph==="res",intro=G.ph==="intro",np=players().length,i=G.qi,A=G.ans[i]||{};
    const an=liveAnswered().length,timed=G.ph==="q"&&G.qDur>0&&!(q.ty==="brain"&&G.bp==="v");

    else btn=`<button class="pri" data-act="adv">${G.rank&&QT[q.ty].sc?"Rangliste zeigen →":i+1>=Q.qs.length?"Zum Ergebnis →":"Nächste Frage →"}</button>`;

    const imgOnly=q.img&&q.ty!=="pin"&&q.ty!=="info";
    M.innerHTML=`<div class="qwrap"><div class="qtop"><span class="qtype">${i+1} / ${Q.qs.length} · ${h(label)}</span>${q.pts===2?`<span class="x2">Doppelte Punkte</span>`:""}<span class="grow"></span>
      ${G.ph==="q"&&q.ty!=="info"?`<span style="font-size:1.2rem"><b>${an}</b> / ${np} haben geantwortet</span>`:""}</div>
      ${q.ty==="info"?"":`<div class="qtext">${h(tx(q.q,"de"))}</div>`}
      ${(intro||imgOnly||(q.ty==="info"&&q.img)||timed)?`<div class="qmid">${intro?`<div class="timer" style="border-color:var(--gold)"><span id="rdc">${Math.max(1,Math.ceil((G.rdEnd-Date.now())/1000))}</span></div>`:""}${imgOnly?`<div><img src="${q.img}" alt="">${q.cr?`<div class="imgcr">${h(q.cr)}</div>`:""}</div>`:""}${q.ty==="info"&&q.img?`<img src="${q.img}" alt="">`:""}${timed?`<div class="timer" id="clk">${Math.ceil(Math.max(0,G.qDur-(Date.now()-G.qStart)/1000))}</div>`:""}</div>`:""}
      ${intro?`<div class="cnt muted">Lies die Frage. Gleich kommen die Antworten.</div>`:`<div>${qBody(q,res)}</div>`}
      ${res&&q.x&&tx(q.x,"de")?`<div class="expl"><b>Erklärung:</b> ${h(tx(q.x,"de"))}</div>`:""}${stat}
      <div class="ctrl">${btn}<button data-act="skip">Frage überspringen</button></div></div>`;
    if(timed)Music.start();}

  /* ---------- Rangliste ---------- */
  function rRank(M){
    const r=ranking(),top=r.slice(0,Math.max(5,r.length>8?8:r.length));
    M.innerHTML=`<h2 class="big" style="text-align:center">Rangliste</h2>
    ${G.teams?`<div class="tteams">${teamPts().sort((a,b)=>b.pts-a.pts).map(t=>`<span class="tteam" style="background:${t.c};${t.n==="Gelb"?"color:#1a1200":""}">${t.n}: ${t.pts}</span>`).join("")}</div>`:""}

    <div class="ctrl" style="justify-content:center"><button class="pri" data-act="adv" style="font-size:1.3rem">${G.qi+1>=Q.qs.length?"Zum Ergebnis →":"Nächste Frage →"}</button></div>`;}
  function rSelf(M){

  /* ---------- Auswertung ---------- */
  function repData(){

  function rReport(M){

    ${hard.length?`<div class="box" style="margin:12px 0"><b>Am schwierigsten:</b> ${hard.map(x=>`Frage ${x.i+1} (${Math.round(x.rate*100)} % richtig): ${h(qTitle(x.q,"de").slice(0,70))}`).join(" · ")}</div>`:""}

    ${D.rows.map(p=>`<tr><td class="l">${p.rk}</td><td class="l">${h(p.n)}</td><td>${p.t>=0?TEAMS[p.t][0]:""}</td><td><b>${p.pts}</b></td>${D.qs.map(x=>{const a=(G.ans[x.i]||{})[p.id];return x.sc?`<td class="${a?(a.r===1?"g":"f"):"f"}">${a?(a.r===1?"✓":a.r>0?"~":"✗"):"–"}</td>`:`<td>${a?"•":""}</td>`;}).join("")}</tr>`).join("")}
    <tr><td class="l" colspan="4"><b>Richtig in %</b></td>${D.qs.map(x=>`<td><b>${x.rate==null?"":Math.round(x.rate*100)}</b></td>`).join("")}</tr></table></div>
    <p class="muted">✓ richtig, ~ teilweise, ✗ falsch, – keine Antwort, • beantwortet (ohne Wertung).</p>`;}
  function csv(){const D=repData(),sep=";",q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const head=["Platz","Name","Team","Punkte",...D.qs.map(x=>"Frage "+(x.i+1))];
    const lines=[head.map(q).join(sep),...D.rows.map(p=>[p.rk,q(p.n),p.t>=0?TEAMS[p.t][0]:"",p.pts,...D.qs.map(x=>{const a=(G.ans[x.i]||{})[p.id];return x.sc?(a?(a.r===1?1:a.r>0?0.5:0):""):(a?"x":"");})].join(sep)),
      ["","","","Richtig in %",...D.qs.map(x=>x.rate==null?"":Math.round(x.rate*100))].join(sep),"",...D.qs.map(x=>q("Frage "+(x.i+1)+": "+qTitle(x.q,"de"))).map(s=>s)];
    download("quiz-auswertung-"+new Date().toISOString().slice(0,10)+".csv","﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");}
  function retryRound(){const D=repData(),weak=D.qs.filter(x=>x.sc&&x.rate!==null&&x.rate<0.7).map(x=>x.q.id);

  /* ---------- Bedienung ---------- */
  function act(a,d,el){
    switch(a){
    case "home":if(G&&G.ph!=="lobby"&&G.ph!=="end"&&view==="game"&&!window.confirm("Zur Startseite? Das laufende Spiel bleibt gespeichert und kann fortgesetzt werden."))return;Music.stop();view="home";render();break;
    case "resume":view="game";render();break;
    case "demo":{const d=startFromDemo();newGame(d);break;}
    case "play":{const b=lib.find(x=>x.id===d.id);if(b)newGame(b);break;}
    case "cancel":Music.stop();if(G){net.pub(G.code+"/st",{seq:++G.seq,ph:"closed"},true);}G=null;Q=null;store(KEY,null);try{localStorage.removeItem(KEY);}catch(e){}view="home";render();break;
    case "import":$("impf").click();break;
    case "newquiz":{const qz={v:1,id:"quiz-"+rnd(5),title:"Neues Quiz",qs:[newQ("mc")]};lib.push(qz);saveLib();E={qid:qz.id,qi:0,lang:"de"};view="edit";render();break;}
    case "edit":E={qid:d.id,qi:0,lang:"de"};view="edit";render();break;
    case "export":{const b=lib.find(x=>x.id===d.id);if(b)download((b.title||"quiz").replace(/[^\wäöüÄÖÜß -]/g,"_")+".json",JSON.stringify(b),"application/json");break;}
    case "del":{const b=lib.find(x=>x.id===d.id);if(b&&window.confirm("Quiz „"+b.title+"“ wirklich löschen?")){lib=lib.filter(x=>x!==b);saveLib();render();}break;}
    case "set":{const k=d.k,v=k==="mode"?d.v:+d.v;G[k]=v;const s=settings();s[k]=v;store(SETK,s);save();pubState();render();break;}
    case "kick":removePlayer(d.id);break;
    case "start":startGame();break;
    case "adv":advance();break;
    case "plus":addTime();break;
    case "skip":if(window.confirm("Diese Frage überspringen?"))skipQ();break;
    case "pause":togglePause();break;
    case "finish":if(window.confirm("Spiel beenden?"))endGame();break;
    case "fav":if(favs.has(d.id))favs.delete(d.id);else{favs.clear();favs.add(d.id);}render();break;
    case "report":view="report";render();break;
    case "back":view="game";render();break;
    case "csv":csv();break;
    case "retry":retryRound();break;
    case "again":newGame(lib.find(x=>x.id===G.qid),G.sel,G);break;
    case "music":Music.toggle();if(!Music.enabled())Music.stop();else if(G&&G.ph==="q"&&G.qDur>0)Music.start();renderHead();break;
    case "vol":Music.setVol(+el.value);break;
    case "full":{const e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen();break;}
    default:if(a.startsWith("gen-"))genAct(a,d,el);else if(a.startsWith("ed-"))editAct(a,d,el);
    }}

    else if(t.id==="tUrl"){const s=settings();s.url=t.value;store(SETK,s);render();}
    else if(t.dataset&&t.dataset.act&&t.dataset.act.startsWith("ed-")&&!(t.type==="text"||t.type==="number"||t.tagName==="TEXTAREA")){editAct(t.dataset.act,t.dataset,t,false);}});

  let saveT=null;const touch=()=>{clearTimeout(saveT);saveT=setTimeout(saveLib,400);};
  function problems(qz){const p=[];qz.qs.forEach((q,i)=>{const n="Frage "+(i+1)+": ";
    if(q.ty!=="info"&&!tx(q.q,"de").trim())p.push(n+"Fragetext fehlt.");
    if(q.ty==="info"&&!tx(q.body,"de").trim()&&!tx(q.q,"de").trim())p.push(n+"Text der Folie fehlt.");
    if((q.ty==="mc"||q.ty==="poll"||q.ty==="puzzle")&&q.o.some(o=>!tx(o.t,"de").trim()))p.push(n+"Eine Antwort ist leer.");
    if(q.ty==="mc"&&!q.o.some(o=>o.ok))p.push(n+"Keine richtige Antwort markiert.");
    if(q.ty==="short"&&!(q.acc||[]).some(a=>a.trim()))p.push(n+"Richtige Antwort fehlt.");
    if(q.ty==="match"&&q.pr.some(x=>!tx(x.l,"de").trim()||!tx(x.r,"de").trim()))p.push(n+"Ein Paar ist unvollständig.");
    if(q.ty==="pin"&&!q.img)p.push(n+"Bild fehlt.");});return p;}

  const eqz=()=>lib.find(x=>x.id===E.qid);

    if(q.ty==="num")body+=`<div class="row"><div><label>Richtige Zahl</label><input type="number" step="any" data-act="ed-val" data-path="ans" value="${q.ans}"></div><div><label>Erlaubte Abweichung (±)</label><input type="number" step="any" data-act="ed-val" data-path="tol" value="${q.tol||0}"></div></div>

    if(q.ty==="pin"){body+=`<label>Richtige Stelle: ins Bild tippen</label>`+(q.img?`<div class="pinimg" data-act="ed-pin"><img src="${q.img}" alt=""><i style="left:${q.pin.x*100}%;top:${q.pin.y*100}%;width:${q.pin.r*200}%;aspect-ratio:1"></i></div><label>Größe des Treffer-Kreises (in % der Bildbreite)</label><input type="number" min="3" max="50" data-act="ed-val" data-path="pinr" value="${Math.round(q.pin.r*100)}">`:`<p class="muted">Zuerst unten ein Bild wählen.</p>`);}
    if(q.ty==="cloud"||q.ty==="brain")body+=`<label>Wörter bzw. Ideen pro Schüler</label><select data-act="ed-val" data-path="max">${[1,2,3,4,5].map(n=>`<option ${n===q.max?"selected":""}>${n}</option>`).join("")}</select>`;

  function seg2(a,opts,cur){return `<div class="seg">${opts.map(([v,t])=>`<button data-act="${a}" data-v="${v}" class="${String(cur)===String(v)?"on":""}">${t}</button>`).join("")}</div>`;}
  function editAct(a,d,el,silent){
    const qz=eqz();if(!qz)return;const q=qz.qs[E.qi];
    const done=()=>{if(silent){touch();return;}saveLib();render();};
    switch(a){
    case "ed-title":qz.title=clean(el.value,80);touch();break;
    case "ed-sel":E.qi=+d.i;E.cand=[];E.busy="";render();break;
    case "ed-add":{const t=$("edtype").value;qz.qs.push(newQ(t));E.qi=qz.qs.length-1;E.cand=[];saveLib();render();break;}
    case "ed-delq":if(qz.qs.length>1&&window.confirm("Diese Frage löschen?")){qz.qs.splice(E.qi,1);E.qi=Math.max(0,E.qi-1);saveLib();render();}break;
    case "ed-up":if(E.qi>0){[qz.qs[E.qi-1],qz.qs[E.qi]]=[qz.qs[E.qi],qz.qs[E.qi-1]];E.qi--;saveLib();render();}break;

  const curQi=()=>!S?-1:self()?(M&&M.ss!=="done"?M.ci:-1):S.qi;
  const curQ=()=>QZ&&curQi()>=0?QZ.qs[curQi()]:null;
  function answered(){const i=curQi();if(self())return !!(M&&M.ss!=="q");return !!(S&&S.an&&S.an.includes(P.pid))||L.sent===i;}
  function remaining(){ // Sekunden
    if(self()){return M&&M.qr!=null?Math.max(0,M.qr-(Date.now()-recvM)/1000):null;}
    return S&&S.rem!=null?Math.max(0,S.rem-(Date.now()-recvS)/1000):null;}
  const dual=o=>{const t=tx(o,P.l);return `<span dir="auto" style="flex:1">${h(t)}${P.de&&P.l!=="de"&&hasTr(o,P.l)?`<small dir="ltr" style="display:block;font-weight:400;opacity:.85;font-size:.8em">${h(tx(o,"de"))}</small>`:""}</span>`;};
  const plain=o=>h(tx(o,P.l));
  function top(){const ok=M&&M.ok;
    return `<div class="ptop"><div class="me">${ok?`${avOf(P.a)}<span>${h(M.n||P.n)}</span>${M.tn?`<span class="pill" style="background:${TEAMS.find(t=>t[0]===M.tn)?TEAMS.find(t=>t[0]===M.tn)[1]:"#666"};${M.tn==="Gelb"?"color:#1a1200":""}">${h(M.tn)}</span>`:""}`:`<span>${h(T("join"))}</span>`}</div>
    <div class="row">${ok?`<span class="pts">${M.pts||0}</span>`:""}<button id="bLang" style="padding:.3em .7em">${(LANGS.find(x=>x[0]===P.l)||LANGS[0])[1]}</button></div></div>
    ${J.langOpen?`<div class="box" style="margin-bottom:10px"><div class="lang">${availLangs().map(([k,n])=>`<button data-lang="${k}" class="${k===P.l?"on":""}">${n}</button>`).join("")}</div>${P.l!=="de"?`<label style="font-weight:400"><input type="checkbox" id="cDe" style="width:auto" ${P.de?"checked":""}> ${h(T("showDe"))}</label>`:""}</div>`:""}`;}
  function qHead(q,i){const img=IMG[i];
    return `<div class="pq" dir="auto">${h(tx(q.q,P.l))}</div>${P.de&&P.l!=="de"&&hasTr(q.q,P.l)?`<div class="pq2" dir="ltr">${h(tx(q.q,"de"))}</div>`:""}${q.hi?(img?`<img class="pimg" src="${img}" alt="">`:`<div class="muted" style="text-align:center;padding:14px">…</div>`):""}`;}
  const timerBar=()=>{const q=curQ();return q&&q.time>0?`<div class="ptimer"><i id="tbar"></i></div>`:"";};

  /* ---------- Bildschirme ---------- */
  function vJoin(){
    const an=P.a.split(".");const a=+an[0]||0,c=+an[1]||0;
    return `<h2 style="margin-top:6px">${h(T("join"))}</h2><div class="lang">${availLangs().map(([k,n])=>`<button data-lang="${k}" class="${k===P.l?"on":""}">${n}</button>`).join("")}</div>
    <label>${h(T("nick"))}</label><div class="row"><input id="iNick" maxlength="16" value="${h(P.n)}" autocomplete="off" style="flex:1" ${S&&S.cfg&&S.cfg.rn?"readonly":""}><button id="bRnd">${h(T("rnd"))}</button></div>
    ${(J.err||(M&&M.rj))?`<div style="color:var(--bad);font-weight:700;margin-top:6px">${h(T("badname"))}</div>`:""}
    <label>${h(T("pick"))}</label><div class="avg">${ANIMALS.map((_,i)=>`<button data-an="${i}" class="${i===a?"on":""}">${animalSVG(i,c)}</button>`).join("")}</div>
    <div class="colg">${BGS.map((b,i)=>`<button data-col="${i}" class="${i===c?"on":""}" style="background:${b}"></button>`).join("")}</div>
    <button class="pri" id="bJoin" style="width:100%;font-size:1.2rem;margin-top:14px;padding:.8em">${h(T("go"))}</button>`;}
  function vWait(msg){return `<div class="wait">${M&&M.ok?`<svg class="av" viewBox="0 0 100 100">${animalSVG(+P.a.split(".")[0],+P.a.split(".")[1]).replace(/^<svg[^>]*>|<\/svg>$/g,"")}</svg>`:""}<h2 style="margin-top:14px">${h(msg)}</h2></div>`;}
  function vQuestion(q,i,ro){
    const done=!ro&&answered();let b="";
    if(q.ty==="info")return `<h2 dir="auto">${h(tx(q.q,P.l))}</h2><p dir="auto" style="font-size:1.2rem">${h(tx(q.body,P.l))}</p>`;
    if(ro)return qHead(q,i)+`<div class="wait"><h2>${h(T("ready"))}</h2><div class="bigpts" id="rdc">${Math.max(1,Math.ceil(S.rd-(Date.now()-recvS)/1000))}</div><p class="muted">${h(T("read"))}</p></div>`;
    if(done)return qHead(q,i)+`<div class="res neu"><h2>${h(T("thanks"))}</h2><p>${h(T("sent"))}</p></div>`;
    b+=timerBar();
    switch(q.ty){
    case "mc":case "poll":{
      const hid=M&&M.jk&&M.jk.q===i?M.jk.h:[];
      b+=(q.multi?`<p class="muted">${h(T("multi"))}</p>`:"")+q.o.map((o,k)=>`<button class="pbtn o${k} ${L.sel&&L.sel.includes(k)?"sel":""} ${hid.includes(k)?"gone":""}" data-opt="${k}">${SHAPES[k]}${dual(o)}</button>`).join("");
      if(q.multi)b+=`<button class="pri" data-submit="1" style="width:100%;margin-top:8px" ${L.sel&&L.sel.length?"":"disabled"}>${h(T("send"))}</button>`;
      if(S.cfg&&S.cfg.joker&&q.ty==="mc"&&!q.multi&&q.o.length>=3&&M&&!M.j)b+=`<button class="joker" data-joker="1">${h("50:50")}</button>`;
      break;}
    case "tf":b+=`<div class="ptf"><button class="pbtn o1" data-tf="1">${SHAPES[0]}<span>${h(T("tf1"))}</span></button><button class="pbtn o0" data-tf="0">${SHAPES[3]}<span>${h(T("tf0"))}</span></button></div>`;break;
    case "puzzle":{const ord=L.ord||(L.ord=q.o.map((_,k)=>k));b+=`<p class="muted">${h(T("order"))}</p>`+ord.map((k,pos)=>`<div class="item"><b>${pos+1}</b>${dual(q.o[k])}<button data-mv="${pos}" data-d="-1" ${pos?"":"disabled"}>↑</button><button data-mv="${pos}" data-d="1" ${pos<ord.length-1?"":"disabled"}>↓</button></div>`).join("")+`<button class="pri" data-submit="1" style="width:100%;margin-top:8px">${h(T("send"))}</button>`;break;}
    case "short":b+=`<p class="muted">${h(T("typeDe"))}</p><input id="iTxt" maxlength="60" autocomplete="off" value="${h(L.txt||"")}"><button class="pri" data-submit="1" style="width:100%;margin-top:10px">${h(T("send"))}</button>`;break;
    case "open":b+=`<p class="muted">${h(T("typeDe"))}</p><textarea id="iTxt" maxlength="240">${h(L.txt||"")}</textarea><button class="pri" data-submit="1" style="width:100%;margin-top:10px">${h(T("send"))}</button>`;break;
    case "num":if(q.sl){const v=L.num!=null?L.num:Math.round((q.min+q.max)/2/q.step)*q.step;b+=`<div class="bigpts" style="text-align:center" id="nv">${fmtNum(v)}</div><input type="range" id="iRng" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}" style="padding:0">`;L.num=v;}
      else b+=`<input id="iNum" inputmode="decimal" placeholder="${h(T("number"))}" value="${h(L.txt||"")}" autocomplete="off" style="font-size:1.5rem">`;
      b+=`<button class="pri" data-submit="1" style="width:100%;margin-top:10px">${h(T("send"))}</button>`;break;
    case "match":{const n=q.l.length,m=L.mt||(L.mt=Array(n).fill(-1)),used=new Set(m.filter(x=>x>=0));
      b+=`<p class="muted">${h(T("match"))}</p>`+q.l.map((lt,j)=>`<div class="mpair"><div>${dual(lt)}</div><button data-row="${j}" class="${L.cur===j?"on":""}">${m[j]>=0?dual(q.o[m[j]]):"?"}</button></div>`).join("")+`<div style="margin-top:8px">`+q.o.map((o,k)=>used.has(k)?"":`<button class="vote" data-rt="${k}">${dual(o)}</button>`).join("")+`</div><button class="pri" data-submit="1" style="width:100%;margin-top:8px" ${m.every(x=>x>=0)?"":"disabled"}>${h(T("send"))}</button>`;break;}
    case "pin":b+=`<p class="muted">${h(T("tap"))}</p>`;break;
    case "cloud":case "brain":{const n=q.max||3;L.w=L.w||Array(n).fill("");b+=`<p class="muted">${h(T("typeDe"))}</p>`+L.w.map((w,k)=>`<input class="iw" data-w="${k}" maxlength="${q.ty==="cloud"?30:90}" placeholder="${h(T(q.ty==="cloud"?"word":"idea"))}" value="${h(w)}" style="margin:6px 0" autocomplete="off">`).join("")+`<button class="pri" data-submit="1" style="width:100%;margin-top:10px">${h(T("send"))}</button>`;break;}
    }
    if(q.ty==="pin"){const img=IMG[i];return qHead(Object.assign({},q,{hi:0}),i)+b+(img?`<div class="pinimg" id="pinBox" style="display:block"><img src="${img}" alt="" style="width:100%;max-height:none;border-radius:12px">${L.pin?`<i style="left:${L.pin[0]*100}%;top:${L.pin[1]*100}%;width:22px;height:22px;border:4px solid var(--bad);background:rgba(179,38,30,.3)"></i>`:""}</div><button class="pri" data-submit="1" style="width:100%;margin-top:10px" ${L.pin?"":"disabled"}>${h(T("send"))}</button>`:`<div class="muted" style="text-align:center;padding:20px">…</div>`);}
    return qHead(q,i)+b;}
  function solText(q,c){
    if(c==null)return "";
    switch(q.ty){
    case "mc":return c.map(k=>plain(q.o[k])).join(" · ");
    case "tf":return h(T(c[0]?"tf1":"tf0"));
    case "puzzle":return `<ol style="text-align:start;margin:4px 0">${c.map(k=>`<li>${plain(q.o[k])}</li>`).join("")}</ol>`;
    case "short":return h(c);
    case "num":return fmtNum(c);
    case "match":return q.l.map((lt,j)=>`<div>${plain(lt)} → ${plain(q.o[c[j]])}</div>`).join("");
    }return "";}
  function vResult(q,i){
    const fb=M&&M.fb&&M.fb.q===i?M.fb:null,sc=q.ty==="info"?0:(["poll","cloud","open","brain"].includes(q.ty)?0:1);
    const c=fb&&fb.c!==undefined?fb.c:(S&&S.rv&&S.rv.q===i?S.rv.c:null),x=fb&&fb.x?fb.x:(S&&S.rv&&S.rv.q===i?S.rv.x:null);
    let box="";
    if(!sc)box=`<div class="res neu"><h2>${h(T("thanks"))}</h2></div>`;
    else if(!fb)box=`<div class="res bad"><h2>${h(T("none"))}</h2></div>`;
    else{const k=fb.ok===1?"ok":fb.ok===2?"mid":"bad";
      box=`<div class="res ${k}"><h2>${h(T(fb.ok===1?"ok":fb.ok===2?"part":fb.none?"none":"bad"))}</h2>${fb.g?`<div class="bp">+${fb.g}</div>`:""}${fb.st>=2?`<div>${h(T("streak"))}: ${fb.st}</div>`:""}
        ${fb.ok!==1&&c!=null&&solText(q,c)?`<div style="margin-top:10px"><b>${h(T("correctIs"))}</b><div style="font-size:1.15rem">${solText(q,c)}</div></div>`:""}</div>`;}
    const ex=x&&tx(x,P.l)?`<div class="merk" style="border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:10px 12px;margin-top:10px">${h(tx(x,P.l))}${P.de&&P.l!=="de"&&hasTr(x,P.l)?`<div class="muted" dir="ltr" style="font-size:.85rem;margin-top:4px">${h(tx(x,"de"))}</div>`:""}</div>`:"";
    const stat=M?`<div class="stat"><div><b>${M.pts||0}</b>${h(T("pts"))}</div><div><b>${M.rk||"–"}${M.np?` / ${M.np}`:""}</b>${h(T("place"))}</div></div>`:"";
    return qHead(q,i)+box+ex+stat+(self()?`<button class="pri" data-next="1" style="width:100%;margin-top:14px;font-size:1.2rem;padding:.8em">${h(T("next"))}</button>`:"");}
  function vBrainVote(q,i){
    if(answered())return qHead(q,i)+`<div class="res neu"><h2>${h(T("thanks"))}</h2><p>${h(T("sent"))}</p></div>`;
    const sel=L.vs||(L.vs=[]);const mine=new Set((L.mine||[]));
    return `<p class="muted">${h(T("vote"))}</p>`+(S.bi||[]).map(x=>`<button class="vote ${sel.includes(x.i)?"sel":""}" data-vote="${h(x.i)}">${h(x.t)}</button>`).join("")+`<button class="pri" data-submit="1" style="width:100%;margin-top:8px" ${sel.length?"":"disabled"}>${h(T("send"))}</button>`;}
  function vEnd(){return `<div class="res ok"><h2>${h(T("over"))}</h2>${M&&M.rk?`<div class="bp">${h(T("place"))} ${M.rk}</div>`:""}<div class="stat"><div><b>${M?M.pts||0:0}</b>${h(T("pts"))}</div></div></div>`;}

  /* ---------- Zeichnen ---------- */
  function currentView(){
    if(!S)return {k:"conn",html:`<div class="wait"><h2>${h(T("wq"))}</h2></div>`};
    if(S.ph==="closed")return {k:"closed",html:`<div class="paus">${h(T("over"))}</div>`};
    if(M&&M.kick)return {k:"kick",html:`<div class="paus" style="font-size:1.6rem">${h(T("kicked"))}</div>`};
    if(!M||!M.ok)return {k:"join"+J.err+(M&&M.rj?"r":""),html:vJoin(),join:1};
    const q=curQ(),i=curQi();
    if(S.pa&&!self())return {k:"pause",html:`<div class="paus">${h(T("pause"))}</div>`};
    if(self()){
      if(M.ss==="done")return {k:"done",html:vEnd()};
      if(!q)return {k:"w",html:vWait(T("wait"))};
      if(M.ss==="fb")return {k:"sfb"+i+(M.fb?M.fb.ok:""),html:vResult(q,i)};
      return {k:"sq"+i+(answered()?"a":"")+(IMG[i]?"i":"")+(M.jk?"j":"")+L.q,html:vQuestion(q,i,false)};}
    if(S.ph==="lobby")return {k:"lobby"+(M.tn||""),html:vWait(T("wait"))};
    if(S.ph==="end")return {k:"end",html:vEnd()};
    if(!q)return {k:"w2",html:vWait(T("wait"))};
    if(S.ph==="intro")return {k:"intro"+i+(IMG[i]?"i":""),html:vQuestion(q,i,true)};
    if(S.ph==="q"){
      if(q.ty==="brain"&&S.bp==="v")return {k:"bv"+i+(answered()?"a":"")+(S.bi?S.bi.length:0),html:vBrainVote(q,i)};
      return {k:"q"+i+(answered()?"a":"")+(IMG[i]?"i":"")+(M.jk?"j":"")+L.q,html:vQuestion(q,i,false)};}
    if(S.ph==="res"||S.ph==="rank")return {k:"res"+i+(M.fb?M.fb.ok+"/"+M.fb.g:"")+(S.rv?1:0)+M.rk+(M.pts||0),html:vResult(q,i)};
    return {k:"x",html:vWait(T("wait"))};}
  function draw(){
    const qi=curQi(),idt=(self()?"s":"l")+qi+"/"+(QZ?QZ.v:0);if(L.q!==idt){L={q:idt};}
    if(S&&S.ph==="q"&&!self()&&S.pa===false){}
    const v=currentView();
    root.dir=P.l==="ar"?"rtl":"ltr";root.lang=P.l;
    const key=v.k+"|"+P.l+"|"+P.de+"|"+J.langOpen+"|"+(M&&M.tn)+"|"+(net.count().up?1:0)+"|"+(QZ?QZ.v:0);
    if(key===lastKey)return;lastKey=key;
    root.innerHTML=top()+v.html+(net.count().up?"":`<div class="banner">${h(T("offline"))}</div>`);
    bind(v);tickBar();}
  function tickBar(){const el=$("tbar");if(el){const q=curQ(),r=remaining();if(q&&r!=null&&q.time>0){el.style.width=Math.max(0,Math.min(100,r/q.time*100))+"%";el.style.background=r<=5?"var(--bad)":"var(--brand)";
      if(self()&&r<=0&&M&&M.ss==="q"&&!L.autoNx){L.autoNx=1;send({k:"nx"},()=>M&&M.ss!=="q"||L.q===null);}}}
    const rd=$("rdc");if(rd&&S)rd.textContent=Math.max(1,Math.ceil(S.rd-(Date.now()-recvS)/1000));}
  setInterval(tickBar,250);
  setInterval(()=>{if(S&&S.ph==="intro"&&!$("rdc"))draw();},1000);

  /* ---------- Eingaben ---------- */
  function submitAns(v){const i=curQi();L.sent=i;
    const it=send({k:"a",q:i,v},()=>self()?(M&&M.fb&&M.fb.q===i):(S&&S.an&&S.an.includes(P.pid)));lastKey="";draw();return it;}
  function bind(v){
    root.querySelector("#bLang").onclick=()=>{J.langOpen=J.langOpen?0:1;lastKey="";draw();};
    root.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{P.l=b.dataset.lang;store("klaq_lang",P.l);savP();J.langOpen=0;lastKey="";draw();});
    const cDe=$("cDe");if(cDe)cDe.onchange=()=>{P.de=cDe.checked?1:0;savP();lastKey="";draw();};
    if(v.join){
      const inp=$("iNick");inp.oninput=()=>{P.n=inp.value;J.err=0;};
      $("bRnd").onclick=()=>{P.n=randName();lastKey="";draw();};
      root.querySelectorAll("[data-an]").forEach(b=>b.onclick=()=>{const c=P.a.split(".")[1]||"0";P.a=b.dataset.an+"."+c;savP();J.keep=1;lastKey="";draw();});
      root.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{const a=P.a.split(".")[0]||"0";P.a=a+"."+b.dataset.col;savP();lastKey="";draw();});
      $("bJoin").onclick=()=>{let n=clean(P.n,16);if(!n||badName(n)){J.err=1;lastKey="";draw();return;}if(S&&S.cfg&&S.cfg.rn&&!n)n=randName();P.n=n;savP();
        send({k:"hi",n:P.n,a:P.a,l:P.l},()=>M&&M.ok);$("bJoin").disabled=true;};
      return;}
    const q=curQ(),i=curQi();if(!q)return;
    root.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const k=+b.dataset.opt;
      if(q.multi){L.sel=L.sel||[];L.sel=L.sel.includes(k)?L.sel.filter(x=>x!==k):[...L.sel,k];lastKey="";draw();}else submitAns([k]);});
    root.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>submitAns([+b.dataset.tf]));
    root.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{const p=+b.dataset.mv,d=+b.dataset.d,o=L.ord;[o[p],o[p+d]]=[o[p+d],o[p]];lastKey="";draw();});
    const jb=root.querySelector("[data-joker]");if(jb)jb.onclick=()=>{send({k:"j",q:i},()=>M&&M.jk&&M.jk.q===i);jb.disabled=true;};
    const it=$("iTxt");if(it)it.oninput=()=>{L.txt=it.value;};
    const inn=$("iNum");if(inn)inn.oninput=()=>{L.txt=inn.value;};
    const rg=$("iRng");if(rg)rg.oninput=()=>{L.num=+rg.value;$("nv").textContent=fmtNum(L.num);};
    root.querySelectorAll(".iw").forEach(e=>e.oninput=()=>{L.w[+e.dataset.w]=e.value;});
    root.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>{const j=+b.dataset.row;if(L.mt[j]>=0)L.mt[j]=-1;L.cur=j;lastKey="";draw();});
    root.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{const k=+b.dataset.rt;let j=L.cur;if(j==null||L.mt[j]>=0)j=L.mt.indexOf(-1);if(j<0)return;L.mt[j]=k;L.cur=L.mt.indexOf(-1);if(L.cur<0)L.cur=null;lastKey="";draw();});
    const pb=$("pinBox");if(pb)pb.onclick=e=>{const r=pb.getBoundingClientRect();L.pin=[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];lastKey="";draw();};
    root.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>{const id=b.dataset.vote;L.vs=L.vs||[];if(L.vs.includes(id))L.vs=L.vs.filter(x=>x!==id);else if(L.vs.length<3)L.vs.push(id);lastKey="";draw();});
    const nx=root.querySelector("[data-next]");if(nx)nx.onclick=()=>{send({k:"nx"},()=>M&&(M.ci!==i||M.ss!=="fb"));nx.disabled=true;};
    const sb=root.querySelector("[data-submit]");if(sb)sb.onclick=()=>{
      if(q.ty==="brain"){if(S.bp==="v"&&S.ph==="q"){L.sent=i;send({k:"vt",q:i,v:L.vs||[]},()=>S&&S.an&&S.an.includes(P.pid));lastKey="";draw();return;}
        const w=(L.w||[]).map(x=>x.trim()).filter(Boolean);if(!w.length)return;L.sent=i;send({k:"i",q:i,v:w},()=>S&&S.an&&S.an.includes(P.pid));lastKey="";draw();return;}
      let v=null;
      if(q.ty==="mc"||q.ty==="poll")v=L.sel;else if(q.ty==="puzzle")v=L.ord;else if(q.ty==="short"||q.ty==="open"){v=(L.txt||"").trim();if(!v)return;}
      else if(q.ty==="num"){v=q.sl?L.num:Number(String(L.txt||"").replace(",","."));if(!Number.isFinite(v))return;}
      else if(q.ty==="match")v=L.mt;else if(q.ty==="pin")v=L.pin;else if(q.ty==="cloud"){v=(L.w||[]).map(x=>x.trim()).filter(Boolean);if(!v.length)return;}
      if(v==null)return;submitAns(v);};
  }
  window.__phone={get S(){return S;},get M(){return M;},get QZ(){return QZ;}};
  draw();
}

   ========================================================= */
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function joinPage(){const r=$("phone");r.hidden=false;const l=guessLang();
