<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glücksrad · Modul-Wiederholung</title>
<style>
:root{--bg:#0f1730;--panel:#ffffff;--ink:#1d2330;--mut:#6b7385;--acc:#ffcc33;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 50% 40%,#22336b 0%,#0f1730 70%);overflow:hidden;user-select:none;-webkit-user-select:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;z-index:5}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
.top .sp{flex:1}
.top select,.top button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:8px 12px;background:#ffffff1f;color:#fff;cursor:pointer}
.top select option{color:#000}
.top button:hover{background:#ffffff33}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#wheel{touch-action:manipulation;cursor:pointer}
#pointer{position:fixed;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 4px #0008)}
#hub{position:fixed;z-index:4;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#fff 0%,#ffe27a 35%,#f5a300 100%);
 box-shadow:0 6px 18px #0007,inset 0 -4px 8px #0003;font-weight:900;color:#4a2a00;cursor:pointer;font-size:clamp(14px,2.2vw,24px);letter-spacing:1px}
#hub:active{transform:scale(.97)}
#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#ffffff88;font-size:13px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:20}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--panel);border-radius:18px;max-width:1100px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 20px 60px #000a}
.rhead{color:#fff;padding:18px 24px;border-radius:18px 18px 0 0;display:flex;gap:16px;align-items:center}
.rhead .code{font-size:18px;font-weight:800;background:#ffffff2e;border-radius:10px;padding:6px 12px;white-space:nowrap}
.rhead h2{margin:0;font-size:clamp(22px,3vw,34px);flex:1}
.rbody{padding:18px 24px 24px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:300px}
.typ{font-size:22px;font-weight:800;margin:4px 0 8px}
.btn{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b1{background:#1d2330;color:#fff}.b2{background:#eef1f6;color:#1d2330}.b3{background:var(--acc);color:#3a2800}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.kp{font-size:clamp(16px,1.6vw,20px);line-height:1.4;padding-left:22px}
.kp li{margin:7px 0}
.kp .tr{display:block;color:#4f5a70;font-size:.9em}
.kp .tr.ar{direction:rtl;text-align:right;font-family:"Geeza Pro","Noto Naskh Arabic","Arial",sans-serif;font-size:1em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tab{border:2px solid #d5dae4;background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:14px}
.tab.on{background:#1d2330;color:#fff;border-color:#1d2330}
.gl{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.gl td{border-bottom:1px solid #e3e6ee;padding:5px 6px}
.gl td.ar{direction:rtl;text-align:right}
.profi{background:#fff7e0;border:2px dashed #e0a100;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:16px}
details summary{cursor:pointer;font-weight:700}
ol.ab{font-size:16px;line-height:1.45;padding-left:22px;margin:6px 0}
/* Einstellungen */
.set{padding:20px 24px}
.set h2{margin:0 0 6px}
.lfbox{border:2px solid #e3e6ee;border-radius:12px;margin:10px 0;padding:8px 12px}
.lfbox h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lfbox h3 .dot{width:14px;height:14px;border-radius:50%}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 12px;margin-top:6px}
.mods label{display:flex;gap:6px;align-items:center;font-size:14px;padding:2px 0;cursor:pointer}
.mods .cnt{margin-left:auto;font-size:12px;color:var(--mut)}
.mini{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid #ccd;background:#fff;cursor:pointer}
.small{font-size:13px;color:var(--mut)}
/* Spiele */
#game .sheet{max-width:1300px;height:94vh;display:flex;flex-direction:column}
#gbody{flex:1;overflow:auto;padding:16px 24px;display:flex;flex-direction:column}
.big{font-size:clamp(26px,3.6vw,48px);font-weight:800;text-align:center;line-height:1.25;margin:auto 0;padding:10px}
.sol{font-size:clamp(20px,2.4vw,30px);text-align:center;margin:10px auto;max-width:1000px;padding:14px 18px;border-radius:14px}
.corners{display:grid;gap:10px;margin-bottom:10px}
.corner{border-radius:14px;color:#fff;font-weight:800;font-size:clamp(16px,1.8vw,24px);padding:14px;text-align:center;transition:.3s}
.corner.dim{opacity:.18}
.corner.hit{transform:scale(1.04);box-shadow:0 0 0 5px #ffcc33}
.timer{font-size:44px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.memgrid{display:grid;gap:10px;flex:1}
.mc{border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;padding:8px;cursor:pointer;font-size:clamp(13px,1.35vw,19px);min-height:70px;transition:.2s;background:#2b3a6b;color:#fff}
.mc.open{background:#fff;color:#1d2330;border:3px solid #2b3a6b}
.mc.done{background:#d9f2e2;color:#1d5b33;border:3px solid #43a047;cursor:default}
.score{display:flex;gap:14px;justify-content:center;margin:6px 0 10px}
.team{font-size:20px;font-weight:800;padding:8px 16px;border-radius:12px;background:#eef1f6;cursor:pointer}
.team.on{background:#ffcc33}
.seq{display:flex;flex-direction:column;gap:8px;max-width:1000px;margin:0 auto;width:100%}
.seqb{font:inherit;font-size:clamp(16px,1.7vw,22px);font-weight:700;padding:12px 16px;border-radius:12px;border:2px solid #cfd5e2;background:#fff;cursor:pointer;text-align:left}
.seqb.ok{background:#d9f2e2;border-color:#43a047}
.seqb.no{animation:sh .35s;background:#ffd9d9}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.peek{filter:blur(18px);transition:filter .15s}
.trx{font-size:.62em;font-weight:500;color:#2f4f8f;margin-top:4px}.corner .trx{color:#fff;opacity:.9}.trx.ar{direction:rtl}
.mc.open .trx{font-size:.8em}
.peek.show{filter:none}
</style>
</head>

ንተ ዓበየ፡ ጠለብ ይንኪ፡ ቅርቦት ድማ ይውስኽ።", "ic": "📈"}, {"de": "Gleichgewichtspreis: Angebotsmenge = Nachfragemenge (Schnittpunkt der Kurven).", "vi": "Giá cân bằng: lượng cung = lượng cầu (giao điểm hai đường).", "tr": "Denge fiyatı: arz miktarı = talep miktarı (eğrilerin kesişimi).", "ar": "سعر التوازن: كمية العرض = كمية الطلب (نقطة تقاطع المنحنيين).", "es": "Precio de equilibrio: cantidad ofrecida = cantidad demandada (cruce de las curvas).", "ru": "Равновесная цена: объём предложения = объём спроса (пересечение кривых).", "pt": "Preço de equilíbrio: quantidade oferecida = quantidade procurada (cruzamento das curvas).", "ti": "ዋጋ ሚዛን፡ በዝሒ ቅርቦት = በዝሒ ጠለብ (ምርኻብ መስመራት)።", "ic": "📈"}, {"de": "Preis zu hoch → Angebotsüberschuss; Preis zu niedrig → Nachfrageüberschuss.", "vi": "Giá quá cao → dư cung; giá quá thấp → dư cầu.", "tr": "Fiyat çok yüksek → arz fazlası; fiyat çok düşük → talep fazlası.", "ar": "سعر مرتفع جدًا ← فائض في العرض؛ سعر منخفض جدًا ← فائض في الطلب.", "es": "Precio demasiado alto → exceso de oferta; demasiado bajo → exceso de demanda.", "ru": "Цена слишком высокая → избыток предложения; слишком низкая → избыток спроса.", "pt": "Preço alto demais → excesso de oferta; baixo demais → excesso de procura.", "ti": "ዋጋ ኣዝዩ ልዑል → ትርፊ ቅርቦት፤ ኣዝዩ ትሑት → ትርፊ ጠለብ።", "ic": "📈"}, {"de": "Käufermarkt: Angebot > Nachfrage, Kunden sind stark. Verkäufermarkt: umgekehrt.", "vi": "Thị trường người mua: cung > cầu, khách hàng có lợi thế. Thị trường người bán: ngược lại.", "tr": "Alıcı piyasası: arz > talep, müşteri güçlüdür. Satıcı piyasası: tersi.", "ar": "سوق المشترين: العرض أكبر من الطلب والزبون أقوى. سوق البائعين: العكس.", "es": "Mercado de compradores: oferta > demanda, los clientes son fuertes. Mercado de vendedores: al revés.", "ru": "Рынок покупателя: предложение > спроса, клиенты сильнее. Рынок продавца: наоборот.", "pt": "Mercado do comprador: oferta > procura, clientes fortes. Mercado do vendedor: ao contrário.", "ti": "ዕዳጋ ዓዳጊ፡ ቅርቦት > ጠለብ፡ ዓማዊል ሓያላት እዮም። ዕዳጋ ሸያጢ፡ ብተገላቢጦሽ።" iel_Vertrauen_und_Kaufmotive_V26-2.pdf"}, "ct": {"ar": {"rationales Kaufmotiv (Verstand)": "دافع شراء عقلاني (العقل)", "emotionales Kaufmotiv (Gefühl)": "دافع شراء عاطفي (الشعور)", "„Der ist im Angebot? Super!“": "«عليه عرض؟ رائع!»", "„Damit bin ich schneller fertig.“": "«بهذا أنتهي أسرع.»", "„Hält der auch lange?“": "«هل يدوم طويلًا؟»", "„Ist der sparsam im Verbrauch?“": "«هل هو اقتصادي في الاستهلاك؟»", "„Ist das sicher für mein Kind?“": "«هل هو آمن لطفلي؟»", "„Den hat meine Freundin auch.“": "«صديقتي عندها نفسه.»", "„Damit sehen alle, dass ich Geschmack habe.“": "«بهذا يرى الجميع أن عندي ذوقًا.»", "„Der ist so süß, den will ich!“": "«إنه لطيف جدًا، أريده!»", "„Das neueste Modell muss ich haben!“": "«يجب أن أحصل على أحدث موديل!»", "„Da wird mein Nachbar neidisch.“": "«سيغار جاري.»"}, "vi": {"rationales Kaufmotiv (Verstand)": "động cơ mua lý trí (lý trí)", "emotionales Kaufmotiv (Gefühl)": "động cơ mua cảm xúc (cảm xúc)", "„Der ist im Angebot? Super!“": "'Đang giảm giá à? Tuyệt!'", "„Damit bin ich schneller fertig.“": "'Có cái này tôi làm nhanh hơn.'", "„Hält der auch lange?“": "'Cái này có bền không?'", "„Ist der sparsam im Verbrauch?“": "'Cái này có tiết kiệm không?'", "„Ist das sicher für mein Kind?“": "'Cái này có an toàn cho con tôi không?'", "„Den hat meine Freundin auch.“": "'Bạn tôi cũng có cái này.'", "„Damit sehen alle, dass ich Geschmack habe.“": "'Mọi người sẽ thấy tôi có gu.'", "„Der ist so süß, den will ich!“": "'Dễ thương quá, tôi muốn nó!'", "„Das neueste Modell muss ich haben!“": "'Tôi phải có mẫu mới nhất!'", "„Da wird mein Nachbar neidisch.“": "'Hàng xóm tôi sẽ ghen tị.'"}, "tr": {"rationales Kaufmotiv (Verstand)": "rasyonel satın alma güdüsü (akıl)", "emotionales Kaufmotiv (Gefühl)": "duygusal satın alma güdüsü (duygu)", "„Der ist im Angebot? Super!“": "'İndirimde mi? Süper!'", "„Damit bin ich schneller fertig.“": "'Bununla daha hızlı biterim.'", "„Hält der auch lange?“": "'Uzun dayanır mı?'", "„Ist der sparsam im Verbrauch?“": "'Az mı tüketiyor? .", "ar": "دع الزبون يُكمل كلامه، ابقَ هادئًا وموضوعيًا، ولا تعظه.", "ic": ""}, {"de": "Eine Beschwerde ist eine Chance: Wer gut reagiert, gewinnt einen Stammkunden.", "vi": "Lời phàn nàn là cơ hội: xử lý tốt sẽ có khách hàng thân thiết.", "tr": "Şikâyet bir fırsattır: İyi tepki veren sadık müşteri kazanır.", "ar": "الشكوى فرصة: من يتعامل جيدًا يكسب زبونًا دائمًا.", "ic": "📈"}, {"de": "Der Kunde muss sein Gesicht wahren können.", "vi": "Khách hàng phải được giữ thể diện.", "tr": "Müşteri itibarını koruyabilmelidir.", "ar": "يجب أن يتمكن الزبون من حفظ ماء وجهه.", "ic": ""}], "gl": [{"de": "Beschwerde", "vi": "lời phàn nàn", "tr": "şikâyet", "ar": "الشكوى", "ic": "📣"}, {"de": "Reklamation", "vi": "khiếu nại về hàng lỗi", "tr": "reklamasyon (ayıp bildirimi)", "ar": "المطالبة بسبب عيب", "ic": ""}, {"de": "sachlich bleiben", "vi": "giữ khách quan", "tr": "objektif kalmak", "ar": "البقاء موضوعيًا", "ic": ""}], "kpl": ["de", "ar", "vi", "tr"], "profi": "Spiele eine Szene mit allen vier Schritten vor und lass die Klasse die Schritte mitzählen.", "daten": {"szenen": [["Eine Kundin bringt einen eingelaufenen Pullover zurück und ist laut.", "Ausreden lassen, Verständnis zeigen, Pflegeetikett gemeinsam ansehen, Umtausch oder Ersatz anbieten."], ["Ein Kunde ruft: „Bei Ihnen muss man ja ewig warten!“", "Entschuldigen, sofort bedienen, sachlich bleiben, nicht rechtfertigen."], ["Die Kaffeemaschine ist nach drei Wochen kaputt.", "Ernst nehmen, Kassenbon zeigen lassen, Reparatur oder Umtausch anbieten, für die Geduld bedanken."], ["„Am Regal stand ein niedrigerer Preis als an der Kasse!“", "Prüfen, Regal ansehen, Preis klären und korrigieren, für den Hinweis danken."], ["Ein Kunde beschimpft dich persönlich.", "Ruhig bleiben, nicht persönlich nehmen, sachlich Grenze setzen, Vorgesetzte holen."], ["Eine Bestellung kommt zum zweiten Mal zu spät.", "Entschuldigen, Ursache klären, festen neuen Termin nennen, kleine Wiedergutmachung anbieten."]]}, "pdf": "LF2_Verkaufsgespraeche_kundenori 3_Kunden_im_Servicebereich_Kasse_betreuen/LF3_M05_Szenen-Karussell_Rollenspiel_Besondere_Situationen_an_der_Kasse_V26-2.pdf"}, "ct": {"ar": {"Ein junger Mann will Wodka kaufen und sieht aus wie 17.": "شاب يريد شراء فودكا ويبدو أن عمره 17 سنة.", "Ein 16-Jähriger kauft eine Flasche Bier.": "شاب عمره 16 سنة يشتري زجاجة بيرة.", "Ein Artikel hat keinen Preis und lässt sich nicht scannen.": "صنف بلا سعر ولا يمكن مسحه.", "Die Karte des Kunden wird abgelehnt.": "بطاقة الزبون مرفوضة.", "Eine ältere Kundin packt sehr langsam ein.": "زبونة مسنّة تعبّئ أغراضها ببطء شديد.", "Du siehst, wie ein Kunde Ware in die Jacke steckt.": "ترى زبونًا يضع سلعة في سترته.", "Nach drei Stunden Kasse hast du Rückenschmerzen.": "بعد ثلاث ساعات على الصندوق يؤلمك ظهرك.", "Ein Kunde will mit einem 500-€-Schein 3,50 € bezahlen.": "زبون يريد دفع 3,50 € بورقة 500 €."}, "vi": {"Ein junger Mann will Wodka kaufen und sieht aus wie 17.": "Một thanh niên muốn mua vodka và trông như 17 tuổi.", "Ein 16-Jähriger kauft eine Flasche Bier.": "Một bạn 16 tuổi mua một chai bia.", "Ein Artikel hat keinen Preis und lässt sich nicht scannen.": "Một món hàng không có giá và không quét được.", "Die Karte des Kunden wird abgelehnt.": "Thẻ của khách bị từ chối.", "Eine ältere Kundin packt sehr langsam ein.": "Một khách lớn tuổi xếp đồ rất chậm.", "Du siehst, wie ein Kunde Ware in die Jacke steckt.": "Bạn thấy một khách nhét hàng vào áo khoác.", "Nach drei Stunden Kasse hast du Rückenschmerzen.": "Sau ba giờ đứng quầy bạn bị đau lưng.", "Ein Kunde will mit einem 500-€-Schein 3,50 € bezahlen.": "Một khách muốn trả 3,50 € bằng tờ 500 €."}, "tr": {"Ein junger Mann will Wodka kaufen und sieht aus wie 17.": "Bir genç votka almak istiyor ve 17 yaşında gibi görünüyor.", "Ein 16-Jähriger kauft eine Flasche Bier.": "16 yaşında biri bir şişe bira alıyor.", "Ein Artikel hat keinen Preis und lässt sich nicht scannen.": "Bir ürünün fiyatı yok ve okutulamıyor.", "Die Karte des Kunden wird abgelehnt.": "Müşterinin kartı reddedildi.", "Eine ältere Kundin packt sehr langsam ein.": "Yaşlı bir müşteri çok yavaş paketliyor.", "Du siehst, wie ein Kunde Ware in die Jacke steckt.": "Bir müşterinin ürünü montunun içine koyduğunu görüyorsun.", "Nach drei Stunden Kasse hast du Rückenschmerzen.": "Üç saat kasadan sonra sırtın ağrıyor.", "Ein Kunde will mit einem 500-€-Schein 3,50 € bezahlen.": "Bir müşteri 3,50 €'yu 500 €'luk banknotla ödemek istiyor."}}, "digital": "Szene ziehen"}, {"area": "3", "kurz": "LF3", "nr": 6, "lab": "M6", "titel": "Kassenabrechnung", "typ": "rechnen", "typname": "Rechen-Staffel", "icon": "🧮", "dauer": 10, "ablauf": ["5 Teams à 4. Jedes Team bekommt Aufgabe 1 (oder digital: „Rechenduell“).", "Gelöst? Rechenweg bei der Lehrkraft zeigen und die nächste Aufgabe holen.", "Welches Team ist zuerst durch? Immer mit Rechenweg und Antwortsatz."], "druck": "20 Schüler = 5 Teams: Aufgabenbogen 5× drucken.", "kp": [{"de": "Tageslosung = alle Bareinnahmen eines Tages.", "vi": "Doanh thu tiền mặt trong ngày = tất cả tiền mặt thu được trong ngày.", "tr": "Günlük nakit hasılat = bir günün tüm nakit gelirleri.", "ar": "الإيراد النقدي اليومي = كل المقبوضات النقدية في اليوم.", "ic": "💶"}, {"de": "Tagesumsatz = Bareinnahmen + Kartenzahlungen.", "vi": "Doanh thu trong ngày = tiền mặt + thanh toán thẻ.", "tr": "Günlük ciro = nakit + kartla ödemeler.", "ar": "المبيعات اليومية = النقد + مدفوعات البطاقات.", "ic": "📈"}, {"de": "Kassenbericht: Schlussbestand + Abschöpfungen und Ausgaben − Anfangsbestand = Tageslosung.", "vi": "Báo cáo quỹ: tồn cuối + tiền rút ra và chi − tồn đầu = doanh thu tiền mặt.", "tr": "Kasa raporu: kapanış + çekilen para ve giderler − açılış = günlük nakit hasılat.", "ar": "تقرير الصندوق: الرصيد الختامي + المسحوبات والمصروفات − الرصيد الافتتاحي = الإيراد النقدي.", "ic": "🧾"}, {"de": "Ist > Soll = Überschuss; Ist < Soll = Fehlbetrag.", "vi": "Thực tế > sổ sách = thừa; thực tế < sổ sách = thiếu.", "tr": "Gerçek > olması gereken = fazla; gerçek < olması gereken = eksik.", "ar": "الفعلي أكبر من المطلوب = فائض؛ الفعلي أقل = عجز.", "ic": ""}], "gl": [{"de": "Tageslosung", "vi": "doanh thu tiền mặt trong ngày", "tr": "günlük nakit hasılat", "ar": "الإيراد النقدي اليومي", "ic": ""}, {"de": "Kassendifferenz", "vi": "chênh lệch quỹ", "tr": "kasa farkı", "ar": "فرق الصندوق", "ic": "🧾"}, {"de": "Fehlbetrag", "vi": "số tiền thiếu", "tr": "eksik tutar", "ar": "العجز", "ic": ""}], "kpl": ["de", "ar", "vi", "tr"], "profi": "Stelle einen vollständigen Kassenbericht mit eigenen Zahlen auf und lass ihn von der Nachbarin prüfen.", "daten": {"aufgaben": [["Kassenschlussbestand 1.240 €, Abschöpfungen 600 €, Wechselgeld am Morgen 200 €. Wie hoch ist die Tageslosung?", "1.240 + 600 − 200 = 1.640 €"], ["Tageslosung 1.640 €, Kartenzahlungen 2.360 €. Wie hoch ist der Tagesumsatz?", "1.640 + 2.360 = 4.000 €"], ["Soll-Bestand 1.520,00 €, gezählt 1.505,00 €. Was liegt vor?", "Fehlbetrag von 15,00 € (Ist < Soll)"], ["Soll-Bestand 890,40 €, gezählt 892,40 €. Was liegt vor?", "Überschuss von 2,00 € (Ist > Soll)"], ["Wechselgeld 150 €, Bareinnahmen laut Kasse 980 €, Abschöpfung 500 €. Soll-Bestand?", "150 + 980 − 500 = 630 €"], ["Nenne zwei Ursachen für eine Kassendifferenz.", "z. B. falsch herausgegeben, Storno vergessen, Falschgeld, Tippfehler"]]}, "pdf": "LF3_Kunden_im_Servicebereich_Kasse_betreuen/LF3_M06_Rechen-Staffel_Kassenabrechnung.pdf", "klassen": {"V26/2": "Klassensaetze_V26-2_DE-VI-AR-TR/LF3_Kunden_im_Servicebereich_Kasse_betreuen/LF3_M06_Rechen-Staffel_Kassenabrechnung_V26-2.pdf"}, "ct": {"ar": {"Kassenschlussbestand 1.240 €, Abschöpfungen 600 €, Wechselgeld am Morgen 200 €. Wie hoch ist die Tageslosung?": "الرصيد الختامي 1.240 €، المسحوبات 600 €، الفكة صباحًا 200 €. كم الإيراد النقدي اليومي؟", "Tageslosung 1.640 €, Kartenzahlungen 2.360 €. Wie hoch ist der Tagesumsatz?": "الإيراد النقدي 1.640 €، مدفوعات البطاقات 2.360 €. كم المبيعات اليومية؟", "Soll-Bestand 1.520,00 €, gezählt 1.505,00 €. Was liegt vor?": "الرصيد المطلوب 1.520,00 €، المعدود 1.505,00 €. ما الحالة؟", "Soll-Bestand 890,40 €, gezählt 892,40 €. Was liegt vor?": "الرصيد المطلوب 890,40 €، المعدود 892,40 €. ما الحالة؟", "Wechselgeld 150 €, Bareinnahmen laut Kasse 980 €, Abschöpfung 500 €. Soll-Bestand?": "الفكة 150 €، المقبوضات النقدية حسب الصندوق 980 €، المسحوب 500 €. الرصيد المطلوب؟", "Nenne zwei Ursachen für eine Kassendifferenz.": "اذكر سببين لفرق الصندوق."}, "vi": {"Kassenschlussbestand 1.240 €, Abschöpfungen 600 €, Wechselgeld am Morgen 200 €. Wie hoch ist die Tageslosung?": "Tồn cuối 1.240 €, rút ra 600 €, tiền lẻ buổi sáng 200 €. Doanh thu tiền mặt là bao nhiêu?", "Tageslosung 1.640 €, Kartenzahlungen 2.360 €. Wie hoch ist der Tagesumsatz?": "Doanh thu tiền mặt 1.640 €, thanh toán thẻ 2.360 €. Doanh thu trong ngày?", "Soll-Bestand 1.520,00 €, gezählt 1.505,00 €. Was liegt vor?": "Số phải có 1.520,00 €, đếm được 1.505,00 €. Kết quả là gì?", "Soll-Bestand 890,40 €, gezählt 892,40 €. Was liegt vor?": "Số phải có 890,40 €, đếm được 892,40 €. Kết quả là gì?", "Wechselgeld 150 €, Bareinnahmen laut Kasse 980 €, Abschöpfung 500 €. Soll-Bestand?": "Tiền lẻ 150 €, thu tiền mặt theo máy 980 €, rút ra 500 €. Số phải có?", "Nenne zwei Ursachen für eine Kassendifferenz.": "Nêu hai nguyên nhân gây chênh lệch quỹ."}, "tr": {"Kassenschlussbestand 1.240 €, Abschöpfungen 600 €, Wechselgeld am Morgen 200 €. Wie hoch ist die Tageslosung?": "Kapanış bakiyesi 1.240 €, çekilen para 600 €, sabah bozuk para 200 €. Günlük nakit hasılat ne kadar?", "Tageslosung 1.640 €, Kartenzahlungen 2.360 €. Wie hoch ist der Tagesumsatz?": "Günlük nakit hasılat 1.640 €, kartla ödemeler 2.360 €. Günlük ciro ne kadar?", "Soll-Bestand 1.520,00 €, gezählt 1.505,00 €. Was liegt vor?": "Olması gereken 1.520,00 €, sayılan 1.505,00 €. Durum nedir?", "Soll-Bestand 890,40 €, gezählt 892,40 €. Was liegt vor?": "Olması gereken 890,40 €, sayılan 892,40 €. Durum nedir?", "Wechselgeld 150 €, Bareinnahmen laut Kasse 980 €, Abschöpfung 500 €. Soll-Bestand?": "Bozuk para 150 €, kasaya göre nakit gelir 980 €, çekilen 500 ние: покупательница ищет что-то в проходе.", "Vollbedienung: Ein Paar betrachtet beim Juwelier Ringe.": "полное обслуживание: пара рассматривает кольца у ювелира.", "SB-Kasse: Ein Kunde kommt mit dem Scanner nicht klar.": "касса самообслуживания: покупатель не справляется со сканером."}, "pt": {"Vollbedienung: Eine Kundin steht an der Käsetheke.": "atendimento: uma cliente está no balcão do queijo.", "Vorwahl: Ein Kunde betrachtet seit einer Minute eine Jacke.": "pré-seleção: um cliente olha para um casaco há um minuto.", "Vorwahl: Ein Kunde kommt gerade in den Laden.": "pré-seleção: um cliente acabou de entrar na loja.", "Selbstbedienung: Eine Kundin läuft suchend durch den Gang.": "self-service: uma cliente procura algo no corredor.", "Vollbedienung: Ein Paar betrachtet beim Juwelier Ringe.": "atendimento: um casal vê anéis na joalharia.", "SB-Kasse: Ein Kunde kommt mit dem Scanner nicht klar.": "caixa self-service: um cliente não consegue usar o leitor."}, "ti": {"Vollbedienung: Eine Kundin steht an der Käsetheke.": "ምሉእ ኣገልግሎት፡ ሓንቲ ዓሚል ኣብ መሸጣ ፎርማጆ ደው ኢላ ኣላ።", "Vorwahl: Ein Kunde betrachtet seit einer Minute eine Jacke.": "ቅድመ ምርጫ፡ ሓደ ዓሚል ካብ ደቒቕ ጃኬት ይርኢ ኣሎ።", "Vorwahl: Ein Kunde kommt gerade in den Laden.": "ቅድመ ምርጫ፡ ሓደ ዓሚል ሕጂ ናብ ድኳን ኣትዩ።", "Selbstbedienung: Eine Kundin läuft suchend durch den Gang.": "ባዕልኻ ምግልጋል፡ ሓንቲ ዓሚል ኣብ መንገዲ ትደሊ ኣላ።", "Vollbedienung: Ein Paar betrachtet beim Juwelier Ringe.": "ምሉእ ኣገልግሎት፡ ክልተ ሰባት ኣብ ወርቂ ድኳን ቀለበታት ይርእዩ።", "SB-Kasse: Ein Kunde kommt mit dem Scanner nicht klar.": "ካሳ ባዕልኻ፡ ሓደ ዓሚል ስካነር ክጥቀም ኣይክኣለን።"}, "ar": {"Vollbedienung: Eine Kundin steht an der Käsetheke.": "خدمة كاملة: زبونة تقف عند منضدة الجبن.", "Vorwahl: Ein Kunde betrachtet seit einer Minute eine Jacke.": "اختيار مسبق: زبون ينظر إلى سترة منذ دقيقة.", "Vorwahl: Ein Kunde kommt gerade in den Laden.": "اختيار مسبق: زبون دخل المتجر للتو.", "Selbstbedienung: Eine Kundin läuft suchend durch den Gang.": "خدمة ذاتية: زبونة تبحث في الممر.", "Vollbedienung: Ein Paar betrachtet be erson eine Karte).", "kp": [{"de": "Verkaufsfläche: Warenfläche, Kundenfläche und übrige Verkaufsfläche.", "vi": "Diện tích bán hàng: diện tích hàng, diện tích khách đi lại và diện tích khác.", "tr": "Satış alanı: ürün alanı, müşteri alanı ve diğer satış alanı.", "ar": "مساحة البيع: مساحة السلع، مساحة الزبائن، ومساحة البيع الأخرى.", "es": "Superficie de venta: superficie de productos, superficie para clientes y resto.", "ru": "Торговая площадь: площадь товаров, площадь для покупателей и прочая площадь.", "pt": "Área de venda: área de produtos, área de clientes e restante área.", "ti": "ቦታ መሸጣ፡ ቦታ ኣቕሑ፡ ቦታ ዓማዊልን ካልእ ቦታን።", "ic": "🛍️"}, {"de": "Wegeführung: Loop (Rundlauf), Zwangsumlauf, Individualumlauf.", "vi": "Dẫn lối: đường vòng, lối đi bắt buộc, lối đi tự do.", "tr": "Yol yönlendirme: döngü (tur), zorunlu tur, serbest dolaşım.", "ar": "توجيه الممرات: المسار الدائري، المسار الإجباري، المسار الحر.", "es": "Recorrido: circuito (loop), recorrido obligatorio, recorrido libre.", "ru": "Направление движения: круговой маршрут (loop), принудительный маршрут, свободный маршрут.", "pt": "Percurso: circuito (loop), percurso obrigatório, percurso livre.", "ti": "መንገዲ ምምራሕ፡ ዙርያ (Loop)፡ ግዴታዊ መንገዲ፡ ናጻ መንገዲ።", "ic": "♻️"}, {"de": "Gute Ladengestaltung: breite Gänge, keine Sackgassen, klare Beschilderung, barrierefrei.", "vi": "Thiết kế tốt: lối đi rộng, không có ngõ cụt, biển chỉ dẫn rõ, không rào cản.", "tr": "İyi mağaza düzeni: geniş koridor, çıkmaz yok, net tabela, engelsiz.", "ar": "تصميم جيد: ممرات واسعة، لا طرق مسدودة، لافتات واضحة، دون عوائق.", "es": "Buen diseño: pasillos anchos, sin callejones sin salida, señalización clara, sin barreras.", "ru": "Хорошая планировка: широкие проходы, нет тупиков, понятные указатели, без барьеров.", "pt": "Boa disposição: corredores largos, sem becos sem saída, sinalização clara, sem barreiras.", "ti": "ጽቡቕ ኣሰራርዓ፡ ሰፊሕ መንገዲ፡ መዕጸዊ መንገዲ የለን፡ ንጹር ምልክታት፡ ዕንቅፋት የብሉን።", "ic": "🌑"}, {"de": "Stopper und Faszinationspunkte bremsen Kunden und lenken as de estantería: zona de estirarse, de la vista, de agarre, de agacharse.", "ru": "Четыре зоны полки: зона потягивания, зона глаз, зона руки, зона наклона.", "pt": "Quatro zonas da prateleira: zona de esticar, zona da vista, zona de alcance, zona de baixar.", "ti": "ኣርባዕተ ቦታታት መደርደሪ፡ ናይ ምዝርጋሕ፡ ናይ ዓይኒ፡ ናይ ኢድ፡ ናይ ምድናን ቦታ።", "ic": "🗄️"}, {"de": "Sicht- und Greifzone sind verkaufsstark, Reck- und Bückzone verkaufsschwach.", "vi": "Vùng tầm mắt và tầm tay bán mạnh, vùng với tay và cúi người bán yếu.", "tr": "Göz ve kavrama bölgesi güçlü, uzanma ve eğilme bölgesi zayıftır.", "ar": "منطقتا النظر والإمساك قويتان في البيع، ومنطقتا المدّ والانحناء ضعيفتان.", "es": "Las zonas de la vista y de agarre venden bien; las de estirarse y agacharse, mal.", "ru": "Зоны глаз и руки продают хорошо, зоны потягивания и наклона – плохо.", "pt": "As zonas da vista e de alcance vendem bem; as de esticar e baixar vendem mal.", "ti": "ናይ ዓይንን ኢድን ቦታታት ጽቡቕ ይሸጡ፡ ናይ ምዝርጋሕን ምድናንን ድኹም።", "ic": "🛍️"}, {"de": "In die Sichtzone gehört Ware mit hoher Gewinnspanne, in die Bückzone schwere Ware.", "vi": "Vùng tầm mắt dành cho hàng lãi cao, vùng cúi người dành cho hàng nặng.", "tr": "Göz bölgesine kâr marjı yüksek ürün, eğilme bölgesine ağır ürün konur.", "ar": "في منطقة النظر توضع السلع ذات الهامش العالي، وفي منطقة الانحناء السلع الثقيلة.", "es": "En la zona de la vista van productos con mucho margen; en la de agacharse, los pesados.", "ru": "В зону глаз – товар с высокой наценкой, в зону наклона – тяжёлый товар.", "pt": "Na zona da vista ficam produtos com margem alta; na de baixar, os pesados.", "ti": "ኣብ ቦታ ዓይኒ ልዑል ረብሓ ዘለዎ ኣቕሓ፡ ኣብ ቦታ ምድናን ከቢድ ኣቕሓ።", "ic": "📈"}, {"de": "Platzierung: Band (waagerecht), Block (senkrecht), Kreuzblock (Mischung).", "vi": "Cách xếp: theo dải (ngang), theo khối (dọc), khối chéo (kết hợp).", "tr": "Yerleştirme: bant (yatay), blok (dikey), çapraz blok (karışık).", "ar": "طرق الترتيب: شريطي (أفقي)، كتلي (عمودي)، كتلي متقاطع (مزيج).", "es": "Colocación: en franja (horizontal), e ة.", "es": "Datos obligatorios en alimentos: nombre, ingredientes, alérgenos, cantidad, fecha, valores nutricionales.", "ru": "Обязательные данные на продуктах: название, состав, аллергены, количество, срок годности, пищевая ценность.", "pt": "Dados obrigatórios nos alimentos: nome, ingredientes, alergénios, quantidade, data, valores nutricionais.", "ti": "ግዴታዊ ሓበሬታ ኣብ መግቢ፡ ስም፡ ትሕዝቶ፡ ኣለርጂ ዘምጽኡ፡ በዝሒ፡ ዕለት፡ ዋጋ ምግቢ።", "ic": "💡"}, {"de": "GTIN-13: Länderpräfix, Betriebsnummer, Artikelnummer, Prüfziffer.", "vi": "GTIN-13: mã quốc gia, mã doanh nghiệp, mã sản phẩm, số kiểm tra.", "tr": "GTIN-13: ülke kodu, işletme numarası, ürün numarası, kontrol hanesi.", "ar": "GTIN-13: رمز البلد، رقم الشركة، رقم الصنف، رقم التحقق.", "es": "GTIN-13: prefijo del país, número de empresa, número de artículo, dígito de control.", "ru": "GTIN-13: префикс страны, номер предприятия, номер артикула, контрольная цифра.", "pt": "GTIN-13: prefixo do país, número da empresa, número do artigo, dígito de controlo.", "ti": "GTIN-13፡ ቁጽሪ ሃገር፡ ቁጽሪ ትካል፡ ቁጽሪ ኣቕሓ፡ ናይ ምርግጋጽ ቁጽሪ።", "ic": "📷"}, {"de": "Gütezeichen = Qualität, Umweltzeichen = Umwelt, Prüfzeichen = Sicherheit.", "vi": "Dấu chất lượng = chất lượng, nhãn môi trường = môi trường, dấu kiểm định = an toàn.", "tr": "Kalite işareti = kalite, çevre etiketi = çevre, test işareti = güvenlik.", "ar": "علامة الجودة = الجودة، علامة البيئة = البيئة، علامة الفحص = السلامة.", "es": "Sello de calidad = calidad, etiqueta ecológica = medio ambiente, sello de control = seguridad.", "ru": "Знак качества = качество, экознак = экология, знак проверки = безопасность.", "pt": "Selo de qualidade = qualidade, rótulo ecológico = ambiente, selo de teste = segurança.", "ti": "ምልክት ጽሬት = ጽሬት፡ ምልክት ከባቢ = ከባቢ፡ ምልክት ፈተና = ውሕስነት።", "ic": "🌍"}], "gl": [{"de": "Mindesthaltbarkeitsdatum", "vi": "hạn sử dụng tối thiểu", "tr": "tavsiye edilen tüketim tarihi", "ar": "تاريخ الصلاحية الأدنى", "es": "fecha de consumo preferente", "ru": "срок минимальной годности", "pt": "data de consumo p s": "El plan publicitario fija qué, para quién, cuándo, dónde, con qué y con cuánto dinero se anuncia.", "ru": "Рекламный план определяет: что, для кого, когда, где, чем и за какие деньги рекламировать.", "pt": "O plano publicitário define: o quê, para quem, quando, onde, com quê e com quanto dinheiro.", "ti": "መደብ ምልላይ ይውስን፡ እንታይ፡ ንመን፡ መዓስ፡ ኣበይ፡ ብምንታይን ብኽንደይ ገንዘብን።", "ic": "📢"}, {"de": "Werbeetat = Werbebudget, das zur Verfügung steht.", "vi": "Ngân sách quảng cáo = số tiền dành cho quảng cáo.", "tr": "Reklam bütçesi = ayrılan para.", "ar": "ميزانية الإعلان = المال المتاح للإعلان.", "es": "Presupuesto publicitario = dinero disponible para la publicidad.", "ru": "Рекламный бюджет = деньги, доступные для рекламы.", "pt": "Orçamento publicitário = dinheiro disponível para a publicidade.", "ti": "በጀት ምልላይ = ንምልላይ ዘሎ ገንዘብ።", "ic": "💰"}, {"de": "Streuzeit = wann; Streugebiet = wo; Streukreis = wer.", "vi": "Thời gian = khi nào; khu vực = ở đâu; đối tượng = ai.", "tr": "Yayın zamanı = ne zaman; yayın bölgesi = nerede; hedef çevre = kim.", "ar": "زمن النشر = متى؛ منطقة النشر = أين؛ دائرة الاستهداف = من.", "es": "Tiempo de difusión = cuándo; zona de difusión = dónde; público de difusión = a quién.", "ru": "Время рекламы = когда; территория = где; круг адресатов = кто.", "pt": "Período de difusão = quando; zona de difusão = onde; público de difusão = quem.", "ti": "ግዜ ምዝርጋሕ = መዓስ፤ ቦታ ምዝርጋሕ = ኣበይ፤ ክቢ ምዝርጋሕ = መን።", "ic": "⏰"}, {"de": "Ein Werbeplan wird begründet – jede Entscheidung passt zur Zielgruppe.", "vi": "Mỗi quyết định trong kế hoạch phải có lý do và phù hợp với nhóm mục tiêu.", "tr": "Planın her kararı gerekçelendirilir ve hedef kitleye uyar.", "ar": "تُعلَّل كل قرارات الخطة وتناسب الفئة المستهدفة.", "es": "Un plan publicitario se justifica – cada decisión encaja con el público objetivo.", "ru": "Рекламный план обосновывается – каждое решение подходит целевой группе.", "pt": "Um plano publicitário é justificado – cada decisão serve o público-alvo.", "ti": "መደብ ምልላይ ይ ة، العروض الطُّعم، التصرفات العدوانية.", "es": "Prohibido: publicidad engañosa, precios inflados, ofertas gancho, prácticas agresivas.", "ru": "Запрещено: вводящая в заблуждение реклама, завышенные «старые» цены, приманки, агрессивные действия.", "pt": "Proibido: publicidade enganosa, preços inflacionados, ofertas isco, práticas agressivas.", "ti": "ክልኩል፡ ዘጣልም ምልላይ፡ ሓሶት ዋጋታት፡ መጥመዲ ቅናሽ፡ ተገዳዳሪ ተግባራት።", "ic": "📊"}, {"de": "Werbung per E-Mail oder Telefon nur mit Einwilligung – sonst unzumutbare Belästigung.", "vi": "Quảng cáo qua email hoặc điện thoại chỉ khi được đồng ý – nếu không là quấy rối.", "tr": "E-posta veya telefonla reklam yalnızca izinle – aksi halde rahatsız etmedir.", "ar": "الإعلان بالبريد الإلكتروني أو الهاتف بالموافقة فقط – وإلا فهو إزعاج غير مقبول.", "es": "Publicidad por correo electrónico o teléfono solo con consentimiento – si no, es acoso.", "ru": "Реклама по e-mail или телефону – только с согласия, иначе это недопустимое приставание.", "pt": "Publicidade por e-mail ou telefone só com consentimento – senão é assédio.", "ti": "ምልላይ ብኢመይል ወይ ብስልኪ ብፍቓድ ጥራይ – እንተዘይኮይኑ ዘይቅቡል ምርባሽ እዩ።", "ic": "📢"}, {"de": "30-Tage-Regel: Vergleichspreis = niedrigster Preis der letzten 30 Tage.", "vi": "Quy tắc 30 ngày: giá so sánh = giá thấp nhất trong 30 ngày qua.", "tr": "30 gün kuralı: karşılaştırma fiyatı = son 30 günün en düşük fiyatı.", "ar": "قاعدة الثلاثين يومًا: سعر المقارنة = أدنى سعر خلال آخر 30 يومًا.", "es": "Regla de los 30 días: precio de referencia = precio más bajo de los últimos 30 días.", "ru": "Правило 30 дней: цена для сравнения = самая низкая цена за последние 30 дней.", "pt": "Regra dos 30 dias: preço de referência = preço mais baixo dos últimos 30 dias.", "ti": "ሕጊ 30 መዓልቲ፡ ዋጋ ንምንጽጻር = ኣብ 30 መዓልቲ ዝተሓተ ዋጋ።", "ic": "🏷️"}], "gl": [{"de": "unlauter", "vi": "không lành mạnh", "tr": "haksız", "ar": "غير نزيه", "es": "desleal", "ru": "недобросовестный", "pt": "desleal", "ti": "ዘይፍትሓዊ", "ic": ""}, {"de": "irreführend", "vi": "gây hiểu lầm", "tr": "yanıltıcı", "ar": "مضلّل", "es": "engañoso", "ru": "вводящий в заблуждение", "pt": "enganoso", "ti": "ዘጣልም", "ic": ""}, {"de": "Lockangebot", "vi": "khuyến mãi mồi", "tr": "tuzak teklif", "ar": "عرض طُعم", "es": "oferta gancho", "ru": "приманка", "pt": "oferta isco", "ti": "መጥመዲ ቅናሽ", "ic": "📊"}], "kpl": ["de", "ar", "vi", "tr", "ru", "es", "pt", "ti"], "profi": "Prüfe einen Prospekt: Findest du eine Preissenkung? Ist der Vergleichspreis nach der 30-Tage-Regel korrekt? Begründe.", "daten": {"labels": ["erlaubt", "verboten"], "aussagen": [["Ein Händler verschickt Werbe-E-Mails ohne Einwilligung.", false, "Unzumutbare Belästigung – Einwilligung nötig."], ["„Statt 199 € nur 99 €“ – der Artikel kostete nie 199 €.", false, "Mondpreis – irreführende Werbung."], ["Ein beworbenes Angebot ist nach einer Stunde ausverkauft, obwohl es eine Woche gelten sollte.", false, "Lockangebot – zu geringe Bevorratung."], ["Vergleichende Werbung, die sachlich und nachprüfbar ist.", true, ""], ["Bei einer Preissenkung als Vergleichspreis den niedrigsten Preis der letzten 30 Tage angeben.", true, "§ 11 PAngV"], ["Ein Verkäufer drängt eine ältere Kundin, sofort zu unterschreiben.", false, "Aggressive Handlung – Ausnutzen von Unerfahrenheit."], ["Mit „Bio“ werben, obwohl die Ware nicht bio ist.", false, "Irreführende Werbung."], ["Den Mitbewerber in der Werbung verunglimpfen.", false, "Herabsetzung von Mitbewerbern ist unlauter."]]}, "pdf": "LF5_Werben_und_den_Verkauf_foerdern/LF5_M08_Aufstehen_oder_sitzen_bleiben_Das_UWG.pdf", "klassen": {"V26/2": "Klassensaetze_V26-2_DE-VI-AR-TR/LF5_Werben_und_den_Verkauf_foerdern/LF5_M08_Aufstehen_oder_sitzen_bleiben_Das_UWG_V26-2.pdf", "V26/1": "Klassensaetze_V26-1_DE-TI-ES-RU-PT/LF5_Werben_und_den_Verkauf_foerdern/LF5_M08_Aufstehen_oder_sitzen_bleiben_Das_UWG_V26-1.pdf"}, "ct": {}, "digital": "Aufstehen/Sitzen"}, {"area": "5", "kurz": "LF5", "nr": 9, "lab": "M9", "titel": "Verpackung und Verpackungsgesetz", "typ": "memory", "typname": "Memory", "icon": "🃏", "dauer": 8, "ablauf": ["4er-Gruppen – Karten gemischt verdeckt auslegen (oder digital an der Tafel spielen).", "Reihum zwei Karten aufdecken. Passt das Paar, darf man es behalten, wenn man es in einem Satz erklärt.", "Wer die meisten Paare hat, gewinnt."], "druck": "20 Schüler = 5 Gruppen: Kartenbogen 5× drucken.", "kp": [{"de": "Fünf Aufgaben: Schutz, Information, Erleichterung des Gebrauchs, Service, Werbemittel.", "vi": "Năm nhiệm vụ: bảo vệ, thông tin, giúp sử dụng dễ dàng, dịch vụ, phương tiện quảng cáo.", "tr": "Beş görev: koruma, bilgi, kullanımı kolaylaştırma, hizmet, reklam aracı.", "ar": "خمس مهام: الحماية، المعلومات، تسهيل الاستعمال، الخدمة، وسيلة إعلان.", "es": "Cinco funciones: protección, información, facilitar el uso, servicio, publicidad.", "ru": "Пять функций: защита, информация, удобство использования, сервис, реклама.", "pt": "Cinco funções: proteção, informação, facilitar o uso, serviço, publicidade.", "ti": "ሓሙሽተ ዕማማት፡ ምሕላው፡ ሓበሬታ፡ ምጥቃም ምቅላል፡ ኣገልግሎት፡ ምልላይ።", "ic": "🦺"}, {"de": "Fünf Arten: Transport-, Um-, Verkaufs-, Einweg- und Mehrwegverpackung.", "vi": "Năm loại: bao bì vận chuyển, bao bì ngoài, bao bì bán hàng, bao bì dùng một lần, bao bì tái sử dụng.", "tr": "Beş tür: nakliye, dış, satış, tek kullanımlık ve çok kullanımlık ambalaj.", "ar": "خمسة أنواع: عبوة النقل، العبوة الخارجية، عبوة البيع، العبوة لمرة واحدة، والعبوة المرتجعة.", "es": "Cinco tipos: envase de transporte, sobreembalaje, envase de venta, de un solo uso y retornable.", "ru": "Пять видов: транспортная, внешняя, торговая, одноразовая и многоразовая упаковка.", "pt": "Cinco tipos: embalagem de transporte, sobre-embalagem, embalagem de venda, descartável e retornável.", "ti": "ሓሙሽተ ዓይነታት፡ ናይ መጓዓዝያ፡ ደገ፡ ናይ መሸጣ፡ ሓደ ግዜ ዝጥቀሙሉ፡ ተደጋጋሚ መዕሸጊ።", "ic": "♻️"}, {"de": "Verpackungsgesetz: registrieren, an einem System beteiligen, Mengen melden.", "vi": "Luật bao bì: đăng ký, tham gia hệ thống thu gom, báo cáo số lượng.", "tr": "Ambalaj yasası: kayıt ol, bir sisteme katıl, miktarları bildir.", "a function suspenseStart(dur){ if(ST.mute) return; const a=ac(); const t=a.currentTime; NB = NB || noiseBuf();
  // Trommelwirbel
  const n=a.createBufferSource(); n.buffer=NB; n.loop=true; const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1800; bp.Q.value=.7;
  const ng=a.createGain(); ng.gain.value=0; const lfo=a.createOscillator(); lfo.frequency.value=16; const lg=a.createGain(); lg.gain.value=.05;
  lfo.connect(lg); lg.connect(ng.gain); n.connect(bp); bp.connect(ng); ng.connect(master);
  const base=a.createConstantSource?a.createConstantSource():null; if(base){ base.offset.setValueAtTime(.02,t); base.offset.linearRampToValueAtTime(.12,t+dur); base.connect(ng.gain); base.start(t);}
  // aufsteigende Spannungs-Fläche
  const pad=a.createGain(); pad.gain.setValueAtTime(.0001,t); pad.gain.exponentialRampToValueAtTime(.09,t+1); const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.setValueAtTime(500,t); lp.frequency.linearRampToValueAtTime(2200,t+dur); lp.connect(pad); pad.connect(master);
  const os=[0,7,12].map((st,i)=>{ const o=a.createOscillator(); o.type="sawtooth"; const f0=110*Math.pow(2,st/12); o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f0*2,t+dur); o.detune.value=(i-1)*8; o.connect(lp); o.start(t); return o; });
  // Pauken-Puls, der schneller wird
  let tt=t, gap=.42; while(tt < t+dur-.2){ tone(55,tt,.25,"sine",.35); tone(82.4,tt,.2,"sine",.12); tt+=gap; gap=Math.max(.13,gap*.9); }
  n.start(t); lfo.start(t);
  susp = {stop(){ const e=a.currentTime; [n,lfo,...os].forEach(o=>{ try{o.stop(e+.05)}catch(x){} }); if(base) try{base.stop(e+.05)}catch(x){}; pad.gain.cancelScheduledValues(e); pad.gain.setValueAtTime(pad.gain.value||.05,e); pad.gain.exponentialRampToValueAtTime(.0001,e+.08); }};
}
function fanfare(){ if(ST.mute) return; const a=ac(); const t=a.currentTime+.02;
  NB = NB || noiseBuf(); const n=a.createBufferSource(); n.buffer=NB; const hp=a.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=5000; const g=a.createGain(); n.connect(hp); hp.connect(g); g.connect(master); env(g,t,.005,.35,1.6); n.start(t); n.stop(t+1.8);
  [[392,0],[523.25,.12],[659.25,.24],[783.99,.36]].forEach(([f,d])=>{ tone(f,t+d,.22,"sawtooth",.12); tone(f,t+d,.25,"triangle",.2); });
  [523.25,659.25,783.99,1046.5].forEach(f=>{ tone(f,t+.52,1.1,"triangle",.16); tone(f/2,t+.52,1.1,"sawtooth",.05); });
}

/* ---------- Rad ---------- */
const cv=$("#wheel"), ctx=cv.getContext("2d"); let R=300, CX=0, CY=0, rot=0, spinning=false, segs=[], secret=null;
function active(){ const s=new Set(P().sel); return MODS.filter(m=>s.has(key(m))); }
function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; r=Math.round(r+(255-r)*f); g=Math.round(g+(255-g)*f); b=Math.round(b+(255-b)*f); return `rgb(${r},${g},${b})`; }
function layout(){ const dpr=window.devicePixelRatio||1; const size=Math.min(innerWidth, innerHeight-60)*.9; R=size/2; cv.width=size*dpr; cv.height=size*dpr; cv.style.width=size+"px"; cv.style.height=size+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=cv.getBoundingClientRect(); CX=r.left+R; CY=r.top+R;
  const pt=$("#pointer"); pt.style.left=(CX-30)+"px"; pt.style.top=(r.top-28)+"px";
  const hb=$("#hub"); const hs=R*.36; hb.style.width=hb.style.height=hs+"px"; hb.style.left=(CX-hs/2)+"px"; hb.style.top=(CY-hs/2)+"px"; draw(); }
function draw(){ segs=active(); const n=segs.length; ctx.clearRect(0,0,2*R,2*R);
  ctx.save(); ctx.translate(R,R);
  ctx.beginPath(); ctx.arc(0,0,R-2,0,7); ctx.fillStyle="#1b244a"; ctx.fill();
  if(!n){ ctx.fillStyle="#fff"; ctx.font="bold 22px sans-serif"; ctx.textAlign="center"; ctx.fillText("Keine Module gewählt – ⚙︎ Module",0,-R*.5); ctx.restore(); return; }
  const a=2*Math.PI/n, rr=R-12;
  segs.forEach((m,i)=>{ const s=-Math.PI/2+i*a+rot; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,rr,s,s+a); ctx.closePath();
    ctx.fillStyle=shade(COL(m.area), i%2?0.18:0); ctx.fill(); ctx.strokeStyle="#ffffffaa"; ctx.lineWidth=n>40?1:2; ctx.stroke();
    const mid=s+a/2, flip=Math.cos(mid)<0; ctx.save(); ctx.rotate(flip?mid+Math.PI:mid); ctx.textAlign=flip?"left":"right"; ctx.textBaseline="middle"; ctx.fillStyle="#fff"; const X=flip?-(rr-12):rr-12;
    const fs=Math.max(9, Math.min(R*.075, a*rr*.55)); ctx.font=`800 ${fs}px sans-serif`;
    let label = `${m.kurz} ${m.lab}`;
    if(n<=18){ const t=m.titel.length>20?m.titel.slice(0,19)+"…":m.titel; ctx.fillText(label, X, -fs*.45); ctx.font=`600 ${fs*.72}px sans-serif`; ctx.fillText(t, X, fs*.5); }
    else ctx.fillText(label, X, 0);
    ctx.restore(); });
  // Ring mit Lämpchen
  ctx.lineWidth=10; ctx.strokeStyle="#f5c542"; ctx.beginPath(); ctx.arc(0,0,R-6,0,7); ctx.stroke();
  const L=Math.max(16,Math.min(n,36)); for(let i=0;i<L;i++){ const b=i*2*Math.PI/L+rot*.0; ctx.beginPath(); ctx.arc(Math.cos(b)*(R-6),Math.sin(b)*(R-6),3.2,0,7); ctx.fillStyle=spinning&&((i+Math.floor(performance.now()/90))%2)?"#fff":"#fff6c8"; ctx.fill(); }
  ctx.restore();
  $("#hub").style.boxShadow = secret ? "0 6px 18px #0007, inset 0 -4px 8px #0003, 0 0 0 2px #f5a30066" : "";
}
function idxAt(r){ const n=segs.length, a=2*Math.PI/n; let th=((-r)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); return Math.floor(th/a)%n; }
function pickRandom(){ const p=P(); const n=segs.length; let w=segs.map(m=>{ const c=(p.hist[key(m)]||{}).n||0; let x=p.rare?1/Math.pow(1+c,1.6):1; if(n>1 && p.last===key(m)) x*=0.05; return x; });
  const sum=w.reduce((a,b)=>a+b,0); let r=Math.random()*sum; for(let i=0;i<n;i++){ r-=w[i]; if(r<=0) return i; } return n-1; }
function spin(){ if(spinning) return; segs=active(); const n=segs.length; if(!n){ openSet(); return; } ac();
  let t = secret ? segs.findIndex(m=>key(m)===secret) : -1; if(t<0) t=pickRandom(); secret=null;
  const a=2*Math.PI/n, f=.2+Math.random()*.6; const turns=6+Math.floor(Math.random()*3);
  const cur=rot; let target=-(t+f)*a; while(target < cur + turns*2*Math.PI) target += 2*Math.PI;
  const dur=6200+Math.random()*1200, t0=performance.now(); spinning=true; let lastIdx=idxAt(rot); suspenseStart(dur/1000);
  $("#hint").textContent="…";
  function step(now){ let x=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-x,4.2); rot=cur+(target-cur)*e;
    const id=idxAt(rot); if(id!==lastIdx){ tick(); lastIdx=id; } draw();
    if(x<1) requestAnimationFrame(step); else { spinning=false; if(susp) susp.stop(); fanfare(); confetti(); land(segs[t]); } }
  requestAnimationFrame(step); }
function land(m){ const p=P(); const k=key(m); const h=p.hist[k]||{n:0}; h.n++; h.t=Date.now(); p.hist[k]=h; p.last=k; save(); draw();
  $("#hint").textContent="Leertaste oder Mitte antippen = drehen"; setTimeout(()=>showResult(m), 2000); }

/* geheimes Ziel: Segment antippen oder Ziffern tippen (z. B. 2 0 7 = LF 2 Modul 7) */
cv.addEventListener("pointerdown", ev=>{ if(spinning) return; const dx=ev.clientX-CX, dy=ev.clientY-CY, d=Math.hypot(dx,dy); if(d<R*.2||d>R) return;
  segs=active(); if(!segs.length) return; const n=segs.length, a=2*Math.PI/n; let th=Math.atan2(dy,dx)+Math.PI/2-rot; th=((th%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  const k=key(segs[Math.floor(th/a)%n]); secret = secret===k ? null : k; draw(); });
let kb="", kbT=null;
addEventListener("keydown", ev=>{ if($(".modal.on")) { if(ev.key==="Escape") closeAll(); return; }
  if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); spin(); return; }
  const kk=ev.key.toLowerCase(); if(/^[0-9wm]$/.test(kk)){ kb+=kk; clearTimeout(kbT); kbT=setTimeout(()=>{ let ar, nr; if(/^[wm]/.test(kb)){ ar=kb[0].toUpperCase(); nr=+kb.slice(1); } else { ar=kb[0]; nr=+kb.slice(1); } const k=ar+"."+nr; if(byKey[k] && P().sel.includes(k)) secret=k; kb=""; draw(); },1200); }
  if(ev.key==="Escape"){ secret=null; draw(); } });
$("#hub").onclick=spin;

const cf=$("#conf"), cx2=cf.getContext("2d"); let parts=[];
function confetti(){ cf.width=innerWidth; cf.height=innerHeight; const cols=["#ffcc33","#ff5e7e","#4fc3f7","#81c784","#ba68c8","#ffffff","#ff8a3d"];
  for(let i=0;i<320;i++){ const ang=Math.random()*Math.PI*2, sp=6+Math.random()*12; parts.push({x:CX,y:CY,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*8,h:4+Math.random()*6,c:cols[i%cols.length],life:1}); }
  for(let i=0;i<160;i++){ parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:0,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,c:cols[i%cols.length],life:1}); }
  if(parts.length<=480) requestAnimationFrame(cstep); }
function cstep(){ cx2.clearRect(0,0,cf.width,cf.height); parts.forEach(p=>{ p.vy+=.25; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.004; cx2.save(); cx2.globalAlpha=Math.max(0,p.life); cx2.translate(p.x,p.y); cx2.rotate(p.r); cx2.fillStyle=p.c; cx2.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+1); cx2.restore(); });
  parts=parts.filter(p=>p.life>0&&p.y<cf.height+40); if(parts.length) requestAnimationFrame(cstep); else cx2.clearRect(0,0,cf.width,cf.height); }

      $("#nx").onclick=()=>{ i=(i+1)%its.length; r(); }; }; r(); }
  else if(m.typ==="rf"){ const lab=d.labels||["richtig","falsch"]; gOpen(m,`Aufstehen = ${lab[0]} · sitzen bleiben = ${lab[1]}`); const its=shuf(d.aussagen); let i=0;
    const r=()=>{ const it=its[i]; B.innerHTML=`<div class="big">${esc(it[0])}</div><div id="sl"></div><div class="small" style="text-align:center">Aussage ${i+1} von ${its.length}</div>
      <div class="btns" style="justify-content:center"><button class="btn b3" id="go">Auflösen</button><button class="btn b1" id="nx">Weiter ▶</button></div>`;
      $("#go").onclick=()=>{ $("#sl").innerHTML=`<div class="sol" style="background:${it[1]?"#d9f2e2":"#ffe0e0"}"><b>${it[1]?"✔ "+lab[0].toUpperCase():"✘ "+lab[1].toUpperCase()}</b>${it[2]?"<br>"+esc(it[2]):""}</div>`; if(it[1]) fanfare(); };
      $("#nx").onclick=()=>{ i=(i+1)%its.length; r(); }; }; r(); }
  else if(m.typ==="activity"){ gOpen(m,"Activity: Pantomime – Zeichnen – Erklären"); const MODE={P:["🎭","Pantomime"],Z:["✏️","Zeichnen"],E:["💬","Erklären"]}; const its=shuf(d.karten); let i=0, sc=[0,0], team=0;
    const r=()=>{ const it=its[i]; const md=MODE[it[1]]; if(gTimer){clearInterval(gTimer);gTimer=null;}
      B.innerHTML=`<div class="score"><span class="team ${team===0?"on":""}" data-t="0">Team A: ${sc[0]}</span><span class="team ${team===1?"on":""}" data-t="1">Team B: ${sc[1]}</span></div>
      <div style="text-align:center;font-size:70px">${md[0]}</div><div style="text-align:center;font-size:26px;font-weight:800">${md[1]}</div>
      <div class="big peek" id="pk">${esc(it[0])}${trs(m,it[0])}${it[1]==="E"?`<div style="font-size:.5em;color:#c62828">Verboten: ${esc(it[2])}</div>`:""}</div>
      <div class="small" style="text-align:center">Begriff ist verschwommen: Die spielende Person hält „👁 Begriff zeigen“ gedrückt (Klasse schaut weg).</div>
      <div class="timer" id="tm">60</div>
      <div class="btns" style="justify-content:center"><button class="btn b2" id="pv">👁 Begriff zeigen (gedrückt halten)</button><button class="btn b3" id="st">⏱ 60 s starten</button><button class="btn b1" id="ok">✔ Erraten (+1)</button><button class="btn b2" id="nx">Weiter ▶</button></div>`;
      const pk=$("#pk"), pv=$("#pv"); pv.onpointerdown=()=>pk.classList.add("show"); ["pointerup","pointerleave","pointercancel"].forEach(e=>pv.addEventListener(e,()=>pk.classList.remove("show")));
      document.querySelectorAll(".team").forEach(t=>t.onclick=()=>{ team=+t.dataset.t; r(); });
      $("#st").onclick=()=>{ let s=60; $("#tm").textContent=s; if(gTimer) clearInterval(gTimer); gTimer=setInterval(()=>{ s--; $("#tm").textContent=s; if(s<=5&&s>0) tick(); if(s<=0){ clearInterval(gTimer); gTimer=null; tone(220,ac().currentTime,.6,"sawtooth",.2); pk.classList.add("show"); } },1000); };
      $("#ok").onclick=()=>{ sc[team]++; fanfare(); team=1-team; i=(i+1)%its.length; r(); };
      $("#nx").onclick=()=>{ team=1-team; i=(i+1)%its.length; r(); }; }; r(); }
  else if(m.typ==="rechnen"||m.typ==="szene"){ const isR=m.typ==="rechnen"; gOpen(m,isR?"Rechenduell":"Szene ziehen – vorspielen – auflösen"); const its=isR?d.aufgaben:shuf(d.szenen); let i=0;
    const r=()=>{ const it=its[i]; if(gTimer){clearInterval(gTimer);gTimer=null;}
      B.innerHTML=`<div style="text-align:center;font-weight:800;color:#6b7385">${isR?"Aufgabe":"Szene"} ${i+1} von ${its.length}</div><div class="big">${isR?"":"🎬 "}${esc(it[0])}${trs(m,it[0])}</div>
      ${isR?`<div class="timer" id="tm">–</div>`:""}<div id="sl"></div>
      <div class="btns" style="justify-content:center">${isR?`<button class="btn b2" id="t90">⏱ 90 s</button>`:""}<button class="btn b3" id="go">Lösung zeigen</button><button class="btn b2" id="pr">◀</button><button class="btn b1" id="nx">Weiter ▶</button></div>`;
      if(isR) $("#t90").onclick=()=>{ let s=90; $("#tm").textContent=s; gTimer=setInterval(()=>{ s--; $("#tm").textContent=s; if(s<=0){clearInterval(gTimer);gTimer=null; tone(220,ac().currentTime,.6,"sawtooth",.2);} },1000); };
      $("#go").onclick=()=>{ $("#sl").innerHTML=`<div class="sol" style="background:#eef6ff"><b>${esc(it[1])}</b></div>`; };
      $("#nx").onclick=()=>{ i=(i+1)%its.length; r(); }; $("#pr").onclick=()=>{ i=(i-1+its.length)%its.length; r(); }; }; r(); }
  else if(m.typ==="reihe"){ const R=d.reihen||[{titel:d.titel||"Reihenfolge",schritte:d.schritte}]; let ri=0;
    const r=()=>{ const rr=R[ri]; gOpen(m,"Reihenfolge: "+rr.titel); let next=0; const st=shuf(rr.schritte.map((s,i)=>[s,i]));
      B.innerHTML=`<div class="small" style="text-align:center;margin-bottom:8px">Tippt die Schritte in der richtigen Reihenfolge an.</div><div class="seq">${st.map(([s,i])=>`<button class="seqb" data-i="${i}">${esc(s)}${trs(m,s)}</button>`).join("")}</div>
      <div class="btns" style="justify-content:center">${R.length>1?`<button class="btn b1" id="nr">Nächste Reihe ▶</button>`:""}<button class="btn b2" id="nw">Neu mischen</button></div>`;
      document.querySelectorAll(".seqb").forEach(b=>b.onclick=()=>{ if(b.classList.contains("ok")) return; if(+b.dataset.i===next){ b.classList.add("ok"); b.innerHTML=`<b>${next+1}.</b> `+b.innerHTML; b.style.order=next-100; next++; tick(); if(next===rr.schritte.length) { fanfare(); confetti(); } } else { b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); } });
      if(R.length>1) $("#nr").onclick=()=>{ ri=(ri+1)%R.length; r(); }; $("#nw").onclick=r; }; r(); }
  else { // Tafel-Memory
    const pr=pairsOf(m).slice(0,9); gOpen(m,"Tafel-Memory: Paare finden"); let cards=shuf(pr.flatMap((p,i)=>[[p[0],i,0],[p[1],i,1]])); let open=[], sc=[0,0], team=0, lock=false;
    const cols=cards.length>16?6:4;
    B.innerHTML=`<div class="score"><span class="team on" id="tA">Team A: 0</span><span class="team" id="tB">Team B: 0</span></div><div class="memgrid" style="grid-template-columns:repeat(${cols},1fr)">${cards.map((c,i)=>`<div class="mc" data-i="${i}">${i+1}</div>`).join("")}</div>`;
    const upd=()=>{ $("#tA").textContent="Team A: "+sc[0]; $("#tB").textContent="Team B: "+sc[1]; $("#tA").classList.toggle("on",team===0); $("#tB").classList.toggle("on",team===1); };
    document.querySelectorAll(".mc").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i, c=cards[i]; if(lock||el.classList.contains("open")||el.classList.contains("done")) return;
      el.classList.add("open"); el.innerHTML=esc(c[0])+trs(m,c[0]); open.push([el,c]); tick();
      if(open.length===2){ lock=true; const [a,b]=open; if(a[1][1]===b[1][1]){ setTimeout(()=>{ a[0].classList.add("done"); b[0].classList.add("done"); sc[team]++; upd(); open=[]; lock=false; fanfare(); if(document.querySelectorAll(".mc.done").length===cards.length) confetti(); },500); }
        else setTimeout(()=>{ [a,b].forEach(x=>{ x[0].classList.remove("open"); x[0].textContent=+x[0].dataset.i+1; }); open=[]; lock=false; team=1-team; upd(); },1700); } }); }
}

/* ---------- Start ---------- */
fillProfiles(); $("#bMute").textContent=ST.mute?"🔇":"🔊";
addEventListener("resize",layout); layout();
setInterval(()=>{ if(spinning) return; },1000);
</script>
</body>
