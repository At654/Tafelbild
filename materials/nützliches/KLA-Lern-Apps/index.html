<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KLA Lern-Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef3f9;--surface:#fff;--surface2:#e6edf6;--ink:#14202e;--muted:#566578;--line:#cbd6e3;
  --brand:#1f5fa8;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;--gold:#e0a300;
  --c0:#c9263d;--c1:#1f66c9;--c2:#e8a900;--c3:#1f8a4c;--c4:#7a3fc4;--c5:#0b8d99;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Noto Sans Ethiopic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1722;--surface:#18222f;--surface2:#142030;--ink:#eaf0f7;--muted:#a3b2c4;--line:#2c3a4c;
  --brand:#6fb0ff;--brand-ink:#08111d;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;--gold:#ffd04a;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1722;--surface:#18222f;--surface2:#142030;--ink:#eaf0f7;--muted:#a3b2c4;--line:#2c3a4c;
  --brand:#6fb0ff;--brand-ink:#08111d;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;--gold:#ffd04a;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em;touch-action:manipulation}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:4em}
label{display:block;font-weight:700;margin:10px 0 4px}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.hide{display:none!important}
svg text{font-family:var(--body)}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header .logo{height:44px;width:auto;display:block}
#tafel header h1{font-size:1.3rem;margin:0}
#tafel header .sp{flex:1}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:56px;height:56px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:18px 22px 40px;max-width:1500px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:16px}
.code{font-family:var(--display);font-size:3.2rem;font-weight:800;letter-spacing:.12em}
.lobbyp{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;animation:pop .35s}
.pchip svg{width:38px;height:38px;border-radius:50%}
.pchip.t0{border-color:var(--c0)}.pchip.t1{border-color:var(--c1)}.pchip.t2{border-color:var(--c2)}.pchip.t3{border-color:var(--c3)}.pchip.t4{border-color:var(--c4)}.pchip.t5{border-color:var(--c5)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.settings .box{padding:10px 12px}
.settings label{margin:0 0 4px;font-size:.9rem}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:.35em .7em;font-size:.95rem}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
/* Fragen auf der Tafel */
.qwrap{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 140px)}
.qtop{display:flex;align-items:center;gap:14px}
.qtype{font-family:var(--display);font-weight:800;background:var(--surface);border:2px solid var(--brand);border-radius:999px;padding:.2em .9em;font-size:1rem}
.x2{background:var(--gold);color:#1a1200;border-radius:8px;padding:.1em .6em;font-family:var(--display);font-weight:800}
.qtext{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(1.6rem,3.4vw,3rem);text-align:center;background:var(--surface);border-radius:18px;padding:18px 24px;border:1px solid var(--line)}
.qmid{display:flex;align-items:center;justify-content:center;gap:24px;flex:1}
.qmid img{max-height:44vh;max-width:56vw;border-radius:14px;object-fit:contain;background:#fff}
.imgcr{font-size:.72rem;color:var(--muted);text-align:right}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.1em;text-align:center;border-radius:50%;background:var(--surface);border:6px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center;line-height:1;padding:.1em}
.timer.low{border-color:var(--bad);color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.cnt{font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border-radius:16px;padding:16px 18px;color:#fff;font-size:clamp(1.1rem,2vw,1.7rem);font-weight:700;position:relative;display:flex;align-items:center;gap:14px;min-height:76px}
.opt svg.sh{width:34px;height:34px;flex:none;fill:currentColor}
.opt .n{margin-left:auto;font-family:var(--display);font-size:1.8rem;font-weight:800}
.opt.dim{opacity:.28}
.opt.good{outline:6px solid var(--ok);outline-offset:3px}
.o0{background:var(--c0)}.o1{background:var(--c1)}.o2{background:var(--c2);color:#1a1200}.o3{background:var(--c3)}.o4{background:var(--c4)}.o5{background:var(--c5)}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:14px;height:200px;margin:6px 0}
.bars div{flex:1;max-width:160px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;border-radius:10px 10px 0 0;min-height:4px;transition:height .5s}
.bars b{font-family:var(--display);font-size:1.5rem}
.expl{background:var(--surface);border-left:8px solid var(--brand);border-radius:12px;padding:12px 16px;font-size:1.2rem}
.board{list-style:none;padding:0;margin:0;max-width:900px;margin-inline:auto}
.board li{display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:14px;background:var(--surface);margin-bottom:8px;font-size:1.5rem;border:1px solid var(--line);transition:transform .6s}
.board li .rk{font-family:var(--display);font-weight:800;width:1.6em;color:var(--muted)}
.board li svg{width:48px;height:48px;border-radius:50%;flex:none}
.board li .nm{flex:1;font-weight:700}
.board li .pt{font-family:var(--display);font-weight:800}
.board li .gain{font-size:1rem;color:var(--ok);font-weight:700;min-width:4em;text-align:right}
.board li .fire{color:var(--warn);font-size:1rem}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:20px;min-height:340px}
.podium .pl{min-width:210px;text-align:center}
.podium .pl svg{width:90px;height:90px;border-radius:50%;border:4px solid var(--surface)}
.podium .pl .bl{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;padding:12px 6px;font-family:var(--display);font-weight:800;margin-top:6px;animation:rise 1s both}
.podium .pl.p1 .bl{background:var(--gold);color:#1a1200;height:230px}
.podium .pl.p2 .bl{height:170px}.podium .pl.p3 .bl{height:120px}
.podium .pl .bl big{display:block;font-size:3rem}
@keyframes rise{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.cloud{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:center;padding:16px;background:var(--surface);border-radius:16px;min-height:280px;border:1px solid var(--line)}
.cloud span{font-family:var(--display);font-weight:800;line-height:1.1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cards div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.15rem;cursor:pointer}
.cards div.fav{outline:4px solid var(--gold);font-size:1.6rem;grid-column:span 2}
.tteams{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tteam{border-radius:12px;padding:8px 16px;color:#fff;font-weight:800;font-family:var(--display);font-size:1.2rem}
table.rep{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden}
table.rep th,table.rep td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}
table.rep th{background:var(--surface2);font-size:.85rem}
table.rep td.l,table.rep th.l{text-align:left}
td.g{background:color-mix(in srgb,var(--ok) 25%,var(--surface))}
td.f{background:color-mix(in srgb,var(--bad) 22%,var(--surface))}
.paused{position:fixed;inset:0;background:rgba(10,20,35,.82);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:4rem;font-weight:800;z-index:40;pointer-events:none}
.paused button{pointer-events:auto;font-size:1.4rem;margin-top:14px}
#tafel header{position:relative;z-index:50}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:12px}
.libgrid .box h3{margin-bottom:2px}
/* Editor */
.ed{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.ed .ql{display:flex;flex-direction:column;gap:6px;max-height:75vh;overflow:auto}
.ed .ql button{text-align:left;padding:.5em .7em;font-size:.95rem}
.ed .ql button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ed .opt-row{display:flex;gap:8px;align-items:center;margin:6px 0}
.ed .opt-row input[type=checkbox]{width:26px;height:26px;flex:none}
.ed .opt-row input[type=text]{flex:1}
.ed img.th{max-width:220px;max-height:140px;border-radius:10px;display:block;margin:6px 0}
.cand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.cand img{width:100%;height:110px;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent}
.cand img:hover{border-color:var(--brand)}
.pinimg{position:relative;display:inline-block;cursor:crosshair;width:min(100%,720px)}
.pinimg img{width:100%;height:auto;display:block;border-radius:10px}
.pinimg i{position:absolute;border:4px solid var(--ok);border-radius:50%;transform:translate(-50%,-50%);background:rgba(31,122,63,.25);pointer-events:none}
@media (max-width:900px){.join,.opts,.ed{grid-template-columns:1fr}.qmid img{max-width:100%}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:12px 14px 40px;min-height:100vh}
#phone[dir=rtl]{text-align:right}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:.95rem}
.ptop .me{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.ptop .me svg{width:34px;height:34px;border-radius:50%;flex:none}
.ptop .me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptop .pts{font-family:var(--display);font-weight:800;font-size:1.1rem}
.lang{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lang button{padding:.4em .8em;font-size:1rem}
.lang button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}
.avg button{padding:2px;border-radius:50%;border:3px solid transparent;background:none;aspect-ratio:1}
.avg button svg{width:100%;height:100%;border-radius:50%;display:block}
.avg button.on{border-color:var(--ink)}
.colg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.colg button{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid transparent}
.colg button.on{border-color:var(--ink)}
.pq{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:6px 0 10px;line-height:1.2}
.pq2{font-size:.95rem;color:var(--muted);margin:-4px 0 10px}
.pimg{width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:#fff;margin-bottom:8px}
.ptimer{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:6px 0 12px}
.ptimer i{display:block;height:100%;background:var(--brand);width:100%}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0;padding:16px 14px;border-radius:16px;color:#fff;border:none;font-size:1.1rem;font-weight:700;text-align:start}
.pbtn svg.sh{width:28px;height:28px;fill:currentColor;flex:none}
.pbtn.o2{color:#1a1200}
.pbtn.sel{outline:5px solid var(--ink);outline-offset:2px}
.pbtn.gone{opacity:.15;pointer-events:none}
.ptf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptf .pbtn{justify-content:center;font-size:1.3rem;min-height:110px}
.item{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.item span{flex:1}
.item button{padding:.3em .7em;font-weight:800}
.mpair{display:flex;gap:8px;margin:6px 0;align-items:stretch}
.mpair>div,.mpair>button{flex:1;border-radius:12px;padding:10px;border:3px solid var(--line);background:var(--surface);font-size:1rem;text-align:center}
.mpair .on{outline:4px solid var(--ink)}
.res{text-align:center;padding:26px 12px;border-radius:20px;margin-top:10px}
.res.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface))}
.res.bad{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.res.mid{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.res.neu{background:var(--surface)}
.res h2{font-size:2rem;margin:0 0 6px}
.res .bp{font-family:var(--display);font-size:2.6rem;font-weight:800}
.stat{display:flex;justify-content:center;gap:22px;margin-top:10px;font-size:1rem}
.stat b{display:block;font-family:var(--display);font-size:1.5rem}
.wait{text-align:center;padding:30px 10px}
.wait svg.av{width:120px;height:120px;border-radius:50%}
.pill{display:inline-block;border-radius:999px;padding:.1em .8em;color:#fff;font-weight:800;font-family:var(--display)}
.joker{margin:6px 0;font-weight:800}
.banner{position:fixed;left:0;right:0;bottom:0;background:var(--bad);color:#fff;text-align:center;padding:8px;font-size:.95rem;z-index:30}
.paus{text-align:center;font-family:var(--display);font-size:2.4rem;font-weight:800;padding:70px 10px}
.vote{display:block;width:100%;text-align:start;margin:6px 0;padding:12px;border-radius:12px;font-size:1.05rem}
.vote.sel{outline:4px solid var(--gold);background:var(--surface2)}


/* =========================================================
   KLA Lern-Apps – eigene Gestaltung
   ========================================================= */
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:30}
.topbar .logo{height:40px;width:auto;display:block}
.topbar h1{font-size:1.25rem;margin:0}
.topbar .sp{flex:1}
.chip{border-radius:999px;padding:.35em .9em;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.badge{display:inline-block;border-radius:999px;padding:.15em .7em;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.t{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand);border-color:transparent}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(10,30,60,.05)}
.card h3{margin:0;font-size:1.12rem}
.card .meta{font-size:.86rem;color:var(--muted)}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.flags{font-size:.95rem;letter-spacing:.08em}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}
.hero h2{margin:0 0 6px}
.hero p{margin:0;color:var(--muted);max-width:60ch}

/* Dialog */
.ov{position:fixed;inset:0;background:rgba(8,16,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.ov .box{max-width:520px;width:100%;max-height:88vh;overflow:auto}
.linkrow{display:flex;gap:8px;align-items:center}
.linkrow input{font-size:.85rem}

/* Tafel */
#tafel{min-height:100vh;display:flex;flex-direction:column}
#tafel main{flex:1;padding:18px;display:flex;flex-direction:column;gap:16px}
.lobby{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.qrbox{background:#fff;padding:18px;border-radius:20px;text-align:center;border:1px solid var(--line)}
.qrbox canvas{display:block;image-rendering:pixelated;width:min(42vw,360px);height:auto}
.code{font-family:var(--display);font-size:2.6rem;letter-spacing:.14em;font-weight:800;color:#14202e}
.joinurl{font-size:1rem;color:var(--muted);word-break:break-all;max-width:360px;margin:6px auto 0}
.players{display:flex;flex-wrap:wrap;gap:10px}
.pl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;font-weight:700}
.pl svg,.av svg{width:34px;height:34px;border-radius:50%;display:block}
.av{width:34px;height:34px}
/* Rangliste */
.rank{display:flex;flex-direction:column;gap:9px}
.rk{display:grid;grid-template-columns:46px 44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px;transition:transform .35s ease}
.rk .nr{font-family:var(--display);font-size:1.5rem;font-weight:800;color:var(--muted);text-align:center}
.rk.g1 .nr{color:var(--gold)}.rk.g2 .nr{color:#9aa7b6}.rk.g3 .nr{color:#c08457}
.rk .nm{font-weight:700;font-size:1.1rem}
.rk .bar{height:11px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:5px}
.rk .bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s ease}
.rk.fin .bar i{background:var(--ok)}
.rk .pt{font-family:var(--display);font-size:1.5rem;font-weight:800}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:10px 0 24px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .stand{width:clamp(110px,16vw,190px);border-radius:16px 16px 0 0;background:var(--brand);color:var(--brand-ink);display:flex;align-items:flex-start;justify-content:center;font-family:var(--display);font-size:2.6rem;font-weight:800;padding-top:8px}
.pod svg{width:clamp(64px,9vw,104px);height:auto;border-radius:50%}
.pod .nm{font-weight:700;font-size:1.15rem;text-align:center;max-width:200px}
.pod1 .stand{height:190px;background:var(--gold);color:#2a2000}
.pod2 .stand{height:140px;background:#9aa7b6;color:#101820}
.pod3 .stand{height:108px;background:#c08457;color:#1a0e06}
.big{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.6rem);font-weight:800}
.merk{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));border-radius:16px;padding:14px 18px;font-size:1.15rem}

/* Handy / Üben */
#phone{max-width:620px;margin:0 auto;padding:14px 14px 40px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.phead .sp{flex:1}
.prog{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.statline{display:flex;gap:14px;font-size:.9rem;color:var(--muted);font-weight:700}
.q{font-size:1.25rem;font-weight:700;margin:14px 0 4px;line-height:1.3}
.tr{color:var(--muted);font-style:italic;font-size:1rem;line-height:1.35}
.tr[dir="rtl"]{text-align:right}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:14px;border-radius:14px;font-size:1.08rem;font-weight:400;min-height:0;position:static;gap:0;color:var(--ink);border:2px solid var(--line);background:var(--surface)}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.opt.done{opacity:.55}
.karte{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px 16px;text-align:center;font-size:1.3rem;font-weight:700;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.karte .emo{font-size:2.6rem;line-height:1}
.ecken{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ecken.e3{grid-template-columns:1fr 1fr 1fr}
.ecke{padding:16px 10px;border-radius:16px;font-weight:700;font-size:1.05rem;border:2px solid var(--line);min-height:76px}
.ecke.c0{background:color-mix(in srgb,var(--c0) 14%,var(--surface));border-color:color-mix(in srgb,var(--c0) 55%,var(--line))}
.ecke.c1{background:color-mix(in srgb,var(--c1) 14%,var(--surface));border-color:color-mix(in srgb,var(--c1) 55%,var(--line))}
.ecke.c2{background:color-mix(in srgb,var(--c2) 16%,var(--surface));border-color:color-mix(in srgb,var(--c2) 55%,var(--line))}
.ecke.c3{background:color-mix(in srgb,var(--c3) 14%,var(--surface));border-color:color-mix(in srgb,var(--c3) 55%,var(--line))}
.ecke.c4{background:color-mix(in srgb,var(--c4) 14%,var(--surface));border-color:color-mix(in srgb,var(--c4) 55%,var(--line))}
.ecke.c5{background:color-mix(in srgb,var(--c5) 14%,var(--surface));border-color:color-mix(in srgb,var(--c5) 55%,var(--line))}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:start;font-size:1rem;min-height:66px}
.pc.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.pc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface));opacity:.65}
.pc.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.step{display:flex;gap:8px;align-items:center;margin:8px 0}
.step .txt{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.step .txt.ok{border-color:var(--ok)}
.step .txt.bad{border-color:var(--bad)}
.step button{padding:.45em .7em}
.satz{font-size:1.2rem;line-height:2.1}
.gap{display:inline-block;min-width:112px;border-bottom:3px solid var(--brand);text-align:center;padding:2px 8px;margin:0 3px;border-radius:6px 6px 0 0;background:var(--surface2);font-weight:700}
.gap.act{background:color-mix(in srgb,var(--brand) 22%,var(--surface))}
.gap.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.gap.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pool button{border-radius:999px;padding:.5em 1em;font-weight:700}
.pool button.used{opacity:.35}
.fb{border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:700}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line))}
.fb .why{font-weight:400;margin-top:5px}
.lvl{display:flex;gap:10px;margin:10px 0}
.lvl button{flex:1;padding:14px;border-radius:16px;font-weight:700}
.lvl button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:8px}
.avgrid button{padding:3px;border-radius:12px;line-height:0}
.avgrid button.on{outline:3px solid var(--brand)}
.avgrid svg{width:100%;height:auto;border-radius:9px}
.cols{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.cols button{width:34px;height:34px;border-radius:50%;padding:0}
.cols button.on{outline:3px solid var(--brand)}
canvas.conf{position:fixed;inset:0;pointer-events:none;z-index:90}
.scroll{overflow:auto}
/* Grafiken */
.gfxbox{display:block;width:92px;margin:0 auto}
.gfx{width:100%;height:auto;display:block}
.karte .gfxbox{width:104px}
.opt .gfxbox,.pc .gfxbox{width:54px;margin:0 0 6px}
/* Tafel: Live-Auswertung */
.tafelgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.tafelgrid{grid-template-columns:1fr}}
.live{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.live h3{margin:0 0 10px;font-size:1.1rem}
.lrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .nm{font-weight:700;font-size:.98rem}
.lrow .sub{color:var(--muted);font-size:.82rem}
.lbar{grid-column:1/-1;height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex}
.lbar i{display:block;height:100%}
.lbar i.ok{background:var(--ok)}
.lbar i.bad{background:var(--bad)}
.lrow.hit .nm:after{content:" 🔥"}
.lrow.hit{background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:10px;padding-inline:8px}
.quote{font-family:var(--display);font-size:1.1rem;font-weight:800}
.sprint{font-family:var(--display);font-size:1.8rem;font-weight:800;padding:.1em .5em;border-radius:12px;background:var(--surface2)}
.sprint.warn{background:color-mix(in srgb,var(--bad) 20%,var(--surface));color:var(--bad)}
.teamwahl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.teamwahl button{padding:12px 4px;border-radius:14px;font-weight:700;border:2px solid var(--line)}
.teamwahl button.on{outline:3px solid var(--brand)}
.tbadge{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-inline-end:6px}
.pre{white-space:pre-line}
@media(max-width:560px){.pc{font-size:.92rem;padding:10px;min-height:58px}.ecken{grid-template-columns:1fr}.ecken.e3{grid-template-columns:1fr}}
@media print{.topbar,.acts{display:none}}
</style>
</head>

    <span id="tctl"></span>
    <div class="mini"><canvas id="qrSmall" width="128" height="128"></canvas><div><b id="miniCode"></b><br><span id="miniN"></span><br><span id="conn"></span></div></div>
  </div>
  <main id="tMain"></main>
</div>
<div id="phone" hidden></div>

const TE=new TextEncoder(), TD=new TextDecoder();
function mqStr(s){const b=TE.encode(s);return [b.length>>8,b.length&255,...b];}
function mqLen(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;}
function mqPacket(h,body){return new Uint8Array([h,...mqLen(body.length),...body]);}
class MqttLink{
  constructor(url,cid,onMsg,onStatus){this.url=url;this.cid=cid;this.onMsg=onMsg;this.onStatus=onStatus;this.subs=new Set();this.up=false;this.buf=new Uint8Array(0);this.pid=1;this.tries=0;this.connect();}
  connect(){
    clearTimeout(this.rt);clearInterval(this.ping);let ws;
    try{ws=new WebSocket(this.url,["mqtt"]);}catch(e){this.retry();return;}
    this.ws=ws;ws.binaryType="arraybuffer";
    const guard=setTimeout(()=>{if(!this.up){try{ws.close();}catch(e){}}},9000);
    ws.onopen=()=>{ws.send(mqPacket(0x10,[...mqStr("MQTT"),4,0x02,0,30,...mqStr(this.cid+"-"+Math.random().toString(36).slice(2,6))]));};
    ws.onmessage=(ev)=>{const d=new Uint8Array(ev.data);const nb=new Uint8Array(this.buf.length+d.length);nb.set(this.buf);nb.set(d,this.buf.length);this.buf=nb;this.parse();};
    ws.onclose=()=>{clearTimeout(guard);this.up=false;clearInterval(this.ping);this.onStatus();this.retry();};
    ws.onerror=()=>{};
  }
  retry(){this.tries++;this.rt=setTimeout(()=>this.connect(),Math.min(15000,800*Math.pow(1.6,this.tries)));}
  parse(){
    while(this.buf.length>=2){
      let mult=1,len=0,i=1,b;
      do{if(i>=this.buf.length)return;b=this.buf[i++];len+=(b&127)*mult;mult*=128;}while(b&128);
      if(this.buf.length<i+len)return;
      const type=this.buf[0]>>4,flags=this.buf[0]&15,body=this.buf.subarray(i,i+len);this.buf=this.buf.slice(i+len);
      if(type===2){if(body[1]===0){this.up=true;this.tries=0;for(const t of this.subs)this.sendSub(t);
          this.ping=setInterval(()=>{try{this.ws.send(new Uint8Array([0xC0,0]));}catch(e){}},20000);this.onStatus(true);}else{try{this.ws.close();}catch(e){}}}
      else if(type===3){const tl=(body[0]<<8)|body[1];const topic=TD.decode(body.subarray(2,2+tl));let p=2+tl;const qos=(flags>>1)&3;
        if(qos>0){const id=(body[p]<<8)|body[p+1];p+=2;if(qos===1){try{this.ws.send(new Uint8Array([0x40,2,id>>8,id&255]));}catch(e){}}}
        let payload=null;try{payload=JSON.parse(TD.decode(body.subarray(p)));}catch(e){}
        if(payload!==null)this.onMsg(topic,payload,(flags&1)===1);}
    }
  }
  sendSub(t){const id=this.pid=(this.pid%60000)+1;try{this.ws.send(mqPacket(0x82,[id>>8,id&255,...mqStr(t),0]));}catch(e){}}
  subscribe(t){this.subs.add(t);if(this.up)this.sendSub(t);}
  publish(t,obj,retain){if(!this.up)return false;const body=[...mqStr(t),...TE.encode(obj===null?"":JSON.stringify(obj))];
    try{this.ws.send(mqPacket(retain?0x31:0x30,body));return true;}catch(e){return false;}}
}
/* Lokaler Testbetrieb: ?bc=1 verbindet nur Tabs im selben Browser (zum Ausprobieren ohne Internet) */
class LocalLink{
  constructor(cid,onMsg,onStatus){this.up=true;this.subs=new Set();this.bc=new BroadcastChannel("kla-lern");
    this.bc.onmessage=e=>{const m=e.data;if(this.subs.has(m.t))onMsg(m.t,m.p,false);};setTimeout(()=>onStatus(true),50);}
  subscribe(t){this.subs.add(t);}
  publish(t,obj){this.bc.postMessage({t,p:JSON.parse(JSON.stringify(obj))});return true;}
}
const params=new URLSearchParams(location.search);
const LOCAL=params.get("bc")==="1";
const BROKERS=params.get("broker")?[params.get("broker")]:["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt"];
const NS="klalern1/";
class Net{
  constructor(onMsg,onStatus){
    this.cid="p"+rnd(10);this.seen=new Map();this.onMsg=onMsg;
    const st=()=>onStatus(this.count());
    this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st));
  }
  count(){return {up:this.links.filter(l=>l.up).length,all:this.links.length};}
  recv(t,p,r){
    if(p&&typeof p==="object"&&p.mid){const now=Date.now();if(this.seen.has(p.mid))return;this.seen.set(p.mid,now);
      if(this.seen.size>3000){for(const [k,v] of this.seen){if(now-v>600000)this.seen.delete(k);}}}
    this.onMsg(t,p,r);
  }
  sub(t){this.links.forEach(l=>l.subscribe(NS+t));}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true;});return ok;}
}

function codeGen(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(5));for(const x of r)s+=a[x%a.length];return s;}

const EINGEBAUT=[{"id": "lf2-m7-bedarfsermittlung", "titel": {"de": "LF 2 · M 7 – Direkte und indirekte Bedarfsermittlung"}, "lf": 2, "modul": 7, "sprachen": ["de", "ar", "tr", "vi", "es", "pt", "ru", "ti"], "profi": true, "merksatz": {"de": "Fragen = direkt. Ware zeigen und abwarten = indirekt. Der Kunde weiß genau, was er will = Aushändigungsverkauf.", "ar": "أسئلة = مباشر. عرض البضاعة والانتظار = غير مباشر. الزبون يعرف تماماً ما يريد = بيع التسليم.", "tr": "Soru sormak = doğrudan. Ürünü gösterip beklemek = dolaylı. Müşteri tam olarak ne istediğini biliyor = teslim satışı.", "vi": "Hỏi = trực tiếp. Đưa hàng ra và chờ phản ứng = gián tiếp. Khách biết rõ mình muốn gì = bán giao hàng.", "es": "Preguntar = directa. Mostrar la mercancía y esperar = indirecta. El cliente sabe exactamente lo que quiere = venta de entrega.", "pt": "Perguntar = direta. Mostrar a mercadoria e esperar = indireta. O cliente sabe exatamente o que quer = venda de entrega.", "ru": "Вопросы = прямое выявление. Показать товар и ждать реакции = косвенное. Клиент точно знает, чего хочет = отпуск товара.", "ti": "ሕቶታት = ቀጥታዊ። ኣቕሓ ኣርእዩ ምጽባይ = ተዘዋዋሪ። ዓሚል እንታይ ከም ዝደሊ ብልክዕ ይፈልጥ = ምርካብ ሸቐጥ።"}, "aufgaben": [{"typ": "info", "bild": "🛍️", "text": {"de": "Drei Wege im Verkaufsgespräch:\n\n① Direkte Bedarfsermittlung – der Verkäufer stellt Fragen (Fragekette).\n② Indirekte Bedarfsermittlung – der Verkäufer legt eine Ware vor (Testangebot) und wartet die Reaktion ab.\n③ Aushändigungsverkauf – der Kunde weiß genau, was er will. Nur noch Ergänzungsfragen zu Menge, Art oder Größe.", "ar": "ثلاث طرق في حديث البيع:\n\n① التحديد المباشر للحاجة – البائع يطرح أسئلة (سلسلة أسئلة).\n② التحديد غير المباشر – البائع يعرض بضاعة (عرض تجريبي) وينتظر رد الفعل.\n③ بيع التسليم – الزبون يعرف تماماً ما يريد. فقط أسئلة تكميلية عن الكمية أو النوع أو الحجم.", "tr": "Satış görüşmesinde üç yol:\n\n① Doğrudan ihtiyaç belirleme – satıcı soru sorar (soru zinciri).\n② Dolaylı ihtiyaç belirleme – satıcı bir ürün gösterir (deneme sunumu) ve tepkiyi bekler.\n③ Teslim satışı – müşteri tam olarak ne istediğini bilir. Sadece miktar, tür veya beden için tamamlayıcı sorular.", "vi": "Ba cách trong cuộc bán hàng:\n\n① Xác định nhu cầu trực tiếp – người bán đặt câu hỏi (chuỗi câu hỏi).\n② Xác định nhu cầu gián tiếp – người bán đưa ra một món hàng (hàng thử) và chờ phản ứng.\n③ Bán giao hàng – khách biết rõ mình muốn gì. Chỉ còn câu hỏi bổ sung về số lượng, loại hoặc cỡ.", "es": "Tres caminos en la conversación de venta:\n\n① Determinación directa – el vendedor hace preguntas (cadena de preguntas).\n② Determinación indirecta – el vendedor presenta una mercancía (oferta de prueba) y espera la reacción.\n③ Venta de entrega – el cliente sabe exactamente lo que quiere. Solo preguntas complementarias sobre cantidad, tipo o talla.", "pt": "Três caminhos na conversa de venda:\n\n① Determinação direta – o vendedor faz perguntas (cadeia de perguntas).\n② Determinação indireta – o vendedor apresenta uma mercadoria (oferta de teste) e espera a reação.\n③ Venda de entrega – o cliente sabe exatamente o que quer. Só perguntas complementares sobre quantidade, tipo ou tamanho.", "ru": "Три пути в разговоре о продаже:\n\n① Прямое выявление потребности – продавец задаёт вопросы (цепочка вопросов).\n② Косвенное выявление – продавец показывает товар (пробное предложение) и ждёт реакции.\n③ Отпуск товара – клиент точно знает, чего хочет. Только дополнительные вопросы о количестве, виде или размере.", "ti": "ኣብ ናይ ሽያጥ ዝርርብ ሰለስተ መንገድታት፦\n\n① ቀጥታዊ ድሌት ምፍላጥ – ሸያጢ ሕቶታት ይሓትት።\n② ተዘዋዋሪ ድሌት ምፍላጥ – ሸያጢ ኣቕሓ የርኢ እሞ ግብረ መልሲ ይጽበ።\n③ ምርካብ ሸቐጥ – ዓሚል እንታይ ከም ዝደሊ ብልክዕ ይፈልጥ። መመላእታ ሕቶታት ጥራይ።"}, "g": "laden"}, {"typ": "sortier", "frage": {"de": "Welche Form passt zu dieser Situation?", "ar": "أي شكل يناسب هذا الموقف؟", "tr": "Bu duruma hangi biçim uyar?", "vi": "Hình thức nào phù hợp với tình huống này?", "es": "¿Qué forma corresponde a esta situación?", "pt": "Que forma corresponde a esta situação?", "ru": "Какая форма подходит к этой ситуации?", "ti" ri kulaklığı gösterir: „Böyle bir şey arıyorum.“", "vi": "Khách chỉ vào tai nghe: „Tôi tìm cái gì đó đại loại như vậy.“", "es": "El cliente señala los auriculares: «Busco algo así.»", "pt": "O cliente aponta para os fones: «Procuro algo assim.»", "ru": "Клиент показывает на наушники: «Ищу что-то в этом роде.»", "ti": "ዓሚል ናብ መስምዒ ይጠቁም፦ „ከምዚ ዝኣመሰለ እደሊ ኣለኹ።“"}, "warum": {"de": "Er kann es nicht in Worte fassen – ein Modell vorlegen und die Reaktion abwarten.", "ar": "لا يستطيع التعبير بالكلمات – اعرض نموذجاً وانتظر رد الفعل.", "tr": "Kelimelere dökemiyor – bir model göster ve tepkiyi bekle.", "vi": "Anh ấy không diễn đạt được bằng lời – hãy đưa một mẫu ra và chờ phản ứng.", "es": "No puede expresarlo con palabras: presenta un modelo y espera la reacción.", "pt": "Ele não consegue dizer em palavras: apresente um modelo e espere a reação.", "ru": "Он не может выразить словами – покажите модель и ждите реакции.", "ti": "ብቓላት ክገልጾ ኣይክእልን – ሞዴል ኣርኢ እሞ ግብረ መልሲ ተጸበ።"}, "g": "kopfhoerer"}, {"emoji": "🥓", "ziel": "a", "text": {"de": "Kundin: „Zweihundert Gramm gekochten Schinken, bitte.“", "ar": "الزبونة: «مئتا غرام لحم خنزير مسلوق، من فضلك.»", "tr": "Müşteri: „İki yüz gram haşlanmış jambon, lütfen.“", "vi": "Khách: „Cho tôi hai trăm gam giăm bông luộc.“", "es": "Clienta: «Doscientos gramos de jamón cocido, por favor.»", "pt": "Cliente: «Duzentos gramas de fiambre, por favor.»", "ru": "Клиентка: «Двести граммов варёной ветчины, пожалуйста.»", "ti": "ዓሚል፦ „ክልተ ሚእቲ ግራም ዝበሰለ ስጋ በጃኹም።“"}, "warum": {"de": "Sie weiß es genau. Höchstens noch: „Am Stück oder geschnitten?“", "ar": "هي تعرف بالضبط. على الأكثر: «قطعة واحدة أم شرائح؟»", "tr": "Tam olarak biliyor. En fazla: „Bütün mü dilimli mi?“", "vi": "Chị ấy biết chính xác. Nhiều nhất là: „Để nguyên hay thái lát?“", "es": "Lo sabe exactamente. Como mucho: «¿En una pieza o en lonchas?»", "pt": "Ela sabe exatamente. No máximo: «Inteiro ou fatiado?»", "ru": "Она точно знает. Максимум: «Куском или нарезать?»", "ti": "ብልክዕ ትፈልጥ። ዝያዳ፦ „ምሉእ ድ a dinle, sonra çıkarım yap, sonra göster.", "vi": "Hỏi trước, nghe, suy ra, rồi mới đưa hàng.", "es": "Primero preguntar, luego escuchar, deducir y después mostrar.", "pt": "Primeiro perguntar, depois ouvir, concluir e só então mostrar.", "ru": "Сначала спросить, затем выслушать, сделать вывод и показать.", "ti": "መጀመርታ ሕተት፡ ስማዕ፡ ድምድም፡ ድሕሪኡ ኣርኢ።"}}, {"typ": "luecke", "frage": {"de": "Setze den Merksatz richtig zusammen.", "ar": "أكمل الجملة التذكيرية بشكل صحيح.", "tr": "Hatırlatma cümlesini doğru tamamla.", "vi": "Hoàn thành câu ghi nhớ cho đúng.", "es": "Completa correctamente la frase para recordar.", "pt": "Completa corretamente a frase para memorizar.", "ru": "Собери правило правильно.", "ti": "ነቲ መዘከሪ ሓሳብ ብልክዕ ምላእ።"}, "satz": {"de": "Wird der Bedarf über eine {0} ermittelt, ist das die {1} Bedarfsermittlung. Erfolgt sie über den Kontakt mit der {2}, ist sie {3}.", "ar": "إذا تم تحديد الحاجة عبر سلسلة أسئلة، فهذا تحديد مباشر. وإذا تم عبر التواصل مع البضاعة، فهو غير مباشر.", "tr": "İhtiyaç bir soru zinciriyle belirlenirse bu doğrudan belirlemedir. Ürünle temas yoluyla olursa dolaylıdır.", "vi": "Nếu nhu cầu được xác định qua chuỗi câu hỏi thì đó là cách trực tiếp. Nếu qua tiếp xúc với hàng hóa thì là gián tiếp.", "es": "Si la necesidad se determina con una cadena de preguntas, es la forma directa. Si ocurre por el contacto con la mercancía, es indirecta.", "pt": "Se a necessidade é determinada por uma cadeia de perguntas, é a forma direta. Se acontece pelo contacto com a mercadoria, é indireta.", "ru": "Если потребность выявляют цепочкой вопросов – это прямое выявление. Если через контакт с товаром – косвенное.", "ti": "ድሌት ብተኸታታሊ ሕቶታት እንተተፈሊጡ ቀጥታዊ እዩ። ብርክብ ምስ ኣቕሓ እንተኾይኑ ተዘዋዋሪ እዩ።"}, "loesungen": [{"de": "Fragekette"}, {"de": "direkte"}, {"de": "Ware"}, {"de": "indirekt"}], "ablenker": [{"de": "Testangebot"}, {"de": "Kasse"}, {"de": "geschlossen"}], "warum": {"de": "Fragekette → direkt. Kontakt mit der Ware → indirekt (warenbezogen).", "ar": "سلسلة أسئلة ← مباشر. تواصل مع البضاعة ← غير مباشر.", "tr": "Soru zinciri → doğrudan. Ürünle temas → dolaylı.", "vi": "Chuỗi câu hỏi → trực tiếp. Tiếp xúc với hàng → gián tiếp.", "es": "Cadena de preguntas → directa. Contacto con la mercancía → indirecta.", "pt": "Cadeia de perguntas → direta. Contacto com a mercadoria → indireta.", "ru": "Цепочка вопросов → прямое. Контакт с товаром → косвенное.", "ti": "ተኸታታሊ ሕቶታት → ቀጥታዊ። ርክብ ምስ ኣቕሓ → ተዘዋዋሪ።"}}, {"typ": "quiz", "frage": {"de": "Welcher Nachteil gehört zur indirekten Bedarfsermittlung?", "ar": "أي عيب يخص التحديد غير المباشر؟", "tr": "Hangi dezavantaj dolaylı belirlemeye aittir?", "vi": "Nhược điểm nào thuộc về cách gián tiếp?", "es": "¿Qué desventaja corresponde a la forma indirecta?", "pt": "Que desvantagem pertence à forma indireta?", "ru": "Какой недостаток относится к косвенному выявлению?", "ti": "ኣየናይ ጉድለት ናይ ተዘዋዋሪ ኣገባብ እዩ?"}, "optionen": [{"de": "Der Kunde könnte sich ausgefragt fühlen.", "ar": "قد يشعر الزبون أنه يُستجوب.", "tr": "Müşteri sorguya çekilmiş hissedebilir.", "vi": "Khách có thể thấy bị tra hỏi.", "es": "El cliente puede sentirse interrogado.", "pt": "O cliente pode sentir-se interrogado.", "ru": "Клиент может почувствовать себя допрашиваемым.", "ti": "ዓሚል ከም ዝሕተት ኮይኑ ክስምዖ ይኽእል።"}, {"de": "Ein unpassendes Testangebot kann den Kunden verschrecken.", "ar": "عرض تجريبي غير مناسب قد يُنفّر الزبون.", "tr": "Uygun olmayan bir deneme sunumu müşteriyi korkutabilir.", "vi": "Hàng thử không phù hợp có thể làm khách e ngại.", "es": "Una oferta de prueba inadecuada puede asustar al cliente.", "pt": "Uma oferta de teste desadequada pode afastar o cliente.", "ru": "Неподходящее пробное предложение может отпугнуть клиента.", "ti": "ዘይሰማማዕ ናይ ፈተነ ቀረብ ንዓሚል ከሰምብዶ ይኽእል።"}, {"de": "Der Kunde kommt erst spät mit der Ware in Kontakt.", "ar": "الزبون يتواصل مع البضاعة متأخراً.", "tr": "Müşteri ürünle çok geç temas eder.", "vi": "Khách tiếp xúc với hàng quá muộn.", "es": "El cliente entra en contacto con la mercancía muy tarde.", "pt": "O cliente só contacta com a mercadoria tarde.", "ru": "Клиент поздно соприкасается с товаром.", "ti": "ዓሚል ምስ ኣቕሓ ደንጉዩ ይራኸብ።"}, {"de": "Der Verkäufer muss nach der Menge fragen.", "ar": "على البائع أن يسأل عن الكمية.", "tr": "Satıcı miktarı sormak zorundadır.", "vi": "Người bán phải hỏi về số lượng.", "es": "El vendedor tiene que preguntar por la cantidad.", "pt": "O vendedor tem de perguntar pela quantidade.", "ru": "Продавец должен спросить о количестве.", "ti": "ሸያጢ ብዛዕባ መጠን ክሓትት ኣለዎ።"}], "richtig": 1, "erklaerung": {"de": "Passt das Testangebot gar nicht, verliert der Verkäufer an Fachkompetenz. Antwort 1 und 3 sind Nachteile der direkten Form, Antwort 4 gehört zum Aushändigungsverkauf.", "ar": "إذا كان العرض التجريبي غير مناسب إطلاقاً، يفقد البائع كفاءته المهنية. الإجابتان 1 و3 عيوب الشكل المباشر، والإجابة 4 تخص بيع التسليم.", "tr": "Deneme sunumu hiç uymazsa satıcı uzmanlık itibarını kaybeder. 1 ve 3 doğrudan biçimin dezavantajı, 4 teslim satışına aittir.", "vi": "Nếu hàng thử hoàn toàn không hợp, người bán mất uy tín chuyên môn. Đáp án 1 và 3 là nhược điểm của cách trực tiếp, đáp án 4 thuộc bán giao hàng.", "es": "Si la oferta de prueba no encaja, el vendedor pierde competencia profesional. Las respuestas 1 y 3 son desventajas de la forma directa; la 4 pertenece a la venta de entrega.", "pt": "Se a oferta de teste não encaixa, o vendedor perde competência profissional. As respostas 1 e 3 são desvantagens da forma direta; a 4 pertence à venda de entrega.", "ru": "Если пробное предложение совсем не подходит, продавец теряет профессиональный авторитет. Ответы 1 и 3 – недостатки прямой формы, ответ 4 относится к отпуску товара.", "ti": "እቲ ናይ ፈተነ ቀረብ ፈጺሙ እንተዘይሰማሚዑ ሸያጢ ሞያዊ እምነት የጥፍእ። መልሲ 1ን 3ን ናይ ቀጥታዊ ጉድለታት እዮም፡ መልሲ 4 ናይ ምርካብ ሸቐጥ እዩ።"}, "profi": {"frage": {"de": "Eine Kundin sagt: „Ich hätte gern etwas Schönes für meine Mutter.“ Was tust du zuerst – und warum?", "ar": "زبونة تقول: «أريد شيئاً جميلاً لأمي.» ماذا تفعل أولاً – ولماذا؟", "tr": "Bir müşteri: „Annem için güzel bir şey istiyorum.“ Önce ne yaparsın – neden?", "vi": "Một khách nói: „Tôi muốn một món gì đó đẹp cho mẹ tôi.“ Bạn làm gì trước – và vì sao?", "es": "Una clienta dice: «Quisiera algo bonito para mi madre.» ¿Qué haces primero y por qué?", "pt": "Uma cliente diz: «Queria algo bonito para a minha mãe.» O que fazes primeiro – e porquê?", "ru": "Клиентка говорит: «Я хотела бы что-нибудь красивое для мамы.» Что вы сделаете сначала и почему?", "ti": "ሓንቲ ዓሚል፦ „ንኣደይ ጽብቕቲ ነገር እደሊ።“ መጀመርታ እንታይ ትገብር – ስለምንታይ?"}, "optionen": [{"de": "Offene Fragen nach Alter, Anlass und Preisrahmen stellen – der Wunsch ist noch unklar.", "ar": "طرح أسئلة مفتوحة عن العمر والمناسبة والسعر – الرغبة غير واضحة بعد.", "tr": "Yaş, vesile ve fiyat aralığı hakkında açık sorular sormak – istek henüz belirsiz.", "vi": "Đặt câu hỏi mở về tuổi, dịp và khoảng giá – mong muốn còn chưa rõ.", "es": "Hacer preguntas abiertas sobre edad, ocasión y precio: el deseo aún no está claro.", "pt": "Fazer perguntas abertas sobre idade, ocasião e preço: o desejo ainda não é claro.", "ru": "Задать открытые вопросы о возрасте, поводе и бюджете – желание ещё неясно.", "ti": "ብዛዕባ ዕድመ፡ ኣጋጣምን ዋጋን ክፉት ሕቶታት ምሕታት – ድሌት ጌና ንጹር ኣይኮነን።"}, {"de": "Sofort das teuerste Produkt vorlegen – das wirkt hochwertig.", "ar": "عرض أغلى منتج فوراً – يبدو فاخراً.", "tr": "Hemen en pahalı ürünü göstermek – kaliteli görünür.", "vi": "Đưa ngay sản phẩm đắt nhất – trông sang trọng.", "es": "Presentar enseguida el producto más caro: parece de calidad.", "pt": "Apresentar logo o produto mais caro: parece de qualidade.", "ru": "Сразу показать самый дорогой товар – выглядит солидно.", "ti": "ብቕጽበት እቲ ዝኸበረ ኣቕሓ ምቕራብ – ክቡር ይመስል።"}, {"de": "Fragen: „Sonst noch etwas?“ – das spart Zeit.", "ar": "السؤال: «شيء آخر؟» – يوفر الوقت.", "tr": "„Başka bir şey?“ diye sormak – zaman kazandırır.", "vi": "Hỏi: „Còn gì nữa không?“ – tiết kiệm thời gian.", "es": "Preguntar: «¿Algo más?» – ahorra tiempo.", "pt": "Perguntar: «Mais alguma coisa?» – poupa tempo.", "ru": "Спросить: «Что-нибудь ещё?» – экономит время.", "ti": "„ካልእ ነገር?“ ምሕታት – ግዜ የዋሕልል።"}], "richtig": 0, "erklaerung": {"de": "„Etwas Schönes“ ist kein Bedarf, sondern ein Gefühl. Erst die Fragekette macht daraus eine Warenvorauswahl.", "ar": "«شيء جميل» ليس حاجة بل شعور. سلسلة الأسئلة وحدها تحوّله إلى اختيار مسبق للبضاعة.", "tr": "„Güzel bir şey“ bir ihtiyaç değil, bir duygudur. Ancak soru zinciri bunu ürün ön seçimine dönüştürür.", "vi": "„Cái gì đó đẹp“ không phải là nhu cầu mà là cảm xúc. Chỉ chuỗi câu hỏi mới biến nó thành việc chọn hàng.", "es": "«Algo bonito» no es una necesidad, es un sentimiento. Solo la cadena de preguntas lo convierte en una preselección.", "pt": "«Algo bonito» não é uma necessidade, é um sentimento. Só a cadeia de perguntas o transforma numa pré-seleção.", "ru": "«Что-нибудь красивое» – это не потребность, а чувство. Только цепочка вопросов превращает его в отбор товара.", "ti": "„ጽብቕቲ ነገር“ ድሌት ዘይኮነ ስምዒት እዩ። ተኸታታሊ ሕቶታት ጥራይ ናብ ምርጫ ኣቕሓ ይቕይሮ።"}}}]}, {"id": "lf4-m1-verkaufsraum", "titel": {"de": "LF 4 · M 1 – Verkaufsraum und Visual Merchandising"}, "lf": 4, "modul": 1, "sprachen": ["de", "ar", "tr", "vi", "es", "pt", "ru", "ti"], "profi": true, "merksatz": {"de": "Ein Laden verkauft nicht nur Ware, sondern auch ein Gefühl. Wer billig sein will, spart an der Gestaltung (Discountstrategie). Wer mit Atmosphäre gewinnen will, investiert darin (Erlebnisstrategie). Die Mittel dafür heißen Visual Merchandising.", "ar": "المتجر لا يبيع البضاعة فقط، بل يبيع شعوراً أيضاً. من يريد أن يكون رخيصاً يوفّر في التصميم (استراتيجية الخصم). من يريد الكسب بالأجواء يستثمر فيها (استراتيجية التجربة). والوسيلة لذلك اسمها Visual Merchandising.", "tr": "Bir mağaza sadece mal değil, bir duygu da satar. Ucuz olmak isteyen tasarımdan kısar (indirim stratejisi). Atmosferle kazanmak isteyen ona yatırım yapar (deneyim stratejisi). Bunun aracı Visual Merchandising'dir.", "vi": "Cửa hàng không chỉ bán hàng mà còn bán cảm giác. Ai muốn rẻ thì tiết kiệm ở khâu trang trí (chiến lược giá rẻ). Ai muốn thắng bằng không khí thì đầu tư vào đó (chiến lược trải nghiệm). Công cụ cho việc đó gọi là Visual Merchandising.", "es": "Una tienda no solo vende mercancía, también vende un sentimiento. Quien quiere ser barato ahorra en el diseño (estrategia de descuento). Quien quiere ganar con ambiente invierte en él (estrategia de experiencia). El medio se llama Visual Merchandising.", "pt": "Uma loja não vende só mercadoria, vende também um sentimento. Quem quer ser barato poupa na decoração (estratégia de desconto). Quem quer ganhar com ambiente investe nele (estratégia de experiência). O meio chama-se Visual Merchandising.", "ru": "Магазин продаёт не только товар, но и чувство. Кто хочет быть дешёвым, экономит на оформлении (дискаунт-стратегия). Кто хочет выигрывать атмосферой, вкладывает в неё (стратегия впечатления). Средство для этого — Visual Merchandising.", "ti": "ሓደ ድኳን ኣቕሓ ጥራይ ዘይኮነ ስምዒት እውን ይሸይጥ። ሕሱር ክኸውን ዝደሊ ኣብ ምጽባቕ የድሕን (ናይ ሕሱር ስትራተጂ)። ብህዋህው ክዕወት ዝደሊ ኣብኡ የውፍር (ናይ ተመክሮ ስትራተጂ)። እቲ መሳርሒ Visual Merchandising ይበሃል።"}, "aufgaben": [{"typ": "info", "bild": "🏬", "text": {"de": "Zwei Wege, einen Laden zu führen:\n\n① Discountstrategie – dauerhaft niedrige Preise. Einfache Einrichtung, Ware oft im Karton, kaum Beratung.\n② Erlebnisstrategie – Einkaufen wird zum Erlebnis. Licht, Farben, Düfte, Ruhezonen, viel Beratung.\n\nDie Verkaufsraumgestaltung hat drei Elemente: Ladenumfeld, Verkaufsräume, Platzierung der Waren.\nVisual Merchandising = optische Verkaufsförderung: die Kunden von der Straße bis zum Kauf führen.", "ar": "طريقتان لإدارة متجر:\n\n① استراتيجية الخصم – أسعار منخفضة دائماً. تجهيز بسيط، البضاعة غالباً في كرتون، استشارة قليلة.\n② استراتيجية التجربة – التسوق يصبح تجربة. إضاءة، ألوان، روائح، مناطق راحة، استشارة كثيرة.\n\nتصميم قاعة البيع له ثلاثة عناصر: محيط المتجر، قاعات البيع، وضع البضائع.\nVisual Merchandising = ترويج بصري: قيادة الزبون من الشارع حتى الشراء.", "tr": "Bir mağazayı yönetmenin iki yolu:\n\n① İndirim stratejisi – sürekli düşük fiyat. Basit donanım, ürün çoğu zaman kolide, az danışmanlık.\n② Deneyim stratejisi – alışveriş bir yaşantı olur. Işık, renk, koku, dinlenme alanları, bol danışmanlık.\n\nSatış alanı tasarımının üç ögesi: mağaza çevresi, satış alanları, ürün yerleşimi.\nVisual Merchandising = görsel satış desteği: müşteriyi sokaktan satın almaya götürmek.", "vi": "Hai cách điều hành một cửa hàng:\n\n① Chiến lược giá rẻ – giá thấp lâu dài. Trang bị đơn giản, hàng thường để trong thùng, ít tư vấn.\n② Chiến lược trải nghiệm – mua sắm trở thành trải nghiệm. Ánh sáng, màu sắc, mùi hương, khu nghỉ, tư vấn nhiều.\n\nThiết kế gian bán hàng có ba yếu tố: môi trường cửa hàng, không gian bán, cách đặt hàng hóa.\nVisual Merchandising = xúc tiến bán hàng bằng thị giác: dẫn khách từ ngoài đường đến lúc mua.", "es": "Dos formas de llevar una tienda:\n\n① Estrategia de descuento – precios bajos permanentes. Instalación sencilla, mercancía a menudo en cajas, poco asesoramiento.\n② Estrategia de experiencia – comprar se convierte en vivencia. Luz, colores, aromas, zonas de descanso, mucho asesoramiento.\n\nEl diseño de la sala de ventas tiene tres elementos: entorno de la tienda, salas de venta, colocación de la mercancía.\nVisual Merchandising = promoción visual: llevar al cliente desde la calle hasta la compra.", "pt": "Duas formas de gerir uma loja:\n\n① Estratégia de desconto – preços baixos permanentes. Equipamento simples, mercadoria muitas vezes em caixas, pouco aconselhamento.\n② Estratégia de experiência – comprar torna-se vivência. Luz, cores, aromas, zonas de descanso, muito aconselhamento.\n\nO design do espaço de venda tem três elementos: envolvente da loja, espaços de venda, colocação da mercadoria.\nVisual Merchandising = promoção visual: levar o cliente da rua até à compra.", "ru": "Два пути вести магазин:\n\n① Дискаунт-стратегия – постоянно низкие цены. Простое оборудование, товар часто в коробках, почти без консультаций.\n② Стратегия впечатления – покупка становится переживанием. Свет, цвета, ароматы, зоны отдыха, много консультаций.\n\nОформление торгового зала имеет три элемента: окружение магазина, торговые помещения, размещение товаров.\nVisual Merchandising = визуальное стимулирование продаж: вести клиента с улицы до покупки.", "ti": "ድኳን ንምምራሕ ክልተ መንገዲ፦\n\n① ናይ ሕሱር ስትራተጂ – ቀጻሊ ትሑት ዋጋ። ቀሊል ኣቕሑ፡ ኣቕሓ መብዛሕትኡ ግዜ ኣብ ካርቶን፡ ውሑድ ምኽሪ።\n② ናይ ተመክሮ ስትራተጂ – ዕድጊ ተመክሮ ይኸውን። ብርሃን፡ ሕብርታት፡ መኣዛ፡ መዕረፊ ቦታታት፡ ብዙሕ ምኽሪ።\n\nምድላው መሸጢ ቦታ ሰለስተ ነገራት ኣለዎ፦ ከባቢ ድኳን፡ መሸጢ ክፍልታት፡ ኣቀማምጣ ኣቑሑ።\nVisual Merchandising = ብዓይኒ ዝረአ ምትብባዕ ሽያጥ።"}, "g": "laden"}, {"typ": "sortier", "frage": {"de": "Preisfuchs oder Lindemanns Markthalle? Welche Strategie steckt dahinter?", "ar": "متجر الأسعار أم قاعة السوق؟ أي استراتيجية وراء ذلك؟", "tr": "Ucuzcu mu, pazar salonu mu? Arkasında hangi strateji var?", "vi": "Cửa hàng giá rẻ hay chợ Lindemanns? Đằng sau là chiến lược nào?", "es": "¿Tienda de precios o mercado Lindemanns? ¿Qué estrategia hay detrás?", "pt": "Loja de preços ou mercado Lindemanns? Que estratégia está por trás?", "ru": "Дискаунтер или рынок Линдеманна? Какая стратегия за этим?", "ti": "ናይ ሕሱር ድኳን ድዩ ናይ ተመክሮ? ኣየናይ ስትራተጂ እዩ ዘሎ?"}, "ecken": [{"id": "d", "name": {"de": "Discountstrategie", "ar": "استراتيجية الخصم", "tr": "İndirim stratejisi", "vi": "Chiến lược giá rẻ", "es": "Estrategia de descuento", "pt": "Estratégia de desconto", "ru": "Дискаунт-стратегия", "ti": "ናይ ሕሱር ስትራተጂ"}}, {"id": "e", "name": {"de": "Erlebnisstrategie", "ar": "استراتيجية التجربة", "tr": "Deneyim stratejisi", "vi": "Chiến lược trải nghiệm", "es": "Estrategia de experiencia", "pt": "Estratégia de experiência", "ru": "Стратегия впечатления", "ti": "ናይ ተመክሮ ስትራተጂ"}}], "karten": [{"emoji": "📦", "ziel": "d", "text": {"de": "Die Ware steht in Kartons auf Paletten.", "ar": "البضاعة في كراتين على منصات.", "tr": "Ürünler paletlerde kolilerde duruyor.", "vi": "Hàng để trong thùng trên pallet.", "es": "La mercancía está en cajas sobre palés.", "pt": "A mercadoria está em caixas sobre paletes.", "ru": "Товар стоит в  (colocación, mundos temáticos, asesoramiento)", "pt": "Incentivar a compra (colocação, mundos temáticos, aconselhamento)", "ru": "Побудить к покупке (размещение, тематические миры, консультация)", "ti": "ንምግዛእ ምትብባዕ"}}], "warum": {"de": "Von der Straße bis zum Kaufabschluss: auffallen – hereinlocken – halten – verkaufen.", "ar": "من الشارع حتى إتمام الشراء: لفت الانتباه – الجذب – الإبقاء – البيع.", "tr": "Sokaktan satışa: dikkat çek – içeri çek – tut – sat.", "vi": "Từ ngoài đường đến khi mua: gây chú ý – thu hút – giữ chân – bán.", "es": "De la calle a la compra: destacar – atraer – retener – vender.", "pt": "Da rua à compra: destacar – atrair – reter – vender.", "ru": "С улицы до покупки: заметить – заманить – удержать – продать.", "ti": "ካብ ጎደና ክሳብ ምግዛእ፦ ምፍላጥ – ምስሓብ – ምሓዝ – ምሻጥ።"}}, {"typ": "fehler", "frage": {"de": "Drei Sätze stimmen nicht. Finde sie.", "ar": "ثلاث جمل غير صحيحة. اعثر عليها.", "tr": "Üç cümle yanlış. Onları bul.", "vi": "Ba câu không đúng. Hãy tìm ra.", "es": "Tres frases no son correctas. Encuéntralas.", "pt": "Três frases não estão certas. Encontra-as.", "ru": "Три предложения неверны. Найди их.", "ti": "ሰለስተ ምሉእ ሓሳባት ጌጋ እዮም። ርኸቦም።"}, "bild": "🛒", "aussagen": [{"falsch": false, "text": {"de": "Zur Ladeneinrichtung gehören Warenträger wie Regale, Gondeln und Vitrinen.", "ar": "من تجهيزات المتجر حوامل البضائع كالرفوف والجزر والفترينات.", "tr": "Mağaza donanımına raf, gondol ve vitrin gibi ürün taşıyıcıları dahildir.", "vi": "Trang bị cửa hàng gồm giá kệ, quầy đảo và tủ kính.", "es": "Al equipamiento pertenecen soportes como estanterías, góndolas y vitrinas.", "pt": "Ao equipamento pertencem suportes como prateleiras, gôndolas e vitrinas.", "ru": "К оборудованию относятся носители товара: стеллажи, гондолы, витрины.", "ti": "ኣብ ኣቕሑ ድኳን ከም መንደቕ፡ ጎንዶላን መርኣዪ ካቢነትን ይርከቡ።"}}, {"falsch": true, "text": {"de": "Der Einkaufswagen ist ein Warenträger.", "ar": "عربة التسوق هي حامل بضاعة.", "tr": "Alışveriş arabası bir ürün taşıyıcısıdır.", "vi": "Xe đẩy mua hàng là giá trưng bày hàng.", "es": "El carrito de la compra es un soporte de mercancía.", "pt": "O carrinho de compras é um suporte de mercadoria.", "ru": "Тележка для покупок – это носитель товара.", "ti": "ዓረብያ ዕድጊ መሰከሚ ኣቕሓ እዩ።"}, "warum": {"de": "Nein, der Einkaufswagen ist eine Verkaufshilfe – wie Kasse und Umkleidekabine.", "ar": "لا، عربة التسوق وسيلة مساعدة للبيع – مثل الصندوق وغرفة القياس.", "tr": "Hayır, alışveriş arabası bir satış yardımcısıdır – kasa ve kabin gibi.", "vi": "Không, xe đẩy là phương tiện hỗ trợ bán hàng – như quầy thu ngân và phòng thử đồ.", "es": "No, el carrito es una ayuda de venta, como la caja y el probador.", "pt": "Não, o carrinho é um auxiliar de venda, como a caixa e o provador.", "ru": "Нет, тележка – вспомогательное средство продажи, как касса и примерочная.", "ti": "ኣይፋል፡ ዓረብያ ዕድጊ ናይ ሽያጥ መሓገዚ እዩ።"}}, {"falsch": false, "text": {"de": "Das Ladenumfeld sorgt dafür, dass Kunden den Laden sofort wiedererkennen.", "ar": "محيط المتجر يجعل الزبائن يتعرفون عليه فوراً.", "tr": "Mağaza çevresi müşterilerin mağazayı hemen tanımasını sağlar.", "vi": "Môi trường cửa hàng giúp khách nhận ra ngay cửa hàng.", "es": "El entorno hace que los clientes reconozcan la tienda enseguida.", "pt": "A envolvente faz com que os clientes reconheçam logo a loja.", "ru": "Окружение магазина обеспечивает узнаваемость.", "ti": "ከባቢ ድኳን ዓማዊል ብቕጽበት ክፈልጥዎ ይገብር።"}}, {"falsch": true, "text": {"de": "Visual Merchandising bedeutet, die Ware möglichst billig einzukaufen.", "ar": "Visual Merchandising يعني شراء البضاعة بأرخص سعر.", "tr": "Visual Merchandising ürünü mümkün olduğunca ucuza almak demektir.", "vi": "Visual Merchandising nghĩa là mua hàng càng rẻ càng tốt.", "es": "Visual Merchandising significa comprar la mercancía lo más barata posible.", "pt": "Visual Merchandising significa comprar a mercadoria o mais barato possível.", "ru": "Visual Merchandising означает закупать товар как можно дешевле.", "ti": "Visual Merchandising ማለት ኣቕሓ ብዝሓሰረ ምግዛእ ማለት እዩ።"}, "warum": {"de": "Visual Merchandising ist optische Verkaufsförderung – mit dem Einkauf hat es nichts zu tun.", "ar": "هو ترويج بصري للمبيعات – لا علاقة له بالشراء.", "tr": "Bu görsel satış desteğidir – satın almayla ilgisi yoktur.", "vi": "Đó là xúc tiến bán hàng bằng thị giác – không liên quan đến việc nhập hàng.", "es": "Es promoción visual de ventas; no tiene que ver con la compra.", "pt": "É promoção visual de vendas; nada tem a ver com a compra.", "ru": "Это визуальное стимулирование продаж, к закупке отношения не имеет.", "ti": "ብዓይኒ ዝረአ ምትብባዕ ሽያጥ እዩ፡ ምስ ዕድጊ ዝምድና የብሉን።"}}, {"falsch": false, "text": {"de": "Ein Ziel der Umgestaltung ist, sich vom Onlinehandel abzugrenzen.", "ar": "من أهداف إعادة التصميم التميّز عن التجارة الإلكترونية.", "tr": "Yenilemenin bir amacı online ticaretten ayrışmaktır.", "vi": "Một mục tiêu của việc cải tạo là tạo khác biệt với thương mại trực tuyến.", "es": "Un objetivo de la reforma es diferenciarse del comercio online.", "pt": "Um objetivo da remodelação é diferenciar-se do comércio online.", "ru": "Одна из целей перепланировки – отличаться от онлайн-торговли.", "ti": "ሓደ ዕላማ ምምሕያሽ ካብ ኦንላይን ንግዲ ምፍላይ እዩ።"}}, {"falsch": true, "text": {"de": "Beim Erlebniskauf erwartet der Kunde vor allem lange Wartezeiten.", "ar": "في تجربة الشراء يتوقع الزبون أوقات انتظار طويلة.", "tr": "Deneyim alışverişinde müşteri uzun bekleme süreleri bekler.", "vi": "Khi mua sắm trải nghiệm, khách mong đợi thời gian chờ lâu.", "es": "En la compra-experiencia el cliente espera largas esperas.", "pt": "Na compra-experiência o cliente espera longas esperas.", "ru": "При покупке-впечатлении клиент ожидает долгого ожидания.", "ti": "ኣብ ናይ ተመክሮ ዕድጊ ዓሚል ነዊሕ ምጽባይ ይጽበ።"}, "warum": {"de": "Umgekehrt: Er erwartet kurze Wartezeiten, gute Beratung und angenehme Atmosphäre.", "ar": "العكس: يتوقع انتظاراً قصيراً واستشارة جيدة وأجواء مريحة.", "tr": "Tam tersi: kısa bekleme, iyi danışmanlık ve hoş bir atmosfer bekler.", "vi": "Ngược lại: khách mong chờ ít, tư vấn tốt và không khí dễ chịu.", "es": "Al revés: espera poca espera, buen asesoramiento y ambiente agradable.", "pt": "Ao contrário: espera pouca espera, bom aconselhamento e ambiente agradável.", "ru": "Наоборот: он ждёт коротких очередей, хорошей консультации и приятной атмосферы.", "ti": "ብኣንጻሩ፦ ሓጺር ምጽባይ፡ ጽቡቕ ምኽርን ምቹእ ህዋህውን ይጽበ።"}}], "g": "einkaufswagen"}, {"typ": "luecke", "frage": {"de": "Setze den Merksatz richtig zusammen.", "ar": "أكمل الجملة التذكيرية.", "tr": "Hatırlatma cümlesini tamamla.", "vi": "Hoàn thành câu ghi nhớ.", "es": "Completa la frase para recordar.", "pt": "Completa a frase para memorizar.", "ru": "Собери правило.", "ti": "ነቲ መዘከሪ ሓሳብ ምላእ።"}, "satz": {"de": "Wer dauerhaft billig sein will, spart an der Gestaltung: {0}. Wer Kunden mit Atmosphäre und Service gewinnt, nutzt die {1}. Die Mittel dafür heißen {2}. Je länger ein Kunde bleibt, desto höher ist die {3}.", "ar": "من يريد أن يكون رخيصاً دائماً يوفر في التصميم: استراتيجية الخصم. من يكسب الزبائن بالأجواء والخدمة يستخدم استراتيجية التجربة. الوسيلة اسمها Visual Merchandising. وكلما بقي الزبون أطول ارتفعت مدة البقاء.", "tr": "Sürekli ucuz olmak isteyen tasarımdan kısar: indirim stratejisi. Müşteriyi atmosfer ve hizmetle kazanan deneyim stratejisini kullanır. Aracı Visual Merchandising'dir. Müşteri ne kadar uzun kalırsa kalış süresi o kadar artar.", "vi": "Ai muốn rẻ lâu dài thì tiết kiệm ở trang trí: chiến lược giá rẻ. Ai thắng khách bằng không khí và dịch vụ thì dùng chiến lược trải nghiệm. Công cụ là Visual Merchandising. Khách ở càng lâu, thời gian lưu lại càng cao.", "es": "Quien quiere ser barato ahorra en el diseño: estrategia de descuento. Quien gana clientes con ambiente y servicio usa la estrategia de experiencia. El medio se llama Visual Merchandising. Cuanto más se queda el cliente, mayor es el tiempo de permanencia.", "pt": "Quem quer ser barato poupa na decoração: estratégia de desconto. Quem ganha clientes com ambiente e serviço usa a estratégia de experiência. O meio chama-se Visual Merchandising. Quanto mais o cliente fica, maior é o tempo de permanência.", "ru": "Кто хочет быть дешёвым, экономит на оформлении: дискаунт-стратегия. Кто побеждает атмосферой и сервисом, использует стратегию впечатления. Средство — Visual Merchandising. Чем дольше клиент остаётся, тем выше время пребывания.", "ti": "ሕሱር ክኸውን ዝደሊ ኣብ ምጽባቕ የድሕን፦ ናይ ሕሱር ስትራተጂ። ብህዋህውን ኣገልግሎትን ዝዕወት ናይ ተመክሮ ስትራተጂ ይጥቀም። እቲ መሳርሒ Visual Merchandising ይበሃል። ዓሚል ነዊሕ እንተጸኒሑ ናይ ምጽናሕ ግዜ ይውስኽ።"}, "loesungen": [{"de": "Discountstrategie"}, {"de": "Erlebnisstrategie"}, {"de": "Visual Merchandising"}, {"de": "Verweildauer"}], "ablenker": [{"de": "Bedarfsbündel"}, {"de": "Shop-in-Shop"}]}, {"typ": "quiz", "frage": {"de": "Prüfungsaufgabe: Die Kaufhaus Hansa GmbH gestaltet ihre Elektroabteilung um. Welche vier Ziele gehören dazu? (vier Antworten sind richtig)", "ar": "سؤال امتحان: شركة Hansa تعيد تصميم قسم الإلكترونيات. أي أربعة أهداف تنتمي لذلك؟ (أربع إجابات صحيحة)", "tr": "Sınav sorusu: Hansa mağazası elektronik bölümünü yeniliyor. Hangi dört hedef buna aittir? (dört cevap doğru)", "vi": "Câu hỏi thi: Hansa cải tạo khu điện máy. Bốn mục tiêu nào thuộc về việc này? (bốn đáp án đúng)", "es": "Pregunta de examen: Hansa reforma su sección de electrónica. ¿Qué cuatro objetivos corresponden? (cuatro respuestas correctas)", "pt": "Pergunta de exame: a Hansa remodela a secção de eletrónica. Que quatro objetivos pertencem? (quatro respostas certas)", "ru": "Экзаменационный вопрос: Hansa перестраивает отдел электроники. Какие четыре цели сюда относятся? (четыре верных ответа)", "ti": "ናይ ፈተና ሕቶ፦ Hansa ክፍሊ ኤሌክትሮኒክ የመሓይሽ። ኣየኖት ኣርባዕተ ዕላማታት እዮም? (ኣርባዕተ መልስታት ቅኑዓት)"}, "optionen": [{"de": "Das Einkaufserlebnis der Kunden steigern", "ar": "رفع تجربة التسوق للزبائن", "tr": "Müşterinin alışveriş deneyimini artırmak", "vi": "Nâng cao trải nghiệm mua sắm của khách", "es": "Mejorar la experiencia de compra", "pt": "Melhorar a experiência de compra", "ru": "Повысить впечатление от покупки", "ti": "ናይ ዓማዊል ተመክሮ ዕድጊ ምዕባይ"}, {"de": "Neue  Betriebssicht (Abgrenzung, Umsatz). Sparen bei Löhnen oder Öffnungszeiten ist kein Ziel der Umgestaltung.", "ar": "هدفان من منظور الزبون (التجربة، حوافز الشراء) وهدفان من منظور الشركة (التميّز، المبيعات). التوفير في الرواتب أو الساعات ليس هدفاً.", "tr": "İkisi müşteri açısından (deneyim, teşvik), ikisi işletme açısından (ayrışma, ciro). Ücret veya saat kısmak amaç değildir.", "vi": "Hai mục tiêu từ phía khách (trải nghiệm, kích thích mua) và hai từ phía doanh nghiệp (khác biệt, doanh thu). Cắt lương hay giờ mở cửa không phải mục tiêu.", "es": "Dos objetivos desde el cliente (experiencia, estímulos) y dos desde la empresa (diferenciación, facturación). Ahorrar en sueldos u horarios no es un objetivo.", "pt": "Dois objetivos do lado do cliente (experiência, estímulos) e dois do lado da empresa (diferenciação, faturação). Poupar em salários ou horários não é objetivo.", "ru": "Две цели со стороны клиента (впечатление, стимулы) и две со стороны предприятия (отличие, оборот). Экономия на зарплатах или часах – не цель.", "ti": "ክልተ ካብ ናይ ዓሚል ኣረኣእያ፡ ክልተ ካብ ናይ ትካል። ኣብ ደሞዝ ወይ ሰዓታት ምድሓን ዕላማ ኣይኮነን።"}}]}, {"id": "lf4-m2-sinne", "titel": {"de": "LF 4 · M 2 – Mit allen Sinnen"}, "lf": 4, "modul": 2, "sprachen": ["de", "ar", "tr", "vi", "es", "pt", "ru", "ti"], "profi": true, "merksatz": {"de": "Licht lenkt den Blick, Farbe macht Stimmung, Dekoration macht neugierig, Musik und Duft halten den Kunden länger im Laden. Wer alle fünf Sinne anspricht, steigert Verweildauer und Kaufbereitschaft.", "ar": "الضوء يوجّه النظر، واللون يصنع المزاج، والزينة تثير الفضول، والموسيقى والرائحة تبقيان الزبون أطول. من يخاطب الحواس الخمس يزيد مدة البقاء والاستعداد للشراء.", "tr": "Işık bakışı yönlendirir, renk ruh hâli yaratır, dekorasyon merak uyandırır, müzik ve koku müşteriyi daha uzun tutar. Beş duyuya hitap eden kalış süresini ve satın alma isteğini artırır.", "vi": "Ánh sáng dẫn ánh nhìn, màu sắc tạo tâm trạng, trang trí gây tò mò, nhạc và mùi hương giữ khách lâu hơn. Ai chạm tới cả năm giác quan sẽ tăng thời gian lưu lại và ý muốn mua.", "es": "La luz dirige la mirada, el color crea ambiente, la decoración despierta curiosidad, la música y el aroma retienen al cliente. Quien apela a los cinco sentidos aumenta la permanencia y las ganas de comprar.", "pt": "A luz dirige o olhar, a cor cria disposição, a decoração desperta curiosidade, a música e o aroma retêm o cliente. Quem apela aos cinco sentidos aumenta a permanência e a vontade de comprar.", "ru": "Свет направляет взгляд, цвет создаёт настроение, декорация пробуждает любопытство, музыка и аромат удерживают клиента дольше. Кто задействует все пять чувств, повышает время пребывания и готовность купить.", "ti": "ብርሃን ኣረኣእያ ይመርሕ፡ ሕብሪ ስምዒት ይፈጥር፡ ምጽባቕ ህንጥይና የለዓዕል፡ ሙዚቃን መኣዛን ንዓሚል ነዊሕ የጽንሑ። ንሓሙሽተ ህዋሳት ዝጥቀም ናይ ምጽናሕ ግዜን ድሌት ምግዛእን የዕቢ።"}, "aufgaben": [{"typ": "info", "bild": "💡", "text": {"de": "Drei Arten von Licht:\n\n① Grundbeleuchtung – gleichmäßig hell auf der ganzen Fläche (Deckenleuchten).\n② Warenwandbeleuchtung – hebt die Ware an den Wänden hervor (Leuchte über der Schuhwand).\n③ Akzentbeleuchtung – betont einzelne Waren und Dekoinseln (Spot auf die neue Handtasche).\n\nDie Lichtfarbe muss zur Ware passen: warmes Licht bei Brot und Fleisch, naturgetreues Licht bei Textilien. Helle Bereiche ziehen an, dunkle werden gemieden.", "ar": "ثلاثة أنواع من الإضاءة:\n\n① الإضاءة الأساسية – ضوء متساوٍ على كامل المساحة (مصابيح السقف).\n② إضاءة جدار البضاعة – تبرز البضاعة على الجدران.\n③ الإضاءة التركيزية – تبرز بضاعة واحدة أو جزيرة زينة (كشاف على حقيبة جديدة).\n\nلون الضوء يجب أن يناسب البضاعة: ضوء دافئ للخبز واللحم، ضوء طبيعي للمنسوجات. المناطق المضيئة تجذب والمظلمة تُتجنب.", "tr": "Üç tür aydınlatma:\n\n① Temel aydınlatma – tüm alanda eşit parlaklık (tavan lambaları).\n② Ürün duvarı aydınlatması – duvardaki ürünleri öne çıkarır.\n③ Vurgu aydınlatması – tek ürünleri ve dekor adalarını öne çıkarır (yeni çantaya spot).\n\nIşık rengi ürüne uymalı: ekmek ve ette sıcak ışık, tekstilde doğala yakın ışık. Aydınlık bölgeler çeker, karanlık olanlardan kaçınılır.", "vi": "Ba loại ánh sáng:\n\n① Chiếu sáng cơ bản – sáng đều toàn bộ diện tích (đèn trần).\n② Chiếu sáng tường hàng – làm nổi bật hàng trên tường.\n③ Chiếu sáng điểm nhấn – làm nổi bật từng món hoặc đảo trang trí (đèn rọi vào túi xách mới).\n\nMàu ánh sáng phải hợp với hàng: ánh sáng ấm cho bánh mì và thịt, ánh sáng trung thực cho vải vóc. Vùng sáng thu hút, vùng tối bị tránh.", "es": "Tres tipos de luz:\n\n① Iluminación general – luz uniforme en toda la superficie (luces de techo).\n② Iluminación de la pared de mercancía – resalta la mercancía en las paredes.\n③ Iluminación de acento – resalta artículos concretos e islas decorativas (foco sobre el bolso nuevo).\n\nEl color de la luz debe ir con la mercancía: luz cálida para pan y carne, luz natural para textiles. Las zonas claras atraen, las oscuras se evitan.", "pt": "Três tipos de luz:\n\n① Iluminação geral – luz uniforme em toda a área (luzes de teto).\n② Iluminação da parede de mercadoria – destaca a mercadoria nas paredes.\n③ Iluminação de destaque – realça artigos individuais e ilhas de decoração (foco na mala nova).\n\nA cor da luz tem de combinar com a mercadoria: luz quente para pão e carne, luz natural para têxteis. As zonas claras atraem, as escuras são evitadas.", "ru": "Три вида освещения:\n\n① Общее освещение – равномерный свет по всей площади (потолочные светильники).\n② Освещение товарной стены – выделяет товар у стен.\n③ Акцентное освещение – подчёркивает отдельные товары и декоративные островки (спот на новую сумку).\n\nЦвет света должен подходить товару: тёплый для хлеба и мяса, естественный для текстиля. Светлые зоны притягивают, тёмных избегают.", "ti": "ሰለስተ ዓይነት ብርሃን፦\n\n① መሰረታዊ ብርሃን – ኣብ ኩሉ ቦታ ማዕረ ብርሃን።\n② ናይ መንደቕ ኣቕሓ ብርሃን – ኣብ መንደቕ ዘሎ ኣቕሓ የጉልሕ።\n③ ናይ ኣተኩሮ ብርሃን – ውልቀ ኣቕሑ የጉልሕ።\n\nሕብሪ ብርሃን ምስ ኣቕሓ ክሰማማዕ ኣለዎ፦ ውዑይ ብርሃን ንባንን ስጋን፡ ተፈጥሯዊ ብርሃን ንኽዳውንቲ።"}, "g": "deckenlicht"}, {"typ": "sortier", "frage": {"de": "Welche Beleuchtung ist gemeint?", "ar": "أي إضاء der Rückwand.", "ar": "شرائط إضاءة تنير الرفوف على الجدار الخلفي.", "tr": "Işık bantları arka duvardaki rafları aydınlatıyor.", "vi": "Dải đèn chiếu sáng kệ ở tường sau.", "es": "Tiras de luz iluminan las estanterías de la pared trasera.", "pt": "Fitas de luz iluminam as prateleiras da parede do fundo.", "ru": "Световые ленты освещают стеллажи у задней стены.", "ti": "መስመር ብርሃን ነቲ ኣብ ድሕሪት ዘሎ መንደቕ የብርህ።"}, "g": "lichtband"}, {"emoji": "🪑", "ziel": "a", "text": {"de": "Eine Dekoinsel mit Gartenmöbeln wird hervorgehoben.", "ar": "جزيرة زينة بأثاث حديقة يتم إبرازها.", "tr": "Bahçe mobilyalı bir dekor adası öne çıkarılıyor.", "vi": "Một đảo trang trí với đồ gỗ sân vườn được làm nổi bật.", "es": "Se resalta una isla decorativa con muebles de jardín.", "pt": "Destaca-se uma ilha decorativa com móveis de jardim.", "ru": "Выделен декоративный островок с садовой мебелью.", "ti": "ናይ ጀርዲን ኣቑሑ ዘለዎ ናይ መጸብቒ ደሴት ይጉላሕ።"}, "g": "gartenmoebel"}, {"emoji": "💡", "ziel": "g", "text": {"de": "Deckenleuchten und Lichtbänder sorgen für Helligkeit überall.", "ar": "مصابيح السقف وشرائط الإضاءة تنير كل مكان.", "tr": "Tavan lambaları ve ışık bantları her yeri aydınlatır.", "vi": "Đèn trần và dải đèn tạo độ sáng khắp nơi.", "es": "Luces de techo y tiras de luz dan claridad en todas partes.", "pt": "Luzes de teto e fitas de luz dão claridade em todo o lado.", "ru": "Потолочные светильники и ленты дают свет повсюду.", "ti": "ናይ ናሕሲ መብራህትን መስመር ብርሃንን ኣብ ኩሉ ብርሃን ይህቡ።"}, "g": "neonlicht"}, {"emoji": "👟", "ziel": "w", "text": {"de": "Eine Leuchte über der Schuhwand hebt die Modelle hervor.", "ar": "مصباح فوق جدار الأحذية يبرز الموديلات.", "tr": "Ayakkabı duvarının üstündeki lamba modelleri öne çıkarır.", "vi": "Đèn trên tường giày làm nổi bật các mẫu.", "es": "Una luz sobre la pared de zapatos resalta los modelos.", "pt": "Uma luz sobre a parede de sapatos destaca os modelos.", "ru": "Светильник над обувной стеной выделяет модели.", "ti": "ኣብ ልዕሊ መንደቕ ጫማ ዘሎ መብራህቲ ነቶም ሞዴላት የጉልሕ።"}, "g": "schuhwand"}], function qrAuf(cv,text,px){

function konfetti(ms){
  const cv=document.createElement("canvas");cv.className="conf";document.body.appendChild(cv);
  const x=cv.getContext("2d");let w,hh;const re=()=>{w=cv.width=innerWidth;hh=cv.height=innerHeight;};re();addEventListener("resize",re);
  const cols=["#e0a300","#1f66c9","#c9263d","#1f8a4c","#7a3fc4","#0b8d99"];
  const ps=Array.from({length:160},()=>({x:Math.random()*w,y:-20-Math.random()*hh,r:4+Math.random()*7,v:2+Math.random()*4,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=Date.now();
  (function loop(){
    x.clearRect(0,0,w,hh);
    for(const p of ps){p.y+=p.v;p.a+=.08;p.x+=Math.sin(p.a)*1.4;if(p.y>hh+20){p.y=-20;p.x=Math.random()*w;}
      x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();}
    if(Date.now()-t0<(ms||5000))requestAnimationFrame(loop);else cv.remove();
  })();
}
function piep(ok){

}
