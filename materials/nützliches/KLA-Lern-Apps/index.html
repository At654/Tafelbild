  const L=opt.lang||"de",LV=opt.level||"basis";
  const orig=[];
  const liste=(app.aufgaben||[]).filter((a,n)=>{const ok=!AUS.has(n+1)&&(LV==="profi"||!a.nurProfi);if(ok)orig.push(n);return ok;});
  let i=0,pts=0,uebersprungen=0;
  const total=liste.length;
  const melde=(fin)=>{if(opt.onProgress)opt.onProgress(i,total,pts,!!fin);};

  function kopf(){
    const pr=Math.round(i/total*100);
    return `<div class="prog"><i style="width:${pr}%"></i></div>
      <div class="statline"><span>${h(T(L,"aufgabe"))} ${Math.min(i+1,total)} ${h(T(L,"von"))} ${total}</span>
      <span>★ ${pts} ${h(T(L,"punkte"))}</span><span id="rkInfo" class="grow"></span></div>`;
  }
  function weiterKnopf(fn){
    const b=document.createElement("button");b.className="pri";b.style.cssText="width:100%;margin-top:16px;padding:14px;font-size:1.1rem";
    b.textContent=T(L,"weiter");b.onclick=fn;return b;
  }
  function fb(el,ok,txtKey,why){
    const d=document.createElement("div");d.className="fb "+(ok?"ok":"bad");
    d.innerHTML=(ok?"✅ ":"❌ ")+h(T(L,txtKey))+(why?`<div class="why">${ttInline(why,L)}</div>`:"");
    el.appendChild(d);return d;
  }

  function zeige(){
    if(i>=total){ende();return;}
    const a=liste[i];
    const ptsStart=pts;
    host.innerHTML=kopf();
    const box=document.createElement("div");host.appendChild(box);
    if(a.frage)box.insertAdjacentHTML("beforeend",tt(a.frage,L,"q"));
    const body=document.createElement("div");box.appendChild(body);
    let fehler=0;const t0=Date.now();
    let skipB=null;
    const fertig=()=>{
      if(skipB){skipB.remove();skipB=null;}
      if(opt.onAufgabe)opt.onAufgabe(orig[i],fehler,Date.now()-t0);
      if(fehler===0){pts+=20;}
      const prof=(LV==="profi"&&a.profi)?a.profi:null;
      if(prof){profiFrage(prof,()=>{i++;melde();zeige();});}
      else{i++;melde();
        if(fehler===0){const d=document.createElement("div");d.className="fb ok";
          d.innerHTML=`⭐ ${h(T(L,"alleRichtig"))} <span class="why">+20 ${h(T(L,"bonus"))}</span>`;box.appendChild(d);}
        box.appendChild(weiterKnopf(()=>zeige()));window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});}
    };
    const punkt=(erst)=>{pts+=erst?10:5;melde();host.querySelector(".statline span:nth-child(2)").textContent="★ "+pts+" "+T(L,"punkte");};
    const merkFehler=()=>{fehler++;};
    const direkt=()=>{i++;melde();zeige();};
    if(SKIP&&a.typ!=="info"){
      skipB=document.createElement("button");skipB.className="skip";
      skipB.style.cssText="display:block;width:100%;margin-top:22px;padding:10px;font-size:.95rem;border-style:dashed;color:var(--muted);background:transparent";
      skipB.textContent="⏭ "+T(L,"skip");
      skipB.onclick=()=>{pts=ptsStart;uebersprungen++;i++;melde();zeige();};
    }
    const ctx={L,LV,box,body,fertig,direkt,punkt,merkFehler,fb,weiterKnopf};
    (TYP[a.typ]||TYP.info)(a,ctx);
    if(skipB)host.appendChild(skipB);
    melde();
  }

  function profiFrage(p,next){
    const box=document.createElement("div");box.className="box";box.style.marginTop="16px";
    box.innerHTML=`<div class="badge t">${h(T(L,"profiFrage"))}</div>`+tt(p.frage,L,"q");
    host.appendChild(box);
    (p.optionen||[]).forEach((o,k)=>{
      const b=document.createElement("button");b.className="opt";b.innerHTML=ttInline(o,L);
      b.onclick=()=>{
        if(box.dataset.done)return;box.dataset.done="1";
        box.querySelectorAll(".opt").forEach(x=>{x.dataset.fix="1";});
        const ok=k===p.richtig;b.classList.add(ok?"ok":"bad");
        if(!ok&&box.children[2+p.richtig])box.children[2+p.richtig].classList.add("ok");
        if(ok){pts+=15;piep(true);}else piep(false);
        melde();
        const d=document.createElement("div");d.className="fb "+(ok?"ok":"bad");
        d.innerHTML=(ok?"✅ +15 ":"❌ ")+(p.erklaerung?`<span class="why">${ttInline(p.erklaerung,L)}</span>`:"");
        box.appendChild(d);box.appendChild(weiterKnopf(next));
        window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
      };
      box.appendChild(b);
    });
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  }

  function ende(){
    melde(true);
    host.innerHTML=`<div class="box" style="text-align:center">
      <div class="big">🎉 ${h(T(L,"fertig"))}</div>
      <div style="font-size:1.3rem;margin:10px 0"><b>${pts}</b> ${h(T(L,"punkte"))}</div>
      ${uebersprungen?`<div class="muted">⏭ ${uebersprungen} ${h(T(L,"skipped"))}</div>`:""}
      <div id="rkEnd" class="muted"></div></div>`;
    if(app.merksatz)host.insertAdjacentHTML("beforeend",`<div class="merk" style="margin-top:14px"><b>${h(T(L,"merksatz"))}:</b> ${ttInline(app.merksatz,L)}</div>`);
    const b=document.createElement("button");b.style.cssText="width:100%;margin-top:16px;padding:14px";
    b.textContent=T(L,"weiterUeben");b.onclick=()=>{i=0;pts=0;uebersprungen=0;melde();zeige();};
    host.appendChild(b);
    konfetti(4000);piep(true);
    if(opt.onDone)opt.onDone(pts);
  }

  zeige();
  return {platzZeigen(txt){const e=document.getElementById("rkInfo");if(e)e.textContent=txt;const e2=document.getElementById("rkEnd");if(e2)e2.textContent=txt;},
          beenden(){host.innerHTML=`<div class="box" style="text-align:center"><div class="big">${h(T(L,"ende"))}</div><div style="font-size:1.2rem;margin-top:8px"><b>${pts}</b> ${h(T(L,"punkte"))}</div></div>`;}};
}

/* ---------- die einzelnen App-Typen ---------- */
const TYP={};

TYP.info=function(a,c){
  c.body.innerHTML=((a.g||a.bild)?`<div style="text-align:center;font-size:4rem">${bildVon({g:a.g,emoji:a.bild})}</div>`:"")+tt(a.text,c.L,"pre");
  c.body.appendChild(c.weiterKnopf(()=>{c.direkt();}));
};

TYP.sortier=function(a,c){
  const karten=shuffle(a.karten||[]);let k=0;
  c.body.insertAdjacentHTML("beforebegin",`<div class="muted">${h(T(c.L,"wohin"))}</div>`);
  const kartenBox=document.createElement("div");c.body.appendChild(kartenBox);
  const eckenBox=document.createElement("div");
  eckenBox.className="ecken"+((a.ecken||[]).length===3?" e3":"");
  c.body.appendChild(eckenBox);
  const fbBox=document.createElement("div");c.body.appendChild(fbBox);
  function karte(){
    if(k>=karten.length){kartenBox.innerHTML="";eckenBox.innerHTML="";fbBox.innerHTML="";c.fertig();return;}
    const ka=karten[k];let erst=true;
    kartenBox.innerHTML=`<div class="karte">${bildVon(ka)}<div>${ttInline(ka.text,c.L)}</div>
      <div class="muted" style="font-size:.85rem;font-weight:400">${k+1} / ${karten.length}</div></div>`;
    fbBox.innerHTML="";
    eckenBox.innerHTML="";
    (a.ecken||[]).forEach((e,n)=>{
      const b=document.createElement("button");b.className="ecke c"+(n%6);b.innerHTML=ttInline(e.name,c.L);
      b.onclick=()=>{
        if(e.id===ka.ziel){
          piep(true);c.punkt(erst);k++;
          fbBox.innerHTML="";c.fb(fbBox,true,"richtig",ka.warum);
          setTimeout(()=>karte(),ka.warum?1400:650);
          eckenBox.querySelectorAll("button").forEach(x=>x.disabled=true);
        }else{
          piep(false);if(erst){c.merkFehler();erst=false;}
          b.classList.add("bad");b.disabled=true;
          fbBox.innerHTML="";c.fb(fbBox,false,"falsch",null);
        }
      };
      eckenBox.appendChild(b);
    });
  }
  karte();
};

TYP.paare=function(a,c){
  const paare=(a.paare||[]);
  c.body.insertAdjacentHTML("beforeend",`<div class="muted">${h(T(c.L,"paareTxt"))}</div>`);
  const g=document.createElement("div");g.className="pairs";g.style.marginTop="10px";c.body.appendChild(g);
  const fbBox=document.createElement("div");c.body.appendChild(fbBox);
  const links=shuffle(paare.map((p,n)=>({n,o:p.a}))),rechts=shuffle(paare.map((p,n)=>({n,o:p.b})));
  const spA=document.createElement("div"),spB=document.createElement("div");
  spA.style.display=spB.style.display="flex";spA.style.flexDirection=spB.style.flexDirection="column";spA.style.gap=spB.style.gap="8px";
  g.appendChild(spA);g.appendChild(spB);
  let sel=null,offen=paare.length,erst={};
  function mk(it,sp,seite){
    const b=document.createElement("button");b.className="pc";b.innerHTML=ttInline(it.o,c.L);b.dataset.n=it.n;b.dataset.s=seite;
    b.onclick=()=>{
      if(b.classList.contains("ok"))return;
      if(!sel){sel=b;b.classList.add("sel");return;}
      if(sel===b){b.classList.remove("sel");sel=null;return;}
      if(sel.dataset.s===seite){sel.classList.remove("sel");sel=b;b.classList.add("sel");return;}
      const n1=+sel.dataset.n,n2=+b.dataset.n;
      if(n1===n2){
        sel.classList.remove("sel");sel.classList.add("ok");b.classList.add("ok");sel=null;offen--;
        piep(true);c.punkt(!erst[n1]);
        fbBox.innerHTML="";if(paare[n1].warum)c.fb(fbBox,true,"richtig",paare[n1].warum);
        if(offen===0){setTimeout(()=>c.fertig(),paare[n1].warum?1200:500);}
      }else{
        piep(false);erst[n1]=erst[n2]=1;c.merkFehler();
        const s=sel;s.classList.add("bad");b.classList.add("bad");
        setTimeout(()=>{s.classList.remove("bad","sel");b.classList.remove("bad");},450);sel=null;
        fbBox.innerHTML="";c.fb(fbBox,false,"falsch",null);
      }
    };
    sp.appendChild(b);
  }
  links.forEach(x=>mk(x,spA,"a"));rechts.forEach(x=>mk(x,spB,"b"));
};

TYP.fehler=function(a,c){
  c.body.insertAdjacentHTML("beforeend",
    (a.szene?`<div class="box" style="margin:8px 0">${(a.g||a.bild)?`<div style="font-size:3rem;text-align:center">${bildVon({g:a.g,emoji:a.bild})}</div>`:""}${tt(a.szene,c.L,"")}</div>`:"")+
    `<div class="muted">${h(T(c.L,"fehlerTxt"))}</div>`);
  const liste=document.createElement("div");c.body.appendChild(liste);
  const gew=new Set();
  (a.aussagen||[]).forEach((s,n)=>{
    const b=document.createElement("button");b.className="opt";b.innerHTML=ttInline(s.text,c.L);
    b.onclick=()=>{if(b.dataset.fix)return;if(gew.has(n)){gew.delete(n);b.classList.remove("sel");}else{gew.add(n);b.classList.add("sel");}};
    liste.appendChild(b);
  });
  const fbBox=document.createElement("div");c.body.appendChild(fbBox);
  const pb=document.createElement("button");pb.className="pri";pb.style.cssText="width:100%;margin-top:14px;padding:13px";
  pb.textContent=T(c.L,"pruefen");
  let versuch=0;
  pb.onclick=()=>{
    versuch++;
    const btns=[...liste.children];let allesOk=true;
    (a.aussagen||[]).forEach((s,n)=>{
      const b=btns[n],soll=!!s.falsch,ist=gew.has(n);
      if(soll===ist){if(soll)b.classList.add("ok");}
      else{allesOk=false;b.classList.add("bad");}
    });
    fbBox.innerHTML="";
    if(allesOk){
      piep(true);c.punkt(versuch===1);
      btns.forEach((b,n)=>{b.dataset.fix="1";if(a.aussagen[n].falsch&&a.aussagen[n].warum)b.insertAdjacentHTML("beforeend",`<div class="why muted" style="font-weight:400;margin-top:6px">${ttInline(a.aussagen[n].warum,c.L)}</div>`);});
      pb.remove();c.fb(fbBox,true,"richtig",null);setTimeout(()=>c.fertig(),900);
    }else{
      piep(false);c.merkFehler();c.fb(fbBox,false,"fastRichtig",null);
      if(versuch>=2){
        btns.forEach((b,n)=>{b.dataset.fix="1";b.classList.remove("sel","bad","ok");
          if(a.aussagen[n].falsch){b.classList.add("ok");b.insertAdjacentHTML("beforeend",`<div class="why muted" style="font-weight:400;margin-top:6px">${a.aussagen[n].warum?ttInline(a.aussagen[n].warum,c.L):""}</div>`);}});
        pb.remove();fbBox.innerHTML="";c.fb(fbBox,false,"loesung",null);
        c.body.appendChild(c.weiterKnopf(()=>c.fertig()));
      }else{setTimeout(()=>btns.forEach(b=>b.classList.remove("bad","ok")),900);}
    }
  };
  c.body.appendChild(pb);
};

TYP.reihenfolge=function(a,c){
  c.body.insertAdjacentHTML("beforeend",`<div class="muted">${h(T(c.L,"reihenTxt"))}</div>`);
  let ord=shuffle((a.schritte||[]).map((s,n)=>n));
  if(ord.every((v,n)=>v===n)&&ord.length>1)ord=ord.reverse();
  const liste=document.createElement("div");c.body.appendChild(liste);
  const fbBox=document.createElement("div");c.body.appendChild(fbBox);
  let versuch=0;
  function mal(){
    liste.innerHTML="";
    ord.forEach((idx,pos)=>{
      const row=document.createElement("div");row.className="step";
      row.innerHTML=`<div class="txt">${ttInline(a.schritte[idx].text,c.L)}</div>`;
      const up=document.createElement("button");up.textContent="▲";up.disabled=pos===0;
      up.onclick=()=>{[ord[pos-1],ord[pos]]=[ord[pos],ord[pos-1]];mal();};
      const dn=document.createElement("button");dn.textContent="▼";dn.disabled=pos===ord.length-1;
      dn.onclick=()=>{[ord[pos+1],ord[pos]]=[ord[pos],ord[pos+1]];mal();};
      const nav=document.createElement("div");nav.style.cssText="display:flex;flex-direction:column;gap:4px";
      nav.appendChild(up);nav.appendChild(dn);row.appendChild(nav);
      liste.appendChild(row);
    });
  }
  mal();
  const pb=document.createElement("button");pb.className="pri";pb.style.cssText="width:100%;margin-top:14px;padding:13px";
  pb.textContent=T(c.L,"pruefen");
  pb.onclick=()=>{
    versuch++;
    const rows=[...liste.children];let ok=true;
    ord.forEach((idx,pos)=>{const t=rows[pos].querySelector(".txt");if(idx===pos)t.classList.add("ok");else{t.classList.add("bad");ok=false;}});
    fbBox.innerHTML="";
    if(ok){piep(true);c.punkt(versuch===1);pb.remove();c.fb(fbBox,true,"richtig",a.warum);setTimeout(()=>c.fertig(),a.warum?1400:800);}
    else{piep(false);c.merkFehler();c.fb(fbBox,false,"fastRichtig",null);
      if(versuch>=3){ord=(a.schritte||[]).map((s,n)=>n);mal();[...liste.children].forEach(r=>r.querySelector(".txt").classList.add("ok"));
        pb.remove();fbBox.innerHTML="";c.fb(fbBox,false,"loesung",a.warum);c.body.appendChild(c.weiterKnopf(()=>c.fertig()));}
      else setTimeout(()=>rows.forEach(r=>r.querySelector(".txt").classList.remove("bad","ok")),900);}
  };
  c.body.appendChild(pb);
};

TYP.luecke=function(a,c){
  c.body.insertAdjacentHTML("beforeend",`<div class="muted">${h(T(c.L,"lueckeTxt"))}</div>`);
  const satzDe=tx(a.satz,"de"),satzL=tx(a.satz,c.L);
  const loes=(a.loesungen||[]);
  const satzBox=document.createElement("div");satzBox.className="satz";satzBox.style.marginTop="10px";
  const teile=satzDe.split(/\{(\d+)\}/);
  let html="";
  teile.forEach((t,n)=>{ if(n%2===0)html+=h(t); else html+=`<span class="gap" data-g="${+t}">?</span>`; });
  satzBox.innerHTML=html;
  c.body.appendChild(satzBox);
  if(c.L!=="de"&&satzL&&satzL!==satzDe)c.body.insertAdjacentHTML("beforeend",`<div class="tr"${RTL.includes(c.L)?' dir="rtl"':""} style="margin-top:6px">${h(satzL.replace(/\{\d+\}/g,"____"))}</div>`);
  const pool=document.createElement("div");pool.className="pool";c.body.appendChild(pool);
  const woerter=shuffle([...loes.map(x=>tx(x,"de")),...((a.ablenker||[]).map(x=>tx(x,"de")))]);
  const fbBox=document.createElement("div");c.body.appendChild(fbBox);
  let akt=null;
  satzBox.querySelectorAll(".gap").forEach(g=>{
    g.onclick=()=>{
      if(g.dataset.fix)return;
      if(g.dataset.w){const wn=g.dataset.w;g.dataset.w="";g.textContent="?";pool.querySelectorAll("button").forEach(b=>{if(b.textContent===wn)b.classList.remove("used");});}
      satzBox.querySelectorAll(".gap").forEach(x=>x.classList.remove("act"));g.classList.add("act");akt=g;
    };
  });
  woerter.forEach(w=>{
    const b=document.createElement("button");b.textContent=w;
    b.onclick=()=>{
      if(b.classList.contains("used"))return;
      if(!akt){const frei=[...satzBox.querySelectorAll(".gap")].find(g=>!g.dataset.w);if(!frei)return;akt=frei;}
      if(akt.dataset.w){const alt=akt.dataset.w;pool.querySelectorAll("button").forEach(x=>{if(x.textContent===alt)x.classList.remove("used");});}
      akt.dataset.w=w;akt.textContent=w;akt.classList.remove("act");b.classList.add("used");
      akt=[...satzBox.querySelectorAll(".gap")].find(g=>!g.dataset.w)||null;
      if(akt)akt.classList.add("act");
    };
    pool.appendChild(b);
  });
  const pb=document.createElement("button");pb.className="pri";pb.style.cssText="width:100%;margin-top:16px;padding:13px";
  pb.textContent=T(c.L,"pruefen");let versuch=0;
  pb.onclick=()=>{
    const gaps=[...satzBox.querySelectorAll(".gap")];
    if(gaps.some(g=>!g.dataset.w))return;
    versuch++;let ok=true;
    gaps.forEach(g=>{const soll=tx(loes[+g.dataset.g],"de");if(g.dataset.w===soll)g.classList.add("ok");else{g.classList.add("bad");ok=false;}});
    fbBox.innerHTML="";
    if(ok){piep(true);c.punkt(versuch===1);pb.remove();gaps.forEach(g=>g.dataset.fix="1");c.fb(fbBox,true,"richtig",a.warum);setTimeout(()=>c.fertig(),a.warum?1500:800);}
    else{piep(false);c.merkFehler();c.fb(fbBox,false,"fastRichtig",null);
      if(versuch>=3){gaps.forEach(g=>{g.classList.remove("bad");g.classList.add("ok");g.dataset.fix="1";g.textContent=tx(loes[+g.dataset.g],"de");});
        pb.remove();fbBox.innerHTML="";c.fb(fbBox,false,"loesung",a.warum);c.body.appendChild(c.weiterKnopf(()=>c.fertig()));}
      else setTimeout(()=>gaps.forEach(g=>{if(g.classList.contains("bad")){g.classList.remove("bad");g.dataset.w="";g.textContent="?";
        pool.querySelectorAll("button").forEach(b=>b.classList.remove("used"));
        gaps.forEach(g2=>{if(g2.dataset.w)pool.querySelectorAll("button").forEach(b=>{if(b.textContent===g2.dataset.w)b.classList.add("used");});});}}),1000);}
  };
  c.body.appendChild(pb);
};

TYP.quiz=function(a,c){
  const mehr=Array.isArray(a.richtig)&&a.richtig.length>1;
  if(mehr)c.body.insertAdjacentHTML("beforeend",`<div class="muted">${h(T(c.L,"multi"))}</div>`);
  const richtig=Array.isArray(a.richtig)?a.richtig:[a.richtig];
  const gew=new Set();const fbBox=document.createElement("div");
  const btns=[];
  (a.optionen||[]).forEach((o,n)=>{
    const b=document.createElement("button");b.className="opt";b.innerHTML=ttInline(o,c.L);btns.push(b);
    b.onclick=()=>{
      if(b.dataset.fix)return;
      if(mehr){if(gew.has(n)){gew.delete(n);b.classList.remove("sel");}else{gew.add(n);b.classList.add("sel");}return;}
      werte([n]);
    };
    c.body.appendChild(b);
  });
  c.body.appendChild(fbBox);
  let versuch=0;
  if(mehr){const pb=document.createElement("button");pb.className="pri";pb.style.cssText="width:100%;margin-top:14px;padding:13px";
    pb.textContent=T(c.L,"pruefen");pb.onclick=()=>{if(gew.size)werte([...gew],pb);};c.body.appendChild(pb);}
  function werte(sel,pb){
    versuch++;
    const ok=richtig.length===sel.length&&sel.every(x=>richtig.includes(x));
    fbBox.innerHTML="";
    if(ok){
      piep(true);c.punkt(versuch===1);
      btns.forEach((b,n)=>{b.dataset.fix="1";if(richtig.includes(n))b.classList.add("ok");});
      if(pb)pb.remove();c.fb(fbBox,true,"richtig",a.erklaerung);setTimeout(()=>c.fertig(),a.erklaerung?1800:800);
    }else{
      piep(false);c.merkFehler();sel.forEach(n=>btns[n].classList.add("bad"));
      c.fb(fbBox,false,"falsch",null);
      if(versuch>=2){
        btns.forEach((b,n)=>{b.dataset.fix="1";b.classList.remove("sel","bad");if(richtig.includes(n))b.classList.add("ok");else b.classList.add("done");});
        if(pb)pb.remove();fbBox.innerHTML="";c.fb(fbBox,false,"loesung",a.erklaerung);c.body.appendChild(c.weiterKnopf(()=>c.fertig()));
      }else setTimeout(()=>{sel.forEach(n=>btns[n].classList.remove("bad","sel"));gew.clear();},900);
    }
  }
};

</script>
<script>
/* =========================================================
   Bibliothek (Startseite für die Lehrkraft)
   ========================================================= */
let ALLE=[];
async function startSeite(){
  const r=$("start");r.hidden=false;
  r.innerHTML=`<div class="topbar"><img class="logo" id="logoImg" alt="KLA Bremerhaven"><h1>Lern-Apps</h1>
    <span class="sp"></span>
    <button id="bNeu">＋ Neue App</button>
    <button id="bImp">App importieren</button>
    <button id="bTheme" title="Hell / dunkel">◐</button></div>

function uhr(ms){if(ms<0)ms=0;const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function aufgTitel(app,i){
  const a=(app.aufgaben||[])[i];if(!a)return "Aufgabe "+(i+1);
  const f=tx(a.frage,"de")||tx(a.text,"de")||"";
  return "A"+(i+1)+" · "+(TYPNAME[a.typ]||a.typ)+(f?" – "+f.slice(0,30)+(f.length>30?"…":""):"");
}

function tafelApp(app){
  const r=$("tafel");r.hidden=false;
  $("logoImg").src=LOGO;
  $("tTitle").textContent=tx(app.titel,"de");
  const code=codeGen();
  const ref=app.__ref||appId(app);
  const joinUrl=linkFuer(Object.assign({s:code,a:ref},einstPar({aus:[...AUS],skip:SKIP})));
  const spieler=new Map();
  const aufg=(app.aufgaben||[]).map(()=>({n:0,f:0,wer:{}}));
  let status="lobby",dirty=true,teamModus=false,sprintMin=0,endzeit=0;
  const net=netz(onMsg,st=>{$("conn").textContent=st.up?"● verbunden":"○ keine Verbindung";$("conn").style.color=st.up?"var(--ok)":"var(--bad)";});
  net.sub("r/"+code+"/j");net.sub("r/"+code+"/p");net.sub("r/"+code+"/a");
  qrAuf($("qrSmall"),joinUrl,128);
  $("miniCode").textContent=code;
  function zustand(){
    net.pub("r/"+code+"/s",{st:status,ref,titel:app.titel,n:aktiveAufgaben(app).length,spr:sprachenVon(app),
      profi:app.profi!==false,team:teamModus,ende:endzeit},true);
  }
  function onMsg(t,p){
    if(!p||typeof p!=="object")return;
    if(t.endsWith("/j")&&p.id){
      const s=spieler.get(p.id)||{p:0,d:0,t:aktiveAufgaben(app).length,f:false};
      s.nm=clean(p.nm,20)||"?";s.av=p.av||"0.0";s.lg=p.lg||"de";s.lv=p.lv||"basis";s.tm=num(p.tm,-1);s.ts=Date.now();
      spieler.set(p.id,s);dirty=true;
    }
    if(t.endsWith("/p")&&p.id){
      const s=spieler.get(p.id)||{nm:clean(p.nm,20)||"?",av:p.av||"0.0",tm:num(p.tm,-1)};
      s.d=num(p.d,0);s.t=num(p.t,1);s.p=num(p.p,0);s.f=!!p.f;s.ts=Date.now();
      if(p.nm)s.nm=clean(p.nm,20);if(p.av)s.av=p.av;if(p.tm!==undefined)s.tm=num(p.tm,-1);
      spieler.set(p.id,s);dirty=true;
    }
    if(t.endsWith("/a")&&p.id){
      const i=num(p.i,-1);
      if(i>=0&&i<aufg.length){
        const k=p.id+"#"+i;
        if(!aufg[i].wer[k]){aufg[i].wer[k]=1;aufg[i].n++;if(num(p.f,0)>0)aufg[i].f++;dirty=true;}
      }
    }
  }
  function rangliste(){
    return [...spieler.entries()].map(([id,s])=>({id,...s})).sort((a,b)=>(b.p||0)-(a.p||0)||(b.d||0)-(a.d||0));
  }
  function teamliste(){
    const m=new Map();
    for(const s of rangliste()){
      if(s.tm==null||s.tm<0)continue;
      const t=m.get(s.tm)||{tm:s.tm,p:0,d:0,t:0,mit:[]};
      t.p+=s.p||0;t.d+=s.d||0;t.t+=s.t||1;t.mit.push(s);m.set(s.tm,t);
    }
    return [...m.values()].sort((a,b)=>b.p-a.p);
  }
  function sendeRang(){
    const l=rangliste().slice(0,40).map((s,n)=>({id:s.id,r:n+1,p:s.p||0}));
    const tl=teamModus?teamliste().map((t,n)=>({tm:t.tm,r:n+1,p:t.p})):null;
    net.pub("r/"+code+"/rk",{l,n:spieler.size,tl});
  }
  function livePanel(){
    if(!aufg.some(x=>x.n))return `<div class="live"><h3>Live-Ergebnis</h3><p class="muted">Sobald die ersten Aufgaben fertig sind, steht hier, was sitzt und was nicht.</p></div>`;
    const hit=aufg.map((x,i)=>({i,r:x.n>=2?x.f/x.n:0})).filter(x=>x.r>=0.4).sort((a,b)=>b.r-a.r).slice(0,3).map(x=>x.i);
    return `<div class="live"><h3>Live-Ergebnis</h3>`+
      aufg.map((x,i)=>{
        if(!x.n)return "";
        const ok=x.n-x.f,pr=Math.round(ok/x.n*100);
        return `<div class="lrow${hit.includes(i)?" hit":""}">
          <div><div class="nm">${h(aufgTitel(app,i))}</div>
          <div class="sub">${x.n} fertig · ${ok} ohne Fehler · ${x.f} mit Fehler</div></div>
          <div class="quote" style="color:${pr>=70?"var(--ok)":pr>=40?"var(--warn)":"var(--bad)"}">${pr} %</div>
          <div class="lbar"><i class="ok" style="width:${pr}%"></i><i class="bad" style="width:${100-pr}%"></i></div></div>`;
      }).join("")+
      (hit.length?`<p class="muted" style="margin:12px 0 0">🔥 Das besprechen wir gleich: ${hit.map(i=>"A"+(i+1)).join(", ")}</p>`:"")+
      `</div>`;
  }
  function rangKarte(s,n){
    const pr=Math.round((s.d||0)/Math.max(1,s.t||1)*100);
    return `<div class="rk ${n<3?"g"+(n+1):""} ${s.f?"fin":""}"><div class="nr">${n+1}</div><div class="av">${avOf(s.av)}</div>
      <div><div class="nm">${h(s.nm)} ${s.lv==="profi"?'<span class="badge t">Profi</span>':""} ${s.tm>=0?`<span class="tbadge" style="background:${TEAMS[s.tm][1]}"></span>${h(TEAMS[s.tm][0])}`:""} ${s.f?"🏁":""}</div>
      <div class="bar"><i style="width:${pr}%"></i></div></div><div class="pt">${s.p||0}</div></div>`;
  }
  function teamKarte(t,n){
    const pr=Math.round(t.d/Math.max(1,t.t)*100);
    return `<div class="rk ${n<3?"g"+(n+1):""}"><div class="nr">${n+1}</div>
      <div class="av"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="${TEAMS[t.tm][1]}"/></svg></div>
      <div><div class="nm">Team ${h(TEAMS[t.tm][0])} <span class="muted" style="font-weight:400">${t.mit.map(s=>h(s.nm)).join(", ")}</span></div>
      <div class="bar"><i style="width:${pr}%"></i></div></div><div class="pt">${t.p}</div></div>`;
  }
  function mal(){
    $("miniN").textContent=spieler.size+" dabei";
    const m=$("tMain");
    if(status==="lobby"){
      m.innerHTML=`<div class="lobby">
        <div class="qrbox"><canvas id="qrBig"></canvas><div class="code">${code}</div>
          <div class="joinurl">${h(joinUrl.replace(/^https?:\/\//,""))}</div></div>
        <div style="flex:1;min-width:280px">
          <h2>${h(tx(app.titel,"de"))}</h2>
          <p class="muted">${aktiveAufgaben(app).length} Aufgaben${SKIP?" · ⏭ Überspringen erlaubt":""} · ${typenVon(app).map(t=>TYPNAME[t]||t).join(" · ")}<br>
          Sprachen: ${sprachenVon(app).map(l=>FLAG[l]+" "+LANGNAME_DE[l]).join(" · ")}</p>
          <div class="row" style="margin:12px 0">
            <button class="chip${teamModus?" on":""}" id="bTeam">${teamModus?"👥 Teams":"👤 Einzeln"}</button>
            <span class="muted">Sprint:</span>
            ${[0,5,10,15].map(x=>`<button class="chip${sprintMin===x?" on":""}" data-sp="${x}">${x?x+" Min":"aus"}</button>`).join("")}
          </div>
          <p class="big">Handy-Kamera auf den QR-Code</p>
          <div class="players" id="pls"></div>
        </div></div>`;
      qrAuf($("qrBig"),joinUrl,420);
      $("pls").innerHTML=[...spieler.values()].map(s=>`<span class="pl"><span class="av">${avOf(s.av)}</span>${h(s.nm)}${s.tm>=0?` <span class="tbadge" style="background:${TEAMS[s.tm][1]}"></span>`:""}</span>`).join("")||'<span class="muted">Noch niemand da …</span>';
      $("bTeam").onclick=()=>{teamModus=!teamModus;zustand();mal();};
      m.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{sprintMin=+b.dataset.sp;mal();});
      $("tctl").innerHTML="";
      const b=document.createElement("button");b.className="pri";b.textContent="Starten";
      b.onclick=()=>{status="lauf";endzeit=sprintMin?Date.now()+sprintMin*60000:0;zustand();mal();};
      $("tctl").appendChild(b);
    }else if(status==="lauf"){
      const l=rangliste(),tl=teamliste();const fertig=l.filter(s=>s.f).length;
      m.innerHTML=`<div class="row"><h2 style="margin:0">${h(tx(app.titel,"de"))}</h2><span class="sp grow"></span>
        ${endzeit?`<span class="sprint${endzeit-Date.now()<60000?" warn":""}" id="cd">${uhr(endzeit-Date.now())}</span>`:""}
        <span class="badge">${spieler.size} Schüler</span><span class="badge">${fertig} fertig</span></div>
        <div class="tafelgrid"><div>
          <div class="rank">${teamModus?(tl.length?tl.map(teamKarte).join(""):'<p class="muted">Noch keine Teams.</p>'):(l.length?l.map(rangKarte).join(""):'<p class="muted">Noch keine Antworten.</p>')}</div>
          ${teamModus&&l.length?`<p class="muted" style="margin:14px 0 6px">Einzeln</p><div class="rank">${l.map(rangKarte).join("")}</div>`:""}
        </div>${livePanel()}</div>`;
      $("tctl").innerHTML="";
      const b1=document.createElement("button");b1.textContent="Podium zeigen";b1.className="pri";
      b1.onclick=()=>{status="ende";endzeit=0;zustand();mal();};
      const b2=document.createElement("button");b2.textContent="Zurück zur Lobby";
      b2.onclick=()=>{status="lobby";endzeit=0;zustand();mal();};
      $("tctl").appendChild(b1);$("tctl").appendChild(b2);
    }else{
      const l=rangliste(),tl=teamliste();

  setInterval(()=>{zustand();},3000);
  setInterval(()=>{if(dirty){dirty=false;mal();sendeRang();}},1200);
  setInterval(()=>{
    if(status!=="lauf"||!endzeit)return;
    const rest=endzeit-Date.now();
    const e=$("cd");if(e){e.textContent=uhr(rest);if(rest<60000)e.classList.add("warn");}
    if(rest<=0){status="ende";endzeit=0;zustand();mal();}
  },1000);
}

/* =========================================================
   Handy (live) und Alleine-Üben
   ========================================================= */
function guessLang(){const n=(navigator.language||"de").slice(0,2).toLowerCase();return LK.includes(n)?n:"de";}

function spielerStart(app,opt){
  const r=$("phone");r.hidden=false;
  const spr=sprachenVon(app);
  let L=store("klalern_lang");if(!spr.includes(L))L=spr.includes(guessLang())?guessLang():"de";
  let nm=store("klalern_name")||randName(),av=store("klalern_av")||(Math.floor(Math.random()*12)+"."+Math.floor(Math.random()*8));
  let lv="basis",tm=-1,gestartet=false;
  function mal(){
    const [an,fa]=av.split(".");
    r.innerHTML=`<div class="phead"><img src="${LOGO}" style="height:34px"><b>${h(tx(app.titel,"de"))}</b></div>
      <div class="box">
        <label>${h(T(L,"lang"))}</label>
        <div class="row" id="lgs">${spr.map(l=>`<button class="chip${l===L?" on":""}" data-l="${l}">${FLAG[l]||""} ${h(LANGS.find(x=>x[0]===l)[1])}</button>`).join("")}</div>
        ${opt.live?`<label>${h(T(L,"nick"))}</label>
        <div class="row"><input id="nm" value="${h(nm)}" maxlength="18" class="grow"><button id="rnd">🎲</button></div>
        <label>${h(T(L,"pick"))}</label>
        <div class="avgrid" id="avg">${Array.from({length:12},(_,k)=>`<button data-a="${k}" class="${+an===k?"on":""}">${animalSVG(k,+fa)}</button>`).join("")}</div>
        <div class="cols" id="cls">${BGS.map((c,k)=>`<button data-c="${k}" style="background:${c}" class="${+fa===k?"on":""}"></button>`).join("")}</div>`:""}
        ${opt.live&&opt.team?`<label>${h(T(L,"teamwahl"))}</label>
        <div class="teamwahl" id="tmw">${TEAMS.map((t,k)=>`<button data-t="${k}" class="${tm===k?"on":""}" style="background:color-mix(in srgb,${t[1]} 18%,var(--surface));border-color:${t[1]}">${h(t[0])}</button>`).join("")}</div>`:""}
        ${app.profi!==false?`<label>${h(T(L,"stufe"))}</label>
        <div class="lvl" id="lv">
          <button data-v="basis" class="${lv==="basis"?"on":""}">🙂 ${h(T(L,"basis"))}<br><span class="muted" style="font-weight:400">${h(T(L,"basisTxt"))}</span></button>
          <button data-v="profi" class="${lv==="profi"?"on":""}">🚀 ${h(T(L,"profi"))}<br><span class="muted" style="font-weight:400">${h(T(L,"profiTxt"))}</span></button>
        </div>`:""}
        <button class="pri" id="go" style="width:100%;padding:15px;font-size:1.15rem;margin-top:12px">${h(T(L,"startBtn"))}</button>
        <div id="warn"></div>
      </div>`;
    r.querySelectorAll("#lgs button").forEach(b=>b.onclick=()=>{L=b.dataset.l;store("klalern_lang",L);mal();});
    const avg=r.querySelector("#avg");if(avg)avg.querySelectorAll("button").forEach(b=>b.onclick=()=>{av=b.dataset.a+"."+av.split(".")[1];store("klalern_av",av);mal();});
    const cls=r.querySelector("#cls");if(cls)cls.querySelectorAll("button").forEach(b=>b.onclick=()=>{av=av.split(".")[0]+"."+b.dataset.c;store("klalern_av",av);mal();});
    const tmw=r.querySelector("#tmw");if(tmw)tmw.querySelectorAll("button").forEach(b=>b.onclick=()=>{tm=+b.dataset.t;mal();});
    const lvb=r.querySelector("#lv");if(lvb)lvb.querySelectorAll("button").forEach(b=>b.onclick=()=>{lv=b.dataset.v;mal();});
    const rn=r.querySelector("#rnd");if(rn)rn.onclick=()=>{nm=randName();store("klalern_name",nm);mal();};
    const ni=r.querySelector("#nm");if(ni)ni.oninput=()=>{nm=clean(ni.value,18);};
    r.querySelector("#go").onclick=()=>{
      if(opt.live){
        nm=clean(r.querySelector("#nm").value,18)||randName();
        if(badName(nm)){r.querySelector("#warn").innerHTML='<div class="fb bad">'+h(T(L,"badname"))+"</div>";return;}
        store("klalern_name",nm);
        if(opt.team&&tm<0){r.querySelector("#warn").innerHTML='<div class="fb bad">'+h(T(L,"teamwahl"))+"</div>";return;}
      }
      gestartet=true;opt.start({lang:L,level:lv,name:nm,av,tm});
    };
  }
  mal();
  return {teamModus(v){if(!!opt.team===!!v)return;opt.team=!!v;if(!gestartet)mal();},los(){gestartet=true;}};
}

function soloApp(app){
  spielerStart(app,{live:false,start:({lang,level})=>{
    const r=$("phone");
    r.innerHTML=`<div class="phead"><img src="${LOGO}" style="height:30px"><b>${h(tx(app.titel,"de"))}</b><span class="sp"></span>
      <button id="zur">↺</button></div><div id="run"></div>`;
    r.querySelector("#zur").onclick=()=>location.reload();
    runner($("run"),app,{lang,level,onProgress(){},onDone(){}});
  }});
}

function liveApp(app,code,zust){
  const myId="s"+rnd(8);
  let ende=zust&&zust.ende?zust.ende:0,warte=null;
  netz((t,p)=>{if(t.endsWith("/s")&&p&&p.st){if(p.ende!==undefined)ende=p.ende||0;if(warte)warte.teamModus(!!p.team);}},null);
  warte=spielerStart(app,{live:true,team:!!(zust&&zust.team),start:({lang,level,name,av,tm})=>{
    const r=$("phone");
    r.innerHTML=`<div class="phead"><span class="av">${avOf(av)}</span><b>${h(name)}</b>
      ${tm>=0?`<span class="badge"><span class="tbadge" style="background:${TEAMS[tm][1]}"></span>${h(TEAMS[tm][0])}</span>`:""}
      <span class="sp"></span><span id="cd2" class="badge"></span><span id="cstat" class="muted">…</span></div><div id="run"></div>`;
    const net=netz(onMsg,st=>{const e=$("cstat");if(e){e.textContent=st.up?"●":"○";e.style.color=st.up?"var(--ok)":"var(--bad)";}});
    net.sub("r/"+code+"/s");net.sub("r/"+code+"/rk");
    const schick=(d,t,p,f)=>net.pub("r/"+code+"/p",{id:myId,nm:name,av,tm,d,t,p,f});
    net.pub("r/"+code+"/j",{id:myId,nm:name,av,lg:lang,lv:level,tm});
    let letzte={d:0,t:1,p:0,f:false},vorbei=false;
    const run=runner($("run"),app,{lang,level,
      onProgress(d,t,p,f){letzte={d,t,p,f};schick(d,t,p,f);},
      onAufgabe(i,f){net.pub("r/"+code+"/a",{id:myId,i,f});},
      onDone(p){schick(letzte.t,letzte.t,p,true);}});
    setInterval(()=>schick(letzte.d,letzte.t,letzte.p,letzte.f),9000);
    setInterval(()=>{
      const e=$("cd2");if(!e)return;
      if(!ende){e.textContent="";return;}
      const rest=ende-Date.now();
      e.textContent="⏱ "+uhr(rest);e.style.color=rest<60000?"var(--bad)":"";
      if(rest<=0&&!vorbei){vorbei=true;run.beenden();}
    },1000);
    function onMsg(t,p){
      if(!p)return;
      if(t.endsWith("/rk")){
        if(tm>=0&&Array.isArray(p.tl)){
          const me=p.tl.find(x=>x.tm===tm);
          if(me)run.platzZeigen(T(lang,"team")+" "+T(lang,"platz")+" "+me.r+" / "+p.tl.length);
        }else if(Array.isArray(p.l)){
          const me=p.l.find(x=>x.id===myId);
          if(me)run.platzZeigen(T(lang,"platz")+" "+me.r+" / "+(p.n||p.l.length));
        }
      }
      if(t.endsWith("/s")){
        if(p.ende!==undefined)ende=p.ende||0;
        if(p.st==="ende"&&!vorbei){vorbei=true;run.beenden();}
      }
    }
  }});
}

/* =========================================================
   Start
   ========================================================= */
(function(){
  const th=store("klalern_theme");if(th)document.documentElement.setAttribute("data-theme",th);
  const code=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const ref=params.get("a")||"";
  const fehler=(msg)=>{const r=$("phone");r.hidden=false;r.innerHTML=`<div class="box"><h3>Das hat nicht geklappt</h3><p>${h(msg)}</p><button onclick="location.href=location.origin+location.pathname">Zur Übersicht</button></div>`;};
  if(code){
    const r=$("phone");r.hidden=false;r.innerHTML='<div class="box"><p>'+h(T(guessLang(),"wartenTafel"))+"</p></div>";
    (async()=>{
      try{
        const warte=new Promise(res=>{
          const n=netz((t,p)=>{if(t.endsWith("/s")&&p&&p.st)res(p);},()=>{});
          n.sub("r/"+code+"/s");setTimeout(()=>res(null),ref?2500:12000);
        });
        const zust=await warte;
        let app=null;
        if(ref)app=await ladeRef(ref);
        else if(zust&&zust.ref)app=await ladeRef(zust.ref);
        else throw new Error("Keine Antwort von der Tafel. Scanne den QR-Code noch einmal.");
        liveApp(app,code,zust);
      }catch(e){fehler(e.message);}
    })();
    return;
  }
  if(ref){
    (async()=>{
      try{const app=await ladeRef(ref);
        if(params.get("tafel")==="1")tafelApp(app);else soloApp(app);
      }catch(e){fehler(e.message);}
    })();
    return;
  }
  startSeite();
})();

</script>
