:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}

body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}

main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}

.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}

.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}

.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}

.nowrap{white-space:nowrap}
#report{display:none}

 body{background:#fff;padding:0;font-size:11pt}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

 letzte kommt aus Modul 3.", "tip": "Eine Einkaufsgenossenschaft ist ein Zusammenschluss von …", "items": [{"t": "free", "id": "a4.1", "q": "4.1 Nenne drei externe Bezugsquellen.", "model": "z. B. Fachmesse, Internet/B2B-Plattform, Katalog, Fachzeitschrift, Vertreter"}, {"t": "free", "id": "a4.2", "q": "4.2 Erkläre, was eine Einkaufsgenossenschaft ist, und nenne zwei Vorteile für den Händler.", "model": "Zusammenschluss rechtlich selbstständiger Einzelhändler zum gemeinsamen Wareneinkauf. Vorteile: günstigere Preise durch große Mengen, gemeinsame Werbung, Schulungen, Zentralregulierung."}, {"t": "mc", "id": "a4.3", "q": "4.3 Alt (Modul 3): Ein neuer Lieferer schickt ein Angebot. Welche Arbeit ist im WWS zu erledigen?", "o": ["Die Kundendatei wird ergänzt.", "Die Liefererdatei wird ergänzt.", "Alle Angebote werden in der Auftragserfassung gespeichert.", "Die Lagerdatei wird ergänzt.", "Die GTIN wird geändert."], "a": 1}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Zentralregulierung und Abhängigkeit", "intro": "Die Zentrale bezahlt die Rechnungen an die Lieferer und haftet dafür (Delkredere).", "tip": "Denke an Risiko und Abhängigkeit.", "items": [{"t": "free", "id": "a5.1", "q": "5.1 Erkläre die Zentralregulierung und das Delkredere. Warum ist das für einen Lieferer attraktiv?", "model": "Die Zentrale der Genossenschaft bezahlt alle Rechnungen der Mitglieder an den Lieferer und übernimmt die Haftung, falls ein Mitglied nicht zahlt (Delkredere). Der Lieferer hat nur einen Ansprechpartner und kein Ausfallrisiko – dafür gewährt er bessere Konditionen."}, {"t": "free", "id": "a5.2", "q": "5.2 Ein Modehaus kauft 80 % seiner Ware bei einem einzigen Großhändler. Beurteile diese Strategie.", "model": "Vorteil: hohe Mengen → bessere Konditionen, einfache Abwicklung. Nachteil: Abhängigkeit (Lieferausfall, Preiserhöhungen), weniger Auswahl. Besser: Hauptlieferer + Ausweichlieferer."}]}]};
var TR={"title": ["Nguồn cung ứng, quy trình mua hàng và hợp tác", "", "", "", "", "", "مصادر الشراء، خطوات الشراء والتعاون", "Tedarik kaynakları, tedarik süreci ve iş birliği"], "can.0": ["kể các nguồn cung ứng bên trong và bên ngoài (tệp nhà cung cấp, hội chợ, internet, catalog, đại diện bán hàng).", "", "", "", "", "", "ذكر مصادر الشراء الداخلية والخارجية (ملف الموردين، المعرض، الإنترنت، الكتالوجات، المندوبون).", "iç ve dış tedarik kaynaklarını söylemek (tedarikçi dosyası, fuar, internet, kataloglar, temsilciler)."], "can.1": ["so sánh ưu và nhược điểm của nhà sản xuất và nhà bán buôn khi làm nhà cung cấp.", "", "", "", "", "", "مقارنة مزايا وعيوب المنتِج وتاجر الجملة كموردين.", "tedarikçi olarak üretici ile toptancının avantaj ve dezavantajlarını karşılaştırmak."], "can.2": ["sắp xếp các bước của quá trình mua hàng theo đúng thứ tự.", "", "", "", "", "", "ترتيب خطوات العمل في الشراء بالترتيب الصحيح.", "tedarikin iş adımlarını doğru sıraya koymak."], "can.3": ["giải thích hợp tác xã mua hàng là gì và hợp tác trong mua hàng mang lại lợi ích gì.", "", "", "", "", "", "شرح ما هي تعاونية الشراء وما المزايا التي يجلبها التعاون في الشراء.", "satın alma kooperatifinin ne olduğunu ve satın almada iş birliğinin hangi avantajları getirdiğini açıklamak."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Nếu thời gian giao hàng dài hơn thì phải tăng mức tồn kho báo đặt hàng.", "", "", "", "", "", "إذا طالت مدة التوريد يجب رفع مخزون إعادة الطلب.", "Teslim süresi uzarsa sipariş noktası stoku artırılmalıdır."], "a1.1.q": ["1.2 Sắp tới nhà cung cấp cần thêm 3 ngày. Mức tồn kho báo đặt hàng thay đổi thế nào? (Mô-đun 2)", "", "", "", "", "", "1.2 سيحتاج المورد مستقبلاً 3 أيام إضافية. ماذا يحدث لمخزون إعادة الطلب؟ (الوحدة 2)", "1.2 Tedarikçi bundan sonra 3 gün daha fazla süreye ihtiyaç duyuyor. Sipariş noktası stokuna ne olur? (Modül 2)"], "a1.1.o0": ["Phải tăng lên.", "", "", "", "", "", "يجب رفعه.", "Artırılmalıdır."], "a1.1.o1": ["Có thể giảm xuống.", "", "", "", "", "", "يمكن خفضه.", "Düşürülebilir."], "a1.1.o2": ["Giữ nguyên.", "", "", "", "", "", "يبقى كما هو.", "Aynı kalır."], "a1.2.q": ["1.1 Sự khác nhau giữa dữ liệu gốc và dữ liệu biến động là gì? (Mô-đun 3)", "", "", "", "", "", "1.1 ما الفرق بين البيانات الأساسية وبيانات الحركة؟ (الوحدة 3)", "1.1 Ana veriler ile hareket verileri arasındaki fark nedir? (Modül 3)"], "a1.3.q": ["1.4 Danh mục hàng là gì? Nêu khái niệm độ rộng và độ sâu. (Ngân hàng câu hỏi · LF 1)", "", "", "", "", "", "1.4 ما هي التشكيلة؟ اذكر مصطلحي العرض والعمق. (بنك الأسئلة · LF 1)", "1.4 Ürün yelpazesi nedir? Genişlik ve derinlik kavramlarını söyle. (Havuz · LF 1)"], "r1.h": ["Đọc thêm: Tìm nguồn cung ứng và hợp tác trong mua hàng (Sách giáo khoa tr. 21–26 và 51–54)", "", "", "", "", "", "للقراءة: إيجاد مصادر الشراء والتعاون في الشراء (الكتاب ص 21–26 و 51–54)", "Okuma: Tedarik kaynakları bulmak ve satın almada iş birliği (Ders kitabı s. 21–26 ve 51–54)"], "r1.s": ["Thứ tự đi theo các câu hỏi: Cái gì? – Ai? – Với điều kiện nào? – Ai tốt nhất? – Đặt hàng.", "", "", "", "", "", "الترتيب يتبع أسئلة الاستفهام: ماذا؟ – من؟ – بأي شروط؟ – من الأفضل؟ – الطلب.", "Sıralama soru kelimelerini izler: Ne? – Kim? – Hangi koşullarla? – En iyisi kim? – Sipariş."], "r1.p0": ["Nguồn cung ứng bên trong ví dụ là tệp nhà cung cấp và các chào giá trước đây. Nguồn bên ngoài ví dụ là internet, hội chợ chuyên ngành, catalog và đại diện bán hàng.", "", "", "", "", "", "مصادر الشراء الداخلية مثلاً ملف الموردين والعروض السابقة. مصادر الشراء الخارجية مثلاً الإنترنت والمعارض المتخصصة والكتالوجات والمندوبون.", "İç tedarik kaynakları ör. tedarikçi dosyası ve önceki tekliflerdir. Dış tedarik kaynakları ör. internet, ihtisas fuarları, kataloglar ve temsilcilerdir."], "r1.p1": ["Mua của nhà sản xuất thường rẻ hơn, nhưng chỉ với số lượng lớn. Ở nhà bán buôn có thể mua số lượng nhỏ và danh mục rộng, nhưng thường đắt hơn.", "", "", "", "", "", "عند المنتِج يشتري المرء غالباً بسعر أرخص، لكن بكميات كبيرة فقط. عند تاجر الجملة يحصل على كميات صغيرة وتشكيلة واسعة، لكنه يدفع غالباً أكثر.", "Üreticiden genellikle daha ucuza ama sadece büyük miktarlarda alınır. Toptancıdan küçük miktarlar ve geniş ürün yelpazesi alınır ama çoğunlukla daha çok ödenir."], "r1.p2": ["Trong hợp tác xã mua hàng, các nhà bán lẻ độc lập cùng nhau mua hàng (ví dụ EDEKA, REWE).", "", "", "", "", "", "في تعاونية الشراء يشتري تجار التجزئة المستقلون معاً (مثلاً EDEKA، REWE).", "Bir satın alma kooperatifinde bağımsız perakendeciler birlikte alım yapar (ör. EDEKA, REWE)."], "r1.qq": ["Đâu là nguồn cung ứng bên ngoài?", "", "", "", "", "", "ما هو مصدر الشراء الخارجي؟", "Dış tedarik kaynağı hangisidir?"], "r1.q.o0": ["hội chợ đồ chơi Nürnberg", "", "", "", "", "", "معرض الألعاب في نورنبرغ", "Nürnberg Oyuncak Fuarı"], "r1.q.o1": ["tệp nhà cung cấp trong WWS", "", "", "", "", "", "ملف الموردين في نظام إدارة البضائع", "WWS'deki tedarikçi dosyası"], "r1.q.o2": ["các chào giá trước đây trong tập hồ sơ", "", "", "", "", "", "عروض سابقة في الملف", "klasördeki önceki teklifler"], "a2.h": ["Mở rộng danh mục „Thời trang trẻ“", "", "", "", "", "", "توسيع تشكيلة „الموضة الشبابية“", "„Genç Moda“ ürün yelpazesi genişletiliyor"], "a2.i": ["Học viên Fabian phải tìm nhà cung cấp mới cho bộ phận „Thời trang trẻ“.", "", "", "", "", "", "على المتدرب Fabian أن يجد موردين جدداً لقسم „الموضة الشبابية“.", "Stajyer Fabian „Genç Moda“ bölümü için yeni tedarikçiler bulmalı."], "a2.t": ["Thứ tự đi theo các câu hỏi: Cái gì? – Ai? – Với điều kiện nào? – Ai tốt nhất? – Đặt hàng.", "", "", "", "", "", "الترتيب يتبع أسئلة الاستفهام: ماذا؟ – من؟ – بأي شروط؟ – من الأفضل؟ – الطلب.", "Sıralama soru kelimelerini izler: Ne? – Kim? – Hangi koşullarla? – En iyisi kim? – Sipariş."], "a2.1.q": ["Sắp xếp các bước theo đúng thứ tự.", "", "", "", "", "", "رتّب الخطوات بالترتيب الصحيح.", "Adımları doğru sıraya koy."], "a2.1.r0": ["Anh/chị quyết định chọn một nhà cung cấp.", "", "", "", "", "", "تختارون مورداً.", "Bir tedarikçiye karar veriyorsunuz."], "a2.1.r1": ["Anh/chị cùng trưởng bộ phận xác định các mặt hàng trọng tâm.", "", "", "", "", "", "تحددون مع رئيس القسم الأصناف الأساسية.", "Bölüm müdürünüzle ürün odaklarını belirliyorsunuz."], "a2.1.r2": ["Anh/chị kiểm tra các chào giá.", "", "", "", "", "", "تفحصون العروض.", "Teklifleri inceliyorsunuz."], "a2.1.r3": ["Anh/chị tìm nguồn cung ứng mới trên internet.", "", "", "", "", "", "تبحثون عن مصادر شراء جديدة على الإنترنت.", "İnternette yeni tedarik kaynakları arıyorsunuz."], "a2.1.r4": ["Anh/chị viết yêu cầu báo giá và xin hàng mẫu.", "", "", "", "", "", "تكتبون طلبات عروض وتطلبون عيّنات.", "Talepler yazıyor ve numune istiyorsunuz."], "a3.h": ["Phân loại nguồn cung ứng", "", "", "", "", "", "تصنيف مصادر الشراء", "Tedarik kaynaklarını eşleştirmek"], "a3.i": ["Điền I (bên trong) hoặc E (bên ngoài) và hoàn thành các câu.", "", "", "", "", "", "أكمل I (داخلي) أو E (خارجي) وأكمل الجمل.", "I (iç) veya E (dış) yaz ve cümleleri tamamla."], "a3.t": ["Bên trong = đã có sẵn trong doanh nghiệp.", "", "", "", "", "", "داخلي = موجود بالفعل في الشركة.", "İç = işletmede zaten mevcut."], "a3.1.q": ["I hay E?", "", "", "", "", "", "I أم E؟", "I mi E mi?"], "a3.1.r0": ["tệp nhà cung cấp trong WWS", "", "", "", "", "", "ملف الموردين في نظام إدارة البضائع", "WWS'deki tedarikçi dosyası"], "a3.1.r1": ["hội chợ đồ chơi Nürnberg", "", "", "", "", "", "معرض الألعاب في نورنبرغ", "Nürnberg Oyuncak Fuarı"], "a3.1.r2": ["chuyến thăm của đại diện bán hàng", "", "", "", "", "", "زيارة مندوب", "temsilci ziyareti"], "a3.1.r3": ["các chào giá trước đây trong tập hồ sơ", "", "", "", "", "", "عروض سابقة في الملف", "klasördeki önceki teklifler"], "a3.1.r4": ["nền tảng „Wer liefert was“", "", "", "", "", "", "منصة „Wer liefert was“", "„Wer liefert was“ platformu"], "a3.2.q": ["Điền vào chỗ trống.", "", "", "", "", "", "أكمل الفراغات.", "Boşlukları doldur."], "a3.2.g": ["Ở nhà sản xuất tôi thường mua rẻ hơn, nhưng phải lấy số lượng tối thiểu lớn. Ở nhà bán buôn tôi cũng nhận được số lượng nhỏ và danh mục rộng, nhưng thường phải trả nhiều hơn.", "", "", "", "", "", "عند المنتِج أشتري غالباً بسعر أرخص، لكن يجب أن آخذ كميات دنيا كبيرة. عند تاجر الجملة أحصل أيضاً على كميات صغيرة وتشكيلة واسعة، لكنني أدفع غالباً أكثر.", "Üreticiden çoğu zaman daha ucuza alırım ama büyük minimum miktarlar almak zorundayım. Toptancıdan küçük miktarlar ve geniş bir ürün yelpazesi de alırım ama çoğunlukla daha fazla öderim."], "a4.h": ["Nguồn cung ứng và hợp tác", "", "", "", "", "", "مصادر الشراء والتعاون", "Tedarik kaynakları ve iş birliği"], "a4.i": ["Giải các bài tập. Bài cuối lấy từ Mô-đun 3.", "", "", "", "", "", "حل المهام. الأخيرة من الوحدة 3.", "Görevleri çöz. Sonuncusu Modül 3'ten."], "a4.t": ["Hợp tác xã mua hàng là sự liên kết của …", "", "", "", "", "", "تعاونية الشراء هي اتحاد من …", "Satın alma kooperatifi … birliğidir."], "a4.1.q": ["4.1 Kể ba nguồn cung ứng bên ngoài.", "", "", "", "", "", "4.1 اذكر ثلاثة مصادر شراء خارجية.", "4.1 Üç dış tedarik kaynağı söyle."], "a4.2.q": ["4.2 Giải thích hợp tác xã mua hàng là gì và nêu hai lợi ích cho nhà bán lẻ.", "", "", "", "", "", "4.2 اشرح ما هي تعاونية الشراء، واذكر ميزتين للتاجر.", "4.2 Satın alma kooperatifinin ne olduğunu açıkla ve tüccar için iki avantaj söyle."], "a4.3.q": ["4.3 Ôn (Mô-đun 3): Một nhà cung cấp mới gửi chào giá. Phải làm việc gì trong WWS?", "", "", "", "", "", "4.3 قديم (الوحدة 3): يرسل مورد جديد عرضاً. ما العمل الذي يجب إنجازه في نظام إدارة البضائع؟", "4.3 Eski (Modül 3): Yeni bir tedarikçi teklif gönderiyor. WWS'de hangi iş yapılmalıdır?"], "a4.3.o0": ["Tệp khách hàng được bổ sung.", "", "", "", "", "", "يُستكمل ملف الزبائن.", "Müşteri dosyası tamamlanır."], "a4.3.o1": ["Tệp nhà cung cấp được bổ sung.", "", "", "", "", "", "يُستكمل ملف الموردين.", "Tedarikçi dosyası tamamlanır."], "a4.3.o2": ["Tất cả chào giá được lưu trong phần ghi nhận đơn hàng.", "", "", "", "", "", "تُحفظ كل العروض في تسجيل الطلبيات.", "Tüm teklifler sipariş kaydında saklanır."], "a4.3.o3": ["Tệp kho được bổ sung.", "", "", "", "", "", "يُستكمل ملف المخزن.", "Depo dosyası tamamlanır."], "a4.3.o4": ["Mã GTIN được thay đổi.", "", "", "", "", "", "يُغيَّر رمز GTIN.", "GTIN değiştirilir."], "a5.h": ["Dành cho người giỏi: Thanh toán tập trung và sự phụ thuộc", "", "", "", "", "", "للمحترفين: التسوية المركزية والتبعية", "Profesyoneller için: Merkezi ödeme ve bağımlılık"], "a5.i": ["Trụ sở chính thanh toán hóa đơn cho nhà cung cấp và chịu trách nhiệm bảo đảm (Delkredere).", "", "", "", "", "", "المركز الرئيسي يدفع الفواتير للموردين ويضمنها (Delkredere).", "Merkez tedarikçilere faturaları öder ve bunun için kefil olur (Delkredere)."], "a5.t": ["Hãy nghĩ đến rủi ro và sự phụ thuộc.", "", "", "", "", "", "فكّر في المخاطر والتبعية.", "Riski ve bağımlılığı düşün."], "a5.1.q": ["5.1 Giải thích thanh toán tập trung và bảo lãnh thanh toán (Delkredere). Tại sao điều này hấp dẫn với nhà cung cấp?", "", "", "", "", "", "5.1 اشرح التسوية المركزية والضمان (Delkredere). لماذا يكون ذلك جذاباً للمورد؟", "5.1 Merkezi ödemeyi ve kefaleti (Delkredere) açıkla. Bu neden bir tedarikçi için caziptir?"], "a5.2.q": ["5.2 Một cửa hàng thời trang mua 80 % hàng của mình từ một nhà bán buôn duy nhất. Hãy đánh giá chiến lược này.", "", "", "", "", "", "5.2 يشتري متجر أزياء 80 % من بضاعته من تاجر جملة واحد فقط. قيّم هذه الاستراتيجية.", "5.2 Bir moda mağazası malının %80'ini tek bir toptancıdan alıyor. Bu stratejiyi değerlendir."]};

function ts(k){if(S.lang==='de'||!TR[k])return '';var t=TR[k][li()-1];if(!t)return '';return '<small class="b" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(t)+'</small>'}
var FS=[100,115,130,150];
var KEY='tu.lf6.'+SHEET.id+'.v1';
var missing={};
var S;
if(typeof TRC!=='undefined')for(var kk in TRC)if(!TR[kk])TR[kk]=TRC[kk];
function fresh(){return {name:'',date:new Date().toISOString().slice(0,10),lang:'de',lvl:'b',fs:0,a:{},tip:{},chk:{},mk:{},rc:{},sub:false,open:false,sol:{}}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
var st;function save(){clearTimeout(st);st=setTimeout(saveNow,350)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function li(){return LI.indexOf(S.lang)}
/* Übersetzung */
function trText(k){if(S.lang==='de')return '';var a=TR[k];var t=a&&a[li()-1];if(!t){missing[S.lang+':'+k]=1;return ''}return t}
function tl(k){if(S.lang==='de')return '';var t=trText(k);if(!t)return '<div class="tr miss">'+esc(UI.mis[li()])+'</div>';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(t)+'</div>'}
function tlo(k){if(S.lang==='de'||!TR[k])return '';return tl(k)}
function U(k){var a=UI[k];return a[li()]||a[0]}
function B(k){var g=UI[k][0];var t=S.lang!=='de'?UI[k][li()]:'';return esc(g)+(t?'<small class="b" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(t)+'</small>':'')}
/* Sichtbarkeit */
function vis(b){return b.lvl!=='v'||S.lvl==='v'}
function items(b){return (b.items||[]).filter(function(i){return i.t!=='note'&&i.t!=='est'})}
function A(id){return S.a[id]}
/* Bearbeitet? */
function answered(it){
 var v=A(it.id);
 switch(it.t){
 case 'free':return !!(v&&v.t&&v.t.trim());
 case 'mc':return v!=null;
 case 'calc':return !!(v&&String(v).trim());
 case 'gap':case 'table':case 'tf':case 'sel':var n=(it.rows||it.a).length;return !!v&&v.filter(function(x){return x!=null&&x!==''}).length>=n;
 }return false}
function units(){var u=[];SHEET.blocks.forEach(function(b){if(b.k==='read'){u.push({id:b.id,done:!!S.chk[b.id]&&A(b.id+'.q')!=null})}else if(vis(b)){items(b).forEach(function(it){u.push({id:it.id,done:answered(it)})})}});return u}
function updProg(){var u=units();var d=u.filter(function(x){return x.done}).length;var p=u.length?Math.round(100*d/u.length):0;var f=document.getElementById('progf');if(f){f.style.width=p+'%';document.getElementById('progt').textContent=U('progress')+': '+d+' / '+u.length+' '+U('done')+' ('+p+' %)'}
 var q=p===100&&!S.pdone;if(q){S.pdone=1;toast('🎉 100 %')}}
/* Bewertung */
function num(s){var t=String(s).replace(/\s/g,'').replace(/€|%|cm|g|kg|ml|l|m/gi,'');if(t.indexOf(',')>=0&&t.indexOf('.')>=0)t=t.replace(/\./g,'');t=t.replace(',','.');var x=parseFloat(t);return isNaN(x)?null:x}
function grade(it){
 var v=A(it.id),got=0,max=0,rows=[];
 switch(it.t){
 case 'free':max=it.pts||1;var s=v&&v.s!=null?v.s:null;got=s==null?0:[0,.5,1][s]*max;break;
 case 'mc':max=it.pts||1;if(v!=null&&v===it.a)got=max;break;
 case 'calc':max=it.pts||1;var n=num(v==null?'':v);if(n!=null&&Math.abs(n-it.a)<=(it.tol==null?0.005:it.tol))got=max;break;
 case 'table':case 'sel':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'tf':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'gap':it.a.forEach(function(a,i){max++;var ok=v&&v[i]===a;if(ok)got++;rows.push(ok)});break}
 return {got:got,max:max,rows:rows}}
function totals(){var g=0,m=0,bg=0;SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b))return;items(b).forEach(function(it){if(it.t==='free'&&b.noscore)return;var r=grade(it);if(b.lvl==='v')bg+=r.got;else{g+=r.got;m+=r.max}})});return {g:g,m:m,b:bg}}
function r1(x){return (Math.round(x*10)/10).toString().replace('.',',')}
/* Rendering */
function tipHTML(b){if(!b.tip)return '';return '<button class="tipb noprint" data-act="tip" data-id="'+b.id+'" aria-label="'+esc(UI.tip[0])+'">💡 '+esc(U('tip'))+'</button>'}
function tipBox(b){if(!b.tip||!S.tip[b.id])return '';return '<div class="tipbox">💡 '+esc(b.tip)+tl(b.tk||b.id+'.t')+'</div>'}
function opts(list,sel,cls,act,id,extra){return '<div class="opts">'+list.map(function(o,i){var c=cls?cls(i):'';return '<button class="opt'+(sel===i?' on':'')+(c?' '+c:'')+'" data-act="'+act+'" data-id="'+id+'" data-i="'+i+'">'+esc(o)+ts(id+'.o'+i)+'</button>'}).join('')+'</div>'}
function fbBox(kind,html){return '<div class="fb '+kind+'">'+html+'</div>'}
function showFb(b){return S.chk[b.id]||S.sub}
function renderItem(b,it){
 var v=A(it.id),fb=showFb(b),h='',g,q=it.q?'<div class="q">'+esc(it.q)+'</div>'+(it.nq?'':tl(it.qk||it.id+'.q')):'';
 switch(it.t){
 case 'note':return '<div class="sit">'+it.html+'</div>';
 case 'est':return renderEst(it);
 case 'free':
  v=v||{};h=q+'<textarea class="in" rows="4" data-act="txt" data-id="'+it.id+'" placeholder="…">'+esc(v.t||'')+'</textarea>';
  h+='<div class="noprint"><button class="btn sec" data-act="sol" data-id="'+it.id+'">'+B('sol')+'</button></div>';
  if(S.sol[it.id]||fb&&v.t){h+='<div class="model"><b>'+esc(UI.model[0])+'</b>'+it.model+'</div>';
   h+='<div class="q">'+esc(UI.selfq[0])+'</div>'+tl_ui('selfq')+'<div class="row2">'+[['selfyes',2],['selfpart',1],['selfno',0]].map(function(p){return '<button class="btn gray" style="'+(v.s===p[1]&&v.s!=null?'background:#e3f0f6;border-color:#2f6f8f':'')+'" data-act="self" data-id="'+it.id+'" data-i="'+p[1]+'">'+B(p[0])+'</button>'}).join('')+'</div>'}
  break;
 case 'mc':
  g=grade(it);h=q+opts(it.o,v,fb?function(i){return i===it.a?'ok':(v===i?'no':'')}:null,'mc',it.id);
  if(fb)h+=fbBox(g.got?'ok':'no',g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+esc(it.o[it.a])+'</b>');
  break;
 case 'calc':
  g=grade(it);h=q+'<div class="row2"><input class="in" style="max-width:12rem" inputmode="decimal" autocomplete="off" data-act="calc" data-id="'+it.id+'" value="'+esc(v||'')+'"><b>'+esc(it.unit||'')+'</b></div>';
  if(fb){var trap='';if(!g.got&&it.traps){var nv=num(v==null?'':v);it.traps.forEach(function(t){if(nv!=null&&Math.abs(nv-t[0])<=0.006)trap='<div>⚠ '+esc(t[1])+'</div>'+tl(it.id+'.w')})}h+=fbBox(g.got?'ok':'no',(g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+r1(it.a)+' '+esc(it.unit||'')+'</b>')+trap+'<div><b>'+esc(UI.steps[0])+':</b><br>'+it.steps.map(esc).join('<br>')+'</div>'+tl_ui('steps'))}
  break;
 case 'table':
  g=grade(it);h=q+'<table class="tbl"><tr><th>'+(it.hd||'')+'</th>'+it.cols.map(function(c){return '<th class="c" title="'+esc(c[1]||'')+'">'+esc(c[0])+'</th>'}).join('')+'</tr>'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+it.cols.map(function(c,j){var cl=sel===j?' on':'';if(fb){if(j===r[1])cl+=sel===j?' ok':' sol';else if(sel===j)cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tb" data-id="'+it.id+'" data-r="'+i+'" data-i="'+j+'" aria-label="'+esc(c[1]||c[0])+'">'+esc(c[0])+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(it.legend)h+='<div class="meta">'+esc(it.legend)+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>'+tlo(it.id+'.g');
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p,pi){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'+tlo(b.id+'.p'+pi)}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';

function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}

 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}

 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
