.big{font-size:1.1rem}

var SHEET={"id": "LF6_M_9", "mod": "Modul 9", "title": "Quantitativer Angebotsvergleich", "meta": "Lernfeld 6 · Waren beschaffen · DS 17–18 · Lehrbuch S. 38–40 · Arbeitsheft S. 26–33", "can": ["zwei oder drei Angebote auf dieselbe Menge und Mengeneinheit bringen.", "für jedes Angebot den Bezugspreis mit dem Schema berechnen und das günstigste Angebot bestimmen.", "typische Fallen erkennen: Fracht statt frei Haus, Skonto nur, wenn angeboten, Rabatt nur ab einer Menge.", "begründen, warum der niedrigste Listenpreis nicht immer das günstigste Angebot ist."], "blocks": [{"k": "task", "id": "a1", "n": "Aufgabe 1", "h": "Ankommen: Fünf Fragen aus dem Kopf", "intro": "Ohne Buch, ohne Handy.", "tip": "Bezugspreis = netto (für die Kalkulation). Überweisungsbetrag = brutto (was vom Konto geht).", "items": [{"t": "calc", "id": "a1.1", "q": "1.1 Rechnungsbetrag 3.820,00 €, 3 % Skonto. Überweisungsbetrag? (Modul 8)", "a": 3705.4, "unit": "€", "steps": ["3.820,00 × 3 : 100 = 114,60", "3.820,00 − 114,60 = 3.705,40 €"]}, {"t": "mc", "id": "a1.2", "q": "1.2 Ist der Bezugspreis netto oder brutto? (Modul 8)", "o": ["netto (ohne Umsatzsteuer)", "brutto (mit Umsatzsteuer)"], "a": 0}, {"t": "mc", "id": "a1.3", "q": "1.3 Was ist ein Bonus? (Modul 6)", "o": ["nachträglicher Nachlass bei Erreichen einer Umsatzhöhe", "Nachlass für schnelles Bezahlen", "Nachlass für große Mengen"], "a": 0}]}, {"k": "read", "id": "r1", "h": "Zum Nachlesen: Angebote rechnerisch vergleichen (Lehrbuch S. 38–40)", "sum": "Der niedrigste Listenpreis ist oft nicht das günstigste Angebot.", "paras": ["Zuerst alle Angebote auf [[dieselbe Menge]] bringen. Dann für jedes den [[Bezugspreis]] rechnen.", "Fallen: [[Fracht]] statt frei Haus, Skonto nur wenn angeboten, [[ohne Abzug]] = kein Skonto."], "q": {"q": "Welches Angebot ist rechnerisch das günstigste?", "o": ["das mit dem niedrigsten Bezugspreis", "das mit dem niedrigsten Listenpreis", "das mit dem höchsten Rabatt"], "a": 0}}, {"k": "task", "id": "a2", "n": "Aufgabe 2", "h": "Deckenstrahler – zwei Angebote", "intro": "Für 100 Deckenstrahler liegen zwei Angebote vor.", "tip": "Nebeneinander rechnen, Zeile für Zeile.", "sit": "<p><b>Italo:</b> 55,50 € je Stück, 15 % Rabatt, frei Haus, 3 % Skonto<br><b>Susan:</b> 50,00 € je Stück, 10 % Rabatt, Fracht 20,00 €, 30 Tage ohne Abzug</p>", "items": [{"t": "calc", "id": "a2.1", "q": "Bezugspreis Italo (100 Stück)?", "a": 4575.97, "unit": "€", "steps": ["5.550,00 − 832,50 = 4.717,50 €", "− 3 % = 141,53 € → 4.575,97 €", "+ 0,00 € = 4.575,97 €"]}, {"t": "calc", "id": "a2.2", "q": "Bezugspreis Susan (100 Stück)?", "a": 4520.0, "unit": "€", "steps": ["5.000,00 − 500,00 = 4.500,00 €", "kein Skonto", "+ 20,00 € = 4.520,00 €"], "traps": [[4410, "Bei Susan gibt es kein Skonto („ohne Abzug“) – aber Fracht."], [4500, "Fracht vergessen."]]}]}, {"k": "task", "id": "a3", "n": "Aufgabe 3", "h": "Alpha oder Beta?", "intro": "Beide frei Haus. Ergänze.", "tip": "Zwei Grundregeln: Rabatt vom Listeneinkaufspreis – Skonto vom Zieleinkaufspreis.", "sit": "<p><b>Alpha:</b> 17,80 €, 20 % Rabatt, 3 % Skonto<br><b>Beta:</b> 15,95 €, 5 % Rabatt, 2 % Skonto</p>", "items": [{"t": "calc", "id": "a3.1", "q": "Bezugspreis Alpha?", "a": 13.81, "unit": "€", "steps": ["17,80 − 3,56 = 14,24 €", "14,24 − 0,43 = 13,81 €"]}, {"t": "calc", "id": "a3.2", "q": "Bezugspreis Beta?", "a": 14.85, "unit": "€", "steps": ["15,95 − 0,80 = 15,15 €", "15,15 − 0,30 = 14,85 €"]}, {"t": "mc", "id": "a3.3", "q": "3.1 Welches Angebot ist günstiger, obwohl sein Listenpreis höher ist? Begründe kurz.", "o": ["Alpha", "Beta"], "a": 0, "ex": "Der niedrigste Listenpreis ist oft nicht das günstigste Angebot."}]}, {"k": "task", "id": "a4", "n": "Aufgabe 4", "h": "Angebote vergleichen wie in der Prüfung", "intro": "Rechne jeden Vergleich vollständig. Trag das geforderte Ergebnis in die Kästchen ein. Die letzte Aufgabe kommt aus Modul 8.", "tip": "Fracht oder frei Haus? Skonto angeboten oder „ohne Abzug“? Gilt der Rabatt erst ab einer Menge?", "sit": "<p><b>A:</b> 4,20 €, 10 % Rabatt, 2 % Skonto, Fracht 18,00 €<br><b>B:</b> 4,00 €, kein Rabatt, 3 % Skonto, frei Haus<br><b>C:</b> 4,50 €, 15 % Rabatt, ohne Abzug, Fracht 12,00 €</p>", "items": [{"t": "calc", "id": "a4.1", "q": "Ermitteln Sie den niedrigsten Bezugspreis für 200 Stück.", "a": 758.88, "unit": "€", "steps": ["A: 840,00 − 84,00 = 756,00 − 15,12 = 740,88 + 18,00 = 758,88 €", "B: 800,00 − 24,00 = 776,00 + 0,00 = 776,00 €", "C: 900,00 − 135,00 = 765,00 + 12,00 = 777,00 €", "→ A ist am günstigsten: 758,88 €"], "traps": [[776, "B hat den niedrigsten Listenpreis – aber nicht den niedrigsten Bezugspreis."]]}, {"t": "mc", "id": "a4.2", "q": "4.2 Sie erhalten Angebote über Kaffee. Welches Angebot ist bei einem Bedarf von 200 kg am günstigsten?", "o": ["1.080,00 € je 100 kg, 3 % Skonto", "1.020,00 € je 100 kg, 2 % Skonto", "520,00 € je 50 kg, 1 % Skonto", "10,40 € je 1 kg, 3 % Skonto", "540,00 € je 50 kg, 1 % Skonto"], "a": 1}, {"t": "free", "id": "a4.3", "q": "4.3 Nenne drei „Fallen“, auf die du beim Angebotsvergleich achtest.", "model": "Fracht statt frei Haus; Skonto nur, wenn angeboten („ohne Abzug“); Rabatt erst ab einer Mindestmenge; unterschiedliche Mengeneinheiten"}, {"t": "calc", "id": "a4.4", "q": "4.4 Alt (Modul 8): Rechnungsbetrag 2.278,85 €, 2 % Skonto. Überweisungsbetrag?", "a": 2233.27, "unit": "€", "steps": ["2.278,85 × 0,98 = 2.233,27 €"]}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Wann kippt das Angebot?", "intro": "Italo 4.575,97 € – Susan ohne Fracht 4.500,00 €.", "tip": "Differenz der beiden Bareinkaufspreise.", "items": [{"t": "calc", "id": "a5.1", "q": "5.1 Im Deckenstrahler-Fall: Ab welcher Frachtpauschale wäre Susan nicht mehr günstiger als Italo (100 Stück)?", "a": 75.97, "unit": "€", "steps": ["4.575,97 − 4.500,00 = 75,97 €", "bei Fracht über 75,97 € wäre Italo günstiger"]}, {"t": "free", "id": "a5.2", "q": "5.2 Bei Susan gibt es 10 % Rabatt nur ab 200 Stück. Die Nordstadt-Kauf GmbH braucht 150. Lohnt es sich, 200 zu bestellen? Rechne (Fracht 20,00 €) und nenne einen Grund dagegen.", "model": "150 Stück ohne Rabatt: 7.500,00 + 20,00 = 7.520,00 € (50,13 €/Stück). 200 Stück: 10.000 − 1.000 + 20 = 9.020,00 € (45,10 €/Stück). Je Stück günstiger, aber 1.500 € mehr Ausgaben, 50 Stück Lagerbestand → Kapitalbindung, Lagerrisiko (Modul 1)."}]}]};
var TR={"title": ["So sánh chào giá định lượng", "", "", "", "", "", "المقارنة الكمية للعروض", "Nicel teklif karşılaştırması"], "can.0": ["đưa hai hoặc ba chào giá về cùng số lượng và đơn vị đo.", "", "", "", "", "", "توحيد عرضين أو ثلاثة على نفس الكمية ووحدة القياس.", "iki veya üç teklifi aynı miktar ve ölçü birimine getirmek."], "can.1": ["tính giá nhập cho từng chào giá theo sơ đồ và xác định chào giá rẻ nhất.", "", "", "", "", "", "حساب سعر الشراء النهائي لكل عرض بالمخطط وتحديد العرض الأرخص.", "her teklif için alış maliyetini şemayla hesaplamak ve en uygun teklifi belirlemek."], "can.2": ["nhận ra các bẫy điển hình: có cước thay vì giao miễn phí, chiết khấu chỉ khi được chào, giảm giá chỉ từ một số lượng nhất định.", "", "", "", "", "", "التعرف على الأفخاخ النموذجية: شحن بدلاً من توصيل مجاني، خصم الدفع النقدي فقط إذا عُرض، الخصم فقط من كمية معينة.", "tipik tuzakları tanımak: adrese teslim yerine navlun, iskonto sadece teklif edilmişse, indirim sadece belli bir miktardan itibaren."], "can.3": ["giải thích tại sao giá niêm yết thấp nhất không phải lúc nào cũng là chào giá rẻ nhất.", "", "", "", "", "", "تعليل لماذا لا يكون أدنى سعر قائمة دائماً العرض الأرخص.", "en düşük liste fiyatının neden her zaman en uygun teklif olmadığını gerekçelendirmek."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Giá nhập = giá ròng (để tính giá). Số tiền chuyển khoản = giá gộp (số tiền rời khỏi tài khoản).", "", "", "", "", "", "سعر الشراء النهائي = صافٍ (للحساب). مبلغ التحويل = إجمالي (ما يُسحب من الحساب).", "Alış maliyeti = net (hesaplama için). Havale tutarı = brüt (hesaptan çıkan)."], "a1.1.q": ["1.1 Số tiền hóa đơn 3.820,00 €, chiết khấu 3 %. Số tiền chuyển khoản? (Mô-đun 8)", "", "", "", "", "", "1.1 مبلغ الفاتورة 3.820,00 €، خصم 3 %. مبلغ التحويل؟ (الوحدة 8)", "1.1 Fatura tutarı 3.820,00 €, %3 iskonto. Havale tutarı? (Modül 8)"], "a1.2.q": ["1.2 Giá nhập là giá ròng hay giá gộp? (Mô-đun 8)", "", "", "", "", "", "1.2 هل سعر الشراء النهائي صافٍ أم إجمالي؟ (الوحدة 8)", "1.2 Alış maliyeti net mi brüt mü? (Modül 8)"], "a1.2.o0": ["giá ròng (chưa có thuế GTGT)", "", "", "", "", "", "صافٍ (بدون ضريبة المبيعات)", "net (KDV hariç)"], "a1.2.o1": ["giá gộp (có thuế GTGT)", "", "", "", "", "", "إجمالي (مع ضريبة المبيعات)", "brüt (KDV dahil)"], "a1.3.q": ["1.3 Thưởng doanh số (Bonus) là gì? (Mô-đun 6)", "", "", "", "", "", "1.3 ما هي المكافأة (Bonus)؟ (الوحدة 6)", "1.3 Bonus nedir? (Modül 6)"], "a1.3.o0": ["khoản giảm giá sau khi đạt một mức doanh số", "", "", "", "", "", "خصم لاحق عند بلوغ حجم إيرادات معين", "belirli bir ciroya ulaşınca sonradan indirim"], "a1.3.o1": ["giảm giá khi thanh toán nhanh", "", "", "", "", "", "خصم مقابل الدفع السريع", "hızlı ödeme indirimi"], "a1.3.o2": ["giảm giá cho số lượng lớn", "", "", "", "", "", "خصم للكميات الكبيرة", "büyük miktar indirimi"], "r1.h": ["Đọc thêm: So sánh chào giá bằng tính toán (Sách giáo khoa tr. 38–40)", "", "", "", "", "", "للقراءة: مقارنة العروض حسابياً (الكتاب ص 38–40)", "Okuma: Teklifleri hesaplayarak karşılaştırmak (Ders kitabı s. 38–40)"], "r1.s": ["Giá niêm yết thấp nhất thường không phải là chào giá rẻ nhất.", "", "", "", "", "", "أدنى سعر قائمة ليس غالباً العرض الأرخص.", "En düşük liste fiyatı çoğu zaman en uygun teklif değildir."], "r1.p0": ["Trước tiên đưa mọi chào giá về cùng số lượng. Rồi tính giá nhập cho từng cái.", "", "", "", "", "", "أولاً وحّد كل العروض على نفس الكمية. ثم احسب سعر الشراء النهائي لكل منها.", "Önce tüm teklifleri aynı miktara getir. Sonra her biri için alış maliyetini hesapla."], "r1.p1": ["Các bẫy: có cước thay vì giao miễn phí, chiết khấu chỉ khi được chào, không được trừ = không có chiết khấu.", "", "", "", "", "", "الأفخاخ: شحن بدلاً من توصيل مجاني، خصم فقط إذا عُرض، بدون خصم = لا يوجد Skonto.", "Tuzaklar: adrese teslim yerine navlun, iskonto sadece teklif edilmişse, indirimsiz = iskonto yok."], "r1.qq": ["Chào giá nào rẻ nhất về mặt tính toán?", "", "", "", "", "", "أي عرض هو الأرخص حسابياً؟", "Hesap olarak hangi teklif en uygundur?"], "r1.q.o0": ["chào giá có giá nhập thấp nhất", "", "", "", "", "", "ذو أدنى سعر شراء نهائي", "en düşük alış maliyetine sahip olan"], "r1.q.o1": ["chào giá có giá niêm yết thấp nhất", "", "", "", "", "", "ذو أدنى سعر قائمة", "en düşük liste fiyatına sahip olan"], "r1.q.o2": ["chào giá giảm giá nhiều nhất", "", "", "", "", "", "ذو أعلى خصم", "en yüksek indirime sahip olan"], "a2.h": ["Đèn trần – hai chào giá", "", "", "", "", "", "مصابيح السقف – عرضان", "Tavan spotları – iki teklif"], "a2.i": ["Có hai chào giá cho 100 đèn trần.", "", "", "", "", "", "يوجد عرضان لـ 100 مصباح سقف.", "100 tavan spotu için iki teklif var."], "a2.t": ["Tính song song, từng dòng một.", "", "", "", "", "", "احسب جنباً إلى جنب، سطراً سطراً.", "Yan yana hesapla, satır satır."], "a2.1.q": ["Giá nhập của Italo (100 cái)?", "", "", "", "", "", "سعر الشراء النهائي لدى Italo (100 قطعة)؟", "Italo alış maliyeti (100 adet)?"], "a2.2.q": ["Giá nhập của Susan (100 cái)?", "", "", "", "", "", "سعر الشراء النهائي لدى Susan (100 قطعة)؟", "Susan alış maliyeti (100 adet)?"], "a2.2.w": ["Em quên cước.", "", "", "", "", "", "نسيت الشحن.", "Navlunu unuttun."], "a3.h": ["Alpha hay Beta?", "", "", "", "", "", "Alpha أم Beta؟", "Alpha mı Beta mı?"], "a3.i": ["Cả hai đều giao miễn phí. Hãy điền vào.", "", "", "", "", "", "كلاهما بتوصيل مجاني. أكمل.", "İkisi de adrese teslim. Tamamla."], "a3.t": ["Hai quy tắc cơ bản: giảm giá tính từ giá mua niêm yết – chiết khấu tính từ giá mua trả chậm.", "", "", "", "", "", "قاعدتان أساسيتان: الخصم من سعر الشراء حسب القائمة – وخصم الدفع النقدي من سعر الشراء الآجل.", "İki temel kural: indirim liste alış fiyatından – iskonto vadeli alış fiyatından."], "a3.1.q": ["Giá nhập của Alpha?", "", "", "", "", "", "سعر الشراء النهائي لـ Alpha؟", "Alpha alış maliyeti?"], "a3.2.q": ["Giá nhập của Beta?", "", "", "", "", "", "سعر الشراء النهائي لـ Beta؟", "Beta alış maliyeti?"], "a3.3.q": ["3.1 Chào giá nào rẻ hơn dù giá niêm yết cao hơn? Giải thích ngắn gọn.", "", "", "", "", "", "3.1 أي عرض أرخص رغم أن سعر قائمته أعلى؟ علّل باختصار.", "3.1 Liste fiyatı daha yüksek olmasına rağmen hangi teklif daha uygundur? Kısaca gerekçelendir."], "a3.3.e": ["Giá niêm yết thấp nhất thường không phải là chào giá rẻ nhất.", "", "", "", "", "", "أدنى سعر قائمة ليس غالباً العرض الأرخص.", "En düşük liste fiyatı çoğu zaman en uygun teklif değildir."], "a3.3.o0": ["Alpha", "", "", "", "", "", "Alpha", "Alpha"], "a3.3.o1": ["Beta", "", "", "", "", "", "Beta", "Beta"], "a4.h": ["So sánh chào giá như trong kỳ thi", "", "", "", "", "", "مقارنة العروض كما في الامتحان", "Teklifleri sınavdaki gibi karşılaştırmak"], "a4.i": ["Tính đầy đủ từng phép so sánh. Ghi kết quả được yêu cầu vào các ô. Bài cuối lấy từ Mô-đun 8.", "", "", "", "", "", "احسب كل مقارنة كاملة. اكتب النتيجة المطلوبة في المربعات. المهمة الأخيرة من الوحدة 8.", "Her karşılaştırmayı tam hesapla. İstenen sonucu kutucuklara yaz. Son görev Modül 8'den."], "a4.t": ["Có cước hay giao miễn phí? Có chiết khấu hay „không được trừ“? Giảm giá có chỉ áp dụng từ một số lượng nhất định không?", "", "", "", "", "", "شحن أم توصيل مجاني؟ هل عُرض خصم أم „بدون خصم“؟ هل يسري الخصم فقط من كمية معينة؟", "Navlun mu adrese teslim mi? İskonto var mı yoksa „indirimsiz“ mi? İndirim ancak belli bir miktardan itibaren mi geçerli?"], "a4.1.q": ["Hãy xác định giá nhập thấp nhất cho 200 cái.", "", "", "", "", "", "احسبوا أدنى سعر شراء نهائي لـ 200 قطعة.", "200 adet için en düşük alış maliyetini belirleyin."], "a4.1.w": ["B có giá niêm yết thấp nhất – nhưng không có giá nhập thấp nhất.", "", "", "", "", "", "B له أدنى سعر قائمة – لكن ليس أدنى سعر شراء نهائي.", "B en düşük liste fiyatına sahip – ama en düşük alış maliyetine değil."], "a4.2.q": ["4.2 Anh/chị nhận được các chào giá cà phê. Với nhu cầu 200 kg, chào giá nào rẻ nhất?", "", "", "", "", "", "4.2 تتلقون عروضاً للقهوة. أي عرض هو الأرخص عند حاجة قدرها 200 كغ؟", "4.2 Kahve için teklifler alıyorsunuz. 200 kg ihtiyaçta hangi teklif en uygundur?"], "a4.2.o0": ["1.080,00 € mỗi 100 kg, chiết khấu 3 %", "", "", "", "", "", "1.080,00 € لكل 100 كغ، خصم 3 %", "100 kg başına 1.080,00 €, %3 iskonto"], "a4.2.o1": ["1.020,00 € mỗi 100 kg, chiết khấu 2 %", "", "", "", "", "", "1.020,00 € لكل 100 كغ، خصم 2 %", "100 kg başına 1.020,00 €, %2 iskonto"], "a4.2.o2": ["520,00 € mỗi 50 kg, chiết khấu 1 %", "", "", "", "", "", "520,00 € لكل 50 كغ، خصم 1 %", "50 kg başına 520,00 €, %1 iskonto"], "a4.2.o3": ["10,40 € mỗi 1 kg, chiết khấu 3 %", "", "", "", "", "", "10,40 € لكل 1 كغ، خصم 3 %", "kg başına 10,40 €, %3 iskonto"], "a4.2.o4": ["540,00 € mỗi 50 kg, chiết khấu 1 %", "", "", "", "", "", "540,00 € لكل 50 كغ، خصم 1 %", "50 kg başına 540,00 €, %1 iskonto"], "a4.3.q": ["4.3 Kể ba „cái bẫy“ em chú ý khi so sánh chào giá.", "", "", "", "", "", "4.3 اذكر ثلاثة „أفخاخ“ تنتبه لها عند مقارنة العروض.", "4.3 Teklif karşılaştırmasında dikkat ettiğin üç „tuzak“ söyle."], "a4.4.q": ["4.4 Ôn (Mô-đun 8): Số tiền hóa đơn 2.278,85 €, chiết khấu 2 %. Số tiền chuyển khoản?", "", "", "", "", "", "4.4 قديم (الوحدة 8): مبلغ الفاتورة 2.278,85 €، خصم 2 %. مبلغ التحويل؟", "4.4 Eski (Modül 8): Fatura tutarı 2.278,85 €, %2 iskonto. Havale tutarı?"], "a5.h": ["Dành cho người giỏi: Khi nào chào giá đảo chiều?", "", "", "", "", "", "للمحترفين: متى ينقلب العرض؟", "Profesyoneller için: Teklif ne zaman tersine döner?"], "a5.i": ["Italo 4.575,97 € – Susan không tính cước 4.500,00 €.", "", "", "", "", "", "Italo ‏4.575,97 € – Susan بدون شحن 4.500,00 €.", "Italo 4.575,97 € – Susan navlunsuz 4.500,00 €."], "a5.t": ["Hiệu số giữa hai giá mua trả tiền mặt.", "", "", "", "", "", "الفرق بين سعرَي الشراء النقدي.", "İki peşin alış fiyatı arasındaki fark."], "a5.1.q": ["5.1 Trong trường hợp đèn trần: Từ mức cước trọn gói nào thì Susan không còn rẻ hơn Italo (100 cái)?", "", "", "", "", "", "5.1 في حالة مصابيح السقف: من أي مبلغ شحن مقطوع  return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
