     {a:T("🧶 Ein Teppich zum Barfußlaufen¦🧶 Tấm thảm để đi chân trần¦🧶 Çıplak ayakla yürümek için halı¦🧶 سجادة للمشي حافي القدمين¦🧶 Una alfombra para caminar descalzo¦🧶 Um tapete para andar descalço¦🧶 ጽፍሒ ብዘይ ሳእኒ ንምኻድ¦🧶 Ковёр, по которому приятно ходить босиком"),c:4}],
 merke:T("Fünf Sinne: Sehen, Hören, Riechen, Schmecken, Fühlen.¦Năm giác quan: Nhìn, Nghe, Ngửi, Nếm, Chạm.¦Beş duyu: Görme, İşitme, Koklama, Tatma, Dokunma.¦الحواس الخمس: البصر، السمع، الشم، التذوّق، اللمس.¦Cinco sentidos: vista, oído, olfato, gusto, tacto.¦Cinco sentidos: visão, audição, olfato, paladar, tato.¦ሓሙሽተ ስምዒታት: ምርኣይ፣ ምስማዕ፣ ምጨናን፣ ምጥዓም፣ ምትንካፍ።¦Пять чувств: зрение, слух, обоняние, вкус, осязание."),
},
{t:"multi",ch:4,say:P,
 q:T("„Die Aktion „Grillsaison“ startet. Wähle zwei Maßnahmen, die zwei verschiedene Sinne ansprechen – mit „damit …“.“¦„Chương trình „Mùa nướng“ bắt đầu. Chọn hai biện pháp tác động đến hai giác quan khác nhau – có „để …“.“¦„„Mangal Sezonu“ kampanyası başlıyor. İki farklı duyuya hitap eden iki önlem seç – „… için“ ile.“¦«تبدأ حملة «موسم الشواء». اختر إجراءين يخاطبان حاستين مختلفتين – مع «حتى …».»¦„Empieza la campaña «Temporada de barbacoa». Elige dos medidas que lleguen a dos sentidos distintos, con «para que…».“¦„Começa a campanha «Época dos grelhados». Escolhe duas medidas que chegam a dois sentidos diferentes, com «para que…».“¦„ዕዮ „ወቅቲ ምብሳል ስጋ“ ይጅምር። ክልተ ዝተፈላለዩ ስምዒታት ዘዘራርቡ ክልተ ተግባራት ምረጽ – ምስ „ብምኽንያት …“።“¦«Стартует акция «Сезон барбекю». Выбери две меры, воздействующие на два разных чувства, с «чтобы …».»"),
 o:[{a:T("Vor dem Eingang wird gegrillt, damit der Duft die Kunden anlockt und Appetit macht.¦Nướng thịt trước cửa để mùi thơm thu hút khách và gợi cảm giác thèm ăn.¦Girişte mangal yapılır, böylece koku müşterileri çeker ve iştah açar.¦يُشوى أمام المدخل حتى تجذب الرائحة الزبائن وتفتح شهيّتهم.¦Se asa delante de la entrada para que el olor atraiga a los clientes y abra el apetito.¦Grelha-se à entrada para que o cheiro atraia os clientes e abra o apetite.¦ኣብ ኣፍ ደገ ስጋ ይብሰል፣ ጨና ዓሚላት ክስሕብን ሃረር ክገብርን።¦Перед входом жарят мясо, чтобы запах привлекал клиентов и вызывал аппетит."),ok:1},
    {a:T("Die Grillzange hängt hinter Glas, damit niemand sie anfassen kann.¦Kẹp nướng treo sau kính để không ai chạm vào được.¦Mangal maşası camın arkasında asılı, böylece kimse dokunamaz.¦تُعلَّق ملقط الشواء خلف زجاج حتى لا يلمسه أحد.¦La pinza de barbacoa está tras un cristal para que nadie la toque.¦A pinça de grelhar está atrás de vidro para que ninguém lhe toque.¦ መሓዚ ስጋ ኣብ ድሕሪ ሚራት ተሰቒሉ፣ ሓደ እኳ ከይትንክፎ።¦Щипцы для гриля висят за стеклом, чтобы их никто не трогал.")},
    {a:T("Kunden dürfen neue Grillsoßen probieren, damit sie sich vom Geschmack überzeugen.¦Khách được nếm thử nước sốt nướng mới để tự kiểm chứng hương vị.¦Müşteriler yeni mangal soslarını deneyebilir, böylece tadına ikna olur.¦يمكن للزبائن تجربة صلصات شواء جديدة حتى يقتنعوا بالطعم.¦Los clientes pueden probar salsas nuevas para que se convenzan del sabor.¦Os clientes podem provar molhos novos para se convencerem do sabor.¦ዓሚላት ሓደሽቲ ሶሶታት ክጥዕሙ ይኽእሉ፣ ብጥዕሞም ክእመኑ።¦Клиенты могут попробовать новые соусы, чтобы убедиться во вкусе."),ok:1},
    {a:T("Die Abteilung wird abgedunkelt, damit Kunden schneller gehen.¦Gian hàng được làm tối để khách ra về nhanh hơn.¦Reyon karartılır, böylece müşteriler daha hızlı gider.¦يُعتَّم القسم حتى يغادر الزبائن أسرع.¦La sección se oscurece para que los clientes se vayan antes.¦A secção é escurecida para os clientes saírem mais depressa.¦እቲ ክፍሊ ይጸልም፣ ዓሚላት ቀልጢፎም ክወጹ።¦В отделе приглушают свет, чтобы клиенты быстрее уходили.")}],
 good:T("Stark! Riechen und Schmecken – und jedes Beispiel hat ein „damit …“. Das gibt volle Punkte! Spur 4 gesichert!¦Giỏi lắm! Ngửi và Nếm – và mỗi ví dụ đều có „để …“. Như vậy được điểm tối đa! Manh mối 4 đã có!¦Harika! Koklama ve Tatma – ve her örnekte „… için“ var. Bu tam puan getirir! 4. iz tamam!¦ممتاز! الشم والتذوّق – ولكل مثال «حتى …». هذا يعطي الدرجة الكاملة! الدليل 4 محفوظ!¦¡Muy bien! Olfato y gusto, y cada ejemplo lleva «para que…». ¡Puntuación completa! ¡Pista 4 asegurada!¦Muito bem! Olfato e paladar, e cada exemplo tem «para que…». Pontuação máxima! Pista 4 garantida!¦ድንቂ! ምጨናንን ምጥዓምን – ከምኡውን ነፍሲ ወከፍ ኣብነት „ብምኽንያት …“ ኣለዎ። ምሉእ ነጥቢ! ምልክት 4 ተሓሊዩ!¦Отлично! Обоняние и вкус, и в каждом примере есть «чтобы …». Это полный балл! Улика 4 найдена!"),
 merke:T("Im Prüfungstext: Sinn nennen + ein Beispiel mit „damit …“.¦Trong bài thi: nêu giác quan + một ví dụ có „để …“.¦Sınav metninde: Duyuyu söyle + „… için“ ile bir örnek ver.¦في نص الامتحان: اذكر الحاسة + مثالاً مع «حتى …».¦En el examen: nombra el sentido + un ejemplo con «para que…».¦No exame: indica o sentido + um exemplo com «para que…».¦ኣብ ፈተና: ስምዒት ጥቐስ + ኣብነት ምስ „ብምኽንያት …“።¦В экзамене: назови чувство + пример с «чтобы …»."),
},
/* ===== Kapitel 6: Die Auflösung ===== */
{t:"branch",ch:5,img:"s1",
 p:[T("Freitag. Filialleiter Herr Brandt ruft alle zusammen. Der Hausmeister Herr Lenz meldet sich: „Beim Umbau habe ich alles nach Gefühl eingestellt: grelles Rot, laute Musik, starker Duft.“ Der Täter ist also kein böser Mensch – es fehlte ein Plan!¦Thứ Sáu. Quản lý chi nhánh, ông Brandt, gọi mọi người lại. Bác bảo vệ-thợ sửa Lenz lên tiếng: „Khi cải tạo, tôi chỉnh mọi thứ theo cảm tính: đỏ chói, nhạc to, mùi nồng.“ Vậy thủ phạm không phải người xấu – mà là thiếu một kế hoạch!¦Cuma. Şube müdürü Bay Brandt herkesi topluyor. Tesisat görevlisi Bay Lenz söz alıyor: „Yenilemede her şeyi hislerime göre ayarladım: parlak kırmızı, yüksek müzik, güçlü koku.“ Yani fail kötü biri değil – eksik olan bir plandı!¦يوم الجمعة. مدير الفرع السيد برانت يجمع الجميع. يتحدّث الفنّي السيد لينز: «عند التجديد ضبطت كل شيء حسب إحساسي: أحمر فاقع وموسيقى عالية ورائحة قوية.» إذن الفاعل ليس شخصاً سيئاً – بل كان ينقص تخطيط!¦Viernes. El jefe de sucursal, el señor Brandt, reúne a todos. El conserje, el señor Lenz, habla: «En la reforma lo ajusté todo a ojo: rojo chillón, música alta, olor fuerte.» ¡El culpable no es una mala persona: faltaba un plan!¦Sexta-feira. O gerente, o Sr. Brandt, reúne todos. O zelador, o Sr. Lenz, fala: «Na remodelação ajustei tudo ao sentimento: vermelho forte, música alta, cheiro intenso.» O culpado não é uma pessoa má: faltou um plano!¦ዓርቢ። ሓላፊ ቅርጫፍ ኣቶ ብራንት ንኹሉ የኼብ። እቲ ሓላፊ ጽዕንቶ ኣቶ ሌንዝ ይዛረብ: «ኣብ ዕደ-ሓድሽ ኩሉ ብስምዒተይ ኣዳሊየዮ: ጽዑቕ ቀይሕ፣ ዓው ዝበለ ሙዚቃ፣ ብርቱዕ ጨና።» እምበኣር እቲ ገበርቲ ሕማቕ ሰብ ኣይኮነን – ፕላን ጎዶሎ እዩ ነይሩ!¦Пятница. Управляющий господин Брандт собирает всех. Заговорил завхоз господин Ленц: «При ремонте я всё настроил на глаз: кричащий красный, громкая музыка, сильный запах». Виновник — не злодей, просто не было плана!")],
 say:[B,T("„Was machen wir jetzt mit der Abteilung?“¦„Bây giờ chúng ta làm gì với gian hàng?“¦„Şimdi reyonla ne yapıyoruz?“¦«ماذا نفعل الآن بالقسم؟»¦„¿Qué hacemos ahora con la sección?“¦„O que fazemos agora com a secção?“¦„ሕጂ ምስ እቲ ክፍሊ እንታይ ንገብር?“¦«Что нам теперь делать с отделом?»")],
 o:[{a:T("🔊 Wir machen alles noch lauter, greller und stärker – dann fällt es auf!¦🔊 Làm mọi thứ to hơn, chói hơn, nồng hơn – như thế sẽ gây chú ý!¦🔊 Her şeyi daha yüksek, daha parlak ve daha güçlü yapalım – o zaman dikkat çeker!¦🔊 نجعل كل شيء أعلى وأسطع وأقوى – فيلفت النظر!¦🔊 Lo hacemos todo más fuerte, más chillón y más intenso: ¡así llamará la atención!¦🔊 Fazemos tudo mais alto, mais forte e mais intenso: assim chama a atenção!¦🔊 ኩሉ ዝያዳ ዓው፣ ዝያዳ ብርሃንን ዝያዳ ብርቱዕን ንግበሮ – ሽዑ ትኩረት ይስሕብ!¦🔊 Сделаем всё громче, ярче и сильнее — тогда заметят!"),
     fb:T("Drei Wochen später: Kunden gehen noch schneller. Zu viele Reize wirken unangenehm.¦Ba tuần sau: Khách còn ra về nhanh hơn. Quá nhiều kích thích gây khó chịu.¦Üç hafta sonra: Müşteriler daha da hızlı çıkıyor. Çok fazla uyaran rahatsız eder.¦بعد ثلاثة أسابيع: يغادر الزبائن أسرع. كثرة المؤثرات تُزعج.¦Tres semanas después: los clientes se van aún más rápido. Demasiados estímulos resultan desagradables.¦Três semanas depois: os clientes saem ainda mais depressa. Estímulos a mais são desagradáveis.¦ድሕሪ ሰለስተ ሰሙን: ዓሚላት ዝያዳ ቀልጢፎም ይወጹ። ብዙሕ ምርዓድ የሕርቕ።¦Через три недели: клиенты уходят ещё быстрее. Слишком много раздражителей — это неприятно.")},
    {a:T("😴 Wir ändern nichts. Die Kunden gewöhnen sich schon.¦😴 Không đổi gì cả. Khách sẽ quen thôi.¦😴 Hiçbir şey değiştirmiyoruz. Müşteriler alışır.¦😴 لا نغيّر شيئاً. سيعتاد الزبائن.¦😴 No cambiamos nada. Los clientes se acostumbrarán.¦😴 Não mudamos nada. Os clientes habituam-se.¦😴 ዋላ ሓንቲ ኣይንቅይርን። ዓሚላት ይለማመዱ።¦😴 Ничего не меняем. Клиенты привыкнут."),
     fb:T("Drei Monate später: Der Umsatz sinkt weiter. Die Kunden kaufen bei der Konkurrenz.¦Ba tháng sau: Doanh thu tiếp tục giảm. Khách mua ở đối thủ.¦Üç ay sonra: Ciro düşmeye devam ediyor. Müşteriler rakipten alışveriş yapıyor.¦بعد ثلاثة أشهر: تستمر المبيعات في الانخفاض. يشتري الزبائن من المنافسين.¦Tres meses después: las ventas siguen bajando. Los clientes compran a la competencia.¦Três meses depois: as vendas continuam a descer. Os clientes compram à concorrência.¦ድሕሪ ሰለስተ ወርሒ: ሽያጥ ይቐጽል ይነቅፍ። ዓሚላት ካብ ተወዳደርቲ ይዕድጉ።¦Через три месяца: продажи продолжают падать. Клиенты покупают у конкурентов.")},
    {a:T("🔍 Wir überlegen erst: Welche Ware? Welche Zielgruppe? Dann stimmen wir Licht, Farbe, Musik, Duft und Material darauf ab – und prüfen es regelmäßig.¦🔍 Trước tiên cân nhắc: Hàng gì? Khách nào? Sau đó phối hợp ánh sáng, màu sắc, nhạc, mùi và chất liệu cho phù hợp – và kiểm tra thường xuyên.¦🔍 Önce düşünelim: Hangi mal? Hangi hedef kitle? Sonra ışığı, rengi, müziği, kokuyu ve malzemeyi buna göre ayarlarız – ve düzenli kontrol ederiz.¦🔍 نفكّر أولاً: أي بضاعة؟ أي فئة مستهدفة؟ ثم ننسّق الإضاءة واللون والموسيقى والرائحة والمواد معها – ونراجع ذلك بانتظام.¦🔍 Primero pensamos: ¿qué producto? ¿qué público? Luego ajustamos luz, color, música, olor y materiales a eso, y lo revisamos con regularidad.¦🔍 Primeiro pensamos: que produto? que público? Depois ajustamos luz, cor, música, cheiro e materiais a isso, e verificamos regularmente.¦🔍 ቅድም ንሓስብ: ኣየናይ ሸቐጥ? ኣየናይ ዓሚል? ድሕሪኡ ብርሃን፣ ሕብሪ፣ ሙዚቃ፣ ጨናን ቁሳቁስን ንሰማምዖም – ብስሩዕ ድማ ንፈትሽ።¦🔍 Сначала думаем: какой товар? какая целевая группа? Затем согласуем свет, цвет, музыку, запах и материалы — и регулярно проверяем."),ok:1}],
 good:T("Herr Brandt lächelt: „Genau! Gestaltung braucht einen Plan – passend zu Ware und Zielgruppe.“ Fall gelöst!¦Ông Brandt mỉm cười: „Chính xác! Trang trí cần có kế hoạch – phù hợp với hàng và khách.“ Vụ án đã được giải!¦Bay Brandt gülümsüyor: „Aynen! Tasarım bir plan gerektirir – mala ve hedef kitleye uygun.“ Dava çözüldü!¦يبتسم السيد برانت: «بالضبط! التصميم يحتاج إلى خطة – تناسب البضاعة والفئة المستهدفة.» حُلّت القضية!¦El señor Brandt sonríe: «¡Exacto! El diseño necesita un plan, adecuado al producto y al público.» ¡Caso resuelto!¦O Sr. Brandt sorri: «Exato! A decoração precisa de um plano, adequado ao produto e ao público.» Caso resolvido!¦ኣቶ ብራንት ይስሕቕ: „ልክዕ! ምድላው ፕላን የድልዮ – ምስ ሸቐጥን ዓሚልን ዝሰማማዕ።“ ጉዳይ ተፈቲሑ!¦Господин Брандт улыбается: «Верно! Оформлению нужен план, подходящий товару и целевой группе». Дело раскрыто!"),
 lk:T("Im Klimahaus Bremerhaven reist man einmal um die Welt und spürt unterschiedliche Temperaturen. Das ist ein Erlebnis mit mehreren Sinnen.¦Ở Klimahaus Bremerhaven, bạn đi vòng quanh thế giới và cảm nhận nhiều nhiệt độ khác nhau. Đó là trải nghiệm bằng nhiều giác quan.¦Bremerhaven'daki Klimahaus'ta dünya turu yapar ve farklı sıcaklıkları hissedersin. Bu, birden çok duyuyla yaşanan bir deneyimdir.¦في كليمّاهاوس بريمرهافن تسافر حول العالم وتشعر بدرجات حرارة مختلفة. إنها تجربة بحواس متعددة.¦En el Klimahaus de Bremerhaven se viaja alrededor del mundo y se sienten distintas temperaturas. Es una experiencia con varios sentidos.¦No Klimahaus de Bremerhaven viaja-se à volta do mundo e sentem-se temperaturas diferentes. É uma experiência com vários sentidos.¦ኣብ ክሊማሃውስ ብሬመርሃቨን ኣብ ዙርያ ዓለም ትጐዓዝን ዝተፈላለየ ዑቕበት ትስምዕን። እዚ ብብዙሕ ስምዒታት ዝርአ ተመክሮ እዩ።¦В Климахаусе в Бремерхафене путешествуешь вокруг света и чувствуешь разные температуры. Это впечатление для нескольких чувств."),
},
{t:"profi",ch:5,
 q:T("⭐ Profi (Bonus): Ein Händler setzt Duftmarketing ein, damit Kunden länger bleiben. Ist das eine unzulässige Beeinflussung? Wähle die beste Begründung.¦⭐ Bài nâng cao (điểm thưởng): Một nhà bán lẻ dùng marketing bằng mùi hương để khách ở lâu hơn. Đó có phải là tác động không được phép không? Chọn lập luận tốt nhất.¦⭐ Profi (bonus): Bir satıcı, müşteriler daha uzun kalsın diye koku pazarlaması yapıyor. Bu izin verilmeyen bir etkileme mi? En iyi gerekçeyi seç.¦⭐ مهمة للمحترفين (مكافأة): يستخدم تاجر التسويق بالرائحة حتى يبقى الزبائن أطول. هل هذا تأثير غير مسموح؟ اختر أفضل تبرير.¦⭐ Pro (bonus): Un comercio usa marketing olfativo para que los clientes se queden más tiempo. ¿Es una influencia inadmisible? Elige la mejor justificación.¦⭐ Pro (bónus): Um comerciante usa marketing olfativo para os clientes ficarem mais tempo. É uma influência inadmissível? Escolhe a melhor justificação.¦⭐ ሞያተኛ (ቦነስ): ሓደ ነጋዳይ ዓሚላት ንነዊሕ ክጸንሑ ብጨና ሸይጡ። እዚ ዘይፍቀድ ጽልዋ ድዩ? ዝበለጸ ምኽንያት ምረጽ።¦⭐ Профи (бонус): Продавец использует ароматмаркетинг, чтобы клиенты дольше оставались. Это недопустимое влияние? Выбери лучшее обоснование."),
 o:[{a:T("Ja – jede Gestaltung des Ladens ist verboten.¦Có – mọi cách trang trí cửa hàng đều bị cấm.¦Evet – mağaza düzenlemesinin her türlüsü yasaktır.¦نعم – كل تصميم للمحل ممنوع.¦Sí: cualquier diseño de la tienda está prohibido.¦Sim – qualquer decoração da loja é proibida.¦እወ – ኩሉ ምድላው ድኳን ክልኩል እዩ።¦Да — любое оформление магазина запрещено.")},
    {a:T("Meist zulässig: Der Kunde entscheidet frei, wie bei Licht oder Musik. Kritisch wird es, wenn getäuscht wird (z. B. Backduft ohne frische Backwaren).¦Thường được phép: khách vẫn quyết định tự do, như với ánh sáng hay nhạc. Có vấn đề khi lừa dối (ví dụ mùi bánh mà không có bánh tươi).¦Çoğunlukla izinli: Müşteri, ışık veya müzikte olduğu gibi özgürce karar verir. Aldatma varsa sorun olur (örn. taze ürün yokken fırın kokusu).¦غالباً مسموح: الزبون يقرّر بحرّية كما في الإضاءة والموسيقى. تصبح المشكلة عند الخداع (مثلاً رائحة مخبوزات دون مخبوزات طازجة).¦Normalmente admisible: el cliente decide libremente, como con la luz o la música. Es problemático si se engaña (p. ej., olor a pan sin pan recién hecho).¦Geralmente admissível: o cliente decide livremente, como com a luz ou a música. É problemático se houver engano (p. ex., cheiro a pão sem pão fresco).¦ብዙሕ ግዜ ፍቁድ: ዓሚል ከም ብርሃንን ሙዚቃን ብሓርነት ይውስን። ምስ ተታለለ ግን ጸገም እዩ (ንኣብነት ጨና ባኒ ከይሓደሽቲ ባኒ)።¦Чаще всего допустимо: клиент решает свободно, как и при свете или музыке. Проблема — если вводят в заблуждение (например, запах выпечки без свежей выпечки)."),ok:1},
    {a:T("Nein – Duft hat nie eine Wirkung.¦Không – mùi hương không bao giờ có tác dụng.¦Hayır – koku hiçbir zaman etki yapmaz.¦لا – الرائحة ليس لها أي تأثير أبداً.¦No: el olor nunca tiene ningún efecto.¦Não – o cheiro nunca tem efeito.¦ኣይፋልን – ጨና ፈጺሙ ጽልዋ የብሉን።¦Нет — запах никогда не оказывает действия.")}],
 good:T("Stark begründet! Händler dürfen Atmosphäre schaffen – nur täuschen dürfen sie nicht.¦Lập luận rất tốt! Nhà bán lẻ được tạo bầu không khí – nhưng không được lừa dối.¦Çok iyi gerekçe! Satıcılar atmosfer yaratabilir – ama aldatamaz.¦تبرير قوي! للتاجر أن يصنع أجواء – لكن لا يحق له الخداع.¦¡Bien argumentado! Los comerciantes pueden crear ambiente, pero no engañar.¦Bem fundamentado! Os comerciantes podem criar ambiente, mas não enganar.¦ጽቡቕ ምኽንያት! ነጋዶ ኣየር ክፈጥሩ ይኽእሉ – ግን ክሕቶ ኣይፍቀድን።¦Хорошо обосновано! Продавцы могут создавать атмосферу, но не вводить в заблуждение."),
},
{t:"profi",ch:5,
 q:T("⭐ Profi (Bonus): Manche Supermärkte haben eine „stille Stunde“ (gedimmtes Licht, keine Musik). Für wen ist das – und widerspricht es dem Visual Merchandising?¦⭐ Bài nâng cao (điểm thưởng): Một số siêu thị có „giờ yên tĩnh“ (đèn dịu, không nhạc). Dành cho ai – và có mâu thuẫn với Visual Merchandising không?¦⭐ Profi (bonus): Bazı marketlerde „sessiz saat“ var (kısık ışık, müzik yok). Kimin için – ve Visual Merchandising'e aykırı mı?¦⭐ مهمة للمحترفين (مكافأة): بعض المتاجر الكبرى لديها «ساعة هادئة» (إضاءة خافتة وبلا موسيقى). لمن هي – وهل تتعارض مع Visual Merchandising؟¦⭐ Pro (bonus): Algunos supermercados tienen una «hora tranquila» (luz tenue, sin música). ¿Para quién es y contradice el Visual Merchandising?¦⭐ Pro (bónus): Alguns supermercados têm uma «hora tranquila» (luz suave, sem música). Para quem é e contradiz o Visual Merchandising?¦⭐ ሞያተኛ (ቦነስ): ገሊኦም ሱፐርማርኬታት „ህዱእ ሰዓት“ ኣለዎም (ድኹም ብርሃን፣ ሙዚቃ የብሉን)። ንመን እዩ – ምስ Visual Merchandising ይጋጮ ድዩ?¦⭐ Профи (бонус): В некоторых супермаркетах есть «тихий час» (приглушённый свет, без музыки). Для кого это и противоречит ли это Visual Merchandising?"),
 o:[{a:T("Für Kunden, die schnell von Reizen überfordert sind. Kein Widerspruch: Die Atmosphäre passt zu dieser Zielgruppe.¦Dành cho khách dễ bị quá tải bởi kích thích. Không mâu thuẫn: bầu không khí phù hợp với nhóm khách này.¦Uyaranlardan çabuk bunalan müşteriler için. Çelişki yok: Atmosfer bu hedef kitleye uygun.¦للزبائن الذين تُرهقهم المؤثرات بسرعة. لا تعارض: الأجواء تناسب هذه الفئة.¦Para clientes a quienes los estímulos abruman enseguida. No hay contradicción: el ambiente encaja con ese público.¦Para clientes que ficam depressa sobrecarregados com estímulos. Não há contradição: o ambiente combina com esse público.¦ንዓሚላት ብቐሊሉ ብምርዓድ ዝተጸቐጡ። ምጉዳል የለን: እቲ ኣየር ምስዚ ዓሚል ይሰማማዕ።¦Для клиентов, которых быстро перегружают раздражители. Противоречия нет: атмосфера подходит этой группе."),ok:1},
    {a:T("Nur für Kunden, die nichts kaufen wollen. Es ist ein Widerspruch.¦Chỉ dành cho khách không muốn mua gì. Có mâu thuẫn.¦Sadece bir şey almak istemeyen müşteriler için. Çelişkidir.¦فقط للزبائن الذين لا يريدون الشراء. هذا تعارض.¦Solo para clientes que no quieren comprar. Es una contradicción.¦Só para clientes que não querem comprar. É uma contradição.¦ንዘይደልዩ ዓሚላት ጥራይ። ምጉዳል እዩ።¦Только для тех, кто ничего не хочет покупать. Это противоречие.")},
    {a:T("Für Mitarbeiter, die Pause machen.¦Dành cho nhân viên nghỉ giải lao.¦Mola veren çalışanlar için.¦للموظفين الذين يأخذون استراحة.¦Para empleados que hacen su descanso.¦Para funcionários em pausa.¦ንሰራሕተኛታት ዕረፍቲ ዝወስዱ።¦Для сотрудников на перерыве.")}],
 good:T("Stark! Visual Merchandising heißt: Atmosphäre für die Zielgruppe – auch eine ruhige.¦Giỏi lắm! Visual Merchandising nghĩa là: tạo bầu không khí cho nhóm khách – kể cả bầu không khí yên tĩnh.¦Harika! Visual Merchandising şu demek: Hedef kitle için atmosfer – sakin olan da.¦ممتاز! Visual Merchandising يعني: أجواء للفئة المستهدفة – حتى الهادئة منها.¦¡Muy bien! Visual Merchandising significa crear ambiente para el público, también uno tranquilo.¦Muito bem! Visual Merchandising significa criar ambiente para o público, também um calmo.¦ድንቂ! Visual Merchandising ማለት: ንዓሚል ኣየር ምፍጣር – ህዱእውን።¦Отлично! Visual Merchandising — это атмосфера для целевой группы, в том числе спокойная."),
},
/* ===== Kapitel 7: Finale ===== */
{t:"story",ch:6,img:"s5",
 p:[T("Fall gelöst! Frau Petersen gratuliert. Jetzt kommt der Abschluss-Check: 6 Fragen wie in der Prüfung.¦Vụ án đã được giải! Cô Petersen chúc mừng. Bây giờ là bài kiểm tra cuối: 6 câu hỏi giống như trong kỳ thi.¦Dava çözüldü! Bayan Petersen tebrik ediyor. Şimdi bitiş testi geliyor: sınavdaki gibi 6 soru.¦حُلّت القضية! تهنّئك السيدة بيترسن. الآن الاختبار الختامي: 6 أسئلة كما في الامتحان.¦¡Caso resuelto! La señora Petersen te felicita. Ahora viene la prueba final: 6 preguntas como en el examen.¦Caso resolvido! A Sra. Petersen dá-te os parabéns. Agora vem o teste final: 6 perguntas como no exame.¦ጉዳይ ተፈቲሑ! ሓፍቲ ፔተርሰን የመስግንካ። ሕጂ ናይ መወዳእታ ፈተነ ይመጽእ: 6 ሕቶታት ከም ኣብ ፈተና።¦Дело раскрыто! Фрау Петерсен поздравляет. Теперь итоговая проверка: 6 вопросов, как на экзамене.")],
 say:[P,T("„Du hast alle vier Spuren gesichert. Zeig jetzt, was du kannst!“¦„Bạn đã tìm đủ bốn manh mối. Bây giờ hãy cho thấy bạn giỏi thế nào!“¦„Dört izi de topladın. Şimdi neler yapabildiğini göster!“¦«لقد جمعت الأدلة الأربعة. أرِني الآن ما تستطيع!»¦„Has asegurado las cuatro pistas. ¡Ahora demuestra lo que sabes!“¦„Garantiste as quatro pistas. Agora mostra o que sabes!“¦„ኣርባዕተ ምልክታት ሓሊኻ። ሕጂ እንታይ ከም ትኽእል ኣርኢ!“¦«Ты нашёл все четыре улики. Теперь покажи, на что способен!»")]},
{t:"mc",ch:6,n:1,
 q:T("Ein Spot strahlt eine neue Uhr im Schaufenster an. Welche Beleuchtung ist das?¦Một đèn rọi chiếu vào chiếc đồng hồ mới ở cửa kính. Đây là loại chiếu sáng nào?¦Bir spot, vitrindeki yeni saati aydınlatıyor. Bu hangi aydınlatma?¦كشّاف يضيء ساعة جديدة في الواجهة. أي إضاءة هذه؟¦Un foco ilumina un reloj nuevo en el escaparate. ¿Qué iluminación es?¦Um foco ilumina um relógio novo na montra. Que iluminação é?¦ሓደ ስፖት ሓድሽ ሰዓት ኣብ ዕስለት የብርህ። እዚ ኣየናይ ብርሃን እዩ?¦Прожектор освещает новые часы на витрине. Какое это освещение?"),
 o:[{a:T("Grundbeleuchtung¦Chiếu sáng chung¦Genel aydınlatma¦الإضاءة الأساسية¦Iluminación general¦Iluminação geral¦ሓፈሻዊ ብርሃን¦Общее освещение")},{a:T("Akzentbeleuchtung¦Chiếu sáng nhấn¦Vurgu aydınlatması¦الإضاءة المُبرِزة¦Iluminación de acento¦Iluminação de destaque¦ብርሃን ምድማቕ¦Акцентное освещение"),ok:1},{a:T("Warenwandbeleuchtung¦Chiếu sáng tường hàng¦Raf duvarı aydınlatması¦إضاءة جدار البضائع¦Iluminación de pared¦Iluminação de parede¦ብርሃን መንደቅ ሸቐጥ¦Подсветка стены")}]},
{t:"mc",ch:6,n:2,
 q:T("Welche Wirkung haben warme Farben wie Rot und Gelb?¦Màu ấm như đỏ và vàng có tác dụng gì?¦Kırmızı ve sarı gibi sıcak renklerin etkisi nedir?¦ما تأثير الألوان الدافئة مثل الأحمر والأصفر؟¦¿Qué efecto tienen los colores cálidos como el rojo y el amarillo?¦Que efeito têm as cores quentes como o vermelho e o amarelo?¦ዑቕባ ሕብርታት ከም ቀይሕን ብጫን እንታይ ጽልዋ ኣለዎም?¦Какое действие оказывают тёплые цвета, например красный и жёлтый?"),
 o:[{a:T("Sie machen müde und ruhig.¦Làm mệt và yên tĩnh.¦Yorar ve sakinleştirir.¦تُتعب وتُهدّئ.¦Cansan y calman.¦Cansam e acalmam.¦ይሃሱን የህድኡን።¦Утомляют и успокаивают.")},{a:T("Sie aktivieren und fallen auf.¦Kích thích và nổi bật.¦Harekete geçirir ve dikkat çeker.¦تنشّط وتلفت النظر.¦Activan y llaman la atención.¦Ativam e chamam a atenção.¦የተባብዑን ትኹረት የስሕቡን።¦Активируют и привлекают внимание."),ok:1},{a:T("Sie wirken immer billig.¦Luôn trông rẻ tiền.¦Her zaman ucuz görünür.¦تبدو دائماً رخيصة.¦Siempre parecen baratos.¦Parecem sempre baratos.¦ኩሉ ግዜ ርካሽ ይመስሉ።¦Всегда выглядят дёшево.")}]},
{t:"mc",ch:6,n:3,
 q:T("Warum läuft in einem Möbelhaus oft ruhige Musik?¦Tại sao cửa hàng nội thất thường phát nhạc êm dịu?¦Mobilya mağazasında neden çoğunlukla sakin müzik çalar?¦لماذا تُشغَّل غالباً موسيقى هادئة في متجر الأثاث؟¦¿Por qué suele sonar música tranquila en una tienda de muebles?¦Porque é que numa loja de móveis costuma tocar música calma?¦ስለምንታይ ኣብ ድኳን መንበር ብዙሕ ግዜ ህዱእ ሙዚቃ ይጻወት?¦Почему в мебельном магазине часто играет спокойная музыка?"),
 o:[{a:T("Damit die Kunden schneller gehen.¦Để khách đi nhanh hơn.¦Müşteriler daha hızlı gitsin diye.¦ليغادر الزبائن أسرع.¦Para que los clientes se vayan antes.¦Para os clientes saírem mais depressa.¦ዓሚላት ቀልጢፎም ክኸዱ።¦Чтобы клиенты быстрее уходили.")},{a:T("Damit die Kunden länger bleiben und in Ruhe aussuchen.¦Để khách ở lâu hơn và chọn thong thả.¦Müşteriler daha uzun kalsın ve rahatça seçsin diye.¦ليبقى الزبائن أطول ويختاروا بهدوء.¦Para que los clientes se queden más tiempo y elijan con calma.¦Para os clientes ficarem mais tempo e escolherem com calma.¦ዓሚላት ንነዊሕ ክጸንሑን ብህድኣት ክመርጹን።¦Чтобы клиенты дольше оставались и выбирали спокойно."),ok:1},{a:T("Weil Möbel Geräusche machen.¦Vì đồ nội thất phát ra tiếng ồn.¦Mobilyalar ses çıkardığı için.¦لأن الأثاث يُصدر ضجيجاً.¦Porque los muebles hacen ruido.¦Porque os móveis fazem barulho.¦ኣቑሑት ድምጺ ስለ ዝገብሩ።¦Потому что мебель шумит.")}]},
{t:"mc",ch:6,n:4,
 q:T("Welcher Duft passt zu einer Bäckerei?¦Mùi nào phù hợp với tiệm bánh?¦Fırına hangi koku uyar?¦أي رائحة تناسب المخبز؟¦¿Qué olor encaja con una panadería?¦Que cheiro combina com uma padaria?¦ኣየናይ ጨና ምስ ባኒ ቤት ይሰማማዕ?¦Какой запах подходит пекарне?"),
 o:[{a:T("Frisch gebackenes Brot¦Bánh mì mới nướng¦Taze pişmiş ekmek¦خبز طازج الخَبز¦Pan recién horneado¦Pão acabado de fazer¦ሓድሽ ዝተጋገረ ባኒ¦Свежеиспечённый хлеб"),ok:1},{a:T("Lavendel¦Oải hương¦Lavanta¦الخزامى¦Lavanda¦Lavanda¦ላቬንደር¦Лаванда")},{a:T("Putzmittel¦Chất tẩy rửa¦Temizlik maddesi¦منظّف¦Producto de limpieza¦Produto de limpeza¦ሳሙና ጽሬት¦Моющее средство")}]},
{t:"mc",ch:6,n:5,
 q:T("Welche Wirkung hat eine Ruhezone (z. B. ein Café im Kaufhaus)?¦Khu nghỉ ngơi (ví dụ quán cà phê trong cửa hàng) có tác dụng gì?¦Dinlenme alanının (örn. mağazadaki kafe) etkisi nedir?¦ما تأثير منطقة الراحة (مثل مقهى في المتجر)؟¦¿Qué efecto tiene una zona de descanso (p. ej., una cafetería en los grandes almacenes)?¦Que efeito tem uma zona de descanso (p. ex., um café nos armazéns)?¦ቦታ ዕረፍቲ (ንኣብነት ካፌ ኣብ ዓቢ ድኳን) እንታይ ጽልዋ ኣለዎ?¦Какой эффект даёт зона отдыха (например, кафе в универмаге)?"),
 o:[{a:T("Kunden erholen sich und bleiben länger.¦Khách nghỉ ngơi và ở lại lâu hơn.¦Müşteriler dinlenir ve daha uzun kalır.¦يستريح الزبائن ويبقون أطول.¦Los clientes descansan y se quedan más tiempo.¦Os clientes descansam e ficam mais tempo.¦ዓሚላት ይዕረፉ ንነዊሕውን ይጸንሑ።¦Клиенты отдыхают и остаются дольше."),ok:1},{a:T("Kunden verlassen den Laden schneller.¦Khách rời cửa hàng nhanh hơn.¦Müşteriler mağazadan daha hızlı ayrılır.¦يغادر الزبائن المتجر أسرع.¦Los clientes salen antes de la tienda.¦Os clientes saem mais depressa da loja.¦ዓሚላት ቀልጢፎም ካብ ድኳን ይወጹ።¦Клиенты быстрее покидают магазин.")},{a:T("Die Ware wird automatisch billiger.¦Hàng hóa tự động rẻ hơn.¦Mal otomatik olarak ucuzlar.¦تصبح البضاعة أرخص تلقائياً.¦Los productos se abaratan automáticamente.¦Os produtos ficam automaticamente mais baratos.¦ሸቐጥ ባዕሉ ርካሽ ይኸውን።¦Товар автоматически дешевеет.")}]},
{t:"mc",ch:6,n:6,
 q:T("Prüfungsstil: Die Multimedia-Abteilung soll verkaufsfördernd gestaltet werden. Welches Beispiel spricht den Sinn „Fühlen“ an?¦Dạng bài thi: Gian hàng đa phương tiện cần được thiết kế để thúc đẩy bán hàng. Ví dụ nào tác động đến giác quan „Chạm“?¦Sınav tarzı: Multimedya reyonu satışı artıracak şekilde düzenlenecek. Hangi örnek „Dokunma“ duyusuna hitap eder?¦على نمط الامتحان: يجب تصميم قسم الوسائط المتعددة لتنشيط المبيعات. أي مثال يخاطب حاسة «اللمس»؟¦Estilo examen: La sección de multimedia debe diseñarse para fomentar las ventas. ¿Qué ejemplo se dirige al sentido del «tacto»?¦Estilo exame: A secção de multimédia deve ser decorada para promover as vendas. Que exemplo se dirige ao sentido do «tato»?¦ዓይነት ፈተና: ክፍሊ መልቲሚድያ ሽያጥ ዘደንፍዕ ክዳሎ ኣለዎ። ኣየናይ ኣብነት ንስምዒት „ምትንካፍ“ የዘራርብ?¦В стиле экзамена: отдел мультимедиа нужно оформить так, чтобы стимулировать продажи. Какой пример относится к чувству «осязание»?"),
 o:[{a:T("Produktvideos auf Bildschirmen¦Video sản phẩm trên màn hình¦Ekranlarda ürün videoları¦فيديوهات المنتجات على الشاشات¦Vídeos de productos en pantallas¦Vídeos de produtos em ecrãs¦ቪድዮታት ሸቐጥ ኣብ ስክሪን¦Видео о товарах на экранах")},{a:T("Vorführung einer Soundbar¦Trình diễn loa thanh¦Soundbar gösterimi¦عرض مكبّر صوت ساوندبار¦Demostración de una barra de sonido¦Demonstração de uma barra de som¦ምርኣይ ሳውንድባር¦Демонстрация саундбара")},{a:T("Tablets zum Ausprobieren¦Máy tính bảng để dùng thử¦Denemek için tabletler¦أجهزة لوحية للتجربة¦Tabletas para probar¦Tablets para experimentar¦ታብሌታት ንምፍታን¦Планшеты для пробы"),ok:1}]},
{t:"end",ch:6}
];
const MAX=2+7+3+3+6+1+6; // 28 Punkte (+2 Profi-Bonus)

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const RTL=l=>l==='ar';
function nm(s){return s.replace('{NAME}',NAME?', '+NAME:'');}
function X(a){
 if(!a) return '';
 let h=`<span class="de">${nm(a[0])}</span>`;
 if(L!=='de'&&a[LI[L]]) h+=`<span class="tl" dir="${RTL(L)?'rtl':'ltr'}" lang="${L}">${nm(a[LI[L]])}</span>`;
 return h;
}
function say(c,a){return `<div class="say"><div class="av">${c.av}</div><div class="bub"><div class="who">${c.who}</div>${X(a)}</div></div>`;}
function merke(a){return a?`<div class="merke"><b>💡 ${U.merke[0]}${L!=='de'?' · '+U.merke[LI[L]]:''}:</b> ${X(a)}</div>`:'';}
function lk(a){return (a&&L!=='de')?`<div class="lk"><div class="h">🇩🇪 ${X(U.lk)}</div>${X(a)}</div>`:'';}
function addPts(n){score+=n;$('#pts').textContent='⭐ '+(score+bonus);}
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e);}e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200);}
function confetti(){const e=['🎉','⭐','🔍','💡','✨'];for(let i=0;i<22;i++){const d=document.createElement('div');d.className='conf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}}
function setNext(enabled,label){const b=$('#next');b.disabled=!enabled;b.innerHTML=X(label||U.next);}
function prog(){const ch=S[step].ch;let h='';for(let i=0;i<7;i++)h+=`<i class="${ch===undefined?'':(i<ch?'done':(i===ch?'on':''))}"></i>`;
 const n=ch===undefined?0:ch; // Spuren: ab Kapitel 2 kommt je Kapitel eine Spur dazu
 $('#prog').innerHTML=h;
 $('#clues').innerHTML=`<b>${U.clues[0]}:</b> `+CLUE.slice(1).map((x,i)=>`<span class="${n>i+1||(S[step].t==='end')?'on':''}">${x}</span>`).join('');}
function head(s){return `${s.img?`<img class="hero" src="${IMG[s.img]}" alt="">`:''}<div class="body"><div class="chap">${U.chap[0]} ${s.ch+1}${L!=='de'?' · '+U.chap[LI[L]]+' '+(s.ch+1):''}</div><h2>${X(CH[s.ch])}</h2>`;}

/* ---------- Renderer ---------- */
function render(){
 const s=S[step]; prog(); window.scrollTo({top:0,behavior:'smooth'});
 const m=$('#main'); done=false;
 if(s.t==='start') return rStart(m);
 if(s.t==='story'){m.innerHTML=`<div class="card">${head(s)}${(s.p||[]).map(a=>`<p>${X(a)}</p>`).join('')}${s.say?say(s.say[0],s.say[1]):''}${merke(s.merke)}${lk(s.lk)}</div></div>`;setNext(true);return;}
 if(s.t==='mc'||s.t==='profi') return rMC(m,s);
 if(s.t==='multi') return rMulti(m,s);
 if(s.t==='find') return rFind(m,s);
 if(s.t==='sort') return rSort(m,s);
 if(s.t==='branch') return rBranch(m,s);
 if(s.t==='end') return rEnd(m);
}
function rStart(m){
 m.innerHTML=`<div class="card"><img class="hero" src="${IMG.s1}" alt=""><div class="body">
 <div class="chap">LF 4 · Modul 2 · Mit allen Sinnen</div>
 <h1>🔍 Das Rätsel von Seestern</h1>
 <p>Eine interaktive Mystery-Geschichte: Du bist Azubi in Bremerhaven und löst einen Fall. Warum verlassen die Kunden die Abteilung? Finde vier Spuren – mit Licht, Farbe, Musik, Duft und allen fünf Sinnen.</p>
 <div class="q">${X(U.lang)}</div><div class="langs">${LANGS.map(([k,l])=>`<button class="lang ${k===L?'sel':''}" data-l="${k}">${l}</button>`).join('')}</div>
 <div class="q">${X(U.name)}</div><input class="name" id="nm" maxlength="24" value="${NAME}" placeholder="Vorname">
 <p class="small">7 Kapitel · ca. 25 Minuten · Lehrbuch S. 204–207</p></div></div>`;
 m.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{NAME=$('#nm').value.trim();L=b.dataset.l;document.documentElement.lang=L;render();});
 setNext(true,U.start);
}
function rMC(m,s){
 let first=true;
 const isP=s.t==='profi';
 m.innerHTML=`<div class="card">${head(s)}${s.say?`<div class="say"><div class="av">${s.say.av}</div><div class="bub"><div class="who">${s.say.who}</div>${X(s.q)}</div></div>`:`<div class="q">${s.n?`${U.qOf[0]}${L!=='de'?' · '+U.qOf[LI[L]]:''} ${s.n}/6 · `:''}${X(s.q)}</div>`}
 <div class="opts ${isP?'profi':''}">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const o=s.o[+b.dataset.i];
  if(o.ok){b.classList.add('ok');m.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   if(first){isP?bonus++:addPts(1);if(isP)addPts(0);}
   $('#fb').innerHTML=`<div class="fb good">✅ <b>${X(U.right)}</b>${s.good?X(s.good):''}</div>${merke(s.merke)}`;confetti();setNext(true);}
  else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(o.fb||U.wrong)}</div>`;}
 });
 setNext(isP,isP?U.skip:U.next);
}
function rMulti(m,s){
 let first=true,sel=new Set();
 m.innerHTML=`<div class="card">${head(s)}${say(s.say,s.q)}<p class="small">${X(U.pick2)}</p>
 <div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div>
 <p style="text-align:center"><button class="btn sec" id="chk">${X(U.check)}</button></p><div id="fb"></div></div></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;b.classList.remove('no');if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}else if(sel.size<2){sel.add(i);b.classList.add('sel')}});
 $('#chk').onclick=()=>{
  if(sel.size<2)return;
  const ok=[...sel].every(i=>s.o[i].ok);
  if(ok){m.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(s.o[i].ok)b.classList.add('ok')});$('#chk').disabled=true;if(first)addPts(1);$('#fb').innerHTML=`<div class="fb good">✅ <b>${X(U.right)}</b>${X(s.good)}</div>${merke(s.merke)}`;confetti();setNext(true);}
  else{first=false;[...sel].forEach(i=>{if(!s.o[i].ok){const b=m.querySelector(`.opt[data-i="${i}"]`);b.classList.remove('sel');b.classList.add('no');sel.delete(i);}});$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
 };
 setNext(false);
}
function rFind(m,s){
 let first=true,sel=new Set();
 m.innerHTML=`<div class="card">${head(s)}<div class="q">${s.n?`${U.qOf[0]}${L!=='de'?' · '+U.qOf[LI[L]]:''} · `:''}${X(s.q)}</div><p class="small">${X(U.findq)}</p>
 <div class="opts">${s.it.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div>
 <p style="text-align:center"><button class="btn sec" id="chk">${X(U.check)}</button></p><div id="fb"></div></div></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;b.classList.remove('no');if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}else{sel.add(i);b.classList.add('sel')}});
 $('#chk').onclick=()=>{
  const want=s.it.map((o,i)=>o.bad?i:-1).filter(i=>i>=0);
  const ok=sel.size===want.length&&want.every(i=>sel.has(i));
  if(ok){m.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');if(s.it[i].bad)b.classList.add('ok')});$('#chk').disabled=true;if(first)addPts(2);
   $('#fb').innerHTML=`<div class="fb good">✅ <b>${X(U.right)}</b></div>${s.it.filter(o=>o.bad).map(o=>`<div class="fb bad" style="margin-top:.5rem"><b>🔧 ${X(U.fix)}</b>${X(o.f)}</div>`).join('')}${merke(s.merke)}`;confetti();setNext(true);}
  else{first=false;[...sel].forEach(i=>{if(!s.it[i].bad){const b=m.querySelector(`.opt[data-i="${i}"]`);b.classList.remove('sel');b.classList.add('no');sel.delete(i);}});$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
 };
 setNext(false);
}
function rSort(m,s){
 let i=0,first=true,placed=[];
 function draw(){
  let body;
  if(i<s.it.length) body=`<div class="small">${i+1} / ${s.it.length}</div><div class="shop">${X(s.it[i].a)}</div>
   <div class="cats">${s.cats.map((c,k)=>`<button class="opt" data-k="${k}">${X(c)}</button>`).join('')}</div><div id="fb"></div>`;
  else body=`<div class="fb good">✅ <b>${X(U.right)}</b></div>${merke(s.merke)}`;
  m.innerHTML=`<div class="card">${head(s)}${body}${placed.length?`<div style="margin-top:.8rem">${placed.map(p=>`<span class="tag">${p}</span>`).join(' ')}</div>`:''}</div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k;
   if(k===s.it[i].c){if(first)addPts(1);first=true;b.classList.add('ok');placed.push(s.it[i].a[0].split(' ')[0]+' → '+s.cats[k][0].split(' – ')[0]);i++;setTimeout(()=>{draw();if(i===s.it.length){confetti();setNext(true);}},450);}
   else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
  });
 }
 draw(); setNext(false);
}
function rBranch(m,s){
 let first=true;
 function menu(){
  m.innerHTML=`<div class="card">${head(s)}${s.p.map(a=>`<p>${X(a)}</p>`).join('')}${say(s.say[0],s.say[1])}
  <div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div></div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const o=s.o[+b.dataset.i];
   if(o.ok){if(first)addPts(1);m.querySelector('.body').insertAdjacentHTML('beforeend',`<div class="fb good">✅ ${X(s.good)}</div>${lk(s.lk)}`);m.querySelectorAll('.opt').forEach(x=>{x.disabled=true});b.classList.add('ok');confetti();setNext(true);}
   else{first=false;m.innerHTML=`<div class="card">${head(s)}<div class="fb bad" style="font-size:1.05rem">⏩ ${X(o.fb)}</div><p style="text-align:center;margin-top:1rem"><button class="btn sec" id="bk">↩ ${X(U.back)}</button></p></div></div>`;$('#bk').onclick=menu;}
  });
  setNext(false);
 }
 menu();
}
function rEnd(m){
 const pct=score/MAX, st=pct>=.9?'⭐⭐⭐':pct>=.7?'⭐⭐':pct>=.5?'⭐':'';
 const d=new Date().toLocaleDateString('de-DE');
 m.innerHTML=`<div class="card"><img class="hero" src="${IMG.s1}" alt=""><div class="body"><div class="cert">
 <div class="badge">🏅</div><h1>${X(U.solved)}</h1>
 <p style="font-size:1.3rem;font-weight:800">${NAME||''}</p>
 <div class="stars">${st}</div>
 <div class="score">${score} / ${MAX}${bonus?` + ${bonus} ⭐ Profi-Bonus`:''}</div><p class="small">${X(U.first)}</p>
 <p class="small">LF 4 · Modul 2 · Mit allen Sinnen · ${d}</p></div>
 <p style="text-align:center">${X(U.show)}</p>
 <p style="text-align:center"><button class="btn sec" id="again">🔄 ${X(U.again)}</button></p></div></div>`;
 $('#again').onclick=()=>{score=0;bonus=0;step=0;$('#pts').textContent='⭐ 0';$('#next').style.display='';render();};
 confetti(); setNext(false); $('#next').style.display='none';
}
$('#next').onclick=()=>{
 if(S[step].t==='start'){const n=$('#nm');NAME=n?n.value.trim():'';}
 if(step<S.length-1){step++;$('#next').style.display='';render();}
};
$('#langBtn').onclick=()=>{L=LK[(LK.indexOf(L)+1)%LK.length];document.documentElement.lang=L;
 const t=S[step].t;
 if(t==='start'||t==='story'||t==='end') render();
 else toast('🌐 '+LNAME[L]+' – '+(L==='de'?'':'ab der nächsten Seite.'));};
render();

</script>
<script src="qr_button.js"></script>
<script src="tafel_zoom.js"></script>
</body>
</html>
