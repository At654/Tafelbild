<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LF 4 · Modul 2 · Das Rätsel von Seestern</title>
<style>
:root{--navy:#1f3b5c;--blue:#2f6db5;--sand:#fbf3e4;--orange:#e8833a;--green:#2e9e6b;--red:#d2493f;--ink:#23262b;--mut:#6b6f76;--card:#fff;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic","Nyala","Kefa",Tahoma,sans-serif;font-size:17px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:.55rem .9rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .ttl{font-weight:700;font-size:.95rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .pts{background:var(--orange);border-radius:99px;padding:.15rem .7rem;font-weight:700;font-size:.9rem}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:.35rem .6rem;font-size:1rem;cursor:pointer}
.prog{display:flex;gap:4px;padding:.5rem .9rem 0;max-width:820px;margin:auto}
.prog i{flex:1;height:7px;border-radius:9px;background:#e2d6c2}
.prog i.on{background:var(--orange)} .prog i.done{background:var(--green)}
main{max-width:820px;margin:0 auto;padding:.8rem .9rem 6rem}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(60,40,10,.09);overflow:hidden;margin-bottom:1rem;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card img.hero{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.card .body{padding:1rem 1.1rem 1.2rem}
.chap{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:800}
h1{font-size:1.6rem;margin:.1rem 0 .6rem;color:var(--navy)} h2{font-size:1.3rem;margin:.1rem 0 .6rem;color:var(--navy)}
p{margin:.45rem 0}
.de{display:block}
.tl{display:block;color:#5a6470;font-size:.88em;border-left:3px solid #c9d7ea;padding-left:.5rem;margin-top:.15rem}
.tl[dir=rtl]{border-left:0;border-right:3px solid #c9d7ea;padding-left:0;padding-right:.5rem;text-align:right;font-size:.95em}
.btn .tl,.opt .tl,.chip .tl{border:0;padding:0;margin-top:.1rem;color:inherit;opacity:.78;font-size:.82em}
.say{display:flex;gap:.6rem;align-items:flex-start;margin:.7rem 0}
.say .av{font-size:1.9rem;line-height:1}
.say .bub{background:#eef4fb;border-radius:4px 16px 16px 16px;padding:.55rem .8rem;flex:1}
.say .who{font-weight:700;font-size:.8rem;color:var(--blue)}
.q{font-weight:700;margin:.9rem 0 .5rem;font-size:1.05rem}
.opts{display:grid;gap:.5rem}
.opt{background:#fff;border:2px solid #d9dfe7;border-radius:14px;padding:.65rem .8rem;text-align:left;font:inherit;cursor:pointer;color:inherit;transition:.15s}
.opt:hover{border-color:var(--blue);background:#f6f9fd}
.opt.ok{border-color:var(--green);background:#e8f6ef}
.opt.no{border-color:var(--red);background:#fdeceb;animation:shake .35s}
.opt.sel{border-color:var(--blue);background:#e9f1fb}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:.7rem;padding:.6rem .8rem;border-radius:12px;font-size:.95rem}
.fb.good{background:#e8f6ef;border:1px solid #a9dcc3} .fb.bad{background:#fdf1e6;border:1px solid #f2c79f}
.merke{background:#fff7e0;border:2px dashed #e9c46a;border-radius:14px;padding:.6rem .8rem;margin:.8rem 0}
.merke b{color:#a26b00}
.lk{background:linear-gradient(135deg,#e7f3ff,#f1ecff);border-radius:14px;padding:.7rem .9rem;margin:.9rem 0;border:1px solid #cfdff5}
.lk .h{font-weight:800;color:#3a4fa0;margin-bottom:.2rem}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,243,228,.96);padding:.6rem .9rem;display:flex;justify-content:center;border-top:1px solid #eadfcb}
.btn{background:var(--orange);color:#fff;border:0;border-radius:14px;padding:.75rem 1.6rem;font:inherit;font-weight:700;cursor:pointer;min-width:220px;box-shadow:0 3px 0 #b86123}
.btn[disabled]{background:#cfc5b5;box-shadow:none;cursor:default}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.8rem 0}
.lang{border:2px solid #d9dfe7;background:#fff;border-radius:14px;padding:.8rem;font:inherit;cursor:pointer;font-weight:700}
.lang.sel{border-color:var(--orange);background:#fff3e8}
input.name{width:100%;font:inherit;padding:.6rem .8rem;border-radius:12px;border:2px solid #d9dfe7;margin-top:.3rem}
/* Pyramide */
.pyr{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;margin:.8rem 0}
.lvl{border-radius:8px;padding:.35rem .5rem;text-align:center;font-size:.85rem;background:#eef1f5;color:#8a93a0;border:2px dashed #ccd3dc;min-height:2.6rem;display:flex;flex-direction:column;justify-content:center;transition:.25s}
.lvl.cur{border-color:var(--orange);background:#fff3e8;color:var(--ink)}
.lvl.fill{border-style:solid;color:#fff;border-color:transparent}
.lvl small{display:block;font-weight:700;font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.chip{background:#fff;border:2px solid #c9d3df;border-radius:12px;padding:.45rem .7rem;font:inherit;font-size:.92rem;cursor:pointer}
.chip.no{border-color:var(--red);animation:shake .35s}
/* Kreuz */
.cross{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:6px;margin:.7rem 0;position:relative}
.cross div{border-radius:12px;padding:.5rem;min-height:5.2rem;font-size:.8rem}
.cross .lab{font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;opacity:.75}
.c1{background:#e3f0ff}.c2{background:#e6f7ec}.c3{background:#fff2df}.c4{background:#f4e8fb}
.tag{display:inline-block;background:#fff;border-radius:8px;padding:.1rem .4rem;margin:.15rem .15rem 0 0;box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:.85rem;animation:pop .4s}
.shop{background:#f8f5ef;border-radius:14px;padding:.7rem .8rem;margin:.6rem 0;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cats{display:grid;grid-template-columns:1fr;gap:.4rem}
.badge{font-size:4rem;text-align:center;margin:.3rem 0}
.score{text-align:center;font-size:1.3rem;font-weight:800;color:var(--navy)}
.stars{text-align:center;font-size:2rem;letter-spacing:.2rem}
.small{font-size:.85rem;color:var(--mut)}
.conf{position:fixed;top:-20px;font-size:1.5rem;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.7}}
.profi{border:2px solid #b38cff;background:#f7f2ff;border-radius:14px;padding:.7rem .8rem;margin-top:1rem}
.cert{border:4px double var(--navy);border-radius:16px;padding:1rem;text-align:center;background:#fffdf7}
@media (max-width:520px){h1{font-size:1.35rem}.langs,.row2{grid-template-columns:1fr}.btn{min-width:0;width:100%}}
@media print{.nav,header{display:none}}
.clues{max-width:820px;margin:.3rem auto 0;padding:0 .9rem;font-size:.85rem;color:#6b6f76}
.clues span{display:inline-block;margin-left:.3rem;font-size:1.15rem;filter:grayscale(1);opacity:.3;transition:.4s}
.clues span.on{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:#1f3b5c;color:#fff;padding:.5rem 1rem;border-radius:12px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.card img.hero{aspect-ratio:16/9;object-fit:cover}
</style>
</head>

<div class="prog" id="prog"></div>
<div class="clues" id="clues"></div>
<main id="main"></main>
<div class="nav"><button class="btn" id="next">Weiter</button></div>

 p:[T("Montag, 8 Uhr. Du bist Azubi im Kaufhaus Seestern in Bremerhaven. Heute wartet ein Rätsel auf dich.¦Thứ Hai, 8 giờ sáng. Bạn là học viên học nghề ở cửa hàng bách hóa Seestern tại Bremerhaven. Hôm nay có một bí ẩn đang chờ bạn.¦Pazartesi, saat 8. Bremerhaven'daki Seestern Mağazası'nda çıraksın. Bugün seni bir bilmece bekliyor.¦يوم الاثنين، الساعة الثامنة. أنت متدرّب في متجر زيشتيرن الكبير في بريمرهافن. اليوم ينتظرك لغز.¦Lunes, 8 de la mañana. Eres aprendiz en los grandes almacenes Seestern de Bremerhaven. Hoy te espera un misterio.¦Segunda-feira, 8 horas. És aprendiz nos armazéns Seestern, em Bremerhaven. Hoje espera-te um mistério.¦ሰኑይ፣ ሰዓት 8 ንጉሆ። ኣብ ብሬመርሃቨን ኣብ ዓቢ ድኳን ሰይስተርን ተመሃራይ ኢኻ። ሎምስ ሓደ ምስጢር ይጽበየካ።¦Понедельник, 8 утра. Ты стажёр в универмаге «Зеештерн» в Бремерхафене. Сегодня тебя ждёт загадка.")],
 say:[P,T("„Willkommen{NAME}! Seit dem Umbau der Abteilung „Freizeit & Outdoor“ kommen weniger Kunden. Sie gehen schnell wieder raus. Wir wissen nicht, warum. Kannst du den Fall lösen?“¦„Chào mừng{NAME}! Từ khi cải tạo gian hàng „Giải trí & Ngoài trời“, khách đến ít hơn. Họ ra về rất nhanh. Chúng tôi không biết tại sao. Bạn có giải được vụ này không?“¦„Hoş geldin{NAME}! „Boş Zaman & Outdoor“ reyonu yenilendiğinden beri daha az müşteri geliyor. Çabuk çıkıp gidiyorlar. Nedenini bilmiyoruz. Bu davayı çözebilir misin?“¦«أهلاً بك{NAME}! منذ تجديد قسم «الترفيه والهواء الطلق» قلّ عدد الزبائن. يخرجون بسرعة. لا نعرف السبب. هل تستطيع حلّ القضية؟»¦„¡Bienvenido/a{NAME}! Desde la reforma de la sección «Ocio y aire libre» vienen menos clientes. Se van enseguida. No sabemos por qué. ¿Puedes resolver el caso?“¦„Bem-vindo/a{NAME}! Desde a remodelação da secção «Lazer e ar livre» vêm menos clientes. Saem logo. Não sabemos porquê. Consegues resolver o caso?“¦„እንቋዕ ብደሓን መጻእካ{NAME}! ካብ እቲ ክፍሊ „ዕረፍትን ወጻኢ ጽምብልን“ ካብ ዝተሓደሰ ዓሚላት ኣቕሊሎም። ቀልጢፎም ይወጹ። ስለምንታይ ከም ዝኾነ ኣይንፈልጥን። ነዚ ጉዳይ ክትፈትሖ ትኽእል ዲኻ?“¦«Добро пожаловать{NAME}! После ремонта отдела «Отдых и спорт» покупателей стало меньше. Они быстро уходят. Мы не знаем почему. Сможешь раскрыть это дело?»")],
 lk:T("Bremerhaven liegt an der Nordsee. Im Hafen kommen Schiffe aus aller Welt an. Viele Menschen kaufen in der Bürgermeister-Smidt-Straße ein.¦Bremerhaven nằm bên Biển Bắc. Tàu từ khắp thế giới cập cảng. Nhiều người mua sắm ở phố Bürgermeister-Smidt-Straße.¦Bremerhaven Kuzey Denizi kıyısındadır. Limana dünyanın her yerinden gemiler gelir. Birçok kişi Bürgermeister-Smidt-Straße'de alışveriş yapar.¦تقع بريمرهافن على بحر الشمال. تصل إلى الميناء سفن من كل العالم. يتسوّق كثيرون في شارع بورغرمايستر-شميت.¦Bremerhaven está en el mar del Norte. Al puerto llegan barcos de todo el mundo. Mucha gente compra en la calle Bürgermeister-Smidt-Straße.¦Bremerhaven fica no Mar do Norte. No porto chegam navios de todo o mundo. Muita gente faz compras na Bürgermeister-Smidt-Straße.¦ብሬመርሃቨን ኣብ ባሕሪ ሰሜን ትርከብ። ናብ ወደብ መራኽብ ካብ ዓለም ኩሉ ይመጹ። ብዙሓት ሰባት ኣብ ጎደና ቡርገርማይስተር-ስሚት ይዛዘሙ።¦Бремерхафен расположен на Северном море. В порт приходят корабли со всего мира. Многие делают покупки на улице Бюргермайстер-Шмидт-штрассе."),
},
{t:"mc",ch:0,say:P,
 q:T("Erst eine Frage aus Modul 1: Was ist das Ziel der Erlebnisstrategie?¦Trước hết là một câu hỏi từ Mô-đun 1: Mục tiêu của chiến lược trải nghiệm là gì?¦Önce Modül 1'den bir soru: Deneyim stratejisinin amacı nedir?¦أولاً سؤال من الوحدة 1: ما هدف استراتيجية التجربة؟¦Primero una pregunta del módulo 1: ¿Cuál es el objetivo de la estrategia de experiencia?¦Primeiro uma pergunta do módulo 1: Qual é o objetivo da estratégia de experiência?¦ቀዳማይ ሕቶ ካብ ሞዱል 1: ዕላማ ናይ ስትራተጂ ተመክሮ እንታይ እዩ?¦Сначала вопрос из модуля 1: какова цель стратегии впечатлений?"),
 o:[{a:T("Einkaufen soll zum Erlebnis werden: Kunden kommen gern, bleiben länger und kaufen mehr.¦Mua sắm trở thành trải nghiệm: khách thích đến, ở lâu hơn và mua nhiều hơn.¦Alışveriş bir deneyim olmalı: Müşteriler severek gelir, daha uzun kalır ve daha çok alır.¦أن يصبح التسوّق تجربة: يأتي الزبائن بسرور ويبقون أطول ويشترون أكثر.¦Comprar debe ser una experiencia: los clientes vienen con gusto, se quedan más tiempo y compran más.¦Comprar deve ser uma experiência: os clientes vêm com gosto, ficam mais tempo e compram mais.¦ሽመታ ተመክሮ ክኸውን: ዓሚላት ብሓጐስ ይመጹ፣ ንነዊሕ ይጸንሑ፣ ብዙሕ ይዕድጉ።¦Покупки должны стать событием: клиенты приходят охотно, дольше остаются и покупают больше."),ok:1},
    {a:T("Die Waren sollen möglichst billig sein.¦Hàng hóa phải càng rẻ càng tốt.¦Mallar mümkün olduğunca ucuz olmalı.¦يجب أن تكون البضائع رخيصة قدر الإمكان.¦Los productos deben ser lo más baratos posible.¦Os produtos devem ser o mais baratos possível.¦ዕዳጋ ክሳብ ዝተኻእለ ሸቐጥ ርካሽ ክኸውን።¦Товары должны быть как можно дешевле.")},
    {a:T("Der Laden soll möglichst schnell leer sein.¦Cửa hàng phải vắng khách càng nhanh càng tốt.¦Mağaza mümkün olduğunca çabuk boşalmalı.¦يجب أن يفرغ المحل بأسرع ما يمكن.¦La tienda debe vaciarse lo antes posible.¦A loja deve ficar vazia o mais depressa possível.¦ድኳን ክሳብ ዝተኻእለ ቀልጢፉ ክፈልጥ።¦Магазин должен как можно быстрее опустеть.")}],
 good:T("Genau! Wer sich wohlfühlt, bleibt länger und kauft mehr.¦Chính xác! Ai cảm thấy thoải mái sẽ ở lâu hơn và mua nhiều hơn.¦Aynen! Kendini iyi hisseden daha uzun kalır ve daha çok alır.¦بالضبط! من يشعر بالراحة يبقى أطول ويشتري أكثر.¦¡Exacto! Quien se siente bien se queda más y compra más.¦Exato! Quem se sente bem fica mais tempo e compra mais.¦ልክዕ! ዝተመቻቸዎ ንነዊሕ ይጸንሕ ብዙሕውን ይዕድግ።¦Верно! Кто чувствует себя комфортно, остаётся дольше и покупает больше."),
},
{t:"mc",ch:0,say:P,
 q:T("Und was bedeutet Visual Merchandising?¦Và Visual Merchandising có nghĩa là gì?¦Peki Visual Merchandising ne demek?¦وماذا يعني Visual Merchandising؟¦¿Y qué significa Visual Merchandising?¦E o que significa Visual Merchandising?¦ኣብ ርእሲ እዚ Visual Merchandising እንታይ ማለት እዩ?¦А что значит Visual Merchandising?"),
 o:[{a:T("Waren im Internet verkaufen.¦Bán hàng trên mạng.¦Malları internetten satmak.¦بيع البضائع عبر الإنترنت.¦Vender productos por internet.¦Vender produtos na internet.¦ሸቐጥ ብኢንተርኔት ምሽያጥ።¦Продавать товары в интернете.")},
    {a:T("Optische Verkaufsförderung durch die Gestaltung von Verkaufsraum und Ware.¦Thúc đẩy bán hàng bằng hình ảnh qua cách bố trí không gian bán hàng và hàng hóa.¦Satış alanı ve malın düzenlenmesiyle görsel satış teşviki.¦تنشيط المبيعات بصرياً من خلال تصميم مساحة البيع والبضاعة.¦Promoción visual de ventas mediante el diseño del espacio de venta y de la mercancía.¦Promoção visual das vendas através da decoração do espaço de venda e dos produtos.¦ብምድላው ቦታ ሽያጥን ሸቐጥን ብዓይኒ ዝርአ ሽያጥ ምድንፋዕ።¦Визуальное продвижение продаж через оформление торгового зала и товара."),ok:1},
    {a:T("Die Preise senken.¦Giảm giá.¦Fiyatları düşürmek.¦خفض الأسعار.¦Bajar los precios.¦Baixar os preços.¦ዋጋታት ምቅናስ።¦Снижать цены.")}],
 good:T("Richtig! Der Laden soll gut aussehen, damit die Ware besser verkauft wird.¦Đúng! Cửa hàng phải trông đẹp để hàng bán chạy hơn.¦Doğru! Mağaza güzel görünmeli ki mal daha iyi satılsın.¦صحيح! يجب أن يبدو المتجر جميلاً حتى تُباع البضاعة أفضل.¦¡Correcto! La tienda debe verse bien para que la mercancía se venda mejor.¦Certo! A loja deve ter bom aspeto para os produtos se venderem melhor.¦ልክዕ! ድኳን ጽቡቕ ክመስል ኣለዎ ሸቐጥ ዝሓሸ ክሽየጥ።¦Верно! Магазин должен хорошо выглядеть, чтобы товар лучше продавался."),
 merke:T("Visual Merchandising = optische Verkaufsförderung (Gestaltung von Verkaufsraum und Ware).¦Visual Merchandising = thúc đẩy bán hàng bằng hình ảnh (bố trí không gian bán hàng và hàng hóa).¦Visual Merchandising = görsel satış teşviki (satış alanı ve malın düzenlenmesi).¦Visual Merchandising = تنشيط المبيعات بصرياً (تصميم مساحة البيع والبضاعة).¦Visual Merchandising = promoción visual de ventas (diseño del espacio de venta y de la mercancía).¦Visual Merchandising = promoção visual das vendas (decoração do espaço de venda e dos produtos).¦Visual Merchandising = ብዓይኒ ዝርአ ሽያጥ ምድንፋዕ።¦Visual Merchandising = визуальное продвижение продаж (оформление зала и товара)."),
},
/* ===== Kapitel 2: Licht ===== */
{t:"story",ch:1,img:"s2",
 p:[T("Du gehst in die Abteilung. Die Rückwand ist dunkel. Nur ein einziger Spot leuchtet. Das ist die erste Spur!¦Bạn đi vào gian hàng. Bức tường phía sau tối om. Chỉ có một chiếc đèn rọi sáng. Đây là manh mối đầu tiên!¦Reyona giriyorsun. Arka duvar karanlık. Sadece tek bir spot ışığı yanıyor. Bu ilk iz!¦تدخل القسم. الجدار الخلفي مظلم. لا يضيء إلا كشّاف واحد. هذا هو الدليل الأول!¦Entras en la sección. La pared del fondo está oscura. Solo brilla un foco. ¡Esa es la primera pista!¦Entras na secção. A parede do fundo está escura. Só brilha um foco. É a primeira pista!¦ናብ እቲ ክፍሊ ትእቱ። እቲ ድሕሪት መንደቅ ጸልማት እዩ። ሓደ ጥራይ ስፖት የብርህ። እዚ ናይ መጀመርታ ምልክት እዩ!¦Ты заходишь в отдел. Задняя стена тёмная. Горит только один прожектор. Это первая улика!")],
 say:[P,T("„Es gibt drei Arten von Licht: Grundbeleuchtung, Warenwandbeleuchtung und Akzentbeleuchtung. Welche ist in den Fällen gemeint?“¦„Có ba loại ánh sáng: chiếu sáng chung (Grundbeleuchtung), chiếu sáng tường hàng (Warenwandbeleuchtung) và chiếu sáng nhấn (Akzentbeleuchtung). Mỗi trường hợp là loại nào?“¦„Üç tür ışık vardır: genel aydınlatma (Grundbeleuchtung), raf duvarı aydınlatması (Warenwandbeleuchtung) ve vurgu aydınlatması (Akzentbeleuchtung). Hangi durumda hangisi var?“¦«هناك ثلاثة أنواع من الإضاءة: الإضاءة الأساسية (Grundbeleuchtung) وإضاءة جدار البضائع (Warenwandbeleuchtung) والإضاءة المُبرِزة (Akzentbeleuchtung). أيّها المقصود في كل حالة؟»¦„Hay tres tipos de luz: iluminación general (Grundbeleuchtung), iluminación de la pared de mercancía (Warenwandbeleuchtung) e iluminación de acento (Akzentbeleuchtung). ¿Cuál es en cada caso?“¦„Há três tipos de luz: iluminação geral (Grundbeleuchtung), iluminação da parede de produtos (Warenwandbeleuchtung) e iluminação de destaque (Akzentbeleuchtung). Qual é qual em cada caso?“¦„ሰለስተ ዓይነት ብርሃን ኣሎ: ሓፈሻዊ ብርሃን (Grundbeleuchtung)፣ ብርሃን መንደቅ ሸቐጥ (Warenwandbeleuchtung) ከምኡውን ብርሃን ምድማቕ (Akzentbeleuchtung)። ኣብ ነፍሲ ወከፍ ጉዳይ ኣየናይ እዩ?“¦«Есть три вида света: общее (Grundbeleuchtung), подсветка стены с товаром (Warenwandbeleuchtung) и акцентное (Akzentbeleuchtung). Какой вид в каждом случае?»")],
 lk:T("Im deutschen Winter wird es schon am frühen Nachmittag dunkel. Deshalb sind Läden und Straßen im Advent besonders hell geschmückt.¦Mùa đông ở Đức, trời tối từ đầu giờ chiều. Vì vậy cửa hàng và đường phố được trang trí rất sáng vào mùa Vọng.¦Almanya'da kışın hava öğleden sonra erkenden kararır. Bu yüzden Advent döneminde mağazalar ve sokaklar çok aydınlık süslenir.¦في الشتاء الألماني يحلّ الظلام مبكراً بعد الظهر. لذلك تُزيَّن المحلات والشوارع بإضاءة ساطعة في فترة المجيء.¦En el invierno alemán oscurece ya a primera hora de la tarde. Por eso, en Adviento las tiendas y calles se decoran con mucha luz.¦No inverno alemão escurece logo no início da tarde. Por isso, no Advento as lojas e ruas são decoradas com muita luz.¦ኣብ ክረምቲ ጀርመን ድሕሪ ሰዓት ቀትሪ ቀልጢፉ ይጸልም። ስለዚ ኣብ ግዜ ኣድቨንት ድኳናትን ጎደናታትን ብብርሃን ይድኳኑ።¦Зимой в Германии темнеет уже после обеда. Поэтому в Адвент магазины и улицы ярко украшены огнями."),
},
{t:"sort",ch:1,
 cats:[T("Grundbeleuchtung – ganze Fläche¦Chiếu sáng chung – toàn bộ diện tích¦Genel aydınlatma – tüm alan¦الإضاءة الأساسية – كل المساحة¦Iluminación general – toda la superficie¦Iluminação geral – toda a área¦ሓፈሻዊ ብርሃን – ምሉእ ቦታ¦Общее освещение – вся площадь"),
       T("Warenwandbeleuchtung – Wände, Regale¦Chiếu sáng tường hàng – tường, kệ¦Raf duvarı aydınlatması – duvarlar, raflar¦إضاءة جدار البضائع – الجدران والرفوف¦Iluminación de pared – paredes, estanterías¦Iluminação de parede – paredes, prateleiras¦ብርሃን መንደቅ ሸቐጥ – መንደቕ፣ መደርደሪ¦Подсветка стен – стены, полки"),
       T("Akzentbeleuchtung – einzelne Ware betonen¦Chiếu sáng nhấn – làm nổi bật từng món hàng¦Vurgu aydınlatması – tek tek malı öne çıkarır¦الإضاءة المُبرِزة – إبراز بضاعة معيّنة¦Iluminación de acento – destaca un producto¦Iluminação de destaque – realça um produto¦ብርሃን ምድማቕ – ሓደ ሸቐጥ የጉልሕ¦Акцентное освещение – выделяет товар")],
 it:[{a:T("💡 Die ganze Verkaufsfläche ist gleichmäßig hell.¦💡 Toàn bộ khu bán hàng sáng đều.¦💡 Tüm satış alanı eşit derecede aydınlık.¦💡 كل مساحة البيع مضاءة بالتساوي.¦💡 Toda la superficie de venta está igual de iluminada.¦💡 Toda a área de venda está iluminada por igual.¦💡 ኩሉ ቦታ ሽያጥ ብማዕረ ብሩህ እዩ።¦💡 Вся торговая площадь освещена равномерно."),c:0},
     {a:T("👜 Ein Spot strahlt die neue Handtasche auf dem Podest an.¦👜 Một đèn rọi chiếu vào chiếc túi xách mới trên bục.¦👜 Bir spot, podyumdaki yeni çantayı aydınlatıyor.¦👜 كشّاف يضيء الحقيبة الجديدة على المنصّة.¦👜 Un foco ilumina el bolso nuevo en la tarima.¦👜 Um foco ilumina a mala nova no pódio.¦👜 ሓደ ስፖት ነታ ሓዳስ ሻንጣ ኣብ ልዕሊ መድረኽ የብርሃ።¦👜 Прожектор освещает новую сумку на подиуме."),c:2},
     {a:T("📚 Lichtbänder beleuchten die Regale an der Rückwand.¦📚 Dải đèn chiếu sáng các kệ ở tường phía sau.¦📚 Işık bantları arka duvardaki rafları aydınlatıyor.¦📚 أشرطة إضاءة تضيء الرفوف على الجدار الخلفي.¦📚 Tiras de luz iluminan las estanterías de la pared del fondo.¦📚 Fitas de luz iluminam as prateleiras da parede do fundo.¦📚 ብርሃናት መደርደሪ ኣብ ድሕሪት መንደቅ የብርሁ።¦📚 Световые ленты подсвечивают полки на задней стене."),c:1},
     {a:T("🪑 Eine Dekoinsel mit Gartenmöbeln wird hervorgehoben.¦🪑 Một đảo trang trí với bàn ghế vườn được làm nổi bật.¦🪑 Bahçe mobilyalı bir dekor adası öne çıkarılıyor.¦🪑 يتم إبراز جزيرة ديكور فيها أثاث حدائق.¦🪑 Se destaca una isla de decoración con muebles de jardín.¦🪑 Uma ilha de decoração com móveis de jardim é realçada.¦🪑 ሓደ ደሴት ምስ ናይ ጀርዲን መንበራት ይደምቕ።¦🪑 Выделяется декоративный остров с садовой мебелью."),c:2},
     {a:T("👟 Die Schuhwand wird von oben gleichmäßig ausgeleuchtet.¦👟 Tường giày được chiếu sáng đều từ phía trên.¦👟 Ayakkabı duvarı yukarıdan eşit şekilde aydınlatılıyor.¦👟 جدار الأحذية مضاء من الأعلى بالتساوي.¦👟 La pared de zapatos se ilumina de forma uniforme desde arriba.¦👟 A parede de sapatos é iluminada por cima de forma uniforme.¦👟 መንደቅ ሳእኒ ካብ ላዕሊ ብማዕረ ይበርህ።¦👟 Стена с обувью равномерно освещена сверху."),c:1},
     {a:T("🏷️ Deckenleuchten sorgen dafür, dass man die Preise überall lesen kann.¦🏷️ Đèn trần giúp đọc được giá ở mọi nơi.¦🏷️ Tavan lambaları fiyatların her yerde okunmasını sağlıyor.¦🏷️ مصابيح السقف تتيح قراءة الأسعار في كل مكان.¦🏷️ Las luces del techo permiten leer los precios en todas partes.¦🏷️ As luzes do teto permitem ler os preços em qualquer lugar.¦🏷️ ብርሃናት ናይ ናብ ጣሪያ ዋጋታት ኣብ ኩሉ ቦታ ክንንብብ የኽእሉ።¦🏷️ Потолочные лампы позволяют читать цены везде."),c:0}],
 merke:T("Grundbeleuchtung = ganze Fläche. Warenwandbeleuchtung = Wände und Regale. Akzentbeleuchtung = einzelne Waren und Dekoinseln.¦Chiếu sáng chung = toàn bộ diện tích. Chiếu sáng tường hàng = tường và kệ. Chiếu sáng nhấn = từng món hàng và đảo trang trí.¦Genel aydınlatma = tüm alan. Raf duvarı aydınlatması = duvarlar ve raflar. Vurgu aydınlatması = tek tek mallar ve dekor adaları.¦الأساسية = كل المساحة. إضاءة جدار البضائع = الجدران والرفوف. المُبرِزة = بضائع منفردة وجزر الديكور.¦General = toda la superficie. De pared = paredes y estanterías. De acento = productos sueltos e islas de decoración.¦Geral = toda a área. De parede = paredes e prateleiras. De destaque = produtos isolados e ilhas de decoração.¦ሓፈሻዊ = ምሉእ ቦታ። መንደቅ ሸቐጥ = መንደቕን መደርደሪን። ምድማቕ = ሓደ ሓደ ሸቐጥን ደሴታት ምድንፋዕን።¦Общее = вся площадь. Стенное = стены и полки. Акцентное = отдельные товары и декоративные острова."),
},
{t:"mc",ch:1,say:P,
 q:T("Noch ein Beweis: An der Fleischtheke leuchtet kaltes, bläuliches Licht. Was ist daran falsch?¦Thêm một bằng chứng: Ở quầy thịt có ánh sáng lạnh, hơi xanh. Điều gì sai ở đây?¦Bir kanıt daha: Et tezgâhında soğuk, mavimsi ışık yanıyor. Burada ne yanlış?¦دليل آخر: عند ثلاجة اللحوم ضوء بارد مائل للزرقة. ما الخطأ في ذلك؟¦Otra prueba: En la carnicería hay una luz fría y azulada. ¿Qué está mal?¦Mais uma prova: no talho há uma luz fria e azulada. O que está errado?¦ዝያዳ መርኣያ: ኣብ መሸጣ ስጋ ሑሩር ሰማያዊ ዝመስል ብርሃን የብርህ። እንታይ ጌጋ እዩ?¦Ещё одна улика: над мясным прилавком холодный голубоватый свет. Что тут не так?"),
 o:[{a:T("Das Fleisch wirkt grau. Besser: warmes Licht, dann wirkt es frisch und rot.¦Thịt trông xám xịt. Tốt hơn: ánh sáng ấm, khi đó thịt trông tươi và đỏ.¦Et gri görünür. Daha iyisi: sıcak ışık, o zaman taze ve kırmızı görünür.¦يبدو اللحم رمادياً. الأفضل: ضوء دافئ فيبدو طازجاً وأحمر.¦La carne parece gris. Mejor: luz cálida, así se ve fresca y roja.¦A carne parece cinzenta. Melhor: luz quente, assim parece fresca e vermelha.¦ስጋ ሓመድማ ይመስል። ዝሓሸ: ዑቕባ ብርሃን፣ ሽዑ ሓድሽን ቀይሕን ይመስል።¦Мясо выглядит серым. Лучше тёплый свет — тогда оно кажется свежим и красным."),ok:1},
    {a:T("Nichts. Kaltes Licht macht Fleisch besonders appetitlich.¦Không có gì. Ánh sáng lạnh làm thịt đặc biệt hấp dẫn.¦Hiçbir şey. Soğuk ışık eti özellikle iştah açıcı gösterir.¦لا شيء. الضوء البارد يجعل اللحم شهياً جداً.¦Nada. La luz fría hace la carne especialmente apetitosa.¦Nada. A luz fria torna a carne especialmente apetitosa.¦ዋላ ሓንቲ። ሑሩር ብርሃን ስጋ ዝያዳ የምጥዕም።¦Ничего. Холодный свет делает мясо особенно аппетитным.")},
    {a:T("Es ist zu hell. Fleisch braucht Dunkelheit.¦Quá sáng. Thịt cần bóng tối.¦Çok aydınlık. Et karanlık ister.¦إنه ساطع جداً. اللحم يحتاج إلى العتمة.¦Hay demasiada luz. La carne necesita oscuridad.¦Há demasiada luz. A carne precisa de escuridão.¦ኣዝዩ ብሩህ እዩ። ስጋ ጸልማት የድልዮ።¦Слишком светло. Мясу нужна темнота.")}],
 good:T("Richtig! Warmes Licht lässt Fleisch, Tomaten und Brot appetitlich wirken. Spur 1 gesichert!¦Đúng! Ánh sáng ấm làm thịt, cà chua và bánh mì trông hấp dẫn. Manh mối 1 đã có!¦Doğru! Sıcak ışık et, domates ve ekmeği iştah açıcı gösterir. 1. iz tamam!¦صحيح! الضوء الدافئ يجعل اللحم والطماطم والخبز شهية. الدليل 1 محفوظ!¦¡Correcto! La luz cálida hace que la carne, los tomates y el pan se vean apetitosos. ¡Pista 1 asegurada!¦Certo! A luz quente faz a carne, os tomates e o pão parecerem apetitosos. Pista 1 garantida!¦ልክዕ! ዑቕባ ብርሃን ስጋን ቲማቲምን ባኒን የምጥዕም ይመስል። ምልክት 1 ተሓሊዩ!¦Верно! Тёплый свет делает мясо, помидоры и хлеб аппетитными. Улика 1 найдена!"),
},
/* ===== Kapitel 3: Farbe ===== */
{t:"story",ch:2,img:"s3",
 p:[T("Spur 2: In der Abteilung sind alle Wände knallrot. Eine Kundin murmelt: „Hier ist es so unruhig.“ Sie geht gleich wieder.¦Manh mối 2: Trong gian hàng, tất cả các bức tường đều đỏ chói. Một khách nữ lẩm bẩm: „Ở đây thật bồn chồn.“ Rồi bà ra về ngay.¦İz 2: Reyondaki tüm duvarlar çok kırmızı. Bir müşteri mırıldanıyor: „Burası çok huzursuz.“ Hemen çıkıp gidiyor.¦الدليل 2: كل جدران القسم حمراء فاقعة. تتمتم زبونة: «هنا مزعج جداً.» ثم تغادر فوراً.¦Pista 2: Todas las paredes de la sección son de un rojo intenso. Una clienta murmura: «Aquí hay mucha agitación.» Se va enseguida.¦Pista 2: Todas as paredes da secção são de um vermelho intenso. Uma cliente murmura: «Aqui é muito agitado.» Vai-se logo embora.¦ምልክት 2: ኩሎም መንደቓት እቲ ክፍሊ ብጽቡቕ ቀይሕ እዮም። ሓንቲ ዓሚላ «ኣብዚ ኣዝዩ ዘሰክፍ እዩ» ትብል። ቀልጢፋ ትወጽእ።¦Улика 2: Все стены в отделе ярко-красные. Покупательница бормочет: «Здесь так беспокойно». И сразу уходит.")],
 say:[P,T("„Farbe hat drei Aufgaben: Sie ordnet, sie lässt Kunden sich wohlfühlen, und sie sorgt für Wiedererkennung. Welche zwei davon stehen hier?“¦„Màu sắc có ba nhiệm vụ: sắp xếp, giúp khách thấy dễ chịu và giúp nhận ra thương hiệu. Hai nhiệm vụ nào có ở dưới đây?“¦„Rengin üç görevi var: düzen sağlar, müşteriyi rahat hissettirir ve tanınırlık yaratır. Burada hangi ikisi var?“¦«للّون ثلاث مهام: ينظّم، ويُشعر الزبائن بالراحة، ويضمن التعرّف على العلامة. أي مهمتين منها مذكورتان هنا؟»¦„El color tiene tres tareas: ordena, hace que los clientes se sientan bien y da reconocimiento. ¿Cuáles dos aparecen aquí?“¦„A cor tem três tarefas: organiza, faz os clientes sentirem-se bem e dá reconhecimento. Quais duas estão aqui?“¦„ሕብሪ ሰለስተ ዕማማት ኣለዎ: የዳሉ፣ ዓሚላት ከምዝተመቻቸው የስምዕ፣ ከምኡውን ምልላይ የረጋግጽ። ካብዚኣተን ኣየናይ ክልተ ኣለዋ?“¦«У цвета три задачи: он упорядочивает, создаёт комфорт и даёт узнаваемость. Какие две из них здесь?»")],
 lk:T("In Deutschland ist Weiß typisch für Hochzeiten, Schwarz für Trauer und festliche Anlässe. In anderen Ländern können Farben etwas anderes bedeuten.¦Ở Đức, màu trắng thường dành cho đám cưới, màu đen cho tang lễ và dịp trang trọng. Ở các nước khác, màu sắc có thể mang ý nghĩa khác.¦Almanya'da beyaz genellikle düğünlerle, siyah yas ve resmî davetlerle ilişkilidir. Başka ülkelerde renklerin anlamı farklı olabilir.¦في ألمانيا يرتبط الأبيض عادةً بالأعراس والأسود بالحداد والمناسبات الرسمية. وقد تعني الألوان شيئاً آخر في بلدان أخرى.¦En Alemania el blanco es típico de las bodas y el negro del luto y de ocasiones festivas. En otros países los colores pueden significar otra cosa.¦Na Alemanha o branco é típico dos casamentos e o preto do luto e de ocasiões festivas. Noutros países as cores podem ter outro significado.¦ኣብ ጀርመን ጻዕዳ ንመርዓ፣ ጸሊም ድማ ንሓዘንን ክብራዊ ጽምብልን ልሙድ እዩ። ኣብ ካልኦት ሃገራት ሕብርታት ካልእ ትርጉም ክህልዎም ይኽእል።¦В Германии белый цвет типичен для свадеб, чёрный — для траура и торжественных случаев. В других странах цвета могут означать другое."),
},
{t:"multi",ch:2,say:P,
 q:T("„Wähle die 2 Aufgaben der Farbe.“¦„Chọn 2 nhiệm vụ của màu sắc.“¦„Rengin 2 görevini seç.“¦«اختر مهمتَي اللون.»¦„Elige las 2 tareas del color.“¦„Escolhe as 2 tarefas da cor.“¦„ክልተ ዕማማት ሕብሪ ምረጽ።“¦«Выбери 2 задачи цвета.»"),
 o:[{a:T("Sie ordnet Warengruppen und Wege.¦Sắp xếp nhóm hàng và lối đi.¦Mal gruplarını ve yolları düzenler.¦تنظّم مجموعات البضائع والمسارات.¦Ordena los grupos de productos y los recorridos.¦Organiza os grupos de produtos e os percursos.¦ጉጅለታት ሸቐጥን መገድታትን የዳሉ።¦Упорядочивает группы товаров и маршруты."),ok:1},
    {a:T("Sie macht die Ware haltbarer.¦Làm hàng hóa bền hơn.¦Malı daha dayanıklı yapar.¦تجعل البضاعة أطول عمراً.¦Hace los productos más duraderos.¦Torna os produtos mais duradouros.¦ሸቐጥ ዝያዳ ዘይበላሸው የድርጎ።¦Делает товар долговечнее.")},
    {a:T("Sie sorgt für Wiedererkennung (Hausfarbe, Logo).¦Giúp nhận ra thương hiệu (màu chủ đạo, logo).¦Tanınırlık sağlar (kurum rengi, logo).¦تضمن التعرّف على العلامة (لون المتجر، الشعار).¦Da reconocimiento (color corporativo, logotipo).¦Dá reconhecimento (cor da casa, logótipo).¦ምልላይ የረጋግጽ (ሕብሪ ድኳን፣ ሎጎ)።¦Даёт узнаваемость (фирменный цвет, логотип)."),ok:1},
    {a:T("Sie senkt die Preise.¦Làm giảm giá.¦Fiyatları düşürür.¦تخفّض الأسعار.¦Baja los precios.¦Baixa os preços.¦ዋጋታት የቕንስ።¦Снижает цены.")}],
 good:T("Stark! Dazu kommt: Farbe lässt Kunden sich wohlfühlen (Farbwirkung).¦Giỏi lắm! Thêm nữa: màu sắc giúp khách cảm thấy dễ chịu (tác dụng của màu).¦Harika! Ayrıca: renk müşteriyi rahat hissettirir (renk etkisi).¦ممتاز! وكذلك: اللون يُشعر الزبائن بالراحة (تأثير اللون).¦¡Muy bien! Además: el color hace que los clientes se sientan a gusto (efecto del color).¦Muito bem! Além disso: a cor faz os clientes sentirem-se bem (efeito da cor).¦ድንቂ! ብተወሳኺ: ሕብሪ ዓሚላት ከምዝተመቻቸው የስምዕ (ጽልዋ ሕብሪ)።¦Отлично! Кроме того: цвет создаёт комфорт (воздействие цвета).")},
{t:"mc",ch:2,say:P,
 q:T("Beratungsecke für teure Matratzen: Welche Farbe passt?¦Góc tư vấn nệm đắt tiền: Màu nào phù hợp?¦Pahalı yataklar için danışma köşesi: Hangi renk uygun?¦ركن استشارة لمفارش غالية: أي لون يناسب؟¦Rincón de asesoramiento para colchones caros: ¿qué color encaja?¦Canto de aconselhamento para colchões caros: que cor combina?¦ኣብ ጥቓ ምኽሪ ንሃለ ፍራሽ: ኣየናይ ሕብሪ ይሓይሽ?¦Уголок консультаций для дорогих матрасов: какой цвет подходит?"),
 o:[{a:T("Knallrot¦Đỏ chói¦Parlak kırmızı¦أحمر فاقع¦Rojo intenso¦Vermelho vivo¦ብርሃናዊ ቀይሕ¦Ярко-красный")},
    {a:T("Blau – ruhig, Vertrauen¦Xanh dương – yên tĩnh, tin cậy¦Mavi – sakin, güven¦أزرق – هادئ ويبعث الثقة¦Azul – calma, confianza¦Azul – calmo, confiança¦ሰማያዊ – ህዱእ፣ እምነት¦Синий — спокойствие, доверие"),ok:1},
    {a:T("Neongelb¦Vàng neon¦Neon sarı¦أصفر نيون¦Amarillo neón¦Amarelo néon¦ኒዖን ብጫ¦Неоново-жёлтый")}],
 good:T("Ja! Kühle Farben wie Blau wirken ruhig. Das passt zu teurer Ware mit viel Beratung.¦Đúng! Màu lạnh như xanh dương tạo cảm giác yên tĩnh. Hợp với hàng đắt cần tư vấn nhiều.¦Evet! Mavi gibi soğuk renkler sakinleştirir. Çok danışmanlık gerektiren pahalı mallara uyar.¦نعم! الألوان الباردة مثل الأزرق تبعث الهدوء. هذا يناسب البضائع الغالية التي تحتاج استشارة.¦¡Sí! Los colores fríos como el azul transmiten calma. Va bien con productos caros que requieren asesoramiento.¦Sim! As cores frias como o azul transmitem calma. Combina com produtos caros que precisam de aconselhamento.¦እወ! ሑሩር ሕብርታት ከም ሰማያዊ ህዱእ ይመስሉ። ንዋጋኡ ዓቢ ብዙሕ ምኽሪ ዘድልዮ ሸቐጥ ይሰማማዕ።¦Да! Холодные цвета, например синий, успокаивают. Это подходит дорогому товару, требующему консультации."),
},
{t:"mc",ch:2,say:P,
 q:T("Aktionsfläche mit Sonderangeboten: Welche Farbe passt?¦Khu khuyến mãi với hàng giảm giá: Màu nào phù hợp?¦İndirimli ürünlerin olduğu kampanya alanı: Hangi renk uygun?¦منطقة العروض الخاصة: أي لون يناسب؟¦Zona de ofertas especiales: ¿qué color encaja?¦Área de promoções: que cor combina?¦ቦታ ፍሉይ ቅናሽ: ኣየናይ ሕብሪ ይሓይሽ?¦Зона акций и спецпредложений: какой цвет подходит?"),
 o:[{a:T("Rot oder Gelb – aktiviert, fällt auf¦Đỏ hoặc vàng – kích thích, nổi bật¦Kırmızı veya sarı – harekete geçirir, dikkat çeker¦أحمر أو أصفر – ينشّط ويلفت النظر¦Rojo o amarillo – activa, llama la atención¦Vermelho ou amarelo – ativa, chama a atenção¦ቀይሕ ወይ ብጫ – የተባብዕ፣ ትኩረት የስሕብ¦Красный или жёлтый — активирует, привлекает внимание"),ok:1},
    {a:T("Blaugrau – beruhigt¦Xám xanh – làm dịu¦Mavi-gri – sakinleştirir¦أزرق رمادي – يهدّئ¦Gris azulado – calma¦Cinzento-azulado – acalma¦ሰማያዊ-ሓመድማ – የህድእ¦Серо-голубой — успокаивает")},
    {a:T("Schwarz – ernst und feierlich¦Đen – nghiêm túc và trang trọng¦Siyah – ciddi ve törensel¦أسود – جادّ ورسمي¦Negro – serio y solemne¦Preto – sério e solene¦ጸሊም – ኣሳዛኒን ክብራዊን¦Чёрный — серьёзный и торжественный")}],
 good:T("Genau! Warme Farben wie Rot und Gelb aktivieren. Spur 2 gesichert!¦Chính xác! Màu ấm như đỏ và vàng kích thích mua sắm. Manh mối 2 đã có!¦Aynen! Kırmızı ve sarı gibi sıcak renkler harekete geçirir. 2. iz tamam!¦بالضبط! الألوان الدافئة مثل الأحمر والأصفر تنشّط. الدليل 2 محفوظ!¦¡Exacto! Los colores cálidos como el rojo y el amarillo activan. ¡Pista 2 asegurada!¦Exato! As cores quentes como o vermelho e o amarelo ativam. Pista 2 garantida!¦ልክዕ! ዑቕባ ሕብርታት ከም ቀይሕን ብጫን የተባብዑ። ምልክት 2 ተሓሊዩ!¦Верно! Тёплые цвета, например красный и жёлтый, активируют. Улика 2 найдена!"),
 merke:T("Warme Farben (Rot, Gelb) aktivieren – gut für Sonderangebote. Kühle Farben (Blau, Grün) beruhigen – gut für teure Ware mit Beratung.¦Màu ấm (đỏ, vàng) kích thích – tốt cho hàng khuyến mãi. Màu lạnh (xanh dương, xanh lá) làm dịu – tốt cho hàng đắt cần tư vấn.¦Sıcak renkler (kırmızı, sarı) harekete geçirir – indirimli ürünler için iyi. Soğuk renkler (mavi, yeşil) sakinleştirir – danışmanlık gerektiren pahalı mallar için iyi.¦الألوان الدافئة (الأحمر والأصفر) تنشّط – مناسبة للعروض. الألوان الباردة (الأزرق والأخضر) تهدّئ – مناسبة للبضائع الغالية التي تحتاج استشارة.¦Colores cálidos (rojo, amarillo) activan – buenos para ofertas. Colores fríos (azul, verde) calman – buenos para productos caros con asesoramiento.¦Cores quentes (vermelho, amarelo) ativam – boas para promoções. Cores frias (azul, verde) acalmam – boas para produtos caros com aconselhamento.¦ዑቕባ ሕብርታት (ቀይሕ፣ ብጫ) የተባብዑ – ንቅናሽ ጽቡቕ። ሑሩር ሕብርታት (ሰማያዊ፣ ሰማያዊ-ዕምባባ) የህድኡ – ንዋጋኡ ዓቢ ሸቐጥ ጽቡቕ።¦Тёплые цвета (красный, жёлтый) активируют — для акций. Холодные (синий, зелёный) успокаивают — для дорогого товара с консультацией."),
},
/* ===== Kapitel 4: Tatort-Begehung ===== */
{t:"story",ch:3,img:"s4",
 p:[T("Spur 3: Frau Petersen führt dich durch das Haus. Gelbe Marker zeigen Stellen, an denen etwas nicht stimmt. Aber Vorsicht: Nicht alles ist ein Fehler!¦Manh mối 3: Cô Petersen dẫn bạn đi quanh cửa hàng. Các thẻ vàng đánh dấu những chỗ có vấn đề. Nhưng cẩn thận: không phải cái nào cũng là lỗi!¦İz 3: Bayan Petersen seni mağazada gezdiriyor. Sarı işaretler, bir şeylerin yanlış olduğu yerleri gösteriyor. Ama dikkat: Her şey hata değil!¦الدليل 3: تأخذك السيدة بيترسن في جولة في المتجر. تشير علامات صفراء إلى أماكن فيها خلل. لكن احذر: ليس كل شيء خطأ!¦Pista 3: La señora Petersen te lleva por la tienda. Marcadores amarillos señalan lugares donde algo no va bien. Pero cuidado: ¡no todo es un error!¦Pista 3: A Sra. Petersen leva-te pela loja. Marcadores amarelos mostram sítios onde algo não está bem. Mas cuidado: nem tudo é um erro!¦ምልክት 3: ሓፍቲ ፔተርሰን ብድኳን የዞረካ። ቢጫ ምልክታት ጌጋ ዘለዎም ቦታታት የርእዩ። ግን ጥንቃቐ: ኩሉ ጌጋ ኣይኰነን!¦Улика 3: Фрау Петерсен ведёт тебя по магазину. Жёлтые метки показывают места, где что-то не так. Но осторожно: не всё здесь ошибка!")],
 say:[P,T("„Hier sind acht Beobachtungen. Vier davon sind Fehler bei Musik, Duft, Deko oder Temperatur. Welche?“¦„Đây là tám quan sát. Bốn trong số đó là lỗi về nhạc, mùi, trang trí hoặc nhiệt độ. Là những cái nào?“¦„İşte sekiz gözlem. Dördü müzik, koku, dekor veya sıcaklıkla ilgili hata. Hangileri?“¦«إليك ثماني ملاحظات. أربع منها أخطاء في الموسيقى أو الرائحة أو الديكور أو الحرارة. أيّها؟»¦„Aquí hay ocho observaciones. Cuatro son errores de música, olor, decoración o temperatura. ¿Cuáles?“¦„Aqui estão oito observações. Quatro são erros de música, cheiro, decoração ou temperatura. Quais?“¦„ዝስዕቡ ሸሞንተ ምስክርነታት እዮም። ኣርባዕተ ብሙዚቃ፣ ጨና፣ ምድንፋዕ ወይ ዑቕበት ጌጋታት እዮም። ኣየኖት?“¦«Вот восемь наблюдений. Четыре из них — ошибки в музыке, запахе, декоре или температуре. Какие?»")],
 lk:T("In Deutschland duftet es in vielen Bäckereien schon früh am Morgen nach Brot. Es gibt sehr viele Brotsorten. Der Duft lockt Kunden in den Laden.¦Ở Đức, nhiều tiệm bánh thơm mùi bánh mì từ sáng sớm. Có rất nhiều loại bánh mì. Mùi thơm thu hút khách vào cửa hàng.¦Almanya'da birçok fırın sabahın erken saatlerinde ekmek kokar. Çok sayıda ekmek çeşidi vardır. Koku müşterileri dükkâna çeker.¦في ألمانيا تفوح رائحة الخبز من مخابز كثيرة منذ الصباح الباكر. وهناك أنواع كثيرة جداً من الخبز. الرائحة تجذب الزبائن إلى المحل.¦En Alemania muchas panaderías huelen a pan desde muy temprano. Hay muchísimos tipos de pan. El aroma atrae a los clientes a la tienda.¦Na Alemanha muitas padarias cheiram a pão logo de manhã cedo. Há muitíssimos tipos de pão. O cheiro atrai os clientes para a loja.¦ኣብ ጀርመን ብዙሓት ባኒ ቤታት ኣብ ጉሆ ጨና ባኒ ይህቡ። ብዙሕ ዓይነት ባኒ ኣሎ። እቲ ጨና ዓሚላት ናብ ድኳን የሳሕብ።¦В Германии во многих пекарнях с раннего утра пахнет хлебом. Сортов хлеба очень много. Запах привлекает покупателей в магазин."),
},
{t:"find",ch:3,n:2,
 q:T("Tippe die vier Fehler an.¦Chạm vào bốn lỗi.¦Dört hatayı seç.¦المس الأخطاء الأربعة.¦Toca los cuatro errores.¦Toca nos quatro erros.¦ኣርባዕተ ጌጋታት ጠዕም።¦Нажми на четыре ошибки."),
 it:[{a:T("🎵 Im Juweliergeschäft läuft laute, schnelle Technomusik.¦🎵 Trong tiệm kim hoàn đang phát nhạc techno to và nhanh.¦🎵 Kuyumcuda yüksek sesli, hızlı tekno müzik çalıyor.¦🎵 في محل المجوهرات تُشغَّل موسيقى تكنو صاخبة وسريعة.¦🎵 En la joyería suena música techno fuerte y rápida.¦🎵 Na joalharia toca música tecno alta e rápida.¦🎵 ኣብ ድኳን ወርቂ ዓው ዝበለ ቀልጢፍ ቴክኖ ሙዚቃ ይጻወት።¦🎵 В ювелирном магазине играет громкая быстрая техно-музыка."),bad:1,
      f:T("Musik passt nicht zu Ware und Zielgruppe. Besser: ruhige Musik, damit Kunden verweilen.¦Nhạc không hợp với hàng và khách. Tốt hơn: nhạc êm dịu để khách ở lại lâu.¦Müzik mala ve hedef kitleye uymuyor. Daha iyisi: sakin müzik, böylece müşteriler oyalanır.¦الموسيقى لا تناسب البضاعة ولا الفئة المستهدفة. الأفضل: موسيقى هادئة ليبقى الزبائن.¦La música no encaja con el producto ni el público. Mejor: música tranquila para que los clientes se queden.¦A música não combina com os produtos nem com o público. Melhor: música calma para os clientes ficarem.¦ሙዚቃ ምስ ሸቐጥን ዓሚልን ኣይሰማማዕን። ዝሓሸ: ህዱእ ሙዚቃ ዓሚላት ክጸንሑ።¦Музыка не подходит товару и клиентам. Лучше спокойная музыка, чтобы клиенты задерживались.")},
     {a:T("🐟 In der Fischabteilung duftet es stark nach Lavendel.¦🐟 Ở quầy cá có mùi oải hương rất nồng.¦🐟 Balık reyonu yoğun lavanta kokuyor.¦🐟 في قسم السمك تفوح رائحة الخزامى بقوة.¦🐟 En la pescadería huele mucho a lavanda.¦🐟 Na peixaria cheira muito a lavanda.¦🐟 ኣብ ክፍሊ ዓሳ ብርቱዕ ጨና ላቬንደር ኣሎ።¦🐟 В рыбном отделе сильно пахнет лавандой."),bad:1,
      f:T("Der Duft passt nicht zur Ware. Besser: neutral oder passend (Meer, Zitrone).¦Mùi không hợp với hàng. Tốt hơn: không mùi hoặc mùi hợp (biển, chanh).¦Koku mala uymuyor. Daha iyisi: nötr veya uygun (deniz, limon).¦الرائحة لا تناسب البضاعة. الأفضل: محايدة أو مناسبة (البحر، الليمون).¦El olor no encaja con el producto. Mejor: neutro o adecuado (mar, limón).¦O cheiro não combina com o produto. Melhor: neutro ou adequado (mar, limão).¦ጨና ምስ ሸቐጥ ኣይሰማማዕን። ዝሓሸ: ዘይሕብር ወይ ዝስማማዕ (ባሕሪ፣ ሊሙን)።¦Запах не подходит товару. Лучше нейтральный или подходящий (море, лимон).")},
     {a:T("🌷 In der Osterdeko stehen seit zwei Wochen verwelkte Tulpen.¦🌷 Trong trang trí lễ Phục sinh có hoa tulip héo từ hai tuần nay.¦🌷 Paskalya dekorasyonunda iki haftadır solmuş laleler duruyor.¦🌷 في ديكور عيد الفصح زهور توليب ذابلة منذ أسبوعين.¦🌷 En la decoración de Pascua hay tulipanes marchitos desde hace dos semanas.¦🌷 Na decoração de Páscoa há tulipas murchas há duas semanas.¦🌷 ኣብ ምድንፋዕ ፋሲካ ክልተ ሰሙን ዝሞቱ ቱሊፓት ኣለዉ።¦🌷 В пасхальном декоре уже две недели стоят увядшие тюльпаны."),bad:1,
      f:T("Deko muss positiv und gepflegt sein. Besser: frisch austauschen.¦Đồ trang trí phải đẹp và được chăm sóc. Tốt hơn: thay mới.¦Dekor olumlu ve bakımlı olmalı. Daha iyisi: taze olanlarla değiştir.¦يجب أن يكون الديكور جميلاً ومُعتنى به. الأفضل: استبداله بطازج.¦La decoración debe ser agradable y cuidada. Mejor: cambiarla por flores frescas.¦A decoração deve ser agradável e cuidada. Melhor: trocar por flores frescas.¦ምድንፋዕ ጽቡቕን ዝተሓለወን ክኸውን ኣለዎ። ዝሓሸ: ብሓድሽ ተቐያይር።¦Декор должен быть приятным и ухоженным. Лучше заменить на свежий.")},
     {a:T("🍎 In der Obstabteilung sind es 26 °C.¦🍎 Ở quầy trái cây nhiệt độ là 26 °C.¦🍎 Meyve reyonunda sıcaklık 26 °C.¦🍎 درجة الحرارة في قسم الفاكهة 26 °م.¦🍎 En la frutería hay 26 °C.¦🍎 Na secção de fruta estão 26 °C.¦🍎 ኣብ ክፍሊ ፍረ 26 °C እዩ።¦🍎 В отделе фруктов 26 °C."),bad:1,
      f:T("Obst braucht Kühle. Wärme lässt es schneller verderben.¦Trái cây cần mát. Nóng làm hỏng nhanh hơn.¦Meyve serinlik ister. Sıcaklık daha çabuk bozar.¦الفاكهة تحتاج إلى البرودة. الحرارة تُفسدها أسرع.¦La fruta necesita frescor. El calor la estropea antes.¦A fruta precisa de frescura. O calor estraga-a mais depressa.¦ፍረ ቀዝቐዝ ይደሊ። ሙቐት ቀልጢፉ የበላሽዎ።¦Фруктам нужна прохлада. От тепла они быстрее портятся.")},
     {a:T("🥖 Am Eingang der Bäckerei duftet es nach frischem Brot.¦🥖 Ở cửa tiệm bánh thơm mùi bánh mì tươi.¦🥖 Fırının girişi taze ekmek kokuyor.¦🥖 عند مدخل المخبز تفوح رائحة الخبز الطازج.¦🥖 En la entrada de la panadería huele a pan fresco.¦🥖 À entrada da padaria cheira a pão fresco.¦🥖 ኣብ ኣፍ ደገ ባኒ ቤት ጨና ሓዲሽ ባኒ ኣሎ።¦🥖 У входа в пекарню пахнет свежим хлебом."),bad:0},
     {a:T("🛋️ In der Mitte gibt es eine Sitzecke mit Café.¦🛋️ Ở giữa có góc ngồi với quán cà phê.¦🛋️ Ortada kafeli bir oturma köşesi var.¦🛋️ في الوسط ركن جلوس مع مقهى.¦🛋️ En el centro hay una zona de descanso con café.¦🛋️ Ao centro há um canto de descanso com café.¦🛋️ ኣብ ማእኸል ጥቓ መኣዲ ዝህልዎ መንበር ኣሎ።¦🛋️ В центре есть уголок отдыха с кафе."),bad:0},
     {a:T("⌚ Edle Uhren liegen auf Holz und Messing.¦⌚ Đồng hồ cao cấp được đặt trên gỗ và đồng thau.¦⌚ Zarif saatler ahşap ve pirinç üzerinde duruyor.¦⌚ ساعات فاخرة موضوعة على خشب ونحاس أصفر.¦⌚ Relojes elegantes sobre madera y latón.¦⌚ Relógios elegantes sobre madeira e latão.¦⌚ ክቡራት ሰዓታት ኣብ ዕንጨትን ብርንጅን ተቐሚጦም።¦⌚ Элегантные часы лежат на дереве и латуни."),bad:0},
     {a:T("👟 Im Sportgeschäft läuft Musik, die zur jungen Zielgruppe passt.¦👟 Trong cửa hàng thể thao phát nhạc hợp với khách trẻ.¦👟 Spor mağazasında genç hedef kitleye uygun müzik çalıyor.¦👟 في متجر الرياضة تُشغَّل موسيقى تناسب الفئة الشابة.¦👟 En la tienda de deporte suena música adecuada para el público joven.¦👟 Na loja de desporto toca música adequada ao público jovem.¦👟 ኣብ ድኳን ስፖርት ንመንእሰያት ዝተመቸ ሙዚቃ ይጻወት።¦👟 В спортивном магазине играет музыка, подходящая молодой аудитории."),bad:0}],
 merke:T("Musik, Duft, Temperatur und Deko müssen zur Ware und zur Zielgruppe passen.¦Nhạc, mùi, nhiệt độ và trang trí phải phù hợp với hàng hóa và nhóm khách hàng.¦Müzik, koku, sıcaklık ve dekor mala ve hedef kitleye uygun olmalı.¦يجب أن تناسب الموسيقى والرائحة والحرارة والديكور البضاعة والفئة المستهدفة.¦La música, el olor, la temperatura y la decoración deben encajar con el producto y el público.¦A música, o cheiro, a temperatura e a decoração devem combinar com o produto e o público.¦ሙዚቃ፣ ጨና፣ ዑቕበትን ምድንፋዕን ምስ ሸቐጥን ዓሚልን ክሰማምዑ ኣለዎም።¦Музыка, запах, температура и декор должны подходить товару и целевой группе."),
},
{t:"mc",ch:3,say:P,
 q:T("Welche Musik passt in ein Möbelhaus?¦Nhạc nào phù hợp với cửa hàng nội thất?¦Mobilya mağazasına hangi müzik uyar?¦أي موسيقى تناسب متجر أثاث؟¦¿Qué música encaja en una tienda de muebles?¦Que música combina com uma loja de móveis?¦ኣብ ድኳን መንበር ኣየናይ ሙዚቃ ይሰማማዕ?¦Какая музыка подходит мебельному магазину?"),
 o:[{a:T("Laute, schnelle Musik¦Nhạc to và nhanh¦Yüksek sesli, hızlı müzik¦موسيقى صاخبة وسريعة¦Música fuerte y rápida¦Música alta e rápida¦ዓው ዝበለ ቀልጢፍ ሙዚቃ¦Громкая быстрая музыка")},
    {a:T("Ruhige Musik – Kunden bleiben länger¦Nhạc êm dịu – khách ở lâu hơn¦Sakin müzik – müşteriler daha uzun kalır¦موسيقى هادئة – يبقى الزبائن أطول¦Música tranquila: los clientes se quedan más tiempo¦Música calma – os clientes ficam mais tempo¦ህዱእ ሙዚቃ – ዓሚላት ንነዊሕ ይጸንሑ¦Спокойная музыка — клиенты остаются дольше"),ok:1},
    {a:T("Gar keine Musik – das ist Pflicht¦Hoàn toàn không có nhạc – đó là bắt buộc¦Hiç müzik yok – zorunlu¦لا موسيقى إطلاقاً – هذا إلزامي¦Ninguna música: es obligatorio¦Nenhuma música – é obrigatório¦ሙዚቃ ጥራይ የለን – ግዴታ እዩ¦Никакой музыки — это обязательно")}],
 good:T("Richtig! Spur 3 gesichert: Fehler gefunden, Täter fast entlarvt!¦Đúng! Manh mối 3 đã có: tìm ra lỗi, sắp lộ hung thủ!¦Doğru! 3. iz tamam: Hatalar bulundu, fail neredeyse ortaya çıktı!¦صحيح! الدليل 3 محفوظ: وُجدت الأخطاء والفاعل شبه مكشوف!¦¡Correcto! Pista 3 asegurada: errores encontrados, ¡el culpable casi descubierto!¦Certo! Pista 3 garantida: erros encontrados, o culpado quase descoberto!¦ልክዕ! ምልክት 3 ተሓሊዩ: ጌጋታት ተረኺቦም፣ እቲ ገበርቲ ቀሪቡ ተጋሊጹ!¦Верно! Улика 3 найдена: ошибки обнаружены, виновник почти раскрыт!"),
},
/* ===== Kapitel 5: Alle fünf Sinne ===== */
{t:"story",ch:4,img:"s5",
 p:[T("Spur 4: Die Abteilung spricht fast nur das Auge an. Die Kunden brauchen mehr! Ein gutes Geschäft spricht alle fünf Sinne an.¦Manh mối 4: Gian hàng gần như chỉ tác động đến mắt. Khách cần nhiều hơn! Một cửa hàng tốt tác động đến cả năm giác quan.¦İz 4: Reyon neredeyse sadece göze hitap ediyor. Müşteriler daha fazlasını ister! İyi bir mağaza beş duyuya birden hitap eder.¦الدليل 4: القسم يخاطب العين فقط تقريباً. الزبائن يحتاجون أكثر! المتجر الجيد يخاطب كل الحواس الخمس.¦Pista 4: La sección casi solo habla a la vista. ¡Los clientes necesitan más! Una buena tienda llega a los cinco sentidos.¦Pista 4: A secção só fala quase à vista. Os clientes precisam de mais! Uma boa loja chega aos cinco sentidos.¦ምልክት 4: እቲ ክፍሊ ዳርጋ ንዓይኒ ጥራይ ይዛረብ። ዓሚላት ዝያዳ የድልዮም! ጽቡቕ ድኳን ንሓሙሽተ ስምዒታት የዘራርብ።¦Улика 4: Отдел обращается почти только к зрению. Клиентам нужно больше! Хороший магазин воздействует на все пять чувств.")],
 say:[P,T("„Ordne die Maßnahmen dem richtigen Sinn zu: Sehen, Hören, Riechen, Schmecken oder Fühlen.“¦„Hãy xếp các biện pháp vào đúng giác quan: Nhìn, Nghe, Ngửi, Nếm hoặc Chạm.“¦„Önlemleri doğru duyuyla eşleştir: Görme, İşitme, Koklama, Tatma veya Dokunma.“¦«صنّف الإجراءات حسب الحاسة الصحيحة: البصر أو السمع أو الشم أو التذوّق أو اللمس.»¦„Asigna cada medida al sentido correcto: vista, oído, olfato, gusto o tacto.“¦„Associa cada medida ao sentido certo: visão, audição, olfato, paladar ou tato.“¦„ነተግባራት ናብ ትክክለኛ ስምዒት ኣዛምዶም: ምርኣይ፣ ምስማዕ፣ ምጨናን፣ ምጥዓምን ምትንካፍን።“¦«Отнеси каждую меру к нужному чувству: зрение, слух, обоняние, вкус или осязание.»")],
 lk:T("Im Sommer grillen viele Menschen in Deutschland im Garten oder im Park. Typisch ist die Bratwurst. Die Grillsaison beginnt oft im Frühling.¦Mùa hè, nhiều người Đức nướng thịt ngoài vườn hoặc công viên. Món điển hình là xúc xích nướng (Bratwurst). Mùa nướng thường bắt đầu từ mùa xuân.¦Almanya'da yazın birçok kişi bahçede veya parkta mangal yapar. Tipik olan Bratwurst'tur. Mangal sezonu çoğunlukla ilkbaharda başlar.¦في الصيف يشوي كثير من الناس في ألمانيا في الحديقة أو المتنزّه. والمعروف هو النقانق المشوية (Bratwurst). غالباً يبدأ موسم الشواء في الربيع.¦En verano mucha gente en Alemania hace barbacoas en el jardín o en el parque. Lo típico es la Bratwurst. La temporada de barbacoas suele empezar en primavera.¦No verão muita gente na Alemanha faz grelhados no jardim ou no parque. Típica é a Bratwurst. A época dos grelhados começa muitas vezes na primavera.¦ኣብ ሓጋይ ብዙሓት ሰባት ኣብ ጀርመን ኣብ ጀርዲንን ፓርክን ስጋ የብስሉ። ልሙድ ብራትቩርስት እዩ። ወቅቲ ምብሳል ብዙሕ ግዜ ኣብ ጽድያ ይጅምር።¦Летом многие немцы жарят мясо в саду или в парке. Типична Bratwurst. Сезон барбекю часто начинается весной."),
},

     {a:T("🔊 Eine Soundbar wird vorgeführt.¦🔊 Trình diễn một loa thanh (soundbar).¦🔊 Bir soundbar tanıtılıyor.¦🔊 يتم عرض مكبّر صوت (ساوندبار).¦🔊 Se hace una demostración de una barra de sonido.¦🔊 É feita uma demonstração de uma barra de som.¦🔊 ሳውንድባር ይርአ ኣሎ።¦🔊 Демонстрация саундбара."),c:1},
     {a:T("🥐 Duft frischer Backwaren¦🥐 Mùi bánh nướng tươi¦🥐 Taze fırın ürünleri kokusu¦🥐 رائحة المخبوزات الطازجة¦🥐 Aroma de bollería fresca¦🥐 Cheiro de pastelaria fresca¦🥐 ጨና ሓድሽ ባኒ¦🥐 Аромат свежей выпечки"),c:2},
