lchen Vorteil bietet die Nutzung eines Warenwirtschaftssystems?", "o": ["Es gibt keine Inventurdifferenzen mehr.", "Die Umschlagshäufigkeit der Artikel erhöht sich.", "Es werden neue Artikel vorgeschlagen.", "Die Soll-Lagerbestände können direkt abgerufen werden.", "Es gibt keine Kassendifferenzen mehr."], "a": 3}, {"t": "mc", "id": "a4.2", "q": "4.2 Welche Angabe kann NICHT über das WWS abgerufen werden?", "o": ["die Höhe des Meldebestands", "der Bestellzeitpunkt", "die Risiken der Lagerhaltung", "die Höhe des Soll-Bestands", "die Höhe des Mindestbestands"], "a": 2}, {"t": "free", "id": "a4.3", "q": "4.3 Beschreibe, wofür das MDE-Gerät beim Wareneingang genutzt wird.", "model": "Die Menge der gelieferten Ware wird damit erfasst und an den Hauptrechner (WWS) übermittelt."}, {"t": "mc", "id": "a4.4", "q": "4.4 Ein neuer Lieferer schickt ein Angebot. Welche Arbeit ist im WWS zu erledigen?", "o": ["Die Kundendatei wird ergänzt.", "Die Liefererdatei wird ergänzt.", "Alle Angebote werden in der Auftragserfassung gespeichert.", "In der Wareneingangsdatei werden Artikelnummern eingetragen.", "In der Lagerdatei werden neue Bestände aufgenommen."], "a": 1}, {"t": "calc", "id": "a4.5", "q": "4.5 Alt (Modul 2): Täglicher Absatz 6 Stofftiere, Lieferzeit 4 Tage, Mindestbestand 8 Stück. Bei welcher Stückzahl muss nachbestellt werden?", "a": 32, "unit": "Stück", "steps": ["6 × 4 = 24", "24 + 8 = 32 Stück"], "traps": [[24, "Mindestbestand vergessen."]]}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Die Prüfziffer und das integrierte WWS", "intro": "Regel: Die 12 Ziffern abwechselnd mit 1 und 3 multiplizieren (erste Ziffer × 1), alles addieren.", "tip": "Prüfziffer = Betrag bis zum nächsten Zehner.", "items": [{"t": "calc", "id": "a5.1", "q": "5.1 Berechne die Prüfziffer der GTIN 400638133393_ .", "a": 1, "unit": "", "steps": ["4·1 + 0·3 + 0·1 + 6·3 + 3·1 + 8·3 + 1·1 + 3·3 + 3·1 + 3·3 + 9·1 + 3·3 = 89", "bis 90 fehlen 1 → Prüfziffer 1 (GTIN 4006381333931)"]}, {"t": "free", "id": "a5.2", "q": "5.2 Die Nordstadt-Kauf GmbH will ihr geschlossenes WWS zu einem integrierten WWS ausbauen. Nenne zwei Ziele und einen Nachteil.", "model": "Ziele: Kostenminimierung (weniger Papier, schnellere Bestellung per EDI) und Bestandsoptimierung (Lieferer sieht den Bedarf). Nachteil: hohe Kosten für Technik, Abhängigkeit vom Lieferer, Datenschutz/IT-Sicherheit."}]}]};
var TR={"title": ["Hệ thống quản lý hàng hóa I – hệ thống biết những gì", "", "", "", "", "", "نظام إدارة البضائع I – ماذا يعرف النظام", "Stok yönetim sistemi I – sistem neleri bilir"], "can.0": ["giải thích hệ thống quản lý hàng hóa (WWS) là gì, và WWS khép kín và WWS tích hợp là gì.", "", "", "", "", "", "شرح ما هو نظام إدارة البضائع (WWS) وما هو النظام المغلق والنظام المتكامل.", "stok yönetim sisteminin (WWS) ne olduğunu, kapalı ve entegre WWS'nin ne olduğunu açıklamak."], "can.1": ["phân biệt dữ liệu gốc về mặt hàng, dữ liệu gốc về nhà cung cấp và dữ liệu biến động.", "", "", "", "", "", "التمييز بين البيانات الأساسية للأصناف والبيانات الأساسية للموردين وبيانات الحركة.", "ürün ana verileri, tedarikçi ana verileri ve hareket verilerini ayırt etmek."], "can.2": ["nói được mã GTIN chứa những thông tin gì – và giá không có trong mã.", "", "", "", "", "", "أن أقول ما المعلومات الموجودة في رمز GTIN – وأن السعر غير موجود فيه.", "GTIN kodunda hangi bilgilerin olduğunu söylemek – ve fiyatın içinde olmadığını."], "can.3": ["mô tả quá trình quét mã (phương pháp PLU) theo đúng thứ tự.", "", "", "", "", "", "وصف خطوات المسح الضوئي (طريقة PLU) بالترتيب الصحيح.", "tarama sürecini (PLU yöntemi) doğru sırayla anlatmak."], "can.4": ["kể ưu điểm của WWS và nhận ra những lời hứa sai điển hình („không còn chênh lệch kiểm kê“).", "", "", "", "", "", "ذكر مزايا نظام إدارة البضائع والتعرف على الوعود الخاطئة النموذجية („لا فروق جرد بعد الآن“).", "bir WWS'nin avantajlarını söylemek ve tipik yanlış vaatleri tanımak („artık sayım farkı yok“)."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Mức tồn kho báo đặt hàng = lượng bán mỗi ngày × thời gian giao hàng (tính bằng ngày) + tồn kho tối thiểu", "", "", "", "", "", "مخزون إعادة الطلب = المبيعات اليومية × مدة التوريد (بالأيام) + الحد الأدنى للمخزون", "Sipariş noktası stoku = günlük satış × teslim süresi (gün) + minimum stok"], "a1.1.q": ["1.2 Điều gì xảy ra khi đạt mức tồn kho báo đặt hàng? (Mô-đun 2)", "", "", "", "", "", "1.2 ماذا يحدث عند الوصول إلى مخزون إعادة الطلب؟ (الوحدة 2)", "1.2 Sipariş noktası stokuna ulaşıldığında ne olur? (Modül 2)"], "a1.1.o0": ["Đặt hàng.", "", "", "", "", "", "يتم الطلب.", "Sipariş verilir."], "a1.1.o1": ["Chỉ hỏi giá.", "", "", "", "", "", "يتم الاستفسار فقط.", "Sadece fiyat sorulur."], "a1.1.o2": ["Không làm gì cả.", "", "", "", "", "", "لا يتم فعل شيء.", "Hiçbir şey yapılmaz."], "a1.2.q": ["1.3 Kể hai nguồn bên trong để xác định nhu cầu. (Mô-đun 1)", "", "", "", "", "", "1.3 اذكر مصدرين داخليين لتحديد الحاجة. (الوحدة 1)", "1.3 İhtiyaç belirleme için iki iç kaynak söyle. (Modül 1)"], "a1.3.q": ["1.4 Kể bốn bước giao tiếp với khách ở quầy thu ngân khi trả bằng tiền mặt. (Ngân hàng câu hỏi · LF 3)", "", "", "", "", "", "1.4 اذكر الخطوات الأربع لمخاطبة الزبون عند الصندوق عند الدفع نقداً. (بنك الأسئلة · LF 3)", "1.4 Nakit ödemede kasada müşteriyle konuşmanın dört adımını söyle. (Havuz · LF 3)"], "r1.h": ["Đọc thêm: Hệ thống quản lý hàng hóa (Sách giáo khoa tr. 20 và bảng thuật ngữ tr. 204)", "", "", "", "", "", "للقراءة: نظام إدارة البضائع (الكتاب ص 20 والمسرد ص 204)", "Okuma: Stok yönetim sistemi (Ders kitabı s. 20 ve sözlük s. 204)"], "r1.s": ["Câu ghi nhớ: Mã cho biết mặt hàng, máy tính cho biết giá.", "", "", "", "", "", "جملة للحفظ: الرمز يحدد الصنف، والحاسوب يحدد السعر.", "Akılda tutulacak cümle: Kod ürünü söyler, bilgisayar fiyatı söyler."], "r1.p0": ["Hệ thống quản lý hàng hóa ghi lại mọi biến động hàng hóa theo số lượng và giá trị, cho từng mặt hàng. Nhờ vậy doanh nghiệp luôn biết tồn kho theo sổ sách.", "", "", "", "", "", "يسجّل نظام إدارة البضائع كل حركات البضائع حسب الكمية والقيمة، لكل صنف على حدة. وهكذا تعرف الشركة المخزون المفترض في أي وقت.", "Stok yönetim sistemi tüm mal hareketlerini miktar ve değer olarak, her ürün için ayrı kaydeder. Böylece işletme olması gereken stoku her zaman bilir."], "r1.p1": ["Dữ liệu gốc mặt hàng và nhà cung cấp ít khi thay đổi. Dữ liệu biến động thay đổi liên tục.", "", "", "", "", "", "البيانات الأساسية للأصناف والموردين نادراً ما تتغير. بيانات الحركة تتغير باستمرار.", "Ürün ve tedarikçi ana verileri nadiren değişir. Hareket verileri sürekli değişir."], "r1.p2": ["Mã GTIN chứa mã quốc gia, mã nhà sản xuất, mã hàng và chữ số kiểm tra – nhưng không có giá.", "", "", "", "", "", "يحتوي رمز GTIN على رمز البلد ورقم المنتِج ورقم الصنف ورقم التحقق – لكن ليس السعر.", "GTIN ülke kodu, üretici numarası, ürün numarası ve kontrol hanesini içerir – ama fiyatı içermez."], "r1.qq": ["Khi quét mã, giá lấy từ đâu?", "", "", "", "", "", "من أين يأتي السعر عند المسح الضوئي؟", "Taramada fiyat nereden gelir?"], "r1.q.o0": ["từ dữ liệu gốc mặt hàng", "", "", "", "", "", "من البيانات الأساسية للأصناف", "ürün ana verilerinden"], "r1.q.o1": ["từ mã vạch", "", "", "", "", "", "من الرمز الشريطي", "barkoddan"], "r1.q.o2": ["từ nhà cung cấp", "", "", "", "", "", "من المورد", "tedarikçiden"], "a2.h": ["Máy tính tiền biết giá từ đâu?", "", "", "", "", "", "من أين يعرف الصندوق السعر؟", "Kasa fiyatı nereden bilir?"], "a2.i": ["Một khách hàng hỏi ở quầy thu ngân: „Giá có nằm trong mã vạch không?“", "", "", "", "", "", "تسأل زبونة عند الصندوق: „هل السعر موجود في الرمز الشريطي؟“", "Bir müşteri kasada soruyor: „Fiyat barkodun içinde mi?“"], "a2.t": ["Câu ghi nhớ: Mã cho biết mặt hàng, máy tính cho biết giá.", "", "", "", "", "", "جملة للحفظ: الرمز يحدد الصنف، والحاسوب يحدد السعر.", "Akılda tutulacak cümle: Kod ürünü söyler, bilgisayar fiyatı söyler."], "a2.1.q": ["Sắp xếp các bước theo đúng thứ tự.", "", "", "", "", "", "رتّب الخطوات بالترتيب الصحيح.", "Adımları doğru sıraya koy."], "a2.1.r0": ["Dữ liệu được tìm trong dữ liệu gốc mặt hàng.", "", "", "", "", "", "يتم البحث عن البيانات في البيانات الأساسية للأصناف.", "Veriler ürün ana verilerinde aranır."], "a2.1.r1": ["Hóa đơn thu ngân hiển thị mặt hàng đã bán.", "", "", "", "", "", "يُظهر إيصال الصندوق الصنف المبيع.", "Kasa fişi satılan ürünü gösterir."], "a2.1.r2": ["Mã GTIN được quét và giải mã.", "", "", "", "", "", "يُمسح رمز GTIN ضوئياً ويُفك ترميزه.", "GTIN taranır ve çözülür."], "a2.1.r3": ["Việc bán hàng được lưu trong WWS (xuất hàng, tồn kho giảm).", "", "", "", "", "", "يُحفظ البيع في نظام إدارة البضائع (خروج البضاعة، ينخفض المخزون).", "Satış WWS'de kaydedilir (mal çıkışı, stok düşer)."], "a2.1.r4": ["Tên hàng và giá được chuyển đến máy tính tiền.", "", "", "", "", "", "يُنقل اسم الصنف والسعر إلى الصندوق.", "Ürün adı ve fiyat kasaya aktarılır."], "a3.h": ["Phân loại dữ liệu gốc", "", "", "", "", "", "ترتيب البيانات الأساسية", "Ana verileri sıralamak"], "a3.i": ["Đánh dấu các dữ liệu: 1 = dữ liệu gốc mặt hàng, 2 = dữ liệu gốc nhà cung cấp, 3 = dữ liệu biến động.", "", "", "", "", "", "صنّف البيانات: 1 = البيانات الأساسية للأصناف، 2 = البيانات الأساسية للموردين، 3 = بيانات الحركة.", "Verileri işaretle: 1 = ürün ana verileri, 2 = tedarikçi ana verileri, 3 = hareket verileri."], "a3.t": ["Dữ liệu biến động thay đổi liên tục: hàng bán, hàng nhập.", "", "", "", "", "", "بيانات الحركة تتغير باستمرار: المبيعات، البضائع الواردة.", "Hareket verileri sürekli değişir: satışlar, mal girişleri."], "a3.1.q": ["Loại dữ liệu nào?", "", "", "", "", "", "أي نوع من البيانات؟", "Hangi veri türü?"], "a3.1.r0": ["địa chỉ nhà cung cấp", "", "", "", "", "", "عنوان المورد", "tedarikçinin adresi"], "a3.1.r1": ["tên mặt hàng", "", "", "", "", "", "اسم الصنف", "ürün adı"], "a3.1.r2": ["GTIN (mã vạch)", "", "", "", "", "", "GTIN (الرمز الشريطي)", "GTIN (barkod)"], "a3.1.r3": ["giá bán gộp (đã có thuế)", "", "", "", "", "", "سعر البيع الإجمالي", "brüt satış fiyatı"], "a3.1.r4": ["mã nhà cung cấp và tài khoản ngân hàng", "", "", "", "", "", "رقم المورد والحساب البنكي", "tedarikçi numarası ve banka bilgileri"], "a3.1.r5": ["hôm nay đã bán: 12 cái", "", "", "", "", "", "بيع اليوم: 12 قطعة", "bugün satılan: 12 adet"], "a3.1.r6": ["nhập hàng ngày 06.03.: 140 cái", "", "", "", "", "", "استلام البضائع في 06.03.: 140 قطعة", "06.03. mal girişi: 140 adet"], "a3.2.q": ["3.1 Thông tin nào KHÔNG được mã hóa trong mã GTIN?", "", "", "", "", "", "3.1 ما المعلومة غير المشفرة في رمز GTIN؟", "3.1 Bir GTIN kodunda hangi bilgi şifrelenmiş DEĞİLDİR?"], "a3.2.o0": ["nhà sản xuất", "", "", "", "", "", "المنتِج", "üretici"], "a3.2.o1": ["mã quốc gia", "", "", "", "", "", "رمز البلد", "ülke kodu"], "a3.2.o2": ["chữ số kiểm tra", "", "", "", "", "", "رقم التحقق", "kontrol hanesi"], "a3.2.o3": ["giá bán gộp (đã có thuế)", "", "", "", "", "", "سعر البيع الإجمالي", "brüt satış fiyatı"], "a3.2.o4": ["mã hàng", "", "", "", "", "", "رقم الصنف", "ürün numarası"], "a4.h": ["WWS theo dạng đề thi", "", "", "", "", "", "نظام إدارة البضائع بصيغة الامتحان", "Sınav formatında WWS"], "a4.i": ["Giải các bài tập. Bài cuối lấy từ Mô-đun 2.", "", "", "", "", "", "حل المهام. الأخيرة من الوحدة 2.", "Görevleri çöz. Sonuncusu Modül 2'den."], "a4.t": ["Một ưu điểm của hệ thống quản lý hàng hóa là …", "", "", "", "", "", "من مزايا نظام إدارة البضائع أنّ …", "Stok yönetim sisteminin bir avantajı şudur: …"], "a4.1.q": ["4.1 Sử dụng hệ thống quản lý hàng hóa mang lại ưu điểm gì?", "", "", "", "", "", "4.1 ما الميزة التي يقدمها استخدام نظام إدارة البضائع؟", "4.1 Bir stok yönetim sistemi kullanmanın avantajı nedir?"], "a4.1.o0": ["Không còn chênh lệch kiểm kê nữa.", "", "", "", "", "", "لا توجد فروق جرد بعد الآن.", "Artık sayım farkı yoktur."], "a4.1.o1": ["Vòng quay hàng hóa của các mặt hàng tăng lên.", "", "", "", "", "", "يزداد معدل دوران الأصناف.", "Ürünlerin devir hızı artar."], "a4.1.o2": ["Các mặt hàng mới được đề xuất.", "", "", "", "", "", "يتم اقتراح أصناف جديدة.", "Yeni ürünler önerilir."], "a4.1.o3": ["Có thể truy xuất trực tiếp tồn kho theo sổ sách.", "", "", "", "", "", "يمكن استدعاء المخزون المفترض مباشرة.", "Olması gereken stoklar doğrudan çağrılabilir."], "a4.1.o4": ["Không còn chênh lệch tiền quầy nữa.", "", "", "", "", "", "لا توجد فروق صندوق بع    return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>'+tlo(it.id+'.g');
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p,pi){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'+tlo(b.id+'.p'+pi)}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});

function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';

 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';

 document.getElementById('app').innerHTML=h;

function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');

 }

function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});

document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});

/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;

if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
