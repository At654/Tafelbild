<html lang="de">
<head>

<title>Modul 4 – Der Werbeplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#1c2733;--mut:#566574;--pri:#1f4e79;--pri2:#2f6fa8;--prib:#e6eff8;--ok:#176b40;--okb:#e0f4e8;--bad:#a8231b;--badb:#fdeaea;--part:#7a5200;--partb:#fff2cf;--hl:#fff176;--line:#cfd9e4;--vi:#5a4bb5;--vib:#f0edff;--acc:#d98a86;--fs:1}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
/* Top bar */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.top-in{max-width:860px;margin:0 auto}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e1e8f0;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri2),#3da56a);transition:width .4s}
.prog b{font-size:.85rem;white-space:nowrap}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--pri);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--pri);min-height:44px;min-width:48px;padding:0 12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
@media(max-width:480px){.seg button{padding:0 9px;font-size:.92rem}.ctrl{gap:6px}}
.gear{min-height:44px;min-width:48px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;margin-left:auto;font-size:1.1rem}
.menu{display:none;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fafcff;gap:8px;flex-wrap:wrap}
.menu.open{display:flex}
/* Head */
.hd{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:14px 16px}
.hd h1{margin:0 0 2px;font-size:1.45rem;color:var(--pri);line-height:1.25}
.hd .lf{color:var(--mut);font-size:.9rem}
.nd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:520px){.nd{grid-template-columns:1fr}}
.nd label{font-size:.85rem;font-weight:700;color:var(--mut);display:block}
input[type=text],input[type=date],select,textarea{width:100%;border:2px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-size:16px;min-height:48px}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:3px solid #9cc3ea;border-color:var(--pri2)}
.can{background:var(--prib);border-left:5px solid var(--pri);border-radius:10px;padding:10px 14px;margin-top:10px}
.can h3{margin:0 0 4px;font-size:1rem;color:var(--pri)}
.can label{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:4px 0;cursor:pointer}
.can input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--pri)}
/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:16px;padding:14px 16px;scroll-margin-top:130px}
.card h2{margin:0;font-size:1.15rem;color:var(--pri);line-height:1.3;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.chip{font-size:.72rem;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--prib);color:var(--pri);white-space:nowrap}
.chip.v{background:var(--vib);color:var(--vi)}
.chip.p{background:#eee;color:#444}
.ask{margin:8px 0 10px;font-weight:600}
.vi{display:block;color:var(--vi);font-size:.88em;font-weight:400;line-height:1.5;margin-top:1px}
.card.lvlv{border-color:#c9bff5;background:#fcfbff}
.item{margin:12px 0;padding-top:10px;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.q{font-weight:700;margin-bottom:6px}
.cell-g{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
@media(max-width:600px){.cell-g{grid-template-columns:1fr}}
.cell-g label{font-size:.78rem;font-weight:800;color:var(--mut);display:block}
.cell-g .given{min-height:48px;display:flex;align-items:center;padding:6px 12px;background:#eef2f6;border-radius:10px;font-weight:700}
.note{font-size:.88rem;color:var(--mut);font-style:italic}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:#fff;font-weight:800;cursor:pointer;margin:6px 8px 0 0}
.btn.sec{background:#fff;color:var(--pri)}
.btn[disabled]{opacity:.5}
.btn small{display:block;font-weight:400;font-size:.7em;opacity:.9;line-height:1.1}
.btn .vi{color:inherit;font-size:.72em;opacity:.9;margin:0}
/* MC */
.opt{display:flex;gap:10px;align-items:flex-start;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:#fff}
.opt input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--pri)}
.opt.sel{border-color:var(--pri2);background:var(--prib)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--bad);background:var(--badb)}
/* Reading */
.rdt{font-size:1.02rem;line-height:2.1;margin:6px 0}
.w{display:inline-block;padding:0 3px;margin:0 1px;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.w.mk{background:var(--hl)}
.w.ok{background:#a6e3bd}
.w.bad{background:#f5b5b0;text-decoration:line-through}
.w.miss{outline:2px dashed var(--ok);background:#fff}
.locked .w{cursor:default}
.wsp{background:var(--prib);border-radius:10px;padding:10px 14px;font-size:.95rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.tbl th{background:#e7bcb9;text-align:left;padding:8px;border:1px solid #fff}
.tbl td{padding:8px;border:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700}
.scroll{overflow-x:auto}
/* Tips */
details.tip{margin:6px 0 10px;border:2px solid #f0d37a;border-radius:12px;background:#fff9e3}
details.tip>summary{min-height:48px;display:flex;align-items:center;padding:0 12px;font-weight:800;cursor:pointer;color:#7a5a00;list-style:none}
details.tip>summary::-webkit-details-marker{display:none}
details.tip .tb{padding:0 12px 10px}
.tb p{margin:6px 0}
/* Feedback */
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:5px solid var(--line);background:#f3f5f8}
.fb.ok{background:var(--okb);border-color:var(--ok)}
.fb.bad{background:var(--badb);border-color:var(--bad)}
.fb.part{background:var(--partb);border-color:#d9a400}
.model{background:#f1f8f3;border:1px solid #bfe0cb;border-radius:10px;padding:8px 12px;margin-top:8px}
.rate{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rate button{min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-weight:700;cursor:pointer}
.rate button[aria-pressed=true]{border-color:var(--pri);background:var(--prib)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chips button{min-height:44px;border-radius:99px;border:2px solid var(--pri2);background:#fff;color:var(--pri);padding:0 14px;font-weight:700;cursor:pointer}
/* Results */
#results{display:none}
#results.on{display:block}
.score{font-size:2.4rem;font-weight:800;color:var(--pri);line-height:1.1}
.rrow{border-top:1px solid var(--line);padding:10px 0}
.badge{display:inline-block;min-width:28px;text-align:center;border-radius:99px;font-weight:800;padding:1px 8px;margin-right:6px}
.badge.ok{background:var(--okb);color:var(--ok)}
.badge.bad{background:var(--badb);color:var(--bad)}
.badge.part{background:var(--partb);color:var(--part)}
.badge.open{background:#eee;color:#555}
.ans{background:#f3f5f8;border-radius:8px;padding:6px 10px;margin:4px 0;white-space:pre-wrap}
.right{color:var(--ok);font-weight:700}
.wrong{color:var(--bad);font-weight:700}
.steps{background:#f6f9fc;border-left:4px solid var(--pri2);padding:6px 12px;margin:6px 0;border-radius:6px}
/* Toast + dialog */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:#1c2733;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:90;max-width:90vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#dlg .box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%}
.printonly{display:none}
@media print{
 .top,#toast,#dlg,.noprint,details.tip,.btn,.menu{display:none!important}
 body{background:#fff;font-size:11pt}
 .wrap{max-width:none;padding:0}
 #tasks,.hd .can{display:none!important}
 #results{display:block!important}
 .printonly{display:block!important}
 .card,.hd{border:0;padding:0;margin-top:8px}
 .rrow{break-inside:avoid}
 .vi{display:none}
}
</style>

 html:'<div class="can"><b>Werbeplan</b><ol style="margin:4px 0 0 18px;padding:0"><li>Welche Werbebotschaft soll vermittelt werden?</li><li>Welche Werbemittel und Werbeträger sind einzusetzen?</li><li>Welche Beträge können für die Werbung eingesetzt werden (Werbeetat, Werbebudget)?</li><li>Welche Streuzeit wird festgesetzt?</li><li>Welche Streukreise und Streugebiete sind auszuwählen?</li></ol></div><div class="can"><b>Merke:</b> Kurz gemerkt: Was – womit – wie viel – wann – für wen und wo.</div>'},

{id:'i_sz',type:'info',title:['Streuzeit, Streukreis und Streugebiet','Streuzeit, Streukreis và Streugebiet'],

 html:'<div class="scroll"><table class="tbl"><tr><th>Begriff</th><th>Antwort auf die Frage</th><th>Beispiel</th></tr><tr><td>Werbeetat</td><td>Wie viel Geld?</td><td>12.000 € für das Jahr, davon 2.000 € im Februar</td></tr><tr><td>Streuzeit</td><td>Wann und wie oft?</td><td>vier Anzeigen in den Kalenderwochen 5 bis 8</td></tr><tr><td>Streukreis</td><td>Wer wird umworben?</td><td>Frauen zwischen 25 und 45 Jahren mit mittlerer Kaufkraft</td></tr><tr><td>Streugebiet</td><td>Wo wird geworben?</td><td>Bremerhaven und der Landkreis Cuxhaven</td></tr></table></div>'+
 '<p>Durch die Streuzeit werden Beginn und Häufigkeit der Werbung sowie der zeitliche Einsatz von Werbemitteln und Werbeträgern festgelegt. Der Einzelhändler hat dabei drei Möglichkeiten: einmalig bzw. zeitlich begrenzt und intensiv werben, regelmäßig werben (pro Tag, pro Woche, pro Monat) oder in unregelmäßigen Abständen kurz, aber intensiv werben.</p>'+
 '<div class="can"><b>Merke:</b> Je länger und je häufiger geworben wird, desto schneller treten wirtschaftliche Werbewirkungen ein. Trotzdem kann ein kurzer, intensiver Werbeeinsatz sinnvoll sein – etwa bei einer Neueröffnung oder wenn ein Wettbewerber eine neue Abteilung eröffnet.</div>'+
 '<p>Der Streukreis beschreibt den Personenkreis, der umworben wird. Er wird häufig nach Zielgruppen untergliedert, zum Beispiel nach Berufs-, Alters- und Kaufkraftgruppen oder nach Geschlecht. Das Streugebiet (Werbeverbreitungsgebiet) ist das Gebiet, in dem die Werbemaßnahmen durchgeführt werden. Es muss festgelegt werden, weil Art und Umfang des Bedarfs von Gebiet zu Gebiet unterschiedlich sein können – Stadt und Land zum Beispiel haben andersartige Bedürfnisse.</p>'},

function clearSaved(){try{localStorage.removeItem(KEY);}catch(e){}}
function toast(h){var t=$('#toast');t.innerHTML=h;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on');},2600);}
/* Aufgabenliste */
function vis(){return D.blocks.filter(function(b){return b.lvl!=='v'||S.level==='v';});}
function tasks(){return vis().filter(function(b){return b.type!=='info';});}
/* Zustand je Aufgabe */
function A(id){return S.a[id]||(S.a[id]={});}
function done(b){
 var a=S.a[b.id]||{};
 switch(b.type){
 case 'free':return b.items.some(function(_,i){return (a[i]||'').trim();});
 case 'grid':return b.rows.some(function(r,ri){return r.ans.some(function(_,ci){return a[ri+'_'+ci];});});
 case 'mc':return a.v!==undefined;
 case 'calc':return b.items.some(function(_,i){return (a[i]||'').trim();});
 case 'cloze':return Object.keys(a).some(function(k){return (a[k]||'').trim();});
 case 'read':var r=S.rd[b.id]||{};return !!r.chk&&(b.quiz||[]).every(function(_,i){return r.q&&r.q[i]!==undefined;});
 }return false;
}
function progress(){
 var ts=tasks(),n=ts.filter(done).length,p=ts.length?Math.round(100*n/ts.length):0;
 $('#barfill').style.width=p+'%';$('#bartxt').textContent=n+' / '+ts.length+' '+UI.tasks[0];
 var m=[25,50,75,100],last=S._m||0;
 m.forEach(function(x){if(p>=x&&last<x){S._m=x;if(x>last&&n>0)toast(x===100?'🎉 100 % – Alles bearbeitet!':'👍 '+x+' % geschafft');}});
}
/* Bausteine */
function tipHTML(b){
 if(!b.tips)return '';var n=S.tip[b.id]||0;
 return '<details class="tip" data-id="'+b.id+'"'+(n>0?' open':'')+'><summary>💡 '+U('tip')+'</summary><div class="tb"><p>'+T(b.tips[0])+'</p>'+
 (n>=2?'<p>'+T(b.tips[1])+'</p>':(b.tips[1]?'<button class="btn sec" data-act="tip2" data-id="'+b.id+'">'+U('tip2')+'</button>':''))+'</div></details>';
}
function head(b,extra){
 var chips='';
 if(b.lvl==='v')chips+='<span class="chip v">'+UI.vtag[0]+' · +'+fmt(b.pts)+' '+UI.bonus[0]+'</span>';
 else if(b.profi)chips+='<span class="chip p">'+UI.ptag[0]+'</span>';
 else if(b.pts)chips+='<span class="chip">'+fmt(b.pts)+' '+UI.points[0]+'</span>';
 return '<h2>'+T(b.title)+chips+'</h2>'+(b.ask?'<div class="ask">'+T(b.ask)+'</div>':'')+(extra||'');
}
function rateHTML(key,qk){
 var r=S.rate[key];
 return '<div class="note">'+U('selfq')+'</div><div class="rate">'+['g','p','n'].map(function(k){
  return '<button data-act="rate" data-key="'+key+'" data-v="'+k+'" aria-pressed="'+(r===k)+'">'+({g:'✅ ',p:'🔶 ',n:'❌ '}[k])+U(k)+'</button>';}).join('')+'</div>';
}
function kwCheck(txt,kw){
 var t=norm(txt);return (kw||[]).map(function(g){var hit=g.some(function(w){return t.indexOf(norm(w))>=0;});return {w:g[0],hit:hit};});
}
function selOpts(opts,val){return '<option value="">–</option>'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join('');}
/* Renderer */
var R={};
R.info=function(b){
 return '<h2>'+T(b.title)+'</h2>'+(b.ask?'<div class="ask">'+T(b.ask)+'</div>':'')+(b.html||'')+(b.steps?b.steps.map(function(s,i){
  var o=(S.a[b.id]||{})['s'+i];
  return '<div class="item"><div class="q">'+T(s.q)+'</div>'+(o?'<div class="fb ok">'+T(s.a)+'</div>':'<button class="btn sec" data-act="step" data-id="'+b.id+'" data-i="'+i+'">'+T(s.btn||['Antwort zeigen','Xem đáp án'])+'</button>')+'</div>';}).join(''):'');
};
R.free=function(b){
 var a=A(b.id),h=head(b,tipHTML(b)+help(b));
 b.items.forEach(function(it,i){
  var k=b.id+'.'+i,rev=S.rev[k];
  h+='<div class="item">'+(it.q?'<div class="q">'+(b.items.length>1?(i+1)+'. ':'')+T(it.q)+'</div>':'')+
   '<textarea rows="'+(it.rows||3)+'" data-in="'+b.id+'" data-i="'+i+'" aria-label="Antwort">'+esc(a[i]||'')+'</textarea>'+
   (rev?'<div class="model"><b>'+U('model')+':</b><br>'+T(it.model)+'</div>'+kwBox(a[i],it)+rateHTML(k):
   '<button class="btn sec" data-act="rev" data-key="'+k+'" data-id="'+b.id+'">'+U('reveal')+'</button>')+'</div>';
 });
 return h;
};
function kwBox(txt,it){
 if(!it.kw)return '';var c=kwCheck(txt,it.kw);
 return '<div class="note">'+U('foundkw')+': '+c.map(function(x){return (x.hit?'✓ ':'○ ')+esc(x.w);}).join(' · ')+'</div>';
}
function help(b){
 if(!b.help)return '';
 return '<details class="tip" style="border-color:#bcd3ea;background:#f2f8fe"><summary style="color:var(--pri)">📝 '+T(['Wörter und Satzanfänge','Từ vựng và câu mở đầu'])+'</summary><div class="tb">'+
  '<div class="chips">'+b.help.map(function(w){return '<button data-act="chip" data-id="'+b.id+'" data-txt="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div></div></details>';
}
R.grid=function(b){
 var a=A(b.id),n=b.cols.length,h=head(b,tipHTML(b));
 b.rows.forEach(function(r,ri){
  h+='<div class="item"><div class="q">'+T(r.text)+'</div>'+(r.hint?'<div class="note">'+T(r.hint)+'</div>':'')+'<div class="cell-g" style="--n:'+n+'">';
  b.cols.forEach(function(c,ci){
   var g=r.given&&r.given[ci];
   h+='<div><label>'+esc(c.h)+'</label>'+(g?'<div class="given">'+esc(g)+'</div>':
    '<select data-sel="'+b.id+'" data-r="'+ri+'" data-c="'+ci+'" aria-label="'+esc(c.h)+'">'+selOpts(c.opts,a[ri+'_'+ci])+'</select>')+'</div>';
  });
  h+='</div></div>';
 });
 return h;
};
R.mc=function(b){
 var a=A(b.id);
 return head(b,tipHTML(b))+(b.q?'<div class="q">'+T(b.q)+'</div>':'')+b.opts.map(function(o,i){
  return '<label class="opt'+(a.v===i?' sel':'')+'"><input type="radio" name="'+b.id+'" data-mc="'+b.id+'" value="'+i+'"'+(a.v===i?' checked':'')+'><span>'+esc(o)+'</span></label>';}).join('');
};
R.calc=function(b){
 var a=A(b.id),h=head(b,tipHTML(b));
 b.items.forEach(function(it,i){
  h+='<div class="item"><div class="q">'+T(it.q)+'</div><div style="display:flex;gap:8px;align-items:center"><input type="text" inputmode="decimal" autocomplete="off" style="max-width:200px" data-calc="'+b.id+'" data-i="'+i+'" value="'+esc(a[i]||'')+'" aria-label="Ergebnis"><b>'+esc(it.unit||'')+'</b></div></div>';
 });
 return h;
};
R.cloze=function(b){
 var a=A(b.id),g=0;
 var txt=esc(b.text).replace(/\{\{(.+?)\}\}/g,function(m,x){var i=g++;return '<input type="text" class="gap" style="display:inline-block;width:'+Math.max(7,Math.min(16,x.split('|')[0].length+2))+'em;min-height:44px" autocomplete="off" autocapitalize="off" data-gap="'+b.id+'" data-i="'+i+'" value="'+esc(a[i]||'')+'" aria-label="Lücke '+(i+1)+'">';});
 return head(b,tipHTML(b))+(b.bank?'<div class="chips">'+b.bank.map(function(w){return '<span class="chip">'+esc(w)+'</span>';}).join('')+'</div>':'')+'<div style="line-height:2.4">'+txt.replace(/\n/g,'<br>')+'</div>';
};
R.read=function(b){
 var r=S.rd[b.id]||(S.rd[b.id]={marks:[],q:{}}),idx=0,keyN=0;
 var paras=b.paras.map(function(p){
  return '<p>'+p.split(/\s+/).map(function(tok){
   var i=idx++,isKey=tok.indexOf('[[')>=0,word=tok.replace(/\[\[|\]\]/g,'');
   if(isKey)keyN++;
   var c='w',m=r.marks.indexOf(i)>=0;
   if(r.chk){if(m&&isKey)c+=' ok';else if(m)c+=' bad';else if(isKey)c+=' miss';}else if(m)c+=' mk';
   return '<span class="'+c+'" data-act="mark" data-id="'+b.id+'" data-i="'+i+'">'+esc(word)+'</span>';
  }).join(' ')+'</p>';
 }).join('');
 var right=0,wrong=0;
 if(r.chk){var k=0;b.paras.forEach(function(p){p.split(/\s+/).forEach(function(tok){var i=k++;if(r.marks.indexOf(i)>=0){if(tok.indexOf('[[')>=0)right++;else wrong++;}});});}
 var h=head(b,tipHTML(b))+'<div class="rdt'+(r.chk?' locked':'')+'">'+paras+'</div>';
 if(!r.chk)h+='<button class="btn" data-act="markchk" data-id="'+b.id+'">'+U('mark')+'</button>';
 else h+='<div class="fb '+(right===keyN&&!wrong?'ok':'part')+'">'+T([right+' von '+keyN+' Schlüsselbegriffen gefunden, '+wrong+' falsch markiert.',right+' / '+keyN+' từ khóa tìm đúng, '+wrong+' từ đánh dấu sai.'])+
  '<br><span class="note">'+T(['Grün = richtig, rot = falsch, gestrichelt = vergessen.','Xanh = đúng, đỏ = sai, nét đứt = bị sót.'])+'</span></div><button class="btn sec" data-act="remark" data-id="'+b.id+'">'+U('remark')+'</button>';
 (b.quiz||[]).forEach(function(q,i){
  var c=r.q[i];
  h+='<div class="item"><div class="q">'+T(q.q)+'</div>'+q.opts.map(function(o,oi){
   var cls='opt'+(c===oi?' sel':'');if(c!==undefined){if(oi===q.ans)cls='opt ok';else if(c===oi)cls='opt bad';}
   return '<label class="'+cls+'"><input type="radio" name="'+b.id+'q'+i+'" data-rq="'+b.id+'" data-i="'+i+'" value="'+oi+'"'+(c===oi?' checked':'')+(c!==undefined?' disabled':'')+'><span>'+esc(o)+'</span></label>';}).join('')+
   (c!==undefined?'<div class="fb '+(c===q.ans?'ok':'bad')+'"><b>'+(c===q.ans?U('ok'):U('bad'))+'</b> '+T(q.why)+'</div>':'')+'</div>';
 });
 return h;
};
function renderBlock(b){
 var cls='card'+(b.lvl==='v'?' lvlv':'');
 return '<section class="'+cls+'" id="b_'+b.id+'">'+R[b.type](b)+'</section>';
}

function renderHead(){

 '<div class="nd"><div><label for="inName">'+U('name')+'</label><input type="text" id="inName" autocomplete="off" value="'+esc(S.name)+'"></div>'+

 (D.words?'<details class="tip" style="margin-top:10px;border-color:#bcd3ea;background:#f2f8fe"><summary style="color:var(--pri)">📖 '+U('words')+'</summary><div class="tb">'+D.words.map(function(w){return '<p>'+T(w)+'</p>';}).join('')+'</div></details>':'')+'</div>';

}
function renderFinal(){
 var mx=maxPts();
 $('#final').innerHTML='<div class="card noprint"><h2>'+T(['Auswertung','Chấm điểm'])+'</h2>'+
  '<div class="item"><div class="q">'+U('est')+' (0–'+mx+')</div><input type="text" inputmode="decimal" id="inEst" style="max-width:160px" value="'+esc(S.est)+'"></div>'+
  '<div id="todo" class="note"></div><button class="btn" data-act="submit">'+U('submit')+'</button></div>';
 updTodo();

function updTodo(){
 var el=$('#todo');if(!el)return;
 var o=tasks().filter(function(b){return !done(b);});
 el.innerHTML=o.length?U('todo')+' '+o.length+' '+UI.tasks[0]:'';
}
function maxPts(){return tasks().filter(function(b){return b.lvl!=='v';}).reduce(function(s,b){return s+(b.pts||0);},0);}
/* Auswertung */
function num(x){var v=parseFloat(String(x).replace(/[−–]/g,'-').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.').replace(/\s/g,''));return isNaN(v)?null:v;}
function ok1(a,k){return norm(a)===norm(k);}
function scoreOf(b){
 var a=S.a[b.id]||{},got=0,pts=b.pts||0,st='open',html='',ans='';
 var ST=function(f){return f>=0.999?'ok':(f>0?'part':'bad');};
 if(b.type==='free'){
  var sum=0,cnt=0;
  b.items.forEach(function(it,i){
   var rt=S.rate[b.id+'.'+i],t=(a[i]||'').trim();
   var f=rt==='g'?1:rt==='p'?.5:0;sum+=f;cnt++;
   html+='<div class="ans"><b>'+(b.items.length>1?(i+1)+'. ':'')+'</b>'+(t?esc(t):'<i>'+U('empty')+'</i>')+'</div><div class="model"><b>'+U('model')+':</b> '+T(it.model)+'</div><div class="note">'+(rt?{g:'✅ ',p:'🔶 ',n:'❌ '}[rt]+U(rt):'')+'</div>';
  });
  var f0=cnt?sum/cnt:0;got=pts*f0;st=(done(b)||sum>0)?ST(f0):'open';
  if(!pts&&st==='bad')st='bad';
 }else if(b.type==='grid'){
  var need=0,right=0,wr='';
  b.rows.forEach(function(r,ri){r.ans.forEach(function(k,ci){
   if(r.given&&r.given[ci])return;need++;var v=a[ri+'_'+ci]||'';
   if(v&&ok1(v,k))right++;
   else wr+='<div class="rrow"><div>'+T(r.text)+'</div><div class="note">'+esc(b.cols[ci].h)+'</div><span class="wrong">'+(v?esc(v):U('empty'))+'</span> → <span class="right">'+esc(k)+'</span>'+(r.why?'<div>'+T(r.why)+'</div>':'')+'</div>';
  });});
  var f1=need?right/need:0;got=pts*f1;st=done(b)?ST(f1):'open';
  html='<div>'+right+' / '+need+'</div>'+wr;
 }else if(b.type==='mc'){
  var c=a.v;got=c===b.ans?pts:0;st=c===undefined?'open':(c===b.ans?'ok':'bad');
  html='<div class="ans">'+(c===undefined?U('empty'):esc(b.opts[c]))+'</div>'+(c!==b.ans?'<div class="right">'+U('right')+': '+esc(b.opts[b.ans])+'</div>':'')+(b.why?'<div>'+T(b.why)+'</div>':'');
 }else if(b.type==='calc'){
  var rc=0;
  b.items.forEach(function(it,i){
   var v=num(a[i]),okc=v!==null&&Math.abs(v-it.ans)<=(it.tol||0.005);if(okc)rc++;
   html+='<div class="rrow"><div>'+T(it.q)+'</div><div class="ans">'+(a[i]?esc(a[i]):U('empty'))+' '+esc(it.unit||'')+'</div>'+(okc?'<span class="right">✓</span>':'<span class="right">'+U('right')+': '+String(it.ans).replace('.',',')+' '+esc(it.unit||'')+'</span>')+
    '<div class="steps"><b>'+U('steps')+':</b><br>'+it.steps.map(function(s){return T(s);}).join('<br>')+'</div></div>';
  });
  var f2=rc/b.items.length;got=pts*f2;st=done(b)?ST(f2):'open';
 }else if(b.type==='cloze'){
  var gi=0,rg=0,wl='';
  b.text.replace(/\{\{(.+?)\}\}/g,function(m,x){var i=gi++,vals=x.split('|'),v=a[i]||'';
   if(v&&vals.some(function(k){return ok1(v,k);}))rg++;else wl+='<div><span class="wrong">'+(v?esc(v):U('empty'))+'</span> → <span class="right">'+esc(vals[0])+'</span></div>';return m;});
  var f3=gi?rg/gi:0;got=pts*f3;st=done(b)?ST(f3):'open';html='<div>'+rg+' / '+gi+'</div>'+wl+(b.why?'<div>'+T(b.why)+'</div>':'');
 }else if(b.type==='read'){
  var r=S.rd[b.id]||{q:{}},q=b.quiz||[],rq=0;
  q.forEach(function(x,i){if(r.q&&r.q[i]===x.ans)rq++;});
  var f4=q.length?rq/q.length:(r.chk?1:0);got=0;st=done(b)?ST(f4):'open';
  html='<div>'+rq+' / '+q.length+'</div>';
  q.forEach(function(x,i){if(r.q&&r.q[i]!==undefined&&r.q[i]!==x.ans)html+='<div class="rrow">'+T(x.q)+'<div class="right">'+U('right')+': '+esc(x.opts[x.ans])+'</div><div>'+T(x.why)+'</div></div>';});
 }
 return {got:got,pts:pts,st:st,html:html};
}
function fmt(x){return (Math.round(x*10)/10).toString().replace('.',',');}
function renderResults(){
 var tot=0,max=0,bon=0,bmax=0,rows='';
 tasks().forEach(function(b){
  var s=scoreOf(b);
  if(b.lvl==='v'){bon+=s.got;bmax+=b.pts||0;}else{tot+=s.got;max+=b.pts||0;}
  var ic={ok:'✓',part:'~',bad:'✗',open:'–'}[s.st];
  rows+='<div class="rrow"><div><span class="badge '+s.st+'">'+ic+'</span><b>'+T(b.title)+'</b> <span class="chip'+(b.lvl==='v'?' v':'')+'">'+(b.pts?fmt(s.got)+' / '+b.pts:(b.lvl==='v'?'':'0 '+UI.points[0]))+'</span></div>'+s.html+'</div>';
 });
 var pct=max?tot/max:0;
 var msg=pct>=.8?['Sehr gut! Du kannst das Thema schon gut.','Rất tốt! Em đã nắm chắc chủ đề này.']:pct>=.5?['Gut. Schau dir die Fehler an und übe noch einmal.','Khá. Em hãy xem lại các lỗi và luyện thêm.']:['Das Thema braucht noch Übung. Lies die Lösungen und versuche es noch einmal.','Chủ đề này cần luyện thêm. Em hãy đọc đáp án và thử lại.'];
 var est=num(S.est),diff=est===null?'':'<div class="note">'+T(['Deine Schätzung: ','Ước lượng của em: '])+fmt(est)+' · '+T(['Differenz: ','Chênh lệch: '])+fmt(tot-est)+'</div>';
 var el=$('#results');
 el.innerHTML='<div class="printonly"><b>'+esc(D.lf)+' · '+esc(D.title[0])+'</b><br>Name: '+esc(S.name||'________')+' · Datum: '+esc(S.date||'________')+'</div>'+
  '<h2>'+T(['Dein Ergebnis','Kết quả của em'])+'</h2><div class="score">'+fmt(tot)+' / '+max+' <small style="font-size:.5em">'+UI.points[0]+'</small></div>'+
  (bmax?'<div class="chip v">+'+fmt(bon)+' / '+bmax+' '+UI.bonus[0]+'</div>':'')+diff+
  '<div class="fb '+(pct>=.8?'ok':pct>=.5?'part':'bad')+'">'+T(msg)+'</div>'+rows+
  '<div class="noprint"><button class="btn" data-act="pdf">'+U('pdf')+'</button><button class="btn sec" data-act="again">'+U('again')+'</button><button class="btn sec" data-act="next">'+U('next')+'</button><div class="note">'+U('pdfhint')+'</div></div>';
 el.classList.add('on');
}
/* Dialog */

 d.classList.add('on');
 $('#dYes').onclick=function(){d.classList.remove('on');onYes();};$('#dNo').onclick=function(){d.classList.remove('on');};

function resetAll(){
 S={name:'',date:today(),lang:S.lang,level:S.level,fs:S.fs,can:{},a:{},tip:{},rd:{},rev:{},rate:{},est:'',sub:false};
 clearSaved();$('#results').classList.remove('on');draw();window.scrollTo(0,0);
}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
/* Gesamtdarstellung */
function setBar(){
 document.querySelectorAll('#segLang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===S.lang);});
 document.querySelectorAll('#segLvl button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lvl===S.level);});
 $('#btnReset').innerHTML=U('reset');
 document.documentElement.style.setProperty('--fs',S.fs);
}
function draw(){
 setBar();renderHead();renderTasks();renderFinal();
 if(S.sub)renderResults();else $('#results').classList.remove('on');
 progress();
}
/* Ereignisse */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act],[data-lang],[data-lvl],[data-fs],#gear');if(!t)return;
 if(t.id==='gear'){$('#menu').classList.toggle('open');return;}
 if(t.dataset.lang){S.lang=t.dataset.lang;draw();save();return;}
 if(t.dataset.lvl){S.level=t.dataset.lvl;S.sub=false;draw();save();return;}
 if(t.dataset.fs){S.fs=Math.max(.9,Math.min(1.5,Math.round((S.fs+(+t.dataset.fs)*.15)*100)/100));setBar();save();return;}
 var id=t.dataset.id,act=t.dataset.act;
 if(act==='tip2'){S.tip[id]=2;refresh(id);return;}
 if(act==='rev'){S.rev[t.dataset.key]=1;refresh(id);return;}
 if(act==='rate'){S.rate[t.dataset.key]=t.dataset.v;refresh(t.dataset.key.split('.')[0]);return;}
 if(act==='step'){A(id)['s'+t.dataset.i]=1;refresh(id);return;}
 if(act==='chip'){var ta=lastTA[id]||document.querySelector('textarea[data-in="'+id+'"]');if(ta){var p=ta.selectionStart==null?ta.value.length:ta.selectionStart,v=ta.value;ta.value=v.slice(0,p)+(p&&!/\s$/.test(v.slice(0,p))?' ':'')+t.dataset.txt+' '+v.slice(p);ta.focus();A(id)[ta.dataset.i]=ta.value;progress();save();}return;}
 if(act==='mark'){var r=S.rd[id];if(r.chk)return;var i=+t.dataset.i,k=r.marks.indexOf(i);if(k>=0)r.marks.splice(k,1);else r.marks.push(i);t.classList.toggle('mk');save();return;}
 if(act==='markchk'){S.rd[id].chk=1;refresh(id);return;}
 if(act==='remark'){S.rd[id].chk=0;S.rd[id].marks=[];refresh(id);return;}
 if(act==='submit'){S.sub=true;renderResults();save();$('#results').scrollIntoView({behavior:'smooth'});return;}
 if(act==='again'){S.sub=false;$('#results').classList.remove('on');save();window.scrollTo(0,0);return;}
 if(act==='pdf'){renderResults();setTimeout(function(){window.print();},50);return;}
 if(act==='next'||t.id==='btnReset'){return;}
});
$('#btnReset').addEventListener('click',function(){dlg(UI.resetq,UI.resetw,resetAll);});
document.addEventListener('click',function(e){if(e.target.closest('[data-act=next]'))dlg(UI.resetq,UI.resetw,resetAll);});
var lastTA={};
document.addEventListener('focusin',function(e){if(e.target.dataset&&e.target.dataset.in)lastTA[e.target.dataset.in]=e.target;});
document.addEventListener('input',function(e){
 var t=e.target,d=t.dataset;
 if(t.id==='inName'){S.name=t.value;save();return;}
 if(t.id==='inEst'){S.est=t.value;save();return;}
 if(d.in){A(d.in)[d.i]=t.value;}else if(d.calc){A(d.calc)[d.i]=t.value;}else if(d.gap){A(d.gap)[d.i]=t.value;}else return;
 progress();updTodo();save();
});
document.addEventListener('change',function(e){
 var t=e.target,d=t.dataset;
 if(t.id==='inDate'){S.date=t.value;save();return;}
 if(d.can!==undefined){S.can[d.can]=t.checked;save();return;}
 if(d.sel){A(d.sel)[d.r+'_'+d.c]=t.value;}
 else if(d.mc){A(d.mc).v=+t.value;refresh(d.mc);updTodo();return;}
 else if(d.rq){var r=S.rd[d.rq];if(r.q[d.i]===undefined){r.q[d.i]=+t.value;refresh(d.rq);updTodo();}return;}
 else return;
 progress();updTodo();save();
});
document.addEventListener('toggle',function(e){
 var t=e.target;if(t.classList&&t.classList.contains('tip')&&t.dataset.id&&t.open&&!S.tip[t.dataset.id]){S.tip[t.dataset.id]=1;save();}
},true);
document.addEventListener('visibilitychange',function(){if(document.hidden)saveNow();});
window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.querySelectorAll('textarea').forEach(function(t){t.style.height=t.scrollHeight+'px';});});
/* Start */
var had=load();
if(!S.date)S.date=today();
D.blocks.forEach(function(b){if(b.type==='read'&&!S.rd[b.id])S.rd[b.id]={marks:[],q:{}};});
document.title=D.title[0]+' – '+D.lf;
draw();
if(had&&(Object.keys(S.a).length||S.name))toast(U('resume'));
window.__LF5={S:S,D:D,scoreOf:scoreOf,tasks:tasks,done:done};
})();
