<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Activity</title>
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#1f4e9c;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --t0:#c62828;--t1:#1565c0;--t2:#2e7d32;--t3:#b07800;
  --mD:#00796b;--mP:#c2410c;--mE:#6a3fb0;
  --display:"Arial Rounded MT Bold","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#7fa8ff;--brand-ink:#0d1a33;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --t0:#ff7a73;--t1:#7fb0ff;--t2:#7fd18b;--t3:#f2c14e;--mD:#4fd1c0;--mP:#ff9a6c;--mE:#c3a6ff;color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(17px*var(--zoom,1));line-height:1.4}
h1,h2,h3{font-family:var(--display);margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em;touch-action:manipulation}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:5px}
.dot.on{background:var(--ok)}
.mD{--mc:var(--mD)}.mP{--mc:var(--mP)}.mE{--mc:var(--mE)}
.ico svg{width:1em;height:1em;vertical-align:-.12em}
/* Tafel */
#tafel header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{margin:0;font-size:1.5rem}
#tafel header .sp{flex:1}
#tafel header button{padding:.35em .8em;font-size:.95rem}
#tMain{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,26%);gap:20px;padding:18px 20px 40px;max-width:1700px;margin:0 auto}
.stage{min-width:0}
#tMain.solo{grid-template-columns:1fr}
.teams{display:grid;gap:10px;align-content:start}
.tm{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:3px solid var(--tc)}
.tm .sw{width:20px;height:20px;border-radius:50%;background:var(--tc);flex:none}
.tm b{font-family:var(--display);font-size:1.25rem}
.tm .mem{color:var(--muted);font-size:.9rem}
.tm .ps{margin-left:auto;font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:var(--tc)}
.tm.pop{animation:pop .7s}
@keyframes pop{30%{transform:scale(1.07);background:color-mix(in srgb,var(--tc) 22%,var(--surface))}}
.tm button{padding:.3em .6em;font-size:.9rem}
.modeban{display:flex;align-items:center;gap:16px;border-radius:20px;padding:14px 22px;background:var(--mc);color:#fff}
.modeban .ico{font-size:4.2rem}
.modeban .mn{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.5vw,3.6rem);line-height:1}
.modeban .mp{margin-left:auto;font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.8rem);background:#fff;color:var(--mc);border-radius:999px;padding:.1em .6em;font-weight:800;white-space:nowrap}
.bigclock{font-family:var(--display);font-weight:800;font-size:clamp(6rem,17vw,15rem);text-align:center;line-height:1;margin:.1em 0;font-variant-numeric:tabular-nums}
.bigclock.low{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.bar{height:16px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mc,var(--brand));transition:width .25s linear}
.msg{font-size:clamp(1.3rem,2.4vw,2rem);text-align:center;margin:14px 0}
.bigbtn{display:block;width:100%;padding:22px;font-size:1.5rem;font-weight:800;border-radius:18px;margin-top:12px}
.buzz{border-radius:18px;border:5px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--surface));padding:16px;text-align:center;margin-top:12px}
.buzz .w{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.4vw,2.8rem);color:var(--tc)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.3rem;font-weight:800;border-width:3px}
.yn .y{background:color-mix(in srgb,var(--ok) 20%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:var(--bad)}
.reveal{border-radius:20px;border:5px solid var(--mc,var(--brand));background:var(--surface);text-align:center;padding:22px;margin-top:12px}
.reveal .w{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,6vw,5rem);line-height:1.05}
.reveal .de{font-size:clamp(1.3rem,2.6vw,2rem);color:var(--muted);margin-top:6px}
.join{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.jt{border:4px solid var(--tc);border-radius:16px;background:var(--surface);padding:12px;text-align:center}
.jt h3{color:var(--tc);font-size:1.5rem}
.jt canvas{width:100%;max-width:240px;aspect-ratio:1;background:#fff;border-radius:10px}
.jt .names{font-size:.9rem;color:var(--muted);margin-top:6px;min-height:2.6em}
.setrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.setrow>b{min-width:7.5em}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{padding:.35em .9em}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tops{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.tops label{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.tops input{width:auto}
.chips span{display:inline-block;margin:3px;padding:.2em .7em;border-radius:99px;font-weight:700;color:#fff;background:var(--mc)}
.podium{display:grid;gap:10px;margin-top:10px}
.podium .tm{font-size:1.4rem}
#qrov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:18px}
/* Karte / Handy */
#card,#phone{max-width:640px;margin:0 auto;padding:12px 14px 40px;min-height:100vh}
.topscore{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.topscore span{flex:1;min-width:60px;text-align:center;border-radius:10px;border:2px solid var(--tc);padding:3px 4px;font-weight:700;background:var(--surface)}
.topscore span b{font-family:var(--display);font-size:1.3rem;color:var(--tc)}
.cmode{border-radius:20px;background:var(--mc);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.cmode .ico{font-size:2.8rem}
.cmode .mn{font-family:var(--display);font-weight:800;font-size:1.9rem}
.cmode .mp{margin-left:auto;background:#fff;color:var(--mc);border-radius:99px;padding:.1em .7em;font-weight:800;font-family:var(--display);font-size:1.4rem}
.word{border-radius:22px;border:5px solid var(--mc);background:var(--surface);text-align:center;padding:26px 14px;margin:12px 0}
.word .en{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,9vw,4.2rem);line-height:1.05;word-break:break-word}
.word .de{font-size:1.4rem;color:var(--muted);margin-top:8px}
.word .rule{margin-top:10px;font-size:1.05rem}
.cclock{font-family:var(--display);font-weight:800;font-size:3.4rem;text-align:center;font-variant-numeric:tabular-nums}
.cclock.low{color:var(--bad)}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tbtns button{border:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--surface));font-weight:800;padding:16px 8px;font-size:1.1rem}
.status{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface2);text-align:center;font-size:1.15rem}
.hint{font-size:1rem;color:var(--muted);margin-top:8px;text-align:center}
.myteam{display:inline-block;padding:3px 14px;border-radius:999px;color:#fff;background:var(--tc);font-weight:700;font-size:1.1rem}
.buzzbtn{display:block;width:100%;padding:44px 10px;font-size:2rem;font-weight:800;border-radius:26px;border:6px solid var(--tc);background:color-mix(in srgb,var(--tc) 18%,var(--surface));font-family:var(--display);margin-top:14px}
.buzzbtn:active{transform:scale(.98)}
.teamsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.teamsel button{border:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));font-weight:800;padding:16px 6px;font-size:1.1rem}
.teamsel button.on{background:var(--tc);color:#fff}
#help{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px 16px 40px}
#help>*{max-width:760px;margin-left:auto;margin-right:auto}
.hw{background:var(--surface);border-left:6px solid var(--brand);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:1.1rem}
@media (max-width:1000px){#tMain{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="tafel" hidden>
  <header>
    <h1>🎯 English Activity</h1>
    <span id="hInfo" class="muted"></span>
    <span class="sp"></span>
    <button id="bQR">QR-Codes</button>
    <button id="bMinus" title="Kleiner">A−</button><button id="bPlus" title="Größer">A+</button>
    <button id="bRules">Regeln</button>
    <button id="bNew">Neues Spiel</button>
  </header>
  <div id="tMain"></div>
</div>
<div id="card" hidden></div>
<div id="phone" hidden></div>
<div id="help" hidden></div>
<div id="qrov" hidden></div>

      case "join":{const id=clean(m.id,16);if(!id)break;const t=Math.max(0,Math.min(T.nT-1,m.t|0));
        T.pl[id]={n:clean(m.n,16)||"Spieler",t};push();break;}
      case "hello":if(m.r==="card"){T.cardSeen=Date.now();save();}pubState();pubCard();render();break;
      case "buzz":onBuzz(clean(m.id,16));break;
      case "next":if(["idle","result"].includes(T.ph)||(T.ph==="lobby"))newRound();break;
      case "start":start();break;
      case "skip":if(T.ph==="ready"){pickWord();push();}break;
      case "award":award(m.t|0);break;
      case "judge":judge(!!m.ok);break;
      case "none":none();break;
      case "end":endGame();break;
    }}
  function onMsg(t,p){if(t===T.code+"/in"&&p&&typeof p==="object")cmd(p);}

  /* ---------- Anzeige ---------- */
  function head(){
    $("hInfo").innerHTML=`Code <b>${T.code}</b> · ${Object.keys(T.pl).length} Spieler/innen · <span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"} · iPad: <span class="dot ${T.cardSeen?"on":""}"></span>${T.cardSeen?"gekoppelt":"nicht gekoppelt"}`;}
  function teamsHtml(){
    let s="";for(let i=0;i<T.nT;i++){
      s+=`<div class="tm ${pop===i?"pop":""}" style="--tc:${tcol(i)}"><span class="sw"></span><div><b>Team ${TN[i]}</b><div class="mem">${members(i).length} dabei</div></div>
      <span class="ps">${T.sc[i]}</span>${["run","buzz"].includes(T.ph)?`<button data-a="award" data-v="${i}" title="Punkte direkt vergeben">+${MODES[T.mode].pts}</button>`:""}</div>`;}
    pop=-1;return `<div class="teams">${s}${T.goal?`<div class="muted" style="text-align:center">Ziel: ${T.goal} Punkte</div>`:""}</div>`;}
  function qrBlocks(){
    let s=`<div class="join">`;for(let i=0;i<T.nT;i++){s+=`<div class="jt" style="--tc:${tcol(i)}"><h3>Team ${TN[i]}</h3><canvas width="280" height="280" data-qr="&t=${i}"></canvas>
      <div class="names">${members(i).map(p=>h(p.n)).join(", ")||"noch niemand"}</div></div>`;}
    s+=`<div class="jt" style="--tc:var(--ink)"><h3>iPad (Lehrkraft)</h3><canvas width="280" height="280" data-qr="&k=1"></canvas>
      <div class="names">Begriff und Steuerung · ${T.cardSeen?"gekoppelt ✓":"noch nicht gekoppelt"}</div></div></div>`;return s;}
  function lobby(){
    const segs=(label,key,vals,fmt2)=>`<div class="setrow"><b>${label}</b><span class="seg">${vals.map(v=>`<button data-a="set" data-key="${key}" data-v="${v}" class="${T[key]===v?"on":""}">${fmt2(v)}</button>`).join("")}</span></div>`;
    const needUrl=!location.protocol.startsWith("http")&&!LOCAL;
    return `<div class="box"><h2>1 · Teams bilden – jede/r scannt den QR-Code seines Teams</h2>${needUrl?`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/Englisch_Activity.html"></label>`:""}${qrBlocks()}
      <p class="muted">Das iPad scannt den Code ganz rechts. Auf dem iPad stehen der englische Begriff und die Steuerung.</p></div>
      <div class="box" style="margin-top:14px"><h2>2 · Einstellungen</h2>
      ${segs("Teams","nT",[2,3,4],v=>v)}${segs("Zeit pro Runde","sec",[45,60,90],v=>v+" s")}${segs("Spielende","goal",[0,10,15,20],v=>v?v+" Punkte":"offen")}
      <div class="setrow"><b>Themen</b></div><div class="tops">${Object.keys(TOPICS).map(k=>`<label><input type="checkbox" data-a="topic" data-v="${k}" ${T.topics.includes(k)?"checked":""}> ${TOPICS[k]}</label>`).join("")}</div></div>
      <button class="pri bigbtn" data-a="next">Spiel starten ▶</button>`;}
  function stageHtml(){
    const M=T.mode?MODES[T.mode]:null;
    switch(T.ph){
      case "lobby":return lobby();
      case "idle":return `<button class="pri bigbtn" data-a="next">Nächste Runde ▶</button>`;
      case "ready":return `${modeBan(T.mode,"modeban")}<div class="bigclock">${fmt(T.rem)}</div>
        <div class="msg">Eine Person kommt nach vorne. <b>Der Begriff steht auf dem iPad.</b></div>
        <div class="muted" style="text-align:center">${M.rule}</div>
        <button class="pri bigbtn" data-a="start">Zeit starten ▶</button>
        <div class="row" style="margin-top:8px"><button data-a="skip">Anderer Begriff</button></div>`;
      case "run":case "buzz":{
        const b=T.buzz;
        return `<div class="${M.cls}">${modeBan(T.mode,"modeban")}<div class="bigclock" id="clk">${fmt(remNow())}</div><div class="bar"><i id="bari" style="width:${Math.round(remNow()/(T.sec*10))}%"></i></div></div>
        ${b?`<div class="buzz" style="--tc:${tcol(b.t)}"><div class="w">🙋 ${h(b.n)} · Team ${TN[b.t]}</div><div>antwortet gerade …</div></div>
          <div class="yn"><button class="y" data-a="judge" data-v="1">✓ Richtig (+${M.pts})</button><button class="n" data-a="judge" data-v="0">✗ Falsch</button></div>`
          :`<div class="msg">Alle dürfen raten – Handy: <b>„Ich weiß es!“</b></div>`}
        <div class="row" style="margin-top:10px"><button data-a="none">Niemand hat es erraten</button></div>`;}
      case "result":{const r=T.res;
        return `<div class="${MODES[r.mode].cls}">${modeBan(r.mode,"modeban")}</div>
        <div class="reveal ${MODES[r.mode].cls}"><div class="muted">Der Begriff war</div><div class="w">${h(r.w)}</div><div class="de">${h(r.de)}</div></div>
        ${r.t>=0?`<div class="buzz" style="--tc:${tcol(r.t)}"><div class="w">Team ${TN[r.t]} +${r.p}</div><div>${r.n?h(r.n)+" hat es erraten":"Punkte vergeben"}</div></div>`:`<div class="status" style="text-align:center;margin-top:12px">Keine Punkte in dieser Runde.</div>`}
        <button class="pri bigbtn" data-a="next">Nächste Runde ▶</button>`;}
      case "end":{const order=[...Array(T.nT).keys()].sort((a,b)=>T.sc[b]-T.sc[a]);
        return `<h2 style="font-size:2.4rem">🏆 Team ${TN[T.win]} gewinnt!</h2><div class="podium">${order.map((t,i)=>`<div class="tm" style="--tc:${tcol(t)}"><b>${i+1}. Team ${TN[t]}</b><span class="ps">${T.sc[t]}</span></div>`).join("")}</div>
        <button class="pri bigbtn" data-a="reset">Neues Spiel</button>`;}
    }return "";}
  function render(){
    head();
    $("tMain").className=(T.ph==="lobby"||T.ph==="end")?"solo":"";
    $("tMain").innerHTML=`<div class="stage">${stageHtml()}</div>${T.ph==="lobby"||T.ph==="end"?"":teamsHtml()}`;
    document.querySelectorAll("#tMain canvas[data-qr]").forEach(c=>drawQR(c,joinUrl(c.dataset.qr)));
    const u=$("tUrl");if(u)u.oninput=()=>{T.url=u.value;save();document.querySelectorAll("#tMain canvas[data-qr]").forEach(c=>drawQR(c,joinUrl(c.dataset.qr)));};
    if($("qrov")&&!$("qrov").hidden)qrOverlay();}
  function qrOverlay(){const o=$("qrov");o.hidden=false;o.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Mitspielen: QR-Code scannen</h2><button class="pri" id="qClose">Schließen</button></div>${qrBlocks()}`;
    o.querySelectorAll("canvas[data-qr]").forEach(c=>drawQR(c,joinUrl(c.dataset.qr)));$("qClose").onclick=()=>{o.hidden=true;};}

  document.body.addEventListener("click",e=>{
    const b=e.target.closest("#tafel [data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
    if(a==="set"){T[b.dataset.key]=+v;push();}
    else if(a==="topic"){const s=new Set(T.topics);b.checked?s.add(v):s.delete(v);if(!s.size)s.add(v);T.topics=[...s];push();}
    else if(a==="next")cmd({k:"next"});
    else if(a==="start")start();
    else if(a==="skip")cmd({k:"skip"});
    else if(a==="judge")judge(v==="1");
    else if(a==="award")award(+v);
    else if(a==="none")none();
    else if(a==="reset")reset();
    try{beep(1,.001);}catch(x){}
  });
  $("bQR").onclick=qrOverlay;$("bRules").onclick=openRegeln;
  $("bNew").onclick=()=>{if(confirm("Punkte zurücksetzen und neues Spiel beginnen? (Spielerliste bleibt)"))reset();};
  const zm=d=>{T.zoom=Math.max(.7,Math.min(1.8,+(T.zoom+d).toFixed(2)));document.documentElement.style.setProperty("--zoom",T.zoom);save();};
  $("bMinus").onclick=()=>zm(-.1);$("bPlus").onclick=()=>zm(.1);

  /* Takt: Timer */
  setInterval(()=>{
    if(T.ph!=="run")return;
    const r=T.tEnd-Date.now();
    const c=$("clk");if(c){c.textContent=fmt(r);c.classList.toggle("low",r<=10000);}
    const bi=$("bari");if(bi)bi.style.width=Math.max(0,Math.round(r/(T.sec*10)))+"%";
    const s=Math.ceil(r/1000);if(s<=5&&s>0&&s!==lastBeep){lastBeep=s;beep(880,.12);}
    if(r<=0)timeUp();
  },200);
  setInterval(()=>{if(conn.up){pubState();pubCard();}},15000);
  if(T.ph==="run"&&T.tEnd<Date.now()){const w=word()||["?",""];T.ph="result";T.res={w:w[0],de:w[1],t:-1,n:"",p:0,mode:T.mode||"d"};}
  render();
}
/* =========================================================
   iPad / Karte (Lehrkraft + Schüler/in vorne)
   ========================================================= */
function cardApp(code){
  $("card").hidden=false;
  let C=null,S=null,recv=0,shown=false,lastRound=-1,conn={up:0};
  const net=new Net(onMsg,c=>{conn=c;if(c.up)hello();paint();});
  net.sub(code+"/st");net.sub(code+"/card");
  const send=o=>net.pub(code+"/in",o);
  function hello(){send({k:"hello",r:"card"});}
  setInterval(()=>{if(conn.up)hello();},20000);
  function onMsg(t,p){
    if(t===code+"/card"){C=p;recv=Date.now();if(p.round!==lastRound){lastRound=p.round;shown=false;}paint();}
    else if(t===code+"/st"){S=p;}
  }
  const remNow=()=>{if(!C)return 0;return C.ph==="run"?Math.max(0,C.rem-(Date.now()-recv)):C.rem;};
  function scores(){if(!C)return "";return `<div class="topscore">${C.sc.map((s,i)=>`<span style="--tc:var(--t${i})">Team ${TN[i]}<br><b>${s}</b></span>`).join("")}</div>`;}
  function paint(){
    const el=$("card");
    if(!C){el.innerHTML=`<div class="status">${conn.up?"Verbunden. Warte auf das Smartboard …":"Verbinde …"}<br><span class="muted">Code ${h(code)}</span></div>`;return;}
    const ph=C.ph,M=C.mode?MODES[C.mode]:null;let s=scores();
    if(ph==="lobby"||ph==="idle"||!M){
      s+=`<div class="status">✓ iPad ist gekoppelt.<br>Das Spiel startet am Smartboard.</div><button class="pri bigbtn" data-c="next">Erste Runde ▶</button>`;
    }else if(ph==="ready"){
      s+=`<div class="${M.cls}"><div class="cmode"><span class="ico">${ICON[C.mode]}</span><div><div class="mn">${M.n}</div><div>${M.en}</div></div><span class="mp">${M.pts} P.</span></div></div>`;
      if(!shown)s+=`<div class="status">Schüler/in nach vorne holen. Dann den Begriff zeigen.</div><button class="pri bigbtn" data-c="show">👁 Begriff anzeigen</button><button class="bigbtn" data-c="skip">Anderer Begriff</button>`;
      else s+=`<div class="${M.cls}"><div class="word"><div class="en">${h(C.en)}</div><div class="de">${h(C.de)}</div><div class="rule">${M.rule}</div></div></div>
        <button class="pri bigbtn" data-c="start">Start ▶ (Zeit läuft)</button><button class="bigbtn" data-c="skip">Anderer Begriff</button>`;
    }else if(ph==="run"||ph==="buzz"){
      const b=C.buzz;
      s+=`<div class="${M.cls}"><div class="cmode"><span class="ico">${ICON[C.mode]}</span><div class="mn">${M.n}</div><span class="mp">${M.pts} P.</span></div>
        <div class="word"><div class="en">${h(C.en)}</div><div class="de">${h(C.de)}</div></div></div><div class="cclock" id="cclk">${fmt(remNow())}</div>`;
      if(b)s+=`<div class="buzz" style="--tc:var(--t${b.t});border-radius:18px;border:5px solid var(--tc);padding:12px;text-align:center"><b>🙋 ${h(b.n)} · Team ${TN[b.t]}</b></div>
        <div class="yn"><button class="y" data-c="judge" data-v="1">✓ Richtig</button><button class="n" data-c="judge" data-v="0">✗ Falsch</button></div>`;
      else s+=`<div class="hint">Tippt ein Team auf „Ich weiß es!“, erscheint hier der Name. Oder gleich Team wählen:</div>
        <div class="tbtns">${C.sc.map((_,i)=>`<button data-c="award" data-v="${i}" style="--tc:var(--t${i})">✓ Team ${TN[i]}</button>`).join("")}</div>
        <button class="bigbtn" data-c="none">Niemand hat es erraten</button>`;
    }else if(ph==="result"){
      const r=C.res||{};
      s+=`<div class="${r.mode?MODES[r.mode].cls:""}"><div class="word"><div class="muted">Der Begriff war</div><div class="en">${h(r.w||C.en)}</div><div class="de">${h(r.de||C.de)}</div></div></div>
        <div class="status">${r.t>=0?`Team ${TN[r.t]} +${r.p} Punkte${r.n?" ("+h(r.n)+")":""}`:"Keine Punkte"}</div><button class="pri bigbtn" data-c="next">Nächste Runde ▶</button>`;
    }else if(ph==="end"){
      s+=`<div class="status">🏆 Spiel zu Ende. Auswertung am Smartboard.</div>`;
    }
    s+=`<div class="hint"><span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"} · Code ${h(code)}</div>`;
    el.innerHTML=s;
  }
  document.body.addEventListener("click",e=>{
    const b=e.target.closest("#card [data-c]");if(!b)return;const a=b.dataset.c,v=b.dataset.v;
    if(a==="show"){shown=true;paint();}
    else if(a==="next"){shown=false;send({k:"next"});}
    else if(a==="start")send({k:"start"});
    else if(a==="skip"){shown=false;send({k:"skip"});}
    else if(a==="judge")send({k:"judge",ok:v==="1"});
    else if(a==="award")send({k:"award",t:+v});
    else if(a==="none")send({k:"none"});
  });
  setInterval(()=>{if(C&&C.ph==="run"){const c=$("cclk");if(c){const r=remNow();c.textContent=fmt(r);c.classList.toggle("low",r<=10000);}}},250);
  paint();
}

/* =========================================================
   Handy (Schüler/innen)
   ========================================================= */
function phoneApp(code){
  $("phone").hidden=false;
  let S=null,recv=0,conn={up:0};
  const pid=params.get("pid")||store("ea_pid")||(()=>{const x=rnd(8);store("ea_pid",x);return x;})();
  let me=params.get("pid")?null:store("ea_me_"+code);
  const urlT=parseInt(params.get("t"),10);
  if(!me){me={n:store("ea_name")||"",t:isNaN(urlT)?-1:Math.max(0,Math.min(3,urlT)),ok:false};}
  const net=new Net(onMsg,c=>{conn=c;if(c.up)join();paint();});
  net.sub(code+"/st");
  const send=o=>net.pub(code+"/in",o);
  function join(){if(me.ok&&me.t>=0)send({k:"join",id:pid,n:me.n||"Spieler",t:me.t});}
  setInterval(()=>{if(conn.up)join();},30000);
  function onMsg(t,p){if(t===code+"/st"){S=p;recv=Date.now();paint();}}
  const nT=()=>S?S.nT:4;
  function paint(){
    const el=$("phone");
    if(!me.ok){
      const n=nT();
      el.innerHTML=`<h2>🎯 English Activity</h2><div class="box"><label><b>Dein Vorname</b> (kann auch ein Spitzname sein)<input id="pName" maxlength="16" value="${h(me.n)}" autocomplete="off"></label>
        <p><b>Dein Team</b></p><div class="teamsel">${[0,1,2,3].slice(0,n).map(i=>`<button data-p="team" data-v="${i}" class="${me.t===i?"on":""}" style="--tc:var(--t${i})">Team ${TN[i]}</button>`).join("")}</div>
        <button class="pri bigbtn" data-p="go" ${me.t<0?"disabled":""}>Los geht’s ▶</button>${S?"":`<div class="hint">${conn.up?"Verbunden …":"Verbinde …"}</div>`}</div>`;
      const i=$("pName");if(i)i.oninput=()=>{me.n=clean(i.value,16);};
      return;
    }
    const col=`var(--t${me.t})`;
    let s=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="myteam" style="--tc:${col}">Team ${TN[me.t]}</span><b>${h(me.n)}</b><button data-p="edit" style="padding:.3em .7em">Ändern</button></div>`;
    if(!S){el.innerHTML=s+`<div class="status">${conn.up?"Warte auf das Smartboard …":"Verbinde …"}</div>`;return;}
    s+=`<div class="topscore">${S.sc.map((x,i)=>`<span style="--tc:var(--t${i})">${TN[i]}<br><b>${x}</b></span>`).join("")}</div>`;
    const M=S.mode?MODES[S.mode]:null;
    if(S.ph==="lobby"||!M)s+=`<div class="status">Gleich geht’s los! 👀<br>Schau auf das Smartboard.</div>`;
    else{
      s+=`<div class="${M.cls}"><div class="cmode"><span class="ico">${ICON[S.mode]}</span><div><div class="mn">${M.n}</div><div>${M.en}</div></div><span class="mp">${M.pts} P.</span></div></div>`;
      if(S.ph==="ready")s+=`<div class="status">Gleich geht’s los. Schau nach vorne! 👀</div>`;
      else if(S.ph==="run"){
        const locked=S.locks&&S.locks.includes(pid);
        s+=`<button class="buzzbtn" data-p="buzz" style="--tc:${col}" ${locked?"disabled":""}>${locked?"Du warst schon dran":"🙋 Ich weiß es!"}</button><div class="cclock" id="pclk">${fmt(Math.max(0,S.rem-(Date.now()-recv)))}</div>`;}
      else if(S.ph==="buzz"){const b=S.buzz||{};const mine=b.id===pid;
        s+=`<div class="status" style="border:4px solid var(--t${b.t});font-size:1.3rem">${mine?"<b>Du bist dran!</b> Sag deine Antwort auf Englisch.":`🙋 <b>${h(b.n)}</b> (Team ${TN[b.t]}) antwortet …`}</div>`;}
      else if(S.ph==="result"||S.ph==="end"){const r=S.res||{};
        s+=`<div class="word ${M.cls}"><div class="muted">Der Begriff war</div><div class="en">${h(r.w||"")}</div><div class="de">${h(r.de||"")}</div></div>
          <div class="status">${r.t>=0?`Team ${TN[r.t]} +${r.p} Punkte`:"Keine Punkte"}${S.ph==="end"?`<br>🏆 Spiel zu Ende: Team ${TN[S.win]} gewinnt!`:""}</div>`;}
    }
    s+=`<div class="hint"><span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}</div>`;
    el.innerHTML=s;
  }
  document.body.addEventListener("click",e=>{
    const b=e.target.closest("#phone [data-p]");if(!b)return;const a=b.dataset.p;
    if(a==="team"){me.t=+b.dataset.v;const i=$("pName");if(i)me.n=clean(i.value,16);paint();}
    else if(a==="go"){const i=$("pName");if(i)me.n=clean(i.value,16);if(!me.n)me.n="Spieler "+pid.slice(0,2).toUpperCase();me.ok=true;store("ea_name",me.n);store("ea_me_"+code,me);join();paint();}
    else if(a==="edit"){me.ok=false;paint();}
    else if(a==="buzz"){send({k:"buzz",id:pid});if(navigator.vibrate)try{navigator.vibrate(60);}catch(x){}}
  });
  setInterval(()=>{if(S&&S.ph==="run"){const c=$("pclk");if(c){const r=Math.max(0,S.rem-(Date.now()-recv));c.textContent=fmt(r);c.classList.toggle("low",r<=10000);}}},250);
  paint();
}

/* Start */
(function(){
  const code=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!code)tafelApp();
  else if(params.get("k"))cardApp(code);
  else phoneApp(code);
})();
</script>
<script src="tafel_zoom.js"></script>
