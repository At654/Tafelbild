<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LF 1 · Modul 8 · Abenteuer im Kaufhaus Seestern</title>
<style>
:root{--navy:#1f3b5c;--blue:#2f6db5;--sand:#fbf3e4;--orange:#e8833a;--green:#2e9e6b;--red:#d2493f;--ink:#23262b;--mut:#6b6f76;--card:#fff;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif;font-size:17px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:.55rem .9rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .ttl{font-weight:700;font-size:.95rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .pts{background:var(--orange);border-radius:99px;padding:.15rem .7rem;font-weight:700;font-size:.9rem}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:.35rem .6rem;font-size:1rem;cursor:pointer}
.prog{display:flex;gap:4px;padding:.5rem .9rem 0;max-width:820px;margin:auto}
.prog i{flex:1;height:7px;border-radius:9px;background:#e2d6c2}
.prog i.on{background:var(--orange)} .prog i.done{background:var(--green)}
main{max-width:820px;margin:0 auto;padding:.8rem .9rem 6rem}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(60,40,10,.09);overflow:hidden;margin-bottom:1rem;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card img.hero{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.card .body{padding:1rem 1.1rem 1.2rem}
.chap{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:800}
h1{font-size:1.6rem;margin:.1rem 0 .6rem;color:var(--navy)} h2{font-size:1.3rem;margin:.1rem 0 .6rem;color:var(--navy)}
p{margin:.45rem 0}
.de{display:block}
.tl{display:block;color:#5a6470;font-size:.88em;border-left:3px solid #c9d7ea;padding-left:.5rem;margin-top:.15rem}
.tl[dir=rtl]{border-left:0;border-right:3px solid #c9d7ea;padding-left:0;padding-right:.5rem;text-align:right;font-size:.95em}
.btn .tl,.opt .tl,.chip .tl{border:0;padding:0;margin-top:.1rem;color:inherit;opacity:.78;font-size:.82em}
.say{display:flex;gap:.6rem;align-items:flex-start;margin:.7rem 0}
.say .av{font-size:1.9rem;line-height:1}
.say .bub{background:#eef4fb;border-radius:4px 16px 16px 16px;padding:.55rem .8rem;flex:1}
.say .who{font-weight:700;font-size:.8rem;color:var(--blue)}
.q{font-weight:700;margin:.9rem 0 .5rem;font-size:1.05rem}
.opts{display:grid;gap:.5rem}
.opt{background:#fff;border:2px solid #d9dfe7;border-radius:14px;padding:.65rem .8rem;text-align:left;font:inherit;cursor:pointer;color:inherit;transition:.15s}
.opt:hover{border-color:var(--blue);background:#f6f9fd}
.opt.ok{border-color:var(--green);background:#e8f6ef}
.opt.no{border-color:var(--red);background:#fdeceb;animation:shake .35s}
.opt.sel{border-color:var(--blue);background:#e9f1fb}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:.7rem;padding:.6rem .8rem;border-radius:12px;font-size:.95rem}
.fb.good{background:#e8f6ef;border:1px solid #a9dcc3} .fb.bad{background:#fdf1e6;border:1px solid #f2c79f}
.merke{background:#fff7e0;border:2px dashed #e9c46a;border-radius:14px;padding:.6rem .8rem;margin:.8rem 0}
.merke b{color:#a26b00}
.lk{background:linear-gradient(135deg,#e7f3ff,#f1ecff);border-radius:14px;padding:.7rem .9rem;margin:.9rem 0;border:1px solid #cfdff5}
.lk .h{font-weight:800;color:#3a4fa0;margin-bottom:.2rem}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,243,228,.96);padding:.6rem .9rem;display:flex;justify-content:center;border-top:1px solid #eadfcb}
.btn{background:var(--orange);color:#fff;border:0;border-radius:14px;padding:.75rem 1.6rem;font:inherit;font-weight:700;cursor:pointer;min-width:220px;box-shadow:0 3px 0 #b86123}
.btn[disabled]{background:#cfc5b5;box-shadow:none;cursor:default}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.8rem 0}
.lang{border:2px solid #d9dfe7;background:#fff;border-radius:14px;padding:.8rem;font:inherit;cursor:pointer;font-weight:700}
.lang.sel{border-color:var(--orange);background:#fff3e8}
input.name{width:100%;font:inherit;padding:.6rem .8rem;border-radius:12px;border:2px solid #d9dfe7;margin-top:.3rem}
/* Pyramide */
.pyr{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;margin:.8rem 0}
.lvl{border-radius:8px;padding:.35rem .5rem;text-align:center;font-size:.85rem;background:#eef1f5;color:#8a93a0;border:2px dashed #ccd3dc;min-height:2.6rem;display:flex;flex-direction:column;justify-content:center;transition:.25s}
.lvl.cur{border-color:var(--orange);background:#fff3e8;color:var(--ink)}
.lvl.fill{border-style:solid;color:#fff;border-color:transparent}
.lvl small{display:block;font-weight:700;font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.chip{background:#fff;border:2px solid #c9d3df;border-radius:12px;padding:.45rem .7rem;font:inherit;font-size:.92rem;cursor:pointer}
.chip.no{border-color:var(--red);animation:shake .35s}
/* Kreuz */
.cross{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:6px;margin:.7rem 0;position:relative}
.cross div{border-radius:12px;padding:.5rem;min-height:5.2rem;font-size:.8rem}
.cross .lab{font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;opacity:.75}
.c1{background:#e3f0ff}.c2{background:#e6f7ec}.c3{background:#fff2df}.c4{background:#f4e8fb}
.tag{display:inline-block;background:#fff;border-radius:8px;padding:.1rem .4rem;margin:.15rem .15rem 0 0;box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:.85rem;animation:pop .4s}
.shop{background:#f8f5ef;border-radius:14px;padding:.7rem .8rem;margin:.6rem 0;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cats{display:grid;grid-template-columns:1fr;gap:.4rem}
.badge{font-size:4rem;text-align:center;margin:.3rem 0}
.score{text-align:center;font-size:1.3rem;font-weight:800;color:var(--navy)}
.stars{text-align:center;font-size:2rem;letter-spacing:.2rem}
.small{font-size:.85rem;color:var(--mut)}
.conf{position:fixed;top:-20px;font-size:1.5rem;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.7}}
.profi{border:2px solid #b38cff;background:#f7f2ff;border-radius:14px;padding:.7rem .8rem;margin-top:1rem}
.cert{border:4px double var(--navy);border-radius:16px;padding:1rem;text-align:center;background:#fffdf7}
@media (max-width:520px){h1{font-size:1.35rem}.langs,.row2{grid-template-columns:1fr}.btn{min-width:0;width:100%}}
@media print{.nav,header{display:none}}
</style>
</head>

{t:"story",ch:0,img:"s1",
 p:[["Montag, 8 Uhr. Du bist neu: Azubi im Kaufhaus Seestern in Bremerhaven. Das Kaufhaus liegt am Hafen. Möwen schreien, ein Schiff fährt vorbei.",
     "Thứ Hai, 8 giờ sáng. Bạn là người mới: học viên học nghề tại cửa hàng bách hóa Seestern ở Bremerhaven. Cửa hàng nằm cạnh bến cảng. Hải âu kêu, một con tàu chạy ngang qua.",

 say:[P,["„Willkommen{NAME}! Heute lernst du unser Sortiment kennen. Aber zuerst eine Frage aus Modul 7.“",
     "„Chào mừng{NAME}! Hôm nay bạn sẽ tìm hiểu bộ hàng hóa (Sortiment) của chúng ta. Nhưng trước tiên là một câu hỏi từ Mô-đun 7.“",
     "„Hoş geldin{NAME}! Bugün ürün yelpazemizi (Sortiment) tanıyacaksın. Ama önce Modül 7'den bir soru.“",

 lk:["Bremerhaven liegt an der Nordsee, an der Mündung der Weser. Der Hafen ist einer der größten Autohäfen der Welt – jedes Jahr werden hier über eine Million Autos verschifft. Bremerhaven gehört zum Bundesland Bremen.",
     "Bremerhaven nằm bên Biển Bắc, ở cửa sông Weser. Cảng ở đây là một trong những cảng ô tô lớn nhất thế giới – mỗi năm có hơn một triệu chiếc ô tô được vận chuyển bằng tàu. Bremerhaven thuộc bang Bremen.",
     "Bremerhaven, Kuzey Denizi kıyısında, Weser Nehri'nin ağzında yer alır. Buradaki liman dünyanın en büyük otomobil limanlarından biridir – her yıl bir milyondan fazla araç gemilerle taşınır. Bremerhaven, Bremen eyaletine aittir.",
     "تقع بريمرهافن على بحر الشمال عند مصبّ نهر فيزر. ميناؤها من أكبر موانئ السيارات في العالم – يُشحن منه كل عام أكثر من مليون سيارة. تتبع بريمرهافن ولاية بريمن."]},
{t:"mc",ch:0,say:P,

 good:["Genau! Der Händler wählt Waren von vielen Herstellern aus. So kann der Kunde vergleichen.","Chính xác! Người bán chọn hàng từ nhiều nhà sản xuất. Nhờ vậy khách hàng có thể so sánh.","Aynen! Satıcı birçok üreticiden mal seçer. Böylece müşteri karşılaştırabilir.","بالضبط! يختار التاجر البضائع من منتجين كثيرين. هكذا يستطيع الزبون المقارنة."],

{t:"story",ch:1,img:"s2",
 p:[["Frau Petersen führt dich ins Lager. Überall stehen Kartons.","Cô Petersen dẫn bạn vào kho. Khắp nơi là thùng các-tông.","Bayan Petersen seni depoya götürüyor. Her yer koli dolu.","تأخذك السيدة بيترسن إلى المستودع. الصناديق الكرتونية في كل مكان."]],
 say:[P,["„Wir ordnen unser Sortiment wie eine Pyramide. Unten steht die kleinste Einheit: die Sorte. Ganz oben stehen alle Waren im Kaufhaus.“",
     "„Chúng ta sắp xếp bộ hàng hóa như một kim tự tháp. Ở dưới cùng là đơn vị nhỏ nhất: loại hàng cụ thể (Sorte). Trên cùng là tất cả hàng hóa trong cửa hàng.“",
     "„Ürün yelpazemizi bir piramit gibi düzenliyoruz. En altta en küçük birim var: çeşit (Sorte). En üstte mağazadaki tüm mallar var.“",
     "«نرتّب تشكيلتنا مثل هرم. في الأسفل أصغر وحدة: الصنف (Sorte). وفي الأعلى كل البضائع في المتجر.»"]],
 lk:["In Deutschland lernen Azubis im dualen System: an 3–4 Tagen im Betrieb, an 1–2 Tagen in der Berufsschule. Die Ausbildung zur Verkäuferin / zum Verkäufer dauert 2 Jahre, zur Kauffrau / zum Kaufmann im Einzelhandel 3 Jahre.",
     "Ở Đức, học viên học nghề học theo hệ thống kép: 3–4 ngày ở doanh nghiệp, 1–2 ngày ở trường nghề. Học nghề nhân viên bán hàng kéo dài 2 năm, nhân viên thương mại bán lẻ kéo dài 3 năm.",
     "Almanya'da çıraklar ikili sistemde öğrenir: 3–4 gün işyerinde, 1–2 gün meslek okulunda. Satış elemanı eğitimi 2 yıl, perakende ticaret elemanı eğitimi 3 yıl sürer.",
     "في ألمانيا يتعلّم المتدرّبون في النظام المزدوج: 3–4 أيام في الشركة، و1–2 يوم في المدرسة المهنية. يستغرق التدريب كبائع سنتين، وكتاجر تجزئة 3 سنوات."]},

{t:"story",ch:2,img:"s3",
 p:[["Mittagspause! Du gehst in die Bürgermeister-Smidt-Straße.","Nghỉ trưa! Bạn đi ra phố Bürgermeister-Smidt-Straße.","Öğle arası! Bürgermeister-Smidt-Straße'ye gidiyorsun.","استراحة الغداء! تذهب إلى شارع بورغرمايستر-شميت."]],
 say:[P,["„Schau dir die Konkurrenz an: Sind die Sortimente breit oder schmal, tief oder flach?“","„Hãy xem các đối thủ: Bộ hàng hóa của họ rộng hay hẹp, sâu hay nông?“","„Rakiplere bak: Ürün yelpazeleri geniş mi dar mı, derin mi sığ mı?“","«انظر إلى المنافسين: هل تشكيلاتهم واسعة أم ضيّقة، عميقة أم سطحية؟»"]],
 merke:["breit = viele Warengruppen · schmal = wenige Warengruppen · tief = viel Auswahl in einer Warengruppe · flach = wenig Auswahl in einer Warengruppe",
        "rộng = nhiều nhóm hàng · hẹp = ít nhóm hàng · sâu = nhiều lựa chọn trong một nhóm hàng · nông = ít lựa chọn trong một nhóm hàng",
        "geniş = çok mal grubu · dar = az mal grubu · derin = bir mal grubunda çok seçenek · sığ = bir mal grubunda az seçenek",
        "واسعة = مجموعات بضائع كثيرة · ضيّقة = مجموعات قليلة · عميقة = خيارات كثيرة داخل مجموعة واحدة · سطحية = خيارات قليلة داخل مجموعة واحدة"],
 lk:["Die Bürgermeister-Smidt-Straße ist die Haupt-Einkaufsstraße von Bremerhaven. Sonntags sind in Deutschland fast alle Geschäfte geschlossen (Sonntagsruhe). Tipp: Auf viele Flaschen und Dosen zahlst du Pfand (bis zu 25 Cent). Bring sie zurück in den Laden – dann bekommst du das Geld zurück.",
     "Phố Bürgermeister-Smidt-Straße là phố mua sắm chính của Bremerhaven. Ở Đức, vào Chủ nhật hầu như tất cả cửa hàng đều đóng cửa. Mẹo: Với nhiều chai và lon, bạn trả tiền đặt cọc (Pfand, tối đa 25 cent). Mang chúng trả lại cửa hàng – bạn sẽ nhận lại tiền.",
     "Bürgermeister-Smidt-Straße, Bremerhaven'ın ana alışveriş caddesidir. Almanya'da pazar günleri neredeyse tüm mağazalar kapalıdır. İpucu: Birçok şişe ve kutu için depozito (Pfand, en fazla 25 sent) ödersin. Onları mağazaya geri getir – paranı geri alırsın.",
     "شارع بورغرمايستر-شميت هو شارع التسوّق الرئيسي في بريمرهافن. في ألمانيا تكون كل المحلات تقريباً مغلقة يوم الأحد. نصيحة: على كثير من الزجاجات والعلب تدفع تأميناً (Pfand، حتى 25 سنتاً). أعدها إلى المتجر – فتستردّ المال."]},
{t:"shops",ch:2,
 sh:[
  {n:["🧵 Jeans-Werk: nur Jeans und Jacken – aber 300 Jeans: alle großen Marken, alle Größen, viele Farben.","🧵 Jeans-Werk: chỉ có quần jeans và áo khoác – nhưng có 300 chiếc jeans: mọi thương hiệu lớn, mọi cỡ, nhiều màu.","🧵 Jeans-Werk: sadece kot pantolon ve ceket – ama 300 kot: tüm büyük markalar, tüm bedenler, birçok renk.","🧵 جينز-فيرك: جينز وسترات فقط – لكن 300 بنطال جينز: كل العلامات الكبيرة، كل المقاسات، ألوان كثيرة."],s:"Jeans-Werk",b:0,d:1},
  {n:["☕ Kaffeerösterei Kaje: Kaffee, Tee und Zubehör – 60 Kaffeesorten aus 20 Ländern.","☕ Xưởng rang cà phê Kaje: cà phê, trà và phụ kiện – 60 loại cà phê từ 20 quốc gia.","☕ Kaje Kahve Kavurma Evi: kahve, çay ve aksesuar – 20 ülkeden 60 çeşit kahve.","☕ محمصة قهوة كايه: قهوة وشاي ولوازم – 60 نوعاً من القهوة من 20 بلداً."],s:"Kaffeerösterei",b:0,d:1},
  {n:["👗 Boutique Möwe: nur Damenmode – von jedem Modell nur ein, zwei Einzelteile.","👗 Boutique Möwe: chỉ có thời trang nữ – mỗi mẫu chỉ có một, hai chiếc.","👗 Möwe Butik: sadece kadın giyim – her modelden sadece bir iki parça.","👗 بوتيك مُوفه: أزياء نسائية فقط – ومن كل موديل قطعة أو قطعتان فقط."],s:"Boutique",b:0,d:0},
  {n:["🛒 Supermarkt Nordsee: Lebensmittel, Drogerie, Haushalt, Zeitschriften, Tierfutter – aber von jeder Ware nur wenige Sorten.","🛒 Siêu thị Nordsee: thực phẩm, hóa mỹ phẩm, đồ gia dụng, tạp chí, thức ăn cho thú cưng – nhưng mỗi loại hàng chỉ có ít lựa chọn.","🛒 Nordsee Süpermarketi: gıda, kozmetik, ev eşyası, dergi, hayvan maması – ama her maldan sadece birkaç çeşit.","🛒 سوبرماركت نوردزيه: مواد غذائية، منتجات نظافة وتجميل، أدوات منزلية، مجلات، طعام حيوانات – لكن من كل بضاعة أصناف قليلة فقط."],s:"Supermarkt",b:1,d:0},
  {n:["🏬 Kaufhaus Seestern (dein Betrieb!): Textilien, Haushalt, Spielwaren, Sport, Schuhe – und in jeder Abteilung viele Marken, Größen und Preislagen.","🏬 Cửa hàng bách hóa Seestern (nơi bạn làm!): hàng dệt may, đồ gia dụng, đồ chơi, thể thao, giày – và ở mỗi gian hàng có nhiều thương hiệu, cỡ và mức giá.","🏬 Seestern Mağazası (senin işyerin!): tekstil, ev eşyası, oyuncak, spor, ayakkabı – ve her reyonda birçok marka, beden ve fiyat seviyesi.","🏬 متجر زيشتيرن (مكان عملك!): منسوجات، أدوات منزلية، ألعاب، رياضة، أحذية – وفي كل قسم علامات ومقاسات ومستويات أسعار كثيرة."],s:"Seestern",b:1,d:1}],
 qb:["Wie viele Warengruppen?","Có bao nhiêu nhóm hàng?","Kaç mal grubu var?","كم مجموعة بضائع؟"],
 qd:["Wie viel Auswahl in einer Warengruppe?","Có bao nhiêu lựa chọn trong một nhóm hàng?","Bir mal grubunda ne kadar seçenek var?","كم عدد الخيارات داخل مجموعة واحدة؟"],
 ob:[["schmal – wenige Warengruppen","hẹp – ít nhóm hàng","dar – az mal grubu","ضيّقة – مجموعات قليلة"],["breit – viele Warengruppen","rộng – nhiều nhóm hàng","geniş – çok mal grubu","واسعة – مجموعات كثيرة"]],
 od:[["flach – wenig Auswahl","nông – ít lựa chọn","sığ – az seçenek","سطحية – خيارات قليلة"],["tief – viel Auswahl","sâu – nhiều lựa chọn","derin – çok seçenek","عميقة – خيارات كثيرة"]],
 good:["Dein Sortiments-Kreuz ist fertig! Fachgeschäfte sind meist schmal und tief, Warenhäuser breit und tief.","Bảng chữ thập bộ hàng hóa của bạn đã xong! Cửa hàng chuyên doanh thường hẹp và sâu, cửa hàng bách hóa thì rộng và sâu.","Ürün yelpazesi tablon hazır! Uzman mağazalar genelde dar ve derin, büyük mağazalar geniş ve derindir.","مخطّط التشكيلة جاهز! المحلات المتخصّصة غالباً ضيّقة وعميقة، والمتاجر الكبيرة واسعة وعميقة."]},
/* Kapitel 4 */
{t:"story",ch:3,img:"s4",
 p:[["Nachmittag. In der Sportabteilung ist viel los.","Buổi chiều. Gian hàng thể thao rất đông.","Öğleden sonra. Spor reyonunda çok hareket var.","بعد الظهر. قسم الرياضة مزدحم."]],
 say:[K,["„Hallo! Ich bin Herr Kaya, Abteilungsleiter Sport. Unsere Waren müssen ins richtige Regal. Kannst du sie zuordnen?“","„Xin chào! Tôi là anh Kaya, trưởng gian hàng thể thao. Hàng của chúng ta phải vào đúng kệ. Bạn có thể phân loại chúng không?“","„Merhaba! Ben Bay Kaya, spor reyonu şefiyim. Mallarımız doğru rafa gitmeli. Onları sınıflandırabilir misin?“","«مرحباً! أنا السيد كايا، رئيس قسم الرياضة. يجب أن تذهب بضائعنا إلى الرف الصحيح. هل تستطيع تصنيفها؟»"]],
 lk:["Im Advent gibt es in vielen deutschen Städten Weihnachtsmärkte – auch in Bremerhaven. Für Geschäfte ist die Zeit vor Weihnachten die wichtigste Saison des Jahres: Jetzt wird am meisten verkauft.",
     "Vào mùa Vọng (trước Giáng sinh), nhiều thành phố ở Đức có chợ Giáng sinh – cả ở Bremerhaven. Với các cửa hàng, thời gian trước Giáng sinh là mùa quan trọng nhất trong năm: đây là lúc bán được nhiều nhất.",
     "Advent döneminde (Noel öncesi) birçok Alman şehrinde Noel pazarları kurulur – Bremerhaven'da da. Mağazalar için Noel öncesi yılın en önemli sezonudur: En çok satış bu dönemde yapılır.",
     "في فترة المجيء (قبل عيد الميلاد) تُقام أسواق عيد الميلاد في مدن ألمانية كثيرة – وفي بريمرهافن أيضاً. بالنسبة للمحلات فإن الفترة قبل عيد الميلاد هي أهم موسم في السنة: فيها تُباع أكبر كمية."]},
{t:"sort",ch:3,
 cats:[["Kernsortiment – Hauptteil, immer da, größter Umsatz","Bộ hàng cốt lõi – phần chính, luôn có, doanh thu cao nhất","Çekirdek ürün yelpazesi – ana kısım, her zaman var, en çok ciro","التشكيلة الأساسية – الجزء الرئيسي، متوفّرة دائماً، أكبر مبيعات"],
       ["Zusatzsortiment – ergänzt das Kernsortiment","Bộ hàng bổ sung – bổ sung cho hàng cốt lõi","Ek ürün yelpazesi – çekirdeği tamamlar","التشكيلة الإضافية – تكمّل الأساسية"],
       ["Randsortiment – selten verlangt, rundet ab","Bộ hàng phụ – ít khi được hỏi mua, làm đầy đủ thêm","Kenar ürün yelpazesi – nadiren istenir, tamamlayıcı","التشكيلة الهامشية – نادراً ما تُطلب، تُكمل العرض"],

 it:[{a:["👟 Laufschuhe, Trainingsanzüge, Fußbälle – das ganze Jahr, bringen den meisten Umsatz","👟 Giày chạy bộ, đồ thể thao, bóng đá – cả năm, mang lại doanh thu nhiều nhất","👟 Koşu ayakkabısı, eşofman, futbol topu – bütün yıl, en çok ciroyu getirir","👟 أحذية جري، بدلات رياضية، كرات قدم – طوال السنة، تحقّق أكبر مبيعات"],c:0},
     {a:["🧴 Trinkflaschen und Sporttaschen – passend zu den Sportartikeln","🧴 Bình nước và túi thể thao – đi kèm với đồ thể thao","🧴 Matara ve spor çantası – spor malzemelerine uygun","🧴 قوارير ماء وحقائب رياضية – تناسب الأدوات الرياضية"],c:1},
     {a:["⌚ Sportuhren mit Pulsmessung – werden selten verlangt","⌚ Đồng hồ thể thao đo nhịp tim – ít khi được hỏi mua","⌚ Nabız ölçen spor saatleri – nadiren istenir","⌚ ساعات رياضية لقياس النبض – نادراً ما تُطلب"],c:2},
     {a:["🎿 Skier und Schlitten – nur von November bis Februar","🎿 Ván trượt tuyết và xe trượt – chỉ từ tháng 11 đến tháng 2","🎿 Kayak ve kızak – sadece kasımdan şubata kadar","🎿 زلاجات ومزالج – فقط من نوفمبر إلى فبراير"],c:3},
     {a:["🧘 Yogamatten – nur diese Woche 30 % billiger","🧘 Thảm tập yoga – chỉ tuần này rẻ hơn 30 %","🧘 Yoga matları – sadece bu hafta %30 daha ucuz","🧘 حصائر يوغا – هذا الأسبوع فقط أرخص بنسبة 30 %"],c:4}],
 merke:["Kernsortiment = Hauptumsatz, immer verkaufsbereit. Randsortiment = Ergänzung, oft auch branchenfremd (z. B. Bettwäsche in der Möbelabteilung).","Bộ hàng cốt lõi = doanh thu chính, luôn sẵn sàng để bán. Bộ hàng phụ = bổ sung, thường cả hàng khác ngành (ví dụ: ga trải giường ở gian đồ nội thất).","Çekirdek = ana ciro, her zaman satışa hazır. Kenar = tamamlayıcı, çoğu zaman başka sektörden (örn. mobilya reyonunda nevresim).","الأساسية = المبيعات الرئيسية، جاهزة للبيع دائماً. الهامشية = إضافة، غالباً من مجال آخر (مثلاً أغطية أسرّة في قسم الأثاث)."]},
/* Kapitel 5 */
{t:"story",ch:4,img:"s5",
 p:[["Eine Kundin, Frau Hoffmann, hält zwei Jeans in der Hand. Links: eine bekannte Marke für 89 €. Rechts: die „Seestern-Jeans“ mit dem Anker für 39 €. Die gibt es nur bei uns.",
     "Một khách hàng, bà Hoffmann, cầm hai chiếc quần jeans. Bên trái: một thương hiệu nổi tiếng giá 89 €. Bên phải: „Seestern-Jeans“ có hình mỏ neo, giá 39 €. Loại này chỉ có ở cửa hàng chúng ta.",
     "Bir müşteri, Bayan Hoffmann, elinde iki kot tutuyor. Solda: 89 €'luk tanınmış bir marka. Sağda: çapa işaretli 39 €'luk „Seestern-Jeans“. Bu sadece bizde var.",
     "زبونة، السيدة هوفمان، تمسك بنطالَي جينز. على اليسار: علامة معروفة بسعر 89 €. على اليمين: «جينز زيشتيرن» بعلامة المرساة بسعر 39 €. وهذا موجود عندنا فقط."]],
 lk:["Viele Supermärkte in Deutschland haben eigene Handelsmarken, zum Beispiel „ja!“ bei Rewe oder „Gut & Günstig“ bei Edeka. Discounter wie Aldi und Lidl verkaufen sehr viele Eigenmarken. So kann man im Alltag viel Geld sparen.",
     "Nhiều siêu thị ở Đức có nhãn hàng riêng, ví dụ „ja!“ ở Rewe hoặc „Gut & Günstig“ ở Edeka. Các siêu thị giá rẻ như Aldi và Lidl bán rất nhiều nhãn hàng riêng. Nhờ vậy, trong cuộc sống hằng ngày bạn có thể tiết kiệm nhiều tiền.",
     "Almanya'da birçok süpermarketin kendi markası vardır, örneğin Rewe'de „ja!“ veya Edeka'da „Gut & Günstig“. Aldi ve Lidl gibi indirim marketleri çok sayıda kendi markasını satar. Böylece günlük hayatta çok para tasarruf edilebilir.",
     "لدى كثير من المتاجر في ألمانيا علامات خاصة، مثل «ja!» في ريفه أو «Gut & Günstig» في إيديكا. وتبيع متاجر التخفيضات مثل ألدي وليدل علامات خاصة كثيرة جداً. هكذا يمكن توفير الكثير من المال في الحياة اليومية."]},

{t:"mc",ch:4,say:H,
 q:["Frau Hoffmann fragt: „Ist die günstige Jeans nicht schlechter?“ Was antwortest du?","Bà Hoffmann hỏi: „Chiếc jeans rẻ có kém hơn không?“ Bạn trả lời thế nào?","Bayan Hoffmann soruyor: „Ucuz kot daha kötü değil mi?“ Ne cevap verirsin?","تسأل السيدة هوفمان: «أليس الجينز الرخيص أسوأ؟» بماذا تجيب؟"],
 o:[{a:["„Ja, billig ist immer schlecht. Nehmen Sie lieber die Marke.“","„Vâng, đồ rẻ thì luôn kém. Bà nên lấy hàng hiệu.“","„Evet, ucuz her zaman kötüdür. Siz en iyisi markalı olanı alın.“","«نعم، الرخيص دائماً سيئ. خذي العلامة المعروفة أفضل.»"],
     fb:["Schlecht! So machst du die eigene Ware schlecht – und die Aussage stimmt nicht.","Không tốt! Như vậy bạn chê chính hàng của mình – và điều đó cũng không đúng.","Kötü! Böylece kendi malını kötülüyorsun – ve bu ifade doğru değil.","خطأ! هكذا تسيء إلى بضاعتك نفسها – والقول غير صحيح."]},
    {a:["„Die Seestern-Jeans ist unsere Eigenmarke. Sie hat eine gute, gleichbleibende Qualität. Sie ist günstiger, weil wir keine teure Markenwerbung bezahlen.“","„Seestern-Jeans là nhãn hàng riêng của chúng tôi. Chất lượng tốt và ổn định. Giá rẻ hơn vì chúng tôi không trả tiền quảng cáo thương hiệu đắt đỏ.“","„Seestern-Jeans bizim kendi markamız. Kalitesi iyi ve sabit. Pahalı marka reklamı ödemediğimiz için daha ucuz.“","«جينز زيشتيرن هو علامتنا الخاصة. جودته جيدة وثابتة. وهو أرخص لأننا لا ندفع إعلانات علامات باهظة.»"],ok:1},
    {a:["„Keine Ahnung, das weiß ich nicht.“","„Tôi không biết.“","„Hiç bilmiyorum.“","«لا أعرف.»"],
     fb:["Hmm. Als Verkäuferin oder Verkäufer solltest du dein Sortiment kennen.","Hmm. Là nhân viên bán hàng, bạn nên biết bộ hàng hóa của mình.","Hmm. Satış elemanı olarak ürün yelpazeni bilmelisin.","همم. كبائع يجب أن تعرف تشكيلتك."]}],
 good:["Prima! Frau Hoffmann probiert die Seestern-Jeans an – und kauft sie.","Tuyệt! Bà Hoffmann thử chiếc Seestern-Jeans – và mua nó.","Harika! Bayan Hoffmann Seestern-Jeans'i deniyor – ve satın alıyor.","ممتاز! السيدة هوفمان تجرّب جينز زيشتيرن – وتشتريه."]},
{t:"multi",ch:4,say:P,
 q:["„Warum hat Seestern eine eigene Marke? Wähle die 2 Vorteile für das Kaufhaus.“","„Tại sao Seestern có nhãn hàng riêng? Hãy chọn 2 lợi ích cho cửa hàng.“","„Seestern neden kendi markasına sahip? Mağaza için 2 avantajı seç.“","«لماذا لدى زيشتيرن علامة خاصة؟ اختر فائدتين للمتجر.»"],
 o:[{a:["Kunden kommen wieder, weil es die Ware nur hier gibt (Kundenbindung).","Khách hàng quay lại vì hàng này chỉ có ở đây (giữ chân khách hàng).","Müşteriler geri gelir, çünkü bu mal sadece burada var (müşteri bağlılığı).","يعود الزبائن لأن البضاعة موجودة هنا فقط (ربط الزبائن)."],ok:1},
    {a:["Der Hersteller bezahlt die ganze Werbung.","Nhà sản xuất trả toàn bộ tiền quảng cáo.","Üretici tüm reklamı öder.","المُنتِج يدفع كل الإعلانات."]},
    {a:["Das Kaufhaus ist unabhängiger vom Hersteller.","Cửa hàng ít phụ thuộc vào nhà sản xuất hơn.","Mağaza üreticiye daha az bağımlı olur.","يصبح المتجر أقل اعتماداً على المُنتِج."],ok:1},
    {a:["Die Jeans kostet überall gleich viel.","Quần jeans có giá như nhau ở mọi nơi.","Kot her yerde aynı fiyattadır.","الجينز سعره نفسه في كل مكان."]}],
 good:["Stark! Handelsmarken binden Kunden und machen den Händler unabhängiger vom Hersteller.","Rất tốt! Nhãn hàng riêng giữ chân khách hàng và giúp nhà bán lẻ ít phụ thuộc vào nhà sản xuất hơn.","Harika! Mağaza markaları müşteriyi bağlar ve satıcıyı üreticiden daha bağımsız yapar.","ممتاز! علامات التاجر تربط الزبائن وتجعل التاجر أقل اعتماداً على المُنتِج."]},

{t:"branch",ch:5,img:"s2",
 p:[["Freitag. Filialleiter Herr Brandt ruft alle zusammen. Du darfst entscheiden!","Thứ Sáu. Quản lý chi nhánh, ông Brandt, gọi mọi người lại. Bạn được quyết định!","Cuma. Şube müdürü Bay Brandt herkesi topluyor. Karar senin!","يوم الجمعة. مدير الفرع السيد برانت يجمع الجميع. القرار لك!"]],
 say:[B,["„Wir wollen mehr Umsatz. Was machen wir mit unserem Sortiment?“","„Chúng ta muốn tăng doanh thu. Chúng ta làm gì với bộ hàng hóa?“","„Daha fazla ciro istiyoruz. Ürün yelpazemizle ne yapalım?“","«نريد مبيعات أكثر. ماذا نفعل بتشكيلتنا؟»"]],
 o:[{a:["📦 Wir nehmen 2.000 neue Artikel ins Sortiment – je mehr, desto besser!","📦 Chúng ta nhận thêm 2.000 mặt hàng mới – càng nhiều càng tốt!","📦 2.000 yeni ürün ekleyelim – ne kadar çok, o kadar iyi!","📦 نضيف 2000 سلعة جديدة إلى التشكيلة – كلما زادت كان أفضل!"],
     fb:["Drei Monate später: Das Lager ist übervoll. Die Lagerkosten steigen, Mode wird unmodern, Lebensmittel verderben. Sortiment zu groß!","Ba tháng sau: Kho chật kín. Chi phí lưu kho tăng, hàng thời trang lỗi mốt, thực phẩm bị hỏng. Bộ hàng hóa quá lớn!","Üç ay sonra: Depo tıklım tıklım. Depolama maliyetleri artıyor, moda eskiyor, gıdalar bozuluyor. Ürün yelpazesi çok büyük!","بعد ثلاثة أشهر: المستودع ممتلئ جداً. تكاليف التخزين ترتفع، الأزياء تصبح قديمة، والمواد الغذائية تفسد. التشكيلة كبيرة جداً!"]},
    {a:["✂️ Wir streichen die Hälfte der Artikel – das spart Kosten!","✂️ Chúng ta bỏ một nửa số mặt hàng – như vậy tiết kiệm chi phí!","✂️ Ürünlerin yarısını çıkaralım – bu maliyet tasarrufu sağlar!","✂️ نحذف نصف السلع – هذا يوفّر التكاليف!"],
     fb:["Drei Monate später: Kunden finden ihre Ware nicht mehr. Sie kaufen bei der Konkurrenz. Der Umsatz sinkt. Sortiment zu klein!","Ba tháng sau: Khách hàng không tìm thấy hàng họ cần nữa. Họ mua ở đối thủ cạnh tranh. Doanh thu giảm. Bộ hàng hóa quá nhỏ!","Üç ay sonra: Müşteriler aradıklarını bulamıyor. Rakiplerden alışveriş yapıyorlar. Ciro düşüyor. Ürün yelpazesi çok küçük!","بعد ثلاثة أشهر: لا يجد الزبائن بضاعتهم. يشترون من المنافسين. المبيعات تنخفض. التشكيلة صغيرة جداً!"]},
    {a:["🔍 Wir fragen: Was wollen unsere Kunden? Was hat die Konkurrenz? Wie viel passt in Laden und Lager? Dann planen wir ein bedarfsgerechtes Sortiment.","🔍 Chúng ta hỏi: Khách hàng muốn gì? Đối thủ có gì? Cửa hàng và kho chứa được bao nhiêu? Sau đó lập kế hoạch bộ hàng hóa phù hợp nhu cầu.","🔍 Soralım: Müşterilerimiz ne istiyor? Rakiplerde ne var? Mağazaya ve depoya ne kadar sığar? Sonra ihtiyaca uygun bir ürün yelpazesi planlayalım.","🔍 نسأل: ماذا يريد زبائننا؟ ماذا لدى المنافسين؟ كم يتّسع المحل والمستودع؟ ثم نخطّط تشكيلة تناسب الحاجة."],ok:1}],
 good:["Herr Brandt lächelt: „Genau so! Ein Sortiment richtet sich nach den Kunden, der Konkurrenz und dem Umfang.“","Ông Brandt mỉm cười: „Đúng vậy! Bộ hàng hóa phải dựa vào khách hàng, đối thủ cạnh tranh và quy mô.“","Bay Brandt gülümsüyor: „Aynen böyle! Ürün yelpazesi müşterilere, rakiplere ve kapsama göre belirlenir.“","يبتسم السيد برانت: «هكذا بالضبط! التشكيلة تتوجّه حسب الزبائن والمنافسين والحجم.»"],
 lk:["Bremerhaven hat bekannte Ausflugsziele: das Klimahaus (eine Reise einmal um die Welt), das Deutsche Auswandererhaus und den Zoo am Meer. Früher sind über 7 Millionen Menschen vom Hafen Bremerhaven nach Amerika ausgewandert.",
     "Bremerhaven có nhiều điểm tham quan nổi tiếng: Klimahaus (một chuyến du hành vòng quanh thế giới), Bảo tàng Di cư Đức (Deutsches Auswandererhaus) và Sở thú bên biển (Zoo am Meer). Ngày xưa, hơn 7 triệu người đã từ cảng Bremerhaven di cư sang châu Mỹ.",
     "Bremerhaven'ın ünlü gezi yerleri var: Klimahaus (dünya çevresinde bir yolculuk), Alman Göç Müzesi (Deutsches Auswandererhaus) ve Deniz Kenarı Hayvanat Bahçesi (Zoo am Meer). Eskiden 7 milyondan fazla insan Bremerhaven limanından Amerika'ya göç etmiştir.",
     "في بريمرهافن معالم سياحية معروفة: بيت المناخ Klimahaus (رحلة حول العالم)، والبيت الألماني للمهاجرين، وحديقة الحيوان على البحر. في الماضي هاجر أكثر من 7 ملايين شخص من ميناء بريمرهافن إلى أمريكا."]},
{t:"profi",ch:5,
 q:["⭐ Profi-Aufgabe (Bonus): Ein Discounter hat ein schmales und flaches Sortiment. Warum kann er so günstige Preise anbieten? Wähle die beste Begründung.","⭐ Bài nâng cao (điểm thưởng): Một siêu thị giá rẻ có bộ hàng hóa hẹp và nông. Tại sao họ có thể bán giá rẻ như vậy? Chọn lý do tốt nhất.","⭐ Profi görevi (bonus): Bir indirim marketinin ürün yelpazesi dar ve sığdır. Neden bu kadar ucuz fiyat sunabilir? En iyi gerekçeyi seç.","⭐ مهمة للمحترفين (مكافأة): لدى متجر تخفيضات تشكيلة ضيّقة وسطحية. لماذا يستطيع تقديم أسعار رخيصة جداً؟ اختر أفضل تبرير."],
 o:[{a:["Er verkauft nur No-Name-Artikel aus Überproduktion.","Họ chỉ bán hàng không thương hiệu từ sản xuất thừa.","Sadece fazla üretimden markasız ürünler satar.","يبيع فقط سلعاً بلا علامة من فائض الإنتاج."]},
    {a:["Wenige Artikel in sehr großen Mengen: Er bekommt Mengenrabatt, braucht wenig Lagerplatz und wenig Personal.","Ít mặt hàng nhưng số lượng rất lớn: được chiết khấu số lượng, cần ít chỗ kho và ít nhân viên.","Az ürün, çok büyük miktarlarda: Miktar indirimi alır, az depo alanına ve az personele ihtiyaç duyar.","سلع قليلة بكميات كبيرة جداً: يحصل على خصم الكمية، ويحتاج مساحة تخزين قليلة وموظفين قليلين."],ok:1},
    {a:["Der Staat bezahlt einen Teil der Preise.","Nhà nước trả một phần giá.","Devlet fiyatların bir kısmını öder.","الدولة تدفع جزءاً من الأسعار."]}],
 good:["Stark begründet! Schmal + flach = große Mengen je Artikel → niedrige Einkaufspreise und Kosten.","Lập luận rất tốt! Hẹp + nông = số lượng lớn mỗi mặt hàng → giá nhập và chi phí thấp.","Çok iyi gerekçe! Dar + sığ = ürün başına büyük miktar → düşük alış fiyatları ve maliyetler.","تبرير قوي! ضيّقة + سطحية = كميات كبيرة لكل سلعة → أسعار شراء وتكاليف منخفضة."]},

 o:[{a:["Man muss sie nicht kalkulieren.","Không cần tính giá cho chúng.","Fiyat hesaplaması gerekmez.","لا حاجة لحساب أسعارها."]},
    {a:["Sie bringen immer den meisten Gewinn.","Chúng luôn mang lại nhiều lợi nhuận nhất.","Her zaman en çok kârı getirirler.","تجلب دائماً أكبر ربح."]},
    {a:["Sie haben eine gleichbleibende Qualität und sind bekannt – sie lassen sich gut verkaufen.","Chúng có chất lượng ổn định và nổi tiếng – dễ bán.","Kaliteleri sabit ve tanınmışlar – kolay satılırlar.","جودتها ثابتة وهي معروفة – لذلك تُباع بسهولة."],ok:1}]},
{t:"mc",ch:6,n:6,
 q:["Was kennzeichnet einen Trendartikel?","Đặc điểm của hàng theo xu hướng là gì?","Trend ürünün özelliği nedir?","ما الذي يميّز السلعة الرائجة؟"],
 o:[{a:["Er wird eine Zeit lang besonders stark nachgefragt.","Được ưa chuộng đặc biệt trong một thời gian.","Bir süre çok fazla talep görür.","يزداد الطلب عليها بشدة لفترة من الزمن."],ok:1},
    {a:["Er ist immer leicht nachzubestellen.","Luôn dễ đặt thêm.","Her zaman kolayca yeniden sipariş edilir.","يمكن إعادة طلبها بسهولة دائماً."]},
    {a:["Er muss immer extra beworben werden.","Luôn phải quảng cáo riêng.","Her zaman ayrıca reklamı yapılmalıdır.","يجب الإعلان عنها بشكل خاص دائماً."]}]},
{t:"end",ch:6}
];
const MAX=1+7+10+5+4+1+6; // 34 Punkte (+1 Bonus)

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
function nm(s){return s.replace('{NAME}',NAME?', '+NAME:'');}
function X(a,tag){ // zweisprachiger Text
 if(!a) return '';
 let h=`<span class="de">${nm(a[0])}</span>`;
 if(L!=='de'&&a[LI[L]]) h+=`<span class="tl" dir="${L==='ar'?'rtl':'ltr'}" lang="${L}">${nm(a[LI[L]])}</span>`;
 return h;
}
function say(c,a){return `<div class="say"><div class="av">${c.av}</div><div class="bub"><div class="who">${c.who}</div>${X(a)}</div></div>`;}
function merke(a){return a?`<div class="merke"><b>💡 ${U.merke[0]}${L!=='de'?' · '+U.merke[LI[L]]:''}:</b> ${X(a)}</div>`:'';}
function lk(a){return (a&&L!=='de')?`<div class="lk"><div class="h">🇩🇪 ${X(U.lk)}</div>${X(a)}</div>`:'';}
function addPts(n){score+=n;$('#pts').textContent='⭐ '+(score+bonus);}
function confetti(){const e=['🎉','⭐','⚓','🛍️','✨'];for(let i=0;i<22;i++){const d=document.createElement('div');d.className='conf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}}
function setNext(enabled,label){const b=$('#next');b.disabled=!enabled;b.innerHTML=X(label||U.next).replace(/class="de"/,'class="de"');}
function prog(){const ch=S[step].ch;let h='';for(let i=0;i<7;i++)h+=`<i class="${ch===undefined?'':(i<ch?'done':(i===ch?'on':''))}"></i>`;$('#prog').innerHTML=h;}
function head(s){return `${s.img?`<img class="hero" src="${IMG[s.img]}" alt="">`:''}<div class="body"><div class="chap">${U.chap[0]} ${s.ch+1}${L!=='de'?' · '+U.chap[LI[L]]+' '+(s.ch+1):''}</div><h2>${X(CH[s.ch])}</h2>`;}

/* ---------- Renderer ---------- */
function render(){
 const s=S[step]; prog(); window.scrollTo({top:0,behavior:'smooth'});
 const m=$('#main'); done=false;
 if(s.t==='start') return rStart(m);
 if(s.t==='story'){m.innerHTML=`<div class="card">${head(s)}${(s.p||[]).map(a=>`<p>${X(a)}</p>`).join('')}${s.say?say(s.say[0],s.say[1]):''}${merke(s.merke)}${lk(s.lk)}</div></div>`;setNext(true);return;}
 if(s.t==='mc'||s.t==='profi') return rMC(m,s);
 if(s.t==='multi') return rMulti(m,s);
 if(s.t==='pyr') return rPyr(m,s);
 if(s.t==='shops') return rShops(m,s);
 if(s.t==='sort') return rSort(m,s);
 if(s.t==='branch') return rBranch(m,s);
 if(s.t==='end') return rEnd(m);
}
function rStart(m){
 m.innerHTML=`<div class="card"><img class="hero" src="${IMG.s1}" alt=""><div class="body">
 <div class="chap">LF 1 · Modul 8 · Das Sortiment</div>
 <h1>⚓ Abenteuer im Kaufhaus Seestern</h1>
 <p>Eine interaktive Geschichte: Du startest als Azubi in Bremerhaven, triffst Kunden, triffst Entscheidungen – und wirst zum Sortiments-Profi.</p>
 <div class="q">${X(U.lang)}</div><div class="langs">${LANGS.map(([k,l])=>`<button class="lang ${k===L?'sel':''}" data-l="${k}" ${k==='ar'?'dir="auto"':''}>${l}</button>`).join('')}</div>
 <div class="q">${X(U.name)}</div><input class="name" id="nm" maxlength="24" value="${NAME}" placeholder="Vorname">
 <p class="small">7 Kapitel · ca. 25 Minuten · Lehrbuch S. 64–68</p></div></div>`;
 m.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{NAME=$('#nm').value.trim();L=b.dataset.l;document.documentElement.lang=L;render();});
 setNext(true,U.start);
}
function rMC(m,s){
 let first=true;
 const isP=s.t==='profi';
 m.innerHTML=`<div class="card">${head(s)}${s.say?`<div class="say"><div class="av">${s.say.av}</div><div class="bub"><div class="who">${s.say.who}</div>${X(s.q)}</div></div>`:`<div class="q">${s.n?`${U.qOf[0]} ${s.n}/6 · `:''}${X(s.q)}</div>`}
 <div class="opts ${isP?'profi':''}">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div><div id="fb"></div>${merke(s.merke)&&''}</div></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const o=s.o[+b.dataset.i];
  if(o.ok){b.classList.add('ok');m.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   if(first){isP?bonus++:addPts(1);if(isP)addPts(0);}
   $('#fb').innerHTML=`<div class="fb good">✅ <b>${X(U.right)}</b>${s.good?X(s.good):''}</div>${merke(s.merke)}`;confetti();setNext(true);}
  else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(o.fb||U.wrong)}</div>`;}
 });
 setNext(isP,isP?U.skip:U.next);
}
function rMulti(m,s){
 let first=true,sel=new Set();
 m.innerHTML=`<div class="card">${head(s)}${say(s.say,s.q)}<p class="small">${X(U.pick2)}</p>
 <div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div>
 <p style="text-align:center"><button class="btn sec" id="chk">${X(U.check)}</button></p><div id="fb"></div></div></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;b.classList.remove('no');if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}else if(sel.size<2){sel.add(i);b.classList.add('sel')}});
 $('#chk').onclick=()=>{
  if(sel.size<2)return;
  const ok=[...sel].every(i=>s.o[i].ok);
  if(ok){m.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(s.o[i].ok)b.classList.add('ok')});$('#chk').disabled=true;if(first)addPts(1);$('#fb').innerHTML=`<div class="fb good">✅ <b>${X(U.right)}</b>${X(s.good)}</div>`;confetti();setNext(true);}
  else{first=false;[...sel].forEach(i=>{if(!s.o[i].ok){const b=m.querySelector(`.opt[data-i="${i}"]`);b.classList.remove('sel');b.classList.add('no');sel.delete(i);}});$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
 };
 setNext(false);
}
function rPyr(m,s){
 let cur=0,miss=false;
 const order=s.lv.map((_,i)=>i).sort(()=>Math.random()-.5);
 function draw(){
  const w=i=>40+i*9; // Breite in %
  m.innerHTML=`<div class="card">${head(s)}<div class="q">${X(s.q)}</div>
  <div class="pyr">${s.lv.map((l,i)=>`<div class="lvl ${i<cur?'fill':(i===cur?'cur':'')}" style="width:${w(6-i)}%;${i<cur?'background:'+l[2]:''}"><small>${i+1} · ${l[0][0]}${L!=='de'?' · '+l[0][LI[L]]:''}</small>${i<cur?l[1][0]:(i===cur?'?':'')}</div>`).join('')}</div>
  ${cur<7?`<p class="small" style="text-align:center">${U.level[0]} ${cur+1}: <b>${s.lv[cur][0][0]}</b> – ${U.which[0]}${L!=='de'?` · ${U.level[LI[L]]} ${cur+1}: ${s.lv[cur][0][LI[L]]} – ${U.which[LI[L]]}`:''}</p>
  <div class="chips">${order.filter(i=>i>=cur).map(i=>`<button class="chip" data-i="${i}">${X(s.lv[i][1])}</button>`).join('')}</div>`
  :`<div class="fb good">✅ <b>${X(U.right)}</b>${X(s.good)}</div>${merke(s.merke)}`}<div id="fb"></div></div></div>`;
  m.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
   if(+b.dataset.i===cur){if(!miss)addPts(1);miss=false;cur++;draw();if(cur===7){confetti();setNext(true);}}
   else{miss=true;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);}
  });
 }
 draw(); setNext(false);
}
function rShops(m,s){
 let i=0,phase=0,first=true,ans=[];
 const quad=(b,d)=>b?(d?'c2':'c4'):(d?'c1':'c3');
 const QL={c1:["tief + schmal","sâu + hẹp","derin + dar","عميقة + ضيّقة"],c2:["tief + breit","sâu + rộng","derin + geniş","عميقة + واسعة"],c3:["flach + schmal","nông + hẹp","sığ + dar","سطحية + ضيّقة"],c4:["flach + breit","nông + rộng","sığ + geniş","سطحية + واسعة"]};
 function cross(){return `<div class="cross">${['c1','c2','c3','c4'].map(c=>`<div class="${c}"><div class="lab">${QL[c][0]}${L!=='de'?' · '+QL[c][LI[L]]:''}</div>${ans.filter(a=>a.q===c).map(a=>`<span class="tag">${a.s}</span>`).join('')}</div>`).join('')}</div>`;}
 function draw(){
  const sh=s.sh[i];
  let body;
  if(i<s.sh.length){
   const q=phase===0?s.qb:s.qd, o=phase===0?s.ob:s.od;
   body=`<div class="small">${i+1} / ${s.sh.length}</div><div class="shop">${X(sh.n)}</div><div class="q">${X(q)}</div>
   <div class="row2">${o.map((a,k)=>`<button class="opt" data-k="${k}">${X(a)}</button>`).join('')}</div><div id="fb"></div>`;
  } else body=`<div class="fb good">✅ ${X(s.good)}</div>`;
  m.innerHTML=`<div class="card">${head(s)}${body}${cross()}</div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k, right=phase===0?sh.b:sh.d;
   if(k===right){if(first)addPts(1);first=true;b.classList.add('ok');
     if(phase===0){phase=1;setTimeout(draw,450);}else{ans.push({s:sh.s,q:quad(sh.b,sh.d)});phase=0;i++;setTimeout(()=>{draw();if(i===s.sh.length){confetti();setNext(true);}},450);}}
   else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
  });
 }
 draw(); setNext(false);
}
function rSort(m,s){
 let i=0,first=true,placed=[];
 function draw(){
  let body;
  if(i<s.it.length) body=`<div class="small">${i+1} / ${s.it.length}</div><div class="shop">${X(s.it[i].a)}</div>
   <div class="cats">${s.cats.map((c,k)=>`<button class="opt" data-k="${k}">${X(c)}</button>`).join('')}</div><div id="fb"></div>`;
  else body=`<div class="fb good">✅ <b>${X(U.right)}</b></div>${merke(s.merke)}`;
  m.innerHTML=`<div class="card">${head(s)}${body}${placed.length?`<div style="margin-top:.8rem">${placed.map(p=>`<span class="tag">${p}</span>`).join(' ')}</div>`:''}</div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k;
   if(k===s.it[i].c){if(first)addPts(1);first=true;b.classList.add('ok');placed.push(s.it[i].a[0].split(' ')[0]+' → '+s.cats[k][0].split(' – ')[0]);i++;setTimeout(()=>{draw();if(i===s.it.length){confetti();setNext(true);}},450);}
   else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
  });
 }
 draw(); setNext(false);
}
function rBranch(m,s){
 let first=true;
 function menu(){
  m.innerHTML=`<div class="card">${head(s)}${s.p.map(a=>`<p>${X(a)}</p>`).join('')}${say(s.say[0],s.say[1])}
  <div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div></div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const o=s.o[+b.dataset.i];
   if(o.ok){if(first)addPts(1);m.querySelector('.body').insertAdjacentHTML('beforeend',`<div class="fb good">✅ ${X(s.good)}</div>${lk(s.lk)}`);m.querySelectorAll('.opt').forEach(x=>{x.disabled=true});b.classList.add('ok');confetti();setNext(true);}
   else{first=false;m.innerHTML=`<div class="card">${head(s)}<div class="fb bad" style="font-size:1.05rem">⏩ ${X(o.fb)}</div><p style="text-align:center;margin-top:1rem"><button class="btn sec" id="bk">↩ ${X(U.back)}</button></p></div></div>`;$('#bk').onclick=menu;}
  });
  setNext(false);
 }
 menu();
}
function rEnd(m){
 const pct=score/MAX, st=pct>=.9?'⭐⭐⭐':pct>=.7?'⭐⭐':pct>=.5?'⭐':'';
 const d=new Date().toLocaleDateString('de-DE');
 m.innerHTML=`<div class="card"><img class="hero" src="${IMG.s1}" alt=""><div class="body"><div class="cert">
 <div class="badge">🏅</div><h1>${X(["Geschafft! Du bist jetzt Sortiments-Profi im Kaufhaus Seestern.","Hoàn thành! Bây giờ bạn là chuyên gia bộ hàng hóa ở cửa hàng Seestern.","Başardın! Artık Seestern Mağazası'nda ürün yelpazesi uzmanısın.","أنجزت! أنت الآن خبير تشكيلة في متجر زيشتيرن."])}</h1>
 <p style="font-size:1.3rem;font-weight:800">${NAME||''}</p>
 <div class="stars">${st}</div>
 <div class="score">${score} / ${MAX}${bonus?` + ${bonus} ⭐ Profi-Bonus`:''}</div><p class="small">${X(U.first)}</p>
 <p class="small">LF 1 · Modul 8 · ${d}</p></div>
 <p style="text-align:center">${X(U.show)}</p>
 <p style="text-align:center"><button class="btn sec" id="again">🔄 ${X(U.again)}</button></p></div></div>`;
 $('#again').onclick=()=>{score=0;bonus=0;step=0;$('#pts').textContent='⭐ 0';render();};
 confetti(); setNext(false); $('#next').style.display='none';
}
$('#next').onclick=()=>{
 if(S[step].t==='start'){const n=$('#nm');NAME=n?n.value.trim():'';}
 if(step<S.length-1){step++;$('#next').style.display='';render();}
};
$('#langBtn').onclick=()=>{const k=Object.keys(LI);L=k[(k.indexOf(L)+1)%4];document.documentElement.lang=L;
 if(S[step].t==='start'||S[step].t==='story'||S[step].t==='end')render();else{ /* Aufgabe: nur Texte neu, Fortschritt bleibt erhalten */ toast('🌐 '+({de:'Nur Deutsch',vi:'Tiếng Việt',tr:'Türkçe',ar:'العربية'})[L]+' – ab der nächsten Seite');}};
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1f3b5c;color:#fff;padding:.5rem 1rem;border-radius:12px;z-index:20;font-weight:700';document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
render();
</script>
</body>
</html>
