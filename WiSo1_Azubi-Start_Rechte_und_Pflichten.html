<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azubi-Start Rechte und Pflichten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Idee: Hafen-Routenkarte mit 9 Stopps; große, ruhige Flächen für die digitale Tafel; Signalorange nur für Handlung. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --ink:#10212c; --muted:#4d6370; --line:#cbd8e0;
  --sea:#0e4d6e; --sea-2:#d9eaf3; --accent:#d9480f; --accent-ink:#ffffff;
  --ok:#1b7a47; --ok-bg:#dff3e6; --warn:#8a5a00; --warn-bg:#fff0c2; --bad:#b52f27; --bad-bg:#fbe0dd;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --f-head:"Bricolage Grotesque","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a22; --surface:#13252f; --ink:#e9f1f5; --muted:#9eb4c0; --line:#2b4452;
    --sea:#7cc2e8; --sea-2:#1b3947; --accent:#ff7a3d; --accent-ink:#1a0d05;
    --ok:#5fd18b; --ok-bg:#12392a; --warn:#f2c14e; --warn-bg:#3b3010; --bad:#ff8479; --bad-bg:#47201d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a22; --surface:#13252f; --ink:#e9f1f5; --muted:#9eb4c0; --line:#2b4452;
  --sea:#7cc2e8; --sea-2:#1b3947; --accent:#ff7a3d; --accent-ink:#1a0d05;
  --ok:#5fd18b; --ok-bg:#12392a; --warn:#f2c14e; --warn-bg:#3b3010; --bad:#ff8479; --bad-bg:#47201d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.5}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0 0 .5em;text-wrap:balance;color:var(--ink)}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.2rem;font-weight:600}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* Kopf */
.top{background:var(--sea);color:#fff;position:sticky;top:0;z-index:20}
:root[data-theme="dark"] .top, :root:not([data-theme="light"]) .top{--topbg:var(--surface)}
.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:800;font-size:1.15rem;display:flex;gap:10px;align-items:center}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700}
.tool:hover{background:rgba(255,255,255,.28)}
.tool[aria-pressed="true"]{background:#fff;color:#0e4d6e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#0f2f40}}
:root[data-theme="dark"] .top{background:#0f2f40}

/* Route */
.route{background:var(--surface);border-bottom:1px solid var(--line)}
.route ol{list-style:none;margin:0;padding:10px 0;display:flex;gap:6px;overflow-x:auto}
.route li{flex:1 0 auto}
.stop{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;text-align:left;white-space:nowrap;font-size:.9rem;display:flex;gap:8px;align-items:center}
.stop b{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--sea-2);color:var(--sea);font-size:.85rem}
.stop[aria-current="step"]{border-color:var(--accent);background:var(--surface);font-weight:700}
.stop[aria-current="step"] b{background:var(--accent);color:var(--accent-ink)}
.stop.done b{background:var(--ok);color:#fff}

main{padding:22px 0 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.lead{font-size:1.2rem;color:var(--ink)}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--sea-2);color:var(--sea);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.85rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* Abstimmen / Quickfire */
.stage{text-align:center}
.bigcard{background:var(--sea-2);border-radius:18px;padding:24px 20px;margin:12px auto 16px;max-width:760px}
.bigcard .pic{font-size:4.2rem;line-height:1}
.bigcard .txt{font-size:1.45rem;font-weight:700;margin-top:10px}
.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ch{min-width:200px;border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 18px;font-weight:700;font-size:1.1rem}
.ch:hover:not([disabled]){border-color:var(--sea)}
.ch.k-gruen{border-color:var(--ok)} .ch.k-gelb{border-color:#c98d00} .ch.k-rot{border-color:var(--bad)}
.ch.right{background:var(--ok-bg);border-color:var(--ok)}
.ch.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ch[disabled]{cursor:default}
.fb{max-width:760px;margin:16px auto 0;text-align:left;border-radius:12px;padding:14px 18px;border-left:8px solid}
.fb.good{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb strong{display:block;font-size:1.1rem}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.now{outline:3px solid var(--accent);outline-offset:1px}
.dot.ok{background:var(--ok)} .dot.no{background:var(--bad)}
.hint{font-size:.95rem;color:var(--muted)}

/* Reihenfolge */
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.pool,.placed{display:flex;flex-direction:column;gap:10px}
.ocard{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:1.05rem;font-weight:700;width:100%}
.ocard .pic{font-size:2rem}
.ocard:hover{border-color:var(--sea)}
.ocard.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pl{display:flex;gap:12px;background:var(--ok-bg);border-left:8px solid var(--ok);border-radius:12px;padding:10px 14px}
.pl .n{font-family:var(--f-head);font-weight:800;font-size:1.6rem;color:var(--ok);min-width:1.6rem}
.pl small{display:block;font-weight:400;color:var(--ink)}
.slot{border:3px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted)}

/* Spiel */
.meter{height:26px;background:var(--line);border-radius:999px;overflow:hidden;max-width:560px;margin:6px auto}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),#e0a100,var(--ok));transition:width .6s}
.opt{display:block;width:100%;text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:1.1rem}
.opt:hover:not([disabled]){border-color:var(--sea)}
.opt.picked.b{border-color:var(--bad);background:var(--bad-bg)}
.opt.picked.g{border-color:var(--ok);background:var(--ok-bg)}
.opt.picked.m{border-color:#c98d00;background:var(--warn-bg)}
.opt .L{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--sea-2);color:var(--sea);font-weight:800;margin-right:10px}

/* Tabellen, Info */
table{border-collapse:collapse;width:100%;font-size:.98rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--sea-2);color:var(--ink)}
.tablewrap{overflow-x:auto}
details.vert{border:2px dashed var(--accent);border-radius:12px;padding:10px 14px;margin-top:14px;background:var(--surface)}
details.vert summary{cursor:pointer;font-weight:700;color:var(--accent)}
.info{background:var(--warn-bg);border-left:8px solid #c98d00;border-radius:10px;padding:12px 16px;margin:12px 0}
.wort{background:var(--sea-2);border-radius:10px;padding:10px 14px;margin:12px 0}
.wort b{color:var(--sea)}

/* Ampel Selbsteinschätzung */
.amp{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.amp .q{font-weight:700}
.lights{display:flex;gap:6px}
.light{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-weight:800}
.light.r.on{background:var(--bad);border-color:var(--bad);color:#fff}
.light.y.on{background:#e0a100;border-color:#e0a100;color:#1a1200}
.light.g.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.9rem;margin-right:4px}
.chip.r{background:var(--bad-bg);color:var(--bad)} .chip.y{background:var(--warn-bg);color:var(--warn)} .chip.g{background:var(--ok-bg);color:var(--ok)} .chip.n{background:var(--line);color:var(--muted)}

/* Quiz */
.qb{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.qb legend{font-weight:700;padding:0 6px}
.qb label{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}
.qb label:hover{background:var(--sea-2)}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:90px}
.score{font-family:var(--f-head);font-size:3.4rem;font-weight:800;color:var(--accent);line-height:1}
.res{border-left:8px solid;border-radius:10px;padding:10px 14px;margin-bottom:8px}
.res.ok{background:var(--ok-bg);border-color:var(--ok)} .res.no{background:var(--bad-bg);border-color:var(--bad)}

/* Lehrkraft */
#teacher{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:20px 0 60px}
#teacher[hidden]{display:none}

.pass{border:3px solid var(--sea);border-radius:18px;padding:22px;background:var(--surface)}
.pass label.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pass label.row span{min-width:150px;font-weight:700}
.vor{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.vor label{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px;gap:10px}
svg.scene{width:100%;height:auto;border-radius:14px;display:block}

body.tafel{--muted:var(--ink)}
body.tafel .bigcard .txt{font-size:1.8rem}
@media (max-width:560px){h1{font-size:1.6rem}.ch{min-width:100%}.amp{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span aria-hidden="true">⚓</span> Azubi-Start: Rechte und Pflichten</div>
    <div class="tools">
      <button class="tool" data-a="zoom" data-v="-1" title="Schrift kleiner">A−</button>
      <button class="tool" data-a="zoom" data-v="1" title="Schrift größer">A+</button>
      <button class="tool" id="tafelBtn" data-a="tafel" aria-pressed="false">Tafel-Modus</button>
      <button class="tool" data-a="teach">Für die Lehrkraft</button>
    </div>
  </div>
</header>
<nav class="route" aria-label="Stationen"><div class="wrap"><ol id="route"></ol></div></nav>
<main><div class="wrap" id="view"></div></main>
<div class="foot"><div class="wrap">
  <button class="btn sec" id="prev" data-a="prev">← Zurück</button>
  <span class="hint" id="where"></span>
  <button class="btn" id="next" data-a="next">Weiter →</button>
</div></div>

<aside id="teacher" hidden aria-label="Lehrkraft-Ansicht">
  <div class="wrap" id="teacherBody"></div>
</aside>

<script>
/* ============ Daten ============ */
const STOPS=[
 {id:'start',label:'Start'},
 {id:'fall',label:'Der Fall'},
 {id:'s1',label:'Recht oder Pflicht'},
 {id:'s2',label:'Krank am Morgen'},
 {id:'s3',label:'Pausen-Ampel'},
 {id:'s4',label:'Hilfe und Treppe'},
 {id:'spiel',label:'Probezeit-Spiel'},
 {id:'check',label:'Selbst-Check'},
 {id:'pass',label:'Starterpass'}
];

const ICAN=[
 'Ich kann meine wichtigsten Rechte als Azubi nennen.',
 'Ich kann meine wichtigsten Pflichten als Azubi nennen.',
 'Ich weiß, was ich tun muss, wenn ich krank bin.',
 'Ich weiß, wie ich mich bei Pausen und Toilettengängen richtig verhalte.',
 'Ich weiß, wo ich Hilfe bekomme, wenn es beim Lernen oder im Betrieb nicht läuft.',
 'Ich kann erklären, wie es zu einer Kündigung kommt und wie ich sie vermeide.'
];

const QUICK={
 s1:{title:'Recht oder Pflicht?',hint:'Die Klasse entscheidet per Handzeichen. Dann klickt die Lehrkraft die Antwort.',
  choices:[{k:'recht',l:'Das ist mein Recht'},{k:'pflicht',l:'Das ist meine Pflicht'}],
  items:[
   {e:'💶',t:'Ich bekomme jeden Monat Ausbildungsvergütung.',a:'recht',w:'Der Betrieb muss dich bezahlen (§ 17 Berufsbildungsgesetz, BBiG).'},
   {e:'⏰',t:'Ich komme pünktlich zur Arbeit und zur Schule.',a:'pflicht',w:'Pünktlichkeit gehört zu deinen Pflichten aus dem Ausbildungsvertrag.'},
   {e:'🏫',t:'Ich werde für die Berufsschule freigestellt.',a:'recht',w:'Der Betrieb muss dich zur Berufsschule gehen lassen (§ 15 BBiG).'},
   {e:'📓',t:'Ich führe mein Berichtsheft (Ausbildungsnachweis).',a:'pflicht',w:'Das Berichtsheft ist Pflicht (§ 13 BBiG). Der Betrieb sieht es regelmäßig durch.'},
   {e:'🌴',t:'Ich habe Anspruch auf bezahlten Urlaub.',a:'recht',w:'Wie viele Tage, steht in deinem Ausbildungsvertrag. Für Jugendliche gilt das Jugendarbeitsschutzgesetz.'},
   {e:'🤫',t:'Ich erzähle keine Betriebsgeheimnisse weiter.',a:'pflicht',w:'Schweigepflicht: Zahlen, Preise und Kundendaten bleiben im Betrieb (§ 13 BBiG).'},
   {e:'📚',t:'Ich werde im Betrieb wirklich ausgebildet, nach dem Ausbildungsplan.',a:'recht',w:'Der Betrieb muss dir alles beibringen, was du für die Prüfung brauchst (§ 14 BBiG).'},
   {e:'🤒',t:'Ich melde mich sofort, wenn ich krank bin.',a:'pflicht',w:'Das verlangt das Entgeltfortzahlungsgesetz (§ 5 EFZG).'},
   {e:'📜',t:'Ich bekomme am Ende ein Zeugnis.',a:'recht',w:'Der Betrieb stellt dir nach der Ausbildung ein Zeugnis aus (§ 16 BBiG).'},
   {e:'🤝',t:'Ich bin höflich zu Kunden und Team und halte die Regeln des Betriebs ein.',a:'pflicht',w:'Die Betriebsordnung zu beachten ist deine Pflicht (§ 13 BBiG).'}
  ]},
 s2:{title:'Mythos oder Wahrheit?',hint:'Wahr oder falsch? Erst abstimmen, dann klicken.',
  choices:[{k:'wahr',l:'Stimmt'},{k:'falsch',l:'Stimmt nicht'}],
  items:[
   {e:'💬',t:'Wenn ich krank bin, reicht eine WhatsApp an einen Kollegen.',a:'falsch',w:'Du musst den Betrieb selbst informieren, sofort und so, wie dein Betrieb es verlangt. Meist ist das ein Anruf bei der zuständigen Person.'},
   {e:'1️⃣',t:'Ich muss mich auch melden, wenn ich nur einen Tag fehle.',a:'wahr',w:'Jeder Fehltag wird gemeldet, auch ein einzelner.'},
   {e:'🩺',t:'Dauert die Krankheit länger als 3 Kalendertage, brauche ich ein Attest vom Arzt.',a:'wahr',w:'Das Attest muss dann spätestens am nächsten Arbeitstag vorliegen. Der Betrieb darf es auch schon ab dem ersten Tag verlangen (§ 5 EFZG).'},
   {e:'🏫',t:'An einem Schultag reicht es, nur den Betrieb zu informieren.',a:'falsch',w:'Du informierst auch die Schule, so wie eure Schule es vorgibt (z. B. Klassenleitung).'},
   {e:'✅',t:'Wenn ich wieder gesund bin, sage ich Bescheid und hole Verpasstes nach.',a:'wahr',w:'Dazu gehört: Berichtsheft ergänzen und den Schulstoff nacharbeiten.'}
  ]},
 s3:{title:'Pausen-Ampel',hint:'Grün = okay. Gelb = nur nach Absprache. Rot = geht nicht.',
  choices:[{k:'gruen',l:'Grün: okay'},{k:'gelb',l:'Gelb: Absprache'},{k:'rot',l:'Rot: geht nicht'}],
  items:[
   {e:'🚻',t:'Ich sage kurz Bescheid und gehe 3 Minuten zur Toilette.',a:'gruen',w:'Toilettengänge sind selbstverständlich. Kurz absprechen, zügig zurückkommen.'},
   {e:'📱',t:'Ich bleibe 20 Minuten auf der Toilette und spiele am Handy.',a:'rot',w:'Das fällt auf. Du fehlst während der Arbeitszeit. Das kostet Vertrauen und kann zur Abmahnung führen.'},
   {e:'🚬',t:'Ich gehe „kurz“ rauchen, ohne etwas zu sagen. Kunden warten.',a:'rot',w:'Rauchen gehört in die feste Pause. Unter 18 ist Rauchen und Dampfen nach dem Jugendschutzgesetz ohnehin verboten.'},
   {e:'☕',t:'Ich mache meine Pause zu der Zeit, die mein Team festgelegt hat.',a:'gruen',w:'Pausenzeiten legt der Betrieb fest. So bleibt der Laden besetzt.'},
   {e:'📲',t:'Mein privates Handy: Ich schreibe kurz zwischen zwei Kunden.',a:'gelb',w:'Das regelt dein Betrieb. Frag vorher nach den Regeln. Beim Kunden nie.'},
   {e:'🚌',t:'Mein Bus fällt aus. Ich rufe an und sage, dass ich 15 Minuten später komme.',a:'gruen',w:'Anrufen ist richtig. Noch besser: einen früheren Bus nehmen, damit es nicht passiert.'}
  ]},
 s4:{title:'Wer hilft mir?',hint:'Wohin gehst du zuerst? Klasse stimmt ab.',
  choices:[{k:'lehr',l:'Lehrkraft / Klassenleitung'},{k:'aus',l:'Ausbilder/in im Betrieb'},{k:'kammer',l:'Ausbildungsberatung der Kammer (IHK)'}],
  items:[
   {e:'😕',t:'Ich verstehe den Stoff in der Berufsschule nicht.',a:'lehr',w:'Frag früh nach. Deine Lehrkraft zeigt dir Lernhilfen. Auch Lernpartner in der Klasse helfen. Über die Berufsschule kannst du außerdem kostenlos Nachhilfe beantragen. Sprich deine Lehrkraft ruhig an!'},
   {e:'🧽',t:'Ich werde nur zum Putzen und Kistenschleppen eingesetzt.',a:'aus',w:'Sprich zuerst ruhig mit deinem Ausbilder. Zeig auf den Ausbildungsplan. Hilft das nicht, geht es weiter zur Kammer.'},
   {e:'😤',t:'Ich habe Streit im Betrieb, und das Gespräch mit dem Ausbilder hilft nicht.',a:'kammer',w:'Die Ausbildungsberatung der Kammer vermittelt kostenlos und neutral.'},
   {e:'📓',t:'Mein Berichtsheft ist 3 Wochen im Rückstand.',a:'aus',w:'Sag ehrlich Bescheid und mach mit dem Ausbilder einen Plan. Der Betrieb sieht das Berichtsheft sowieso durch.'}
  ]}
};

const ORDER={
 s2:{title:'Krank am Morgen: Was tue ich in welcher Reihenfolge?',
  steps:[
   {e:'📞',t:'Vor Arbeitsbeginn im Betrieb anrufen',w:'Name sagen, krank melden, sagen wie lange es vermutlich dauert.'},
   {e:'🏫',t:'Schule informieren (wenn Schultag)',w:'So, wie es eure Schule vorgibt, zum Beispiel bei der Klassenleitung.'},
   {e:'🩺',t:'Zum Arzt gehen und Attest holen',w:'Pflicht ab dem 4. Kalendertag. Manche Betriebe wollen es schon ab Tag 1.'},
   {e:'🔁',t:'Bei längerer Krankheit erneut melden',w:'Dauert es länger als gedacht, rufst du wieder an.'},
   {e:'🏠',t:'Wieder gesund: Bescheid sagen und nachholen',w:'Berichtsheft ergänzen, Schulstoff nacharbeiten.'}
  ]},
 s4:{title:'Die Treppe zur Kündigung (nach der Probezeit, wegen Verhalten)',
  steps:[
   {e:'🗣️',t:'Gespräch: Der Betrieb spricht das Problem an',w:'Hier kannst du noch alles ändern.'},
   {e:'📄',t:'Abmahnung: schriftliche Warnung',w:'Sie nennt den Fehler und droht mit Kündigung.'},
   {e:'🔂',t:'Der gleiche Fehler passiert noch einmal',w:'Jetzt ist das Vertrauen stark beschädigt.'},
   {e:'❌',t:'Kündigung durch den Betrieb',w:'Nach der Probezeit braucht der Betrieb einen wichtigen Grund (§ 22 BBiG).'}
  ]}

function ampelHTML(ph){
  return '<div class="amp">'+ICAN.map((q,k)=>{
    const v=ampel[ph][k]||0;
    return `<div class="q">${q}</div><div class="lights" role="group" aria-label="${q}">
      <button class="light r ${v===1?'on':''}" data-a="amp" data-ph="${ph}" data-k="${k}" data-v="1" aria-pressed="${v===1}" title="Noch nicht">1</button>
      <button class="light y ${v===2?'on':''}" data-a="amp" data-ph="${ph}" data-k="${k}" data-v="2" aria-pressed="${v===2}" title="Ein bisschen">2</button>

  }).join('')+'</div>';
}

function quickHTML(id){
  const c=QUICK[id], s=G['q'+id]||(G['q'+id]={i:0,sel:null,res:[]});
  const n=c.items.length;
  const dots='<div class="dots">'+c.items.map((_,i)=>`<span class="dot ${i===s.i?'now':''} ${s.res[i]===true?'ok':s.res[i]===false?'no':''}"></span>`).join('')+'</div>';
  if(s.i>=n){
    const ok=s.res.filter(Boolean).length;
    const bad=c.items.map((it,i)=>s.res[i]?'':`<li>${it.e} ${it.t} <b>→ ${c.choices.find(x=>x.k===it.a).l}</b></li>`).join('');
    return `<div class="stage">${dots}<h3>Geschafft: ${ok} von ${n} richtig</h3>${bad?`<div class="fb bad"><strong>Das wiederholen wir noch einmal:</strong><ul>${bad}</ul></div>`:'<div class="fb good"><strong>Alles richtig. Starke Klasse.</strong></div>'}<div class="actions" style="justify-content:center"><button class="btn sec" data-a="qr" data-g="${id}">Nochmal spielen</button></div></div>`;
  }
  const it=c.items[s.i], done=s.sel!==null;
  const btns=c.choices.map(ch=>{
    let cl='ch k-'+ch.k;
    if(done){ if(ch.k===it.a) cl+=' right'; else if(ch.k===s.sel) cl+=' wrong'; }
    return `<button class="${cl}" data-a="q" data-g="${id}" data-c="${ch.k}" ${done?'disabled':''}>${ch.l}</button>`;
  }).join('');
  const fb=done?`<div class="fb ${s.sel===it.a?'good':'bad'}" role="status"><strong>${s.sel===it.a?'Richtig!':'Nicht ganz.'}</strong>${it.w}</div><div class="actions" style="justify-content:center"><button class="btn" data-a="qn" data-g="${id}">${s.i===n-1?'Ergebnis zeigen':'Nächste Karte'}</button></div>`:'';
  return `<div class="stage">${dots}<p class="hint">${c.hint}</p><div class="bigcard"><div class="pic" aria-hidden="true">${it.e}</div><div class="txt">${it.t}</div></div><div class="choices">${btns}</div>${fb}</div>`;
}

function orderHTML(id){
  const c=ORDER[id], s=G['o'+id]||(G['o'+id]={pool:shuffle(c.steps.map((_,i)=>i)),placed:0,err:0,msg:''});
  const placedHTML=c.steps.slice(0,s.placed).map((st,i)=>`<div class="pl"><span class="n">${i+1}</span><div><b>${st.e} ${st.t}</b><small>${st.w}</small></div></div>`).join('');
  const slot=s.placed<c.steps.length?`<div class="slot">Platz ${s.placed+1}: Welche Karte kommt jetzt?</div>`:'';
  const pool=s.pool.filter(i=>i>=s.placed).map(i=>`<button class="ocard" id="oc-${id}-${i}" data-a="o" data-g="${id}" data-i="${i}"><span class="pic" aria-hidden="true">${c.steps[i].e}</span><span>${c.steps[i].t}</span></button>`).join('');
  const done=s.placed>=c.steps.length;
  return `<h3>${c.title}</h3><p class="hint">Die Klasse einigt sich, welche Karte als Nächstes kommt. Dann klickt die Lehrkraft.</p>
   <div class="order"><div><h3>Karten</h3><div class="pool">${done?'<div class="fb good"><strong>Fertig!</strong>Fehlversuche: '+s.err+'</div>':pool}</div></div>
   <div><h3>Richtige Reihenfolge</h3><div class="placed">${placedHTML}${slot}</div>${s.msg&&!done?`<div class="fb bad" role="status"><strong>Noch nicht.</strong>${s.msg}</div>`:''}</div></div>
   ${done?`<div class="actions"><button class="btn sec" data-a="or" data-g="${id}">Nochmal mischen</button></div>`:''}`;
}

function sceneHTML(){
  const s=G.spiel||(G.spiel={i:0,trust:60,pick:null,log:[]});
  const bar=`<div class="stage"><h3>Vertrauen deines Ausbilders: ${s.trust} von 100</h3><div class="meter" role="img" aria-label="Vertrauen ${s.trust} von 100"><i style="width:${s.trust}%"></i></div></div>`;
  if(s.i>=SCENES.length){
    const t=s.trust;
    const verdict=t>=90?['Übernahme in Sicht','Euer Ausbilder sagt: „Auf euch kann ich mich verlassen.“ Probezeit bestanden.']:t>=65?['Probezeit bestanden mit Luft nach oben','Es gibt ein ehrliches Gespräch. Mit ein paar Änderungen läuft es gut.']:['Gelbe Karte','Es gibt eine Abmahnung. Spielt noch einmal und probiert andere Wege.'];
    return `${bar}<div class="card stage"><div class="pic" style="font-size:3.5rem" aria-hidden="true">${t>=90?'🏆':t>=65?'👍':'⚠️'}</div><h2>${verdict[0]}</h2><p class="lead">${verdict[1]}</p><div class="actions" style="justify-content:center"><button class="btn sec" data-a="dr">Nochmal spielen</button></div></div>`;
  }
  const sc=SCENES[s.i], done=s.pick!==null;
  const opts=sc.o.map((o,k)=>`<button class="opt ${done&&s.pick===k?'picked '+o.c:''}" data-a="d" data-o="${k}" ${done?'disabled':''}><span class="L">${'ABC'[k]}</span>${o.t}</button>`).join('');
  const picked=done?sc.o[s.pick]:null;
  const fb=done?`<div class="fb ${picked.c==='g'?'good':'bad'}" role="status"><strong>${picked.d>0?'+':''}${picked.d} Vertrauen</strong>${picked.f}</div><div class="actions"><button class="btn" data-a="dn">${s.i===SCENES.length-1?'Ergebnis zeigen':'Nächste Szene'}</button></div>`:'';
  return `${bar}<div class="card"><span class="tag">Szene ${s.i+1} von ${SCENES.length}</span><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="font-size:4rem" aria-hidden="true">${sc.e}</div><div style="flex:1;min-width:240px"><h2>${sc.h}</h2><p class="lead">${sc.t}</p></div></div><p class="hint">Klasse berät kurz in Zweierteams, dann Handzeichen für A, B oder C.</p>${opts}${fb}</div>`;
}

function checkHTML(){

    const rows=q.rows.map(r=>`<div class="res ${r.ok?'ok':'no'}"><b>${r.ok?'Richtig':'Falsch'}:</b> ${r.q}${r.ok?'':`<br><b>Richtig wäre:</b> ${r.right}<br><span class="hint">Wiederholen: ${r.s}</span>`}</div>`).join('');

  }
  const mc=MC.map((m,i)=>`<fieldset class="qb"><legend>${i+1}. ${m.q}</legend>${m.o.map((o,k)=>`<label><input type="radio" name="q${i}" value="${k}"> ${o}</label>`).join('')}</fieldset>`).join('');

/* ============ Rendern ============ */
function render(){
  $('#route').innerHTML=STOPS.map((s,i)=>`<li><button class="stop ${i<step?'done':''}" data-a="go" data-to="${i}" ${i===step?'aria-current="step"':''}><b>${i<step?'✓':i+1}</b>${s.label}</button></li>`).join('');
  $('#view').innerHTML=VIEWS[STOPS[step].id]();
  $('#prev').disabled=step===0; $('#next').disabled=step===STOPS.length-1;
  $('#where').textContent=`Schritt ${step+1} von ${STOPS.length}`;
  try{history.replaceState(null,'','#'+STOPS[step].id)}catch(e){}
  window.scrollTo(0,0);
}
function rerender(sel,html){const el=$(sel);if(el){const y=window.scrollY;el.innerHTML=html;window.scrollTo(0,y)}else render()}
function refresh(){const y=window.scrollY;$('#view').innerHTML=VIEWS[STOPS[step].id]();window.scrollTo(0,y)}

/* ============ Aktionen ============ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, d=b.dataset;
  if(a==='go'){step=+d.to;render()}
  else if(a==='next'){if(step<STOPS.length-1){step++;render()}}
  else if(a==='prev'){if(step>0){step--;render()}}
  else if(a==='zoom'){scale=Math.min(160,Math.max(80,scale+10*(+d.v)));document.documentElement.style.fontSize=scale+'%'}
  else if(a==='tafel'){const on=!document.body.classList.contains('tafel');document.body.classList.toggle('tafel',on);b.setAttribute('aria-pressed',on);scale=on?135:100;document.documentElement.style.fontSize=scale+'%'}
  else if(a==='teach'){const t=$('#teacher');if(t.hidden){$('#teacherBody').innerHTML=teacherHTML();t.hidden=false;t.scrollTop=0}else t.hidden=true}
  else if(a==='amp'){ampel[d.ph][+d.k]=+d.v;refresh()}
  else if(a==='rev'){G.fallReveal[+d.i]=true;refresh()}
  else if(a==='q'){const s=G['q'+d.g];if(s.sel!==null)return;s.sel=d.c;s.res[s.i]=(d.c===QUICK[d.g].items[s.i].a);refresh()}
  else if(a==='qn'){const s=G['q'+d.g];s.i++;s.sel=null;refresh()}
  else if(a==='qr'){delete G['q'+d.g];refresh()}
  else if(a==='o'){const s=G['o'+d.g],i=+d.i;if(i===s.placed){s.placed++;s.msg=''}else{s.err++;s.msg='Das passiert erst später. Was kommt zuerst?';}refresh();if(i!==s.placed-1){const el=document.getElementById('oc-'+d.g+'-'+i);if(el){el.classList.add('shake')}}}
  else if(a==='or'){delete G['o'+d.g];refresh()}
  else if(a==='d'){const s=G.spiel;if(s.pick!==null)return;s.pick=+d.o;s.trust=Math.max(0,Math.min(100,s.trust+SCENES[s.i].o[s.pick].d));refresh()}
  else if(a==='dn'){const s=G.spiel;s.i++;s.pick=null;refresh()}
  else if(a==='dr'){delete G.spiel;refresh()}
  else if(a==='ev'){evaluate()}
  else if(a==='qre'){delete G.quiz;refresh()}
  else if(a==='muster'){const m=$('#muster');if(m)m.hidden=!m.hidden}
  else if(a==='copy'){copyPass()}
  else if(a==='img'){savePassImage()}
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.dataset) return;
  if(t.dataset.a==='pf'){(G.pass||(G.pass={v:[]}))[t.dataset.f]=t.value}
  else if(t.dataset.a==='nm'){G.quiz.name=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset||t.dataset.a!=='vs')return;
  const p=G.pass||(G.pass={v:[]}),i=+t.dataset.i;
  if(t.checked){if(p.v.length>=3){t.checked=false;$('#cpmsg').textContent='Du hast schon 3 Vorsätze gewählt. Nimm einen wieder weg.';return}p.v.push(i)}
  else p.v=p.v.filter(x=>x!==i);
  $('#cpmsg').textContent='';
});

function evaluate(){
  const rows=[];let pts=0;
  for(let i=0;i<MC.length;i++){
    const sel=document.querySelector(`input[name="q${i}"]:checked`);
    const ok=!!sel&&+sel.value===MC[i].a; if(ok)pts++;
    rows.push({ok,q:MC[i].q,right:MC[i].o[MC[i].a],s:MC[i].s});
  }
  for(let i=0;i<GAPS.length;i++){
    const v=document.getElementById('l'+i).value;
    const ok=v===GAPS[i].a; if(ok)pts++;
    rows.push({ok,q:`Lückentext: „${(GAPS[i].pre+'___'+GAPS[i].post).trim()}“`,right:GAPS[i].a,s:'Stationen 1 bis 4'});
  }
  const open=MC.filter((m,i)=>!document.querySelector(`input[name="q${i}"]:checked`)).length+GAPS.filter((g,i)=>!document.getElementById('l'+i).value).length;
  if(open>0&&!confirm_ok(open))return;
  G.quiz={done:true,pts,rows,name:''};refresh();
}
let _warned=false;
function confirm_ok(n){ // ohne confirm() (im Frame blockiert): erst warnen, beim 2. Klick auswerten
  if(_warned){_warned=false;return true}
  _warned=true;$('#evmsg').textContent=`Noch ${n} Antwort(en) offen. Klicke noch einmal auf „Auswerten“, um trotzdem abzugeben.`;return false;
}


function savePassImage(){
  const p=G.pass||{v:[]},m=$('#cpmsg');
  if(p.v.length<3){m.textContent='Wähle zuerst 3 wichtigste Vorsätze aus.';return}
  const W=1080,H=1720,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F='system-ui,-apple-system,"Segoe UI",Arial,sans-serif';
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
  const wrap=(t,px,py,mw,lh)=>{const ws=t.split(' ');let l='';for(const w of ws){const n=l?l+' '+w:w;if(x.measureText(n).width>mw&&l){x.fillText(l,px,py);py+=lh;l=w}else l=n}x.fillText(l,px,py);return py+lh};
  let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0e4d6e');g.addColorStop(1,'#1c7fa8');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(W-60,80,260,0,7);x.fill();x.beginPath();x.arc(40,H-40,300,0,7);x.fill();
  x.fillStyle='#fff';rr(50,50,W-100,H-100,40);x.fill();
  g=x.createLinearGradient(50,0,W-50,0);g.addColorStop(0,'#0e4d6e');g.addColorStop(1,'#1c7fa8');x.fillStyle=g;
  x.save();rr(50,50,W-100,230,40);x.clip();x.fillRect(50,50,W-100,230);x.restore();
  x.fillStyle='#ffb347';x.fillRect(50,270,W-100,10);
  x.fillStyle='#fff';x.font='bold 30px '+F;x.fillText('⚓  AUSBILDUNG STARTKLAR',100,115);
  x.font='bold 78px '+F;x.fillText('Azubi-Starterpass',100,205);

  rows.forEach((r,i)=>{x.fillStyle=i%2?'#ffffff':'#eef3f6';x.fillRect(90,y-38,W-180,58);x.fillStyle='#4d6370';x.font='bold 24px '+F;x.fillText(r[0],110,y);x.fillStyle='#10212c';x.font='28px '+F;x.fillText((r[1]||'').slice(0,34),420,y);y+=58});

  x.fillStyle='#fde8dc';rr(90,y,W-180,430,24);x.fill();x.fillStyle='#d9480f';x.fillRect(90,y+20,10,390);

  y+=470;
  x.fillStyle='#0e4d6e';x.font='bold 36px '+F;x.fillText('⭐ Meine wichtigsten Vorsätze',100,y+20);y+=55;
  x.font='28px '+F;
  p.v.forEach(i=>{x.fillStyle='#d9ebf5';rr(90,y,W-180,100,18);x.fill();x.fillStyle='#0e4d6e';x.beginPath();x.arc(140,y+50,24,0,7);x.fill();x.fillStyle='#fff';x.font='bold 30px '+F;x.fillText('✓',128,y+60);x.fillStyle='#10212c';x.font='28px '+F;wrap(VORSAETZE[i],185,y+42,W-320,34);y+=116});

}

function copyPass(){
  const p=G.pass||{v:[]};
  const txt=`AZUBI-STARTERPASS\nName: ${p.n||''}\nBetrieb: ${p.b||''}\nAusbilder/in: ${p.a||''}\nTelefon Betrieb: ${p.t||''}\nTelefon Schule: ${p.s||''}\nLehrkraft: ${p.l||''}\nKontakt Lehrkraft: ${p.k||''}\n\nWenn ich krank bin:\n1. Vor Arbeitsbeginn im Betrieb anrufen\n2. Schule informieren (Schultag)\n3. Arzt, Attest ab dem 4. Kalendertag\n4. Bei längerer Krankheit wieder melden\n5. Gesund: Bescheid sagen, nachholen\n\nMeine wichtigsten Vorsätze:\n${p.v.map(i=>'- '+VORSAETZE[i]).join('\n')}`;
  const m=$('#cpmsg');
  try{navigator.clipboard.writeText(txt).then(()=>m.textContent='Kopiert.',()=>m.textContent='Kopieren nicht möglich. Mache stattdessen einen Screenshot.')}
  catch(err){m.textContent='Kopieren nicht möglich. Mache stattdessen einen Screenshot.'}
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='ArrowRight')$('#next').click();
  if(e.key==='ArrowLeft')$('#prev').click();
});
render();
