.big{font-size:1.1rem}

 body{background:#fff;padding:0;font-size:11pt}

t → zu viel Ware.", "Die [[Renner-Penner-Liste]] zeigt gut und schlecht verkaufte Artikel."], "q": {"q": "Zu viel erfasst – was passiert?", "o": ["zu spät bestellt → Präsenzlücke", "zu früh bestellt → zu viel Ware", "nichts"], "a": 0}}, {"k": "task", "id": "a2", "n": "Aufgabe 2", "h": "Der Fehler-Detektiv", "intro": "Ein Mitarbeiter tippt 70 ein. Was passiert?", "tip": "Immer die Kette denken: falscher Bestand → falscher Bestellzeitpunkt → falsches Regal.", "sit": "<p>Mikrowellen „Wave“: Absatz 3 Stück/Tag, Lieferzeit 2 Tage, Mindestbestand 6 → Meldebestand 12. Geliefert: 30 Geräte.</p>", "items": [{"t": "calc", "id": "a2.1", "q": "Um wie viel Stück ist der Soll-Bestand zu hoch?", "a": 40, "unit": "Stück", "steps": ["70 − 30 = 40 Stück"]}, {"t": "tf", "id": "a2.2", "q": "Richtig oder falsch?", "rows": [["Der Meldebestand (12) wird im WWS erst viel später erreicht.", true], ["Das WWS korrigiert den Fehler automatisch.", false], ["Im Laden sind die Geräte nach etwa 6 Tagen weg – das WWS bestellt nicht.", true]]}]}, {"k": "task", "id": "a3", "n": "Aufgabe 3", "h": "Was muss im WWS geändert werden?", "intro": "Ergänze: Welche Größe ist betroffen, was passiert?", "tip": "Zu viel erfasst = zu spät bestellt. Zu wenig erfasst = zu früh bestellt.", "items": [{"t": "sel", "id": "a3.1", "q": "Was muss geändert werden?", "o": ["Soll-Bestand|المخزون المفترض|tồn kho theo sổ sách|olması gereken stok", "Preise im Artikelstamm|الأسعار في البيانات الأساسية للأصناف|giá trong dữ liệu gốc mặt hàng|ürün ana verilerindeki fiyatlar", "Soll-Bestand beider Artikel|المخزون المفترض للصنفين|tồn kho theo sổ sách của cả hai mặt hàng|her iki ürünün olması gereken stoku"], "rows": [["Eine Massagerolle fällt herunter und ist unverkäuflich.", 0], ["Mangelhafte Hemden werden an den Lieferer zurückgeschickt.", 0], ["80 Fitnessbänder werden bei Fitnessmatten erfasst.", 2], ["Für eine Aktion sinken die Preise.", 1]]}, {"t": "mc", "id": "a3.2", "q": "Statt 25 werden nur 10 Kinderhosen erfasst.", "o": ["zu früh bestellt → zu viel Ware", "zu spät bestellt → Präsenzlücke", "nichts"], "a": 0}]}, {"k": "task", "id": "a4", "n": "Aufgabe 4", "h": "WWS-Fehler finden", "intro": "Löse die Aufgaben im Prüfungsformat. Die letzte kommt aus Modul 8.", "tip": "Das WWS korrigiert Fehler nicht automatisch.", "items": [{"t": "mc", "id": "a4.1", "q": "4.1 Sie haben 30 Mikrowellen ordnungsgemäß angenommen und geben versehentlich 70 als Liefermenge ein. Welche Auswirkung hat das?", "o": ["Bei automatischem Bestellsystem kann es zu Verkaufsstockungen kommen.", "Das WWS signalisiert zum richtigen Zeitpunkt die richtige Bestellmenge.", "Das WWS korrigiert den Fehler automatisch.", "Das WWS zeigt den richtigen Ist-Bestand.", "Es kommt nicht zu Verkaufsstockungen."], "a": 0}, {"t": "mc", "id": "a4.2", "q": "4.2 Statt 25 Kinderhosen werden nur 10 als Zugang erfasst. Welche Folge hat der Fehler?", "o": ["Nichts, da das Regal voll ist.", "Nichts, da beim Meldebestand neu bestellt wird.", "Nichts, das WWS korrigiert automatisch.", "Es kann zu Problemen mit der Lagerkapazität kommen, da beim Erreichen des Meldebestands bestellt wird.", "Die Hosen müssen zurückgeschickt werden."], "a": 3}, {"t": "mc", "id": "a4.3", "q": "4.3 Wozu dient eine Renner-Penner-Liste?", "o": ["Sie zeigt, welche Artikel schnell verkauft werden müssen (MHD).", "Sie zeigt, welche Artikel lange geführt werden müssen.", "Sie gibt Auskunft über den Zustand der Ware.", "Sie bietet Bestellvorschläge an.", "Sie gibt einen Überblick über gut und weniger gut verkaufte Artikel."], "a": 4}, {"t": "free", "id": "a4.4", "q": "4.4 In letzter Zeit gibt es häufiger leere Regale (Präsenzlücken). Nenne eine sinnvolle Maßnahme mit WWS-Daten.", "model": "Die Verkaufszahlen genau analysieren und als Grundlage für Bestellungen nutzen (Meldebestand anpassen)."}, {"t": "calc", "id": "a4.5", "q": "4.5 Alt (Modul 8): Fracht 70,00 € für Äpfel: Jonagold 210 kg, Golden Delicious 140 kg, Boskoop 150 kg – nach Gewicht. Anteil Golden Delicious?", "a": 19.6, "unit": "€", "steps": ["500 kg → 0,14 € je kg", "140 × 0,14 = 19,60 €"]}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Bestellvorschlag kritisch prüfen", "intro": "Ein Mensch prüft den Vorschlag: Stimmt der Bestand (Fehler, Diebstahl)? Gibt es eine Aktion, Saison, ein Fest?", "tip": "Interne Daten wie Einkaufspreise, Konditionen, Kalkulation, Beschaffungswege und Mitarbeiterprovisionen gehören zur Schweigepflicht – an Kunden gibt man nur Produktinformationen weiter (Inhaltsstoffe, Material).", "items": [{"t": "free", "id": "a5.1", "q": "5.1 Das WWS schlägt für Grillkohle 40 Säcke vor (Meldebestand erreicht). Nenne drei Gründe, warum die Abteilungsleiterin den Vorschlag ändern könnte.", "model": "Wetterbericht (Hitzewelle → mehr), Saisonende (weniger), Sonderaktion/Fest (mehr), Lagerkapazität, bekannter Erfassungsfehler oder Diebstahl (Ist ≠ Soll), Lieferer kündigt längere Lieferzeit an."}, {"t": "free", "id": "a5.2", "q": "5.2 Ein Kunde fragt, zu welchem Preis die Nordstadt-Kauf GmbH die Ware einkauft und wie viel Provision der Verkäufer bekommt. Begründe, warum du das nicht sagst, und formuliere eine freundliche Antwort.", "model": "Einkaufskonditionen und Provisionen unterliegen der Schweigepflicht (Betriebsgeheimnis). „Das sind interne Zahlen, die darf ich nicht weitergeben. Aber ich erkläre Ihnen gern, was das Produkt besonders macht.“"}]}]};
var TR={"title": ["Hệ thống quản lý hàng hóa II – sử dụng dữ liệu", "", "", "", "", "", "نظام إدارة البضائع II – استخدام البيانات", "Stok yönetim sistemi II – verileri kullanmak"], "can.0": ["phân biệt tồn kho theo sổ sách và tồn kho thực tế, và giải thích khi nào phải thay đổi tồn kho theo sổ sách.", "", "", "", "", "", "التمييز بين المخزون المفترض والمخزون الفعلي وشرح متى يجب تغيير المخزون المفترض.", "olması gereken stok ile fiili stoku ayırt etmek ve olması gereken stokun ne zaman değiştirilmesi gerektiğini açıklamak."], "can.1": ["dự đoán hậu quả của lỗi nhập liệu trong WWS (nhập quá nhiều → kệ trống, nhập quá ít → quá nhiều hàng).", "", "", "", "", "", "التنبؤ بعواقب أخطاء الإدخال في نظام إدارة البضائع (تسجيل زائد ← فجوة عرض، تسجيل ناقص ← بضاعة زائدة).", "WWS'deki giriş hatalarının sonuçlarını tahmin etmek (fazla girildi → raf boşluğu, az girildi → fazla mal)."], "can.2": ["giải thích WWS đề xuất hoặc tạo đơn hàng như thế nào theo phương pháp điểm đặt hàng – và tại sao con người phải kiểm tra đề xuất.", "", "", "", "", "", "شرح كيف يقترح النظام الطلبات أو يطلقها في طريقة نقطة الطلب – ولماذا يفحص الإنسان الاقتراح.", "WWS'nin sipariş noktası yönteminde siparişleri nasıl önerdiğini veya verdiğini açıklamak – ve insanın öneriyi neden kontrol ettiğini."], "can.3": ["nói được danh sách hàng bán chạy – bán chậm và các phân tích khác của WWS dùng để làm gì (mua hàng, hoa hồng, chương trình giá).", "", "", "", "", "", "أن أقول لماذا تُستخدم قائمة الأكثر والأقل مبيعاً وتحليلات النظام الأخرى (الشراء، العمولة، عروض الأسعار).", "çok satan – az satan listesinin ve diğer WWS değerlendirmelerinin ne için kullanıldığını söylemek (satın alma, komisyon, fiyat kampanyaları)."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Mức tồn kho báo đặt hàng = lượng bán mỗi ngày × thời gian giao hàng (tính bằng ngày) + tồn kho tối thiểu", "", "", "", "", "", "مخزون إعادة الطلب = المبيعات اليومية × مدة التوريد (بالأيام) + الحد الأدنى للمخزون", "Sipariş noktası stoku = günlük satış × teslim süresi (gün) + minimum stok"], "a1.1.q": ["1.2 Tính mức tồn kho báo đặt hàng: bán 10 gói/ngày, thời gian giao hàng 5 ngày, tồn kho tối thiểu 40 gói. (Mô-đun 2)", "", "", "", "", "", "1.2 احسب مخزون إعادة الطلب: المبيعات 10 علب/يوم، مدة التوريد 5 أيام، الحد الأدنى للمخزون 40 علبة. (الوحدة 2)", "1.2 Sipariş noktası stokunu hesapla: satış 10 paket/gün, teslim süresi 5 gün, minimum stok 40 paket. (Modül 2)"], "a1.1.w": ["Em quên tồn kho tối thiểu.", "", "", "", "", "", "نسيت الحد الأدنى للمخزون.", "Minimum stoku unuttun."], "a1.2.q": ["1.1 Mã GTIN chứa những thông tin gì? Có giá trong đó không? (Mô-đun 3)", "", "", "", "", "", "1.1 ما المعلومات الموجودة في رمز GTIN؟ هل السعر موجود فيه؟ (الوحدة 3)", "1.1 GTIN kodunda hangi bilgiler var? Fiyat içinde mi? (Modül 3)"], "a1.2.o0": ["quốc gia, nhà sản xuất, mã hàng, chữ số kiểm tra – không có giá", "", "", "", "", "", "البلد، المنتِج، رقم الصنف، رقم التحقق – بدون سعر", "ülke, üretici, ürün numarası, kontrol hanesi – fiyat yok"], "a1.2.o1": ["quốc gia, nhà sản xuất và giá", "", "", "", "", "", "البلد، المنتِج والسعر", "ülke, üretici ve fiyat"], "a1.3.q": ["1.3 Mua theo yêu cầu gọi hàng là gì? (Mô-đun 12)", "", "", "", "", "", "1.3 ما هو الشراء عند الطلب؟ (الوحدة 12)", "1.3 Çağrıya bağlı satış nedir? (Modül 12)"], "a1.3.o0": ["mua số lượng lớn, để ở kho nhà cung cấp, gọi giao từng phần theo nhu cầu", "", "", "", "", "", "شراء كمية كبيرة، تخزينها لدى المورد، واستدعاء كميات جزئية حسب الحاجة", "büyük miktar satın almak, tedarikçide depolamak, ihtiyaca göre kısmi miktarlar çağırmak"], "a1.3.o1": ["giao hàng ngay sau khi ký hợp đồng", "", "", "", "", "", "التوريد فوراً بعد إبرام العقد", "sözleşmeden hemen sonra teslimat"], "a1.3.o2": ["Hàng phải đúng y như mẫu.", "", "", "", "", "", "يجب أن تطابق البضاعة العيّنة تماماً.", "Mal tam olarak numuneye uymalıdır."], "r1.h": ["Đọc thêm: Làm việc với dữ liệu WWS (Sách giáo khoa tr. 20 và bảng thuật ngữ tr. 204)", "", "", "", "", "", "للقراءة: العمل ببيانات نظام إدارة البضائع (الكتاب ص 20 والمسرد ص 204)", "Okuma: WWS verileriyle çalışmak (Ders kitabı s. 20 ve sözlük s. 204)"], "r1.s": ["WWS không tự động sửa lỗi.", "", "", "", "", "", "نظام إدارة البضائع لا يصحح الأخطاء تلقائياً.", "WWS hataları otomatik olarak düzeltmez."], "r1.p0": ["Tồn kho theo sổ sách là tồn kho theo WWS. Tồn kho thực tế là tồn kho đã đếm.", "", "", "", "", "", "المخزون المفترض هو المخزون حسب النظام. المخزون الفعلي هو المخزون المعدود.", "Olması gereken stok WWS’ye göre stoktur. Fiili stok sayılmış stoktur."], "r1.p1": ["Nhập quá nhiều = đặt hàng quá muộn → kệ trống. Nhập quá ít = đặt hàng quá sớm → quá nhiều hàng.", "", "", "", "", "", "تسجيل زائد = طلب متأخر ← فجوة عرض. تسجيل ناقص = طلب مبكر ← بضاعة زائدة.", "Fazla girildi = çok geç sipariş → raf boşluğu. Az girildi = çok erken sipariş → fazla mal."], "r1.p2": ["Danh sách hàng bán chạy – bán chậm cho thấy mặt hàng bán tốt và bán kém.", "", "", "", "", "", "قائمة الأكثر والأقل مبيعاً تُظهر الأصناف المبيعة جيداً وسيئاً.", "Çok satan – az satan listesi iyi ve kötü satan ürünleri gösterir."], "r1.qq": ["Nhập quá nhiều – điều gì xảy ra?", "", "", "", "", "", "تسجيل زائد – ماذا يحدث؟", "Fazla girildi – ne olur?"], "r1.q.o0": ["đặt hàng quá muộn → kệ trống", "", "", "", "", "", "طلب متأخر ← فجوة عرض", "çok geç sipariş → raf boşluğu"], "r1.q.o1": ["đặt hàng quá sớm → quá nhiều hàng", "", "", "", "", "", "طلب مبكر ← بضاعة زائدة", "çok erken sipariş → fazla mal"], "r1.q.o2": ["không có gì", "", "", "", "", "", "لا شيء", "hiçbir şey"], "a2.h": ["Thám tử tìm lỗi", "", "", "", "", "", "محقق الأخطاء", "Hata dedektifi"], "a2.i": ["Một nhân viên gõ nhầm 70. Điều gì xảy ra?", "", "", "", "", "", "موظف يكتب 70. ماذا يحدث؟", "Bir çalışan 70 yazıyor. Ne olur?"], "a2.t": ["Luôn nghĩ theo chuỗi: tồn kho sai → thời điểm đặt hàng sai → kệ hàng sai.", "", "", "", "", "", "فكّر دائماً في السلسلة: مخزون خاطئ ← وقت طلب خاطئ ← رف خاطئ.", "Her zaman zinciri düşün: yanlış stok → yanlış sipariş zamanı → yanlış raf."], "a2.1.q": ["Tồn kho theo sổ sách cao hơn bao nhiêu cái?", "", "", "", "", "", "بكم قطعة المخزون المفترض أعلى من اللازم؟", "Olması gereken stok kaç adet fazla?"], "a2.2.q": ["Đúng hay sai?", "", "", "", "", "", "صحيح أم خطأ؟", "Doğru mu yanlış mı?"], "a2.2.r0": ["Mức báo đặt hàng (12) trong WWS bị đạt muộn hơn nhiều.", "", "", "", "", "", "يُبلغ مخزون إعادة الطلب (12) في النظام بعد وقت أطول بكثير.", "Sipariş noktası stokuna (12) WWS'de çok daha geç ulaşılır."], "a2.2.r1": ["WWS tự động sửa lỗi.", "", "", "", "", "", "النظام يصحح الخطأ تلقائياً.", "WWS hatayı otomatik olarak düzeltir."], "a2.2.r2": ["Tại cửa hàng, máy hết sau khoảng 6 ngày – WWS không đặt hàng.", "", "", "", "", "", "في المتجر تنفد الأجهزة بعد حوالي 6 أيام – والنظام لا يطلب.", "Mağazada cihazlar yaklaşık 6 gün sonra bitiyor – WWS sipariş vermiyor."], "a3.h": ["Phải thay đổi gì trong WWS?", "", "", "", "", "", "ما الذي يجب تغييره في النظام؟", "WWS’de ne değiştirilmeli?"], "a3.i": ["Điền vào: Đại lượng nào bị ảnh hưởng, điều gì xảy ra?", "", "", "", "", "", "أكمل: أي قيمة متأثرة، وماذا يحدث؟", "Tamamla: Hangi büyüklük etkileniyor, ne oluyor?"], "a3.t": ["Nhập quá nhiều = đặt hàng quá muộn. Nhập quá ít = đặt hàng quá sớm.", "", "", "", "", "", "تسجيل زائد = طلب متأخر. تسجيل ناقص = طلب مبكر.", "Fazla girildi = çok geç sipariş. Az girildi = çok erken sipariş."], "a3.1.q": ["Phải thay đổi gì?", "", "", "", "", "", "ما الذي يجب تغييره؟", "Ne değiştirilmeli?"], "a3.1.r0": ["Một con lăn massage rơi xuống và không bán được.", "", "", "", "", "", "تسقط أسطوانة تدليك وتصبح غير قابلة للبيع.", "Bir masaj rulosu düşüyor ve satılamaz hale geliyor."], "a3.1.r1": ["Áo sơ mi bị lỗi được gửi trả lại nhà cung cấp.", "", "", "", "", "", "تُعاد قمصان معيبة إلى المورد.", "Kusurlu gömlekler tedarikçiye geri gönderiliyor."], "a3.1.r2": ["80 dây tập được nhập vào mục thảm tập.", "", "", "", "", "", "تُسجل 80 حزام لياقة عند حصائر اللياقة.", "80 fitness bandı fitness matlarına kaydediliyor."], "a3.1.r3": ["Giá giảm cho một chương trình khuyến mãi.", "", "", "", "", "", "تنخفض الأسعار من أجل عرض.", "Bir kampanya için fiyatlar düşüyor."], "a3.2.q": ["Chỉ nhập 10 quần trẻ em thay vì 25.", "", "", "", "", "", "تُسجل 10 بناطيل أطفال فقط بدلاً من 25.", "25 yerine sadece 10 çocuk pantolonu kaydediliyor."], "a3.2.o0": ["đặt hàng quá sớm → quá nhiều hàng", "", "", "", "", "", "طلب مبكر ← بضاعة زائدة", "çok erken sipariş → fazla mal"], "a3.2.o1": ["đặt hàng quá muộn → kệ trống", "", "", "", "", "", "طلب متأخر ← فجوة عرض", "çok geç sipariş → raf boşluğu"], "a3.2.o2": ["không có gì", "", "", "", "", "", "لا شيء", "hiçbir şey"], "a4.h": ["Tìm lỗi WWS", "", "", "", "", "", "إيجاد أخطاء النظام", "WWS hatalarını bulmak"], "a4.i": ["Giải các bài tập theo dạng đề thi. Bài cuối lấy từ Mô-đun 8.", "", "", "", "", "", "حل المهام بصيغة الامتحان. الأخيرة من الوحدة 8.", "Görevleri sınav formatında çöz. Sonuncusu Modül 8'den."], "a4.t": ["WWS không tự động sửa lỗi.", "", "", "", "", "", "نظام إدارة البضائع لا يصحح الأخطاء تلقائياً.", "WWS hataları otomatik olarak düzeltmez."], "a4.1.q": ["4.1 Anh/chị đã nhận đúng 30 lò vi sóng nhưng nhập nhầm số lượng giao là 70. Điều đó gây ảnh hưởng gì?", "", "", "", "", "", "4.1 استلمتم 30 ميكروويف بشكل صحيح وأدخلتم خطأً 70 ككمية توريد. ما تأثير ذلك؟", "4.1 30 mikrodalgayı usulüne uygun teslim aldınız ve yanlışlıkla teslim miktarı olarak 70 girdiniz. Bunun etkisi nedir?"], "a4.1.o0": ["Với hệ thống đặt hàng tự động có thể xảy ra đình trệ bán hàng.", "", "", "", "", "", "مع نظام طلب آلي قد يحدث توقف في المبيعات.", "Otomatik sipariş sisteminde satış durgunlukları olabilir."], "a4.1.o1": ["WWS báo đúng lượng đặt hàng vào đúng thời điểm.", "", "", "", "", "", "يُشير النظام في الوقت الصحيح إلى كمية الطلب الصحيحة.", "WWS doğru zamanda doğru sipariş miktarını bildirir."], "a4.1.o2": ["WWS tự động sửa lỗi.", "", "", "", "", "", "النظام يصحح الخطأ تلقائياً.", "WWS hatayı otomatik olarak düzeltir."], "a4.1.o3": ["WWS hiển thị đúng tồn kho thực tế.", "", "", "", "", "", "النظام يُظهر المخزون الفعلي الصحيح.", "WWS doğru fiili stoku gösterir."], "a4.1.o4": ["Không xảy ra đình trệ bán hàng.", "", "", "", "", "", "لا يحدث توقف في المبيعات.", "Satış durgunluğu olmaz."], "a4.2.q": ["4.2 Thay vì 25 quần trẻ em, chỉ nhập 10 cái vào kho. Lỗi này gây hậu quả gì?", "", "", "", "", "", "4.2 بدلاً من 25 بنطال أطفال تُسجل 10 فقط كوارد. ما نتيجة الخطأ؟", "4.2 25 çocuk pantolonu yerine sadece 10'u giriş olarak kaydediliyor. Hatanın sonucu nedir?"], "a4.2.o0": ["Không có gì, vì kệ đầy.", "", "", "", "", "", "لا شيء، لأن الرف ممتلئ.", "Hiçbir şey, çünkü raf dolu."], "a4.2.o1": ["Không có gì, vì sẽ đặt lại khi đạt mức báo đặt hàng.", "", "", "", "", "", "لا شيء، لأنه يُعاد الطلب عند مخزون إعادة الطلب.", "Hiçbir şey, çünkü sipariş noktası stokunda yeniden sipariş verilir."], "a4.2.o2": ["Không có gì, WWS tự động sửa.", "", "", "", "", "", "لا شيء، النظام يصحح تلقائياً.", "Hiçbir şey, WWS otomatik düzeltir."], "a4.2.o3": ["Có thể xảy ra vấn đề về sức chứa của kho, vì khi đạt mức báo đặt hàng sẽ đặt hàng.", "", "", "", "", "", "قد تحدث مشاكل في سعة المخزن، لأنه يتم الطلب عند الوصول إلى مخزون إعادة الطلب.", "Depo kapasitesiyle ilgili sorunlar olabilir, çünkü sipariş noktası stokuna ulaşıldığında sipariş verilir."], "a4.2.o4": ["Phải gửi trả lại quần.", "", "", "", "", "", "يجب إعادة البناطيل.", "Pantolonlar geri gönderilmelidir."], "a4.3.q": ["4.3 Danh sách hàng bán chạy – bán chậm dùng để làm gì?", "", "", "", "", "", "4.3 ما فائدة قائمة الأكثر والأقل مبيعاً؟", "4.3 Çok satan – az satan listesi ne işe yarar?"], "a4.3.o0": ["Nó cho thấy mặt hàng nào phải bán nhanh (hạn sử dụng).", "", "", "", "", "", "تُظهر الأصناف التي يجب بيعها بسرعة (تاريخ الصلاحية).", "Hangi ürünlerin hızla satılması gerektiğini gösterir (son kullanma tarihi)."], "a4.3.o1": ["Nó cho thấy mặt hàng nào phải bán lâu dài.", "", "", "", "", "", g và hoa hồng nhân viên thuộc nghĩa vụ giữ bí mật – với khách hàng chỉ cung cấp thông tin sản phẩm (thành phần, chất liệu).", "", "", "", "", "", "البيانات الداخلية مثل أسعار الشراء والشروط والحساب وطرق الشراء وعمولات الموظفين تخضع لواجب الكتمان – للزبائن تُعطى فقط معلومات المنتج (المكونات، المادة).", "Alış fiyatları, koşullar, hesaplama, tedarik yolları ve çalışan komisyonları gibi iç veriler sır saklama yükümlülüğüne girer – müşterilere sadece ürün bilgisi verilir (içerik, malzeme)."], "a5.1.q": ["5.1 WWS đề xuất 40 bao than nướng (đã đạt mức báo đặt hàng). Nêu ba lý do tại sao trưởng bộ phận có thể thay đổi đề xuất.", "", "", "", "", "", "5.1 يقترح النظام 40 كيساً من فحم الشواء (تم الوصول إلى مخزون إعادة الطلب). اذكر ثلاثة أسباب قد تجعل رئيسة القسم تغيّر الاقتراح.", "5.1 WWS mangal kömürü için 40 çuval öneriyor (sipariş noktası stokuna ulaşıldı). Bölüm müdürünün öneriyi neden değiştirebileceğine üç neden söyle."], "a5.2.q": ["5.2 Một khách hàng hỏi công ty Nordstadt-Kauf GmbH mua hàng với giá bao nhiêu và nhân viên bán hàng được bao nhiêu hoa hồng. Giải thích tại sao em không nói, và viết một câu trả lời lịch sự.", "", "", "", "", "", "5.2 يسأل زبون بأي سعر تشتري شركة Nordstadt-Kauf GmbH البضاعة وكم عمولة يحصل عليها البائع. علّل لماذا لا تقول ذلك، وصُغ إجابة لطيفة.", "5.2 Bir müşteri Nordstadt-Kauf GmbH'nin malı hangi fiyata aldığını ve satıcının ne kadar komisyon aldığını soruyor. Bunu neden söylemediğini gerekçelendir ve nazik bir cevap yaz."]};

  if(fb)h+=fbBox(g.got?'ok':'no',g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+esc(it.o[it.a])+'</b>');
  break;
 case 'calc':
  g=grade(it);h=q+'<div class="row2"><input class="in" style="max-width:12rem" inputmode="decimal" autocomplete="off" data-act="calc" data-id="'+it.id+'" value="'+esc(v||'')+'"><b>'+esc(it.unit||'')+'</b></div>';
  if(fb){var trap='';if(!g.got&&it.traps){var nv=num(v==null?'':v);it.traps.forEach(function(t){if(nv!=null&&Math.abs(nv-t[0])<=0.006)trap='<div>⚠ '+esc(t[1])+'</div>'+tl(it.id+'.w')})}h+=fbBox(g.got?'ok':'no',(g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+r1(it.a)+' '+esc(it.unit||'')+'</b>')+trap+'<div><b>'+esc(UI.steps[0])+':</b><br>'+it.steps.map(esc).join('<br>')+'</div>'+tl_ui('steps'))}
  break;
 case 'table':
  g=grade(it);h=q+'<table class="tbl"><tr><th>'+(it.hd||'')+'</th>'+it.cols.map(function(c){return '<th class="c" title="'+esc(c[1]||'')+'">'+esc(c[0])+'</th>'}).join('')+'</tr>'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+it.cols.map(function(c,j){var cl=sel===j?' on':'';if(fb){if(j===r[1])cl+=sel===j?' ok':' sol';else if(sel===j)cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tb" data-id="'+it.id+'" data-r="'+i+'" data-i="'+j+'" aria-label="'+esc(c[1]||c[0])+'">'+esc(c[0])+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(it.legend)h+='<div class="meta">'+esc(it.legend)+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>'+tlo(it.id+'.g');
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p,pi){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'+tlo(b.id+'.p'+pi)}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }

window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
