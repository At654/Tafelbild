hnis aller Vermögensteile und Schulden","vi":"Inventur: Bestandsaufnahme durch Zählen, Messen, Wiegen; Inventar: Verzeichnis aller Vermögensteile und Schulden\n🇻🇳 Inventur: kiểm kê bằng cách đếm, đo, cân; Inventar: bảng kê tất cả tài sản và các khoản nợ"},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":1.5},{"id":"g1","no":"Aufgabe 2","title":{"de":"Ankommen: Wie oft passt der Einkauf in den Preis?","vi":"Ankommen: Wie oft passt der Einkauf in den Preis? · Khởi động: giá mua vào nằm trong giá bán bao nhiêu lần?"},"tip":{"de":"Was ist gegeben, was ist gesucht? Nach oben (zum Verkaufspreis) malnehmen, nach unten (zum Bezugspreis) teilen. Kalkulationsfaktor = Bruttoverkaufspreis : Bezugspreis. Der Faktor ist immer größer als 1.","vi":"Đề cho gì, hỏi gì? Tính lên (đến giá bán) thì nhân, tính xuống (đến Bezugspreis) thì chia. Kalkulationsfaktor = Bruttoverkaufspreis : Bezugspreis. Hệ số luôn lớn hơn 1."},"type":"calc","parts":[{"q":{"de":"Das Hemd: Bezugspreis 14,50 €, Bruttoverkaufspreis 27,69 € (Modul 4). Teile den Verkaufspreis durch den Bezugspreis. Runde auf 4 Stellen nach dem Komma.","vi":"Das Hemd: Bezugspreis 14,50 €, Bruttoverkaufspreis 27,69 € (Modul 4). Teile den Verkaufspreis durch den Bezugspreis. Runde auf 4 Stellen nach dem Komma.\n🇻🇳 Chiếc áo sơ mi: Bezugspreis 14,50 €, Bruttoverkaufspreis 27,69 € (mô-đun 4). Chia giá bán cho Bezugspreis. Làm tròn đến 4 chữ số sau dấu phẩy."},"u":"","a":1.9097,"tol":5e-05,"steps":[{"de":"27,69 : 14,50 = 1,9097 → Der Verkaufspreis ist etwa 1,9-mal so hoch wie der Einkauf.","vi":"27,69 : 14,50 = 1,9097 → Giá bán cao gấp khoảng 1,9 lần giá mua vào."}]}],"pts":0.5},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher · Wortspeicher (kho từ)"},"html":"<p>der Kalkulationsfaktor · der Kalkulationszuschlag · der Bezugspreis · der Bruttoverkaufspreis · rückwärts rechnen · die Nachkommastelle</p>","vi":"Kalkulationsfaktor = hệ số tính giá · Kalkulationszuschlag = tỉ lệ cộng thêm khi tính giá (%) · Bezugspreis = giá nhập hàng · Bruttoverkaufspreis = giá bán đã có thuế · rückwärts rechnen = tính ngược lại · Nachkommastelle = chữ số sau dấu phẩy"},{"id":"r1","no":"Lesen 1","type":"read","title":{"de":"Der Faktor ist eine Abkürzung","vi":"Der Faktor ist eine Abkürzung · Hệ số là một đường tắt"},"instr":{"de":"Markiere die drei Formeln.","vi":"Markiere die drei Formeln.\n🇻🇳 Đánh dấu ba công thức."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Der Faktor ist eine Abkürzung: Statt dreimal malzunehmen, nimmst du nur einmal mal. Den Kalkulationsfaktor berechnest du so: [[Bruttoverkaufspreis : Bezugspreis]]. Den Bruttoverkaufspreis berechnest du so: [[Bezugspreis · Kalkulationsfaktor]]. Rückwärts berechnest du den Bezugspreis so: [[Bruttoverkaufspreis : Kalkulationsfaktor]]. Du rechnest nie Bezugspreis : Bruttoverkaufspreis."],"vi":"Hệ số là một đường tắt: thay vì nhân ba lần, em chỉ nhân một lần. Kalkulationsfaktor được tính như sau: Bruttoverkaufspreis : Bezugspreis. Bruttoverkaufspreis được tính như sau: Bezugspreis · Kalkulationsfaktor. Tính ngược về Bezugspreis như sau: Bruttoverkaufspreis : Kalkulationsfaktor. Em không bao giờ tính Bezugspreis : Bruttoverkaufspreis.","quiz":{"q":{"de":"Hemd: Bezugspreis 14,50 €, Bruttoverkaufspreis 27,69 €. Wie groß ist der Kalkulationsfaktor?","vi":"Hemd: Bezugspreis 14,50 €, Bruttoverkaufspreis 27,69 €. Wie groß ist der Kalkulationsfaktor?\n🇻🇳 Áo sơ mi: Bezugspreis 14,50 €, Bruttoverkaufspreis 27,69 €. Kalkulationsfaktor bằng bao nhiêu?"},"o":["0,5237","1,9097","13,19"],"a":1,"why":{"de":"Richtig ist: 1,9097","vi":"Đáp án đúng: 1,9097"}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Faktor und Zuschlag","vi":"Faktor und Zuschlag · Faktor và Zuschlag"},"instr":{"de":"Markiere, wie du vom Faktor zum Zuschlag kommst und umgekehrt.","vi":"Markiere, wie du vom Faktor zum Zuschlag kommst und umgekehrt.\n🇻🇳 Đánh dấu cách đi từ Faktor sang Zuschlag và ngược lại."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Faktor und Zuschlag sind dasselbe in zwei Sprachen: Faktor 1,9097 entspricht Zuschlag 90,97 %. Vom Faktor zum Zuschlag: [[1 abziehen, mal 100]]. Vom Zuschlag zum Faktor: [[durch 100, plus 1]]. Bei der IHK beziehen sich Faktor und Zuschlag immer auf den [[Bruttoverkaufspreis]], nicht auf den Nettoverkaufspreis."],"vi":"Faktor và Zuschlag là cùng một thứ theo hai cách nói: Faktor 1,9097 ứng với Zuschlag 90,97 %. Từ Faktor sang Zuschlag: trừ 1, nhân 100. Từ Zuschlag sang Faktor: chia 100, cộng 1. Ở IHK, Faktor và Zuschlag luôn tính trên Bruttoverkaufspreis, không phải trên Nettoverkaufspreis.","quiz":{"q":{"de":"Kalkulationszuschlag 90 % – welcher Faktor?","vi":"Kalkulationszuschlag 90 % – welcher Faktor?\n🇻🇳 Kalkulationszuschlag 90 % – hệ số nào?"},"o":["0,9","1,9","90"],"a":1,"why":{"de":"Richtig ist: 1,9","vi":"Đáp án đúng: 1,9"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"Welche Richtung?","vi":"Welche Richtung? · Hướng nào?"},"instr":{"de":"Markiere, wann du malnimmst und wann du teilst.","vi":"Markiere, wann du malnimmst und wann du teilst.\n🇻🇳 Đánh dấu khi nào em nhân và khi nào em chia."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Sind Bezugspreis und Faktor gegeben, rechnest du nach oben: [[malnehmen]]. Sind Bruttoverkaufspreis und Faktor gegeben, rechnest du nach unten: [[teilen]]. Der Faktor ist immer [[größer als 1]]. Beim Faktor gibst du [[4 Stellen]] nach dem Komma an, wenn die Aufgabe nichts anderes sagt. Der Faktor ist nie kleiner als 1."],"vi":"Nếu đề cho Bezugspreis và Faktor thì em tính lên: nhân. Nếu đề cho Bruttoverkaufspreis và Faktor thì em tính xuống: chia. Faktor luôn lớn hơn 1. Với Faktor em ghi 4 chữ số sau dấu phẩy nếu đề không yêu cầu khác. Faktor không bao giờ nhỏ hơn 1.","quiz":{"q":{"de":"Gegeben: Bruttoverkaufspreis und Faktor. Gesucht: Bezugspreis. Wie rechnest du?","vi":"Gegeben: Bruttoverkaufspreis und Faktor. Gesucht: Bezugspreis. Wie rechnest du?\n🇻🇳 Cho: Bruttoverkaufspreis và Faktor. Tìm: Bezugspreis. Em tính thế nào?"},"o":["malnehmen","teilen","addieren"],"a":1,"why":{"de":"Richtig ist: teilen","vi":"Đáp án đúng: chia"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Faktor und Zuschlag am Beispiel Hemd</h4><p>Kalkulationsfaktor = Bruttoverkaufspreis : Bezugspreis (4 Stellen) · 27,69 : 14,50 = 1,9097</p><p>Bruttoverkaufspreis = Bezugspreis · Kalkulationsfaktor · 14,50 · 1,9097 = 27,69 €</p><p>Bezugspreis (rückwärts) = Bruttoverkaufspreis : Kalkulationsfaktor · 27,69 : 1,9097 = 14,50 €</p><p>Kalkulationszuschlag in % = (Bruttoverkaufspreis – Bezugspreis) : Bezugspreis · 100 · (27,69 – 14,50) : 14,50 · 100 = 90,97 %</p><p>Eselsbrücke: Faktor 1,9097 ↔ Zuschlag 90,97 %. Vom Faktor zum Zuschlag: 1 abziehen, mal 100. Vom Zuschlag zum Faktor: durch 100, plus 1 (90 % → 1,9).</p><p><b>Merke:</b> Der Faktor ist immer größer als 1. Beim Faktor 4 Stellen nach dem Komma angeben (wenn die Aufgabe nichts anderes sagt). Hochrechnen: mal. Zurückrechnen: geteilt.</p>","vi":"Faktor và Zuschlag qua ví dụ chiếc áo sơ mi\nKalkulationsfaktor = Bruttoverkaufspreis : Bezugspreis (4 chữ số) · 27,69 : 14,50 = 1,9097\nBruttoverkaufspreis = Bezugspreis · Kalkulationsfaktor · 14,50 · 1,9097 = 27,69 €\nBezugspreis (tính ngược) = Bruttoverkaufspreis : Kalkulationsfaktor · 27,69 : 1,9097 = 14,50 €\nKalkulationszuschlag theo % = (Bruttoverkaufspreis – Bezugspreis) : Bezugspreis · 100 · (27,69 – 14,50) : 14,50 · 100 = 90,97 %\nMẹo nhớ: Faktor 1,9097 ↔ Zuschlag 90,97 %. Từ Faktor sang Zuschlag: trừ 1, nhân 100. Từ Zuschlag sang Faktor: chia 100, cộng 1 (90 % → 1,9).\nGhi nhớ: Faktor luôn lớn hơn 1. Với Faktor ghi 4 chữ số sau dấu phẩy (nếu đề không yêu cầu khác). Tính lên: nhân. Tính ngược: chia."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: der Joghurt","vi":"Vorgemacht: der Joghurt · Làm mẫu: hộp sữa chua"},"html":"<p><b>Aufgabe der IHK:</b> Ein Joghurt wird für 0,75 € verkauft. Der Bezugspreis beträgt 0,42 €. Ermitteln Sie den Kalkulationsfaktor! (Ergebnis mit 4 Nachkommastellen)</p><p><b>Was ist gegeben?</b> Bruttoverkaufspreis 0,75 € und Bezugspreis 0,42 €</p><p><b>Formel:</b> Bruttoverkaufspreis : Bezugspreis</p><p><b>Rechnung:</b> 0,75 : 0,42 = 1,785714… → 1,7857 (5. Stelle ist eine 1, also abrunden)</p><p><b>Zuschlag dazu:</b> (1,7857 – 1) · 100 = 78,57 %</p><p><b>Prüfen:</b> Größer als 1? Ja. ✓</p>","vi":"Đề của IHK: Một hộp sữa chua được bán với giá 0,75 €. Bezugspreis là 0,42 €. Hãy tính Kalkulationsfaktor! (Kết quả có 4 chữ số sau dấu phẩy)\nĐề cho gì? Bruttoverkaufspreis 0,75 € và Bezugspreis 0,42 €\nCông thức: Bruttoverkaufspreis : Bezugspreis\nPhép tính: 0,75 : 0,42 = 1,785714… → 1,7857 (chữ số thứ 5 là 1 nên làm tròn xuống)\nZuschlag tương ứng: (1,7857 – 1) · 100 = 78,57 %\nKiểm tra: Lớn hơn 1? Đúng. ✓"},{"id":"g2","no":"Aufgabe 3","title":{"de":"Lückenschema: die Lampe","vi":"Lückenschema: die Lampe · Sơ đồ điền chỗ trống: chiếc đèn"},"instr":{"de":"Eine Lampe wird für 4,99 € verkauft. Der Bezugspreis beträgt 2,60 €. Das Schema ist dasselbe wie beim Joghurt.","vi":"Eine Lampe wird für 4,99 € verkauft. Der Bezugspreis beträgt 2,60 €. Das Schema ist dasselbe wie beim Joghurt.\n🇻🇳 Một chiếc đèn được bán với giá 4,99 €. Bezugspreis là 2,60 €. Sơ đồ giống như với hộp sữa chua."},"tip":{"de":"Was ist gegeben, was ist gesucht? Nach oben (zum Verkaufspreis) malnehmen, nach unten (zum Bezugspreis) teilen. Kalkulationsfaktor = Bruttoverkaufspreis : dukt?","vi":"Vertiefung: Warum ist der Faktor ein Produkt? · Nâng cao: vì sao hệ số là một tích?"},"instr":{"de":"Nur in der Ebene „Vertiefung“. Begründe in ganzen Sätzen. Diese Aufgaben geben Bonuspunkte und senken deine 20 Punkte nie.","vi":"Nur in der Ebene „Vertiefung“. Begründe in ganzen Sätzen. Diese Aufgaben geben Bonuspunkte und senken deine 20 Punkte nie.\n🇻🇳 Chỉ ở mức „Vertiefung“. Giải thích bằng câu đầy đủ. Các bài này cho điểm thưởng và không bao giờ làm giảm 20 điểm của em."},"level":"v","tip":{"de":"Überlege: Worauf bezieht sich der Prozentsatz – was sind hier 100 %? Begründe mit „weil“ und zeige es an einem Zahlenbeispiel.","vi":"Hãy nghĩ: số phần trăm này tính trên cái gì – ở đây 100 % là gì? Giải thích bằng „weil“ và cho thấy bằng một ví dụ số."},"type":"free","parts":[{"q":{"de":"Begründe allgemein: Warum gilt Kalkulationsfaktor = (1 + HK) · (1 + G) · (1 + USt)? (HK, G und USt als Dezimalzahl, z. B. 40 % = 0,4)","vi":"Begründe allgemein: Warum gilt Kalkulationsfaktor = (1 + HK) · (1 + G) · (1 + USt)? (HK, G und USt als Dezimalzahl, z. B. 40 % = 0,4)\n🇻🇳 Giải thích tổng quát: vì sao Kalkulationsfaktor = (1 + HK) · (1 + G) · (1 + USt)? (HK, G và USt là số thập phân, ví dụ 40 % = 0,4)"},"m":{"de":"Jeder Zuschlag wird auf das Ergebnis davor gerechnet: Selbstkosten = BP · (1 + HK), Nettoverkaufspreis = Selbstkosten · (1 + G), Bruttoverkaufspreis = NVP · (1 + USt). Eingesetzt: BVP = BP · (1 + HK) · (1 + G) · (1 + USt). Teilt man durch BP, bleibt der Faktor. Er hängt nicht vom Bezugspreis ab.","vi":"Jeder Zuschlag wird auf das Ergebnis davor gerechnet: Selbstkosten = BP · (1 + HK), Nettoverkaufspreis = Selbstkosten · (1 + G), Bruttoverkaufspreis = NVP · (1 + USt). Eingesetzt: BVP = BP · (1 + HK) · (1 + G) · (1 + USt). Teilt man durch BP, bleibt der Faktor. Er hängt nicht vom Bezugspreis ab.\n🇻🇳 Mỗi khoản cộng thêm được tính trên kết quả trước đó: Selbstkosten = BP · (1 + HK), Nettoverkaufspreis = Selbstkosten · (1 + G), Bruttoverkaufspreis = NVP · (1 + USt). Thay vào: BVP = BP · (1 + HK) · (1 + G) · (1 + USt). Chia cho BP thì còn lại hệ số. Nó không phụ thuộc vào Bezugspreis."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Pulli: Bezugspreis 24,00 €, 40 % Handlungskosten, 25 % Gewinn, 19 % USt. Rechne einmal mit der Treppe und einmal mit dem Faktor. Zeige, dass beide Wege dasselbe Ergebnis liefern.","vi":"Pulli: Bezugspreis 24,00 €, 40 % Handlungskosten, 25 % Gewinn, 19 % USt. Rechne einmal mit der Treppe und einmal mit dem Faktor. Zeige, dass beide Wege dasselbe Ergebnis liefern.\n🇻🇳 Áo len: Bezugspreis 24,00 €, 40 % Handlungskosten, 25 % Gewinn, 19 % USt. Tính một lần theo bậc thang và một lần bằng hệ số. Cho thấy hai cách cho cùng kết quả."},"m":{"de":"Treppe: 24,00 · 1,4 = 33,60 € · 1,25 = 42,00 € · 1,19 = 49,98 €. Faktor: 1,4 · 1,25 · 1,19 = 2,0825; 24,00 · 2,0825 = 49,98 € – gleiches Ergebnis.","vi":"Treppe: 24,00 · 1,4 = 33,60 € · 1,25 = 42,00 € · 1,19 = 49,98 €. Faktor: 1,4 · 1,25 · 1,19 = 2,0825; 24,00 · 2,0825 = 49,98 € – gleiches Ergebnis.\n🇻🇳 Bậc thang: 24,00 · 1,4 = 33,60 € · 1,25 = 42,00 € · 1,19 = 49,98 €. Hệ số: 1,4 · 1,25 · 1,19 = 2,0825; 24,00 · 2,0825 = 49,98 € – cùng kết quả."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Warum ist der Faktor nicht 1 + 0,40 + 0,25 + 0,19 = 1,84?","vi":"Warum ist der Faktor nicht 1 + 0,40 + 0,25 + 0,19 = 1,84?\n🇻🇳 Vì sao hệ số không phải là 1 + 0,40 + 0,25 + 0,19 = 1,84?"},"m":{"de":"Die Prozentsätze beziehen sich auf verschiedene Grundwerte (Bezugspreis, Selbstkosten, Nettoverkaufspreis). Beim Addieren fehlen die „Zuschläge auf die Zuschläge“: 24,00 · 1,84 = 44,16 € statt 49,98 €.","vi":"Die Prozentsätze beziehen sich auf verschiedene Grundwerte (Bezugspreis, Selbstkosten, Nettoverkaufspreis). Beim Addieren fehlen die „Zuschläge auf die Zuschläge“: 24,00 · 1,84 = 44,16 € statt 49,98 €.\n🇻🇳 Các tỉ lệ phần trăm tính
