"Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"A5 Welche Fragetechnik eignet sich für die Bedarfsermittlung? Nenne ein Beispiel. (aus LF 2)","vi":"A5 Welche Fragetechnik eignet sich für die Bedarfsermittlung? Nenne ein Beispiel. (aus LF 2)\n🇻🇳 A5 Kỹ thuật đặt câu hỏi nào phù hợp để tìm hiểu nhu cầu? Nêu một ví dụ. (từ LF 2)"},"m":{"de":"offene Frage (W-Frage), z. B. „Wofür möchten Sie … verwenden?“","vi":"offene Frage (W-Frage), z. B. „Wofür möchten Sie … verwenden?“\n🇻🇳 câu hỏi mở (W-Frage), ví dụ „Wofür möchten Sie … verwenden?“"},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":1},{"id":"g1","no":"Aufgabe 2","title":{"de":"Ankommen: Eine Cola, drei Preise","vi":"Ankommen: Eine Cola, drei Preise · Khởi động: một chai cola, ba mức giá"},"tip":{"de":"Kommt es aus dem eigenen Betrieb (innen) oder vom Markt (außen)? Innen: Selbstkosten, Gewinn. Außen: Mitbewerber, Nachfrage, Preisempfehlung, Trends, Konjunktur.","vi":"Điều đó đến từ trong doanh nghiệp (bên trong) hay từ thị trường (bên ngoài)? Bên trong: Selbstkosten, Gewinn. Bên ngoài: đối thủ, nhu cầu, giá đề xuất, xu hướng, tình hình kinh tế."},"type":"free","parts":[{"q":{"de":"Dieselbe Flasche Cola (0,5 l) kostet im Discounter 0,99 €, im Supermarkt 1,29 € und am Bahnhofskiosk 2,50 €. Nenne zwei Gründe für die Unterschiede.","vi":"Dieselbe Flasche Cola (0,5 l) kostet im Discounter 0,99 €, im Supermarkt 1,29 € und am Bahnhofskiosk 2,50 €. Nenne zwei Gründe für die Unterschiede.\n🇻🇳 Cùng một chai cola (0,5 l) có giá 0,99 € ở cửa hàng giá rẻ, 1,29 € ở siêu thị và 2,50 € ở ki-ốt nhà ga. Nêu hai lý do cho sự khác nhau."},"m":{"de":"Der Kiosk hat hohe Handlungskosten (Miete am Bahnhof, lange Öffnungszeiten). Kunden am Bahnhof haben keine Wahl und zahlen mehr (Nachfrage); der Discounter hat viele Mitbewerber.","vi":"Der Kiosk hat hohe Handlungskosten (Miete am Bahnhof, lange Öffnungszeiten). Kunden am Bahnhof haben keine Wahl und zahlen mehr (Nachfrage); der Discounter hat viele Mitbewerber.\n🇻🇳 Ki-ốt có Handlungskosten cao (tiền thuê ở nhà ga, giờ mở cửa dài). Khách ở nhà ga không có lựa chọn nên trả nhiều hơn (nhu cầu); cửa hàng giá rẻ có nhiều đối thủ."},"w":["die Miete","die Öffnungszeiten","die Nachfrage","der Mitbewerber"],"s":["Der Kiosk hat …","Die Kunden am Bahnhof …"]}],"pts":0.5},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher · Wortspeicher (kho từ)"},"html":"<p>das Kriterium (die Kriterien) · innerbetrieblich · außerbetrieblich · der Mitbewerber · die Nachfrage · die Preisempfehlung (UVP) · psychologische Preisgestaltung · das Ziel · der Absatz · der Umsatz · die Handelsmarke</p>","vi":"Kriterium (die Kriterien) = tiêu chí · innerbetrieblich = bên trong doanh nghiệp · außerbetrieblich = bên ngoài doanh nghiệp · Mitbewerber = đối thủ cạnh tranh · Nachfrage = nhu cầu · Preisempfehlung (UVP) = giá đề xuất của nhà sản xuất · psychologische Preisgestaltung = định giá tâm lý · Ziel = mục tiêu · Absatz = lượng hàng bán được · Umsatz = doanh thu · Handelsmarke = nhãn hàng riêng của nhà bán lẻ"},{"id":"r1","no":"Lesen 1","type":"read","title":{"de":"Kriterien der Preisbildung","vi":"Kriterien der Preisbildung · Các tiêu chí định giá"},"instr":{"de":"Markiere nur die Kriterien von außen (Markt).","vi":"Markiere nur die Kriterien von außen (Markt).\n🇻🇳 Chỉ đánh dấu các tiêu chí từ bên ngoài (thị trường)."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Von innen, also aus dem Betrieb, kommen die Selbstkosten und der gewünschte Gewinn. Von außen, also vom Markt, kommen die [[Preise der Mitbewerber]], die [[Nachfrage]] der Kunden, die [[Preisempfehlung]] des Herstellers, [[Trends]], Mode und Jahreszeit und die Lage der Wirtschaft, die [[Konjunktur]]. Psychologische Preisgestaltung heißt: 9,99 € statt 10,00 € – der Preis wirkt günstiger."],"vi":"Từ bên trong, tức là từ doanh nghiệp, có Selbstkosten và Gewinn mong muốn. Từ bên ngoài, tức là từ thị trường, có giá của các đối thủ, nhu cầu của khách hàng, giá đề xuất của nhà sản xuất, xu hướng, thời trang và mùa, và tình hình kinh tế (Konjunktur). Định giá tâm lý nghĩa là: 9,99 € thay vì 10,00 € – giá có vẻ rẻ hơn.","quiz":{"q":{"de":"Welches Kriterium kommt von innen?","vi":"Welches Kriterium kommt von innen?\n🇻🇳 Tiêu chí nào đến từ bên trong?"},"o":["Preise der Mitbewerber","Selbstkosten","Nachfrage der Kunden"],"a":1,"why":{"de":"Richtig ist: Selbstkosten","vi":"Đáp án đúng: Selbstkosten"}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Ziele von Sonderpreisen","vi":"Ziele von Sonderpreisen · Mục tiêu của giá đặc biệt"},"instr":{"de":"Markiere die Ziele.","vi":"Markiere die Ziele.\n🇻🇳 Đánh dấu các mục tiêu."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Mit Sonderpreisen und Preissenkungen will der Betrieb [[Umsatz und Absatz steigern]], [[neue Kunden gewinnen]], [[Stammkunden binden]], den Laden bekannter machen, [[Restposten und Saisonware abbauen]] und Platz für neue Ware schaffen. Er will nicht die Handlungskosten erhöhen."],"vi":"Với giá đặc biệt và việc giảm giá, doanh nghiệp muốn tăng doanh thu và lượng bán, có thêm khách mới, giữ chân khách quen, làm cửa hàng được biết đến nhiều hơn, bán hết hàng tồn và hàng theo mùa, và tạo chỗ cho hàng mới. Doanh nghiệp không muốn tăng Handlungskosten.","quiz":{"q":{"de":"Im Februar liegen noch 40 Winterjacken im Lager. Welches Ziel hat eine Preissenkung?","vi":"Im Februar liegen noch 40 Winterjacken im Lager. Welches Ziel hat eine Preissenkung?\n🇻🇳 Tháng hai vẫn còn 40 áo khoác mùa đông trong kho. Việc giảm giá có mục tiêu gì?"},"o":["Saisonware abbauen","den Bezugspreis senken","die Umsatzsteuer sparen"],"a":0,"why":{"de":"Richtig ist: Saisonware abbauen","vi":"Đáp án đúng: bán hết hàng theo mùa"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"„Woanders ist es billiger!“","vi":"„Woanders ist es billiger!“ · „Chỗ khác rẻ hơn!“"},"instr":{"de":"Markiere, was du als Verkäufer tun kannst.","vi":"Markiere, was du als Verkäufer tun kannst.\n🇻🇳 Đánh dấu những gì em có thể làm với tư cách người bán hàng."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Der Mitbewerber kann günstiger sein, weil es Aktionsware ist oder weil er niedrigere Handlungskosten hat. Als Verkäufer kannst du [[freundlich bleiben und nachfragen]]: gleicher Artikel? Aktuelles Angebot? Du kannst nach Rücksprache [[den Preis angleichen]]. Du kannst [[eine Zugabe anbieten]]. Du kannst [[Vorteile nennen]]: Beratung, Service, Umtausch, Garantie, sofort mitnehmen. Du solltest nicht den Mitbewerber schlechtmachen."],"vi":"Đối thủ có thể rẻ hơn vì đó là hàng khuyến mãi hoặc vì họ có Handlungskosten thấp hơn. Là người bán hàng, em có thể giữ thái độ thân thiện và hỏi lại: cùng mặt hàng không? Ưu đãi hiện tại không? Sau khi hỏi ý kiến cấp trên, em có thể điều chỉnh giá cho bằng. Em có thể tặng kèm một món quà. Em có thể nêu các ưu điểm: tư vấn, dịch vụ, đổi hàng, bảo hành, mang về ngay. Em không nên nói xấu đối thủ.","quiz":{"q":{"de":"Was gilt auf Dauer für den Preis?","vi":"Was gilt auf Dauer für den Preis?\n🇻🇳 Về lâu dài, điều gì đúng với giá bán?"},"o":["Er darf nicht unter Selbstkosten + Umsatzsteuer fallen.","Er muss immer der kalkulierte Preis sein.","Er muss immer der billigste am Markt sein."],"a":0,"why":{"de":"Richtig ist: Er darf nicht unter Selbstkosten + Umsatzsteuer fallen.","vi":"Đáp án đúng: Nó không được thấp hơn Selbstkosten + Umsatzsteuer."}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Kriterien der Preisbildung</h4><p>Von innen (im Betrieb): Selbstkosten (Bezugspreis + Handlungskosten) · gewünschter Gewinn · Preisuntergrenze: Selbstkosten + Umsatzsteuer</p><p>Von außen (Markt): Preise der Mitbewerber · Nachfrage der Kunden · Preisempfehlung des Herstellers · Trends, Mode, Jahreszeit · Lage der Wirtschaft (Konjunktur)</p><h4>„Woanders ist es billiger!“</h4><p>Warum kann der Mitbewerber günstiger sein? Es ist Aktionsware oder ein Lockangebot. Er hat einen günstigeren Bezugspreis (große Mengen). Er hat niedrigere Handlungskosten (z. B. online, weniger Personal). Er kalkuliert mit weniger Gewinn.</p><p>Was kann ich als Verkäufer tun? Freundlich bleiben und nachfragen. Nach Rücksprache den Preis angleichen (Tiefpreisgarantie). Eine Zugabe anbieten. Vorteile nennen: Beratung, Service, Umtausch, Garantie, sofort mitnehmen.</p><p><b>Merke:</b> Der kalkulierte Preis ist nur ein Vorschlag. Der Markt entscheidet mit: Sind die Mitbewerber günstiger, kann man den kalkulierten Preis oft nicht verlangen. Aber: Auf Dauer darf der Preis nicht unter Selbstkosten + Umsatzsteuer fallen.</p>","vi":"Các tiêu chí định giá\nTừ bên trong (trong doanh nghiệp): Selbstkosten (Bezugspreis + Handlungskosten) · Gewinn mong muốn · Preisuntergrenze: Selbstkosten + Umsatzsteuer\nTừ bên ngoài (thị trường): giá của đối thủ · nhu cầu của khách · giá đề xuất của nhà sản xuất · xu hướng, thời trang, mùa · tình hình kinh tế (Konjunktur)\n„Chỗ khác rẻ hơn!“\nVì sao đối thủ có thể rẻ hơn? Đó là hàng khuyến mãi hoặc hàng câu khách. Họ có Bezugspreis rẻ hơn (mua số lượng lớn). Họ có Handlungskosten thấp hơn (ví dụ bán online, ít nhân viên). Họ tính ít Gewinn hơn.\nLà người bán hàng, tôi có thể làm gì? Giữ thân thiện và hỏi lại. Sau khi hỏi ý kiến, điều chỉnh giá cho bằng (cam kết giá thấp). Tặng kèm quà. Nêu ưu điểm: tư vấn, dịch vụ, đổi hàng, bảo hành, mang về ngay.\nGhi nhớ: Giá đã tính chỉ là một đề xuất. Thị trường cùng quyết định: nếu đối thủ rẻ hơn thì thường không thể đòi giá đã tính. Nhưng: về lâu dài giá không được thấp hơn Selbstkosten + Umsatzsteuer."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: eine offene Prüfungsfrage mit 5 Punkten","vi":"Vorgemacht: eine offene Prüfungsfrage mit 5 Punkten · Làm mẫu: một câu hỏi mở trong kỳ thi với 5 điểm"},"html":"<p><b>Aufgabe der IHK:</b> Sie sollen für die Sportabteilung Aktionspreise festlegen. a) Geben Sie 2 Kriterien an, die Sie bei der Preisbildung berücksichtigen. (2 Punkte) b) Nennen Sie 3 Ziele, die Sie mit der Preisreduzierung anstreben. (3 Punkte)</p><p><b>a) Musterantwort:</b> die Selbstkosten des Artikels – die Preise der Mitbewerber. Zwei verschiedene Kriterien, je ein Punkt. Stichworte reichen.</p><p><b>b) Musterantwort:</b> den Umsatz steigern – neue Kunden gewinnen – Restbestände abbauen. Drei verschiedene Ziele. Nicht dreimal dasselbe („mehr verkaufen, mehr Umsatz, mehr Absatz“).</p><p><b>Open Book:</b> Die Antwortbausteine stehen auf der Werkzeugkarte, Nr. 6. Zähle die Punkte – so viele Antworten schreibst du. Mehr bringt keine Extrapunkte.</p>","vi":"Đề của IHK: Em phải định giá khuyến mãi cho quầy thể thao. a) Nêu 2 tiêu chí em xem xét khi định giá. (2 điểm) b) Nêu 3 mục tiêu em hướng tới với việc giảm giá. (3 điểm)\na) Câu trả lời mẫu: Selbstkosten của mặt hàng – giá của các đối thủ. Hai tiêu chí khác nhau, mỗi tiêu chí một điểm. Từ khóa là đủ.\nb) Câu trả lời mẫu: tăng doanh thu – có khách mới – bán hết hàng tồn. Ba mục tiêu khác nhau. Không lặp lại ba lần cùng một ý („bán nhiều hơn, doanh thu nhiều hơn, lượng bán nhiều hơn“).\nOpen Book: Các ý trả lời có trên thẻ công cụ, số 6. Đếm số điểm – em viết đúng bấy nhiêu ý. Viết thêm không được thêm điểm."},{"id":"g2","no":"Aufgabe 3","title":{"de":"Geführte Übung: innen oder außen?","vi":"Geführte Übung: innen oder außen? · Bài tập có hướng dẫn: bên trong hay bên ngoài?"},"instr":{"de":"Kommt das Kriterium von innen (aus dem Betrieb) oder von außen (vom Markt)?","vi":"Kommt das Kriterium von innen (aus dem Betrieb) oder von außen (vom Markt)?\n🇻🇳 Tiêu chí này đến từ bên trong (doanh nghiệp) hay từ bên ngoài (thị trường)?"},"tip":{"de":"Kommt es aus dem eigenen Betrieb (innen) oder vom Markt (außen)? Innen: Selbstkosten, Gewinn. Außen: Mitbewerber, Nachfrage, Preisempfehlung, Trends, Konjunktur.","vi":"Điều đó đến từ trong doanh nghiệp (bên trong) hay từ thị trường (bên ngoài)? Bên trong: Selbstkosten, Gewinn. Bên ngoài: đối thủ, nhu cầu, giá đề xuất, xu hướng, tình hình kinh tế."},"type":"match","rows":[{"l":{"de":"Selbstkosten des Artikels","vi":"Selbstkosten des Artikels\n🇻🇳 Selbstkosten của mặt hàng"},"a":"innen"},{"l":{"de":"Preise der Mitbewerber","vi":"Preise der Mitbewerber\n🇻🇳 Giá của các đối thủ"},"a":"außen"},{"l":{"de":"gewünschter Gewinn","vi":"gewünschter Gewinn\n🇻🇳 Gewinn mong muốn"},"a":"innen"},{"l":{"de":"Nachfrage der Kunden","vi":"Nachfrage der Kunden\n🇻🇳 Nhu cầu của khách"},"a":"außen"},{"l":{"de":"Handlungskosten der Filiale","vi":"Handlungskosten der Filiale\n🇻🇳 Handlungskosten của chi nhánh"},"a":"innen"},{"l":{"de":"Preisempfehlung des Herstellers (UVP)","vi":"Preisempfehlung des Herstellers (UVP)\n🇻🇳 Giá đề xuất của nhà sản xuất (UVP)"},"a":"außen"},{"l":{"de":"Trends und Mode","vi":"Trends und Mode\n🇻🇳 Xu hướng và thời trang"},"a":"außen"},{"l":{"de":"Lage der Wirtschaft (Konjunktur)","vi":"Lage der Wirtschaft (Konjunktur)\n🇻🇳 Tình hình kinh tế (Konjunktur)"},"a":"außen"}],"pts":4},{"id":"g3","no":"Aufgabe 4","title":{"de":"Geführte Übung: Ziele und Gründe","vi":"Geführte Übung: Ziele und Gründe · Bài tập có hướng dẫn: mục tiêu và lý do"},"instr":{"de":"Schreibe zu jeder Situation ein passendes Ziel.","vi":"Schreibe zu jeder Situation ein passendes Ziel.\n🇻🇳 Viết một mục tiêu phù hợp cho mỗi tình huống."},"tip":{"de":"Was will der Betrieb mit dem Sonderpreis erreichen? Ziele: Umsatz und Absatz steigern, neue Kunden gewinnen, Kunden binden, Restposten abbauen, Platz schaffen.","vi":"Doanh nghiệp muốn đạt được gì với function tokens(p){const out=[];let idx=0;let m;

  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang;
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 autoDir();progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();

</script>
