[{"de":"Zwei Shirts kosten 48,00 €, man zahlt 36,00 €: 12 : 48 · 100 = 25,0 %","vi":"Hai áo giá 48,00 €, ta trả 36,00 €: 12 : 48 · 100 = 25,0 %"}]},{"q":{"de":"F Smartwatch: statt 199,00 € jetzt 149,00 €","vi":"F Smartwatch: statt 199,00 € jetzt 149,00 €\n🇻🇳 F Đồng hồ thông minh: thay vì 199,00 € nay 149,00 €"},"u":"%","a":25.1,"tol":0.06,"steps":[{"de":"(199 – 149) : 199 · 100 = 25,1 % · Reihenfolge: D Winterjacke „30 % auf alles“ (30,0 %) – F – E – C – A – B. Große Euro-Beträge sagen nichts über den Prozentsatz.","vi":"(199 – 149) : 199 · 100 = 25,1 % · Thứ tự: D Áo khoác mùa đông „giảm 30 % tất cả“ (30,0 %) – F – E – C – A – B. Số euro lớn không nói lên tỉ lệ phần trăm."}]}],"pts":1.5},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher · Wortspeicher (kho từ)"},"html":"<p>die Preissenkung · der Preisnachlass · der Aktionspreis · der ursprüngliche Preis · der Umsatz · brutto · netto · der Einheitspreis · der Durchschnitt · der Kilopreis</p>","vi":"Preissenkung = việc giảm giá · Preisnachlass = khoản giảm giá · Aktionspreis = giá khuyến mãi · ursprüngliche Preis = giá ban đầu · Umsatz = doanh thu · brutto = đã có thuế · netto = chưa có thuế · Einheitspreis = giá thống nhất · Durchschnitt = trung bình · Kilopreis = giá mỗi ki-lô-gam"},{"id":"r1","no":"Lesen 1","type":"read","title":{"de":"Neuer Preis, Senkung, alter Preis","vi":"Neuer Preis, Senkung, alter Preis · Giá mới, mức giảm, giá cũ"},"instr":{"de":"Markiere die drei Rechenwege.","vi":"Markiere die drei Rechenwege.\n🇻🇳 Đánh dấu ba cách tính."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Den neuen Preis nach einer Senkung berechnest du so: [[alt · (1 – p : 100)]]. Beispiel: 80 € – 25 % sind 80 · 0,75 = 60 €. Die Senkung in Prozent berechnest du so: [[(alt – neu) : alt · 100]]. Den alten Preis vor dem Rabatt berechnest du so: [[neu : (1 – p : 100)]]. Beispiel: 180 € nach 10 % Rabatt sind 180 : 0,9 = 200 €. Du rechnest nicht neu · 1,1."],"vi":"Giá mới sau khi giảm được tính như sau: cũ · (1 – p : 100). Ví dụ: 80 € – 25 % là 80 · 0,75 = 60 €. Mức giảm theo phần trăm được tính như sau: (cũ – mới) : cũ · 100. Giá cũ trước khi giảm được tính như sau: mới : (1 – p : 100). Ví dụ: 180 € sau khi giảm 10 % là 180 : 0,9 = 200 €. Em không tính mới · 1,1.","quiz":{"q":{"de":"Ein Preis sinkt von 80 € auf 60 €. Um wie viel Prozent?","vi":"Ein Preis sinkt von 80 € auf 60 €. Um wie viel Prozent?\n🇻🇳 Một giá giảm từ 80 € xuống 60 €. Giảm bao nhiêu phần trăm?"},"o":["20 %","25 %","33,3 %"],"a":1,"why":{"de":"Richtig ist: 25 %","vi":"Đáp án đúng: 25 %"}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Umsatz, netto, Einheitspreis","vi":"Umsatz, netto, Einheitspreis · Doanh thu, netto, giá thống nhất"},"instr":{"de":"Markiere die drei Rechenwege.","vi":"Markiere die drei Rechenwege.\n🇻🇳 Đánh dấu ba cách tính."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Den Umsatz einer Aktion berechnest du so: [[Menge · Aktionspreis]]. Den Betrag ohne Umsatzsteuer berechnest du so: [[brutto : 1,19]]. Du rechnest niemals mal 0,81. Einen Einheitspreis für einen Sondertisch berechnest du so: [[Summe aller Beträge : Anzahl]]."],"vi":"Doanh thu của một đợt khuyến mãi được tính như sau: số lượng · giá khuyến mãi. Số tiền không có thuế được tính như sau: brutto : 1,19. Em không bao giờ nhân 0,81. Giá thống nhất cho một bàn hàng giảm giá được tính như sau: tổng tất cả các số tiền : số lượng.","quiz":{"q":{"de":"119,00 € brutto (19 %) sind netto …","vi":"119,00 € brutto (19 %) sind netto …\n🇻🇳 119,00 € brutto (19 %) thì netto là …"},"o":["96,39 €","100,00 €","100,81 €"],"a":1,"why":{"de":"Richtig ist: 100,00 €","vi":"Đáp án đúng: 100,00 €"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"Die zwei gefährlichsten Fallen","vi":"Die zwei gefährlichsten Fallen · Hai cái bẫy nguy hiểm nhất"},"instr":{"de":"Markiere, welcher Preis bei der zweiten Senkung der alte Preis ist, und worauf sich die Prozente beziehen.","vi":"Markiere, welcher Preis bei der zweiten Senkung der alte Preis ist, und worauf sich die Prozente beziehen.\n🇻🇳 Đánh dấu giá nào là giá cũ khi giảm lần hai, và các phần trăm tính trên cái gì."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Zweite Senkung: Bei der Frage „Um wie viel Prozent wurde der Preis nochmals gesenkt?“ ist der [[erste gesenkte Preis]] der alte Preis, nicht der ursprüngliche Preis. Alter Preis: „Nach 10 % Rabatt zahlt die Kundin 180 €.“ Die 10 % beziehen sich auf den [[alten Preis]]. Bei „um wie viel Prozent“ steht der alte Preis [[unten]] im Nenner."],"vi":"Giảm lần hai: với câu hỏi „Giá đã được giảm thêm bao nhiêu phần trăm?“ thì giá đã giảm lần đầu là giá cũ, không phải giá ban đầu. Giá cũ: „Sau khi giảm 10 %, khách trả 180 €.“ 10 % tính trên giá cũ. Với „giảm bao nhiêu phần trăm“ thì giá cũ nằm ở dưới, trong mẫu số.","quiz":{"q":{"de":"Erst 22,00 €, dann 16,50 €. Was ist bei der zweiten Senkung der alte Preis?","vi":"Erst 22,00 €, dann 16,50 €. Was ist bei der zweiten Senkung der alte Preis?\n🇻🇳 Trước là 22,00 €, sau là 16,50 €. Khi giảm lần hai, giá cũ là giá nào?"},"o":["der ursprüngliche Preis","22,00 €","16,50 €"],"a":1,"why":{"de":"Richtig ist: 22,00 €","vi":"Đáp án đúng: 22,00 €"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Sechs Werkzeuge für Aktionen</h4><p>1 Neuer Preis (Preis nach der Senkung): alt · (1 – p : 100) · Beispiel: 80 € – 25 % → 80 · 0,75 = 60 €</p><p>2 Senkung in % („Um wie viel Prozent …?“): (alt – neu) : alt · 100 · Beispiel: (80 – 60) : 80 · 100 = 25 %</p><p>3 Alter Preis (Preis vor dem Rabatt): neu : (1 – p : 100) · Beispiel: 180 € nach 10 %: 180 : 0,9 = 200 €</p><p>4 Umsatz (Umsatz der Aktion): Menge · Aktionspreis · Beispiel: 90 · 16,50 € = 1.485,00 €</p><p>5 Netto (Betrag ohne Umsatzsteuer): brutto : 1,19 · Beispiel: 119,00 : 1,19 = 100,00 €</p><p>6 Einheitspreis (ein Preis für alles): Summe aller Beträge : Anzahl · Beispiel: (10 · 5 € + 10 · 7 €) : 20 = 6 €</p><p><b>Merke:</b> Bei „um wie viel Prozent“ steht der alte Preis unten (im Nenner). Netto aus brutto: geteilt durch 1,19 – niemals mal 0,81.</p>","vi":"Sáu công cụ cho các đợt khuyến mãi\n1 Giá mới (giá sau khi giảm): cũ · (1 – p : 100) · Ví dụ: 80 € – 25 % → 80 · 0,75 = 60 €\n2 Mức giảm % („Giảm bao nhiêu phần trăm …?“): (cũ – mới) : cũ · 100 · Ví dụ: (80 – 60) : 80 · 100 = 25 %\n3 Giá cũ (giá trước khi giảm): mới : (1 – p : 100) · Ví dụ: 180 € sau 10 %: 180 : 0,9 = 200 €\n4 Doanh thu (của đợt khuyến mãi): số lượng · giá khuyến mãi · Ví dụ: 90 · 16,50 € = 1.485,00 €\n5 Netto (số tiền không có thuế): brutto : 1,19 · Ví dụ: 119,00 : 1,19 = 100,00 €\n6 Giá thống nhất (một giá cho tất cả): tổng các số tiền : số lượng · Ví dụ: (10 · 5 € + 10 · 7 €) : 20 = 6 €\nGhi nhớ: Với „giảm bao nhiêu phần trăm“ thì giá cũ nằm ở dưới (trong mẫu số). Netto từ brutto: chia cho 1,19 – không bao giờ nhân 0,81."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: die Hemden-Aktion","vi":"Vorgemacht: die Hemden-Aktion · Làm mẫu: đợt khuyến mãi áo sơ mi"},"html":"<p><b>Aufgabe der IHK:</b> Nachdem Sie den Verkaufspreis für die Hemden auf 22,00 € gesenkt hatten, bieten Sie die restlichen 90 Hemden zu je 16,50 € an. a) Um wie viel Prozent haben Sie den Verkaufspreis nochmals reduziert? b) Berechnen Sie den Bruttoumsatz dieser Sonderaktion.</p><p><b>a) alt und neu finden:</b> alt = 22,00 € (der erste gesenkte Preis), neu = 16,50 €</p><p><b>Differenz:</b> 22,00 – 16,50 = 5,50 €</p><p><b>durch alt, mal 100:</b> 5,50 : 22,00 · 100 = 25 %</p><p><b>b) Umsatz:</b> 90 · 16,50 = 1.485,00 €</p>","vi":"Đề của IHK: Sau khi đã giảm giá bán áo sơ mi xuống 22,00 €, em bán 90 chiếc còn lại với giá 16,50 € mỗi chiếc. a) Em đã giảm giá bán thêm bao nhiêu phần trăm? b) Hãy tính doanh thu brutto của đợt khuyến mãi này.\na) tìm giá cũ và giá mới: cũ = 22,00 € (giá đã giảm lần đầu), mới = 16,50 €\nChênh lệch: 22,00 – 16,50 = 5,50 €\nchia cho giá cũ, nhân 100: 5,50 : 22,00 · 100 = 25 %\nb) Doanh thu: 90 · 16,50 = 1.485,00 €"},{"id":"g2","no":"Aufgabe 3","title":{"de":"Lückenschema: Preissenkung","vi":"Lückenschema: Preissenkung · Sơ đồ điền chỗ trống: giảm giá"},"instr":{"de":"Eine Jacke kostete 59,90 €. Im Schlussverkauf kostet sie 44,90 €.","vi":"Eine Jacke kostete 59,90 €. Im Schlussverkauf kostet sie 44,90 €.\n🇻🇳 Một chiếc áo khoác trước đây giá 59,90 €. Trong đợt bán xả hàng nó có giá 44,90 €."},"tip":{"de":"Was ist der alte Preis, was ist der neue Preis? Bei einer zweiten Senkung ist der erste gesenkte Preis der alte Preis. Senkung in % = (alt – neu) : alt · 100. Der alte Preis steht unten.","vi":"Giá cũ là bao nhiêu, giá mới là bao nhiêu? Khi giảm lần hai thì giá đã giảm lần đầu là giá cũ. Mức giảm % = (cũ – mới) : cũ · 100. Giá cũ nằm ở dưới."},"type":"calc","parts":[{"q":{"de":"Differenz zwischen altem und neuem Preis?","vi":"Differenz zwischen altem und neuem Preis?\n🇻🇳 Chênh lệch giữa giá cũ và giá mới?"},"u":"€","a":15,"tol":0.005,"steps":["59,90 – 44,90 = 15,00 €"]},{"q":{"de":"Um wie viel Prozent wurde der Preis gesenkt? (2 Nachkommastellen)","vi":"Um wie viel Prozent wurde der Preis gesenkt? (2 Nachkommastellen)\n🇻🇳 Giá đã được giảm bao nhiêu phần trăm? (2 chữ số sau dấu phẩy)"},"u":"%","a":25.04,"tol":0.005,"steps":["15,00 : 59,90 · 100 = 25,0417… → 25,04 %"]}],"pts":0.5},{"id":"g3","no":"Aufgabe 4","title":{"de":"Geführte Übung: Preissenkungen","vi":"Geführte Übung: Preissenkungen · Bài tập có hướng dẫn: giảm giá"},"tip":{"de":"Was ist der alte Preis, was ist der neue Preis? Bei einer zweiten Senkung ist der erste gesenkte Preis der alte Preis. Senkung in % = (alt – neu) : alt · 100. Der alte Preis steht unten.","vi":"Giá cũ là bao nhiêu, giá mới là bao nhiêu? Khi giảm lần hai thì giá đã giảm lần đầu là giá cũ. Mức giảm % = (cũ – mới) : cũ · 100. Giá cũ nằm ở dưới."},"type":"calc","parts":[{"q":{"de":"Ein Laufschuh kostet statt 149,00 € nur noch 99,00 €. Um wie viel Prozent wurde der Preis gesenkt? (2 Stellen)","vi":"Ein Laufschuh kostet statt 149,00 € nur noch 99,00 €. Um wie viel Prozent wurde der Preis gesenkt? (2 Stellen)\n🇻🇳 Một đôi giày chạy bộ thay vì 149,00 € nay chỉ còn 99,00 €. Giá đã được giảm bao nhiêu phần trăm? (2 chữ số)"},"u":"%","a":33.56,"tol":0.005,"steps":["(149 – 99) : 149 · 100 = 33,56 %"],"work":true},{"q":{"de":"Eine Kundin hat einen Coupon über 25 % Rabatt. Der Artikel kostet 119,00 €. Wie viel Euro spart sie?","vi":"Eine Kundin hat einen Coupon über 25 % Rabatt. Der Artikel kostet 119,00 €. Wie viel Euro spart sie?\n🇻🇳 Một khách có phiếu giảm giá 25 %. Mặt hàng có giá 119,00 €. Cô ấy tiết kiệm bao nhiêu euro?"},"u":"€","a":29.75,"tol":0.005,"steps":["119,00 · 0,25 = 29,75 €"],"work":true},{"q":{"de":"Nach Abzug von 10 % Rabatt zahlt ein Kunde 180,00 €. Wie hoch war der ursprüngliche Bruttoverkaufspreis?","vi":"Nach Abzug von 10 % Rabatt zahlt ein Kunde 180,00 €. Wie hoch war der ursprüngliche Bruttoverkaufspreis?\n🇻🇳 Sau khi trừ 10 % Rabatt, một khách trả 180,00 €. Bruttoverkaufspreis ban đầu là bao nhiêu?"},"u":"€","a":200,"tol":0.005,"steps":["180,00 : 0,9 = 200,00 €"],"work":true},{"q":{"de":"Ein Mixer kostete 69,90 €. In der Sonderaktion kostet er 39,90 €. Um wie viel Prozent wurde der Preis reduziert? (1 Stelle)","vi":"Ein Mixer kostete 69,90 €. In der Sonderaktion kostet er 39,90 €. Um wie viel Prozent wurde der Preis reduziert? (1 Stelle)\n🇻🇳 Một máy xay trước đây giá 69,90 €. Trong đợt khuyến mãi nó có giá 39,90 €. Giá đã được giảm bao nhiêu phần trăm? (1 chữ số)"},"u":"%","a":42.9,"tol":0.05,"steps":["(69,90 – 39,90) : 69,90 · 100 = 42,9 %"],"work":true}],"pts":3},{"id":"g4","no":"Aufgabe 5","title":{"de":"Geführte Übung: Umsatzsteuer herausrechnen","vi":"Geführte Übung: Umsatzsteuer herausrechnen · Bài tập có hướng dẫn: tách thuế ra khỏi giá"},"tip":{"de":"Im Bruttobetrag steckt die Umsatzsteuer schon drin. Brutto sind 119 %. Netto = brutto : 1,19. Umsatzsteuer = brutto – netto. Niemals mal 0,81.","vi":"Trong số tiền brutto đã có thuế. Brutto là 119 %. Netto = brutto : 1,19. Thuế = brutto – netto. Không bao giờ nhân 0,81."},"type":"calc","parts":[{"q":{"de":"Die Kassenabrechnung der Sportabteilung zeigt einen Umsatz von 14.970,20 € brutto (19 % Umsatzsteuer). Berechne den Nettoumsatz.","vi":"Die Kassenabrechnung der Sportabteilung zeigt einen Umsatz von 14.970,20 € brutto (19 % Umsatzsteuer). Berechne den Nettoumsatz.\n🇻🇳 Bảng kết toán quầy thu ngân của quầy thể thao cho thấy doanh thu 14.970,20 € brutto (19 % thuế). Tính doanh thu netto."},"u":"€","a":12580,"tol":0.005,"steps":["14.970,20 : 1,19 = 12.580,00 € netto"],"work":true},{"q":{"de":"Wie viel Euro Umsatzsteuer stecken in diesem Umsatz?","vi":"Wie viel Euro Umsatzsteuer stecken in diesem Umsatz?\n🇻🇳 Trong doanh thu này có bao nhiêu euro thuế?"},"u":"€","a":2390.2,"tol":0.005,"steps":["14.970,20 – 12.580,00 = 2.390,20 € Umsatzsteuer"]},{"q":{"de":"Wie viel Umsatzsteuer steckt in einem Bruttoverkaufspreis von 29,90 € (19 %)?","vi":"Wie viel Umsatzsteuer steckt in einem Bruttoverkaufspreis von 29,90 € (19 %)?\n🇻🇳 Trong Bruttoverkaufspreis 29,90 € (19 %) có bao nhiêu thuế?"},"u":"€","a":4.77,"tol":0.005,"steps":["29,90 : 1,19 = 25,13 €; 29,90 – 25,13 = 4,77 €"],"work":true}],"pts":2},{"id":"g5","no":"Aufgabe 6","title":{"de":"Geführte Übung: Sondertisch und Kilopreis","vi":"Geführte Übung: Sondertisch und Kilopreis · Bài tập có hướng dẫn: bàn hàng giảm giá và giá theo ki-lô-gam"},"instr":{"de":"Auf einem Sondertisch liegen Socken: 15 Paar zu 5,00 €, 10 Paar zu 7,00 € und 6 Paar zu 5,50 €. Alle sollen einen einheitlichen Preis bekommen.","vi":"Auf einem Sondertisch liegen Socken: 15 Paar zu 5,00 €, 10 Paar zu 7,00 € und 6 Paar zu 5,50 €. Alle sollen einen einheitlichen Preis bekommen.\n🇻🇳 Trên một bàn hàng giảm giá có tất: 15 đôi giá 5,00 €, 10 đôi giá 7,00 € và 6 đôi giá 5,50 €. Tất cả sẽ có một giá thống nhất."},"tip":{"de":"Rechne für jede Zeile Menge · Preis. Addiere dann alle Beträge. Einheitspreis = Summe aller Beträge : Anzahl. Nicht einfach die Preise mitteln!","vi":"Tính số lượng · giá cho từng dòng. Sau đó cộng tất cả các số tiền. Einheitspreis = tổng các số tiền : số lượng. Không được lấy trung bình cộng các giá!"},"type":"calc","parts":[{"q":{"de":"Wie hoch ist der Einheitspreis?","vi":"Wie hoch ist der Einheitspreis?\n🇻🇳 Giá thống nhất là bao nhiêu?"},"u":"€","a":5.74,"tol":0.005,"steps":[{"de":"75,00 + 70,00 + 33,00 = 178,00 €; 178,00 : 31 = 5,74 € · Nicht (5 + 7 + 5,5) : 3 = 5,83 € – das wäre falsch!","vi":"75,00 + 70,00 + 33,00 = 178,00 €; 178,00 : 31 = 5,74 € · Không phải (5 + 7 + 5,5) : 3 = 5,83 € – như vậy là sai!"}],"work":true},{"q":{"de":"Am Ende der Aktion sind noch 8 Paar übrig. Wie hoch war der Bruttoumsatz?","vi":"Am Ende der Aktion sind noch 8 Paar übrig. Wie hoch war der Bruttoumsatz?\n🇻🇳 Cuối đợt khuyến mãi còn lại 8 đôi. Doanh thu brutto là bao nhiêu?"},"u":"€","a":132.02,"tol":0.005,"steps":["31 – 8 = 23 Paar; 23 · 5,74 = 132,02 €"],"work":true},{"q":{"de":"An der Obsttheke: 0,400 kg zu 1,20 €/kg, 0,250 kg zu 2,20 €/kg, 1,340 kg zu 1,95 €/kg und 0,760 kg zu 3,50 €/kg. Wie viel muss die Kundin bezahlen?","vi":"An der Obsttheke: 0,400 kg zu 1,20 €/kg, 0,250 kg zu 2,20 €/kg, 1,340 kg zu 1,95 €/kg und 0,760 kg zu 3,50 €/kg. Wie viel muss die Kundin bezahlen?\n🇻🇳 Ở quầy trái cây: 0,400 kg giá 1,20 €/kg, 0,250 kg giá 2,20 €/kg, 1,340 kg giá 1,95 €/kg và 0,760 kg giá 3,50 €/kg. Khách phải trả bao nhiêu?"},"u":"€","a":6.3,"tol":0.005,"steps":["0,48 + 0,55 + 2,613 + 2,66 = 6,303 → 6,30 €"],"work":true}],"pts":2},{"id":"g6","no":"Aufgabe 7","title":{"de":"Fachgespräch-Karte function hashSeed(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9%€., ]/g,' ').replace(/\s+/g,' ').trim()}
function num(s){s=String(s==null?'':s).replace(/[€%\s]|[a-zA-Z²³]+/g,'');if(!s)return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const fnum=n=>n.toLocaleString('de-DE',{maximumFractionDigits:4});
/* ---------- Teile je Typ ---------- */
function cells(it){const o=[];it.rows.forEach((r,ri)=>r.forEach((c,ci)=>{if(c&&typeof c==='object')o.push({ri,ci,a:c.a,o:c.o||(it.colOpts||[])[ci],typed:c.typed,why:c.why})}));return o}
function parts(it){switch(it.type){case'mc':return it.qs;case'tf':return it.st;case'gap':return it.gaps;case'match':return it.rows;case'table':return cells(it);case'calc':case'free':return it.parts;default:return[]}}
function matchOpts(it){return shuf([...new Set(it.rows.map(r=>r.a).concat(it.extra||[]))],it.id)}
function visible(it){return it.level==='v'?S.level==='v':true}
function scored(it){return['mc','tf','gap','match','table','calc','free'].indexOf(it.type)>=0}

/* ---------- Bewertung ---------- */
function mcTxt(p,idx){return String(idx).split(',').filter(x=>x!=='').map(i=>p.o[+i]).join(' / ')}
function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}

const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(sum(it)?`<div class="vis" lang="${S.lang}">${rich(sum(it))}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};

function renderAll(){

function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;

 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}

 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});

 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
