body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
/* Top bar */
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.top-in{max-width:860px;margin:0 auto}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e1e8f0;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri2),#3da56a);transition:width .4s}
.prog b{font-size:.85rem;white-space:nowrap}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--pri);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--pri);min-height:44px;min-width:48px;padding:0 12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
@media(max-width:480px){.seg button{padding:0 9px;font-size:.92rem}.ctrl{gap:6px}}
.gear{min-height:44px;min-width:48px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;margin-left:auto;font-size:1.1rem}
.menu{display:none;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fafcff;gap:8px;flex-wrap:wrap}
.menu.open{display:flex}
/* Head */
.hd{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:14px 16px}
.hd h1{margin:0 0 2px;font-size:1.45rem;color:var(--pri);line-height:1.25}
.hd .lf{color:var(--mut);font-size:.9rem}
.nd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:520px){.nd{grid-template-columns:1fr}}
.nd label{font-size:.85rem;font-weight:700;color:var(--mut);display:block}
input[type=text],input[type=date],select,textarea{width:100%;border:2px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-size:16px;min-height:48px}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:3px solid #9cc3ea;border-color:var(--pri2)}
.can{background:var(--prib);border-left:5px solid var(--pri);border-radius:10px;padding:10px 14px;margin-top:10px}
.can h3{margin:0 0 4px;font-size:1rem;color:var(--pri)}
.can label{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:4px 0;cursor:pointer}
.can input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--pri)}
/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:16px;padding:14px 16px;scroll-margin-top:130px}
.card h2{margin:0;font-size:1.15rem;color:var(--pri);line-height:1.3;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.chip{font-size:.72rem;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--prib);color:var(--pri);white-space:nowrap}
.chip.v{background:var(--vib);color:var(--vi)}
.chip.p{background:#eee;color:#444}
.ask{margin:8px 0 10px;font-weight:600}
.vi{display:block;color:var(--vi);font-size:.88em;font-weight:400;line-height:1.5;margin-top:1px}
.card.lvlv{border-color:#c9bff5;background:#fcfbff}
.item{margin:12px 0;padding-top:10px;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.q{font-weight:700;margin-bottom:6px}
.cell-g{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
@media(max-width:600px){.cell-g{grid-template-columns:1fr}}
.cell-g label{font-size:.78rem;font-weight:800;color:var(--mut);display:block}
.cell-g .given{min-height:48px;display:flex;align-items:center;padding:6px 12px;background:#eef2f6;border-radius:10px;font-weight:700}
.note{font-size:.88rem;color:var(--mut);font-style:italic}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--pri);background:var(--pri);color:#fff;font-weight:800;cursor:pointer;margin:6px 8px 0 0}
.btn.sec{background:#fff;color:var(--pri)}
.btn[disabled]{opacity:.5}
.btn small{display:block;font-weight:400;font-size:.7em;opacity:.9;line-height:1.1}
.btn .vi{color:inherit;font-size:.72em;opacity:.9;margin:0}
/* MC */
.opt{display:flex;gap:10px;align-items:flex-start;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:#fff}
.opt input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--pri)}
.opt.sel{border-color:var(--pri2);background:var(--prib)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--bad);background:var(--badb)}
/* Reading */
.rdt{font-size:1.02rem;line-height:2.1;margin:6px 0}
.w{display:inline-block;padding:0 3px;margin:0 1px;border-radius:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.w.mk{background:var(--hl)}
.w.ok{background:#a6e3bd}
.w.bad{background:#f5b5b0;text-decoration:line-through}
.w.miss{outline:2px dashed var(--ok);background:#fff}
.locked .w{cursor:default}
.wsp{background:var(--prib);border-radius:10px;padding:10px 14px;font-size:.95rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.tbl th{background:#e7bcb9;text-align:left;padding:8px;border:1px solid #fff}
.tbl td{padding:8px;border:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700}
.scroll{overflow-x:auto}

details.tip{margin:6px 0 10px;border:2px solid #f0d37a;border-radius:12px;background:#fff9e3}
details.tip>summary{min-height:48px;display:flex;align-items:center;padding:0 12px;font-weight:800;cursor:pointer;color:#7a5a00;list-style:none}
details.tip>summary::-webkit-details-marker{display:none}
details.tip .tb{padding:0 12px 10px}
.tb p{margin:6px 0}
/* Feedback */
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;border-left:5px solid var(--line);background:#f3f5f8}
.fb.ok{background:var(--okb);border-color:var(--ok)}
.fb.bad{background:var(--badb);border-color:var(--bad)}
.fb.part{background:var(--partb);border-color:#d9a400}
.model{background:#f1f8f3;border:1px solid #bfe0cb;border-radius:10px;padding:8px 12px;margin-top:8px}
.rate{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rate button{min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-weight:700;cursor:pointer}
.rate button[aria-pressed=true]{border-color:var(--pri);background:var(--prib)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chips button{min-height:44px;border-radius:99px;border:2px solid var(--pri2);background:#fff;color:var(--pri);padding:0 14px;font-weight:700;cursor:pointer}
/* Results */
#results{display:none}
#results.on{display:block}
.score{font-size:2.4rem;font-weight:800;color:var(--pri);line-height:1.1}
.rrow{border-top:1px solid var(--line);padding:10px 0}
.badge{display:inline-block;min-width:28px;text-align:center;border-radius:99px;font-weight:800;padding:1px 8px;margin-right:6px}
.badge.ok{background:var(--okb);color:var(--ok)}
.badge.bad{background:var(--badb);color:var(--bad)}
.badge.part{background:var(--partb);color:var(--part)}
.badge.open{background:#eee;color:#555}
.ans{background:#f3f5f8;border-radius:8px;padding:6px 10px;margin:4px 0;white-space:pre-wrap}
.right{color:var(--ok);font-weight:700}
.wrong{color:var(--bad);font-weight:700}
.steps{background:#f6f9fc;border-left:4px solid var(--pri2);padding:6px 12px;margin:6px 0;border-radius:6px}
/* Toast + dialog */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:#1c2733;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:90;max-width:90vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#dlg .box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%}
.printonly{display:none}
@media print{
 .top,#toast,#dlg,.noprint,details.tip,.btn,.menu{display:none!important}
 body{background:#fff;font-size:11pt}
 .wrap{max-width:none;padding:0}
 #tasks,.hd .can{display:none!important}
 #results{display:block!important}
 .printonly{display:block!important}
 .card,.hd{border:0;padding:0;margin-top:8px}
 .rrow{break-inside:avoid}
 .vi{display:none}
}
</style>

/* Auswertung */
function num(x){var v=parseFloat(String(x).replace(/[−–]/g,'-').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.').replace(/\s/g,''));return isNaN(v)?null:v;}
function ok1(a,k){return norm(a)===norm(k);}
function scoreOf(b){
 var a=S.a[b.id]||{},got=0,pts=b.pts||0,st='open',html='',ans='';
 var ST=function(f){return f>=0.999?'ok':(f>0?'part':'bad');};
 if(b.type==='free'){
  var sum=0,cnt=0;
  b.items.forEach(function(it,i){
   var rt=S.rate[b.id+'.'+i],t=(a[i]||'').trim();
   var f=rt==='g'?1:rt==='p'?.5:0;sum+=f;cnt++;
   html+='<div class="ans"><b>'+(b.items.length>1?(i+1)+'. ':'')+'</b>'+(t?esc(t):'<i>'+U('empty')+'</i>')+'</div><div class="model"><b>'+U('model')+':</b> '+T(it.model)+'</div><div class="note">'+(rt?{g:'✅ ',p:'🔶 ',n:'❌ '}[rt]+U(rt):'')+'</div>';
  });
  var f0=cnt?sum/cnt:0;got=pts*f0;st=(done(b)||sum>0)?ST(f0):'open';
  if(!pts&&st==='bad')st='bad';
 }else if(b.type==='grid'){
  var need=0,right=0,wr='';
  b.rows.forEach(function(r,ri){r.ans.forEach(function(k,ci){
   if(r.given&&r.given[ci])return;need++;var v=a[ri+'_'+ci]||'';
   if(v&&ok1(v,k))right++;
   else wr+='<div class="rrow"><div>'+T(r.text)+'</div><div class="note">'+esc(b.cols[ci].h)+'</div><span class="wrong">'+(v?esc(v):U('empty'))+'</span> → <span class="right">'+esc(k)+'</span>'+(r.why?'<div>'+T(r.why)+'</div>':'')+'</div>';
  });});
  var f1=need?right/need:0;got=pts*f1;st=done(b)?ST(f1):'open';
  html='<div>'+right+' / '+need+'</div>'+wr;
 }else if(b.type==='mc'){
  var c=a.v;got=c===b.ans?pts:0;st=c===undefined?'open':(c===b.ans?'ok':'bad');
  html='<div class="ans">'+(c===undefined?U('empty'):esc(b.opts[c]))+'</div>'+(c!==b.ans?'<div class="right">'+U('right')+': '+esc(b.opts[b.ans])+'</div>':'')+(b.why?'<div>'+T(b.why)+'</div>':'');
 }else if(b.type==='calc'){
  var rc=0;
  b.items.forEach(function(it,i){
   var v=num(a[i]),okc=v!==null&&Math.abs(v-it.ans)<=(it.tol||0.005);if(okc)rc++;
   html+='<div class="rrow"><div>'+T(it.q)+'</div><div class="ans">'+(a[i]?esc(a[i]):U('empty'))+' '+esc(it.unit||'')+'</div>'+(okc?'<span class="right">✓</span>':'<span class="right">'+U('right')+': '+String(it.ans).replace('.',',')+' '+esc(it.unit||'')+'</span>')+
    '<div class="steps"><b>'+U('steps')+':</b><br>'+it.steps.map(function(s){return T(s);}).join('<br>')+'</div></div>';
  });
  var f2=rc/b.items.length;got=pts*f2;st=done(b)?ST(f2):'open';
 }else if(b.type==='cloze'){
  var gi=0,rg=0,wl='';
  b.text.replace(/\{\{(.+?)\}\}/g,function(m,x){var i=gi++,vals=x.split('|'),v=a[i]||'';
   if(v&&vals.some(function(k){return ok1(v,k);}))rg++;else wl+='<div><span class="wrong">'+(v?esc(v):U('empty'))+'</span> → <span class="right">'+esc(vals[0])+'</span></div>';return m;});
  var f3=gi?rg/gi:0;got=pts*f3;st=done(b)?ST(f3):'open';html='<div>'+rg+' / '+gi+'</div>'+wl+(b.why?'<div>'+T(b.why)+'</div>':'');
 }else if(b.type==='read'){
  var r=S.rd[b.id]||{q:{}},q=b.quiz||[],rq=0;
  q.forEach(function(x,i){if(r.q&&r.q[i]===x.ans)rq++;});
  var f4=q.length?rq/q.length:(r.chk?1:0);got=0;st=done(b)?ST(f4):'open';
  html='<div>'+rq+' / '+q.length+'</div>';
  q.forEach(function(x,i){if(r.q&&r.q[i]!==undefined&&r.q[i]!==x.ans)html+='<div class="rrow">'+T(x.q)+'<div class="right">'+U('right')+': '+esc(x.opts[x.ans])+'</div><div>'+T(x.why)+'</div></div>';});
 }
 return {got:got,pts:pts,st:st,html:html};
}
function fmt(x){return (Math.round(x*2)/2).toString().replace('.',',');}
function renderResults(){

 el.classList.add('on');

 if(act==='mark'){var r=S.rd[id];if(r.chk)return;var i=+t.dataset.i,k=r.marks.indexOf(i);if(k>=0)r.marks.splice(k,1);else r.marks.push(i);t.classList.toggle('mk');save();return;}
 if(act==='markchk'){S.rd[id].chk=1;refresh(id);return;}
 if(act==='remark'){S.rd[id].chk=0;S.rd[id].marks=[];refresh(id);return;}
 if(act==='submit'){S.sub=true;renderResults();save();$('#results').scrollIntoView({behavior:'smooth'});return;}
 if(act==='again'){S.sub=false;$('#results').classList.remove('on');save();window.scrollTo(0,0);return;}
 if(act==='pdf'){renderResults();setTimeout(function(){window.print();},50);return;}
 if(act==='next'||t.id==='btnReset'){return;}

 if(d.in){A(d.in)[d.i]=t.value;}else if(d.calc){A(d.calc)[d.i]=t.value;}else if(d.gap){A(d.gap)[d.i]=t.value;}else return;
 progress();updTodo();save();

document.addEventListener('change',function(e){

 if(t.id==='inDate'){S.date=t.value;save();return;}
 if(d.can!==undefined){S.can[d.can]=t.checked;save();return;}
 if(d.sel){A(d.sel)[d.r+'_'+d.c]=t.value;}
 else if(d.mc){A(d.mc).v=+t.value;refresh(d.mc);updTodo();return;}
 else if(d.rq){var r=S.rd[d.rq];if(r.q[d.i]===undefined){r.q[d.i]=+t.value;refresh(d.rq);updTodo();}return;}
 else return;
 progress();updTodo();save();
});
document.addEventListener('toggle',function(e){
 var t=e.target;if(t.classList&&t.classList.contains('tip')&&t.dataset.id&&t.open&&!S.tip[t.dataset.id]){S.tip[t.dataset.id]=1;save();}
},true);

draw();
if(had&&(Object.keys(S.a).length||S.name))toast(U('resume'));
