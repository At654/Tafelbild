er zahlt bei „frei Haus“ den Transport?", "o": ["der Verkäufer", "der Käufer", "die Spedition"], "a": 0}}, {"k": "task", "id": "a2", "n": "Aufgabe 2", "h": "Ein Angebot auseinandernehmen", "intro": "Ab 200 Stück gewähren wir 10 % Rabatt.", "tip": "Ein Angebot liest man wie eine Checkliste: Ware – Preis – Rabatt – Zahlung – Lieferung – Lieferzeit.", "items": [{"t": "calc", "id": "a2.1", "q": "200 Thermobecher zu 4,20 € je Stück: Wie hoch ist der Listenpreis gesamt?", "a": 840, "unit": "€", "steps": ["200 × 4,20 € = 840,00 €"]}, {"t": "mc", "id": "a2.2", "q": "Lieferung unfrei, Fracht ca. 18,00 €: Was sind die 18,00 €?", "o": ["Bezugskosten", "Rabatt", "Handlungskosten"], "a": 0, "ex": "Das sind Bezugskosten – sie kommen zum Preis dazu."}]}, {"k": "task", "id": "a3", "n": "Aufgabe 3", "h": "Nachlässe und Lieferungsbedingungen", "intro": "Ergänze die Lücken.", "tip": "Skonto gibt es für vorzeitige Zahlung der Rechnung innerhalb einer vereinbarten Frist.", "items": [{"t": "sel", "id": "a3.1", "q": "Welcher Begriff passt?", "o": ["Mengenrabatt", "Bonus", "Skonto"], "rows": [["Nachlass bei Bestellung größerer Stückzahlen", 0], ["Nachlass, der nachträglich bei Erreichen einer Umsatzhöhe gewährt wird", 1], ["Nachlass für vorzeitige Zahlung innerhalb einer Frist", 2]]}, {"t": "tf", "id": "a3.2", "q": "Richtig oder falsch?", "rows": [["„frei Haus“: Transportkosten zahlt der Verkäufer.", true], ["„ab Werk“: Transportkosten zahlt der Verkäufer.", false], ["Zahle ich am 8. Tag, ziehe ich 2 % ab.", true], ["Zahle ich am 25. Tag, ziehe ich 2 % ab.", false]]}]}, {"k": "task", "id": "a4", "n": "Aufgabe 4", "h": "Angebote lesen wie in der Prüfung", "intro": "Löse die Aufgaben. Die letzte kommt aus Modul 2.", "tip": "Bezugskosten sind …", "items": [{"t": "mc", "id": "a4.1", "q": "4.1 Welche Erklärung zu „Skonto“ ist richtig?", "o": ["Skonto wird gewährt, wenn große Stückzahlen bestellt werden.", "Skonto wird automatisch bei einer Erstbestellung gewährt.", "Skonto wird gewährt, wenn die Bestellung innerhalb einer Frist erfolgt.", "Skonto wird nur bei langjähriger Geschäftsbeziehung am Jahresende gewährt.", "Skonto wird gewährt, wenn die Rechnung innerhalb einer vereinbarten Frist bezahlt wird."], "a": 4}, {"t": "mc", "id": "a4.2", "q": "4.2 Stellen Sie fest, bei welchen Kosten es sich NICHT um Bezugskosten handelt!", "o": ["Kosten, die der Lieferer für die Anlieferung per Lkw berechnet", "Kosten für Luftfracht bei Ware aus dem Ausland", "Kosten, die der Lieferant für Verpackung berechnet", "Kosten für die Zwischenlagerung der Ware in einem Fremdlager", "Kosten, die der Lieferant für Paketporto berechnet"], "a": 3}, {"t": "mc", "id": "a4.3", "q": "4.3 Die Kosten für die Anlieferung der Waren sind gestiegen. Welche Auswirkung hat das auf die Kalkulation?", "o": ["Der Listeneinkaufspreis erhöht sich.", "Der Zieleinkaufspreis erhöht sich.", "Der Bezugspreis erhöht sich.", "Der Bareinkaufspreis erhöht sich.", "Der Handlungskostenzuschlagssatz erhöht sich."], "a": 2}, {"t": "free", "id": "a4.4", "q": "Welcher Teil ist eine Zahlungsbedingung, welcher eine Lieferungsbedingung?", "model": "Zahlungsbedingung: Anzahlung 10 %, Rest 10 Tage nach Lieferung ohne Abzug · Lieferungsbedingung: Lieferung auf Kosten des Käufers"}, {"t": "calc", "id": "a4.5", "q": "4.5 Alt (Modul 2): Täglicher Absatz 25 Stück, Lieferzeit 14 Tage, Mindestbestand 100 Stück. Ermittle den Meldebestand.", "a": 450, "unit": "Stück", "steps": ["25 × 14 = 350", "350 + 100 = 450 Stück"], "traps": [[350, "Mindestbestand vergessen."]]}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Was Skonto wirklich wert ist – und der Erfüllungsort", "intro": "Rechne das in einen Jahreszins um (Jahr = 360 Tage).", "tip": "2 % für 20 Tage. Wie viel für 360 Tage?", "items": [{"t": "calc", "id": "a5.1", "q": "„2 % Skonto innerhalb von 10 Tagen oder 30 Tage netto.“ Jahreszins in %?", "a": 36, "unit": "%", "steps": ["2 % für 20 Tage", "2 × 360 : 20 = 36 % im Jahr"]}, {"t": "free", "id": "a5.2", "q": "5.2 ○ Im Angebot steht: „Erfüllungsort für beide Teile ist Bamberg.“ Erkläre, was das bedeutet und was ohne diese Vereinbarung gelten würde (§§ 269, 270 BGB).", "model": "Erfüllungsort = Ort, an dem die Leistung zu erbringen ist; dort gehen Gefahr und Kosten über. Ohne Vereinbarung: Wohnort/Sitz des Schuldners – für die Ware der Verkäufer, für das Geld der Käufer (Geld ist aber auf Gefahr und Kosten des Käufers zu übermitteln)."}]}]};
var TR={"title": ["Trong chào giá có gì", "", "", "", "", "", "ماذا يوجد في العرض", "Teklifte neler yazar"], "can.0": ["kể các thành phần của chào giá (hàng hóa, giá, các khoản giảm giá, điều kiện thanh toán và giao hàng, thời gian giao hàng).", "", "", "", "", "", "ذكر مكونات العرض (البضاعة، السعر، الخصومات، شروط الدفع والتوريد، مدة التوريد).", "bir teklifin unsurlarını söylemek (mal, fiyat, indirimler, ödeme ve teslim koşulları, teslim süresi)."], "can.1": ["phân biệt giảm giá (Rabatt), thưởng doanh số (Bonus) và chiết khấu thanh toán (Skonto).", "", "", "", "", "", "التمييز بين الخصم (Rabatt) والمكافأة (Bonus) وخصم الدفع النقدي (Skonto).", "indirim (Rabatt), bonus ve iskontoyu (Skonto) ayırt etmek."], "can.2": ["đọc và giải thích điều kiện thanh toán („chiết khấu 2 % trong vòng 10 ngày, 30 ngày không chiết khấu“).", "", "", "", "", "", "قراءة شروط الدفع وشرحها („خصم 2 % خلال 10 أيام، 30 يوماً صافياً“).", "ödeme koşullarını okumak ve açıklamak („10 gün içinde %2 iskonto, 30 gün net“)."], "can.3": ["nói được ai chịu chi phí vận chuyển khi „giao tận nơi miễn phí“, „chưa trả cước“ và „giao tại xưởng“.", "", "", "", "", "", "أن أقول من يتحمل تكاليف النقل في „التوصيل مجاناً للمنزل“ و„غير مدفوع“ و„من المصنع“.", "„adrese teslim“, „ücreti alıcıya ait“ ve „fabrika teslim“ durumlarında taşıma masraflarını kimin ödediğini söylemek."], "can.4": ["giải thích chi phí nào là chi phí mua hàng (Bezugskosten) – và chi phí nào không phải.", "", "", "", "", "", "شرح ما هي تكاليف الشراء (Bezugskosten) – وما ليست كذلك.", "hangi maliyetlerin alış giderleri (Bezugskosten) olduğunu – ve hangilerinin olmadığını açıklamak."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Tờ quảng cáo, cửa sổ trưng bày và quảng cáo hướng đến công chúng. Chúng không phải là chào giá.", "", "", "", "", "", "النشرة وواجهة العرض والدعاية موجهة إلى العموم. وهي ليست عرضاً.", "Broşür, vitrin ve reklam herkese yöneliktir. Bunlar teklif değildir."], "a1.1.q": ["1.1 Tờ quảng cáo có phải là chào giá không? Giải thích. (Mô-đun 5)", "", "", "", "", "", "1.1 هل النشرة عرض؟ علّل. (الوحدة 5)", "1.1 Broşür bir teklif midir? Gerekçelendir. (Modül 5)"], "a1.1.o0": ["Không, nó hướng đến công chúng.", "", "", "", "", "", "لا، فهي موجهة إلى العموم.", "Hayır, herkese yöneliktir."], "a1.1.o1": ["Có, luôn luôn.", "", "", "", "", "", "نعم، دائماً.", "Evet, her zaman."], "a1.1.o2": ["Chỉ vào cuối tuần.", "", "", "", "", "", "فقط في نهاية الأسبوع.", "Sadece hafta sonu."], "a1.2.q": ["1.2 Câu „khi còn hàng“ trong chào giá có tác dụng gì? (Mô-đun 5)", "", "", "", "", "", "1.2 ما تأثير „حتى نفاد الكمية“ في العرض؟ (الوحدة 5)", "1.2 Teklifte „stoklarla sınırlı“ ne etki yapar? (Modül 5)"], "a1.2.o0": ["số lượng không ràng buộc", "", "", "", "", "", "الكمية غير مُلزمة", "miktar bağlayıcı değil"], "a1.2.o1": ["chỉ có giá là không ràng buộc", "", "", "", "", "", "السعر فقط غير مُلزم", "sadece fiyat bağlayıcı değil"], "a1.2.o2": ["toàn bộ chào giá không ràng buộc", "", "", "", "", "", "العرض كله غير مُلزم", "teklifin tamamı bağlayıcı değil"], "a1.3.q": ["1.5 Kỹ thuật đặt câu hỏi nào phù hợp để xác định nhu cầu? Nêu một ví dụ. (Ngân hàng câu hỏi · LF 2)", "", "", "", "", "", "1.5 أي أسلوب أسئلة يناسب تحديد حاجة الزبون؟ اذكر مثالاً. (بنك الأسئلة · LF 2)", "1.5 İhtiyaç belirleme için hangi soru tekniği uygundur? Bir örnek ver. (Havuz · LF 2)"], "r1.h": ["Đọc thêm: Nội dung của chào giá (Sách giáo khoa tr. 32–37)", "", "", "", "", "", "للقراءة: محتوى العرض (الكتاب ص 32–37)", "Okuma: Bir teklifin içeriği (Ders kitabı s. 32–37)"], "r1.s": ["Chiết khấu thanh toán không phải là giảm giá theo số lượng.", "", "", "", "", "", "خصم الدفع النقدي ليس خصم كمية.", "İskonto bir miktar indirimi değildir."], "r1.p0": ["Giảm giá được trừ ngay trên hóa đơn. Thưởng doanh số đến sau, ví dụ vào cuối năm. Chiết khấu thanh toán được cho khi trả tiền nhanh.", "", "", "", "", "", "الخصم يُخصم فوراً على الفاتورة. المكافأة تأتي لاحقاً، مثلاً في نهاية السنة. خصم الدفع النقدي يُمنح مقابل الدفع السريع.", "İndirim faturada hemen düşülür. Bonus sonradan gelir, ör. yıl sonunda. İskonto hızlı ödeme için verilir."], "r1.p1": ["Với giao tận nơi miễn phí, người bán trả tiền vận chuyển. Với giao tại xưởng, người mua trả.", "", "", "", "", "", "في التوصيل مجاناً للمنزل يدفع البائع النقل. في من المصنع يدفع المشتري.", "Adrese teslimde taşımayı satıcı öder. Fabrika teslimde alıcı öder."], "r1.p2": ["Chi phí mua hàng là chi phí cho đến khi hàng đến chỗ chúng ta (cước, bao bì, bưu phí). Tiền thuê và lưu kho trong doanh nghiệp không phải chi phí mua hàng.", "", "", "", "", "", "تكاليف الشراء هي التكاليف حتى تصل البضاعة إلينا (الشحن، التغليف، البريد). الإيجار والتخزين في الشركة ليست تكاليف شراء.", "Alış giderleri, mal bize ulaşana kadarki masraflardır (navlun, ambalaj, posta). İşletmedeki kira ve depolama alış gideri değildir."], "r1.qq": ["Với „giao tận nơi miễn phí“, ai trả tiền vận chuyển?", "", "", "", "", "", "من يدفع النقل في „التوصيل مجاناً للمنزل“؟", "„Adrese teslim“de taşımayı kim öder?"], "r1.q.o0": ["người bán", "", "", "", "", "", "البائع", "satıcı"], "r1.q.o1": ["người mua", "", "", "", "", "", "المشتري", "alıcı"], "r1.q.o2": ["công ty vận tải", "", "", "", "", "", "شركة الشحن", "nakliye şirketi"], "a2.h": ["Phân tích một chào giá", "", "", "", "", "", "تحليل عرض", "Bir teklifi parçalara ayırmak"], "a2.i": ["Từ 200 cái chúng tôi giảm 10 %.", "", "", "", "", "", "من 200 قطعة نمنح خصماً 10 %.", "200 adetten itibaren %10 indirim veriyoruz."], "a2.t": ["Đọc chào giá như một danh sách kiểm tra: hàng – giá – giảm giá – thanh toán – giao hàng – thời gian giao hàng.", "", "", "", "", "", "يُقرأ العرض كقائمة تحقق: البضاعة – السعر – الخصم – الدفع – التوريد – مدة التوريد.", "Bir teklif kontrol listesi gibi okunur: mal – fiyat – indirim – ödeme – teslimat – teslim süresi."], "a2.1.q": ["200 cốc giữ nhiệt giá   if(it.legend)h+='<div class="meta">'+esc(it.legend)+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>'+tlo(it.id+'.g');
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p,pi){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'+tlo(b.id+'.p'+pi)}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
