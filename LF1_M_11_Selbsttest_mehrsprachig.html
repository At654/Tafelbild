<title>Modul 11 – Selbsttest mehrsprachig – Unternehmensziele</title>
<style>
  :root{--blau:#1F4E79;--blauhell:#9DC3E6;--blauflaeche:#EAF1F8;--rosa:#E5B8B7;--grau:#F2F2F2;--graulinie:#BFBFBF;--grautext:#595959;--rot:#C00000;--gruen:#2E6B45;--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif;--tr:#7a3d00;--trbg:#FFF4E5}

  .langbar .lbl{font-size:13px;color:var(--grautext);margin-right:4px}
  .lb{font-family:var(--sans);font-size:14px;border:1px solid var(--blau);background:#fff;color:var(--blau);border-radius:18px;padding:6px 12px;cursor:pointer;min-height:36px;margin:0}
  .lb[aria-pressed=true]{background:var(--blau);color:#fff}
  .frage{margin:0 0 22px;padding:0 0 4px}

  .qlang{display:flex;gap:4px;margin:2px 0 6px;flex-wrap:wrap}
  .qlang button{font-family:var(--sans);font-size:12px;border:1px solid var(--graulinie);background:#fff;color:var(--grautext);border-radius:12px;padding:3px 8px;cursor:pointer;margin:0;min-height:28px}
  .qlang button[aria-pressed=true]{background:var(--trbg);border-color:var(--tr);color:var(--tr);font-weight:bold}
  .trl{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic","Nyala","Abyssinica SIL",sans-serif;font-size:15px;color:var(--tr);background:var(--trbg);border-left:3px solid #E9A659;padding:2px 8px;margin:3px 0 4px;border-radius:2px;display:block;line-height:1.45;font-weight:normal}
  label.opt{display:block;padding:6px 8px 6px 2px;cursor:pointer;border-radius:3px}
  label.opt:hover{background:var(--blauflaeche)}
  label.opt input{margin-right:9px}
  label.opt .trl{margin-left:24px}
  table.zuord{border-collapse:collapse;width:100%;margin-bottom:8px}
  table.zuord th{background:var(--rosa);font-family:var(--sans);font-size:14px;text-align:left;padding:8px 10px;border:1px solid var(--graulinie)}
  table.zuord td{border:1px solid var(--graulinie);padding:8px 10px;vertical-align:middle}
  table.zuord td.begriff{font-weight:bold;width:34%}

  .speicher{background:var(--blauflaeche);border:1px solid var(--blauhell);padding:12px 14px;margin:0 0 14px;font-family:var(--sans);font-size:15px}

  .speicher .w{display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;background:#fff;border:1px solid var(--blauhell);border-radius:12px}
  .speicher .w small{color:var(--tr);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic","Nyala","Abyssinica SIL",sans-serif}
  .lueckentext{line-height:2.5}
  .lueckentext select{width:auto;min-width:170px}
  button.gross{font-family:var(--sans);font-size:17px;font-weight:bold;color:#fff;background:var(--blau);border:0;border-radius:4px;padding:14px 30px;cursor:pointer;margin-top:26px}
  button.gross:hover{background:#17395a}
  button.zweit{background:#fff;color:var(--blau);border:1px solid var(--blau);font-weight:normal;font-size:15px;padding:9px 18px;margin-left:0}
  #ergebnis{display:none}
  .note{display:flex;align-items:center;gap:26px;border:2px solid var(--blau);padding:20px 24px;margin-bottom:8px;flex-wrap:wrap}
  .note .zahl{font-family:var(--sans);font-size:74px;font-weight:bold;color:var(--blau);line-height:1}
  .note .daten{font-family:var(--sans);font-size:16px}
  .note .daten .gross{font-size:22px;font-weight:bold}
  .namensfeld{font-family:var(--sans);font-size:15px;margin:14px 0 26px}
  .namensfeld input{width:260px}
  .detail{border-top:1px solid var(--graulinie);padding:12px 0}
  .detail .kopfz{font-family:var(--sans);font-weight:bold;font-size:15px}
  .detail .kopfz .ok{color:var(--gruen)}
  .detail .kopfz .nein{color:var(--rot)}
  .detail .loesung{margin:6px 0 0;padding:8px 12px;background:var(--grau);border-left:4px solid var(--rot);font-size:16px}
  .detail .loesung b{color:var(--rot)}
  .konto{font-family:var(--sans);font-size:15px;background:var(--blauflaeche);border:1px solid var(--blauhell);padding:10px 14px;margin:10px 0}
  @media (max-width:600px){.langbar{position:static}}
  @media print{button,.langbar,.qlang{display:none}}
</style>
<style id="design-2026">
/* ===== Design 2026 · Selbsttest (Überarbeitung) ===== */
:root{
  --d-blau:#3b5bdb;--d-blau-hell:#eef3ff;
  --d-bg:#eaf0fa;--d-karte:#ffffff;--d-linie:#dde5f3;
  --d-text:#1d2639;--d-muted:#5b6578;
  --d-ok:#17935a;--d-ok-bg:#e5f7ee;--d-bad:#e03b3b;--d-bad-bg:#ffe8e8;
  --d-schatten:0 2px 6px rgba(22,36,70,.06),0 10px 28px rgba(22,36,70,.08);
  --ico-liste:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M9 11l3 3L22 4%22/%3E%3Cpath d=%22M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11%22/%3E%3C/svg%3E");--ico-restart:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M3 12a9 9 0 1 0 2.6-6.4L3 8%22/%3E%3Cpath d=%22M3 3v5h5%22/%3E%3C/svg%3E");--ico-bulb:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M9 18h6M10 22h4%22/%3E%3Cpath d=%22M12 2a7 7 0 0 0-4 12.7c.7.5 1 1.3 1 2.1V17h6v-.2c0-.8.3-1.6 1-2.1A7 7 0 0 0 12 2z%22/%3E%3C/svg%3E");--ico-target:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23000%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%226%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%222%22/%3E%3C/svg%3E");
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--d-bg);color:var(--d-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.blatt{position:relative;max-width:860px;margin:24px auto;padding:0 28px 44px;background:var(--d-karte);border-radius:22px;box-shadow:var(--d-schatten)}

/* Fortschritt am oberen Rand der Karte */
.fortschritt{position:sticky;top:0;z-index:20;margin:0 -28px 24px;padding:14px 28px 12px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:22px 22px 0 0;border-bottom:1px solid var(--d-linie)}
.fbar{height:10px;background:#e6ecf8;border-radius:999px;overflow:hidden}
.fbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#5b7cff,#8b5cf6,#14b8a6);background-size:200% 100%;transition:width .6s cubic-bezier(.2,.8,.2,1);animation:glanz 3s linear infinite}
@keyframes glanz{to{background-position:200% 0}}
.fzahl{display:block;text-align:right;font-size:13px;font-weight:700;color:var(--d-muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* Kopf */
header.kopf{display:flex;align-items:stretch;margin:0 0 26px;border:1px solid var(--d-linie);border-radius:14px;overflow:hidden;background:#fbfcff}
header.kopf .li{flex:0 0 32%;padding:12px 14px;border-right:1px solid var(--d-linie);font-size:14px;color:var(--d-muted);font-family:inherit}
header.kopf .mi{flex:1;padding:12px 14px;text-align:center}
header.kopf .mi .lf{font-family:inherit;font-weight:800;font-size:16px;color:var(--d-blau)}
header.kopf .mi .lftxt{font-family:inherit;font-size:14px;color:var(--d-muted);padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--d-linie)}
header.kopf .mi .mod{font-family:inherit;font-weight:800;font-size:15px}

h1{font-family:inherit;font-size:clamp(23px,4.6vw,30px);line-height:1.2;font-weight:800;letter-spacing:-.02em;color:#17213a;margin:0 0 8px;padding:0;border:0}
.unter{font-family:inherit;font-size:15px;color:var(--d-muted);margin:0 0 22px}
h2{font-family:inherit;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:var(--d-blau);margin:34px 0 10px;padding:0;border:0}
h2::before{content:"";flex:0 0 6px;height:22px;border-radius:4px;background:linear-gradient(180deg,#5b7cff,#8b5cf6)}
.hinweis{position:relative;font-family:inherit;font-style:normal;font-size:15px;color:var(--d-muted);margin:0 0 14px;padding:10px 14px 10px 42px;background:#f5f8ff;border-radius:12px}
.hinweis::before{content:"";position:absolute;left:13px;top:11px;width:19px;height:19px;background:#d69a00;-webkit-mask:var(--ico-bulb) center/contain no-repeat;mask:var(--ico-bulb) center/contain no-repeat}

/* Fragen als Karten */
.frage{margin:0 0 16px;padding:16px 16px 8px;background:#fff;border:1px solid var(--d-linie);border-radius:16px;box-shadow:0 2px 6px rgba(22,36,70,.05)}
.frage>p.txt{margin:0 0 8px;font-weight:700;color:#1b2a4a}
.frage .nr{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 7px;margin-right:6px;border-radius:999px;background:var(--d-blau);color:#fff;font-size:14px;font-family:inherit;vertical-align:middle}

/* Antwort-Optionen als klickbare Unter-Karten */
label.opt{display:flex;align-items:center;gap:12px;margin:8px 0;padding:12px 14px;border:2px solid #e3e9f5;border-radius:12px;background:#f9fbff;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}
label.opt:hover{transform:translateY(-2px);background:#eef3ff;border-color:#a9bdf7;box-shadow:0 8px 18px rgba(59,91,219,.14)}
label.opt:active{transform:translateY(0) scale(.99)}
label.opt input{flex:0 0 auto;width:20px;height:20px;margin:0;accent-color:var(--d-blau);cursor:pointer}
label.opt:has(input:checked){border-color:var(--d-blau);background:var(--d-blau-hell);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
label.opt.ok{border-color:var(--d-ok);background:var(--d-ok-bg);box-shadow:none;transform:none;font-weight:700}
label.opt.nein{border-color:var(--d-bad);background:var(--d-bad-bg);box-shadow:none;transform:none}
label.opt.richtig{border:2px dashed var(--d-ok);background:#f3fcf7;box-shadow:none;transform:none}

/* Zuordnung & Lückentext */
table.zuord{width:100%;border-collapse:separate;border-spacing:0 10px;margin:0 0 6px}
table.zuord th{padding:0 12px 2px;background:none;border:0;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--d-muted);text-align:left}
table.zuord td{padding:10px 12px;background:#fff;border:1px solid var(--d-linie);box-shadow:0 2px 6px rgba(22,36,70,.05);vertical-align:middle}
table.zuord td:first-child{border-radius:12px 0 0 12px;border-right:0}
table.zuord td:last-child{border-radius:0 12px 12px 0}
table.zuord td.begriff{width:36%;font-weight:800;color:#1b2a4a}
select,input[type=text]{font-family:inherit;font-size:16px;color:var(--d-text);min-height:46px;max-width:100%;padding:9px 12px;background:#fff;border:2px solid #d5deef;border-radius:12px;transition:border-color .15s,background-color .15s}
select:focus,input[type=text]:focus{outline:3px solid rgba(59,91,219,.25);border-color:var(--d-blau)}
table.zuord select{width:100%}
select.ok{border-color:var(--d-ok);background:var(--d-ok-bg)}
select.nein{border-color:var(--d-bad);background:var(--d-bad-bg)}
.speicher{margin:0 0 18px;padding:14px 16px;font-family:inherit;font-size:15px;line-height:2;background:linear-gradient(135deg,#eef3ff,#f5f0ff);border:1px solid #d7e0fa;border-radius:14px}
.speicher b{color:var(--d-blau)}
.lueckentext{font-size:17px;line-height:2.5}
.lueckentext select{width:auto;min-width:170px}

/* Buttons */
button{font-family:inherit;font-size:17px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;margin-top:26px;padding:14px 28px;border:0;border-radius:14px;background:linear-gradient(135deg,#5b7cff,#3b5bdb);box-shadow:0 8px 18px rgba(59,91,219,.28);cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(59,91,219,.34)}
button:active{transform:translateY(0)}
button:focus-visible{outline:3px solid rgba(59,91,219,.35);outline-offset:3px}
button#auswerten::before,button#nochmal::before{content:"";flex:0 0 20px;width:20px;height:20px;background:currentColor;-webkit-mask:var(--ico-liste) center/contain no-repeat;mask:var(--ico-liste) center/contain no-repeat}
button#nochmal::before{-webkit-mask-image:var(--ico-restart);mask-image:var(--ico-restart)}
button.zweit{margin-left:10px;padding:12px 18px;min-height:48px;font-size:16px;font-weight:700;color:var(--d-blau);background:#fff;border:2px solid #c7d3f7;box-shadow:none}
button.zweit:hover{background:#f3f6ff;box-shadow:none}
button.zweit::before{background:var(--d-blau)}

/* Ergebnis: Noten-Badge */
#ergebnis{display:none}
.note{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:24px;margin:0 0 16px;padding:22px;background:linear-gradient(180deg,#fff,#f8faff);border:1px solid var(--d-linie);border-radius:20px;box-shadow:var(--d-schatten)}
.note .zahl{flex:0 0 132px;width:132px;height:132px;display:grid;place-items:center;border-radius:50%;font-size:70px;font-weight:900;line-height:1;background:radial-gradient(circle at 32% 28%,#fff,#9aa6b6 60%,#6b7789);color:#fff;box-shadow:inset 0 -8px 14px rgba(0,0,0,.14),0 12px 28px rgba(0,0,0,.18);animation:badge .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes badge{from{transform:scale(.3) rotate(-35deg);opacity:0}to{transform:none;opacity:1}}
.note[data-note="1"] .zahl{background:radial-gradient(circle at 32% 28%,#fff8cf,#ffd64a 38%,#e9a800 75%,#b97c00);color:#4a3200}
.note[data-note="2"] .zahl{background:radial-gradient(circle at 32% 28%,#ffffff,#d9dee7 40%,#9aa6b6 80%,#6b7789);color:#2e3643}
.note[data-note="3"] .zahl{background:radial-gradient(circle at 32% 28%,#ffe2c4,#d98a4e 45%,#a85f2a 85%,#7d4219);color:#fff}
.note[data-note="4"] .zahl{background:radial-gradient(circle at 32% 28%,#dbeaff,#5b8def 45%,#2f56c4);color:#fff}
.note[data-note="5"] .zahl{background:radial-gradient(circle at 32% 28%,#f1f5f9,#94a3b8 50%,#64748b);color:#fff}
.note[data-note="6"] .zahl{background:radial-gradient(circle at 32% 28%,#f8fafc,#b8c2d0 50%,#7b8798);color:#fff}
.note .daten{flex:1 1 220px;min-width:0;font-size:16px}
.note .daten .gross{font-size:24px;font-weight:800;color:#17213a}
#notetext{font-weight:700;color:#4b5567;margin-top:2px}
#prozent{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--d-blau)}
#prozent::before{content:"";width:18px;height:18px;background:currentColor;-webkit-mask:var(--ico-target) center/contain no-repeat;mask:var(--ico-target) center/contain no-repeat}
.pbar{height:16px;margin:8px 0 4px;background:#e6ebf6;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#5b7cff,#14b8a6);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.note[data-note="1"] .pbar i{background:linear-gradient(90deg,#f5b700,#ffe066)}
.note[data-note="2"] .pbar i{background:linear-gradient(90deg,#9aa6b6,#dfe5ee)}
.note[data-note="3"] .pbar i{background:linear-gradient(90deg,#b8733a,#f0b27a)}

/* Motivierender Text */
.motiv{display:flex;align-items:center;gap:14px;margin:0 0 20px;padding:16px 18px;border-radius:16px;font-size:18px;font-weight:700;line-height:1.35;animation:rein .6s .15s ease both}
.motiv svg{flex:0 0 auto;width:34px;height:34px}
.motiv.g1{background:#fff8db;color:#6b4a00}
.motiv.g2{background:#fff6dc;color:#6b4a00}
.motiv.g3{background:#e5f7ee;color:#0f6a41}
.motiv.g4{background:#e7f0ff;color:#1d3f9b}
.motiv.g5,.motiv.g6{background:#eef2f8;color:#334155}
@keyframes rein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.konto{margin:10px 0;padding:12px 14px;font-size:15px;background:var(--d-blau-hell);border:1px solid #d7e0fa;border-radius:12px}
.namensfeld{margin:16px 0 24px;font-size:15px}
.namensfeld input{width:min(100%,280px);margin-top:4px}

/* Auswertung je Frage */
.detail{margin:8px 0;padding:10px 14px;background:#fff;border:1px solid var(--d-linie);border-radius:12px}
.detail .kopfz{font-weight:700;font-size:15px}
.detail .kopfz .ok{color:var(--d-ok)}
.detail .kopfz .nein{color:var(--d-bad)}
.detail .loesung{margin:6px 0 0;padding:8px 12px;font-size:16px;background:var(--d-bad-bg);border-left:4px solid var(--d-bad);border-radius:8px}
.detail .loesung b{color:var(--d-bad)}

/* ===== Effekte (Feedback) ===== */
.fx{position:fixed;inset:0;z-index:9999;overflow:hidden;pointer-events:none;transition:opacity .6s ease}
.fx.aus{opacity:0}
.konf{position:absolute;top:-24px;display:block;border-radius:2px;will-change:transform;animation:konf var(--d,3s) cubic-bezier(.25,.6,.4,1) var(--v,0s) both}
@keyframes konf{to{transform:translate3d(var(--x,0),108vh,0) rotate(var(--r,540deg))}}
.stern{position:absolute;top:-40px;color:#f5b700;will-change:transform;animation:stern var(--d,4s) ease-in var(--v,0s) both}
.stern svg{display:block;width:100%;height:100%}

    var b=document.getElementById("auswerten"); b.textContent=ui("eval","")+(gl?" · "+ui("eval",gl):"");
    document.getElementById("nochmal").textContent=ui("again","")+(gl?" · "+ui("again",gl):"");
    document.getElementById("rh").innerHTML=esc(ui("result",""))+(gl?'<span class="trl" style="font-size:16px">'+esc(ui("result",gl))+'</span>':"");
    document.getElementById("ofpts").textContent=ui("ofpts","")+(gl?" · "+ui("ofpts",gl):"");
    document.getElementById("namelbl").textContent=ui("name","")+(gl?" · "+ui("name",gl):"");
  }
  function renderQ(){
    var qs=mcBox.querySelectorAll(".frage");
    D.mc.forEach(function(q,i){
      var box=qs[i], key="q"+i, l=langOf(key);
      var bar=box.querySelector(".qlang");
      var h="";
      LANGS.forEach(function(L){h+='<button type="button" data-q="'+key+'" data-l="'+L.c+'" aria-pressed="'+(l===L.c?"true":"false")+'">'+L.f+' '+L.c.toUpperCase()+'</button>';});
      bar.innerHTML=h;
      var qt=box.querySelector(".qtr"); qt.innerHTML=l?'<span class="trl">'+esc(t(q.id[0],l))+'</span>':"";
      box.querySelectorAll(".otr").forEach(function(sp){
        var k=+sp.getAttribute("data-i"); sp.innerHTML=l?'<span class="trl">'+esc(t(q.id[k+1],l))+'</span>':"";
      });
    });
    // Zuordnung
    document.querySelectorAll(".btr").forEach(function(sp){
      var i=+sp.getAttribute("data-i"), l=gl;
      sp.innerHTML=l?'<span class="trl">'+esc(t(D.z[i].id[0],l))+'</span>':"";
    });
    D.z.forEach(function(z,i){
      var sel=document.querySelector('select[name="z'+i+'"]'); var cur=sel.value;
      var o='<option value="">'+esc(ui("pick",""))+(gl?" / "+esc(ui("pick",gl)):"")+'</option>';
      zOrder.forEach(function(k){ o+='<option value="'+k+'">'+esc(D.z[k].e)+(gl?" — "+esc(t(D.z[k].id[1],gl)):"")+'</option>'; });
      sel.innerHTML=o; sel.value=cur;
    });
    // Wortspeicher + Lücken
    var sp=document.getElementById("speicher"), h='<b>'+esc(ui("wordbank",""))+':</b> ';
    wOrder.forEach(function(k){ h+='<span class="w">'+esc(D.speicher[k])+(gl?' <small>('+esc(t(D.id_w[k],gl))+')</small>':"")+'</span>'; });
    sp.innerHTML=h;
    D.luecken.forEach(function(w,i){
      var sel=document.querySelector('select[name="l'+i+'"]'); var cur=sel.value;
      var o='<option value="">'+esc(ui("pick",""))+'</option>';
      D.speicher.map(function(s,k){return k;}).sort(function(a,b){return D.speicher[a].localeCompare(D.speicher[b],"de");}).forEach(function(k){
        o+='<option value="'+k+'">'+esc(D.speicher[k])+(gl?" ("+esc(t(D.id_w[k],gl))+")":"")+'</option>';
      });
      sel.innerHTML=o; sel.value=cur;
    });
    document.getElementById("gaptr").innerHTML=gl?'<div class="trl"><b>'+esc(ui("gaphint",gl))+'</b> '+esc(t(D.id_text,gl))+'</div>':"";
  }
  function renderAll(){ renderLangBar(); renderStatic(); renderQ(); }
  document.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.classList.contains("lb")){
      gl=b.getAttribute("data-l"); ql={};
      try{ localStorage.setItem("lf1_st_lang",gl); }catch(x){}
      renderAll(); if(document.getElementById("ergebnis").style.display==="block") renderResult(last);
    } else if(b.hasAttribute("data-q")){
      var key=b.getAttribute("data-q"), l=b.getAttribute("data-l");
      ql[key]=(langOf(key)===l)?"":l; renderQ();
    }
  });

  /* ---------- Auswertung ---------- */
  function note(p){if(p>=92)return[1,"g1"];if(p>=81)return[2,"g2"];if(p>=67)return[3,"g3"];if(p>=50)return[4,"g4"];if(p>=30)return[5,"g5"];return[6,"g6"];}
  var last=null;
  function renderResult(r){
    document.getElementById("notezahl").textContent=r.n[0];
    document.getElementById("notetext").textContent=ui(r.n[1],"")+(gl?" · "+ui(r.n[1],gl):"");
    document.getElementById("punkte").textContent=r.punkte;
    document.getElementById("prozent").textContent=r.proz+" %";
    var lp=Math.round(r.proz/100*D.lp*2)/2, ls=String(lp).replace(".",",");
    function ktxt(l){ return D.lp==0 ? ui("konto0",l) : ui("konto",l).replace("{x}",ls).replace("{y}",D.lp); }
    document.getElementById("konto").innerHTML="<b>"+esc(ktxt(""))+"</b>"+(gl?'<span class="trl">'+esc(ktxt(gl))+'</span>':"");
    var box=document.getElementById("details");box.innerHTML="";
    r.det.forEach(function(d){
      var el=document.createElement("div");el.className="detail";
      var head=ui("part","")+" "+d.teil+", "+(d.kind==="q"?ui("question","")+" "+d.nr:d.kind==="z"?d.label:ui("gap","")+" "+d.nr);
      var h='<div class="kopfz">'+esc(head)+': '+(d.ok?'<span class="ok">'+esc(ui("ok",""))+'</span>':'<span class="nein">'+esc(ui("bad",""))+'</span>')+(gl?' <small style="font-weight:normal;color:#7a3d00">('+esc(ui(d.ok?"ok":"bad",gl))+')</small>':"")+'</div>';
      if(!d.ok){
        h+='<div class="loesung"><b>'+esc(ui("right",""))+'</b> '+esc(d.de)+(gl&&d.tid?'<span class="trl"><b>'+esc(ui("right",gl))+'</b> '+esc(t(d.tid,gl))+'</span>':"")+(d.erkl?'<br>'+esc(d.erkl):'')+'</div>';
      }
      el.innerHTML=h;box.appendChild(el);
    });
  }
  document.getElementById("auswerten").addEventListener("click",function(){
    var punkte=0,det=[];
    D.mc.forEach(function(q,i){
      var sel=document.querySelector('input[name="mc'+i+'"]:checked');
      var ok=!!sel&&Number(sel.value)===q.r; if(ok)punkte++;
      det.push({kind:"q",teil:1,nr:i+1,ok:ok,de:q.o[q.r],tid:q.id[q.r+1],erkl:q.e});
    });
    D.z.forEach(function(z,i){
      var v=document.querySelector('select[name="z'+i+'"]').value;
      var ok=(v!==""&&Number(v)===i); if(ok)punkte++;
      det.push({kind:"z",teil:2,label:z.b,ok:ok,de:z.e,tid:z.id[1],erkl:""});
    });
    D.luecken.forEach(function(w,i){
      var v=document.querySelector('select[name="l'+i+'"]').value;
      var k=D.speicher.indexOf(w);
      var ok=(v!==""&&Number(v)===k); if(ok)punkte++;
      det.push({kind:"l",teil:3,nr:i+1,ok:ok,de:w,tid:D.id_w[k],erkl:""});
    });
    var proz=Math.round(punkte/TOTAL*100);
    last={punkte:punkte,proz:proz,n:note(proz),det:det};
    renderResult(last);
    document.getElementById("test").style.display="none";
    document.getElementById("ergebnis").style.display="block";
    window.scrollTo(0,0);
  });
  document.getElementById("nochmal").addEventListener("click",function(){location.reload();});
  renderAll();
})();
</script>
<script id="design-2026-js">
(function(){
  "use strict";
  var ICON = {"check": "<path d=\"M20 6 9 17l-5-5\"/>", "liste": "<path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>", "restart": "<path d=\"M3 12a9 9 0 1 0 2.6-6.4L3 8\"/><path d=\"M3 3v5h5\"/>", "bulb": "<path d=\"M9 18h6M10 22h4\"/><path d=\"M12 2a7 7 0 0 0-4 12.7c.7.5 1 1.3 1 2.1V17h6v-.2c0-.8.3-1.6 1-2.1A7 7 0 0 0 12 2z\"/>", "trophy": "<path d=\"M8 21h8M12 17v4\"/><path d=\"M7 4h10v5a5 5 0 0 1-10 0z\"/><path d=\"M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3\"/>", "star": "<path d=\"M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z\"/>", "target": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"6\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/>", "rocket": "<path d=\"M12 2c3 2.5 4.5 6 4.5 10L12 17.5 7.5 12C7.5 8 9 4.5 12 2z\"/><circle cx=\"12\" cy=\"9\" r=\"1.8\"/><path d=\"M7.5 12 5 14.5V18l2.5-1.5M16.5 12 19 14.5V18l-2.5-1.5\"/><path d=\"M10 17.5v2.5h4v-2.5M11 22h2\"/>"};
  var TEXT = {
    1: "Überragend! Du hast das Thema voll im Griff!",
    2: "Klasse gemacht! Fast alles richtig.",
    3: "Gute Arbeit! Die Grundlagen sitzen.",
    4: "Bestanden! Da ist noch Potenzial nach oben.",
    5: "Noch nicht ganz geschafft – nutze die Lösungen als Trainingsplan!",
    6: "Halb so wild! Lies dir das Thema noch einmal durch und starte neu."
  };
  var SYMBOL = {1: "trophy", 2: "star", 3: "check", 4: "rocket", 5: "bulb", 6: "restart"};
  var WORT = {1: "sehr gut", 2: "gut", 3: "befriedigend", 4: "ausreichend", 5: "mangelhaft", 6: "ungenügend"};
  var REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function svg(name, cls){
    return '<svg class="' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }
  function rnd(a, b){ return a + Math.random() * (b - a); }

  /* ---------- Fortschritt ---------- */
  function fortschrittAnzeigen(){
    var form = document.getElementById("test");
    if (!form) return;
    var gruppen = {};
    form.querySelectorAll("input[type=radio]").forEach(function(r){
      if (!(r.name in gruppen)) gruppen[r.name] = false;
      if (r.checked) gruppen[r.name] = true;
    });
    var selects = form.querySelectorAll("select");
    var gesamt = Object.keys(gruppen).length + selects.length, fertig = 0;
    Object.keys(gruppen).forEach(function(k){ if (gruppen[k]) fertig++; });
    selects.forEach(function(s){ if (s.value) fertig++; });
    var bar = document.querySelector(".fbar i"), zahl = document.querySelector(".fzahl");
    if (bar) bar.style.width = (gesamt ? Math.round(fertig / gesamt * 100) : 0) + "%";
    if (zahl) zahl.textContent = fertig + " / " + gesamt;
  }

  /* ---------- Richtig / falsch markieren ---------- */
  function markiereAntworten(){
    var details = document.querySelectorAll("#details .detail");
    var fragen = document.querySelectorAll("#mc .frage");
    var zuord = document.querySelectorAll("#zuord select");
    var luecken = document.querySelectorAll("select[name^='l']");
    var nMC = fragen.length, nZ = zuord.length;
    details.forEach(function(el, i){
      var ok = !!el.querySelector(".kopfz .ok");
      var b = el.querySelector(".loesung b");
      var erwartet = (b && b.nextSibling) ? b.nextSibling.textContent.trim() : "";
      if (i < nMC){
        var sel = fragen[i].querySelector("input:checked");
        fragen[i].querySelectorAll("label.opt").forEach(function(lb){
          if (sel && lb.contains(sel)) lb.classList.add(ok ? "ok" : "nein");
          else if (!ok && erwartet && lb.textContent.trim() === erwartet) lb.classList.add("richtig");
        });
      } else if (i < nMC + nZ){
        if (zuord[i - nMC]) zuord[i - nMC].classList.add(ok ? "ok" : "nein");
      } else {
        var s = luecken[i - nMC - nZ];
        if (s) s.classList.add(ok ? "ok" : "nein");
      }
    });
  }

  /* ---------- Effekte ---------- */
  function neueEffektebene(){
    var alt = document.querySelector(".fx");
    if (alt) alt.parentNode.removeChild(alt);
    var b = document.createElement("div");
    b.className = "fx";
    b.setAttribute("aria-hidden", "true");
    document.body.appendChild(b);
    return b;
  }
  function konfetti(ebene){
    var farben = ["#ff6b6b", "#ffd43b", "#51cf66", "#339af0", "#cc5de8", "#ff922b", "#20c997"];
    var n = REDUCE ? 12 : 90;
    for (var i = 0; i < n; i++){
      var p = document.createElement("i");
      p.className = "konf";
      p.style.left = rnd(0, 100) + "%";
      p.style.background = farben[i % farben.length];
      p.style.width = rnd(7, 12) + "px";
      p.style.height = rnd(10, 18) + "px";
      p.style.borderRadius = Math.random() < 0.3 ? "50%" : "2px";
      p.style.setProperty("--x", rnd(-120, 120) + "px");
      p.style.setProperty("--r", rnd(360, 900) + "deg");
      p.style.setProperty("--d", rnd(2.2, 3.8) + "s");
      p.style.setProperty("--v", rnd(0, 0.8) + "s");
      ebene.appendChild(p);
    }
  }
  function sternenregen(ebene){
    var n = REDUCE ? 6 : 24;
    for (var i = 0; i < n; i++){
      var s = document.createElement("span");
      s.className = "stern";
      s.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>';
      var size = rnd(18, 34);
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = rnd(0, 100) + "%";
      s.style.setProperty("--x", rnd(-40, 40) + "px");
      s.style.setProperty("--d", rnd(3.5, 5.5) + "s");
      s.style.setProperty("--v", rnd(0, 1.2) + "s");
      ebene.appendChild(s);
    }
  }
  function heldenSymbol(ebene, note){
    var h = document.createElement("div");
    h.className = "hero";
    var inhalt = "";
    if (note === 3) inhalt = '<svg class="ic puls" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path class="haken" d="M7.5 12.5l3 3 6-6.5"/></svg>';
    if (note === 4) inhalt = '<svg class="ic wackel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON.rocket + '</svg><div class="pad"></div>';
    if (note === 5) inhalt = '<svg class="ic licht" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON.bulb + '</svg>';
    if (note === 6) inhalt = '<svg class="ic drehen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON.restart + '</svg>';
    h.innerHTML = inhalt;
    ebene.appendChild(h);
  }
  function zeigeEffekt(note){
    var ebene = neueEffektebene();
    if (note === 1) konfetti(ebene);
    else if (note === 2) sternenregen(ebene);
    else heldenSymbol(ebene, note);
    setTimeout(function(){ ebene.classList.add("aus"); }, 3000);
    setTimeout(function(){ if (ebene.parentNode) ebene.parentNode.removeChild(ebene); }, 3700);
  }

  /* ---------- Zentrale Feedback-Funktion ---------- */
  function zeigeFeedback(note, prozent){
    var n = Math.min(6, Math.max(1, Math.round(Number(note)) || 6));
    var fb = document.querySelector(".fortschritt");
    if (fb) fb.style.display = "none";
    var box = document.getElementById("ergebnis");
    var nb = box ? box.querySelector(".note") : null;
    if (nb){
      nb.setAttribute("data-note", n);
      var zahl = document.getElementById("notezahl");
      if (zahl && zahl.textContent.trim() !== String(n)) zahl.textContent = String(n);
      var pz = document.getElementById("prozent");
      var p = (typeof prozent === "number") ? prozent : parseInt(pz ? pz.textContent : "", 10);
      if (!isNaN(p)){
        if (pz) pz.textContent = p + " %";
        var daten = nb.querySelector(".daten");
        var pb = daten ? daten.querySelector(".pbar") : null;
        if (daten && !pb){
          pb = document.createElement("div");
          pb.className = "pbar";
          pb.innerHTML = "<i></i>";
          if (pz) pz.insertAdjacentElement("afterend", pb); else daten.appendChild(pb);
        }
        var fuell = pb ? pb.querySelector("i") : null;
        if (fuell){
          fuell.style.width = "0%";
          requestAnimationFrame(function(){ requestAnimationFrame(function(){ fuell.style.width = Math.max(0, Math.min(100, p)) + "%"; }); });
        }
      }
      var wort = document.getElementById("notetext");
      if (wort && !wort.textContent.trim()) wort.textContent = WORT[n];
      var motiv = box.querySelector(".motiv");
      if (!motiv){
        motiv = document.createElement("div");
        nb.insertAdjacentElement("afterend", motiv);
      }
      motiv.className = "motiv g" + n;
      motiv.innerHTML = svg(SYMBOL[n]) + "<span>" + TEXT[n] + "</span>";
    }
    zeigeEffekt(n);
  }
  window.zeigeFeedback = zeigeFeedback;

  /* ---------- Start ---------- */
  var form = document.getElementById("test");
  if (form){
    var blatt = document.querySelector(".blatt");
    if (blatt && !document.querySelector(".fortschritt")){
      var f = document.createElement("div");
      f.className = "fortschritt";
      f.innerHTML = '<div class="fbar"><i></i></div><span class="fzahl">0 / 0</span>';
      blatt.insertBefore(f, blatt.firstChild);
    }
    form.addEventListener("change", fortschrittAnzeigen);
    form.addEventListener("input", fortschrittAnzeigen);
    fortschrittAnzeigen();
    var ausw = document.getElementById("auswerten");
    if (ausw){
      // Diese Zeile läuft nach der bestehenden Auswertung der Seite und liest deren Ergebnis.
      ausw.addEventListener("click", function(){
        var note = parseInt((document.getElementById("notezahl") || {}).textContent, 10);
        var proz = parseInt((document.getElementById("prozent") || {}).textContent, 10);
        markiereAntworten();
        if (!isNaN(note)) zeigeFeedback(note, isNaN(proz) ? undefined : proz);
      });
    }
  }
  /* Icons für Hinweise werden per CSS gesetzt; Vorschau-Seite nutzt zusätzlich zeigeFeedback direkt. */
})();
</script>
</body>
