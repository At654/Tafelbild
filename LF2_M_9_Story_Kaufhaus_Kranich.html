.kbox b{font-family:var(--display);font-size:1.4rem;color:var(--c)}
.kbox i{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0}
.cat{border-radius:14px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:6px}
.cat b{font-family:var(--display);font-size:1.2rem}
.opts.five2{grid-template-columns:repeat(5,1fr)}
.duel{background:var(--surface);border:2px solid var(--brand);border-radius:14px;padding:14px 16px;margin-top:14px}
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.prod{border:2px solid var(--tc);border-top-width:10px;border-radius:14px;padding:12px;background:var(--surface)}
.prod .pn{font-family:var(--display);font-size:1.3rem}
.sl{list-style:none;padding:0;margin:8px 0 0}
.sl li{display:flex;justify-content:space-between;gap:6px;background:var(--surface2);border-radius:8px;padding:6px 8px;margin:5px 0;font-size:1.05rem}
.sl li button{padding:.05em .45em;font-size:.85rem}
.vbar{position:relative;height:30px;border-radius:8px;background:var(--surface2);overflow:hidden}
.vbar i{display:block;height:100%}.vbar b{position:absolute;left:10px;top:4px}
.podium div{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end}
.podium .temb{background:rgba(255,255,255,.2)!important}
.gl{padding-left:0;list-style:none}.gl li{background:var(--surface);border-radius:10px;padding:8px 10px;margin:6px 0}
.gl li b{display:inline-block;width:28px;height:28px;border-radius:6px;background:var(--ok);color:#fff;text-align:center;margin-right:6px}
.top li .temb{padding:2px}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.side{position:static}.cats,.opts.five2{grid-template-columns:1fr 1fr}}
/* Handy */
.pstory{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-left:6px solid var(--brand);border-radius:12px;padding:10px 12px;margin:8px 0}
.psecret{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:3px solid var(--ok);border-radius:14px;padding:10px;margin:8px 0}
.psecret .letter{width:56px;height:64px;font-size:2.4rem}
.pteam{display:flex;gap:16px;align-items:center;color:#fff;border-radius:18px;padding:18px;margin:10px 0;font-size:1.1rem}
.pteam b{font-family:var(--display);font-size:2.2rem}
.pc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;border:2px solid var(--line);font-size:1.05rem;min-height:60px}
.pc.sel{border-color:var(--ink);background:var(--surface2)}
.pc .num{flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font-family:var(--display);font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.pc .num.e{border:2px dashed var(--line)}
.pstep{border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:10px;padding:8px 10px;margin:8px 0}
.naund{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--brand);margin:10px 0 4px}
.naund .tr{font-family:var(--body);font-size:1rem;color:var(--ink)}
.yn button{display:flex;flex-direction:column;align-items:center;gap:4px}
.yn .g{background:color-mix(in srgb,#1f5fae 14%,var(--surface));border-color:#1f5fae}
.yn .z{background:color-mix(in srgb,#a16207 14%,var(--surface));border-color:#a16207}
.big1{width:100%;padding:14px;margin-top:10px}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.pprof{border:2px dashed var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip2{padding:.35em .7em;border-radius:999px;font-size:.95rem}
.tvote{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;border:3px solid var(--tc);font-size:1.05rem}
.pov{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.lbl{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lbl .tr{text-transform:none;letter-spacing:0}
.k0{background:#1f7a3f}.k1{background:#1f5fae}.k2{background:#8a5300}.k3{background:#8537a3}.k4{background:#b3261e}
.opt{padding-right:46px}
.side .codew{gap:4px}.side .codew span{width:36px;height:44px;font-size:1.4rem}

    this.cid="p"+rnd(10);this.seen=new Map();this.onMsg=onMsg;
    const st=()=>onStatus(this.count());
    this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st));
  }
  count(){return {up:this.links.filter(l=>l.up).length,all:this.links.length};}
  recv(t,p,r){
    if(p&&typeof p==="object"&&p.mid){const now=Date.now();if(this.seen.has(p.mid))return;this.seen.set(p.mid,now);
      if(this.seen.size>3000){for(const [k,v] of this.seen){if(now-v>600000)this.seen.delete(k);}}}
    this.onMsg(t,p,r);
  }
  sub(t){this.links.forEach(l=>l.subscribe(NS+t));}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true;});return ok;}
}
function rnd(n){const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s;}
function codeGen(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(5));for(const x of r)s+=a[x%a.length];return s;}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}

const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("kranichmusik")===true,vol=(v=>typeof v==="number"?v:.3)(ls("kranichvol"));
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=vol;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    vol(v){if(v===undefined)return vol;vol=Math.max(0,Math.min(1,v));ls("kranichvol",vol);if(master)master.gain.value=vol;},
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("kranichmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();

(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()){Music.unlock();if(was)Music.start();}lab();};st.after(b);
    const r=document.createElement("input");r.type="range";r.min=0;r.max=100;r.value=Math.round(Music.vol()*100);r.className="vol";r.id="rVol";r.title="Lautstärke der Musik";r.setAttribute("aria-label","Lautstärke der Musik");r.oninput=()=>Music.vol(r.value/100);b.after(r);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();

<script>

/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="kranich9-tafel";
  const fresh=()=>({code:codeGen(),ph:0,nt:4,pl:{},ban:[],duel:{id:0,o:0,rv:0,ans:{}},op:{},done:{},q:null,qn:0,qi:{4:0,5:0},fin:{subs:[],vo:0,rv:0,vans:{},bonus:0}});
  let T=store(KEY);if(!T||!T.code||!T.pl||!T.fin||!T.qi)T=fresh();
  let conn={up:0},pubT=null,renT=null,sure=0,shown={},dT=null,dLeft=0,secret=0;
  const save=()=>store(KEY,T);
  const net=new Net(onMsg,c=>{conn=c;renderHead();pub();});
  net.sub(T.code+"/in");
  const players=()=>Object.entries(T.pl);
  const joinUrl=()=>location.origin+location.pathname+"?s="+T.code+(LOCAL?"&bc=1":"");
  const ranking=()=>players().sort((a,b)=>b[1].pts-a[1].pts||a[1].n.localeCompare(b[1].n));
  function teamStats(){const a=[];for(let i=0;i<T.nt;i++)a.push({i,n:0,sum:0,avg:0});
    for(const [,p] of players())if(p.tm>=0&&p.tm<T.nt){a[p.tm].n++;a[p.tm].sum+=p.pts;}
    a.forEach(t=>t.avg=t.n?Math.round(t.sum/t.n):0);return a;}
  const teamRank=()=>teamStats().filter(t=>t.n).sort((x,y)=>y.avg-x.avg||x.i-y.i);
  function assignTeam(pid){const c=Array(T.nt).fill(0);for(const [id,p] of players())if(id!==pid&&p.tm>=0&&p.tm<T.nt)c[p.tm]++;
    const min=Math.min(...c),cand=c.map((x,i)=>x===min?i:-1).filter(i=>i>=0);T.pl[pid].tm=cand[Math.floor(Math.random()*cand.length)];}
  function remix(){shuffle(players().map(e=>e[0])).forEach((id,j)=>T.pl[id].tm=j%T.nt);}

  function state(){
    const P={};for(const [id,p] of players())P[id]=[p.pts,p.tm,cntR(p.r[2]),cntR(p.r[3]),cntR(p.r[6]),p.f];
    const q=T.q?{id:T.q.id,st:T.q.st,i:T.q.i,o:T.q.o,ord:T.q.ord,an:Object.keys(T.q.ans),sol:T.q.o?-1:(T.q.st===4?Q3[T.q.i].k:0)}:null;
    const S={c:T.code,ph:T.ph,nt:T.nt,P,op:T.op,done:T.done,duel:{id:T.duel.id,o:T.duel.o,an:Object.keys(T.duel.ans)},q,fin:{vo:T.fin.vo,rv:T.fin.rv,an:Object.keys(T.fin.vans)}};
    if(T.ph===8){S.rk=ranking().map(e=>e[0]);S.tr=teamRank().map(t=>t.i);}
    return S;}
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{save();net.pub(T.code+"/st",state(),true);},120);}
  setInterval(pub,5000);
  function later(){clearTimeout(renT);renT=setTimeout(render,300);}

  function scoreAnswer(p,st,i,a){
    if(!(i>=0&&i<NI[st])||p.r[st][i]!=="-"||typeof a!=="string")return false;
    let ch;
    if(st===2){if(!/^[012]{3}$/.test(a)||new Set(a).size!==3)return false;ch=a==="012"?"1":"0";if(ch==="1")p.pts+=100;}
    else if(st===3){if(!/^[012]{2}$/.test(a))return false;const sc=(a[0]==="0")+(a[1]==="0");ch=String(sc);p.pts+=50*sc;}
    else{if(!/^[01]$/.test(a))return false;ch=+a===SORT[i].k?"1":"0";if(ch==="1")p.pts+=50;}
    const r=p.r[st].split("");r[i]=ch;p.r[st]=r.join("");return true;}

  function onMsg(topic,m){
    if(!m||typeof m!=="object"||typeof m.pid!=="string"||!/^[a-z0-9]{6}$/.test(m.pid))return;
    const pid=m.pid;let p=T.pl[pid];
    if(m.k==="hi"){
      if(p||T.ban.includes(pid)){pub();return;}
      let n=clean(m.n,16);if(!n||players().length>=45)return;
      const names=players().map(e=>e[1].n);let base=n,i=2;while(names.includes(n))n=base.slice(0,13)+" "+(i++);
      T.pl[pid]={n,pts:0,tm:-1,r:{2:"-".repeat(NI[2]),3:"-".repeat(NI[3]),6:"-".repeat(NI[6])},f:0,fx:[]};assignTeam(pid);
      pub();renderHead();later();return;}
    if(!p)return;
    if(m.k==="a"){const st=+m.st;if(!(st in NI)||!T.op[st]||T.ph!==st||!m.as||typeof m.as!=="object")return;
      let ch=false;for(const [k,a] of Object.entries(m.as))if(scoreAnswer(p,st,Math.floor(+k),a))ch=true;
      pub();if(ch)later();return;}
    if(m.k==="d"){const d=T.duel;if(T.ph!==1||!d.o||m.id!==d.id||d.ans[pid]!==undefined)return;const c=Math.floor(+m.c);if(c!==0&&c!==1)return;
      d.ans[pid]=c;pub();const el=$("dcount");if(el)el.textContent=Object.keys(d.ans).length;return;}
    if(m.k==="q"){const q=T.q;if(!q||!q.o||m.id!==q.id||q.ans[pid])return;const c=Math.floor(+m.c),max=q.st===4?4:3;if(!(c>=0&&c<=max))return;
      q.ans[pid]={c,t:Date.now()};
      if(Object.keys(q.ans).length>=players().length)reveal();else{pub();const el=$("qcount");if(el)el.textContent=Object.keys(q.ans).length;}return;}
    if(m.k==="w"){if(T.ph!==7||!T.op[7]||!Array.isArray(m.subs))return;let ch=false;
      for(const sb of m.subs.slice(0,2)){if(!sb||typeof sb.id!=="string"||p.f>=2)continue;const id=pid+clean(sb.id,8);
        if(T.fin.subs.some(x=>x.id===id))continue;const x=clean(sb.x,180).replace(/^[„“"”»«]+|[„“"”»«]+$/g,"").trim();if(x.length<12)continue;
        T.fin.subs.push({id,pid,tm:p.tm,x});p.f++;if(p.f===1)p.pts+=50;ch=true;}
      pub();if(ch)later();return;}
    if(m.k==="fv"){const f=T.fin;if(T.ph!==7||!f.vo||f.vans[pid]!==undefined)return;const c=Math.floor(+m.c);if(!(c>=0&&c<T.nt)||c===p.tm)return;
      f.vans[pid]=c;pub();const el=$("fcount");if(el)el.textContent=Object.keys(f.vans).length;return;}
  }

  /* ---------- Live-Quiz (Station 3 und 4) ---------- */
  function settle(){const q=T.q;if(!q||q.o||q.settled)return;q.settled=1;
    const sol=q.st===4?Q3[q.i].k:0,dur=qDur(QSET[q.st][q.i]);
    for(const [pid,a] of Object.entries(q.ans))if(a.c===sol){const p=T.pl[pid];if(p)p.pts+=100+Math.round(50*Math.max(0,1-(a.t-q.t0)/(dur*1000)));}}
  function reveal(){if(!T.q||!T.q.o)return;T.q.o=0;settle();pub();render();}
  function nextQ(){const st=T.ph;if(T.q&&T.q.o){T.q.o=0;settle();}
    const set=QSET[st],i=T.qi[st];if(i>=set.length){T.q=null;pub();render();return;}
    T.qi[st]=i+1;T.q={id:T.qn++,st,i,o:1,t0:Date.now(),ord:st===5?shuffle([0,1,2,3]):[0,1,2,3,4],ans:{},settled:0};pub();render();}

  function go(ph){

  function drawQR(canvas,text){

    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){

    on("bD30",()=>{clearInterval(dT);dLeft=30;const el=$("dtm");if(el)el.textContent=dLeft;dT=setInterval(()=>{dLeft--;const e=$("dtm");if(e)e.textContent=dLeft>0?dLeft:"Zeit!";if(dLeft<=0)clearInterval(dT);},1000);});
    on("bDVote",()=>{T.duel={id:T.duel.id+1,o:1,rv:0,ans:{}};secret=0;pub();render();});
    on("bDRev",()=>{T.duel.o=0;T.duel.rv=1;pub();render();});
    on("bSec",()=>{secret=1;render();});
    on("bStart",()=>{T.op[T.ph]=1;pub();render();});
    on("bStop",()=>{T.op[T.ph]=0;pub();render();});
    on("bDone",()=>{T.done[T.ph]=1;pub();renderHead();render();});
    M.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{shown[b.dataset.show]=1;render();});
    on("bQ",nextQ);on("bRev",reveal);on("bEnd",()=>{T.q=null;pub();render();});
    on("bWStart",()=>{T.op[7]=1;pub();render();});
    on("bWStop",()=>{T.op[7]=0;pub();render();});
    on("bVote",()=>{T.op[7]=0;T.fin.vo=1;T.fin.vans={};pub();render();});
    on("bVRev",()=>{T.fin.vo=0;T.fin.rv=1;finBonus();pub();render();});
    M.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{T.fin.subs=T.fin.subs.filter(x=>x.id!==b.dataset.del);pub();render();});
  }
  renderHead();render();pub();
  setInterval(()=>{if(T.ph>=2&&T.ph<=7&&!(T.q&&T.q.o)){const sd=document.querySelector(".side");if(sd){const tmp=document.createElement("div");tmp.innerHTML=sideHTML();sd.replaceWith(tmp.firstElementChild);}}},2000);
}

/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  const P=$("phone");P.hidden=false;
  const code=roomCode,MK="kranich9-me-"+code+(params.get("t")||"");
  let me=store(MK);
  if(!me||!me.pid||!me.as)me={pid:rnd(6),n:"",lang:"de",as:{2:{},3:{},6:{}},o:{2:shuffle(STAIR.map((_,i)=>i)),3:shuffle(CHAIN.map((_,i)=>i)),6:shuffle(SORT.map((_,i)=>i))},cp:{},c3:null,subs:[],qa:{},dv:{},fv:null};
  lang=me.lang||"de";
  let S=null,lastKey="",pending=null,conn={up:0},fb=null,pick=[],draft="",warn="",warnFor="",form=true;
  const saveMe=()=>store(MK,me);
  const net=new Net((t,m)=>{if(t===NS+code+"/st"&&m&&m.c===code){S=m;render();}},c=>{conn=c;const d=$("pdot");if(d)d.className="dot "+(c.up?"on":"");});
  net.sub(code+"/st");
  function send(m){m.pid=me.pid;net.pub(code+"/in",m);}
  const my=()=>S&&S.P&&S.P[me.pid];
  function sync(){const m=my();if(!m||!S)return;
    for(const st of [2,3,6]){const loc=Object.keys(me.as[st]).length;if(S.ph===st&&S.op[st]&&loc>m[PIDX[st]])send({k:"a",st,as:me.as[st]});}
    if(S.ph===7&&S.op[7]&&me.subs.length>m[5])send({k:"w",subs:me.subs});
    if(pending&&!pending.done())send(pending.msg);}
  setInterval(()=>{if(!me.n)return;if(!my()){if(!S||S.ph!==-1)send({k:"hi",n:me.n});}else sync();},2500);
  function perm(k,n){if(!me.cp[k]){let p;do{p=shuffle([...Array(n).keys()]);}while(n>2&&p.every((x,i)=>x===i));me.cp[k]=p;saveMe();}return me.cp[k];}
  function keyOf(){const m=my();return JSON.stringify([me.n,lang,S&&[S.ph,S.nt,S.op,S.done,S.duel&&[S.duel.id,S.duel.o],S.q&&[S.q.id,S.q.o,S.q.sol],S.fin&&[S.fin.vo,S.fin.rv],S.rk&&S.rk.indexOf(me.pid),S.tr],m&&m.join(","),me.as,me.c3,me.subs.length,me.qa,me.dv,me.fv,fb,pick,warn,form]);}
  const geh=ph=>{const st=STN[ph];return S.done[ph]?`<div class="psecret"><div class="letter">${CODE[st.no-1]}</div><div><div class="lbl">${u("secret")}</div><b>${L(GEH[st.no-1])}</b></div></div>`:"";};
  const codeStrip=()=>`<div class="codew sm2">${[...CODE].map((c,j)=>`<span class="${S&&S.done[j+2]?"on":""}">${S&&S.done[j+2]?c:"?"}</span>`).join("")}</div>`;
  const topBar=()=>{const m=my(),tm=m?m[1]:-1;return `<div class="ph-top"><span><span id="pdot" class="dot ${conn.up?"on":""}"></span>${tm>=0?temb(tm,16)+" ":""}${h(me.n)}${m?` · <b>${m[0]}</b> ${h(U.pts[0])}`:""}</span>
     <select id="selLang" aria-label="Sprache">${LANGS.map(([c,n])=>`<option value="${c}" ${c===lang?"selected":""}>${n}</option>`).join("")}</select></div>`;};
  const storyCard=ph=>`<div class="pstory">${icon(STN[ph].ic,34,"var(--brand)")}<div><div class="lbl">${STN[ph].fl} · ${h(STN[ph].n)}</div>${u("s"+ph)}</div></div>`;
  const lab=(k,c)=>`<div class="lbl" style="color:${c}">${u(k)}</div>`;
  const C3=["#7a7365","#1f5fae","#1f7a3f"];

  function stationScore(st){const a=me.as[st];let n=0;for(const [i,x] of Object.entries(a)){if(st===2&&x==="012")n++;if(st===3)n+=(x[0]==="0")+(x[1]==="0");if(st===6&&+x===SORT[i].k)n++;}return n;}
  function selfPaced(ph){
    const st=ph,nxt=me.o[st].find(i=>!(i in me.as[st])),n=Object.keys(me.as[st]).length;let s=storyCard(ph)+geh(ph);
    if(fb&&fb.st===st){
      if(st===2){const it=STAIR[fb.i],ok=fb.a==="012";
        s+=`<div class="fb ${ok?"ok":"bad"}"><b>${u(ok?"right":"wrong")}</b>${ok?"":`<div style="margin-top:4px">${u("order")}</div>`}
          ${it.c.map((c,j)=>`<div class="pstep" style="--c:${C3[j]}">${lab(["mk","vt","nz"][j],C3[j])}${L(c)}</div>`).join("")}</div>`;}
      else if(st===3){const it=CHAIN[fb.i],isV=fb.step==="v",opts=isV?it.v:it.n,tags=isV?it.vt:it.nt,ok=fb.c===0;
        s+=`<div class="pcard"><div class="lbl">${h(it.w[0])}</div>${lab("mk",C3[0])}${L(it.m)}${isV?"":lab("vt",C3[1])+L(it.v[0])}</div>
          <div class="fb ${ok?"ok":"bad"}"><b>${u(ok?"right":"wrong")}</b>${ok?"":`<div style="margin-top:4px">${L(opts[fb.c])}</div><div style="margin-top:4px"><b>${u(tags[fb.c])}</b></div><div style="margin-top:8px">${u("rightIs")}</div>`}
          <div class="pstep" style="--c:${C3[isV?1:2]}">${lab(isV?"vt":"nz",C3[isV?1:2])}${L(opts[0])}</div></div>`;}
      else{const it=SORT[fb.i],ok=fb.c===it.k;
        s+=`<div class="pcard"><div class="pq">${L(it.s)}</div></div><div class="fb ${ok?"ok":"bad"}"><b>${u(ok?"right":"wrong")}</b><div class="pstep" style="--c:${it.k?"#a16207":"#1f5fae"}"><b>${L(KN[it.k])}</b><div class="muted">${L(KNX[it.k])}</div></div></div>`;}
      return s+`<button class="pri big1" id="bFbNext">${u("next")}</button>`;}
    if(!S.op[st]&&n===0)return s+`<div class="pcard"><h2>${u("soon")}</h2>${u("look")}</div>`;
    if(nxt===undefined||!S.op[st]){const tot=st===3?2*NI[3]:NI[st];
      return s+`<div class="pcard" style="text-align:center"><h2>${u(nxt===undefined?"done":"look")}</h2><div class="bigpts">${stationScore(st)} / ${tot}</div><div class="muted">${u("corr")}</div></div>`+
        (nxt===undefined?`<div class="pcard pprof"><div class="lbl">${u("pro")}</div>${L(PROFI[st])}</div>`:"");}
    s+=`<div class="muted">${h(U.card[0])} ${n+1} / ${NI[st]}</div>`;
    if(st===2){const it=STAIR[nxt],pm=perm("2-"+nxt,3);
      s+=`<div class="pcard"><div class="pq">${L(it.w)}</div><div style="margin-top:6px">${u("stair")}</div></div>
        ${pm.map(c=>{const k=pick.indexOf(c);return `<button class="pc ${k>=0?"sel":""}" data-pc="${c}">${k>=0?`<span class="num" style="background:${C3[k]}">${k+1}</span>`:`<span class="num e"></span>`}<span>${L(it.c[c])}</span></button>`;}).join("")}
        ${pick.length?`<button id="bUndo" style="width:100%">${u("undo")}</button>`:""}`;}
    else if(st===3){const it=CHAIN[nxt],c3=me.c3&&me.c3.i===nxt?me.c3:null,isV=!c3;
      const pm=perm((isV?"3v-":"3n-")+nxt,3),opts=isV?it.v:it.n;
      s+=`<div class="pcard"><div class="lbl">${L(it.w)}</div><div class="pstep" style="--c:${C3[0]}">${lab("mk",C3[0])}<b>${L(it.m)}</b></div>${isV?"":`<div class="pstep" style="--c:${C3[1]}">${lab("vt",C3[1])}<b>${L(it.v[0])}</b></div>`}</div>
        <div class="naund">${u(isV?"naundv":"naundn")}</div>
        ${pm.map((c,j)=>`<button class="popt o${j+1}" data-ch="${c}">${L(opts[c])}</button>`).join("")}`;}
    else{const it=SORT[nxt];
      s+=`<div class="pcard"><div class="pq">${L(it.s)}</div></div><p><b>${u("sortq")}</b></p>
        <div class="yn"><button class="g" data-so="0">${icon("watch",30,"#1f5fae")}<b>${L(KN[0])}</b><span class="muted">${L(KNX[0])}</span></button>
        <button class="z" data-so="1">${icon("star",30,"#a16207")}<b>${L(KN[1])}</b><span class="muted">${L(KNX[1])}</span></button></div>`;}
    return s;}

  function quiz(ph){
    const q=S.q&&S.q.st===ph?S.q:null;let s="";
    if(!q)return storyCard(ph)+geh(ph)+`<div class="pcard"><h2>${u("look")}</h2></div>`;
    const it=QSET[ph][q.i],sel=me.qa[q.id];
    s+=`<div class="pcard"><div class="lbl">${ph===4?u("qwhat"):""}</div><div class="pq">${L(ph===4?it.s:it.q)}</div></div>`;
    const optHTML=(c,j)=>`<button class="popt ${ph===4?"k"+c:"o"+j}" data-q="${c}">${L(ph===4?CAT[c].t:it.o[c])}</button>`;
    if(q.o){
      if(sel!==undefined)s+=`<div class="fb ok"><b>${u("asent")}</b><div style="margin-top:6px">${L(ph===4?CAT[sel].t:it.o[sel])}</div></div>`;
      else s+=(ph===4?[0,1,2,3,4]:q.ord.slice(0,4)).map(optHTML).join("");}
    else{const sol=q.sol,ok=sel===sol;
      s+=`<div class="fb ${sel===undefined?"":ok?"ok":"bad"}">${sel===undefined?"":`<b>${u(ok?"right":"wrong")}</b>`}<div class="lbl">${u("sol")}</div><b>${L(ph===4?CAT[sol].t:it.o[sol])}</b>
        ${ph===4?`<div class="lbl" style="margin-top:8px">${u("better")}</div>${L(it.b)}`:""}</div><p>${u("look")}</p>`;}
    return s;}

  function finale(){
    const m=my(),tm=m[1],p=PROD[tm]||PROD[0];let s=storyCard(7)+geh(7);
    const pc=`<div class="pcard" style="border-left:8px solid ${TEAMS[tm]?TEAMS[tm].c:"var(--brand)"}"><div class="lbl">${u("prod")}</div><div class="row" style="flex-wrap:nowrap">${icon(p.ic,46,TEAMS[tm]?TEAMS[tm].c:"")}<div><div class="pq">${L(p.w)}</div>${lab("mk","var(--muted)")}<b>${L(p.m)}</b></div></div>
      <details style="margin-top:8px"><summary>${u("vtip")}</summary>${L(p.v)}</details></div>`;
    const mine=me.subs.length?`<p><b>${u("mine")}</b></p>${me.subs.map(x=>`<div class="pov">${h(quo(x.x))}</div>`).join("")}`:"";
    if(S.fin.vo){const v=me.fv;
      if(v!==null&&v!==undefined)return s+`<div class="fb ok"><b>${u("voted")}</b><div>${temb(v,18)} Team ${TEAMS[v].n}</div></div>`;
      return s+`<p><b>${u("vote")}</b></p>`+Array.from({length:S.nt},(_,i)=>i).filter(i=>i!==tm).map(i=>`<button class="tvote" style="--tc:${TEAMS[i].c}" data-fv="${i}">${temb(i,26)}<span><b>Team ${TEAMS[i].n}</b><br>${h(PROD[i].w[0])}</span></button>`).join("");}
    if(S.op[7]&&me.subs.length<2&&form){
      return s+pc+`<p>${u("ptask")}</p><div class="pcard"><div class="lbl">${u("kit")}</div><div class="chips">${KIT.map((k,j)=>`<button class="chip2" data-kit="${j}">${h(k)}</button>`).join("")}</div></div>
        <textarea id="txt" rows="4" maxlength="180" placeholder="„… – so …“"></textarea>
        ${warn?`<div class="fb bad">${u(warn)}</div>`:""}
        <button class="pri big1" id="bSend">${u(warn&&warn!=="short"?"send2":"send")}</button>${mine}`;}
    if(S.op[7])return s+pc+`<div class="fb ok"><b>${u("sent")}</b></div>${mine}${me.subs.length<2?`<button class="pri big1" id="bMore">${u("more")}</button>`:""}<div class="pcard pprof"><div class="lbl">${u("pro")}</div>${L(PROFI[7])}</div>`;
    return s+pc+mine+`<div class="pcard"><h2>${u("look")}</h2></div>`;}

  function render(force){
    const k=keyOf();if(!force&&k===lastKey)return;lastKey=k;
    let s="";const m=my();
    if(!me.n){
      s=`<div class="hero">${CRANE(84)}<div><h1 style="margin:0">Kaufhaus Kranich</h1><div style="color:var(--brand);font-weight:700">Mission „Na und?“</div></div></div>
        <div class="pcard"><div class="lbl"><b>${u("langq")}</b></div>
        <div class="lang4">${LANGS.map(([c,n])=>`<button data-lang="${c}" class="${c===lang?"on":""}">${n}</button>`).join("")}</div>
        <label for="nick"><b>${u("nick")}</b></label><input id="nick" maxlength="16" autocomplete="off" style="margin:6px 0 12px">
        <button class="pri" id="bGo" style="width:100%">${u("go")}</button></div>`;
    }else if(S&&S.ph===-1){s=topBar()+`<div class="pcard">${u("ended")}</div>`;
    }else if(!m){s=topBar()+`<div class="pcard">${u("conn")}</div>`;
    }else{
      s=topBar()+codeStrip();
      if(S.ph===0)s+=`<div class="pteam" style="background:${TEAMS[m[1]].c}">${icon(TEAMS[m[1]].ic,64,"#fff")}<div><div>${u("team")}</div><b>${TEAMS[m[1]].n}</b></div></div><div class="pcard">${u("wait")}</div>`;
      else if(S.ph===1){const d=S.duel,v=me.dv[d.id];
        s+=`<div class="pcard"><div class="row">${CRANE(64)}<div>${u("prolog")}</div></div></div>`;
        if(d.o){s+=`<p><b>${u("duel")}</b></p>`;s+=v!==undefined?`<div class="fb ok"><b>${u("voted")}</b> ${u(v?"dB":"dA")}</div>`:`<div class="yn"><button class="g" data-dv="0"><b>${u("dA")}</b></button><button class="z" data-dv="1"><b>${u("dB")}</b></button></div>`;}
        else s+=`<div class="pcard">${u("look")}</div>`;}
      else if(S.ph in NI)s+=selfPaced(S.ph);
      else if(S.ph===4||S.ph===5)s+=quiz(S.ph);
      else if(S.ph===7)s+=finale();
      else{const pos=S.rk?S.rk.indexOf(me.pid)+1:0,tp=S.tr?S.tr.indexOf(m[1])+1:0;
        s+=`<div class="pcard" style="text-align:center"><h2>${u("res")}</h2><div class="bigpts">${m[0]} ${h(U.pts[0])}</div>${pos?`<div class="pq">${h(U.place[0])} ${pos}</div>`:""}
          ${tp?`<div style="margin-top:8px">${temb(m[1],22)} ${h(U.tplace[0])} ${tp}</div>`:""}</div>
          <div class="pcard" style="text-align:center"><div class="lbl">${u("code")}</div>${codeStrip()}<div class="pq" style="margin-top:10px">${u("merk")}</div></div>
          ${GEH.map((g,j)=>S.done[j+2]?`<div class="pov"><b>${CODE[j]}</b> ${L(g)}</div>`:"").join("")}`;}
    }
    P.innerHTML=s;
    const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
    P.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{const keep=$("nick")?$("nick").value:"";lang=me.lang=b.dataset.lang;saveMe();render(true);if($("nick"))$("nick").value=keep;});
    const sl=$("selLang");if(sl)sl.onchange=()=>{const tx=$("txt");if(tx)draft=tx.value;lang=me.lang=sl.value;saveMe();render(true);};
    const join=()=>{const n=clean($("nick").value,16);if(!n){$("nick").focus();return;}me.n=n;saveMe();send({k:"hi",n});render(true);};
    on("bGo",join);if($("nick"))$("nick").onkeydown=e=>{if(e.key==="Enter")join();};
    const answer=(st,i,a)=>{me.as[st][i]=a;saveMe();send({k:"a",st,as:me.as[st]});};
    on("bFbNext",()=>{fb=null;render(true);window.scrollTo(0,0);});
    P.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const c=+b.dataset.pc;if(pick.includes(c))return;pick.push(c);
      if(pick.length===3){const i=me.o[2].find(x=>!(x in me.as[2]));if(i===undefined)return;const a=pick.join("");pick=[];answer(2,i,a);fb={st:2,i,a};window.scrollTo(0,0);}render(true);});
    on("bUndo",()=>{pick.pop();render(true);});
    P.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{const c=+b.dataset.ch,i=me.o[3].find(x=>!(x in me.as[3]));if(i===undefined)return;
      if(!me.c3||me.c3.i!==i){me.c3={i,v:c};saveMe();fb={st:3,i,step:"v",c};}
      else{const a=""+me.c3.v+c;me.c3=null;answer(3,i,a);fb={st:3,i,step:"n",c};}
      render(true);window.scrollTo(0,0);});
    P.querySelectorAll("[data-so]").forEach(b=>b.onclick=()=>{const c=+b.dataset.so,i=me.o[6].find(x=>!(x in me.as[6]));if(i===undefined)return;
      answer(6,i,String(c));fb={st:6,i,c};render(true);window.scrollTo(0,0);});
    P.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const q=S.q;if(!q||!q.o||me.qa[q.id]!==undefined)return;const c=+b.dataset.q,id=q.id;me.qa[id]=c;saveMe();
      pending={msg:{k:"q",id,c},done:()=>!S||!S.q||S.q.id!==id||!S.q.o||(S.q.an||[]).includes(me.pid)};send(pending.msg);render(true);});
    P.querySelectorAll("[data-dv]").forEach(b=>b.onclick=()=>{const d=S.duel;if(!d||!d.o||me.dv[d.id]!==undefined)return;const c=+b.dataset.dv,id=d.id;me.dv[id]=c;saveMe();
      pending={msg:{k:"d",id,c},done:()=>!S||!S.duel||S.duel.id!==id||!S.duel.o||(S.duel.an||[]).includes(me.pid)};send(pending.msg);render(true);});
    P.querySelectorAll("[data-fv]").forEach(b=>b.onclick=()=>{if(!S.fin.vo||(me.fv!==null&&me.fv!==undefined))return;const c=+b.dataset.fv;me.fv=c;saveMe();
      pending={msg:{k:"fv",c},done:()=>!S||!S.fin.vo||(S.fin.an||[]).includes(me.pid)};send(pending.msg);render(true);});
    const tx=$("txt");if(tx){tx.value=draft;tx.oninput=()=>{draft=tx.value;};}
    P.querySelectorAll("[data-kit]").forEach(b=>b.onclick=()=>{const t=KIT[+b.dataset.kit].replace(" …"," ");draft=(draft&&!/\s$/.test(draft)?draft+" ":draft)+t;if(tx){tx.value=draft;tx.focus();}});
    on("bMore",()=>{form=true;warn="";draft="";render(true);});
    on("bSend",()=>{const x=clean(tx.value,180).replace(/^[„“"”»«]+|[„“"”»«]+$/g,"").trim();draft=tx.value;
      if(x.length<12){warn="short";render(true);return;}
      let w=null;if(/\bman\b/i.test(x))w="wman";else if(/\b(leider|teuer|problem\w*|schwierig)\b/i.test(x))w="wneg";else if(!/\b(Sie|Ihnen|Ihr|Ihre|Ihren|Ihrem|Ihrer)\b/.test(x))w="wsie";
      if(w&&warnFor!==x){warn=w;warnFor=x;render(true);return;}
      me.subs.push({id:rnd(6),x});saveMe();warn="";warnFor="";draft="";form=false;send({k:"w",subs:me.subs});render(true);window.scrollTo(0,0);});
  }
  render(true);
}
if(roomCode)phoneApp();else tafelApp();
</script>
