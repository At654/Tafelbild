<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LF 4 · Modul 3 · Abenteuer: Das goldene Schaufenster</title>
<style>
:root{--navy:#1f3b5c;--blue:#2f6db5;--sand:#fbf3e4;--orange:#e8833a;--green:#2e9e6b;--red:#d2493f;--ink:#23262b;--mut:#6b6f76;--card:#fff;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",Nyala,"Abyssinica SIL",Tahoma,sans-serif;font-size:17px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:.55rem .9rem;display:flex;align-items:center;gap:.7rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header .ttl{font-weight:700;font-size:.95rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .pts{background:var(--orange);border-radius:99px;padding:.15rem .7rem;font-weight:700;font-size:.9rem}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:.35rem .6rem;font-size:1rem;cursor:pointer}
.prog{display:flex;gap:4px;padding:.5rem .9rem 0;max-width:820px;margin:auto}
.prog i{flex:1;height:7px;border-radius:9px;background:#e2d6c2}
.prog i.on{background:var(--orange)} .prog i.done{background:var(--green)}
main{max-width:820px;margin:0 auto;padding:.8rem .9rem 6rem}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(60,40,10,.09);overflow:hidden;margin-bottom:1rem;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card img.hero{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.card .body{padding:1rem 1.1rem 1.2rem}
.chap{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);font-weight:800}
h1{font-size:1.6rem;margin:.1rem 0 .6rem;color:var(--navy)} h2{font-size:1.3rem;margin:.1rem 0 .6rem;color:var(--navy)}
p{margin:.45rem 0}
.de{display:block}
.tl{display:block;color:#5a6470;font-size:.88em;border-left:3px solid #c9d7ea;padding-left:.5rem;margin-top:.15rem}
.tl[dir=rtl]{border-left:0;border-right:3px solid #c9d7ea;padding-left:0;padding-right:.5rem;text-align:right;font-size:.95em}
.btn .tl,.opt .tl,.chip .tl{border:0;padding:0;margin-top:.1rem;color:inherit;opacity:.78;font-size:.82em}
.say{display:flex;gap:.6rem;align-items:flex-start;margin:.7rem 0}
.say .av{font-size:1.9rem;line-height:1}
.say .bub{background:#eef4fb;border-radius:4px 16px 16px 16px;padding:.55rem .8rem;flex:1}
.say .who{font-weight:700;font-size:.8rem;color:var(--blue)}
.q{font-weight:700;margin:.9rem 0 .5rem;font-size:1.05rem}
.opts{display:grid;gap:.5rem}
.opt{background:#fff;border:2px solid #d9dfe7;border-radius:14px;padding:.65rem .8rem;text-align:left;font:inherit;cursor:pointer;color:inherit;transition:.15s}
.opt:hover{border-color:var(--blue);background:#f6f9fd}
.opt.ok{border-color:var(--green);background:#e8f6ef}
.opt.no{border-color:var(--red);background:#fdeceb;animation:shake .35s}
.opt.sel{border-color:var(--blue);background:#e9f1fb}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:.7rem;padding:.6rem .8rem;border-radius:12px;font-size:.95rem}
.fb.good{background:#e8f6ef;border:1px solid #a9dcc3} .fb.bad{background:#fdf1e6;border:1px solid #f2c79f}
.merke{background:#fff7e0;border:2px dashed #e9c46a;border-radius:14px;padding:.6rem .8rem;margin:.8rem 0}
.merke b{color:#a26b00}
.lk{background:linear-gradient(135deg,#e7f3ff,#f1ecff);border-radius:14px;padding:.7rem .9rem;margin:.9rem 0;border:1px solid #cfdff5}
.lk .h{font-weight:800;color:#3a4fa0;margin-bottom:.2rem}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,243,228,.96);padding:.6rem .9rem;display:flex;justify-content:center;border-top:1px solid #eadfcb}
.btn{background:var(--orange);color:#fff;border:0;border-radius:14px;padding:.75rem 1.6rem;font:inherit;font-weight:700;cursor:pointer;min-width:220px;box-shadow:0 3px 0 #b86123}
.btn[disabled]{background:#cfc5b5;box-shadow:none;cursor:default}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:none}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.8rem 0}
.lang{border:2px solid #d9dfe7;background:#fff;border-radius:14px;padding:.8rem;font:inherit;cursor:pointer;font-weight:700}
.lang.sel{border-color:var(--orange);background:#fff3e8}
input.name{width:100%;font:inherit;padding:.6rem .8rem;border-radius:12px;border:2px solid #d9dfe7;margin-top:.3rem}
/* Pyramide */
.pyr{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;margin:.8rem 0}
.lvl{border-radius:8px;padding:.35rem .5rem;text-align:center;font-size:.85rem;background:#eef1f5;color:#8a93a0;border:2px dashed #ccd3dc;min-height:2.6rem;display:flex;flex-direction:column;justify-content:center;transition:.25s}
.lvl.cur{border-color:var(--orange);background:#fff3e8;color:var(--ink)}
.lvl.fill{border-style:solid;color:#fff;border-color:transparent}
.lvl small{display:block;font-weight:700;font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.chip{background:#fff;border:2px solid #c9d3df;border-radius:12px;padding:.45rem .7rem;font:inherit;font-size:.92rem;cursor:pointer}
.chip.no{border-color:var(--red);animation:shake .35s}
/* Kreuz */
.cross{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:6px;margin:.7rem 0;position:relative}
.cross div{border-radius:12px;padding:.5rem;min-height:5.2rem;font-size:.8rem}
.cross .lab{font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;opacity:.75}
.c1{background:#e3f0ff}.c2{background:#e6f7ec}.c3{background:#fff2df}.c4{background:#f4e8fb}
.tag{display:inline-block;background:#fff;border-radius:8px;padding:.1rem .4rem;margin:.15rem .15rem 0 0;box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:.85rem;animation:pop .4s}
.shop{background:#f8f5ef;border-radius:14px;padding:.7rem .8rem;margin:.6rem 0;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cats{display:grid;grid-template-columns:1fr;gap:.4rem}
.badge{font-size:4rem;text-align:center;margin:.3rem 0}
.score{text-align:center;font-size:1.3rem;font-weight:800;color:var(--navy)}
.stars{text-align:center;font-size:2rem;letter-spacing:.2rem}
.small{font-size:.85rem;color:var(--mut)}
.conf{position:fixed;top:-20px;font-size:1.5rem;pointer-events:none;animation:fall 2.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.7}}
.profi{border:2px solid #b38cff;background:#f7f2ff;border-radius:14px;padding:.7rem .8rem;margin-top:1rem}
.cert{border:4px double var(--navy);border-radius:16px;padding:1rem;text-align:center;background:#fffdf7}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.6rem 1rem;border-radius:12px;z-index:20;text-align:center;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw}
@media (max-width:520px){h1{font-size:1.35rem}.langs,.row2{grid-template-columns:1fr}.btn{min-width:0;width:100%}}
@media print{.nav,header{display:none}}
</style>
</head>

 good:["Richtig! In nur 3–4 Sekunden muss das Fenster wirken.","Đúng! Tủ kính phải gây ấn tượng chỉ trong 3–4 giây.","Doğru! Vitrin sadece 3–4 saniyede etki etmeli.","صحيح! يجب أن تؤثّر الواجهة في 3–4 ثوانٍ فقط.","¡Correcto! El escaparate tiene que funcionar en solo 3–4 segundos.","Certo! A vitrine precisa funcionar em só 3–4 segundos.","Верно! Витрина должна сработать всего за 3–4 секунды.","ቅኑዕ! መርኣዪ መስኮት ኣብ 3–4 ካልኢት ጥራይ ክሰርሕ ኣለዎ።"],
 merke:["Ein Schaufenster hat nur 3–4 Sekunden. Es braucht einen Blickfang, eine Botschaft und Preise.","Tủ kính chỉ có 3–4 giây. Nó cần một điểm thu hút (Blickfang), một thông điệp và giá cả.","Bir vitrinin sadece 3–4 saniyesi var. Bir dikkat çekici unsura (Blickfang), bir mesaja ve fiyatlara ihtiyacı var.","للواجهة 3–4 ثوانٍ فقط. تحتاج إلى عنصر جاذب للنظر (Blickfang) ورسالة وأسعار.","Un escaparate solo tiene 3–4 segundos. Necesita un punto de atracción (Blickfang), un mensaje y precios.","Uma vitrine tem só 3–4 segundos. Ela precisa de um ponto de atração (Blickfang), uma mensagem e preços.","У витрины всего 3–4 секунды. Ей нужны приманка для глаз (Blickfang), идея и цены.","መርኣዪ መስኮት 3–4 ካልኢት ጥራይ ኣለዎ። ዓይኒ ዝስሕብ ነገር (Blickfang)፡ መልእኽትን ዋጋታትን የድልዮ።"]},
{t:"multi",ch:1,say:B,
 q:["„Was soll unser Schaufenster schaffen? Wähle die 2 richtigen Aufgaben.“","„Tủ kính của chúng ta phải làm được gì? Hãy chọn 2 nhiệm vụ đúng.“","„Vitrinimiz neyi başarmalı? Doğru 2 görevi seç.“","«ماذا يجب أن تحقّق واجهتنا؟ اختر المهمّتين الصحيحتين.»","«¿Qué debe lograr nuestro escaparate? Elige las 2 tareas correctas.»","“O que a nossa vitrine deve conseguir? Escolha as 2 tarefas certas.”","«Чего должна добиться наша витрина? Выбери 2 правильные задачи.»","«መርኣዪ መስኮትና እንታይ ክገብር ኣለዎ? 2 ቅኑዓት ዕማማት ምረጽ።»"],
 o:[{a:["Passanten zum Stehenbleiben bringen (Aufmerksamkeit wecken)","Khiến người đi đường dừng lại (thu hút sự chú ý)","Yoldan geçenleri durdurmak (dikkat çekmek)","جعل المارّة يتوقّفون (لفت الانتباه)","Hacer que los transeúntes se detengan (llamar la atención)","Fazer as pessoas pararem (chamar a atenção)","Заставить прохожих остановиться (привлечь внимание)","ሓለፍቲ መገዲ ደው ከም ዝብሉ ምግባር (ኣቓልቦ ምስሓብ)"],ok:1},
    {a:["Waren lagern, damit im Lager Platz frei wird","Cất hàng để kho có thêm chỗ trống","Depoda yer açılsın diye mal saklamak","تخزين البضائع لتوفير مكان في المستودع","Almacenar mercancía para liberar el almacén","Guardar mercadorias para liberar espaço no estoque","Хранить товар, чтобы освободить склад","ኣብ መኽዘን ቦታ ንኽኸውን ኣቑሑ ምዕቋር"]},
    {a:["Kunden ins Geschäft locken","Lôi kéo khách hàng vào cửa hàng","Müşterileri mağazaya çekmek","جذب الزبائن إلى داخل المحل","Atraer a los clientes a la tienda","Atrair clientes para dentro da loja","Заманить покупателей в магазин","ዓማዊል ናብ ውሽጢ ድኳን ምስሓብ"],ok:1},
    {a:["Die Kasse entlasten","Giảm tải cho quầy thu ngân","Kasanın yükünü azaltmak","تخفيف الضغط عن الصندوق","Descargar la caja","Aliviar o caixa","Разгрузить кассу","ንካሳ ምፍኳስ"]}],
 good:["Stark! Ein Schaufenster weckt Aufmerksamkeit, informiert, weckt Gefühle, lockt ins Geschäft und zeigt das Image.","Giỏi lắm! Tủ kính thu hút sự chú ý, cung cấp thông tin, khơi gợi cảm xúc, lôi kéo vào cửa hàng và thể hiện hình ảnh của cửa hàng.","Harika! Vitrin dikkat çeker, bilgi verir, duygu uyandırır, mağazaya çeker ve imajı gösterir.","رائع! الواجهة تلفت الانتباه، وتُعلِم، وتُثير المشاعر، وتجذب إلى المحل، وتُظهر صورة المتجر.","¡Genial! Un escaparate llama la atención, informa, despierta emociones, atrae a la tienda y muestra la imagen.","Ótimo! A vitrine chama a atenção, informa, desperta emoções, atrai para a loja e mostra a imagem da empresa.","Отлично! Витрина привлекает внимание, информирует, вызывает эмоции, заманивает в магазин и показывает имидж.","ብሉጽ! መርኣዪ መስኮት ኣቓልቦ ይስሕብ፡ ሓበሬታ ይህብ፡ ስምዒት የበራብር፡ ናብ ድኳን ይስሕብ፡ ምስሊ ድኳን ድማ የርኢ።"]},

{t:"story",ch:2,
 p:[["Dienstag. Frau Kiel vom Schuhhaus Kiel ruft an. Sie ist verzweifelt.","Thứ Ba. Bà Kiel từ cửa hàng giày Kiel gọi điện. Bà rất tuyệt vọng.","Salı. Kiel Ayakkabı Mağazası'ndan Bayan Kiel arıyor. Çok çaresiz.","يوم الثلاثاء. تتّصل السيدة كيل من متجر أحذية كيل. إنها يائسة.","Martes. La señora Kiel, de la zapatería Kiel, llama. Está desesperada.","Terça-feira. A senhora Kiel, da loja de sapatos Kiel, liga. Ela está desesperada.","Вторник. Звонит госпожа Киль из обувного магазина «Киль». Она в отчаянии.","ሰሉስ። ወይዘሮ ኪል ካብ ድኳን ጫማ ኪል ትድውል። ተስፋ ቆሪጻ እያ።"]],
 say:[K,["„Kaum jemand bleibt vor meinem Fenster stehen! Kannst du mir helfen, Detektiv{NAME}?“","„Hầu như không ai dừng lại trước tủ kính của tôi! Thám tử{NAME}, bạn giúp tôi được không?“","„Vitrinimin önünde neredeyse kimse durmuyor! Bana yardım edebilir misin, dedektif{NAME}?“","«لا يكاد أحد يتوقّف أمام واجهتي! هل تساعدني أيها المحقّق{NAME}؟»","«¡Casi nadie se para delante de mi escaparate! ¿Me ayudas, detective{NAME}?»","“Quase ninguém para na frente da minha vitrine! Você pode me ajudar, detetive{NAME}?”","«Почти никто не останавливается у моей витрины! Поможешь мне, детектив{NAME}?»","«ኣብ ቅድሚ መርኣዪ መስኮተይ ዳርጋ ዝኾነ ሰብ ኣይቆምን! ክትሕግዘኒ ትኽእል ዶ፡ መርማሪ{NAME}?»"]],
 lk:["In Deutschland müssen Preise immer Endpreise sein: Die Mehrwertsteuer ist schon drin. Das gilt auch für Waren im Schaufenster.",
     "Ở Đức, giá luôn phải là giá cuối cùng: thuế giá trị gia tăng đã được tính vào. Điều này cũng áp dụng cho hàng trong tủ kính.",
     "Almanya'da fiyatlar her zaman son fiyat olmalıdır: KDV zaten dahildir. Bu, vitrindeki mallar için de geçerlidir.",
     "في ألمانيا يجب أن تكون الأسعار دائماً أسعاراً نهائية: ضريبة القيمة المضافة مشمولة. هذا ينطبق أيضاً على البضائع في الواجهة.",
     "En Alemania los precios siempre deben ser precios finales: el IVA ya está incluido. Esto también vale para la mercancía del escaparate.",
     "Na Alemanha os preços sempre têm que ser preços finais: o imposto (IVA) já está incluído. Isso vale também para produtos na vitrine.",
     "В Германии цены всегда должны быть конечными: НДС уже включён. Это касается и товаров в витрине.",
     "ኣብ ጀርመን ዋጋታት ኩሉ ግዜ መወዳእታ ዋጋ ክኾኑ ኣለዎም፡ ግብሪ (Mehrwertsteuer) ኣብ ውሽጡ ኣሎ። እዚ ንኣቑሑ ኣብ መርኣዪ መስኮት'ውን ይምልከት።"]},
{t:"sort",ch:2,
 q:["Was ist falsch? Ordne jede Beobachtung dem verletzten Grundsatz zu.","Điều gì sai? Hãy ghép mỗi quan sát với nguyên tắc bị vi phạm.","Ne yanlış? Her gözlemi ihlal edilen ilkeyle eşleştir.","ما الخطأ؟ اربط كل ملاحظة بالمبدأ الذي تمّ انتهاكه.","¿Qué está mal? Relaciona cada observación con el principio que no se cumple.","O que está errado? Ligue cada observação ao princípio que não foi respeitado.","Что не так? Соотнеси каждое наблюдение с нарушенным правилом.","እንታይ ጌጋ ኣሎ? ነፍሲ ወከፍ ዕዝብቲ ምስቲ ዝተጣሕሰ መትከል ኣዛምዶ።"],

       ["Licht – auch tagsüber beleuchten","Ánh sáng – chiếu sáng cả ban ngày","Işık – gündüz de aydınlatmak","الضوء – الإنارة في النهار أيضاً","Luz – iluminar también de día","Luz – iluminar também de dia","Свет — освещать и днём","ብርሃን – ብመዓልቲ'ውን ምብራህ"],

 it:[{a:["👞 Das Fenster ist bis in die letzte Ecke mit Schuhen vollgestellt.","👞 Tủ kính chất đầy giày đến tận góc cuối cùng.","👞 Vitrin son köşesine kadar ayakkabıyla dolu.","👞 الواجهة مليئة بالأحذية حتى آخر زاوية.","👞 El escaparate está lleno de zapatos hasta el último rincón.","👞 A vitrine está lotada de sapatos até o último canto.","👞 Витрина до последнего угла заставлена обувью.","👞 መርኣዪ መስኮት ክሳብ መወዳእታ ኩርናዕ ብጫማ መሊኡ።"],c:0},
     {a:["🎯 Der Blickfang steht genau in der Mitte.","🎯 Điểm thu hút nằm đúng chính giữa.","🎯 Dikkat çekici unsur tam ortada duruyor.","🎯 العنصر الجاذب في المنتصف تماماً.","🎯 El punto de atracción está justo en el centro.","🎯 O ponto de atração está bem no meio.","🎯 Приманка для глаз стоит точно в центре.","🎯 ዓይኒ ዝስሕብ ብልክዕ ኣብ ማእከል ኣሎ።"],c:1},
     {a:["💡 Tagsüber ist das Licht im Fenster aus.","💡 Ban ngày đèn trong tủ kính bị tắt.","💡 Gündüz vitrindeki ışık kapalı.","💡 الضوء في الواجهة مطفأ أثناء النهار.","💡 De día la luz del escaparate está apagada.","💡 De dia a luz da vitrine fica apagada.","💡 Днём свет в витрине выключен.","💡 ብመዓልቲ ብርሃን ኣብ መርኣዪ መስኮት ጠፊኡ።"],c:2},
     {a:["🐰 Die Osterdeko steht Ende Mai noch im Fenster.","🐰 Cuối tháng Năm đồ trang trí Phục Sinh vẫn còn trong tủ kính.","🐰 Mayıs sonunda Paskalya süsleri hâlâ vitrinde.","🐰 زينة عيد الفصح ما زالت في الواجهة في نهاية مايو.","🐰 A finales de mayo la decoración de Pascua sigue en el escaparate.","🐰 No fim de maio a decoração de Páscoa ainda está na vitrine.","🐰 В конце мая в витрине всё ещё пасхальный декор.","🐰 ኣብ መወዳእታ ግንቦት መስለሚ ፋሲካ ገና ኣብ መርኣዪ መስኮት ኣሎ።"],c:3},
     {a:["🪰 Tote Fliegen liegen am Boden, ein Preisschild ist umgekippt.","🪰 Ruồi chết nằm trên sàn, một bảng giá bị đổ.","🪰 Yerde ölü sinekler var, bir fiyat etiketi devrilmiş.","🪰 ذباب ميت على الأرض، ولوحة سعر مقلوبة.","🪰 Hay moscas muertas en el suelo y una etiqueta de precio está caída.","🪰 Há moscas mortas no chão e uma etiqueta de preço caiu.","🪰 На полу дохлые мухи, ценник упал.","🪰 ምዉታት ጽንጽያ ኣብ ባይታ ኣለዉ፡ ሓደ ናይ ዋጋ ምልክት ወዲቑ።"],c:4},
     {a:["🏷️ Nirgends steht ein Preis.","🏷️ Không có giá ở đâu cả.","🏷️ Hiçbir yerde fiyat yok.","🏷️ لا يوجد سعر في أي مكان.","🏷️ No hay ningún precio.","🏷️ Não há preço em lugar nenhum.","🏷️ Нигде нет цены.","🏷️ ኣብ ዝኾነ ቦታ ዋጋ የለን።"],c:5}],
 merke:["Wird ein Grundsatz verletzt, gehen die Passanten vorbei. Die 10 Gestaltungsgrundsätze sind deine Checkliste.","Khi một nguyên tắc bị vi phạm, người đi đường sẽ đi ngang qua. 10 nguyên tắc trình bày là danh sách kiểm tra của bạn.","Bir ilke ihlal edilirse, yoldan geçenler devam eder. 10 tasarım ilkesi senin kontrol listendir.","إذا انتُهك مبدأ ما، يمرّ المارّة دون توقّف. المبادئ العشرة للتصميم هي قائمة التحقّق الخاصة بك.","Si no se cumple un principio, los transeúntes pasan de largo. Los 10 principios de diseño son tu lista de control.","Se um princípio não é respeitado, as pessoas passam direto. Os 10 princípios de decoração são a sua lista de verificação.","Если правило нарушено, прохожие идут мимо. 10 правил оформления — твой чек-лист.","ሓደ መትከል እንተተጣሕሰ ሓለፍቲ መገዲ ይሓልፉ። እቶም 10 መትከላት ኣሰራርዓ ናትካ ዝርዝር ምርግጋጽ እዮም።"]},

{t:"story",ch:3,
 p:[["Mittwoch. Frau Petersen macht mit dir eine Fenster-Safari durch die Innenstadt.","Thứ Tư. Cô Petersen dẫn bạn đi „săn“ tủ kính khắp trung tâm thành phố.","Çarşamba. Bayan Petersen seninle şehir merkezinde bir vitrin safarisi yapıyor.","يوم الأربعاء. تأخذك السيدة بيترسن في جولة بين الواجهات في وسط المدينة.","Miércoles. La señora Petersen hace contigo un safari de escaparates por el centro.","Quarta-feira. A senhora Petersen faz com você um safári de vitrines pelo centro.","Среда. Госпожа Петерсен устраивает с тобой сафари по витринам в центре города.","ረቡዕ። ወይዘሮ ፐተርሰን ምሳኻ ኣብ ማእከል ከተማ ዙረት መርኣዪ መሳኹቲ ትገብር።"]],
 say:[P,["„Es gibt fünf Schaufenstertypen. Erkennst du sie?“","„Có năm loại tủ kính. Bạn có nhận ra chúng không?“","„Beş vitrin türü var. Onları tanıyabilir misin?“","«هناك خمسة أنواع من الواجهات. هل تتعرّف عليها؟»","«Hay cinco tipos de escaparate. ¿Los reconoces?»","“Existem cinco tipos de vitrine. Você consegue reconhecê-los?”","«Есть пять типов витрин. Узнаешь их?»","«ሓሙሽተ ዓይነታት መርኣዪ መስኮት ኣለዉ። ተለልዮም ዶ?»"]],
 lk:["Im Advent gibt es in vielen deutschen Städten Weihnachtsmärkte – auch in Bremerhaven. Viele Geschäfte machen dann Anlassfenster mit Sternen, Kerzen und Geschenken.",
     "Vào Mùa Vọng, nhiều thành phố ở Đức có chợ Giáng sinh – Bremerhaven cũng vậy. Khi đó nhiều cửa hàng làm tủ kính theo dịp lễ với ngôi sao, nến và quà.",
     "Advent döneminde birçok Alman şehrinde Noel pazarları kurulur – Bremerhaven'da da. Birçok mağaza o zaman yıldızlar, mumlar ve hediyelerle özel gün vitrinleri yapar.",
     "في فترة المجيء توجد أسواق عيد الميلاد في كثير من المدن الألمانية – وفي بريمرهافن أيضاً. كثير من المحلات تصنع حينها واجهات مناسبات بالنجوم والشموع والهدايا.",
     "En Adviento hay mercados de Navidad en muchas ciudades alemanas, también en Bremerhaven. Muchas tiendas montan entonces escaparates de ocasión con estrellas, velas y regalos.",
     "No Advento há mercados de Natal em muitas cidades alemãs – também em Bremerhaven. Muitas lojas fazem então vitrines de ocasião com estrelas, velas e presentes.",
     "В Адвент во многих городах Германии работают рождественские рынки — и в Бремерхафене тоже. Многие магазины тогда оформляют праздничные витрины со звёздами, свечами и подарками.",
     "ኣብ ግዜ ኣድቨንት ኣብ ብዙሓት ከተማታት ጀርመን ዕዳጋታት ልደት ኣለዉ – ኣብ ብረመርሃፈን'ውን። ሽዑ ብዙሓት ድኳናት ብኮኾብ፡ ሽምዓን ህያባትን መርኣዪ ኣጋጣሚ ይገብሩ።"]},

     {a:["👓 Optiker Klarblick: fast leer, nur zwei Brillen – man sieht direkt in den hellen Laden","👓 Tiệm kính mắt Klarblick: gần như trống, chỉ có hai cặp kính – nhìn thẳng vào cửa hàng sáng sủa","👓 Klarblick Optik: neredeyse boş, sadece iki gözlük – doğrudan aydınlık mağazanın içi görünüyor","👓 محلّ النظارات كلاربليك: شبه فارغ، نظارتان فقط – ترى مباشرة داخل المحل المضيء","👓 Óptica Klarblick: casi vacío, solo dos gafas; se ve directamente la tienda iluminada","👓 Ótica Klarblick: quase vazia, só dois óculos – dá para ver direto a loja iluminada","👓 Оптика «Кларблик»: почти пусто, только двое очков — видно прямо в светлый магазин","👓 ድኳን መነጽር Klarblick፡ ዳርጋ ባዶ፡ ክልተ መነጽር ጥራይ – ብቐጥታ ናብቲ ብሩህ ድኳን ይርአ"],c:3},

     {a:["🧸 Spielwaren Ankerplatz: ein Piratenschiff mit Plüschtieren – Thema „Ahoi, Abenteuer!“","🧸 Cửa hàng đồ chơi Ankerplatz: một con tàu cướp biển với thú nhồi bông – chủ đề „Ahoi, phiêu lưu!“","🧸 Ankerplatz Oyuncakçısı: pelüş oyuncaklı bir korsan gemisi – tema „Ahoy, macera!“","🧸 محل ألعاب أنكربلاتس: سفينة قراصنة مع دمى محشوّة – الموضوع «أهوي، مغامرة!»","🧸 Juguetería Ankerplatz: un barco pirata con peluches; tema «¡Ahoy, aventura!»","🧸 Loja de brinquedos Ankerplatz: um navio pirata com bichos de pelúcia – tema “Ahoy, aventura!”","🧸 Магазин игрушек «Анкерплац»: пиратский корабль с плюшевыми зверями — тема «Эй, приключения!»","🧸 ድኳን መጻወቲ Ankerplatz፡ መርከብ ሸፋቱ ምስ ናይ ጨርቂ እንስሳታት – ኣርእስቲ «ኣሆይ፡ ጀብዱ!»"],c:1},
     {a:["💐 Blumen Deichrose: Herzen, Rosen und Pralinen zum Muttertag","💐 Tiệm hoa Deichrose: trái tim, hoa hồng và sô-cô-la cho Ngày của Mẹ","💐 Deichrose Çiçekçisi: Anneler Günü için kalpler, güller ve çikolatalar","💐 محل زهور دايشروزه: قلوب وورود وشوكولاتة لعيد الأم","💐 Floristería Deichrose: corazones, rosas y bombones para el Día de la Madre","💐 Floricultura Deichrose: corações, rosas e bombons para o Dia das Mães","💐 Цветочный «Дайхрозе»: сердечки, розы и конфеты ко Дню матери","💐 ድኳን ዕምባባ Deichrose፡ ልብታት፡ ጽጌረዳን ቸኮላታትን ንበዓል ኣደታት"],c:4},
     {a:["🚗 Autohaus Küste: große Glasfront, man sieht die Autos im Ausstellungsraum","🚗 Đại lý ô tô Küste: mặt kính lớn, nhìn thấy những chiếc xe trong phòng trưng bày","🚗 Küste Oto Galerisi: büyük cam cephe, sergi salonundaki arabalar görünüyor","🚗 معرض سيارات كوسته: واجهة زجاجية كبيرة، ترى السيارات في صالة العرض","🚗 Concesionario Küste: gran fachada de cristal; se ven los coches en la sala de exposición","🚗 Concessionária Küste: grande fachada de vidro, dá para ver os carros no salão","🚗 Автосалон «Кюсте»: большая стеклянная стена, видно машины в зале","🚗 ድኳን መካይን Küste፡ ዓቢ ናይ ብርጭቆ ገጽ፡ ኣብ ኣዳራሽ ምርኢት ዘለዋ መካይን ይረኣያ"],c:3}],
 merke:["Das Ziel bestimmt den Typ: informieren → Übersicht · begeistern → Fantasie · Menge zeigen → Stapel · in den Laden schauen lassen → Durchblick · Anlass nutzen → Anlass",
        "Mục tiêu quyết định loại: thông tin → Übersicht · gây hứng thú → Fantasie · thể hiện số lượng → Stapel · cho nhìn vào cửa hàng → Durchblick · tận dụng dịp lễ → Anlass",
        "Hedef türü belirler: bilgi vermek → Übersicht · heyecanlandırmak → Fantasie · miktar göstermek → Stapel · mağazanın içini göstermek → Durchblick · vesileyi kullanmak → Anlass",
        "الهدف يحدّد النوع: الإعلام ← Übersicht · الإبهار ← Fantasie · إظهار الكمية ← Stapel · رؤية داخل المحل ← Durchblick · استغلال مناسبة ← Anlass",
        "El objetivo decide el tipo: informar → Übersicht · entusiasmar → Fantasie · mostrar cantidad → Stapel · dejar ver la tienda → Durchblick · aprovechar una ocasión → Anlass",
        "O objetivo decide o tipo: informar → Übersicht · encantar → Fantasie · mostrar quantidade → Stapel · deixar ver a loja → Durchblick · usar uma data → Anlass",
        "Цель определяет тип: информировать → Übersicht · восхищать → Fantasie · показать количество → Stapel · показать магазин → Durchblick · использовать повод → Anlass",
        "ዕላማ ንዓይነት ይውስን፡ ምሕባር → Übersicht · ምምሳጥ → Fantasie · ብዝሒ ምርኣይ → Stapel · ናብ ድኳን ምርኣይ → Durchblick · ኣጋጣሚ ምጥቃም → Anlass"]},

{t:"story",ch:4,
 p:[["Donnerstagnacht. Ein Sturm fegt über die Weser. Am Morgen ist die Deko im Fenster kaputt! Die Jury kommt schon am Samstag.",
     "Đêm thứ Năm. Một cơn bão quét qua sông Weser. Buổi sáng, đồ trang trí trong tủ kính bị hỏng hết! Ban giám khảo sẽ đến ngay thứ Bảy.",
     "Perşembe gecesi. Weser'in üzerinde bir fırtına esiyor. Sabah vitrindeki süsler bozulmuş! Jüri cumartesi geliyor.",
     "ليلة الخميس. عاصفة تجتاح نهر الفيزر. في الصباح، الزينة في الواجهة محطّمة! لجنة التحكيم ستأتي يوم السبت.",
     "Jueves por la noche. Una tormenta barre el Weser. ¡Por la mañana la decoración del escaparate está rota! El jurado llega ya el sábado.",
     "Quinta-feira à noite. Uma tempestade varre o rio Weser. De manhã, a decoração da vitrine está quebrada! O júri já vem no sábado.",
     "В ночь на пятницу над Везером бушует шторм. Утром декор в витрине сломан! Жюри придёт уже в субботу.",
     "ለይቲ ሓሙስ። ህቦብላ ኣብ ልዕሊ ርባ ፈዘር ይነፍስ። ንግሆ እቲ መስለሚ ኣብ መርኣዪ መስኮት ተሰይሩ! ፈረድቲ ቀዳም ይመጹ።"]],
 say:[B,["„Wir bauen ein neues Fenster. Du planst mit!“","„Chúng ta làm một tủ kính mới. Bạn cùng lên kế hoạch nhé!“","„Yeni bir vitrin kuruyoruz. Sen de planla!“","«سنبني واجهة جديدة. وأنت تشارك في التخطيط!»","«Montamos un escaparate nuevo. ¡Tú planificas con nosotros!»","“Vamos montar uma vitrine nova. Você planeja com a gente!”","«Мы делаем новую витрину. Ты планируешь вместе с нами!»","«ሓድሽ መርኣዪ መስኮት ንሰርሕ። ንስኻ'ውን ምሳና ትሓስብ!»"]],
 lk:["Alle paar Jahre feiert Bremerhaven die „Sail“: Große Segelschiffe aus vielen Ländern kommen in den Hafen. Hunderttausende Menschen feiern mit.",
     "Cứ vài năm Bremerhaven lại tổ chức lễ hội „Sail“: những con tàu buồm lớn từ nhiều nước đến cảng. Hàng trăm nghìn người cùng tham gia.",
     "Bremerhaven birkaç yılda bir „Sail“ festivalini kutlar: Birçok ülkeden büyük yelkenli gemiler limana gelir. Yüz binlerce kişi kutlamaya katılır.",
     "كل بضع سنوات تحتفل بريمرهافن بمهرجان «Sail»: تأتي سفن شراعية كبيرة من بلدان كثيرة إلى الميناء. ويحتفل مئات الآلاف من الناس.",
     "Cada pocos años Bremerhaven celebra la «Sail»: grandes veleros de muchos países llegan al puerto. Cientos de miles de personas lo celebran.",
     "A cada poucos anos Bremerhaven celebra a “Sail”: grandes veleiros de muitos países chegam ao porto. Centenas de milhares de pessoas participam.",
     "Раз в несколько лет Бремерхафен празднует «Sail»: в порт приходят большие парусники из многих стран. Праздновать приходят сотни тысяч людей.",
     "ብረመርሃፈን ኣብ ውሽጢ ሒደት ዓመታት «Sail» ተብዕል፡ ካብ ብዙሓት ሃገራት ዓበይቲ መራኽብ ሸራ ናብ ወደብ ይመጻ። ሚእቲ ኣሽሓት ሰባት የብዕሉ።"]},
{t:"mc",ch:4,say:B,
 q:["„Wir wollen begeistern – mit einer Szene zum Thema ‚Abenteuer auf See‘. Welcher Typ passt?“","„Chúng ta muốn gây ấn tượng mạnh – bằng một khung cảnh về chủ đề ‚Phiêu lưu trên biển‘. Loại nào phù hợp?“","„Heyecan uyandırmak istiyoruz – ‚Denizde macera‘ temalı bir sahneyle. Hangi tür uygun?“","«نريد أن نُبهر الناس – بمشهد عن موضوع ‹مغامرة في البحر›. أي نوع يناسب؟»","«Queremos entusiasmar con una escena sobre ‹Aventura en el mar›. ¿Qué tipo encaja?»","“Queremos encantar – com uma cena sobre o tema ‘Aventura no mar’. Que tipo combina?”","«Мы хотим восхитить — сценой на тему „Приключение в море“. Какой тип подходит?»","«ሰባት ክንምስጥ ንደሊ – ብትርኢት ብዛዕባ ‹ጀብዱ ኣብ ባሕሪ›። ኣየናይ ዓይነት ይሰማማዕ?»"],
 o:[{a:TY[2],fb:["Ein Stapelfenster zeigt nur Menge. Eine Szene mit Thema begeistert mehr.","Tủ kính chất hàng chỉ thể hiện số lượng. Một khung cảnh có chủ đề gây hứng thú hơn.","Yığın vitrini sadece miktarı gösterir. Temalı bir sahne daha çok heyecan uyandırır.","واجهة التكديس تُظهر الكمية فقط. المشهد ذو الموضوع يُبهر أكثر.","El escaparate de apilamiento solo muestra cantidad. Una escena con tema entusiasma más.","A vitrine de empilhamento só mostra quantidade. Uma cena com tema encanta mais.","Витрина-штабель показывает только количество. Сцена с темой восхищает больше.","መርኣዪ ምድርዳር ብዝሒ ጥራይ የርኢ። ትርኢት ምስ ኣርእስቲ ዝያዳ ይምስጥ።"]},
    {a:TY[1],ok:1},
    {a:TY[3],fb:["Dann sieht man nur in den Laden – aber keine Szene.","Khi đó người ta chỉ nhìn vào cửa hàng – nhưng không có khung cảnh nào.","O zaman sadece mağazanın içi görünür – ama sahne yok.","عندها يرى الناس داخل المحل فقط – دون أي مشهد.","Así solo se ve la tienda, pero ninguna escena.","Aí só se vê a loja – mas nenhuma cena.","Тогда видно только магазин — но никакой сцены.","ሽዑ ናብ ድኳን ጥራይ ይርአ – ትርኢት ግን የለን።"]}],
 good:["Richtig! Ein Fantasiefenster: eine originelle Szene unter einem Leitgedanken.","Đúng! Tủ kính tưởng tượng: một khung cảnh độc đáo theo một chủ đề chính.","Doğru! Fantezi vitrini: ana fikre dayalı özgün bir sahne.","صحيح! واجهة الخيال: مشهد مبتكر حول فكرة رئيسية.","¡Correcto! Un escaparate de fantasía: una escena original con una idea central.","Certo! Uma vitrine de fantasia: uma cena original com um tema central.","Верно! Витрина-фантазия: оригинальная сцена с главной идеей.","ቅኑዕ! መርኣዪ ምናብ፡ ፍሉይ ትርኢት ብመሰረት ሓደ ቀንዲ ሓሳብ።"]},
{t:"branch",ch:4,
 p:[["Jetzt der Aufbau. Du hast drei Ideen.","Bây giờ là phần dựng tủ kính. Bạn có ba ý tưởng.","Şimdi kurulum zamanı. Üç fikrin var.","الآن وقت التركيب. لديك ثلاث أفكار.","Ahora toca montarlo. Tienes tres ideas.","Agora é a montagem. Você tem três ideias.","Теперь оформление. У тебя три идеи.","ሕጂ ምትካል። ሰለስተ ሓሳባት ኣለዉኻ።"]],
 say:[B,["„Welche Idee nimmst du?“","„Bạn chọn ý tưởng nào?“","„Hangi fikri seçiyorsun?“","«أي فكرة تختار؟»","«¿Qué idea eliges?»","“Qual ideia você escolhe?”","«Какую идею выбираешь?»","«ኣየናይ ሓሳብ ትመርጽ?»"]],
 o:[{a:["📦 Wir stellen ALLES ins Fenster: 80 Artikel, damit jeder etwas sieht!","📦 Chúng ta đặt TẤT CẢ vào tủ kính: 80 món, để ai cũng thấy được gì đó!","📦 HER ŞEYİ vitrine koyuyoruz: 80 ürün, herkes bir şey görsün!","📦 نضع كل شيء في الواجهة: 80 سلعة، حتى يرى الجميع شيئاً!","📦 ¡Ponemos TODO en el escaparate: 80 artículos, para que cada uno vea algo!","📦 Colocamos TUDO na vitrine: 80 produtos, para cada um ver alguma coisa!","📦 Ставим в витрину ВСЁ: 80 товаров, чтобы каждый что-то увидел!","📦 ኩሉ ኣብ መርኣዪ መስኮት ነቐምጥ፡ 80 ኣቑሑ፡ ኩሉ ሰብ ገለ ንኽርኢ!"],
     fb:["Samstag: Die Jury schüttelt den Kopf. „Viel zu voll! Man weiß nicht, wohin man schauen soll.“ Weniger ist mehr!","Thứ Bảy: Ban giám khảo lắc đầu. „Quá chật! Không biết nên nhìn vào đâu.“ Ít mà chất!","Cumartesi: Jüri başını sallıyor. „Çok fazla dolu! Nereye bakılacağı belli değil.“ Az çoktur!","يوم السبت: لجنة التحكيم تهزّ رأسها. «مزدحمة جداً! لا يعرف المرء أين ينظر.» القليل أكثر!","Sábado: el jurado niega con la cabeza. «¡Demasiado lleno! No se sabe adónde mirar.» ¡Menos es más!","Sábado: o júri balança a cabeça. “Cheio demais! Não dá para saber para onde olhar.” Menos é mais!","Суббота: жюри качает головой. «Слишком много! Непонятно, куда смотреть». Меньше — значит больше!","ቀዳም፡ ፈረድቲ ርእሶም ይነቕነቑ። «ኣዝዩ መሊኡ! ናበይ ከም ትርኢ ኣይፍለጥን።» ውሑድ ብዙሕ እዩ!"]},
    {a:["🎯 Das Schiff kommt genau in die Mitte. Das Licht bleibt aus – das spart Strom.","🎯 Con tàu đặt đúng chính giữa. Đèn để tắt – như vậy tiết kiệm điện.","🎯 Gemi tam ortaya geliyor. Işık kapalı kalıyor – elektrik tasarrufu olur.","🎯 السفينة في المنتصف تماماً. ويبقى الضوء مطفأً – هذا يوفّر الكهرباء.","🎯 El barco va justo en el centro. La luz se queda apagada: así ahorramos electricidad.","🎯 O navio fica bem no meio. A luz fica apagada – isso economiza energia.","🎯 Корабль ставим точно в центр. Свет не включаем — экономим электричество.","🎯 እታ መርከብ ብልክዕ ኣብ ማእከል ትቕመጥ። ብርሃን ጠፊኡ ይጸንሕ – ኤሌክትሪክ ይቑጥብ።"],
     fb:["Samstag, 11 Uhr: Das Fenster ist dunkel und die Scheibe spiegelt. Der Blickfang in der Mitte wirkt langweilig. Die Passanten gehen weiter.","Thứ Bảy, 11 giờ: Tủ kính tối và mặt kính phản chiếu. Điểm thu hút ở giữa trông nhàm chán. Người đi đường tiếp tục đi.","Cumartesi, saat 11: Vitrin karanlık ve cam yansıtıyor. Ortadaki dikkat çekici unsur sıkıcı görünüyor. İnsanlar yürümeye devam ediyor.","السبت، الساعة 11: الواجهة مظلمة والزجاج يعكس. العنصر الجاذب في المنتصف يبدو مملّاً. المارّة يواصلون السير.","Sábado, 11 h: el escaparate está oscuro y el cristal refleja. El punto de atracción en el centro resulta aburrido. La gente sigue caminando.","Sábado, 11 horas: a vitrine está escura e o vidro reflete. O ponto de atração no meio parece sem graça. As pessoas seguem em frente.","Суббота, 11 часов: витрина тёмная, стекло бликует. Приманка в центре выглядит скучно. Прохожие идут дальше.","ቀዳም ሰዓት 11፡ መርኣዪ መስኮት ጸልማት እዩ፡ ብርጭቆ ድማ የንጸባርቕ። ኣብ ማእከል ዘሎ ዓይኒ ዝስሕብ ዘሰልች ይመስል። ሓለፍቲ መገዲ ይቕጽሉ።"]},
    {a:["⚓ Wenige Artikel auf Podesten in verschiedenen Höhen. Das Schiff als Blickfang rechts oben, mit Spot. Dazu gut lesbare Preise.","⚓ Ít món hàng trên các bục ở độ cao khác nhau. Con tàu làm điểm thu hút ở góc trên bên phải, có đèn rọi. Thêm giá dễ đọc.","⚓ Farklı yükseklikteki kaidelerde az sayıda ürün. Gemi sağ üstte spot ışıklı dikkat çekici unsur. Ayrıca kolay okunan fiyatlar.","⚓ سلع قليلة على منصّات بارتفاعات مختلفة. السفينة كعنصر جاذب في الأعلى يميناً مع ضوء موجّه. وأسعار واضحة القراءة.","⚓ Pocos artículos sobre pedestales de distintas alturas. El barco como punto de atracción arriba a la derecha, con foco. Y precios bien legibles.","⚓ Poucos produtos em pedestais de alturas diferentes. O navio como ponto de atração em cima à direita, com spot. E preços fáceis de ler.","⚓ Немного товаров на подиумах разной высоты. Корабль — приманка вверху справа, с прожектором. И хорошо читаемые цены.","⚓ ውሑዳት ኣቑሑ ኣብ ዝተፈላለየ ቁመት ዘለዎም መቐመጢታት። እታ መርከብ ከም ዓይኒ ዝስሕብ ኣብ የማን ላዕሊ፡ ምስ ስፖት። ብተወሳኺ ብቐሊሉ ዝንበቡ ዋጋታት።"],ok:1}],
 good:["Herr Brandt strahlt: „Genau so! Dreidimensional, mit Licht, ein Blickfang – und weniger ist mehr.“","Ông Brandt rạng rỡ: „Đúng thế! Ba chiều, có ánh sáng, một điểm thu hút – và ít mà chất.“","Bay Brandt gülümsüyor: „Aynen böyle! Üç boyutlu, ışıklı, bir dikkat çekici unsur – ve az çoktur.“","السيد برانت يبتسم: «تماماً هكذا! ثلاثي الأبعاد، مع إضاءة، وعنصر جاذب – والقليل أكثر.»","El señor Brandt sonríe: «¡Así es! Tridimensional, con luz, un punto de atracción… y menos es más.»","O senhor Brandt sorri: “Isso mesmo! Tridimensional, com luz, um ponto de atração – e menos é mais.”","Господин Брандт сияет: «Именно так! Объёмно, со светом, одна приманка — и меньше значит больше».","ኣቶ ብራንት ፍሽክ ይብል፡ «ከምኡ እዩ! ሰለስተ ገጽ ዘለዎ፡ ምስ ብርሃን፡ ሓደ ዓይኒ ዝስሕብ – ውሑድ ድማ ብዙሕ እዩ።»"]},
{t:"mc",ch:4,say:P,
 q:["Ein Passant steht auf der anderen Straßenseite. Wodurch fällt ihm das Fenster auf?","Một người đứng ở bên kia đường. Điều gì khiến họ chú ý đến tủ kính?","Biri caddenin karşı tarafında duruyor. Vitrin onun dikkatini neyle çeker?","شخص يقف على الجهة الأخرى من الشارع. ما الذي يجعل الواجهة تلفت نظره؟","Un transeúnte está al otro lado de la calle. ¿Con qué le llama la atención el escaparate?","Uma pessoa está do outro lado da rua. O que faz a vitrine chamar a atenção dela?","Прохожий стоит на другой стороне улицы. Чем витрина привлечёт его внимание?","ሓደ ሓላፊ መገዲ ኣብ ካልእ ወገን ጐደና ደው ኢሉ ኣሎ። መርኣዪ መስኮት ብምንታይ ኣቓልብኡ ይስሕብ?"],
 o:[{a:["durch kleine Details am Stoff","bằng những chi tiết nhỏ trên vải","kumaştaki küçük detaylarla","بالتفاصيل الصغيرة في القماش","con pequeños detalles de la tela","com pequenos detalhes do tecido","мелкими деталями ткани","ብንኣሽቱ ዝርዝራት ናይ ጨርቂ"],
     fb:["Das ist Nahwirkung. Die wirkt erst, wenn man direkt davor steht.","Đó là hiệu ứng ở gần. Nó chỉ có tác dụng khi đứng ngay trước tủ kính.","Bu yakın etkidir. Ancak tam önünde durunca etki eder.","هذا هو التأثير عن قرب. لا يعمل إلا عندما يقف المرء أمام الواجهة مباشرة.","Eso es el efecto de cerca. Solo funciona cuando estás justo delante.","Isso é efeito de perto. Só funciona quando a pessoa está bem na frente.","Это эффект вблизи. Он работает, только когда стоишь прямо перед витриной.","እዚ ጽልዋ ካብ ቀረባ እዩ። ብቐጥታ ኣብ ቅድሚኡ ምስ ቆምካ ጥራይ ይሰርሕ።"]},
    {a:["durch kräftige Farben und große Formen (Fernwirkung)","bằng màu sắc mạnh và hình khối lớn (hiệu ứng từ xa)","canlı renkler ve büyük şekillerle (uzak etki)","بالألوان القوية والأشكال الكبيرة (التأثير عن بُعد)","con colores fuertes y formas grandes (efecto a distancia)","com cores fortes e formas grandes (efeito à distância)","яркими цветами и крупными формами (эффект издалека)","ብሓያላት ሕብርታትን ዓበይቲ ቅርጽታትን (ጽልዋ ካብ ርሑቕ)"],ok:1},
    {a:["durch leise Musik aus einem Lautsprecher","bằng nhạc nhẹ từ loa","bir hoparlörden gelen sessiz müzikle","بموسيقى هادئة من مكبّر صوت","con música suave de un altavoz","com música baixa de um alto-falante","тихой музыкой из динамика","ብትሑት ሙዚቃ ካብ ድምጺ ማጉልሒ"]}],
 good:["Richtig! Aus der Ferne fallen Farben auf, aus der Nähe überzeugen Details.","Đúng! Từ xa thì màu sắc gây chú ý, ở gần thì chi tiết thuyết phục.","Doğru! Uzaktan renkler dikkat çeker, yakından detaylar ikna eder.","صحيح! من بعيد تلفت الألوان النظر، ومن قريب تُقنع التفاصيل.","¡Correcto! De lejos llaman la atención los colores; de cerca convencen los detalles.","Certo! De longe as cores chamam a atenção, de perto os detalhes convencem.","Верно! Издалека привлекают цвета, вблизи убеждают детали.","ቅኑዕ! ካብ ርሑቕ ሕብርታት ኣቓልቦ ይስሕቡ፡ ካብ ቀረባ ዝርዝራት የእምኑ።"]},
/* Kapitel 6 */
{t:"story",ch:5,
 p:[["Freitag, 18 Uhr. Das Fenster ist fast fertig. Ein älterer Herr klopft an die Scheibe.","Thứ Sáu, 18 giờ. Tủ kính gần xong. Một ông cụ gõ vào mặt kính.","Cuma, saat 18. Vitrin neredeyse hazır. Yaşlı bir bey cama vuruyor.","يوم الجمعة، الساعة 18. الواجهة شبه جاهزة. رجل مسنّ يطرق على الزجاج.","Viernes, 18 h. El escaparate está casi listo. Un señor mayor llama al cristal.","Sexta-feira, 18 horas. A vitrine está quase pronta. Um senhor idoso bate no vidro.","Пятница, 18 часов. Витрина почти готова. Пожилой мужчина стучит в стекло.","ዓርቢ ሰዓት 18። መርኣዪ መስኮት ዳርጋ ተወዲኡ። ሓደ ዓቢ ሰብኣይ ንብርጭቆ ይኳሕኳሕ።"]],
 say:[O,["„Schönes Schiff! Aber was kostet denn die Jacke da?“","„Con tàu đẹp quá! Nhưng chiếc áo khoác kia giá bao nhiêu?“","„Güzel gemi! Peki şuradaki ceket kaç para?“","«سفينة جميلة! لكن كم سعر تلك السترة؟»","«¡Bonito barco! Pero ¿cuánto cuesta esa chaqueta?»","“Que navio bonito! Mas quanto custa aquela jaqueta?”","«Красивый корабль! А сколько стоит вон та куртка?»","«ጽብቕቲ መርከብ! እታ ጃኬት ግን ክንደይ ዋጋ እያ?»"]],
 lk:["Am Hafen liegen die Havenwelten: mit dem Klimahaus, dem Deutschen Auswandererhaus und dem Zoo am Meer. Viele Touristen gehen von dort in die Innenstadt zum Einkaufen.",
     "Cạnh cảng là khu Havenwelten: có Klimahaus, Bảo tàng Di dân Đức (Auswandererhaus) và Sở thú bên biển (Zoo am Meer). Nhiều du khách từ đó đi vào trung tâm để mua sắm.",
     "Limanda Havenwelten bölgesi var: Klimahaus, Alman Göçmen Evi (Auswandererhaus) ve Deniz Kenarı Hayvanat Bahçesi (Zoo am Meer). Birçok turist oradan alışveriş için şehir merkezine gider.",
     "عند الميناء تقع منطقة هافنفيلتن: مع بيت المناخ (Klimahaus) وبيت المهاجرين الألماني (Auswandererhaus) وحديقة الحيوان على البحر (Zoo am Meer). كثير من السيّاح يذهبون من هناك إلى وسط المدينة للتسوّق.",
     "Junto al puerto están los Havenwelten: con el Klimahaus, la Casa Alemana del Emigrante (Auswandererhaus) y el Zoo am Meer. Muchos turistas van desde allí al centro a comprar.",
     "No porto ficam os Havenwelten: com o Klimahaus, a Casa Alemã do Emigrante (Auswandererhaus) e o Zoo am Meer. Muitos turistas vão de lá para o centro fazer compras.",
     "У порта находятся Хафенвельтен: Климатический дом (Klimahaus), Немецкий дом эмигрантов (Auswandererhaus) и Зоопарк у моря (Zoo am Meer). Многие туристы идут оттуда в центр за покупками.",
     "ኣብ ወደብ Havenwelten ኣሎ፡ ምስ Klimahaus፡ ቤት ስደተኛታት ጀርመን (Auswandererhaus)ን Zoo am Meer ን። ብዙሓት በጻሕቲ ካብኡ ናብ ማእከል ከተማ ንዕዳጋ ይኸዱ።"]},
{t:"mc",ch:5,say:P,
 q:["„Oje, der Preis fehlt! Muss im Schaufenster ein Preis stehen?“","„Ôi, thiếu giá rồi! Trong tủ kính có bắt buộc phải ghi giá không?“","„Eyvah, fiyat yok! Vitrinde fiyat olmak zorunda mı?“","«يا للهول، السعر غير موجود! هل يجب أن يكون هناك سعر في الواجهة؟»","«¡Vaya, falta el precio! ¿Tiene que haber un precio en el escaparate?»","“Ih, falta o preço! Na vitrine precisa ter preço?”","«Ой, нет цены! В витрине обязательно должна быть цена?»","«ኣዬ፡ ዋጋ የለን! ኣብ መርኣዪ መስኮት ዋጋ ክህሉ ግድን ድዩ?»"],
 o:[{a:["Nein, Preise sind nur im Laden wichtig.","Không, giá chỉ quan trọng trong cửa hàng.","Hayır, fiyatlar sadece mağazada önemli.","لا، الأسعار مهمّة داخل المحل فقط.","No, los precios solo importan dentro de la tienda.","Não, preço só é importante dentro da loja.","Нет, цены важны только в магазине.","ኣይፋል፡ ዋጋታት ኣብ ውሽጢ ድኳን ጥራይ ኣገደስቲ እዮም።"],
     fb:["Falsch. Die Preisangabenverordnung gilt auch im Schaufenster.","Sai. Quy định niêm yết giá (Preisangabenverordnung) cũng áp dụng cho tủ kính.","Yanlış. Fiyat Gösterme Yönetmeliği (Preisangabenverordnung) vitrinde de geçerlidir.","خطأ. لائحة إعلان الأسعار (Preisangabenverordnung) تسري على الواجهة أيضاً.","Falso. El reglamento de indicación de precios (Preisangabenverordnung) también rige en el escaparate.","Errado. A lei de indicação de preços (Preisangabenverordnung) vale também na vitrine.","Неверно. Положение об указании цен (Preisangabenverordnung) действует и в витрине.","ጌጋ። ሕጊ ምምልካት ዋጋ (Preisangabenverordnung) ኣብ መርኣዪ መስኮት'ውን ይሰርሕ።"]},
    {a:["Ja. Die Preisangabenverordnung gilt auch im Schaufenster.","Có. Quy định niêm yết giá cũng áp dụng cho tủ kính.","Evet. Fiyat Gösterme Yönetmeliği vitrinde de geçerlidir.","نعم. لائحة إعلان الأسعار تسري على الواجهة أيضاً.","Sí. El reglamento de indicación de precios también rige en el escaparate.","Sim. A lei de indicação de preços vale também na vitrine.","Да. Положение об указании цен действует и в витрине.","እወ። ሕጊ ምምልካት ዋጋ ኣብ መርኣዪ መስኮት'ውን ይሰርሕ።"],ok:1},
    {a:["Nur bei Sonderangeboten.","Chỉ với hàng khuyến mãi.","Sadece indirimli ürünlerde.","فقط في العروض الخاصة.","Solo en las ofertas especiales.","Só em ofertas especiais.","Только для спецпредложений.","ኣብ ፍሉይ ዋጋታት ጥራይ።"],
     fb:["Nein. Jede ausgestellte Ware braucht einen Preis.","Không. Mọi món hàng được trưng bày đều cần có giá.","Hayır. Sergilenen her ürünün bir fiyatı olmalı.","لا. كل سلعة معروضة تحتاج إلى سعر.","No. Cada producto expuesto necesita un precio.","Não. Todo produto exposto precisa de preço.","Нет. У каждого выставленного товара должна быть цена.","ኣይፋል። ነፍሲ ወከፍ ዝቐረበ ኣቕሓ ዋጋ የድልዮ።"]}],
 good:["Richtig! Gut lesbare Preise – das ist der Grundsatz „Informationen zeigen“.","Đúng! Giá dễ đọc – đó là nguyên tắc „Thể hiện thông tin“.","Doğru! Kolay okunan fiyatlar – bu „Bilgi göstermek“ ilkesidir.","صحيح! أسعار واضحة – هذا هو مبدأ «عرض المعلومات».","¡Correcto! Precios bien legibles: es el principio «Mostrar información».","Certo! Preços fáceis de ler – esse é o princípio “Mostrar informações”.","Верно! Хорошо читаемые цены — это правило «Показывать информацию».","ቅኑዕ! ብቐሊሉ ዝንበቡ ዋጋታት – እዚ መትከል «ሓበሬታ ምርኣይ» እዩ።"]},
{t:"mc",ch:5,say:B,
 q:["„Nach dem Wettbewerb lassen wir das Fenster einfach bis Ostern so, oder?“","„Sau cuộc thi, chúng ta cứ để nguyên tủ kính như vậy đến lễ Phục Sinh nhé?“","„Yarışmadan sonra vitrini Paskalya'ya kadar böyle bırakalım, değil mi?“","«بعد المسابقة نترك الواجهة هكذا حتى عيد الفصح، صحيح؟»","«Después del concurso dejamos el escaparate así hasta Pascua, ¿no?»","“Depois do concurso, a gente deixa a vitrine assim até a Páscoa, né?”","«После конкурса просто оставим витрину так до Пасхи, да?»","«ድሕሪ ውድድር ነቲ መርኣዪ መስኮት ክሳብ ፋሲካ ከምዚ ንገድፎ፡ ኣይኮነን?»"],
 o:[{a:["Ja, es ist doch schön.","Vâng, nó đẹp mà.","Evet, güzel zaten.","نعم، إنها جميلة.","Sí, si es bonito.","Sim, ela está bonita.","Да, она же красивая.","እወ፡ ጽቡቕ እኮ እዩ።"],
     fb:["Dann gewöhnen sich die Passanten daran und schauen nicht mehr hin.","Khi đó người đi đường quen mắt và không nhìn nữa.","O zaman yoldan geçenler alışır ve artık bakmazlar.","عندها يعتاد المارّة عليها ولا ينظرون إليها بعد ذلك.","Entonces la gente se acostumbra y ya no mira.","Aí as pessoas se acostumam e não olham mais.","Тогда прохожие привыкнут и перестанут смотреть.","ሽዑ ሓለፍቲ መገዲ ይለምድዎ እሞ ደጊም ኣይርእይዎን።"]},
    {a:["Nein. Wir nehmen alles raus und lassen das Fenster leer.","Không. Chúng ta lấy hết ra và để tủ kính trống.","Hayır. Her şeyi çıkarıp vitrini boş bırakıyoruz.","لا. نُخرج كل شيء ونترك الواجهة فارغة.","No. Lo sacamos todo y dejamos el escaparate vacío.","Não. Tiramos tudo e deixamos a vitrine vazia.","Нет. Всё уберём и оставим витрину пустой.","ኣይፋል። ኩሉ ነውጽእ መርኣዪ መስኮት ድማ ባዶ ንገድፎ።"],
     fb:["Ein leeres Fenster lockt niemanden ins Geschäft.","Một tủ kính trống không thu hút ai vào cửa hàng.","Boş bir vitrin kimseyi mağazaya çekmez.","الواجهة الفارغة لا تجذب أحداً إلى المحل.","Un escaparate vacío no atrae a nadie a la tienda.","Uma vitrine vazia não atrai ninguém para a loja.","Пустая витрина никого не заманит в магазин.","ባዶ መርኣዪ መስኮት ንዝኾነ ሰብ ናብ ድኳን ኣይስሕብን።"]},
    {a:["Nein. Wir dekorieren regelmäßig neu – sonst gibt es einen Gewöhnungseffekt.","Không. Chúng ta trang trí lại thường xuyên – nếu không sẽ bị „quen mắt“.","Hayır. Düzenli olarak yeniden dekore ediyoruz – yoksa alışkanlık etkisi oluşur.","لا. نعيد التزيين بانتظام – وإلا يحدث تأثير الاعتياد.","No. Redecoramos con regularidad; si no, la gente se acostumbra.","Não. Redecoramos com regularidade – senão as pessoas se acostumam.","Нет. Мы регулярно переоформляем — иначе возникает эффект привыкания.","ኣይፋል። ብስሩዕ ሓድሽ ንስልም – እንተዘይኮይኑ ልምዲ ይፈጥር።"],ok:1}],
 good:["Genau! Regelmäßig neu dekorieren – sonst schauen die Passanten nicht mehr hin.","Chính xác! Trang trí lại thường xuyên – nếu không người đi đường sẽ không nhìn nữa.","Aynen! Düzenli olarak yeniden dekore et – yoksa insanlar artık bakmaz.","بالضبط! أعد التزيين بانتظام – وإلا لن ينظر المارّة بعد الآن.","¡Exacto! Redecorar con regularidad; si no, la gente deja de mirar.","Isso! Redecorar com regularidade – senão as pessoas não olham mais.","Точно! Регулярно переоформлять — иначе прохожие перестанут смотреть.","ልክዕ! ብስሩዕ ሓድሽ ምስላም – እንተዘይኮይኑ ሓለፍቲ መገዲ ደጊም ኣይርእዩን።"]},
{t:"profi",ch:5,
 q:["⭐ Profi-Aufgabe (Bonus): Ein Übersichtsfenster soll viel vom Sortiment zeigen. Aber: „Weniger ist mehr“! Wie passt beides zusammen? Wähle die beste Begründung.","⭐ Bài nâng cao (điểm thưởng): Tủ kính tổng quan phải thể hiện nhiều hàng hóa. Nhưng: „Ít mà chất“! Làm sao kết hợp cả hai? Hãy chọn lập luận tốt nhất.","⭐ Profi görevi (bonus): Genel bakış vitrini ürün yelpazesinden çok şey göstermeli. Ama: „Az çoktur“! İkisi nasıl bağdaşır? En iyi gerekçeyi seç.","⭐ مهمة المحترفين (مكافأة): واجهة العرض الشامل يجب أن تُظهر الكثير من التشكيلة. لكن: «القليل أكثر»! كيف يتّفق الأمران؟ اختر أفضل تعليل.","⭐ Tarea de experto (bonus): un escaparate panorámico debe mostrar mucho del surtido. Pero: «¡menos es más!». ¿Cómo encajan las dos cosas? Elige la mejor justificación.","⭐ Tarefa de profissional (bônus): uma vitrine panorâmica deve mostrar muito do sortimento. Mas: “Menos é mais”! Como juntar as duas coisas? Escolha a melhor justificativa.","⭐ Задание для профи (бонус): обзорная витрина должна показать много из ассортимента. Но: «Меньше — значит больше»! Как совместить? Выбери лучшее обоснование.","⭐ ናይ ክኢላ ዕማም (ቦኑስ)፡ መርኣዪ ሓፈሻዊ ትዕዝብቲ ብዙሕ ካብ ኣቑሑ ከርኢ ኣለዎ። ግን «ውሑድ ብዙሕ እዩ»! ክልቲኡ ብኸመይ ይሰማማዕ? እቲ ዝበለጸ ምኽንያት ምረጽ።"],
 o:[{a:["Man nimmt das größte Fenster und stellt alles hinein.","Lấy tủ kính lớn nhất và đặt tất cả vào.","En büyük vitrini alıp her şeyi içine koymak.","نأخذ أكبر واجهة ونضع فيها كل شيء.","Se usa el escaparate más grande y se pone todo dentro.","Usar a maior vitrine e colocar tudo dentro.","Взять самую большую витрину и поставить туда всё.","እቲ ዝዓበየ መርኣዪ መስኮት ወሲድካ ኩሉ ኣብኡ ምእታው።"],
     fb:["Dann ist das Fenster überladen – „Weniger ist mehr“ wird verletzt.","Khi đó tủ kính bị quá tải – vi phạm nguyên tắc „Ít mà chất“.","O zaman vitrin aşırı dolar – „Az çoktur“ ilkesi ihlal edilir.","عندها تكون الواجهة مكتظّة – ويُنتهك مبدأ «القليل أكثر».","Entonces el escaparate está sobrecargado: no se cumple «menos es más».","Aí a vitrine fica sobrecarregada – “menos é mais” não é respeitado.","Тогда витрина перегружена — правило «меньше — значит больше» нарушено.","ሽዑ መርኣዪ መስኮት ኣዝዩ ይመልእ – «ውሑድ ብዙሕ እዩ» ይጥሓስ።"]},
    {a:["Pro Warengruppe nur wenige Artikel, nach Farben oder Themen gruppiert, auf Podesten in verschiedenen Höhen, mit Freiraum und einem gemeinsamen Blickfang.","Mỗi nhóm hàng chỉ vài món, xếp theo màu hoặc chủ đề, trên các bục ở độ cao khác nhau, có khoảng trống và một điểm thu hút chung.","Her mal grubundan sadece birkaç ürün, renge veya temaya göre gruplanmış, farklı yükseklikteki kaidelerde, boşluk bırakılarak ve ortak bir dikkat çekici unsurla.","سلع قليلة فقط من كل مجموعة، مرتّبة حسب الألوان أو المواضيع، على منصّات بارتفاعات مختلفة، مع مساحة فارغة وعنصر جاذب مشترك.","Solo pocos artículos por grupo de productos, agrupados por colores o temas, sobre pedestales de distintas alturas, con espacio libre y un punto de atracción común.","Poucos produtos por grupo, agrupados por cores ou temas, em pedestais de alturas diferentes, com espaço livre e um ponto de atração em comum.","Из каждой группы — лишь несколько товаров, сгруппированных по цвету или теме, на подиумах разной высоты, со свободным местом и общей приманкой.","ካብ ነፍሲ ወከፍ ጉጅለ ኣቑሑ ሒደት ጥራይ፡ ብሕብሪ ወይ ኣርእስቲ ዝተጠርነፉ፡ ኣብ ዝተፈላለየ ቁመት ዘለዎም መቐመጢታት፡ ምስ ባዶ ቦታን ሓባራዊ ዓይኒ ዝስሕብን።"],ok:1},
    {a:["Man zeigt jede Woche nur eine einzige Warengruppe.","Mỗi tuần chỉ trưng bày một nhóm hàng duy nhất.","Her hafta sadece tek bir mal grubu göstermek.","نعرض كل أسبوع مجموعة بضائع واحدة فقط.","Cada semana se muestra un solo grupo de productos.","Mostrar só um grupo de produtos por semana.","Каждую неделю показывать только одну группу товаров.","ነፍሲ ወከፍ ሰሙን ሓደ ጉጅለ ኣቑሑ ጥራይ ምርኣይ።"],
     fb:["Dann ist es ein Stapelfenster, kein Übersichtsfenster.","Khi đó là tủ kính chất hàng, không phải tủ kính tổng quan.","O zaman bu bir yığın vitrinidir, genel bakış vitrini değil.","عندها تكون واجهة تكديس، وليست واجهة عرض شامل.","Entonces es un escaparate de apilamiento, no uno panorámico.","Aí é uma vitrine de empilhamento, não panorâmica.","Тогда это витрина-штабель, а не обзорная.","ሽዑ መርኣዪ ምድርዳር እዩ፡ መርኣዪ ሓፈሻዊ ትዕዝብቲ ኣይኮነን።"]}],
 good:["Stark begründet! Auswahl + Ordnung + Freiraum: So zeigt das Fenster viel und wirkt trotzdem nicht überladen.","Lập luận rất tốt! Chọn lọc + sắp xếp + khoảng trống: tủ kính thể hiện nhiều mà vẫn không bị quá tải.","Çok iyi gerekçe! Seçim + düzen + boşluk: Böylece vitrin çok şey gösterir ama yine de aşırı dolu görünmez.","تعليل قوي! اختيار + ترتيب + مساحة فارغة: هكذا تُظهر الواجهة الكثير دون أن تبدو مكتظّة.","¡Muy bien argumentado! Selección + orden + espacio libre: así el escaparate muestra mucho y no parece sobrecargado.","Muito bem justificado! Seleção + ordem + espaço livre: assim a vitrine mostra muito sem parecer sobrecarregada.","Отличное обоснование! Отбор + порядок + свободное место: витрина показывает много и не выглядит перегруженной.","ብሉጽ ምኽንያት! ምርጫ + ስርዓት + ባዶ ቦታ፡ ከምዚ መርኣዪ መስኮት ብዙሕ የርኢ፡ ግን ኣዝዩ መሊኡ ኣይመስልን።"]},

 lk:["Bremerhaven liegt an der Nordsee, an der Mündung der Weser. Der Hafen gehört zu den größten Autohäfen der Welt: Jedes Jahr werden hier über eine Million Autos verschifft.",
     "Bremerhaven nằm bên Biển Bắc, ở cửa sông Weser. Cảng ở đây là một trong những cảng ô tô lớn nhất thế giới: mỗi năm có hơn một triệu chiếc ô tô được vận chuyển bằng tàu.",
     "Bremerhaven, Kuzey Denizi kıyısında, Weser Nehri'nin ağzında yer alır. Liman dünyanın en büyük otomobil limanlarından biridir: Her yıl bir milyondan fazla araç gemilerle taşınır.",

     "Bremerhaven está en el mar del Norte, en la desembocadura del Weser. Su puerto es uno de los mayores puertos de coches del mundo: cada año se embarcan aquí más de un millón de coches.",
     "Bremerhaven fica no Mar do Norte, na foz do rio Weser. O porto é um dos maiores portos de carros do mundo: todo ano mais de um milhão de carros são embarcados aqui.",

 let h=`<span class="de">${nm(a[0])}</span>`;
 if(L!=='de'&&a[LI[L]]) h+=`<span class="tl" dir="${L==='ar'?'rtl':'ltr'}" lang="${L}">${nm(a[LI[L]])}</span>`;
 return h;
}
function say(c,a){return `<div class="say"><div class="av">${c.av}</div><div class="bub"><div class="who">${c.who}</div>${X(a)}</div></div>`;}
function merke(a){return a?`<div class="merke"><b>💡 ${U.merke[0]}${L!=='de'?' · '+U.merke[LI[L]]:''}:</b> ${X(a)}</div>`:'';}
function lk(a){return (a&&L!=='de')?`<div class="lk"><div class="h">🇩🇪 ${X(U.lk)}</div>${X(a)}</div>`:'';}
function addPts(n){score+=n;$('#pts').textContent='⭐ '+(score+bonus);}
function confetti(){const e=['🎉','⭐','⚓','🛍️','✨'];for(let i=0;i<22;i++){const d=document.createElement('div');d.className='conf';d.textContent=e[i%e.length];d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}}
function setNext(enabled,label){const b=$('#next');b.disabled=!enabled;b.innerHTML=X(label||U.next).replace(/class="de"/,'class="de"');}
function prog(){const ch=S[step].ch;let h='';for(let i=0;i<7;i++)h+=`<i class="${ch===undefined?'':(i<ch?'done':(i===ch?'on':''))}"></i>`;$('#prog').innerHTML=h;}
function head(s){return `${s.img?`<img class="hero" src="${IMG[s.img]}" alt="">`:''}<div class="body"><div class="chap">${U.chap[0]} ${s.ch+1}${L!=='de'?' · '+U.chap[LI[L]]+' '+(s.ch+1):''}</div><h2>${X(CH[s.ch])}</h2>`;}

/* ---------- Renderer ---------- */
function render(){
 const s=S[step]; prog(); window.scrollTo({top:0,behavior:'smooth'});
 const m=$('#main'); done=false;
 if(s.t==='start') return rStart(m);
 if(s.t==='story'){m.innerHTML=`<div class="card">${head(s)}${(s.p||[]).map(a=>`<p>${X(a)}</p>`).join('')}${s.say?say(s.say[0],s.say[1]):''}${merke(s.merke)}${lk(s.lk)}</div></div>`;setNext(true);return;}
 if(s.t==='mc'||s.t==='profi') return rMC(m,s);
 if(s.t==='multi') return rMulti(m,s);
 if(s.t==='pyr') return rPyr(m,s);
 if(s.t==='shops') return rShops(m,s);
 if(s.t==='sort') return rSort(m,s);
 if(s.t==='branch') return rBranch(m,s);
 if(s.t==='end') return rEnd(m);
}
function rStart(m){
 m.innerHTML=`<div class="card"><img class="hero" src="${IMG.s1}" alt=""><div class="body">
 <div class="chap">LF 4 · Modul 3 · Das Schaufenster</div>
 <h1>⚓ Abenteuer: Das goldene Schaufenster</h1>
 <p>Eine interaktive Geschichte: Du bist Azubi im Kaufhaus Hafenlicht in Bremerhaven. Ein Sturm, ein Wettbewerb, ein Detektivfall – und am Ende gewinnst du das goldene Schaufenster.</p>
 <div class="q">${X(U.lang)}</div><div class="langs">${LANGS.map(([k,l])=>`<button class="lang ${k===L?'sel':''}" data-l="${k}" ${k==='ar'?'dir="auto"':''}>${l}</button>`).join('')}</div>
 <div class="q">${X(U.name)}</div><input class="name" id="nm" maxlength="24" value="${NAME}" placeholder="Vorname">
 <p class="small">7 Kapitel · ca. 25 Minuten · Lehrbuch S. 208–209</p></div></div>`;
 m.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{NAME=$('#nm').value.trim();L=b.dataset.l;document.documentElement.lang=L;render();});
 setNext(true,U.start);
}
function rMC(m,s){
 let first=true;
 const isP=s.t==='profi';
 m.innerHTML=`<div class="card">${head(s)}${s.say?`<div class="say"><div class="av">${s.say.av}</div><div class="bub"><div class="who">${s.say.who}</div>${X(s.q)}</div></div>`:`<div class="q">${s.n?`${U.qOf[0]} ${s.n}/6 · `:''}${X(s.q)}</div>`}
 <div class="opts ${isP?'profi':''}">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div><div id="fb"></div>${merke(s.merke)&&''}</div></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const o=s.o[+b.dataset.i];
  if(o.ok){b.classList.add('ok');m.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   if(first){isP?bonus++:addPts(1);if(isP)addPts(0);}
   $('#fb').innerHTML=`<div class="fb good">✅ <b>${X(U.right)}</b>${s.good?X(s.good):''}</div>${merke(s.merke)}`;confetti();setNext(true);}
  else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(o.fb||U.wrong)}</div>`;}
 });
 setNext(isP,isP?U.skip:U.next);
}
function rMulti(m,s){
 let first=true,sel=new Set();
 m.innerHTML=`<div class="card">${head(s)}${say(s.say,s.q)}<p class="small">${X(U.pick2)}</p>
 <div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div>
 <p style="text-align:center"><button class="btn sec" id="chk">${X(U.check)}</button></p><div id="fb"></div></div></div>`;
 m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;b.classList.remove('no');if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}else if(sel.size<2){sel.add(i);b.classList.add('sel')}});
 $('#chk').onclick=()=>{
  if(sel.size<2)return;
  const ok=[...sel].every(i=>s.o[i].ok);
  if(ok){m.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(s.o[i].ok)b.classList.add('ok')});$('#chk').disabled=true;if(first)addPts(1);$('#fb').innerHTML=`<div class="fb good">✅ <b>${X(U.right)}</b>${X(s.good)}</div>`;confetti();setNext(true);}
  else{first=false;[...sel].forEach(i=>{if(!s.o[i].ok){const b=m.querySelector(`.opt[data-i="${i}"]`);b.classList.remove('sel');b.classList.add('no');sel.delete(i);}});$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
 };
 setNext(false);
}
function rPyr(m,s){
 let cur=0,miss=false;
 const order=s.lv.map((_,i)=>i).sort(()=>Math.random()-.5);
 function draw(){
  const w=i=>40+i*9; // Breite in %
  m.innerHTML=`<div class="card">${head(s)}<div class="q">${X(s.q)}</div>
  <div class="pyr">${s.lv.map((l,i)=>`<div class="lvl ${i<cur?'fill':(i===cur?'cur':'')}" style="width:${w(6-i)}%;${i<cur?'background:'+l[2]:''}"><small>${i+1} · ${l[0][0]}${L!=='de'?' · '+l[0][LI[L]]:''}</small>${i<cur?l[1][0]:(i===cur?'?':'')}</div>`).join('')}</div>
  ${cur<7?`<p class="small" style="text-align:center">${U.level[0]} ${cur+1}: <b>${s.lv[cur][0][0]}</b> – ${U.which[0]}${L!=='de'?` · ${U.level[LI[L]]} ${cur+1}: ${s.lv[cur][0][LI[L]]} – ${U.which[LI[L]]}`:''}</p>
  <div class="chips">${order.filter(i=>i>=cur).map(i=>`<button class="chip" data-i="${i}">${X(s.lv[i][1])}</button>`).join('')}</div>`
  :`<div class="fb good">✅ <b>${X(U.right)}</b>${X(s.good)}</div>${merke(s.merke)}`}<div id="fb"></div></div></div>`;
  m.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
   if(+b.dataset.i===cur){if(!miss)addPts(1);miss=false;cur++;draw();if(cur===7){confetti();setNext(true);}}
   else{miss=true;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);}
  });
 }
 draw(); setNext(false);
}
function rShops(m,s){
 let i=0,phase=0,first=true,ans=[];
 const quad=(b,d)=>b?(d?'c2':'c4'):(d?'c1':'c3');
 const QL={c1:["tief + schmal","sâu + hẹp","derin + dar","عميقة + ضيّقة"],c2:["tief + breit","sâu + rộng","derin + geniş","عميقة + واسعة"],c3:["flach + schmal","nông + hẹp","sığ + dar","سطحية + ضيّقة"],c4:["flach + breit","nông + rộng","sığ + geniş","سطحية + واسعة"]};
 function cross(){return `<div class="cross">${['c1','c2','c3','c4'].map(c=>`<div class="${c}"><div class="lab">${QL[c][0]}${L!=='de'?' · '+QL[c][LI[L]]:''}</div>${ans.filter(a=>a.q===c).map(a=>`<span class="tag">${a.s}</span>`).join('')}</div>`).join('')}</div>`;}
 function draw(){
  const sh=s.sh[i];
  let body;
  if(i<s.sh.length){
   const q=phase===0?s.qb:s.qd, o=phase===0?s.ob:s.od;
   body=`<div class="small">${i+1} / ${s.sh.length}</div><div class="shop">${X(sh.n)}</div><div class="q">${X(q)}</div>
   <div class="row2">${o.map((a,k)=>`<button class="opt" data-k="${k}">${X(a)}</button>`).join('')}</div><div id="fb"></div>`;
  } else body=`<div class="fb good">✅ ${X(s.good)}</div>`;
  m.innerHTML=`<div class="card">${head(s)}${body}${cross()}</div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k, right=phase===0?sh.b:sh.d;
   if(k===right){if(first)addPts(1);first=true;b.classList.add('ok');
     if(phase===0){phase=1;setTimeout(draw,450);}else{ans.push({s:sh.s,q:quad(sh.b,sh.d)});phase=0;i++;setTimeout(()=>{draw();if(i===s.sh.length){confetti();setNext(true);}},450);}}
   else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
  });
 }
 draw(); setNext(false);
}
function rSort(m,s){
 let i=0,first=true,placed=[];
 function draw(){
  let body;
  if(i<s.it.length) body=`${s.q?`<div class="q">${X(s.q)}</div>`:''}<div class="small">${i+1} / ${s.it.length}</div><div class="shop">${X(s.it[i].a)}</div>
   <div class="cats">${s.cats.map((c,k)=>`<button class="opt" data-k="${k}">${X(c)}</button>`).join('')}</div><div id="fb"></div>`;
  else body=`<div class="fb good">✅ <b>${X(U.right)}</b></div>${merke(s.merke)}`;
  m.innerHTML=`<div class="card">${head(s)}${body}${placed.length?`<div style="margin-top:.8rem">${placed.map(p=>`<span class="tag">${p}</span>`).join(' ')}</div>`:''}</div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const k=+b.dataset.k;
   if(k===s.it[i].c){if(first)addPts(1);first=true;b.classList.add('ok');placed.push(s.it[i].a[0].split(' ')[0]+' → '+s.cats[k][0].split(' – ')[0]);i++;setTimeout(()=>{draw();if(i===s.it.length){confetti();setNext(true);}},450);}
   else{first=false;b.classList.add('no');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${X(U.wrong)}</div>`;}
  });
 }
 draw(); setNext(false);
}
function rBranch(m,s){
 let first=true;
 function menu(){
  m.innerHTML=`<div class="card">${head(s)}${s.p.map(a=>`<p>${X(a)}</p>`).join('')}${say(s.say[0],s.say[1])}
  <div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}">${X(o.a)}</button>`).join('')}</div></div></div>`;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const o=s.o[+b.dataset.i];
   if(o.ok){if(first)addPts(1);m.querySelector('.body').insertAdjacentHTML('beforeend',`<div class="fb good">✅ ${X(s.good)}</div>${lk(s.lk)}`);m.querySelectorAll('.opt').forEach(x=>{x.disabled=true});b.classList.add('ok');confetti();setNext(true);}
   else{first=false;m.innerHTML=`<div class="card">${head(s)}<div class="fb bad" style="font-size:1.05rem">⏩ ${X(o.fb)}</div><p style="text-align:center;margin-top:1rem"><button class="btn sec" id="bk">↩ ${X(U.back)}</button></p></div></div>`;$('#bk').onclick=menu;}
  });
  setNext(false);
 }
 menu();
}
function rEnd(m){
 const pct=score/MAX, st=pct>=.9?'⭐⭐⭐':pct>=.7?'⭐⭐':pct>=.5?'⭐':'';
 const d=new Date().toLocaleDateString('de-DE');
 m.innerHTML=`<div class="card"><img class="hero" src="${IMG.s1}" alt=""><div class="body"><div class="cert">
 <div class="badge">🏅</div><h1>${X(ENDT)}</h1>
 <p style="font-size:1.3rem;font-weight:800">${NAME||''}</p>
 <div class="stars">${st}</div>
 <div class="score">${score} / ${MAX}${bonus?` + ${bonus} ⭐ Profi-Bonus`:''}</div><p class="small">${X(U.first)}</p>
 <p class="small">LF 4 · Modul 3 · Schaufenster · ${d}</p></div>
 <p style="text-align:center">${X(U.show)}</p>
 <p style="text-align:center"><button class="btn sec" id="again">🔄 ${X(U.again)}</button></p></div></div>`;
 $('#again').onclick=()=>{score=0;bonus=0;step=0;$('#pts').textContent='⭐ 0';render();};
 confetti(); setNext(false); $('#next').style.display='none';
}
$('#next').onclick=()=>{
 if(S[step].t==='start'){const n=$('#nm');NAME=n?n.value.trim():'';}
 if(step<S.length-1){step++;$('#next').style.display='';render();}
};
function toast(m){let d=document.createElement('div');d.className='toast';d.innerHTML=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
$('#langBtn').onclick=()=>{const k=Object.keys(LI);L=k[(k.indexOf(L)+1)%k.length];document.documentElement.lang=L;
 if(S[step].t==='start'||S[step].t==='story'||S[step].t==='end')render();else toast('🌐 '+LNAME[L]+'<br>'+U.later[0]+(L!=='de'?'<br>'+U.later[LI[L]]:''));};
render();
</script>
</body>
</html>
