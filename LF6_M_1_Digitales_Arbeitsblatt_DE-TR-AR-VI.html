<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}

.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}

.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}

.tbl.info th{background:#eef3f6}

.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}

.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>

ewerber).", "Eine [[große Bestellmenge]] bringt Mengenrabatt und niedrige Bestellkosten, aber viel [[Kapitalbindung]], hohe [[Lagerkosten]] und [[Lagerrisiko]].", "Die [[optimale Bestellmenge]] ist die Menge, bei der Bestellkosten und Lagerkosten zusammen am niedrigsten sind."], "q": {"q": "Was ist eine externe Quelle für die Bedarfsermittlung?", "o": ["Marktberichte, Fachzeitschriften", "Absatzstatistik des Vorjahres", "Lagerbestand"], "a": 0}}, {"k": "task", "id": "a2", "n": "Aufgabe 2", "h": "Eine Absatzstatistik auswerten", "intro": "Vor der nächsten Bestellung wertet Azubi Deniz die Absatzzahlen aus (Stück je Quartal):", "sit": "<table class=\"tbl info\"><tr><th>Preisgruppe</th><th>Vorjahr Q4</th><th>dieses Jahr Q4</th></tr><tr><td>untere (bis 10 €)</td><td>150</td><td>95</td></tr><tr><td>mittlere (10–20 €)</td><td>135</td><td>138</td></tr><tr><td>gehobene (über 20 €)</td><td>30</td><td>70</td></tr><tr><td>Summe</td><td>315</td><td>303</td></tr></table>", "tip": "Erst die Summe, dann jede Zeile, dann entscheiden – und nur gleiche Zeiträume vergleichen.", "items": [{"t": "tf", "id": "a2.1", "q": "Richtig oder falsch?", "rows": [["Die Summe bleibt fast gleich (295 → 303).", true], ["Die Verschiebung steckt in den Zeilen, nicht in der Summe.", true], ["Die untere Preisgruppe steigt.", false], ["Man darf Q1 mit Q4 vergleichen.", false]]}, {"t": "mc", "id": "a2.2", "q": "Welche Entscheidung ist richtig?", "o": ["mehr Becher der gehobenen Gruppe, weniger der unteren, mittlere gleich.", "insgesamt viel mehr Becher bestellen", "nur noch Becher der unteren Gruppe bestellen"], "a": 0, "ex": "Bedarfsorientiert einkaufen: Kunden fragen höherwertige Becher nach."}]}, {"k": "task", "id": "a3", "n": "Aufgabe 3", "h": "Das Sonderangebot über 500 Kartons", "intro": "Ein Lieferer bietet 500 Kartons zum Sonderpreis an (30 % günstiger).", "tip": "Denke an Platz im Lager, Geld und Risiko.", "items": [{"t": "gap", "id": "a3.1", "q": "Ergänze die Lücken.", "text": "Der Stückpreis ist ___ (Mengenrabatt). Wir müssen seltener ___ → geringere Bestellkosten. Die ___ reicht vielleicht nicht aus. Viel Geld ist im Lager gebunden → hohe ___. Die Kartons können verstauben oder unmodern werden → ___.", "bank": ["niedriger", "bestellen", "Lagerkapazität", "Kapitalbindung", "Lagerrisiko", "höher"], "a": ["niedriger", "bestellen", "Lagerkapazität", "Kapitalbindung", "Lagerrisiko"]}, {"t": "mc", "id": "a3.2", "q": "Welche Folge kann die Annahme des Sonderangebots haben?", "o": ["Der Mindestbestand kann gesenkt werden.", "Die Lagerkapazität reicht nicht aus.", "Die Kapitalbindung sinkt.", "Die Lagerdauer wird kürzer.", "Die Annahme der Ware muss verweigert werden."], "a": 1}, {"t": "free", "id": "a3.3", "q": "Was muss Deniz prüfen, bevor er zusagt? Nenne zwei Punkte.", "model": "Wie viel Platz ist im Lager frei? Wie viele Kartons brauchen wir in welcher Zeit (Absatz)? Ist genug Geld da?"}]}, {"k": "task", "id": "a4", "n": "Aufgabe 4", "h": "Bedarf und Menge planen", "intro": "Löse die Aufgaben ohne Vorlage. Nutze das Wortgeländer.", "tip": "Die Nordstadt-Kauf GmbH ermittelt den Bedarf mithilfe von …", "items": [{"t": "free", "id": "a4.1", "q": "4.1 Nenne je zwei interne und zwei externe Quellen für die Bedarfsermittlung.", "model": "intern: Verkaufsdaten aus dem WWS, Absatzstatistik, Kundenwünsche, Lagerbestand · extern: Marktberichte, Fachzeitschriften, Messen, Mitbewerber, Trends"}, {"t": "mc", "id": "a4.2", "q": "Sail-Festival am Sonntag: Welche Daten aus dem Warenwirtschaftssystem helfen beim Einkauf?", "o": ["der Gewinn der letzten Sonntagsöffnung", "der Warenabsatz der letzten Sonntagsöffnung", "die Kassendifferenz der letzten Sonntagsöffnung", "die Provision der Verkäufer", "der durchschnittliche Lagerbestand des letzten Jahres"], "a": 1}, {"t": "free", "id": "a4.3", "q": "4.3 Erkläre in zwei Sätzen, was man unter der optimalen Bestellmenge versteht.", "model": "Das ist die Bestellmenge, bei der die Summe aus Bestellkosten und Lagerkosten am niedrigsten ist. Große Mengen senken die Bestellkosten, erhöhen aber die Lagerkosten."}, {"t": "calc", "id": "a4.4", "q": "240 Becher reichen 12 Tage. Wie viele Tage reichen 300 Becher?", "a": 15, "unit": "Tage", "steps": ["240 Becher → 12 Tage", "1 Becher → 12 : 240 Tage", "300 Becher → 12 : 240 × 300 = 15 Tage"], "traps": [[9.6, "Umgekehrt gerechnet: Mehr Becher reichen länger, nicht kürzer."]]}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Limitrechnung", "intro": "Wareneinsatz 60.000 €, Endbestand 18.000 €, Anfangsbestand 22.000 €, schon bestellt 9.000 €, Reserve 10 % des Einkaufsvolumens.", "tip": "Einkaufsvolumen = Wareneinsatz + Endbestand − Anfangsbestand.", "items": [{"t": "calc", "id": "a5.1", "q": "Berechne das freie Limit.", "a": 41400, "unit": "€", "tol": 1, "steps": ["Einkaufsvolumen = 60.000 + 18.000 − 22.000 = 56.000 €", "Reserve 10 % = 5.600 €", "freies Limit = 56.000 − 9.000 − 5.600 = 41.400 €"]}, {"t": "free", "id": "a5.2", "q": "5.2 Begründe, warum ein Warenwirtschaftssystem bei der automatischen Bestellmengenermittlung die Lagerkosten senken kann.", "model": "Es rechnet aus Absatz, Bestand und Kosten die Menge aus, bei der Bestell- und Lagerkosten zusammen am kleinsten sind. So wird nicht „auf Vorrat“ zu viel bestellt; Lagerbestand und Kapitalbindung sinken."}]}]};
var TR={"title": ["Lập kế hoạch nhu cầu và số lượng", "", "", "", "", "", "تخطيط الحاجة والكمية", "İhtiyacı ve miktarı planlamak"], "can.0": ["kể bốn câu hỏi của kế hoạch mua hàng (Cái gì? Bao nhiêu? Khi nào? Ở đâu và giá bao nhiêu?).", "", "", "", "", "", "ذكر الأسئلة الأربعة لتخطيط الشراء (ماذا؟ كم؟ متى؟ أين وبأي سعر؟).", "tedarik planlamasının dört sorusunu söylemek (Ne? Ne kadar? Ne zaman? Nereden ve hangi fiyata?)."], "can.1": ["nói được doanh nghiệp lấy thông tin để xác định nhu cầu từ đâu (bên trong và bên ngoài).", "", "", "", "", "", "أن أقول من أين تحصل الشركة على معلومات لتحديد الحاجة (داخلياً وخارجياً).", "bir işletmenin ihtiyaç belirleme için bilgileri nereden aldığını söylemek (iç ve dış)."], "can.2": ["đọc bảng thống kê lượng bán và từ đó đưa ra quyết định mua hàng.", "", "", "", "", "", "قراءة إحصائية المبيعات واستنتاج قرار للشراء منها.", "bir satış istatistiğini okumak ve ondan satın alma için bir karar çıkarmak."], "can.3": ["giải thích ưu và nhược điểm của lượng đặt hàng lớn và nhỏ (chỗ trong kho, vốn bị giữ lại, chi phí đặt hàng).", "", "", "", "", "", "شرح مزايا وعيوب كميات الطلب الكبيرة والصغيرة (مساحة التخزين، تجميد رأس المال، تكاليف الطلب).", "büyük ve küçük sipariş miktarlarının avantaj ve dezavantajlarını açıklamak (depo yeri, sermaye bağlama, sipariş maliyetleri)."], "can.4": ["dùng quy tắc tam suất để tính lượng hàng tồn đủ dùng bao lâu.", "", "", "", "", "", "حساب المدة التي يكفي فيها المخزون باستخدام القاعدة الثلاثية.", "orantı (üçlü kural) ile bir stokun ne kadar süre yettiğini hesaplamak."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Hãy nhớ lại LF 1 (hình thức bán hàng, doanh thu) và LF 4 (cách bày hàng).", "", "", "", "", "", "فكّر في LF 1 (أشكال البيع، الإيرادات) وفي LF 4 (عرض البضائع).", "LF 1’i (satış biçimleri, ciro) ve LF 4’ü (yerleştirme) düşün."], "a1.1.q": ["Lượng bán (Absatz) là gì?", "", "", "", "", "", "ما هي كمية المبيعات (Absatz)؟", "Satış miktarı (Absatz) nedir?"], "a1.1.e": ["Lượng bán = số lượng đã bán (cái); doanh thu = số lượng đã bán × giá (€).", "", "", "", "", "", "كمية المبيعات = الكمية المبيعة (قطعة)؛ الإيرادات = الكمية المبيعة × السعر (€).", "Satış miktarı = satılan miktar (adet); ciro = satılan miktar × fiyat (€)."], "a1.1.o0": ["số lượng đã bán (cái)", "", "", "", "", "", "الكمية المبيعة (قطعة)", "satılan miktar (adet)"], "a1.1.o1": ["số lượng đã bán × giá (€)", "", "", "", "", "", "الكمية المبيعة × السعر (€)", "satılan miktar × fiyat (€)"], "a1.1.o2": ["lợi nhuận sau khi trừ chi phí", "", "", "", "", "", "الربح بعد خصم التكاليف", "maliyetler düşüldükten sonra kâr"], "a1.2.q": ["Nguyên tắc tối thiểu nói gì?", "", "", "", "", "", "ماذا يعني مبدأ الحد الأدنى؟", "Minimum ilkesi ne anlama gelir?"], "a1.2.o0": ["đạt một mục tiêu nhất định với ít phương tiện nhất có thể", "", "", "", "", "", "تحقيق هدف معيّن بأقل وسائل ممكنة", "belirli bir hedefe mümkün olan en az araçla ulaşmak"], "a1.2.o1": ["đạt được càng nhiều càng tốt với phương tiện có sẵn", "", "", "", "", "", "تحقيق أكبر قدر ممكن بالوسائل المتاحة", "eldeki araçlarla mümkün olduğunca çok şey elde etmek"], "a1.2.o2": ["bán càng ít càng tốt", "", "", "", "", "", "بيع أقل قدر ممكن", "mümkün olduğunca az satmak"], "a1.3.q": ["Hàng theo mùa là gì? Nêu một ví dụ.", "", "", "", "", "", "ما هو المنتج الموسمي؟ اذكر مثالاً.", "Mevsimlik ürün nedir? Bir örnek ver."], "a1.4.q": ["Kể hai mặt hàng phù hợp để bày cạnh nhau.", "", "", "", "", "", "اذكر بضاعتين تصلحان للعرض المشترك.", "Birlikte yerleştirmeye uygun iki mal söyle."], "r1.h": ["Đọc thêm: Lập kế hoạch mua hàng", "", "", "", "", "", "للقراءة: تخطيط الشراء", "Okuma: Tedariki planlamak"], "r1.s": ["Trước mỗi lần đặt hàng: Cái gì? Bao nhiêu? Khi nào? Ở đâu và giá bao nhiêu?", "", "", "", "", "", "قبل كل طلب: ماذا؟ كم؟ متى؟ من أين وبأي سعر؟", "Her siparişten önce: Ne? Ne kadar? Ne zaman? Nereden ve hangi fiyata?"], "r1.p0": ["Nhu cầu được xác định bằng nguồn bên trong (dữ liệu bán hàng, thống kê lượng bán, tồn kho, mong muốn của khách) và nguồn bên ngoài (báo cáo thị trường, hội chợ, xu hướng, đối thủ).", "", "", "", "", "", "تُحدَّد الحاجة بمصادر داخلية (بيانات المبيعات، إحصائية المبيعات، المخزون، رغبات الزبائن) وبمصادر خارجية (تقارير السوق، المعارض، الاتجاهات، المنافسون).", "İhtiyaç iç kaynaklarla (satış verileri, satış istatistiği, stok, müşteri istekleri) ve dış kaynaklarla (pazar raporları, fuarlar, trendler, rakipler) belirlenir."], "r1.p1": ["Lượng đặt hàng lớn mang lại giảm giá theo số lượng và chi phí đặt hàng thấp, nhưng nhiều vốn bị giữ lại, chi phí lưu kho cao và rủi ro lưu kho.", "", "", "", "", "", "كمية الطلب الكبيرة تجلب خصم الكمية وتكاليف طلب منخفضة، لكنها تسبب تجميداً كبيراً لرأس المال وتكاليف تخزين عالية ومخاطر تخزين.", "Büyük bir sipariş miktarı miktar indirimi ve düşük sipariş maliyeti getirir, ama çok sermaye bağlama, yüksek depolama maliyeti ve depolama riski de getirir."], "r1.p2": ["Lượng đặt hàng tối ưu là lượng mà tại đó tổng chi phí đặt hàng và chi phí lưu kho thấp nhất.", "", "", "", "", "", "كمية الطلب المثلى هي الكمية التي يكون عندها مجموع تكاليف الطلب وتكاليف التخزين في أدنى مستوى.", "Optimum sipariş miktarı, sipariş ve depolama maliyetlerinin toplamının en düşük olduğu miktardır."], "r1.qq": ["Đâu là nguồn bên ngoài để xác định nhu cầu?", "", "", "", "", "", "ما هو المصدر الخارجي لتحديد الحاجة؟", "İhtiyaç belirleme için dış kaynak hangisidir?"], "r1.q.o0": ["báo cáo thị trường, tạp chí chuyên ngành", "", "", "", "", "", "تقارير السوق، المجلات المتخصصة", "pazar raporları, mesleki dergiler"], "r1.q.o1": ["thống kê lượng bán năm trước", "", "", "", "", "", "إحصائية مبيعات السنة الماضية", "geçen yılın satış istatistiği"], "r1.q.o2": ["lượng hàng tồn kho", "", "", "", "", "", "المخزون", "stok durumu"], "a2.h": ["Phân tích bảng thống kê lượng bán", "", "", "", "", "", "تحليل إحصائية المبيعات", "Bir satış istatistiğini değerlendirmek"], "a2.i": ["Trước lần đặt hàng tiếp theo, học viên Deniz phân tích số lượng bán (số cái mỗi quý):", "", "", "", "", "", "قبل الطلب القادم يحلل المتدرب Deniz أرقام المبيعات (قطعة لكل ربع سنة):", "Bir sonraki siparişten önce stajyer Deniz satış rakamlarını değerlendiriyor (çeyrek başına adet):"], "a2.t": ["Trước hết xem tổng, sau đó từng dòng, rồi mới quyết định – và chỉ so sánh các khoảng thời gian giống nhau.", "", "", "", "", "", "أولاً المجموع، ثم كل سطر، ثم اتخذ القرار – وقارن فقط الفترات المتشابهة.", "Önce toplam, sonra her satır, sonra karar – ve sadece aynı dönemleri karşılaştır."], "a2.1.q": ["Đúng hay sai?", "", "", "", "", "", "صحيح أم خطأ؟", "Doğru mu yanlış mı?"], "a2.1.r0": ["Tổng gần như không đổi (295 → 303).", "", "", "", "", "", "يبقى المجموع تقريباً كما هو (295 ← 303).", "Toplam neredeyse aynı kalıyor (295 → 303)."], "a2.1.r1": ["Sự dịch chuyển nằm ở các dòng, không phải ở tổng.", "", "", "", "", "", "التحول موجود في الأسطر، وليس في المجموع.", "Kayma satırlarda, toplamda değil."], "a2.1.r2": ["Nhóm giá thấp tăng.", "", "", "", "", "", "الفئة السعرية الدنيا ترتفع.", "Alt fiyat grubu artıyor."], "a2.1.r3": ["Được phép so sánh Q1 với Q4.", "", "", "", "", "", "يجوز مقارنة Q1 مع Q4.", "Ç1, Ç4 ile karşılaştırılabilir."], "a2.2.q": ["Quyết định nào đúng?", "", "", "", "", "", "ما القرار الصحيح؟", "Hangi karar doğru?"], "a2.2.e": ["Mua hàng theo nhu cầu: khách hàng hỏi mua cốc chất lượng cao hơn.", "", "", "", "", "", "الشراء حسب الحاجة: الزبائن يطلبون أكواباً أعلى جودة.", "İhtiyaca göre satın almak: Müşteriler daha kaliteli bardaklar istiyor."], "a2.2.o0": ["nhiều cốc nhóm cao hơn, ít cốc nhóm thấp hơn, nhóm trung bình giữ nguyên.", "", "", "", "", "", "المزيد من أكواب الفئة العليا، أقل من الدنيا، المتوسطة كما هي.", "üst gruptan daha çok bardak, alt gruptan daha az, orta grup aynı."], "a2.2.o1": ["đặt tổng cộng nhiều cốc hơn hẳn", "", "", "", "", "", "طلب أكواب أكثر بكثير إجمالاً", "toplamda çok daha fazla bardak sipariş etmek"], "a2.2.o2": ["chỉ đặt cốc nhóm thấp", "", "", "", "", "", "طلب أكواب الفئة الدنيا فقط", "sadece alt gruptan bardak sipariş etmek"], "a3.h": ["Chào giá đặc biệt 500 thùng", "", "", "", "", "", "العرض الخاص لـ 500 كرتونة", "500 kolilik özel teklif"], "a3.i": ["Một nhà cung cấp chào bán 500 thùng với giá đặc biệt (rẻ hơn 30 %).", "", "", "", "", "", "يعرض أحد الموردين 500 كرتونة بسعر خاص (أرخص بنسبة 30 %).", "Bir tedarikçi 500 koliyi özel fiyatla sunuyor (%30 daha ucuz)."], "a3.t": ["Hãy nghĩ đến chỗ trong kho, tiền và rủi ro.", "", "", "", "", "", "فكّر في المساحة في المخزن، والمال، والمخاطر.", "Depodaki yeri, parayı ve riski düşün."], "a3.1.q": ["Điền vào chỗ trống.", "", "", "", "", "", "أكمل الفراغات.", "Boşlukları doldur."], "a3.1.g": ["Giá mỗi cái thấp hơn (giảm giá theo số lượng). Chúng ta ít phải đặt hàng hơn. Sức chứa của kho có thể không đủ. Vốn bị giữ lại nhiều. Rủi ro lưu kho.", "", "", "", "", "", "سعر القطعة أقل (خصم الكمية). علينا أن نطلب بشكل أقل. قد لا تكفي سعة المخزن. تجميد كبير لرأس المال. مخاطر التخزين.", "Birim fiyat daha düşük (miktar indirimi). Daha seyrek sipariş vermemiz gerekir. Depo kapasitesi belki yetmez. Yüksek sermaye bağlama. Depolama riski."], "a3.2.q": ["Việc nhận chào giá đặc biệt có thể dẫn đến hậu quả nào?", "", "", "", "", "", "ما النتيجة التي يمكن أن تنتج عن قبول العرض الخاص؟", "Özel teklifin kabul edilmesi hangi sonucu doğurabilir?"], "a3.2.o0": ["Mức tồn kho tối thiểu có thể được hạ xuống.", "", "", "", "", "", "يمكن تخفيض الحد الأدنى للمخزون.", "Minimum stok düşürülebilir."], "a3.2.o1": ["Sức chứa của kho không đủ.", "", "", "", "", "", "سعة المخزن لا تكفي.", "Depo kapasitesi yetmez."], "a3.2.o2": ["Vốn bị giữ lại giảm.", "", "", "", "", "", "ينخفض تجميد رأس المال.", "Sermaye bağlama azalır."], "a3.2.o3": ["Thời gian lưu kho ngắn hơn.", "", "", "", "", "", "تصبح مدة التخزين أقصر.", "Depolama süresi kısalır."], "a3.2.o4": ["Phải từ chối nhận hàng.", "", "", "", "", "", "يجب رفض استلام البضاعة.", "Malın teslim alınması re    return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>'+tlo(it.id+'.g');
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p,pi){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'+tlo(b.id+'.p'+pi)}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});

function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';

 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';

 document.getElementById('app').innerHTML=h;

function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');

 }

function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});

document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});

/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;

if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
