<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}

#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}

.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}

.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}

input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}

.q{margin:.8rem 0 .2rem;font-weight:600}

.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}

 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>

len und zur Abholung bereitstellen."], "q": {"q": "Wozu dient der Eigentumsvorbehalt?", "o": ["Er sichert die Kaufpreisforderung des Verkäufers.", "Er senkt den Preis.", "Er verkürzt die Lieferzeit."], "a": 0}}, {"k": "task", "id": "a2", "n": "Aufgabe 2", "h": "Welche Kaufart passt?", "intro": "Einkäuferin Frau Jansen erklärt Azubi Tom vier Vereinbarungen aus dieser Woche:", "tip": "Signalwörter suchen: „fix“ → Fixkauf · „abrufen“, „lagert beim Lieferer“ → Kauf auf Abruf · „später bestimmen“ → Spezifikationskauf · „ausprobieren und zurückgeben“ → Kauf auf Probe.", "items": [{"t": "sel", "id": "a2.1", "q": "Welche Kaufart?", "o": ["Fixkauf", "Kauf auf Abruf", "Spezifikationskauf", "Kauf auf Probe"], "rows": [["„Die Adventskränze müssen am 20.11. fix bei uns sein.“", 0], ["„Wir kaufen 1.000 Geschenkkartons, der Lieferer lagert sie, wir rufen jeweils 100 ab.“", 1], ["„200 Pullover jetzt bestellt – die Farben sagen wir bis Ende August.“", 2], ["„Die neue Kaffeemaschine dürfen wir zwei Wochen testen und dann zurückgeben.“", 3]]}]}, {"k": "task", "id": "a3", "n": "Aufgabe 3", "h": "Kaufarten zuordnen", "intro": "Trage die Kennziffer ein: 1 Kauf auf Probe · 2 Kauf auf Abruf · 3 Terminkauf · 4 Fixkauf · 5 Spezifikationskauf.", "tip": "Entscheidend ist, in welcher Rolle jemand kauft: Eine Kauffrau im Einzelhandel, die privat einen Fernseher kauft, ist Verbraucherin.", "items": [{"t": "sel", "id": "a3.1", "q": "Kennziffer?", "o": ["1", "2", "3", "4", "5"], "rows": [["Die Nordstadt-Kauf GmbH bestellt 50 Pullover. Erst nachträglich werden die gewünschten Farben mitgeteilt.", 4], ["Die Nordstadt-Kauf GmbH kauft einen großen Warenposten, den sie beim Lieferer lagert und je nach Bedarf zustellen lässt.", 1], ["Ein Kunde erhält eine Stereoanlage für zwei Wochen zum Ausprobieren. Dann entscheidet er, ob er sie behält.", 0], ["Die Osterhasen sollen „am 15. März fix“ geliefert werden.", 3], ["Lieferung „innerhalb der 12. Kalenderwoche“", 2]]}, {"t": "mc", "id": "a3.2", "q": "3.1 Frau Miller (Kauffrau im Einzelhandel) kauft privat im Warenhaus einen Fernseher. Welche Kaufart nach Vertragspartnern liegt vor? Begründe.", "o": ["Verbrauchsgüterkauf = einseitiger Handelskauf", "zweiseitiger Handelskauf", "bürgerlicher Kauf"], "a": 0, "ex": "Entscheidend ist, in welcher Rolle jemand kauft: Eine Kauffrau im Einzelhandel, die privat einen Fernseher kauft, ist Verbraucherin."}]}, {"k": "task", "id": "a4", "n": "Aufgabe 4", "h": "Kaufarten und Sonderfälle im Prüfungsformat", "intro": "Löse die Aufgaben. Die letzte kommt aus Modul 9.", "tip": "Schweigen ist keine Annahme.", "items": [{"t": "mc", "id": "a4.1", "q": "4.1 Im Kaufvertrag wird ein „Kauf auf Abruf“ vereinbart. Was beinhaltet das?", "o": ["Die gekauften Kaffee-Vollautomaten werden je nach Bedarf in Teilmengen abgerufen.", "Der Kaufvertrag wird rechtskräftig, wenn die Geräte geliefert wurden.", "Nur die Warenart steht fest, das Modell wird später bestimmt.", "Der Lieferer muss sofort nach Vertragsschluss liefern.", "Nicht verkaufte Geräte können zurückgegeben werden."], "a": 0}, {"t": "mc", "id": "a4.2", "q": "4.2 Welcher Sachverhalt trifft für den Kauf auf Probe zu?", "o": ["Der Käufer legt fest, wann Teilmengen geliefert werden.", "Kauf auf Probe ist ein Fernabsatzvertrag.", "Der Verkäufer muss genau nach Muster liefern.", "Der Käufer kann die Ware innerhalb einer vereinbarten Frist zurückgeben.", "Der Verkäufer trägt das Risiko der Verschlechterung."], "a": 3}, {"t": "mc", "id": "a4.3", "q": "4.3 Ein Großhändler schickt 200 Vasen, die niemand bestellt hat. Wie verhalten Sie sich richtig?", "o": ["Sie nehmen die Vasen an, weil langjährige Geschäftsbeziehungen bestehen.", "Sie verlangen vom Fahrer eine Bestätigung.", "Sie behalten die Vasen und bezahlen sie nicht.", "Sie teilen mit, dass Sie die Vasen nicht benötigen, und stellen sie zur Abholung bereit.", "Sie drohen eine Vertragsstrafe an."], "a": 3}, {"t": "free", "id": "a4.4", "q": "4.4 Ein Lieferer liefert unter Eigentumsvorbehalt. Welche Absicht verfolgt er damit?", "model": "Er sichert seine Kaufpreisforderung: Bis zur vollständigen Bezahlung bleibt er Eigentümer und kann die Ware zurückverlangen."}, {"t": "calc", "id": "a4.5", "q": "4.5 Alt (Modul 9): A: 4,20 € je Stück, 10 % Rabatt, 2 % Skonto, Fracht 18,00 €. Bezugspreis für 200 Stück?", "a": 758.88, "unit": "€", "steps": ["840,00 − 84,00 = 756,00", "− 15,12 = 740,88", "+ 18,00 = 758,88 €"]}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Paragrafen zu Fixkauf und unbestellter Ware", "intro": "Beim Fixkauf wird der Liefertermin besonders überwacht: Kommt die Ware zu spät, kann der Käufer ohne Nachfrist vom Vertrag zurücktreten – sie nützt ihm ja nichts mehr.", "tip": "Verbraucher und Kaufleute werden verschieden behandelt.", "items": [{"t": "free", "id": "a5.1", "q": "5.1 Die Adventskränze (Fixkauf zum 20.11.) kommen am 23.11. Welche Rechte hat die Nordstadt-Kauf GmbH? Nenne § 376 HGB bzw. § 323 Abs. 2 BGB.", "model": "Beim Fixhandelskauf kann der Käufer ohne Nachfrist vom Vertrag zurücktreten (§ 376 HGB, § 323 Abs. 2 Nr. 2 BGB); bei Verschulden auch Schadensersatz statt der Leistung. Will er doch erfüllt haben, muss er das sofort anzeigen."}, {"t": "free", "id": "a5.2", "q": "5.2 Unterscheide § 241a BGB und die Regel unter Kaufleuten bei unbestellter Ware.", "model": "§ 241a BGB: Ein Verbraucher muss unbestellte Ware weder bezahlen noch zurückschicken noch aufbewahren. Unter Kaufleuten bleibt Schweigen grundsätzlich keine Annahme; die Ware muss aber auf Kosten des Absenders aufbewahrt und zur Abholung bereitgestellt werden."}, {"t": "free", "id": "a5.3", "q": "5.3 ○ Stückkauf und Gattungskauf: Erkläre den Unterschied an einem Beispiel.", "model": "Stückkauf: eine bestimmte, einmalige Sache (das ausgestellte Vorführsofa). Gattungskauf: Ware nach Merkmalen bestimmt, austauschbar (50 Packungen Kaffee Sorte X). Wichtig bei Untergang/Mängeln: Gattungsware kann ersetzt werden."}]}]};
var TR={"title": ["Các loại mua bán và trường hợp đặc biệt", "", "", "", "", "", "أنواع الشراء والحالات الخاصة", "Satış türleri ve özel durumlar"], "can.0": ["nhận biết qua ví dụ mua hàng hạn cố định, mua hàng có kỳ hạn, mua theo yêu cầu gọi hàng và mua xác định sau.", "", "", "", "", "", "التعرف على الشراء بموعد ثابت والشراء لأجل والشراء عند الطلب وشراء التحديد اللاحق من خلال أمثلة.", "kesin vadeli satış, vadeli satış, çağrıya bağlı satış ve belirleme satışını örneklerle tanımak."], "can.1": ["phân biệt mua dùng thử, mua theo mẫu và mua để thử.", "", "", "", "", "", "التمييز بين الشراء على سبيل التجربة، والشراء حسب العيّنة، والشراء للتجربة.", "deneme şartlı satış, numuneye göre satış ve deneme amaçlı satışı ayırt etmek."], "can.2": ["xác định mua bán hàng tiêu dùng, mua bán thương mại hai bên và mua bán dân sự theo các bên ký hợp đồng.", "", "", "", "", "", "تحديد شراء السلع الاستهلاكية والشراء التجاري الثنائي والشراء المدني حسب أطراف العقد.", "tüketici satışı, iki taraflı ticari satış ve medeni satışı sözleşme taraflarına göre belirlemek."], "can.3": ["giải thích bảo lưu quyền sở hữu dùng để làm gì.", "", "", "", "", "", "شرح الغرض من الاحتفاظ بالملكية.", "mülkiyeti muhafaza kaydının ne işe yaradığını açıklamak."], "can.4": ["xử lý đúng khi nhận hàng không đặt, và giải thích tại sao phải theo dõi hạn cố định.", "", "", "", "", "", "التصرف بشكل صحيح عند توريد بضاعة غير مطلوبة، وتعليل لماذا يُراقب الموعد الثابت.", "sipariş edilmemiş mal teslim edildiğinde doğru davranmak ve kesin bir tarihin neden takip edildiğini gerekçelendirmek."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Nếu chào giá không ràng buộc thì đơn đặt hàng là đề nghị và xác nhận đơn hàng là chấp nhận.", "", "", "", "", "", "إذا كان العرض غير مُلزم، يكون الطلب هو الإيجاب وتأكيد الطلبية هو القبول.", "Teklif bağlayıcı değilse sipariş icap, sipariş onayı kabuldür."], "a1.1.q": ["1.1 Đặt hàng theo một chào giá không ràng buộc: đề nghị hay chấp nhận? (Mô-đun 11)", "", "", "", "", "", "1.1 طلب بناءً على عرض غير مُلزم: إيجاب أم قبول؟ (الوحدة 11)", "1.1 Bağlayıcı olmayan bir teklife sipariş: icap mı kabul mü? (Modül 11)"], "a1.1.o0": ["đề nghị", "", "", "", "", "", "إيجاب", "icap"], "a1.1.o1": ["chấp nhận", "", "", "", "", "", "قبول", "kabul"], "a1.2.q": ["1.4 Sự khác nhau giữa doanh thu (Umsatz) và lượng bán (Absatz) là gì? (Ngân hàng câu hỏi · LF 1)", "", "", "", "", "", "1.4 ما الفرق بين الإيرادات (Umsatz) وكمية المبيعات (Absatz)؟ (بنك الأسئلة · LF 1)", "1.4 Ciro (Umsatz) ile satış miktarı (Absatz) arasındaki fark nedir? (Havuz · LF 1)"], "a1.2.o0": ["Lượng bán = số lượng đã bán (cái); doanh thu = số lượng đã bán × giá (€).", "", "", "", "", "", "كمية المبيعات = الكمية المبيعة (قطعة)؛ الإيرادات = الكمية المبيعة × السعر (€).", "Satış miktarı = satılan miktar (adet); ciro = satılan miktar × fiyat (€)."], "a1.2.o1": ["Doanh thu = số lượng đã bán (cái); lượng bán = số lượng × giá (€).", "", "", "", "", "", "الإيرادات = الكمية المبيعة (قطعة)؛ كمية المبيعات = الكمية × السعر (€).", "Ciro = satılan miktar (adet); satış miktarı = miktar × fiyat (€)."], "a1.3.q": ["1.2 Kể nghĩa vụ của người mua theo hợp đồng mua bán. (Mô-đun 11)", "", "", "", "", "", "1.2 اذكر واجبات المشتري من عقد الشراء. (الوحدة 11)", "1.2 Satış sözleşmesinden doğan alıcı yükümlülüklerini söyle. (Modül 11)"], "r1.h": ["Đọc thêm: Các loại mua bán (Sách giáo khoa tr. 46–50)", "", "", "", "", "", "للقراءة: أنواع الشراء (الكتاب ص 46–50)", "Okuma: Satış türleri (Ders kitabı s. 46–50)"], "r1.s": ["Tìm từ tín hiệu: „cố định“ → mua hạn cố định · „gọi hàng“, „để ở kho nhà cung cấp“ → mua theo yêu cầu gọi hàng · „xác định sau“ → mua xác định sau · „dùng thử và trả lại“ → mua dùng thử.", "", "", "", "", "", "ابحث عن الكلمات الدالة: „ثابت“ ← شراء بموعد ثابت · „استدعاء“، „يخزّن لدى المورد“ ← شراء عند الطلب · „تحديد لاحقاً“ ← شراء التحديد اللاحق · „تجربة وإرجاع“ ← شراء على سبيل التجربة.", "İpucu kelimeleri ara: „kesin“ → kesin vadeli satış · „çağırmak“, „tedarikçide depolanır“ → çağrıya bağlı satış · „sonra belirlemek“ → belirleme satışı · „denemek ve iade etmek“ → deneme şartlı satış."], "r1.p0": ["Với mua hạn cố định, hàng vô giá trị sau ngày hẹn. Với mua theo yêu cầu gọi hàng, nhà cung cấp giữ hàng trong kho.", "", "", "", "", "", "في الشراء بموعد ثابت تصبح البضاعة بلا قيمة بعد الموعد. في الشراء عند الطلب يخزّن المورد البضاعة.", "Kesin vadeli satışta mal tarihten sonra değersizdir. Çağrıya bağlı satışta malı tedarikçi depolar."], "r1.p1": ["Doanh nhân bán cho cá nhân = mua bán hàng tiêu dùng. Thương nhân với thương nhân = mua bán thương mại hai bên.", "", "", "", "", "", "صاحب مشروع يبيع لشخص عادي = شراء السلع الاستهلاكية. تاجر لتاجر = شراء تجاري ثنائي.", "Girişimci özel kişiye satar = tüketici satışı. Tacir tacire = iki taraflı ticari satış."], "r1.p2": ["Hàng không đặt: im lặng không phải là chấp nhận. Thông báo và để sẵn cho họ đến lấy.", "", "", "", "", "", "البضاعة غير المطلوبة: السكوت ليس قبولاً. أبلغ وجهّزها للاستلام.", "Sipariş edilmemiş mal: Susmak kabul değildir. Bildir ve teslim alınmak üzere hazır tut."], "r1.qq": ["Bảo lưu quyền sở hữu dùng để làm gì?", "", "", "", "", "", "ما فائدة الاحتفاظ بالملكية؟", "Mülkiyeti muhafaza kaydı ne işe yarar?"], "r1.q.o0": ["Nó bảo đảm khoản tiền bán hàng của người bán.", "", "", "", "", "", "يضمن حق البائع في ثمن الشراء.", "Satıcının satış bedeli alacağını güvenceye alır."], "r1.q.o1": ["Nó làm giảm giá.", "", "", "", "", "", "يخفض السعر.", "Fiyatı düşürür."], "r1.q.o2": ["Nó rút ngắn thời gian giao hàng.", "", "", "", "", "", "يقصّر مدة التوريد.", "Teslim süresini kısaltır."], "a2.h": ["Loại mua bán nào phù hợp?", "", "", "", "", "", "أي نوع شراء يناسب؟", "Hangi satış türü uyuyor?"], "a2.i": ["Nhân viên mua hàng bà Jansen giải thích cho học viên Tom bốn thỏa thuận trong tuần này:", "", "", "", "", "", "موظفة الشراء السيدة Jansen تشرح للمتدرب Tom أربعة اتفاقات من هذا الأسبوع:", "Satın almacı Bayan Jansen stajyer Tom'a bu haftaki dört anlaşmayı açıklıyor:"], "a2.t": ["Tìm từ tín hiệu: „cố định“ → mua hạn cố định · „gọi hàng“, „để ở kho nhà cung cấp“ → mua theo yêu cầu gọi hàng · „xác định sau“ → mua xác định sau · „dùng thử và trả lại“ → mua dùng thử.", "", "", "", "", "", "ابحث عن الكلمات الدالة: „ثابت“ ← شراء بموعد ثابت · „استدعاء“، „يخزّن لدى المورد“ ← شراء عند الطلب · „تحديد لاحقاً“ ← شراء التحديد اللاحق · „تجربة وإرجاع“ ← شراء على سبيل التجربة.", "İpucu kelimeleri ara: „kesin“ → kesin vadeli satış · „çağırmak“, „tedarikçide depolanır“ → çağrıya bağlı satış · „sonra belirlemek“ → belirleme satışı · „denemek ve iade etmek“ → deneme şartlı satış."], "a2.1.q": ["Loại mua bán nào?", "", "", "", "", "", "أي نوع شراء؟", "Hangi satış türü?"], "a2.1.r0": ["„Vòng hoa Mùa Vọng phải có mặt chỗ chúng ta đúng ngày 20.11.“", "", "", "", "", "", "„يجب أن تصل أكاليل المجيء عندنا في 20.11. بشكل ثابت.“", "„Advent çelenkleri 20.11.'de kesin olarak bizde olmalı.“"], "a2.1.r1": ["„Chúng ta mua 1.000 hộp quà, nhà cung cấp giữ trong kho, mỗi lần chúng ta gọi lấy 100.“", "", "", "", "", "", "„نشتري 1.000 علبة هدايا، المورد يخزّنها، ونستدعي كل مرة 100.“", "„1.000 hediye kutusu alıyoruz, tedarikçi depoluyor, her seferinde 100 tane çağırıyoruz.“"], "a2.1.r2": ["„Đặt 200 áo len bây giờ – màu sắc chúng ta báo trước cuối tháng 8.“", "", "", "", "", "", "„طلبنا الآن 200 كنزة – سنحدد الألوان حتى نهاية أغسطس.“", "„200 kazak şimdi sipariş edildi – renkleri ağustos sonuna kadar söyleyeceğiz.“"], "a2.1.r3": ["„Chúng ta được dùng thử máy pha cà phê mới hai tuần rồi trả lại.“", "", "", "", "", "", "„يمكننا تجربة آلة القهوة الجديدة أسبوعين ثم إرجاعها.“", "„Yeni kahve makinesini iki hafta deneyip sonra iade edebiliriz.“"], "a3.h": ["Ghép các loại mua bán", "", "", "", "", "", "تصنيف أنواع الشراء", "Satış türlerini eşleştirmek"], "a3.i": ["Điền số ký hiệu: 1 mua dùng thử · 2 mua theo yêu cầu gọi hàng · 3 mua có kỳ hạn · 4 mua hạn cố định · 5 mua xác định sau.", "", "", "", "", "", "اكتب الرقم الدال: 1 شراء على سبيل التجربة · 2 شراء عند الطلب · 3 شراء لأجل · 4 شراء بموعد ثابت · 5 شراء التحديد اللاحق.", "Kod numarasını yaz: 1 deneme şartlı satış · 2 çağrıya bağlı satış · 3 vadeli satış · 4 kesin vadeli satış · 5 belirleme satışı."], "a3.t": ["Điều quyết định là người đó mua với vai trò nào: một nhân viên bán lẻ mua tivi cho riêng mình là người tiêu dùng.", "", "", "", "", "", "الحاسم هو الدور الذي يشتري به الشخص: موظفة تجارة تجزئة تشتري تلفازاً لنفسها هي مستهلكة.", "Belirleyici olan kişinin hangi rolde satın aldığıdır: Özel olarak televizyon alan bir perakende tacir kadın tüketicidir."], "a3.1.q": ["Số ký hiệu?", "", "", "", "", "", "الرقم الدال؟", "Kod numarası?"], "a3.1.r0": ["Công ty Nordstadt-Kauf GmbH đặt 50 áo len. Màu sắc mong muốn được thông báo sau.", "", "", "", "", "", "تطلب شركة Nordstadt-Kauf GmbH ‏50 كنزة. ولاحقاً فقط تُبلَّغ الألوان المطلوبة.", "Nordstadt-Kauf GmbH 50 kazak sipariş ediyor. İstenen renkler ancak sonradan bildiriliyor."], "a3.1.r1": ["Công ty Nordstadt-Kauf GmbH mua một lô hàng lớn, để ở kho nhà cung cấp và cho giao theo nhu cầu.", "", "", "", "", "", "تشتري شركة Nordstadt-Kauf GmbH دفعة كبيرة من البضائع تخزّنها لدى المورد وتطلب توصيلها حسب الحاجة.", "Nordstadt-Kauf GmbH büyük bir mal partisi alıyor, tedarikçide depoluyor ve ihtiyaca göre teslim ettiriyor."], "a3.1.r2": ["Một khách hàng nhận dàn âm thanh để dùng thử hai tuần. Sau đó họ quyết định có giữ lại không.", "", "", "", "", "", "يحصل زبون على جهاز ستيريو لمدة أسبوعين للتجربة. ثم يقرر إن كان سيحتفظ به.", "Bir müşteri bir müzik setini iki hafta denemek için alıyor. Sonra saklayıp saklamayacağına karar veriyor."], "a3.1.r3": ["Thỏ Phục Sinh phải được giao „cố định ngày 15 tháng 3“.", "", "", "", "", "", "يجب توريد أرانب عيد الفصح „في 15 مارس بشكل ثابت“.", "Paskalya tavşanları „15 Mart'ta kesin“ teslim edilmeli."], "a3.1.r4": ["Giao hàng „trong tuần lịch thứ 12“", "", "", "", "", "", "التوريد „خلال الأسبوع 12“", "Teslimat „12. takvim haftası içinde“"], "a3.2.q": ["3.1 Bà Miller (nhân viên bán lẻ) mua riêng một chiếc tivi ở trung tâm thương mại. Đây là loại mua bán nào theo các bên ký hợp đồng? Giải thích.", "", "", "", "", "", "3.1 السيدة Miller (موظفة تجارة تجزئة) تشتري تلفازاً لنفسها في متجر كبير. أي نوع شراء حسب أطراف العقد هذا؟ علّل.", "3.1 Bayan Miller (perakende tacir) bir mağazadan özel olarak televizyon alıyor. Sözleşme taraflarına göre hangi satış türü söz konusu? Gerekçelendir."], "a3.2.e": ["Điều quyết định là người đó mua với vai trò nào: một nhân viên bán lẻ mua tivi cho riêng mình là người tiêu dùng.", "", "", "", "", "", "الحاسم هو الدور الذي يشتري به الشخص: موظفة تجارة تجزئة تشتري تلفازاً لنفسها هي مستهلكة.", "Belirleyici olan kişinin hangi rolde satın aldığıdır: Özel olarak televizyon alan bir perakende tacir kadın tüketicidir."], "a3.2.o0": ["mua bán hàng tiêu dùng = mua bán thương mại một bên", "", "", "", "", "", "شراء السلع الاستهلاكية = شراء تجاري أحادي الجانب", "tüketici satışı = tek taraflı ticari satış"], "a3.2.o1": ["mua bán thương mại hai bên", "", "", "", "", "", "شراء تجاري ثنائي", "iki taraflı ticari satış"], "a3.2.o2": ["mua bán dân sự", "", "", "", "", "", "شراء مدني", "medeni satış"], "a4.h": ["Các loại mua bán và trường hợp đặc biệt theo dạng đề thi", "", "", "", "", "", "أنواع الشراء والحالات الخاصة بصيغة الامتحان", "Sınav formatında satış türleri ve özel durumlar"], "a4.i": ["Giải các bài tập. Bài cuối lấy từ Mô-đun 9.", "", "", "", "", "", "حل المهام. الأخيرة من الوحدة 9.", "Görevleri çöz. Sonuncusu Modül 9'dan."], "a4.t": ["Im lặng không phải là chấp nhận.", "", "", "", "", "", "السكوت ليس قبولاً.", "Susmak kabul değildir."], "a4.1.q": ["4.1 Trong hợp đồng mua bán thỏa thuận „mua theo yêu cầu gọi hàng“. Điều đó bao gồm gì?", "", "", "", "", "", "4.1 في عقد الشراء يُتفق على „شراء عند الطلب“. ماذا يتضمن ذلك؟", "4.1 Satış sözleşmesinde „çağrıya bağlı satış“ kararlaştırılıyor. Bu neyi içerir?"], "a4.1.o0": ["Các máy pha cà phê tự động đã mua được gọi giao từng phần theo nhu cầu.", "", "", "", "", "", "تُستدعى آلات القهوة الأوتوماتيكية المشتراة على دفعات حسب الحاجة.", "Satın alınan tam otomatik kahve makineleri ihtiyaca göre kısmi miktarlarda çağrılır."], "a4.1.o1": ["Hợp đồng mua bán có hiệu lực khi máy đã được giao.", "", "", "", "", "", "يصبح عقد الشراء نافذاً عندما تُورَّد الأجهزة.", "Satış sözleşmesi cihazlar teslim edildiğinde geçerli olur."], "a4.1.o2": ["Chỉ loại hàng được xác định, mẫu mã sẽ xác định sau.", "", "", "", "", "", "فقط نوع البضاعة ثابت، والموديل يُحدد لاحقاً.", "Sadece mal türü belli, model sonra belirlenir."], "a4.1.o3": ["Nhà cung cấp phải giao hàng ngay sau khi ký hợp đồng.", "", "", "", "", "", "يجب على المورد التوريد فوراً بعد إبرام العقد.", "Tedarikçi sözleşmeden hemen sonra teslim etmelidir."], "a4.1.o4": ["Có thể trả lại các máy chưa bán được.", "", "", "", "", "", "يمكن إرجاع الأجهزة غير المبيعة.", "Satılmayan cihazlar iade edilebilir."], "a4.2.q": ["4.2 Tình huống nào đúng với mua dùng thử?", "", "", "", "", "", "4.2 أي حالة تنطبق على الشراء على سبيل التجربة؟", "4.2 Deneme şartlı satış için hangi durum geçerlidir?"], "a4.2.o0": ["Người mua quyết định khi nào giao từng phần.", "", "", "", "", "", "يحدد المشتري متى تُورَّد الكميات الجزئية.", "Alıcı kısmi miktarların ne zaman teslim edileceğini belirler."], "a4.2.o1": ["Mua dùng thử là hợp đồng bán hàng từ xa.", "", "", "", "", "", "الشراء على سبيل التجربة هو عقد بيع عن بُعد.", "Deneme şartlı satış bir mesafeli satış sözleşmesidir."], "a4.2.o2": ["Người bán phải giao hàng đúng theo mẫu.", "", "", "", "", "", "يجب على البائع التوريد حسب العيّنة تماماً.", "Satıcı tam olarak numuneye göre teslim etmelidir."], "a4.2.o3": ["Người mua có thể trả lại hàng trong thời hạn đã thỏa thuận.", "", "", "", "", "", "يمكن للمشتري إرجاع البضاعة خلال مهلة متفق عليها.", "Alıcı malı kararlaştırılan süre içinde iade edebilir."], "a4.2.o4": ["Người bán chịu rủi ro hàng bị xuống cấp.", "", "", "", "", "", "يتحمل البائع خطر تدهور البضاعة.", "Bozulma riskini satıcı üstlenir."], "a4.3.q": ["4.3 Một nhà bán buôn gửi 200 chiếc bình hoa mà không ai đặt. Anh/chị xử lý đúng như thế nào?", "", "", "", "", "", "4.3 يرسل تاجر جملة 200 مزهرية لم يطلبها أحد. كيف تتصرفون بشكل صحيح؟", "4.3 Bir toptancı kimsenin sipariş etmediği 200 vazo gönderiyor. Doğru nasıl davranırsınız?"], "a4.3.o0": ["Anh/chị nhận bình hoa vì có quan hệ kinh doanh lâu năm.", "", "", "", "", "", "تقبلون المزهريات لأن هناك علاقات تجارية طويلة.", "Uzun süreli iş ilişkisi olduğu için vazoları kabul edersiniz."], "a4.3.o1": ["Anh/chị yêu cầu tài xế xác nhận.", "", "", "", "", "", "تطلبون من السائق تأكيداً.", "Şoförden bir onay istersiniz."], "a4.3.o2": ["Anh/chị giữ bình hoa và không trả tiền.", "", "", "", "", "", "تحتفظون بالمزهريات ولا تدفعون ثمنها.", "Vazoları saklar ve ödemezsiniz."], "a4.3.o3": ["Anh/chị thông báo rằng không cần bình hoa và để sẵn cho họ đến lấy.", "", "", "", "", "", "تُبلغون أنكم لا تحتاجون المزهريات، وتجهزونها للاستلام.", "Vazolara ihtiyacınız olmadığını bildirir ve teslim alınmak üzere hazır tutarsınız."], "a4.3.o4": ["Anh/chị đe dọa phạt hợp đồng.", "", "", "", "", "", "تهددون بغرامة تعاقدية.", "Sözleşme cezasıyla tehdit edersiniz."], "a4.4.q": ["4.4 Một nhà cung cấp giao hàng có bảo lưu quyền sở hữu. Họ muốn đạt được điều gì?", "", "", "", "", "", "4.4 مورد يورّد مع الاحتفاظ بالملكية. ما الهدف الذي يسعى إليه بذلك؟", "4.4 Bir tedarikçi mülkiyeti muhafaza kaydıyla teslim ediyor. Bununla ne amaçlıyor?"], "a4.5.q": ["4.5 Ôn (Mô-đun 9): A: 4,20 € mỗi cái, giảm 10 %, chiết khấu 2 %, cước 18,00 €. Giá nhập cho 200 cái?", "", "", "", "", "", "4.5 قديم (الوحدة 9): A: ‏4,20 € للقطعة، خصم 10 %، خصم دفع نقدي 2 %، الشحن 18,00 €. سعر الشراء النهائي لـ 200 قطعة؟", "4.5 Eski (Modül 9): A: tanesi 4,20 €, %10 indirim, %2 iskonto, navlun 18,00 €. 200 adet için alış maliyeti?"], "a5.h": ["Dành cho người giỏi: Điều luật về mua hạn cố định và hàng không đặt", "", "", "", "", "", "للمحترفين: المواد القانونية حول الشراء بموعد ثابت والبضاعة غير المطلوبة", "Profesyoneller için: Kesin vadeli satış ve sipariş edilmemiş mal hakkında maddeler"], "a5.i": ["Với mua hạn cố định, ngày giao hàng được theo dõi đặc biệt: nếu hàng đến trễ, người mua có thể hủy hợp đồng mà không cần gia hạn – vì hàng không còn ích lợi gì nữa.", "", "", "", "", "", "في الشراء بموعد ثابت يُراقب موعد التوريد بشكل خاص: إذا تأخرت البضاعة، يمكن للمشتري الانسحاب من العقد دون مهلة إضافية – فهي لم تعد تنفعه.", "Kesin vadeli satışta teslim tarihi özellikle takip edilir: Mal geç gelirse alıcı ek süre vermeden sözleşmeden dönebilir – mal artık ona yaramaz."], "a5.t": ["Người tiêu dùng và thương nhân được đối xử khác nhau.", "", "", "", "", "", "يُعامل المستهلكون والتجار بشكل مختلف.", "Tüketiciler ve tacirler farklı muamele görür."], "a5.1.q": ["5.1 Vòng hoa Mùa Vọng (mua hạn cố định ngày 20.11.) đến ngày 23.11. Công ty Nordstadt-Kauf GmbH có những quyền gì? Nêu § 376 HGB hoặc § 323 khoản 2 BGB.", "", "", "", "", "", "5.1 أكاليل المجيء (شراء بموعد ثابت في 20.11.) تصل في 23.11. ما حقوق شركة Nordstadt-Kauf GmbH؟ اذكر § 376 HGB أو § 323 الفقرة 2 BGB.", "5.1 Advent çelenkleri (20.11.'e kesin vadeli satış) 23.11.'de geliyor. Nordstadt-Kauf GmbH'nin hangi hakları var? HGB § 376 veya BGB § 323 f. 2'yi söyle."], "a5.2.q": ["5.2 Phân biệt § 241a BGB và quy tắc giữa các thương nhân khi có hàng không đặt.", "", "", "", "", "", "5.2 ميّز بين § 241a BGB والقاعدة بين التجار في حالة البضاعة غير المطلوبة.", "5.2 Sipariş edilmemiş malda BGB § 241a ile tacirler arasındaki kuralı ayırt et."], "a5.3.q": ["5.3 ○ Mua vật đặc định và mua vật cùng loại: giải thích sự khác nhau bằng một ví dụ.", "", "", "", "", "", "5.3 ○ شراء الشيء المعيّن وشراء الشيء المثلي: اشرح الفرق بمثال.", "5.3 ○ Parça satışı ve cins satışı: Farkı bir örnekle açıkla."]};
