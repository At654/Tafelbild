function insertImage(imgEl,crop,cap){
  try{
    const nw=imgEl.naturalWidth,nh=imgEl.naturalHeight;if(!nw||!nh)throw new Error('Bild noch nicht geladen.');
    let sx=0,sy=0,sw=nw,sh=nh;
    if(crop){const k=nw/crop.cw;sx=crop.L*k;sy=crop.T*(nh/crop.ch);sw=crop.W*k;sh=crop.H*(nh/crop.ch);}
    const m=Math.min(1,1100/sw),c=document.createElement('canvas');c.width=Math.max(8,Math.round(sw*m));c.height=Math.max(8,Math.round(sh*m));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(imgEl,sx,sy,sw,sh,0,0,c.width,c.height);
    const data=c.toDataURL('image/jpeg',0.82);
    const w=Math.round(Math.min((view.w-48)/view.z*Math.min(1,view.z),view.w-48,560));
    const b={id:uid(),x:Math.round(view.x+Math.max(8,(view.w/view.z-w)/2)),y:Math.round(view.y+40/view.z),w,fs:24,de:'',tr:{},langs:[],src:[],typed:false,img:data,ar:c.height/c.width};
    if(cap)b.cap=cap;
    layoutBlock(b);pushHistory();page().blocks.push(b);
    tool='lasso';sel={ids:new Set(),bids:new Set([b.id]),pid:page().id};
    updateBar();redraw();save();
    toast('Bild eingefügt. Verschieben: ziehen. Größe: „Bild +/−“.');
  }catch(err){toast('Bild konnte nicht eingefügt werden: '+err.message,true);}
}
document.addEventListener('paste',e=>{
  if(BOARD||document.querySelector('.mbg'))return;
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.type.startsWith('image/'));
  if(it){e.preventDefault();readImgFile(it.getAsFile()).then(openImageModal).catch(err=>toast(err.message,true));}
});
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f&&/^image\//.test(f.type)){e.preventDefault();readImgFile(f).then(openImageModal).catch(err=>toast(err.message,true));}
});

/* ================= Start ================= */
if(BOARD){pages=[{id:uid(),strokes:[],blocks:[]}];pi=0;startBoardMode();}
else{load();resumeLive();startTeacherBc();buildBar();updateBar();resize();}
window.addEventListener('beforeunload',()=>{if(BOARD)return;try{localStorage.setItem('tafel.pages',JSON.stringify({pi,pages:pages.map(serPage)}));}catch(e){}});
if(!S.key&&!BOARD)setTimeout(()=>toast('Zum Übersetzen zuerst in den Einstellungen den API-Schlüssel eintragen.'),600);
window.__tafel={get pages(){return pages;},get S(){return S;}};
})();
</script>
<script>
/* ================= Schüler-Ansicht (Handy) ================= */
(()=>{
const sp=new URLSearchParams(location.search),code=sp.get('live');
if(!code)return;
const base=(sp.get('db')||'').replace(/\/+$/,'');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('app').style.display='none';
const root=$('student');root.hidden=false;
const LN={de:'Deutsch',ar:'العربية',vi:'Tiếng Việt',tr:'Türkçe',uk:'Українська',ru:'Русский',es:'Español',pt:'Português',ti:'ትግርኛ',en:'English'};
const COL={ar:'#0f766e',vi:'#c2410c',tr:'#1d4ed8',uk:'#a16207',ru:'#0369a1',es:'#be123c',pt:'#7c3aed',ti:'#0e7490',en:'#475569',de:'#111827'};
const UI={
  de:{cards:'Karten',text:'Text',board:'Tafel',all:'Alle Sprachen',wait:'Warte auf die Lehrerin …',off:'Keine Verbindung',page:'Seite',live:'Live',empty:'Noch keine Zeilen.'},
  ar:{cards:'بطاقات',text:'النص',board:'السبورة',all:'كل اللغات',wait:'بانتظار المعلمة…',off:'لا يوجد اتصال',page:'صفحة',live:'مباشر',empty:'لا توجد أسطر بعد.'},
  vi:{cards:'Thẻ từ',text:'Văn bản',board:'Bảng',all:'Tất cả ngôn ngữ',wait:'Đang chờ cô giáo…',off:'Mất kết nối',page:'Trang',live:'Trực tiếp',empty:'Chưa có dòng nào.'},
  tr:{cards:'Kartlar',text:'Metin',board:'Tahta',all:'Tüm diller',wait:'Öğretmen bekleniyor…',off:'Bağlantı yok',page:'Sayfa',live:'Canlı',empty:'Henüz satır yok.'},
  uk:{cards:'Картки',text:'Текст',board:'Дошка',all:'Усі мови',wait:'Чекаємо на вчительку…',off:'Немає зв’язку',page:'Сторінка',live:'Наживо',empty:'Рядків ще немає.'},
  ru:{cards:'Карточки',text:'Текст',board:'Доска',all:'Все языки',wait:'Ждём учителя…',off:'Нет связи',page:'Страница',live:'Онлайн',empty:'Пока нет строк.'},
  es:{cards:'Tarjetas',text:'Texto',board:'Pizarra',all:'Todos los idiomas',wait:'Esperando a la profesora…',off:'Sin conexión',page:'Página',live:'En vivo',empty:'Aún no hay líneas.'},
  pt:{cards:'Cartões',text:'Texto',board:'Quadro',all:'Todas as línguas',wait:'À espera da professora…',off:'Sem ligação',page:'Página',live:'Ao vivo',empty:'Ainda não há linhas.'},
  en:{cards:'Cards',text:'Text',board:'Board',all:'All languages',wait:'Waiting for the teacher…',off:'No connection',page:'Page',live:'Live',empty:'No lines yet.'}
};
const T=l=>UI[l]||UI.en;
const BOARDM=sp.get('board')==='1';
let lang='de',showAll=false,tab='text',meta=null,lines=[],img=null,imgRev=-1,online=true,seen=null,langs=['de'];
try{lang=localStorage.getItem('live.lang')||'';showAll=localStorage.getItem('live.all')==='1';}catch(e){}
root.innerHTML=`<header><div class="sh-top"><b id="s-title"></b><span id="s-stat"></span></div>
<div id="s-chips" class="chips"></div>
<div class="tabs"><button data-t="text" class="on"></button><button data-t="cards"></button><button data-t="board"></button></div></header>
<main><div id="s-text"></div><div id="s-cards" hidden></div><div id="s-board" hidden></div></main>
<footer><label class="chk2"><input type="checkbox" id="s-all"><span id="s-alllab"></span></label></footer>`;
const arr=x=>Array.isArray(x)?x:Object.values(x||{});
async function get(p){const r=await fetch(`${base}/rooms/${code}/${p}.json`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();}
const VL={de:'de-DE',ar:'ar-SA',vi:'vi-VN',tr:'tr-TR',uk:'uk-UA',ru:'ru-RU',es:'es-ES',pt:'pt-PT',en:'en-GB',ti:'ti-ET'};
const CANSAY='speechSynthesis' in window;
function say(text,l){if(!CANSAY)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=VL[l]||l;u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
const SPK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
if(BOARDM){
  document.documentElement.classList.add('boardmode');
  root.style.cssText='max-width:none;margin:0;padding:0;min-height:100vh;background:#e5e9f0';
  document.documentElement.style.background='#e5e9f0';document.body.style.background='#e5e9f0';
  root.innerHTML='<img id="bimg" alt="" style="width:100vw;height:100vh;object-fit:contain;background:#fff;display:block">';
  let brev=-1;
  const bt=async()=>{try{const m=await get('meta');if(m&&m.img&&m.imgRev!==brev){$('bimg').src=await get('img');brev=m.imgRev;}}catch(e){}};
  setInterval(bt,1500);bt();
  document.addEventListener('dblclick',()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});});
  return;
}
let ci=0,flip=false;
function cardList(){return lines.filter(l=>l.de&&l.de.length<=45&&l.de.indexOf('\n')<0&&(lang==='de'||(l.tr&&l.tr[lang])));}
function renderCards(){
  const box=$('s-cards'),t=T(lang),L=cardList();
  if(!L.length){box.innerHTML=`<div class="empty">${esc(t.empty)}</div>`;return;}
  if(ci>=L.length)ci=L.length-1;if(ci<0)ci=0;
  const l=L[ci],tr=(l.tr||{})[lang],back=flip&&lang!=='de'&&tr;
  const txt=back?tr:l.de,tl=back?lang:'de',rtl=back&&lang==='ar';
  box.innerHTML=`<div class="fc" id="fc" dir="${rtl?'rtl':'ltr'}"><div class="big${rtl?' ar':''}" style="${back?'color:'+(COL[lang]||'#111'):''}">${esc(txt)}</div>${back?`<div class="sm">${esc(l.de)}</div>`:''}</div>
  <div class="fcnav"><button id="fc-p">‹</button><span>${ci+1} / ${L.length}</span><button id="fc-n">›</button>${CANSAY?`<button class="spk" id="fc-s" aria-label="Vorlesen">${SPK}</button>`:''}</div>`;
  $('fc').onclick=()=>{flip=!flip;renderCards();};
  $('fc-p').onclick=()=>{ci=(ci-1+L.length)%L.length;flip=false;renderCards();};
  $('fc-n').onclick=()=>{ci=(ci+1)%L.length;flip=false;renderCards();};
  if($('fc-s'))$('fc-s').onclick=()=>say(txt,tl);
}
function setLang(l){lang=l;try{localStorage.setItem('live.lang',l);}catch(e){}renderAll();}
function renderChips(){
  const box=$('s-chips');
  box.innerHTML=langs.map(l=>`<button data-l="${l}" class="${l===lang?'on':''}">${LN[l]||l}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
}
function renderUi(){
  const t=T(lang);
  $('s-title').textContent=t.live+' · '+code;
  root.querySelector('[data-t=text]').textContent=t.text;root.querySelector('[data-t=cards]').textContent=t.cards;
  const bt=root.querySelector('[data-t=board]');bt.textContent=t.board;bt.style.display=(meta&&meta.img)?'':'none';
  $('s-alllab').textContent=t.all;$('s-all').checked=showAll;
  const st=$('s-stat');
  if(!online){st.textContent='● '+t.off;st.className='bad';}
  else if(!meta){st.textContent='● '+t.wait;st.className='wait';}
  else{st.textContent='● '+t.live;st.className='ok';}
  root.dir=(lang==='ar')?'rtl':'ltr';
}
function renderLines(){
  const box=$('s-text'),t=T(lang);
  const near=document.documentElement.scrollHeight-window.scrollY-window.innerHeight<160;
  if(!lines.length){box.innerHTML=`<div class="empty">${esc(meta?t.empty:t.wait)}</div>`;return;}
  let html='',lastP=null;
  lines.forEach(l=>{
    if(l.p!==lastP&&(lastP!==null||l.p>1)){html+=`<div class="pdiv">${esc(t.page)} ${l.p}</div>`;}
    lastP=l.p;
    const isNew=seen&&!seen.has(l.id);
    const tr=l.tr||{};
    let inner='';
    if(showAll){
      inner+=`<div class="de">${esc(l.de)}</div>`;
      langs.filter(x=>x!=='de'&&tr[x]).forEach(x=>{inner+=`<div class="tl" dir="${x==='ar'?'rtl':'ltr'}"><span class="tg" style="background:${COL[x]||'#475569'}">${x.toUpperCase()}</span><span style="color:${COL[x]||'#111'}">${esc(tr[x])}</span></div>`;});
    }else if(lang==='de'||!tr[lang]){
      inner+=`<div class="big">${esc(l.de)}</div>`;
    }else{
      inner+=`<div class="big${lang==='ar'?' ar':''}" dir="${lang==='ar'?'rtl':'ltr'}" style="color:${COL[lang]||'#111'}">${esc(tr[lang])}</div><div class="de">${esc(l.de)}</div>`;
    }
    let sp2='';
    if(CANSAY&&!showAll){
      sp2=`<div style="margin-top:8px;display:flex;gap:8px">`+(lang!=='de'&&tr[lang]?`<button class="spk" data-say="${esc(tr[lang])}" data-l="${lang}" aria-label="Vorlesen">${SPK} ${lang.toUpperCase()}</button>`:'')+`<button class="spk" data-say="${esc(l.de)}" data-l="de" aria-label="Vorlesen">${SPK} DE</button></div>`;
    }
    html+=`<div class="card${isNew?' new':''}">${inner}${sp2}</div>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,b.dataset.l));
  if(seen!==null&&near)window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  seen=new Set(lines.map(l=>l.id));
}
function renderBoard(){
  const b=$('s-board');
  b.innerHTML=img?`<img src="${img}" alt=""><div class="cap">${esc(T(lang).page)} ${meta?meta.pg:''}</div>`:'<div class="empty">…</div>';
}
function renderAll(){renderChips();renderUi();renderLines();if(tab==='board')renderBoard();if(tab==='cards')renderCards();}
function pickLang(m){
  langs=['de'].concat((m.langs||[]).filter(l=>l!=='de'));
  if(!langs.includes(lang)){
    const nav=(navigator.language||'').slice(0,2);
    lang=langs.includes(nav)?nav:(langs[1]||'de');
  }
}
async function tick(){
  if(document.hidden)return;
  try{
    const m=await get('meta');online=true;
    if(!m){meta=null;renderUi();renderLines();return;}
    const first=!meta;
    if(first||m.rev!==meta.rev||JSON.stringify(m.langs)!==JSON.stringify(meta.langs)){
      lines=arr(await get('lines'));pickLang(m);meta=m;renderAll();
    }
    if(tab==='board'&&m.img&&(imgRev!==m.imgRev)){img=await get('img');imgRev=m.imgRev;renderBoard();}
    meta=m;renderUi();
  }catch(e){
    if(online){online=false;renderUi();}
  }
}
root.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  root.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('s-text').hidden=tab!=='text';$('s-cards').hidden=tab!=='cards';$('s-board').hidden=tab!=='board';
  if(tab==='board'){imgRev=-1;tick();renderBoard();}
  if(tab==='cards'){flip=false;renderCards();}
});
$('s-all').onchange=e=>{showAll=e.target.checked;try{localStorage.setItem('live.all',showAll?'1':'0');}catch(_){}renderLines();};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
if(!base){$('s-text').innerHTML='<div class="empty">QR-Code ungültig.</div>';return;}
renderAll();tick();setInterval(tick,2200);
})();
</script>
</body>
</html>
