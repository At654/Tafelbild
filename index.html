<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tafelbild">
<meta name="color-scheme" content="light">
<title>Tafelbild mit Übersetzung</title>
<style>
:root{--ink:#111827;--muted:#64748b;--line:#d8dee8;--bar:#ffffff;--accent:#2563eb;--bg:#eef1f5;--danger:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--bar);border-bottom:1px solid var(--line);z-index:5}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
.grp:last-child{border-right:none;padding-right:0}
.grp.right{margin-left:auto}
button{font:inherit;color:inherit;touch-action:manipulation}
.tb{min-height:40px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.tb:active{background:#e8edf5}
.tb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.sq{min-width:40px;padding:0}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.wd{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;display:grid;place-items:center;padding:0;cursor:pointer}
.wd i{display:block;border-radius:50%;background:var(--ink)}
.wd.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
#pg{min-width:44px;text-align:center;font-weight:600;font-size:15px}
#stage{position:relative;flex:1;min-height:0;background:#fff}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block;background:#fff}
#hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:#94a3b8;font-size:20px;line-height:1.5;padding:40px}
#sb{position:absolute;right:3px;width:5px;border-radius:3px;background:rgba(100,116,139,.45);pointer-events:none;display:none}
#status{position:absolute;right:14px;top:10px;background:#0f172a;color:#fff;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;display:none;align-items:center;gap:8px;pointer-events:none}
#status.on{display:flex}
#status:before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid #fff;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:min(90vw,560px);z-index:50;display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.err{background:var(--danger)}
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{background:#fff;border-radius:16px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;-webkit-user-select:text;user-select:text}
.mbox h2{margin:0 0 12px;font-size:20px}
.mbox label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.mbox input[type=password],.mbox input[type=text],.mbox select,.mbox textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.mbox textarea{resize:vertical}
.mbox .note{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.mbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#f0b4b4}
.chk{display:flex;align-items:center;gap:10px;padding:10px 4px;font-size:17px;font-weight:500}
.chk input{width:22px;height:22px}
.tag{display:inline-block;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:2px 8px;margin-right:8px;vertical-align:middle}
.trow{display:flex;align-items:flex-start;gap:6px;padding:6px 0;border-top:1px solid #eef1f5;font-size:16px;line-height:1.4}
.trow span:last-child{flex:1}
.sec{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.sec h3{margin:0 0 6px;font-size:15px}
@media (max-width:700px){.tb{padding:0 9px;font-size:14px}}

#selbar{position:absolute;display:none;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 22px rgba(15,23,42,.22);z-index:6}
#selbar .tb{min-height:42px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;min-height:84px}
.tcard b{font-size:16px}.tcard span{font-size:13px;color:var(--muted);line-height:1.35}
.tcard:active{background:#eef3ff}
@media (max-width:520px){.tgrid{grid-template-columns:1fr}}
#zoombar{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 4px 16px rgba(15,23,42,.18);z-index:4}
#zoombar .tb{min-height:38px}
#z-fit{min-width:62px}
#stepper{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:0 4px 16px rgba(15,23,42,.22);z-index:4}
#st-n{min-width:54px;text-align:center;font-weight:700;font-size:15px}
#pexit{position:absolute;right:12px;top:12px;display:none;z-index:5;opacity:.6}
body.presenting #pexit{display:block}
body.presenting #bar,body.presenting #zoombar{display:none}
html.boardmode #bar,html.boardmode #zoombar,html.boardmode #stepper,html.boardmode #hint,html.boardmode #sb,html.boardmode #selbar,html.boardmode #pexit{display:none!important}
html.boardmode body,html.boardmode #stage{background:#e5e9f0}
.tgrid.one{grid-template-columns:1fr}
.fc{background:#fff;border-radius:16px;padding:22px 18px;box-shadow:0 2px 8px rgba(15,23,42,.12);text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.fc .big{font-size:30px;line-height:1.4;font-weight:700}.fc .big.ar{font-size:34px}
.fc .sm{font-size:16px;color:var(--muted)}
.spk{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-size:15px;font-weight:600}
.fcnav{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px}
.fcnav button{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:600}
.tl .spk{margin-left:auto;flex:none;min-height:34px;padding:0 10px}
/* Schüler-Ansicht */
html.student,html.student body{height:auto;overflow:auto;overscroll-behavior:auto;-webkit-user-select:text;user-select:text;background:#f4f6fa}
#student[hidden]{display:none}
#student{display:flex;flex-direction:column;min-height:100vh;max-width:720px;margin:0 auto}
#student header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;z-index:3}
.sh-top{display:flex;justify-content:space-between;align-items:center;font-size:15px}
#s-stat{font-size:13px;font-weight:600}#s-stat.ok{color:#15803d}#s-stat.bad{color:#b91c1c}#s-stat.wait{color:#a16207}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}
.chips button{flex:none;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:16px;font-weight:600}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:6px;margin-top:4px}
.tabs button{flex:1;min-height:40px;border:none;border-bottom:3px solid transparent;background:none;font-size:16px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
#student main{flex:1;padding:12px 12px 80px}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.card.new{animation:nw 2.4s ease-out}
@keyframes nw{0%{background:#fff7c2}100%{background:#fff}}
.card .big{font-size:24px;line-height:1.4;font-weight:600}.card .big.ar{font-size:28px;line-height:1.6}
.card .de{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.4}
.card .tl{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:19px;line-height:1.5;border-top:1px solid #eef1f5}
.card .de+.tl{margin-top:8px}
.card .tg{flex:none;color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:2px 8px;margin-top:6px}
.pdiv{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 8px}
.empty{text-align:center;color:var(--muted);padding:60px 10px;font-size:18px}
#s-board img{width:100%;height:auto;display:block;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(15,23,42,.12)}
#s-board .cap{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
#student footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.chk2{display:flex;gap:10px;align-items:center;font-size:16px}.chk2 input{width:22px;height:22px}
</style>
<script>try{if(new URLSearchParams(location.search).get('live')){document.querySelector('meta[name=viewport]').content='width=device-width,initial-scale=1,viewport-fit=cover';document.documentElement.className='student';}}catch(e){}</script>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="grp">
      <button class="tb on" data-tool="pen">Stift</button>
      <button class="tb" data-tool="marker">Marker</button>
      <button class="tb" data-tool="reveal">Aufdecken</button>
      <button class="tb" data-tool="laser">Laser</button>
      <button class="tb" data-tool="lasso">Lasso</button>
      <button class="tb" data-tool="eraser">Radierer</button>
      <button class="tb" data-tool="select">Übersetzung ändern</button>
      <button class="tb" data-tool="text">Text tippen</button>
      <button class="tb" data-tool="hand">Verschieben</button>
    </div>
    <div class="grp" id="g-colors"></div>
    <div class="grp" id="g-width"></div>
    <div class="grp"><button class="tb" id="undo">Zurück</button></div>
    <div class="grp">
      <button class="tb sq" id="prev" aria-label="Vorherige Seite">‹</button>
      <span id="pg">1 / 1</span>
      <button class="tb sq" id="next" aria-label="Nächste Seite">›</button>
      <button class="tb" id="addpg">+ Seite</button>
    </div>
    <div class="grp">
      <button class="tb" id="langs">Sprachen</button>
      <button class="tb on" id="auto">Auto</button>
      <button class="tb" id="now">Jetzt übersetzen</button>
    </div>
    <div class="grp right">
      <button class="tb" id="lesson">Stunde</button>
      <button class="tb" id="imgbtn">Bild</button>
      <button class="tb" id="tpl">Vorlage</button>
      <button class="tb" id="boardbtn">Tafel</button>
      <button class="tb" id="live">Live</button>
      <button class="tb" id="pdf">Sichern</button>
      <button class="tb" id="cfg">Einstellungen</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">Schreibe mit dem Stift.<br>Nach einer kurzen Pause erscheint die Übersetzung direkt unter der Zeile.</div>
    <div id="sb"></div>
    <div id="zoombar"><button class="tb sq" id="z-out" aria-label="Verkleinern">−</button><button class="tb" id="z-fit" aria-label="Ansicht zurücksetzen"><span id="zoomv">100%</span></button><button class="tb sq" id="z-in" aria-label="Vergrößern">+</button></div>
    <div id="stepper"><button class="tb" id="st-prev">‹ Zurück</button><span id="st-n"></span><button class="tb on" id="st-next">Weiter ›</button><button class="tb" id="st-laser">Laser</button></div>
    <button class="tb" id="pexit">Präsentation beenden</button>
    <div id="status">Übersetze …</div>
    <div id="selbar"><button class="tb" id="sel-big" style="display:none">Bild +</button><button class="tb" id="sel-small" style="display:none">Bild −</button><button class="tb" id="sel-vis">Auf-/Zudecken</button><button class="tb" id="sel-dup">Duplizieren</button><button class="tb" id="sel-del">Löschen</button><button class="tb on" id="sel-ok">Fertig</button></div>
  </main>
</div>
<div id="toast"></div>
<div id="modal-root"></div>
<div id="student" hidden></div>

<script>
(()=>{
'use strict';
if(new URLSearchParams(location.search).get('live'))return;
const BOARD=new URLSearchParams(location.search).get('board')==='1';

/* ================= Sprachen & Einstellungen ================= */
const LANGS={
  ar:{n:'Arabisch',tag:'AR',c:'#0f766e',rtl:true},
  vi:{n:'Vietnamesisch',tag:'VI',c:'#c2410c'},
  tr:{n:'Türkisch',tag:'TR',c:'#1d4ed8'},
  uk:{n:'Ukrainisch',tag:'UK',c:'#a16207'},
  ru:{n:'Russisch',tag:'RU',c:'#0369a1'},
  es:{n:'Spanisch',tag:'ES',c:'#be123c'},
  pt:{n:'Portugiesisch',tag:'PT',c:'#7c3aed'},
  ti:{n:'Tigrinya',tag:'TI',c:'#0e7490'},
  en:{n:'Englisch',tag:'EN',c:'#475569'}
};
const COLORS=['#111827','#1d4ed8','#dc2626','#15803d','#ea580c'];
const WIDTHS=[3,5,9];
const DEF={key:'',model:'claude-haiku-4-5',pause:1.6,finger:'auto',fs:24,langs:['ar','vi','tr'],auto:true,penSeen:false,color:COLORS[0],width:4,calls:0,tin:0,tout:0,fbUrl:'',liveImg:true,liveRoom:null,hlColor:'#facc15'};
const S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('tafel.settings')||'{}'));}catch(e){}
function saveSettings(){try{localStorage.setItem('tafel.settings',JSON.stringify(S));}catch(e){}}

const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FONT='-apple-system,"SF Pro Text","Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",Arial,sans-serif';

/* ================= Zustand ================= */
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const mctx=document.createElement('canvas').getContext('2d');
const view={x:0,y:0,z:1,w:800,h:600,dpr:1};
let pages=[],pi=0,tool='pen';
const hist=new Map();
const page=()=>pages[pi];

function bb(s){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;const p=s.pts;
  for(let i=0;i<p.length;i+=3){const x=p[i],y=p[i+1];if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y;}
  const pad=s.w*0.9+1;s.x0=a-pad;s.y0=b-pad;s.x1=c+pad;s.y1=d+pad;
}
function hydrate(d,keepDone){
  const p={id:d.id||uid(),strokes:[],blocks:[]};
  (d.strokes||[]).forEach(s=>{const o={id:s.id,c:s.c,w:s.w,pts:s.pts,done:keepDone?s.done!==false:true};if(s.hl)o.hl=true;if(s.hid)o.hid=true;if(s.g)o.g=s.g;bb(o);p.strokes.push(o);});
  (d.blocks||[]).forEach(b=>{const o=Object.assign({},b);o.tr=o.tr||{};o.src=o.src||[];layoutBlock(o);p.blocks.push(o);});
  return p;
}
function serBlock(b){
  const o={id:b.id,x:b.x,y:b.y,w:b.w,fs:b.fs,de:b.de,tr:b.tr,langs:b.langs,src:b.src,typed:b.typed,flat:b.flat,bold:b.bold};
  if(b.col)o.col=b.col;if(b.hid)o.hid=true;if(b.g)o.g=b.g;
  if(b.img){o.img=b.img;o.ar=b.ar;if(b.cap)o.cap=b.cap;}return o;
}
function serPage(p){
  return {id:p.id,
    strokes:p.strokes.map(s=>{const o={id:s.id,c:s.c,w:s.w,pts:s.pts,done:s.done};if(s.hl)o.hl=true;if(s.hid)o.hid=true;if(s.g)o.g=s.g;return o;}),
    blocks:p.blocks.map(serBlock)};
}
let saveT=null;
function save(){
  liveDirty();bcDirty();
  clearTimeout(saveT);
  saveT=setTimeout(()=>{try{localStorage.setItem('tafel.pages',JSON.stringify({pi,pages:pages.map(serPage)}));}catch(e){}},700);
}
function load(){
  try{
    const j=JSON.parse(localStorage.getItem('tafel.pages')||'null');
    if(j&&j.pages&&j.pages.length){pages=j.pages.map(d=>hydrate(d,false));pi=Math.min(j.pi||0,pages.length-1);return;}
  }catch(e){}
  pages=[{id:uid(),strokes:[],blocks:[]}];pi=0;
}

/* ================= Verlauf (Zurück) ================= */
function pushHistoryFor(p){const a=hist.get(p.id)||[];a.push(JSON.stringify(serPage(p)));if(a.length>25)a.shift();hist.set(p.id,a);}
const pushHistory=()=>pushHistoryFor(page());
function undo(){
  const p=page(),a=hist.get(p.id)||[];
  if(!a.length){toast('Nichts zum Rückgängigmachen');return;}
  const n=hydrate(JSON.parse(a.pop()),true);
  p.strokes=n.strokes;p.blocks=n.blocks;
  clearSel();save();
}

/* ================= Zeichnen ================= */
function wAt(s,i){return Math.max(1,s.w*(0.4+1.2*s.pts[i*3+2]));}
function drawStroke(g,s,from){
  const p=s.pts,n=p.length/3;
  g.strokeStyle=s.c;g.fillStyle=s.c;g.lineCap='round';g.lineJoin='round';
  if(n===1){g.beginPath();g.arc(p[0],p[1],wAt(s,0)/2,0,6.2832);g.fill();return;}
  const mx=k=>(p[k*3]+p[k*3+3])/2,my=k=>(p[k*3+1]+p[k*3+4])/2;
  let k=from||0;
  if(k<=0){g.lineWidth=wAt(s,0);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(mx(0),my(0));g.stroke();k=1;}
  for(;k<=n-2;k++){g.lineWidth=wAt(s,k);g.beginPath();g.moveTo(mx(k-1),my(k-1));g.quadraticCurveTo(p[k*3],p[k*3+1],mx(k),my(k));g.stroke();}
  g.lineWidth=wAt(s,n-1);g.beginPath();g.moveTo(mx(n-2),my(n-2));g.lineTo(p[(n-1)*3],p[(n-1)*3+1]);g.stroke();
}

/* ---------- Übersetzungsblöcke ---------- */
function wrap(g,text,maxW){
  const out=[];
  String(text).split('\n').forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean);
    if(!words.length){out.push('');return;}
    let line='';
    words.forEach(w=>{
      const t=line?line+' '+w:w;
      if(line&&g.measureText(t).width>maxW){out.push(line);line=w;}else line=t;
    });
    out.push(line);
  });
  return out;
}
function layoutBlock(b){
  if(b.img){b.items=[];b.deLines=null;b.lh=24;b.h=Math.round(b.w*(b.ar||0.75))+(b.cap?22:0);return;}
  const fs=b.fs||24,lh=Math.round(fs*1.32),padX=b.flat?4:10,padY=b.flat?2:6,tagW=Math.round(fs*1.5);
  b.lh=lh;b.tagW=tagW;b.padX=padX;b.padY=padY;

  if(b.typed){
    const dfs=b.flat?fs:Math.round(fs*1.25);mctx.font=`${b.flat?(b.bold?700:500):600} ${dfs}px ${FONT}`;
    b.deLines=wrap(mctx,b.de,b.w-padX*2);b.deLh=Math.round(dfs*1.3);b.dfs=dfs;
    y+=b.deLines.length*b.deLh+(b.langs&&b.langs.length?6:0);

    const t=(b.tr[code]||'').trim();if(!t||!LANGS[code])return;
    mctx.font=`${fs}px ${FONT}`;
    const ls=wrap(mctx,t,tw);
    b.items.push({code,ls,y});y+=ls.length*lh+6;

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function imgOf(b){
  if(!b._im){const im=new Image();b._im=im;im.onload=()=>redraw();im.src=b.img;}
  return b._im;

function loadImg(b){return new Promise(res=>{const im=imgOf(b);if(im.complete&&im.naturalWidth)res();else{im.addEventListener('load',res);im.addEventListener('error',res);}});}
function drawBlock(g,b){
  if(b.img){
    const im=imgOf(b),ih=Math.round(b.w*(b.ar||0.75));
    g.save();
    if(im.complete&&im.naturalWidth){g.drawImage(im,b.x,b.y,b.w,ih);}
    else{g.fillStyle='#f1f5f9';g.fillRect(b.x,b.y,b.w,ih);}
    g.strokeStyle='#cbd5e1';g.lineWidth=1.5;g.strokeRect(b.x,b.y,b.w,ih);
    if(b.cap){g.fillStyle='#64748b';g.font=`14px ${FONT}`;g.textBaseline='top';g.textAlign='left';g.direction='ltr';g.fillText(b.cap,b.x+2,b.y+ih+4);}
    g.restore();return;
  }
  g.save();
  if(!b.flat){g.fillStyle='#f3f5f9';rr(g,b.x,b.y,b.w,b.h,8);g.fill();}
  g.textBaseline='top';
  if(b.typed&&b.deLines){
    g.direction='ltr';g.textAlign='left';g.fillStyle=b.col||'#111827';g.font=`${b.flat?(b.bold?700:500):600} ${b.dfs}px ${FONT}`;
    b.deLines.forEach((l,i)=>g.fillText(l,b.x+b.padX,b.y+b.padY+i*b.deLh+(b.deLh-b.dfs)/2));
  }
  b.items.forEach(it=>{
    const L=LANGS[it.code],rtl=!!L.rtl;
    const ty=b.y+it.y;
    const tagX=rtl?b.x+b.w-b.padX-b.tagW:b.x+b.padX;
    g.fillStyle=L.c;rr(g,tagX,ty+(b.lh-20)/2,b.tagW,20,10);g.fill();
    g.direction='ltr';g.textAlign='center';g.fillStyle='#fff';g.font=`700 12px ${FONT}`;
    g.fillText(L.tag,tagX+b.tagW/2,ty+(b.lh-20)/2+4);
    g.fillStyle=L.c;g.font=`${b.fs}px ${FONT}`;

    const tx=rtl?b.x+b.w-b.padX-b.tagW-8:b.x+b.padX+b.tagW+8;
    it.ls.forEach((l,i)=>g.fillText(l,tx,ty+i*b.lh+(b.lh-b.fs)/2));
  });
  g.restore();
}

const GHOST=0.5;
let presenting=false;
function ghostMark(g,x,y){
  g.save();g.globalAlpha=1;g.strokeStyle='#64748b';g.fillStyle='#fff';g.lineWidth=2;
  g.beginPath();g.arc(x,y,13,0,6.2832);g.fill();g.stroke();
  g.beginPath();g.ellipse(x,y,7,4,0,0,6.2832);g.moveTo(x-8,y+7);g.lineTo(x+8,y-7);g.stroke();
  g.restore();
}
function paint(g,pg,y0,h,aud){
  /* aud: true = Publikum (Verdecktes weg), false = Lehrkraft (Verdecktes blass), null = alles normal (PDF) */
  g.save();g.translate(0,-y0);
  const strokes=(pass)=>pg.strokes.forEach(s=>{
    if(!!s.hl!==(pass===0))return;
    if(s.y1<y0||s.y0>y0+h)return;
    if(s.hid&&aud!==null){if(aud)return;g.save();g.globalAlpha=GHOST;drawStroke(g,s,0);g.restore();}
    else drawStroke(g,s,0);
  });
  strokes(0);
  pg.blocks.forEach(b=>{
    if(b.y+b.h<y0||b.y>y0+h)return;
    if(b.hid&&aud!==null){
      if(aud)return;
      g.save();g.globalAlpha=GHOST;drawBlock(g,b);g.restore();ghostMark(g,b.x+b.w-16,b.y+16);
    }else drawBlock(g,b);
  });

  g.restore();
}
let rq=false;
function redraw(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;draw();});}
function contentBottom(pg){
  let b=0;pg.strokes.forEach(s=>{if(s.y1>b)b=s.y1;});pg.blocks.forEach(x=>{if(x.y+x.h>b)b=x.y+x.h;});return b;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function maxY(){
  const z=view.z,vh=view.h/z,b=contentBottom(page());
  return b>vh*0.85?Math.max(0,b-140/z):0;
}
function clampView(){
  const z=view.z=clamp(view.z,0.4,4),vw=view.w/z;
  view.x=vw>=view.w?(view.w-vw)/2:clamp(view.x,0,view.w-vw);
  view.y=clamp(view.y,0,maxY());
}
function setScroll(y){view.y=y;clampView();redraw();}
function setZoom(z,sx,sy){
  sx=sx==null?view.w/2:sx;sy=sy==null?view.h/2:sy;
  const px=sx/view.z+view.x,py=sy/view.z+view.y;
  view.z=clamp(z,0.4,4);view.x=px-sx/view.z;view.y=py-sy/view.z;clampView();redraw();
}
function resetView(){view.z=1;view.x=0;view.y=0;clampView();redraw();}
let stepSig='';
function draw(){
  if(BOARD){boardDraw();return;}
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  const z=view.z;
  ctx.fillStyle=z<1?'#e5e9f0':'#fff';ctx.fillRect(0,0,view.w,view.h);
  if(z<1){ctx.fillStyle='#fff';ctx.fillRect(-view.x*z,0,view.w*z,view.h);}

  paint(ctx,page(),view.y,view.h/z,presenting);
  ctx.restore();
  drawOverlay(ctx);
  const pg=page();
  $('hint').style.display=(pg.strokes.length||pg.blocks.length)?'none':'grid';
  $('pg').textContent=(pi+1)+' / '+pages.length;
  $('zoomv').textContent=Math.round(z*100)+'%';
  const ms=maxY(),sb=$('sb');
  if(ms>0){const tot=ms*z+view.h,hh=Math.max(30,view.h*view.h/tot);sb.style.display='block';sb.style.height=hh+'px';sb.style.top=(view.y/ms*(view.h-hh))+'px';}
  else sb.style.display='none';

}
function resize(){
  const r=stage.getBoundingClientRect();

/* ================= Eingabe (Stift, Finger, Maus) ================= */
const ptrs=new Map();
let curS=null,pan=null,erasing=null,penDown=false,autoT=null;
const fingerDraws=()=>S.finger==='yes'||(S.finger==='auto'&&!S.penSeen);
const FINGER_PANS=['pen','marker','eraser'];
function pt(e){const r=cv.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/view.z+view.x,0,view.w),y:(e.clientY-r.top)/view.z+view.y};}
const pressureOf=e=>e.pointerType==='pen'?(e.pressure||0.5):0.5;

function addPt(s,p,pr){
  const a=s.pts,n=a.length;
  if(n>=3){const dx=p.x-a[n-3],dy=p.y-a[n-2];if(dx*dx+dy*dy<0.8/view.z)return;}
  a.push(+p.x.toFixed(1),+p.y.toFixed(1),+pr.toFixed(2));
  bb(s);
  if(s.hl)redraw();
  else{
    const g=ctx,k=view.dpr*view.z;g.save();g.setTransform(k,0,0,k,-view.x*k,-view.y*k);
    drawStroke(g,s,a.length/3-3);g.restore();
  }

}
function startStroke(e,p){
  pushHistory();
  const hl=tool==='marker';
  const s={id:uid(),c:hl?S.hlColor:S.color,w:hl?+(26/view.z).toFixed(1):Math.max(1,+(S.width/view.z).toFixed(1)),pts:[],done:hl};
  if(hl)s.hl=true;
  page().strokes.push(s);
  curS={s,id:e.pointerId,type:e.pointerType};

}
function cancelStroke(){
  if(!curS)return;

  const a=hist.get(p.id);if(a)a.pop();

function finishStroke(){

/* --- Verschieben & Zoomen (Finger) --- */
function panCent(){let tx=0,ty=0,n=0;pan.ids.forEach(id=>{const q=ptrs.get(id);if(q){tx+=q.x;ty+=q.y;n++;}});return n?{x:tx/n,y:ty/n}:{x:0,y:0};}
function panDist(){const a=[...pan.ids].map(id=>ptrs.get(id)).filter(Boolean);return a.length>=2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;}
function panRebase(){
  const c=panCent(),r=cv.getBoundingClientRect();
  pan.ax=(c.x-r.left)/view.z+view.x;pan.ay=(c.y-r.top)/view.z+view.y;pan.z0=view.z;pan.d0=panDist();
}
function panStart(ids){pan={ids:new Set(ids)};panRebase();}
function panMove(){
  const c=panCent(),r=cv.getBoundingClientRect(),sx=c.x-r.left,sy=c.y-r.top;
  let z=view.z;
  if(pan.d0>0){const d=panDist();if(d>0)z=clamp(pan.z0*d/pan.d0,0.4,4);}
  view.z=z;view.x=pan.ax-sx/z;view.y=pan.ay-sy/z;clampView();redraw();
}

/* --- Radierer --- */
const ERASE_R=20;
function segD2(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;
  const x=ax+t*dx-px,y=ay+t*dy-py;return x*x+y*y;
}
function strokeHit(s,x,y,r){
  r+=s.w/2;
  if(x<s.x0-r||x>s.x1+r||y<s.y0-r||y>s.y1+r)return false;
  const p=s.pts,n=p.length;
  if(n===3){const dx=x-p[0],dy=y-p[1];return dx*dx+dy*dy<=r*r;}
  for(let i=0;i+5<n;i+=3)if(segD2(x,y,p[i],p[i+1],p[i+3],p[i+4])<=r*r)return true;
  return false;
}
function eraseAt(x,y){
  const pg=page(),before=pg.strokes.length;
  pg.strokes=pg.strokes.filter(s=>!strokeHit(s,x,y,ERASE_R/view.z));
  if(pg.strokes.length!==before){cleanOrphans(pg);if(sel)clearSel();redraw();return true;}
  return false;
}
function cleanOrphans(pg){
  const ids=new Set(pg.strokes.map(s=>s.id));
  pg.blocks=pg.blocks.filter(b=>!b.src.length||b.src.some(id=>ids.has(id)));
}

/* --- Aufdecken --- */
function itemAt(p){
  const pg=page(),r=16/view.z;
  for(let i=pg.blocks.length-1;i>=0;i--){const b=pg.blocks[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b;}
  for(let i=pg.strokes.length-1;i>=0;i--){if(strokeHit(pg.strokes[i],p.x,p.y,r))return pg.strokes[i];}
  return null;
}
function toggleGroupOf(it){
  const pg=page();
  const items=it.g?[...pg.strokes,...pg.blocks].filter(x=>x.g===it.g):[it];
  const show=items.some(x=>x.hid);
  pushHistory();
  items.forEach(x=>{if(show)delete x.hid;else x.hid=true;});
  redraw();save();
}
function groupsInfo(){
  const pg=page(),m=new Map();
  [...pg.strokes,...pg.blocks].forEach(x=>{
    if(!x.g)return;
    const e=m.get(x.g)||{g:x.g,hid:0,n:0};e.n++;if(x.hid)e.hid++;m.set(x.g,e);
  });
  return [...m.values()].sort((a,b)=>a.g-b.g);
}
function setGroup(g,hide){
  const pg=page();pushHistory();
  [...pg.strokes,...pg.blocks].forEach(x=>{if(x.g===g){if(hide)x.hid=true;else delete x.hid;}});
  redraw();save();
}
function stepNext(){
  const n=groupsInfo().find(e=>e.hid>0);
  if(!n){toast('Alles ist aufgedeckt.');return;}
  setGroup(n.g,false);
}
function stepPrev(){
  const gs=groupsInfo(),n=gs.findIndex(e=>e.hid>0),idx=n<0?gs.length-1:n-1;
  if(idx<0)return;
  setGroup(gs[idx].g,true);
}
function updateStepper(){
  const gs=groupsInfo(),bar=$('stepper');
  const sig=gs.length+':'+gs.filter(e=>e.hid===0).length+':'+presenting;
  if(sig===stepSig)return;stepSig=sig;
  if(!gs.length){bar.style.display='none';return;}
  bar.style.display='flex';
  $('st-n').textContent=gs.filter(e=>e.hid===0).length+' / '+gs.length;

/* --- Laserpointer --- */
const laser={pts:[],on:false,raf:0,id:null};
function laserLoop(L){
  if(L.raf)return;
  L.raf=requestAnimationFrame(function f(){
    L.raf=0;const now=performance.now();
    L.pts=L.pts.filter((q,i)=>now-q.t<1600||(L.on&&i===L.pts.length-1));
    redraw();
    if(L.pts.length)L.raf=requestAnimationFrame(f);
  });
}
function drawLaser(g,L,sc){
  if(!L.pts.length)return;
  const now=performance.now();
  g.save();g.lineCap='round';g.lineJoin='round';
  for(let i=1;i<L.pts.length;i++){
    const a=L.pts[i-1],b=L.pts[i];if(b.brk)continue;
    const al=Math.max(0,1-(now-b.t)/1600);if(al<=0)continue;
    g.strokeStyle='rgba(239,68,68,'+(al*0.85).toFixed(2)+')';g.lineWidth=7/sc;
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  }
  const h=L.pts[L.pts.length-1],al=Math.max(0,1-(now-h.t)/1600);
  if(al>0){g.fillStyle='rgba(239,68,68,'+al.toFixed(2)+')';g.strokeStyle='#fff';g.lineWidth=2/sc;g.beginPath();g.arc(h.x,h.y,11/sc,0,6.2832);g.fill();g.stroke();}
  g.restore();
}
function laserAdd(p,brk){
  laser.pts.push({x:p.x,y:p.y,t:performance.now(),brk:!!brk});
  if(laser.pts.length>90)laser.pts.shift();
  bcLaser(p,brk);laserLoop(laser);
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(e.pointerType==='pen'){penDown=true;if(!S.penSeen){S.penSeen=true;saveSettings();}}
  if(e.pointerType==='touch'&&penDown)return;               // Handballen-Schutz
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType==='touch'){
    const tids=[...ptrs.entries()].filter(([,q])=>q.type==='touch').map(([id])=>id);
    if(tids.length>=2){
      if(curS&&curS.type==='touch')cancelStroke();
      if(lz&&lz.mode==='draw'){lassoPts=null;lz=null;}
      if(erasing&&ptrs.get(erasing.id)&&ptrs.get(erasing.id).type==='touch'){erasing=null;save();}
      panStart(tids);return;
    }
    if(tool==='hand'||(!fingerDraws()&&FINGER_PANS.includes(tool))){panStart([e.pointerId]);return;}
  }else if(tool==='hand'){panStart([e.pointerId]);return;}
  const p=pt(e);
  if(tool==='lasso'){lassoDown(e,p);return;}
  if(tool==='reveal'){const it=itemAt(p);if(it)toggleGroupOf(it);return;}
  if(tool==='laser'){laser.on=true;laser.id=e.pointerId;laserAdd(p,true);return;}
  if(tool==='select'){
    const pg=page();let hit=null;
    for(let i=pg.blocks.length-1;i>=0;i--){const b=pg.blocks[i];if(!b.img&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){hit=b;break;}}
    if(hit)openBlockModal(hit);else toast('Tippe direkt auf eine Übersetzung.');
    return;
  }
  if(tool==='text'){openTextModal(p);return;}
  if(tool==='eraser'||(e.buttons&32)){
    pushHistory();erasing={id:e.pointerId,x:p.x,y:p.y};eraseAt(p.x,p.y);return;
  }
  startStroke(e,p);
});
cv.addEventListener('pointermove',e=>{
  const q=ptrs.get(e.pointerId);if(!q)return;
  q.x=e.clientX;q.y=e.clientY;
  if(pan&&pan.ids.has(e.pointerId)){panMove();return;}
  if(lz&&lz.id===e.pointerId){lassoMove(e);return;}
  if(laser.on&&laser.id===e.pointerId){laserAdd(pt(e),false);return;}
  if(erasing&&erasing.id===e.pointerId){
    const p=pt(e),dx=p.x-erasing.x,dy=p.y-erasing.y,d=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(d*view.z/8));
    for(let i=1;i<=steps;i++)eraseAt(erasing.x+dx*i/steps,erasing.y+dy*i/steps);
    erasing.x=p.x;erasing.y=p.y;return;
  }
  if(curS&&curS.id===e.pointerId){
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    (evs.length?evs:[e]).forEach(ev=>addPt(curS.s,pt(ev),pressureOf(ev)));
  }
});
function endPtr(e){
  const id=e.pointerId;
  if(e.pointerType==='pen')penDown=false;
  if(!ptrs.has(id))return;
  if(pan&&pan.ids.has(id)){pan.ids.delete(id);if(pan.ids.size===0)pan=null;else panRebase();}
  if(lz&&lz.id===id){lassoUp();}
  if(laser.on&&laser.id===id){laser.on=false;bcLaserOff();laserLoop(laser);}
  if(erasing&&erasing.id===id){erasing=null;save();}
  if(curS&&curS.id===id){if(e.type==='pointercancel'&&curS.s.pts.length<9)cancelStroke();else finishStroke();}
  ptrs.delete(id);
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{
  e.preventDefault();const r=cv.getBoundingClientRect();
  if(e.ctrlKey)setZoom(view.z*Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);
  else{view.y+=e.deltaY/view.z;view.x+=e.deltaX/view.z;clampView();redraw();}
},{passive:false});

/* ================= Claude-API ================= */
function sysPrompt(langs){
  const list=langs.map(c=>`"${c}" = ${LANGS[c].n}`).join(', ');
  return `You are the translation engine of a classroom whiteboard app. The teacher works at a German vocational school (Berufsschule: retail sales, economics, maths). Many learners are still learning German.
Input: either a photo of ONE handwritten line or phrase in German (it may also contain numbers, formulas, abbreviations), or plain German text.
Task:
1. Transcribe the German text exactly as written. Resolve unclear letters sensibly, but do not rewrite or correct the content.
2. Translate it into: ${list}. Use simple, clear everyday wording. Keep numbers, units, currency symbols, formulas and abbreviations unchanged. For specific German technical terms (for example Kaufvertrag, Warenwirtschaft) give the translation and keep the German term in brackets after it.
3. Answer with exactly ONE JSON object and nothing else (no markdown fences): {"de": "<transcription>", ${langs.map(c=>`"${c}": "<translation>"`).join(', ')}}
If the input has several lines, separate them with \\n in every field.
If the image contains no readable German text (only a drawing, arrow, underline, table lines, scribble), answer {"de": ""}.
If the text is only a number or formula, copy it unchanged into "de" and into every translation.`;
}
function parseJSON(t){
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<=a)return null;
  try{return JSON.parse(t.slice(a,b+1));}catch(e){return null;}
}
async function callClaude(content,system,maxTok,model){
  const body={model:model||S.model,max_tokens:maxTok||1500,system,messages:[{role:'user',content}]};
  for(let attempt=0;attempt<3;attempt++){
    let r;
    try{
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
        'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    }catch(err){
      if(attempt<2){await sleep(1200);continue;}
      throw new Error('Keine Verbindung zum Internet oder zur Claude-API.');
    }
    if((r.status===429||r.status===529||r.status>=500)&&attempt<2){await sleep(1500*(attempt+1));continue;}
    if(!r.ok){
      let m='';try{m=(await r.json()).error.message;}catch(e){}
      if(r.status===401)throw new Error('API-Schlüssel ungültig (401). Bitte in den Einstellungen prüfen.');
      if(r.status===400&&/credit|balance/i.test(m))throw new Error('Das API-Guthaben ist aufgebraucht. Bitte in der Anthropic-Console aufladen.');
      if(r.status===404)throw new Error('Modell nicht gefunden. Bitte in den Einstellungen ein anderes Modell wählen.');
      throw new Error('Fehler '+r.status+(m?': '+m:''));
    }
    const j=await r.json();
    S.calls++;S.tin+=(j.usage&&j.usage.input_tokens)||0;S.tout+=(j.usage&&j.usage.output_tokens)||0;saveSettings();
    return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
  }
}
function needKey(){
  if(S.key)return false;
  openSettings('Bitte zuerst deinen API-Schlüssel eintragen.');return true;
}

let busyN=0;
function busy(d,l){busyN+=d;const s=$('status');s.classList.toggle('on',busyN>0);s.textContent=l||(busyN>1?`Übersetze ${busyN} Zeilen …`:'Übersetze …');}

/* ---------- Zeilen erkennen & übersetzen ---------- */
function clusterLines(strokes){
  const arr=[...strokes].sort((a,b)=>a.y0-b.y0),out=[];let c=null;
  arr.forEach(s=>{
    if(c&&s.y0<=c.y1+Math.max(5,(c.y1-c.y0)*0.12)){c.list.push(s);c.y1=Math.max(c.y1,s.y1);}
    else{c={list:[s],y0:s.y0,y1:s.y1};out.push(c);}
  });
  return out.map(x=>x.list);
}
function bboxOf(list){
  const r={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  list.forEach(s=>{r.x0=Math.min(r.x0,s.x0);r.y0=Math.min(r.y0,s.y0);r.x1=Math.max(r.x1,s.x1);r.y1=Math.max(r.y1,s.y1);});
  return r;
}
function cropImage(list){
  const r=bboxOf(list),pad=14,x0=r.x0-pad,y0=r.y0-pad,w=r.x1-r.x0+2*pad,h=r.y1-r.y0+2*pad;
  const sc=Math.max(0.4,Math.min(3,1500/w,800/h));
  const c=document.createElement('canvas');c.width=Math.max(16,Math.round(w*sc));c.height=Math.max(16,Math.round(h*sc));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.scale(sc,sc);g.translate(-x0,-y0);
  list.forEach(s=>drawStroke(g,s,0));
  return c.toDataURL('image/jpeg',0.9).split(',')[1];
}
function shiftStroke(s,dy){const p=s.pts;for(let i=1;i<p.length;i+=3)p[i]=+(p[i]+dy).toFixed(1);s.y0+=dy;s.y1+=dy;}
function shiftBelow(pg,edge,dy,exclIds,exclBlock){
  pg.strokes.forEach(s=>{if(!exclIds.has(s.id)&&s.y0>=edge-2)shiftStroke(s,dy);});
  pg.blocks.forEach(b=>{if(b.id!==exclBlock&&b.y>=edge-2)b.y+=dy;});
}
function findStrokes(pg,ids){return ids.map(id=>pg.strokes.find(s=>s.id===id)).filter(Boolean);}

function translatePending(manual){
  const pg=page(),pend=pg.strokes.filter(s=>!s.done);
  if(!pend.length){if(manual)toast('Es gibt nichts Neues zum Übersetzen.');return;}
  if(needKey())return;
  clusterLines(pend).forEach(list=>{
    list.forEach(s=>s.done=true);
    processLine(pg,list.map(s=>s.id));
  });
}
async function processLine(pg,ids){
  const list=findStrokes(pg,ids);if(!list.length)return;
  busy(1);
  try{
    const langs=[...S.langs];
    const txt=await callClaude([{type:'image',source:{type:'base64',media_type:'image/jpeg',data:cropImage(list)}},{type:'text',text:'Transcribe and translate.'}],sysPrompt(langs));
    const d=parseJSON(txt);
    if(!d)throw new Error('Die Antwort der KI war nicht lesbar. Bitte nochmal versuchen.');
    if(!String(d.de||'').trim())return;
    const now=findStrokes(pg,ids);if(!now.length)return;
    insertLineBlock(pg,now,d,langs);
  }catch(err){
    findStrokes(pg,ids).forEach(s=>s.done=false);
    toast(err.message,true);
  }finally{busy(-1);}
}
function insertLineBlock(pg,list,d,langs){
  const r=bboxOf(list);
  const w=Math.min(Math.max(r.x1-r.x0+20,420),view.w-24);
  const x=Math.min(Math.max(r.x0-4,8),view.w-w-12);
  const b={id:uid(),x,y:r.y1+4,w,fs:S.fs,de:String(d.de),tr:{},langs:[],src:list.map(s=>s.id),typed:false};
  langs.forEach(c=>{if(d[c]){b.tr[c]=String(d[c]);b.langs.push(c);}});
  layoutBlock(b);
  pushHistoryFor(pg);
  shiftBelow(pg,r.y1,b.h+10,new Set(b.src));
  pg.blocks.push(b);
  redraw();save();
}
function scheduleAuto(){
  clearTimeout(autoT);
  if(!S.auto)return;
  autoT=setTimeout(function f(){
    if(penDown||curS||erasing){autoT=setTimeout(f,500);return;}
    translatePending(false);
  },S.pause*1000);
}

/* ---------- Getippter Text & Bearbeiten ---------- */
async function translateText(de,langs){
  const txt=await callClaude([{type:'text',text:'German text:\n'+de}],sysPrompt(langs));
  const d=parseJSON(txt);
  if(!d)throw new Error('Die Antwort der KI war nicht lesbar. Bitte nochmal versuchen.');
  return d;
}

function openBlockModal(b){
  const pg=page();

  openModal({title:'Übersetzung ändern',html:`<label for="bde">Deutscher Text (so wurde er erkannt)</label><textarea id="bde" rows="3">${esc(b.de)}</textarea><div class="note">Falsch erkannt? Text hier korrigieren (auch mit dem Apple Pencil möglich) und neu übersetzen lassen.</div><div class="sec">${trs}</div>`,
    buttons:[
      {label:'Löschen',danger:true,fn:()=>{pushHistory();pg.blocks=pg.blocks.filter(x=>x!==b);redraw();save();}},
      {label:'Schließen'},
      {label:'Neu übersetzen',primary:true,fn:box=>{
        const t=box.querySelector('#bde').value.trim();if(!t)return false;
        if(needKey())return false;
        const langs=[...S.langs];busy(1);
        translateText(t,langs).then(d=>{
          if(!pg.blocks.includes(b))return;
          pushHistoryFor(pg);
          const old=b.h;b.de=t;b.tr={};b.langs=[];
          langs.forEach(c=>{if(d[c]){b.tr[c]=String(d[c]);b.langs.push(c);}});
          layoutBlock(b);
          if(b.h!==old)shiftBelow(pg,b.y+old,b.h-old,new Set(),b.id);
          redraw();save();
        }).catch(err=>toast(err.message,true)).finally(()=>busy(-1));
      }}]});
}

/* ================= Lasso ================= */
let sel=null,lz=null,lassoPts=null;
function clearSel(){sel=null;lz=null;lassoPts=null;const b=$('selbar');if(b)b.style.display='none';redraw();}
function selItems(){const pg=page();return{ss:pg.strokes.filter(s=>sel.ids.has(s.id)),bs:pg.blocks.filter(b=>sel.bids.has(b.id))};}
function selBBox(){
  if(!sel)return null;
  const {ss,bs}=selItems();if(!ss.length&&!bs.length)return null;
  const r={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  ss.forEach(s=>{r.x0=Math.min(r.x0,s.x0);r.y0=Math.min(r.y0,s.y0);r.x1=Math.max(r.x1,s.x1);r.y1=Math.max(r.y1,s.y1);});
  bs.forEach(b=>{r.x0=Math.min(r.x0,b.x);r.y0=Math.min(r.y0,b.y);r.x1=Math.max(r.x1,b.x+b.w);r.y1=Math.max(r.y1,b.y+b.h);});
  return r;
}
function pip(poly,x,y){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;
  }
  return c;
}
function finishLasso(){
  const poly=lassoPts;lassoPts=null;
  if(!poly||poly.length<8){redraw();return;}
  const pg=page(),ids=new Set(),bids=new Set();
  pg.strokes.forEach(s=>{
    const p=s.pts;let n=0,t=0;
    for(let i=0;i<p.length;i+=3){t++;if(pip(poly,p[i],p[i+1]))n++;}
    if(t&&n/t>=0.5)ids.add(s.id);
  });
  pg.blocks.forEach(b=>{
    const own=b.src.length&&b.src.every(id=>ids.has(id));
    if(own||pip(poly,b.x+b.w/2,b.y+b.h/2))bids.add(b.id);
  });
  if(!ids.size&&!bids.size){toast('Nichts markiert. Umkreise die Schrift ganz.');redraw();return;}
  sel={ids,bids,pid:pg.id};redraw();
}
function moveSel(dx,dy){
  const {ss,bs}=selItems();
  ss.forEach(s=>{const p=s.pts;for(let i=0;i<p.length;i+=3){p[i]=+(p[i]+dx).toFixed(1);p[i+1]=+(p[i+1]+dy).toFixed(1);}s.x0+=dx;s.x1+=dx;s.y0+=dy;s.y1+=dy;});
  bs.forEach(b=>{b.x+=dx;b.y+=dy;});
}
function scaleSel(f){
  const {ss}=selItems(),r=lz.r;
  ss.forEach((s,i)=>{
    const o=lz.orig[i],p=s.pts;
    for(let k=0;k<p.length;k+=3){p[k]=+(r.x0+(o.pts[k]-r.x0)*f).toFixed(1);p[k+1]=+(r.y0+(o.pts[k+1]-r.y0)*f).toFixed(1);}
    s.w=Math.max(1.5,o.w*f);bb(s);
  });
}
function lassoDown(e,p){
  if(sel){
    const r=selBBox();
    if(r){

const TC='#64748b',TL='#cbd5e1';
let tplErr='';
function dens(pts){
  const out=[];
  for(let i=0;i<pts.length;i++){
    const x=pts[i][0],y=pts[i][1];
    if(i===0){out.push(+x.toFixed(1),+y.toFixed(1),0.5);continue;}
    const px=pts[i-1][0],py=pts[i-1][1],n=Math.max(1,Math.ceil(Math.hypot(x-px,y-py)/24));
    for(let k=1;k<=n;k++)out.push(+(px+(x-px)*k/n).toFixed(1),+(py+(y-py)*k/n).toFixed(1),0.5);
  }
  return out;
}
function tStroke(pg,pts,c,w){const s={id:uid(),c:c||TC,w:w||3,pts:dens(pts),done:true};bb(s);pg.strokes.push(s);return s;}
function tRect(pg,x,y,w,h,c,wd){return tStroke(pg,[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]],c,wd);}
function tLine(pg,x1,y1,x2,y2,c,wd){return tStroke(pg,[[x1,y1],[x2,y2]],c,wd);}
function tEllipse(pg,cx,cy,rx,ry,c,wd){
  const p=[];for(let i=0;i<=56;i++){const a=i/56*Math.PI*2;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}
  return tStroke(pg,p,c,wd);
}
function tArrow(pg,x1,y1,x2,y2,c,wd){
  tLine(pg,x1,y1,x2,y2,c,wd);
  const a=Math.atan2(y2-y1,x2-x1);
  tStroke(pg,[[x2-18*Math.cos(a-0.5),y2-18*Math.sin(a-0.5)],[x2,y2],[x2-18*Math.cos(a+0.5),y2-18*Math.sin(a+0.5)]],c,wd);
}
async function mkLabel(text,w,o){
  o=o||{};
  const b={id:uid(),x:0,y:0,w,fs:o.fs||S.fs,de:text,tr:{},langs:[],src:[],typed:true,flat:!!o.flat,bold:!!o.bold};
  if(o.tr&&S.langs.length){
    try{
      const d=await translateText(text,[...S.langs]);
      S.langs.forEach(c=>{if(d[c]){b.tr[c]=String(d[c]);b.langs.push(c);}});
    }catch(err){tplErr=err.message;}
  }
  layoutBlock(b);return b;
}

async function tplTable(pg,P,o){
  const heads=[o.h1,o.h2,o.h3].map(h=>(h||'').trim()).filter(Boolean);
  const cols=Math.max(2,heads.length);while(heads.length<cols)heads.push('');
  const colW=P.W/cols;
  const bl=await Promise.all(heads.map(h=>h?mkLabel(h,colW-16,{tr:o.tr}):null));
  const hh=Math.max(40,...bl.map(b=>b?b.h:0))+12;
  const rows=+o.rows||5,rowH=72,H=hh+rows*rowH;
  tRect(pg,P.x,P.y,P.W,H,TC,3);
  tLine(pg,P.x,P.y+hh,P.x+P.W,P.y+hh,TC,3);
  for(let i=1;i<cols;i++)tLine(pg,P.x+colW*i,P.y,P.x+colW*i,P.y+H,TC,3);
  for(let r=1;r<rows;r++)tLine(pg,P.x,P.y+hh+r*rowH,P.x+P.W,P.y+hh+r*rowH,TL,2);
  bl.forEach((b,i)=>{if(!b)return;b.x=P.x+colW*i+8;b.y=P.y+6;pg.blocks.push(b);});
  return H;
}
async function tplMind(pg,P,o){
  const n=Math.min(8,Math.max(3,+o.n||5));
  const H=Math.max(520,Math.min(640,P.W*0.55)),cx=P.x+P.W/2,cy=P.y+H/2;
  const t=(o.center||'').trim(),cb=t?await mkLabel(t,260,{tr:o.tr,flat:true,bold:true}):null;
  const crx=150,cry=Math.max(70,(cb?cb.h:40)/2+22);
  tEllipse(pg,cx,cy,crx,cry,'#334155',4);
  if(cb){cb.x=cx-130;cb.y=cy-cb.h/2;pg.blocks.push(cb);}
  const Rx=P.W/2-150,Ry=H/2-60,brx=130,bry=50;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n,bx=cx+Rx*Math.cos(a),by=cy+Ry*Math.sin(a);
    tEllipse(pg,bx,by,brx,bry,TC,3);
    const ang=Math.atan2(by-cy,bx-cx);
    tLine(pg,cx+crx*Math.cos(ang),cy+cry*Math.sin(ang),bx-brx*Math.cos(ang),by-bry*Math.sin(ang),TC,3);
  }
  return H;
}
const KALK=[['Listeneinkaufspreis (netto)',0],['− Liefererrabatt',0],['= Zieleinkaufspreis',1],['− Liefererskonto',0],['= Bareinkaufspreis',1],['+ Bezugskosten',0],['= Bezugspreis (Einstandspreis)',1],['+ Handlungskosten',0],['= Selbstkostenpreis',1],['+ Gewinn',0],['= Barverkaufspreis',1],['+ Kundenskonto',0],['+ Vertreterprovision',0],['= Zielverkaufspreis',1],['+ Kundenrabatt',0],['= Listenverkaufspreis (netto)',1],['+ Umsatzsteuer',0],['= Bruttoverkaufspreis',1]];
async function tplKalk(pg,P,o){
  const cut=({bezug:7,selbst:9,voll:KALK.length})[o.scope]||KALK.length;
  const rows=KALK.slice(0,cut);
  const W=Math.min(P.W,900),x=P.x+(P.W-W)/2,rh=46,hh=46,labW=W*0.56,pW=W*0.16;
  const H=hh+rows.length*rh;

  tLine(pg,x,P.y+hh,x+W,P.y+hh,TC,3);
  tLine(pg,x+labW,P.y,x+labW,P.y+H,TC,3);tLine(pg,x+labW+pW,P.y,x+labW+pW,P.y+H,TC,3);
  const heads=[['Kalkulationsschema',x+8,labW-16],['%',x+labW+8,pW-16],['€',x+labW+pW+8,W-labW-pW-16]];
  for(const h of heads){
    const b=await mkLabel(h[0],h[2],{flat:true,bold:true,fs:22});b.x=h[1];b.y=P.y+(hh-b.h)/2;pg.blocks.push(b);

}
async function tplStunde(pg,P,o){
  const secs=[[o.s1||'Thema',110],[o.s2||'Das lernen wir heute',150],[o.s3||'Aufgaben',230]];

async function tplZeilen(pg,P,o){

  for(let i=1;i<=n;i++)tLine(pg,P.x,P.y+i*gap,P.x+P.W,P.y+i*gap,TL,2);

async function tplAblauf(pg,P,o){
  const steps=[o.a1,o.a2,o.a3,o.a4,o.a5].map(s=>(s||'').trim()).filter(Boolean);
  const k=Math.max(2,steps.length);while(steps.length<k)steps.push('');
  const gap=48,bw=(P.W-gap*(k-1))/k;
  const bl=await Promise.all(steps.map(s=>s?mkLabel(s,bw-16,{tr:o.tr}):null));
  const hh=Math.max(40,...bl.map(b=>b?b.h:0))+12,H=hh+120;
  for(let i=0;i<k;i++){
    const bx=P.x+i*(bw+gap);tRect(pg,bx,P.y,bw,H,TC,3);

}

  live.busy=true;
  try{
    const lines=liveLines(),sl=JSON.stringify(lines);
    let changed=false;
    if(sl!==live.sigL){await fb('PUT','lines',lines);live.sigL=sl;live.rev++;changed=true;}
    if(S.liveImg){
      const si=imgSig();
      if(si!==live.sigI){
        if(Date.now()-live.lastImg<3000){live.again=true;}
        else{await fb('PUT','img',liveImage());live.sigI=si;live.imgRev++;live.lastImg=Date.now();changed=true;}
      }
    }
    if(changed)await fb('PUT','meta',{rev:live.rev,imgRev:live.imgRev,pg:pi+1,pages:pages.length,langs:S.langs,img:!!S.liveImg,ts:Date.now()});
    if(live.err){live.err=false;toast('Live-Verbindung wieder da.');}
  }catch(err){
    if(!live.err){live.err=true;toast('Live: '+err.message,true);}
    live.again=true;
  }
  finally{live.busy=false;if(live.again){live.again=false;setTimeout(liveDirty,live.err?4000:3300);}}
}

function bcInk(s){

/* ----- Tafel-Fenster-Modus (läuft im zweiten Fenster) ----- */
const bp={strokes:[],blocks:[]},bv={x:0,y:0,z:1,w:1180,h:820},bl={pts:[],on:false,raf:0};
function boardScene(m){
  bp.strokes=m.strokes.map(s=>{const o={id:s.id,c:s.c,w:s.w,pts:s.pts,hl:s.hl,done:true};bb(o);return o;});
  bp.blocks=m.blocks.map(b=>{const o=Object.assign({},b);o.tr=o.tr||{};o.src=o.src||[];layoutBlock(o);return o;});
  redraw();
}
function boardDraw(){
  const cw=view.w,ch=view.h;
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.fillStyle='#e5e9f0';ctx.fillRect(0,0,cw,ch);
  const rw=bv.w/bv.z,rh=bv.h/bv.z,zb=Math.min(cw/rw,ch/rh),ox=(cw-rw*zb)/2,oy=(ch-rh*zb)/2;
  ctx.save();
  ctx.beginPath();ctx.rect(ox,oy,rw*zb,rh*zb);ctx.clip();
  ctx.fillStyle='#fff';ctx.fillRect(ox,oy,rw*zb,rh*zb);
  ctx.translate(ox,oy);ctx.scale(zb,zb);ctx.translate(-bv.x,0);
  paint(ctx,bp,bv.y,rh,true);
  ctx.translate(0,-bv.y);drawLaser(ctx,bl,zb);
  ctx.restore();
}
function startBoardMode(){
  document.documentElement.classList.add('boardmode');
  document.title='Tafel';
  resize();
  if(!BC){document.body.innerHTML='<p style="padding:40px;font:20px sans-serif">Dieser Browser unterstützt kein Tafel-Fenster.</p>';return;}
  BC.onmessage=e=>{
    const m=e.data;if(!m)return;
    if(m.t==='scene')boardScene(m);
    else if(m.t==='view'){bv.x=m.x;bv.y=m.y;bv.z=m.z;bv.w=m.w;bv.h=m.h;redraw();}
    else if(m.t==='ink'){
      let s=bp.strokes.find(x=>x.id===m.id);
      if(!s||m.from===0){bp.strokes=bp.strokes.filter(x=>x.id!==m.id);s={id:m.id,c:m.c,w:m.w,hl:m.hl,pts:[],done:true};bp.strokes.push(s);}
      for(let i=0;i<m.pts.length;i++)s.pts.push(m.pts[i]);
      bb(s);redraw();
    }
    else if(m.t==='laser'){bl.on=true;bl.pts.push({x:m.x,y:m.y,t:performance.now(),brk:m.brk});if(bl.pts.length>90)bl.pts.shift();laserLoop(bl);}
    else if(m.t==='laser-off'){bl.on=false;laserLoop(bl);}
  };
  BC.postMessage({t:'hello'});
  document.addEventListener('dblclick',()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});});
}
function startTeacherBc(){
  if(!BC)return;
  BC.onmessage=e=>{if(e.data&&e.data.t==='hello'){bcSig='';BC.postMessage(audScene());bcView(true);}};
}

/* ================= Stunde automatisch erstellen ================= */
const SOLC='#15803d';
function mkB(text,w,o){
  o=o||{};
  const b={id:uid(),x:0,y:0,w,fs:o.fs||24,de:text,tr:{},langs:[],src:[],typed:true,flat:o.flat!==false,bold:!!o.bold,col:o.col};
  if(o.tr)S.langs.forEach(c=>{if(o.tr[c]){b.tr[c]=String(o.tr[c]);b.langs.push(c);}});
  layoutBlock(b);return b;
}
function buildLesson(spec,o){
  o=o||{};
  const pg={id:uid(),strokes:[],blocks:[]};
  const W=Math.min(view.w-48,1100),X=(view.w-W)/2,CW=W-28,CX=X+14;
  let y=24,G=0,cur={g:0,hid:false};
  const tag=x=>{if(cur.g)x.g=cur.g;if(cur.hid)x.hid=true;return x;};
  const addB=(b,x,yy)=>{b.x=x;b.y=yy;pg.blocks.push(tag(b));return b;};
  const rect=(x,yy,w,h,c,wd)=>tag(tRect(pg,x,yy,w,h,c,wd));
  const line=(x1,y1,x2,y2,c,wd)=>tag(tLine(pg,x1,y1,x2,y2,c,wd));
  const hideFrom=o.hideAll===false?1e9:(spec.revealFrom==null?2:spec.revealFrom);
  const secs=(spec.sections||[]).filter(sc=>!(o.mode==='key'&&sc.level==='detail'));

  cur={g:++G,hid:false};
  const tb=addB(mkB(spec.title||'Stunde',W,{fs:40,bold:true}),X,y);y+=tb.h+2;
  if(spec.sub){const sb=addB(mkB(spec.sub,W,{fs:22,col:'#64748b'}),X,y);y+=sb.h;}
  line(X,y+8,X+W,y+8,'#334155',4);y+=30;

  secs.forEach((sc,idx)=>{
    const gm=++G,gs=++G,hidden=idx>=hideFrom;
    const main=()=>{cur={g:gm,hid:hidden};},sol=()=>{cur={g:gs,hid:true};};
    main();
    const top=y;
    const hb=addB(mkB(sc.heading||'',CW,{flat:false,fs:22}),CX,y+10);y+=hb.h+20;
    const T=sc.type;
    if(T==='goal'||T==='text'){
      (sc.items||[]).forEach(it=>{
        const o2=typeof it==='string'?{de:it}:it;
        const pre=T==='goal'?'☐ ':'• ';
        const b=addB(mkB(pre+o2.de,CW-6,{fs:24,tr:o2.tr}),CX+4,y);y+=b.h+8;
      });
    }else if(T==='note'){
      const b=addB(mkB(sc.de||'',CW-10,{fs:24,bold:true,tr:sc.tr}),CX+4,y);y+=b.h+8;
    }else if(T==='terms'){
      const bw=(CW-16)/2,its=sc.items||[];
      for(let i=0;i<its.length;i+=2){
        const a=mkB(its[i].de,bw,{flat:false,fs:20,tr:its[i].tr}),
              b=its[i+1]?mkB(its[i+1].de,bw,{flat:false,fs:20,tr:its[i+1].tr}):null;
        addB(a,CX,y);if(b)addB(b,CX+bw+16,y);
        y+=Math.max(a.h,b?b.h:0)+10;
      }
    }else if(T==='task'){
      if(sc.text){const b=addB(mkB(sc.text,CW-6,{fs:24}),CX+4,y);y+=b.h+10;}
      (sc.questions||[]).forEach(q=>{
        const qb=addB(mkB(q.q,CW-6,{fs:24,bold:true}),CX+4,y);y+=qb.h+8;
        const n=q.lines||1;
        sol();const sb=q.a?mkB(q.a,CW-16,{fs:24,bold:true,col:SOLC}):null;
        const area=Math.max(n*46,sb?sb.h+14:0);
        if(sb)addB(sb,CX+10,y+2);
        main();
        for(let k=1;k<=Math.max(1,Math.round(area/46));k++)line(CX+4,y+k*46-8,CX+CW-4,y+k*46-8,TL,2);
        y+=area+14;
      });
    }else if(T==='table'){
      if(sc.text){const b=addB(mkB(sc.text,CW-6,{fs:24}),CX+4,y);y+=b.h+10;}
      const cols=sc.cols||[],nc=cols.length,wts=sc.widths&&sc.widths.length===nc?sc.widths:cols.map(()=>1/nc);
      const tot=wts.reduce((a,b)=>a+b,0),cw=wts.map(w=>CW*w/tot),cx=[];
      let acc=CX;cw.forEach(w=>{cx.push(acc);acc+=w;});
      const fsT=nc>=4?19:21;
      const rows=[cols.map(c=>({t:c,head:true}))].concat((sc.rows||[]).map(r=>r.map(c=>typeof c==='string'?{t:c}:{t:c.a||'',a:true})));
      const t0=y;let rowTop=y;const rowYs=[y];
      rows.forEach(r=>{
        let rh=0;const made=[];
        r.forEach((c,i)=>{
          if(!c.t){made.push(null);return;}
          const b=mkB(c.t,cw[i]-16,{fs:fsT,bold:!!c.head,col:c.a?SOLC:undefined});
          if(c.a&&!c.head)b.bold=true;
          made.push({b,sol:!!c.a});rh=Math.max(rh,b.h);
        });
        rh=Math.max(r[0]&&r[0].head?44:58,rh+16);
        made.forEach((m,i)=>{
          if(!m)return;
          if(m.sol)sol();else main();
          addB(m.b,cx[i]+8,rowTop+8);
        });
        main();rowTop+=rh;rowYs.push(rowTop);
      });
      rect(CX,t0,CW,rowTop-t0,TC,3);
      rowYs.slice(1,-1).forEach((ry,i)=>line(CX,ry,CX+CW,ry,i===0?TC:TL,i===0?3:2));
      cx.slice(1).forEach(x=>line(x,t0,x,rowTop,TC,3));
      y=rowTop+10;
    }else if(T==='diagram'){
      if(sc.text){const b=addB(mkB(sc.text,CW-6,{fs:22,col:'#475569'}),CX+4,y);y+=b.h+10;}
      const its=(sc.items||[]).map(x=>typeof x==='string'?{t:x}:x);
      const arrow=(x1,y1,x2,y2,c)=>{
        line(x1,y1,x2,y2,c||'#475569',3);
        const a=Math.atan2(y2-y1,x2-x1);
        line(x2,y2,x2-16*Math.cos(a-0.5),y2-16*Math.sin(a-0.5),c||'#475569',3);
        line(x2,y2,x2-16*Math.cos(a+0.5),y2-16*Math.sin(a+0.5),c||'#475569',3);
      };
      const node=(it,x,yy,w,col)=>{
        const b=mkB(it.t,w-16,{fs:21,bold:true,col:col});
        const hh=Math.max(52,b.h+(it.sub?0:0)+18);
        let h=hh;
        if(it.sub){var sb=mkB(it.sub,w-16,{fs:18,col:'#475569'});h=hh+sb.h+4;}
        rect(x,yy,w,h,col||TC,3);
        addB(b,x+8,yy+9);
        if(sb)addB(sb,x+8,yy+9+b.h+4);
        return h;
      };
      if(sc.layout==='mindmap'){
        const cw=CW*0.30,cxm=CX+(CW-cw)/2,ow=CW*0.30;
        const left=its.filter((_,i)=>i%2===0),right=its.filter((_,i)=>i%2===1);
        const rows=Math.max(left.length,right.length,1),rowH=96;
        const mid=y+rows*rowH/2;
        const ctr=mkB(sc.center||sc.heading||'',cw-20,{fs:24,bold:true});
        const ch=Math.max(64,ctr.h+20);
        rect(cxm,mid-ch/2,cw,ch,'#ea580c',4);addB(ctr,cxm+10,mid-ch/2+10);
        [[left,CX,1],[right,CX+CW-ow,0]].forEach(([arr,x0,isL])=>{
          arr.forEach((it,i)=>{
            const yy=y+(i+0.5)*(rows*rowH/arr.length)-30;
            const h=node(it,x0,yy,ow,'#1d4ed8');
            if(isL)arrow(x0+ow,yy+h/2,cxm,mid,'#94a3b8');else arrow(x0,yy+h/2,cxm+cw,mid,'#94a3b8');
          });
        });
        y+=rows*rowH+10;
      }else{
        const per=Math.min(sc.perRow||4,Math.max(1,its.length)),gap=40;
        const bw=(CW-8-(per-1)*gap)/per;
        for(let i=0;i<its.length;i+=per){
          const row=its.slice(i,i+per);let rh=0;
          const xs=row.map((_,k)=>CX+4+k*(bw+gap));
          const hs=row.map((it,k)=>node(it,xs[k],y,bw,'#1d4ed8'));
          rh=Math.max(...hs);
          row.forEach((_,k)=>{if(k<row.length-1)arrow(xs[k]+bw+4,y+hs[k]/2,xs[k+1]-4,y+hs[k+1]/2);});
          if(i+per<its.length)arrow(xs[row.length-1]+bw/2,y+hs[row.length-1],xs[row.length-1]+bw/2,y+rh+26);
          y+=rh+(i+per<its.length?34:6);
        }
        y+=8;
      }
    }else if(T==='mc'){
      (sc.questions||[]).forEach(q=>{
        const qb=addB(mkB(q.q,CW-6,{fs:23,bold:true}),CX+4,y);y+=qb.h+6;
        (q.options||[]).forEach((op,i)=>{
          const b=addB(mkB((i+1)+'  '+op,CW-50,{fs:22}),CX+44,y);
          if(i===q.correct){sol();addB(mkB('✓',36,{fs:28,bold:true,col:SOLC}),CX+6,y-2);main();}
          y+=b.h+4;
        });
        y+=10;
      });
    }
    main();
    const hFrame=y-top+4;
    rect(X,top,W,hFrame,sc.type==='note'?'#ea580c':TC,sc.type==='note'?4:2);
    y=top+hFrame+22;
  });
  const cur0=page();
  if(cur0&&!cur0.strokes.length&&!cur0.blocks.length)pages[pi]=pg;else{pages.splice(pi+1,0,pg);pi++;}
  hist.delete(pg.id);
  resetView();save();
  return pg;
}
function lessonPrompt(langs,mode){
  const list=langs.map(c=>`"${c}" = ${LANGS[c].n}`).join(', ');
  return `You create a classroom whiteboard ("Tafelbild") for ONE double lesson (90 minutes) at a German vocational school (Berufsschule, retail sales / Einzelhandel) from the teaching material you receive. The learners are weak and many are non-native speakers, so use short, simple German (max. about 15 words per line) and keep the technical terms.
Answer with exactly ONE JSON object and nothing else (no markdown fences):
{"format":"tafel-stunde","version":1,"title":"…","sub":"Lernfeld · Modul · Buchseiten","sections":[ … ]}
Level of detail: every section has "level": "key" (essential key learning point) or "detail" (additional explanation, e.g. a diagram).
MODE_PLACEHOLDER
Section types (every section has "type", "heading" and "level"):
- "goal": {"items":[{"de":"…","tr":{…}}]}  learning goals ("Das kann ich danach")
- "text": {"items":["plain German string" or {"de":"…","tr":{…}}]}  short bullet lines
- "task": {"text":"optional intro","questions":[{"q":"…","a":"short model answer","lines":2}]}
- "table": {"text":"optional intro","cols":["…"],"widths":[0.3,0.35,0.35],"rows":[[cell,…]]}  a cell is "text shown at once", {"a":"text shown only when the teacher reveals the solution"} or ""
- "terms": {"items":[{"de":"die Verkaufsform","tr":{…}}]}  key vocabulary
- "note": {"de":"…","tr":{…}}  a "Merke" box
- "diagram": {"layout":"flow"|"mindmap","text":"optional one-line caption","center":"centre of a mindmap","items":[{"t":"short box text","sub":"optional 1 short line"}]}  a Schaubild: "flow" = steps/process/cycle shown as boxes with arrows (max 8 boxes, "perRow" 3 or 4); "mindmap" = a central term with 4 to 6 branches. Box texts are max 6 words.
- "mc": {"questions":[{"q":"…","options":["…","…"],"correct":0}]}  multiple choice, "correct" is the 0-based index
Rules:
1. Order the sections like the lesson: Einstieg, Erarbeitung, Übung, Sicherung. Use 8 to 14 sections.
2. Give model solutions ("a", {"a":…}, "correct"). They stay hidden until the teacher reveals them.
3. "tr" holds translations with the keys ${list}. Add them for goals, key terms, "Merke" notes and the most important sentences, not for everything. Keep numbers and German technical terms recognisable (German term in brackets).
4. Use only the content of the material. Do not invent facts, numbers or tasks.`.replace('MODE_PLACEHOLDER',mode==='key'?'MODE: ONLY KEY LEARNING POINTS (for the end of a lesson). Ignore rule 1. Create only 3 to 5 sections, all with level "key": one "text" section with at most 5 short key sentences (with "tr"), one "terms" section with the most important terms, optionally one "note" (Merke). No tasks, no tables, no diagrams.':'MODE: KEY POINTS PLUS DIAGRAMS. Mark the essential key learning points as level "key". Add 1 to 3 diagram sections (level "detail") for the most important processes, relationships or structures in the material, only where a picture explains better than text; mark other deepening sections as "detail" too.');
}
function pickText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f);});}
function pickB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}
async function generateLesson(files,txt,topic,hideAll,model,mode){
  busy(1,'Stunde wird erstellt … (bis zu 2 Minuten)');
  try{
    const content=[];
    for(const f of files){
      const n=f.name.toLowerCase();
      if(n.endsWith('.pdf'))content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:await pickB64(f)}});
      else if(/\.(png|jpe?g)$/.test(n))content.push({type:'image',source:{type:'base64',media_type:n.endsWith('png')?'image/png':'image/jpeg',data:await pickB64(f)}});
      else if(/\.(txt|md|csv)$/.test(n))content.push({type:'text',text:'Material ('+f.name+'):\n'+await pickText(f)});
      else throw new Error('„'+f.name+'“ kann ich nicht lesen. Bitte als PDF, Bild oder Textdatei speichern.');
    }
    if(txt)content.push({type:'text',text:'Material (eingefügter Text):\n'+txt});
    content.push({type:'text',text:(topic?'Thema / Wunsch: '+topic+'\n':'')+'Erstelle jetzt das Tafelbild als JSON.'});
    const langs=[...S.langs];
    const out=await callClaude(content,lessonPrompt(langs,mode),14000,model);
    const d=parseJSON(out);
    if(!d||!Array.isArray(d.sections))throw new Error('Die Antwort der KI war kein gültiges Tafelbild. Bitte nochmal versuchen.');
    d.hideAll=hideAll;
    buildLesson(d,{hideAll,mode});
    tool='reveal';updateBar();
    toast('Tafelbild erstellt: '+groupsInfo().length+' Schritte. Mit „Weiter“ deckst du auf.');
  }catch(err){toast(err.message,true);}
  finally{busy(-1);}
}

function clonePage(d){
  const map={},nid=old=>map[old]||(map[old]=uid());
  return hydrate({id:uid(),
    strokes:(d.strokes||[]).map(s=>Object.assign({},s,{id:nid(s.id)})),
    blocks:(d.blocks||[]).map(b=>Object.assign({},b,{id:uid(),src:(b.src||[]).map(nid)}))},true);
}
function importData(d){
  if(d&&(d.format==='tafel-stunde'||Array.isArray(d.sections))){
    buildLesson(d,{hideAll:d.hideAll!==false});tool='reveal';updateBar();
    toast('Stunde eingefügt: '+groupsInfo().length+' Schritte. Mit „Weiter“ deckst du auf.');
  }else if(d&&Array.isArray(d.pages)){
    d.pages.forEach(p=>{pages.splice(pi+1,0,clonePage(p));pi++;});
    resetView();save();toast('Tafelbild importiert.');
  }else throw new Error('Das ist keine Tafelbild-Datei.');
}

/* ================= PDF-Export (ohne Fremdbibliothek) ================= */
function sliceCuts(pg,H,sliceH){
  const iv=[];
  pg.strokes.forEach(s=>iv.push([s.y0,s.y1]));
  pg.blocks.forEach(b=>iv.push([b.y,b.y+b.h]));
  const free=c=>!iv.some(([a,b])=>a<=c&&c<=b);
  const cuts=[0];let y=0;
  while(y+sliceH<H){
    const target=y+sliceH;let best=target;
    for(let c=target;c>y+sliceH*0.55;c-=4)if(free(c)){best=c;break;}
    cuts.push(best);y=best;
  }
  cuts.push(H);return cuts;
}
function buildPDF(pgs,PW,PH){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const b=typeof d==='string'?enc.encode(d):d;parts.push(b);len+=b.length;};
  const add=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('\nendobj\n');};
  const n=pgs.length;
  push('%PDF-1.4\n');
  add(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  add(2,()=>push('<< /Type /Pages /Kids ['+pgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  pgs.forEach((p,i)=>{
    const pid=3+3*i,cid=4+3*i,iid=5+3*i;
    add(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const content=`q ${p.dw.toFixed(2)} 0 0 ${p.dh.toFixed(2)} ${p.x.toFixed(2)} ${p.y.toFixed(2)} cm /Im0 Do Q`;
    add(cid,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    add(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);push(p.jpg);push('\nendstream');});
  });
  const xref=len,total=3*n+3;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function exportPDF(list,o){
  o=o||{};
  toast('PDF wird erstellt …');
  await sleep(50);
  try{
    for(const pg0 of (list||pages))for(const b0 of pg0.blocks)if(b0.img)await loadImg(b0);
    const W=o.W||view.w,scale=Math.min(2,1800/W);
    const PW=o.portrait?595.28:841.89,PH=o.portrait?841.89:595.28,M=24,dw=PW-2*M,dh=PH-2*M,sliceH=Math.floor(W*dh/dw);
    const out=[];
    if(!list||!list.length)list=[pages[0]];
    for(const pg of list){
      const H=Math.max(contentBottom(pg)+24,80),cuts=sliceCuts(pg,H,sliceH);
      for(let i=0;i<cuts.length-1;i++){
        const y0=cuts[i],hh=cuts[i+1]-y0;
        const c=document.createElement('canvas');c.width=Math.round(W*scale);c.height=Math.max(8,Math.round(hh*scale));
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.scale(scale,scale);
        paint(g,pg,y0,hh,null);
        const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
        const jpg=new Uint8Array(await blob.arrayBuffer());
        const dhp=hh*dw/W;
        out.push({jpg,w:c.width,h:c.height,dw,dh:dhp,x:M,y:PH-M-dhp});
      }
    }
    const pdf=buildPDF(out,PW,PH);
    const name=(o.name||'Tafelbild_')+new Date().toISOString().slice(0,10)+'.pdf';
    showDownload(pdf,name,'PDF ist fertig',out.length+' PDF-Seite'+(out.length===1?'':'n')+(o.portrait?' (A4 hoch).':' (A4 quer).'));
  }catch(err){toast('PDF-Export fehlgeschlagen: '+err.message,true);}
}

  im.forEach(b=>{const cx=b.x+b.w/2;b.w=Math.max(80,Math.min(view.w-16,Math.round(b.w*f)));b.x=Math.max(4,Math.min(view.w-b.w-4,cx-b.w/2));layoutBlock(b);});

function readImgFile(f){
  return new Promise((res,rej)=>{
    if(!f||!/^image\//.test(f.type||'image/')){rej(new Error('Das ist kein Bild.'));return;}
    const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Bild nicht lesbar.'));r.readAsDataURL(f);

}

      cw.onpointermove=e=>{
        if(!a)return;const r=cw.getBoundingClientRect();

        const L=Math.min(a.x,x),T=Math.min(a.y,y),W=Math.abs(x-a.x),H=Math.abs(y-a.y);

      };
