/* ================= Live-Quiz mit Schüler-Handys (wie Kahoot) ================= */
async function liveQuizStart(qz,box){
  const base=fbBase(box.querySelector('#qfb').value||S.fbUrl||'');
  if(!/^https:\/\/[^\/]+\.[a-z]+/i.test(base)&&!/^http:\/\/localhost/.test(base)){toast('Bitte die Firebase-Adresse eintragen (siehe „Live“).',true);return;}
  const lim=+box.querySelector('#qlim').value||20;
  const p=await quizPrepared(qz,box);if(!p)return;
  S.fbUrl=base;saveSettings();
  const code='q'+genCode();
  const R=(path)=>`${base}/rooms/${code}/${path}.json`;
  const put=async(path,v)=>{const r=await fetch(R(path),{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw new Error('Firebase '+r.status);};
  const getj=async path=>{const r=await fetch(R(path),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();};
  const items=p.items;
  busy(1,'Quiz wird bereitgestellt …');
  try{
    await put('quiz',{title:qz.title||'Quiz',langs:p.langs||[],lim,items:items.map(it=>({q:it.q,opts:it.opts,qx:it.qx||[],ox:it.ox||[]}))});
    await put('state',{phase:'lobby',i:-1,n:items.length,ts:Date.now()});
  }catch(err){busy(-1);toast('Verbindung zu Firebase fehlgeschlagen: '+err.message,true);return;}
  busy(-1);closeModal();
  const link=location.href.split(/[?#]/)[0]+'?quiz='+code+'&db='+encodeURIComponent(base);
  const root=document.createElement('div');
  root.style.cssText='position:fixed;inset:0;z-index:60;background:#f4f6fa;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px 16px;font-family:inherit;-webkit-user-select:none;user-select:none;overflow:auto';
  document.body.appendChild(root);
  const COLS=['#dc2626','#2563eb','#d97706','#15803d'];
  let st={phase:'lobby',i:-1},players={},answers={},scores={},t0=0,timer=null,poll=null,alive=true,t0s=0;
  const names=()=>Object.keys(players).length;
  const setSt=async o=>{st=Object.assign({n:items.length},o);await put('state',st);};
  const qr=()=>{const q=qrcode(0,'M');q.addData(link);q.make();return q.createSvgTag({cellSize:6,margin:3,scalable:true});};
  const topBar=(txt)=>`<div style="display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:600;gap:8px"><span>${txt}</span><span>${names()} Spieler</span><button class="btn" id="qxit" style="min-height:40px">Beenden</button></div>`;
  const bindExit=()=>{const x=root.querySelector('#qxit');if(x)x.onclick=close;};
  async function close(){
    if(!confirm('Das Live-Quiz beenden?'))return;
    alive=false;clearInterval(timer);clearInterval(poll);root.remove();
    try{await fetch(`${base}/rooms/${code}.json`,{method:'DELETE'});}catch(e){}
  }
  function lobby(){
    const wide=!/^https?:/.test(location.protocol);
    root.innerHTML=topBar('Warteraum')+`<div style="flex:1;display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px">
      <div style="width:min(52vh,80vw);background:#fff">${qr()}</div>
      <div style="text-align:center;max-width:420px"><div style="font-size:20px">QR-Code scannen und Namen eingeben</div><div style="font-size:15px;margin-top:6px;color:#64748b;word-break:break-all">${esc(link)}</div>
      ${wide?'<div style="color:#b91c1c;margin-top:8px;font-size:14px">Die App ist nicht über eine Internetadresse geöffnet. Der Link funktioniert erst über GitHub Pages.</div>':''}
      <div id="qpl" style="margin-top:14px;font-size:18px;line-height:1.8"></div>
      <button class="btn primary" id="qgo" style="margin-top:12px;font-size:22px;min-height:56px;padding:0 28px">Quiz starten</button></div></div>`;
    bindExit();root.querySelector('#qgo').onclick=()=>{if(!names()&&!confirm('Noch niemand hat mitgemacht. Trotzdem starten?'))return;ask(0);};
    paintPl();
  }
  function paintPl(){const e=root.querySelector('#qpl');if(e)e.innerHTML=Object.values(players).slice(0,40).map(x=>`<span style="display:inline-block;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:2px 12px;margin:2px">${esc(x.name)}</span>`).join('')||'<span style="color:#64748b">Noch niemand da …</span>';const h=root.querySelector('span:nth-child(2)');if(h)h.textContent=names()+' Spieler';}
  async function ask(i){
    const it=items[i];answers={};t0=Date.now();
    await setSt({phase:'q',i,t0});
    view_q(i);
  }
  function view_q(i){
    const it=items[i];
    root.innerHTML=topBar('Frage '+(i+1)+' / '+items.length)+`<div style="display:flex;align-items:center;gap:14px;margin:10px 0"><div id="qtm" style="font-size:44px;font-weight:800;min-width:70px;text-align:center">${lim}</div><div style="flex:1;text-align:center;font-size:clamp(28px,5vw,54px);font-weight:800;line-height:1.3">${esc(it.q)}${xl(it.qx,0.42)}</div><div id="qan" style="font-size:20px;min-width:90px;text-align:center"></div></div>
    <div id="qg" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1">${it.opts.map((o,k)=>`<div style="background:${COLS[k]};color:#fff;border-radius:16px;font-size:clamp(20px,3.2vw,34px);font-weight:700;padding:14px;display:flex;flex-direction:column;justify-content:center"><div>${esc(o)}${xl((it.ox||[])[k],0.5)}</div></div>`).join('')}</div>
    <div style="text-align:center;margin-top:10px"><button class="btn primary" id="qrev" style="font-size:20px;min-height:52px;padding:0 24px">Auflösen</button></div>`;
    bindExit();root.querySelector('#qrev').onclick=()=>reveal(i);
    clearInterval(timer);timer=setInterval(()=>{
      const left=Math.max(0,lim-Math.floor((Date.now()-t0)/1000));const e=root.querySelector('#qtm');if(e)e.textContent=left;
      if(left<=0){clearInterval(timer);reveal(i);}

    const counts=[0,0,0,0];
    Object.entries(a).forEach(([id,x])=>{
      const ok=x.c===it.correct;if(x.c>=0&&x.c<4)counts[x.c]++;
      const pt=ok?Math.max(500,Math.round(1000*(1-Math.min(1,(x.ms||0)/(lim*1000))/2))):0;
      const s=scores[id]||(scores[id]={name:(players[id]||{}).name||'?',score:0,streak:0});
      s.score+=pt;s.last=pt;s.ok=ok;if(ok)s.right=(s.right||0)+1;s.streak=ok?s.streak+1:0;s.name=(players[id]||{}).name||s.name;
    });
    Object.keys(players).forEach(id=>{if(!a[id]){const s=scores[id]||(scores[id]={name:players[id].name,score:0,streak:0});s.last=0;s.ok=false;s.streak=0;s.no=true;}});
    const rank=Object.entries(scores).sort((x,y)=>y[1].score-x[1].score);
    rank.forEach(([id,s],k)=>{s.rank=k+1;});
    try{await put('scores',scores);await setSt({phase:'rev',i,corr:it.correct,counts,t0});}catch(e){toast('Verbindung gestört: '+e.message,true);}

const DEF_PLAN='https://templin-unterricht.github.io/templin-unterricht/';
async function planFetch(code){
  const m=/LF\s*(\d+)\D+M(?:odul)?\s*(\d+)/i.exec(code)||/LF\s*(\d+)\s*M\s*(\d+)/i.exec(code);
  if(!m)throw new Error('Bitte so eingeben: LF 1 M 10');
  const base=(S.planUrl||DEF_PLAN).replace(/\/+$/,'')+'/';
  let txt;
  try{const r=await fetch(base+'uebersicht_daten.js',{cache:'no-store'});if(!r.ok)throw new Error(r.status);txt=await r.text();}
  catch(e){throw new Error('Der Stundenplaner ist gerade nicht erreichbar ('+base+'). Ist die Seite online? Die Adresse kannst du in den Einstellungen ändern.');}
  let d;try{d=JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));}catch(e){throw new Error('Die Daten des Stundenplaners sind nicht lesbar.');}
  const g=(d.groups||[]).find(x=>x.id==='LF'+m[1]);if(!g)throw new Error('LF '+m[1]+' gibt es im Stundenplaner nicht.');
  let mod=null;(g.sections||[]).forEach(sc=>(sc.modules||[]).forEach(x=>{if(x.id==='M'+m[2])mod=x;}));
  if(!mod)throw new Error('Modul '+m[2]+' gibt es in LF '+m[1]+' nicht.');
  const pdfs=(mod.mats||[]).filter(x=>x.t==='pdf'&&/Aufgaben|L(ö|oe)sungen|Einstiegsmaterial/i.test(x.label)&&!(x.lang&&x.lang.length)).slice(0,3);
  if(!pdfs.length)throw new Error('Zu LF '+m[1]+' M '+m[2]+' sind keine PDF-Unterlagen verlinkt.');
  const files=[];
  for(const x of pdfs){
    try{const r=await fetch(base+x.u);if(!r.ok)throw 0;files.push(new File([await r.blob()],x.label+'.pdf',{type:'application/pdf'}));}
    catch(e){throw new Error('Die Datei „'+x.label+'“ konnte nicht geladen werden.');}
  }
  return {title:'LF '+m[1]+' · M '+m[2]+' · '+mod.title,topic:'Lernfeld '+m[1]+', Modul '+m[2]+': '+mod.title+'. '+(mod.blurb||''),files};
}
function planUi(box){
  const note=box.querySelector('.plan-note'),inp=box.querySelector('.plan-in');
  box.querySelector('.plan-btn').onclick=async()=>{
    note.textContent='Hole Unterlagen …';box.__plan=null;
    try{const p=await planFetch(inp.value);box.__plan=p;note.style.color='#15803d';note.textContent='✓ '+p.title+': '+p.files.length+' Dateien geladen ('+p.files.map(f=>f.name.replace(/\.pdf$/,'')).join(', ')+').';}
    catch(err){note.style.color='#b91c1c';note.textContent=err.message;}
  };
}

    setTimeout(()=>{qz.i++;qz.locked=false;renderQuiz();},ok?1100:2300);
  });
}
let ci=0,flip=false;
function cardList(){return lines.filter(l=>!l.url&&l.de&&l.de.length<=45&&l.de.indexOf('\n')<0&&(lang==='de'||(l.tr&&l.tr[lang])));}
function renderCards(){
  const box=$('s-cards'),t=T(lang),L=cardList();
  if(!L.length){box.innerHTML=`<div class="empty">${esc(t.empty)}</div>`;return;}
  if(ci>=L.length)ci=L.length-1;if(ci<0)ci=0;
  const l=L[ci],tr=(l.tr||{})[lang],back=flip&&lang!=='de'&&tr;
  const txt=back?tr:l.de,tl=back?lang:'de',rtl=back&&lang==='ar';
  box.innerHTML=`<div class="fc" id="fc" dir="${rtl?'rtl':'ltr'}"><div class="big${rtl?' ar':''}" style="${back?'color:'+(COL[lang]||'#111'):''}">${esc(txt)}</div>${back?`<div class="sm">${esc(l.de)}</div>`:''}</div>
  <div class="fcnav"><button id="fc-p">‹</button><span>${ci+1} / ${L.length}</span><button id="fc-n">›</button>${CANSAY?`<button class="spk" id="fc-s" aria-label="Vorlesen">${SPK}</button>`:''}</div>`;
  $('fc').onclick=()=>{flip=!flip;renderCards();};
  $('fc-p').onclick=()=>{ci=(ci-1+L.length)%L.length;flip=false;renderCards();};
  $('fc-n').onclick=()=>{ci=(ci+1)%L.length;flip=false;renderCards();};
  if($('fc-s'))$('fc-s').onclick=()=>say(txt,tl);
}
function setLang(l){lang=l;try{localStorage.setItem('live.lang',l);}catch(e){}renderAll();}
function renderChips(){
  const box=$('s-chips');
  box.innerHTML=langs.map(l=>`<button data-l="${l}" class="${l===lang?'on':''}">${LN[l]||l}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
}
function renderUi(){
  const t=T(lang);
  $('s-title').textContent=PRACT?(practiceTitle||''):t.live+' · '+code;
  root.querySelector('[data-t=text]').textContent=t.text;root.querySelector('[data-t=cards]').textContent=t.cards;{const qb=root.querySelector('[data-t=quiz]');qb.textContent=t.quiz;qb.style.display=PRACT?'':'none';}
  const bt=root.querySelector('[data-t=board]');bt.textContent=t.board;bt.style.display=(meta&&meta.img)?'':'none';
  $('s-alllab').textContent=t.all;$('s-all').checked=showAll;
  const st=$('s-stat');
  if(!online){st.textContent='● '+t.off;st.className='bad';}
  else if(!meta){st.textContent='● '+t.wait;st.className='wait';}
  else{st.textContent=PRACT?'':'● '+t.live;st.className='ok';}
  root.dir=(lang==='ar')?'rtl':'ltr';
}
function renderLines(){
  const box=$('s-text'),t=T(lang);
  const near=document.documentElement.scrollHeight-window.scrollY-window.innerHeight<160;
  if(!lines.length){box.innerHTML=`<div class="empty">${esc(meta?t.empty:t.wait)}</div>`;return;}
  let html='',lastP=null;
  lines.forEach(l=>{
    if(l.p!==lastP&&(lastP!==null||l.p>1)){html+=`<div class="pdiv">${esc(t.page)} ${l.p}</div>`;}
    lastP=l.p;
    if(l.url){html+=`<div class="card"><a href="${esc(l.url)}" target="_blank" rel="noopener" style="display:block;font-size:22px;font-weight:700;color:#b91c1c;text-decoration:none">${esc(l.de)}</a></div>`;return;}
    const isNew=seen&&!seen.has(l.id);
    const tr=l.tr||{};
    let inner='';
    if(showAll){
      inner+=`<div class="de">${esc(l.de)}</div>`;
      langs.filter(x=>x!=='de'&&tr[x]).forEach(x=>{inner+=`<div class="tl" dir="${x==='ar'?'rtl':'ltr'}"><span class="tg" style="background:${COL[x]||'#475569'}">${x.toUpperCase()}</span><span style="color:${COL[x]||'#111'}">${esc(tr[x])}</span></div>`;});
    }else if(lang==='de'||!tr[lang]){
      inner+=`<div class="big">${esc(l.de)}</div>`;
    }else{
      inner+=`<div class="big${lang==='ar'?' ar':''}" dir="${lang==='ar'?'rtl':'ltr'}" style="color:${COL[lang]||'#111'}">${esc(tr[lang])}</div><div class="de">${esc(l.de)}</div>`;
    }
    let sp2='';
    if(CANSAY&&!showAll){
      sp2=`<div style="margin-top:8px;display:flex;gap:8px">`+(lang!=='de'&&tr[lang]?`<button class="spk" data-say="${esc(tr[lang])}" data-l="${lang}" aria-label="Vorlesen">${SPK} ${lang.toUpperCase()}</button>`:'')+`<button class="spk" data-say="${esc(l.de)}" data-l="de" aria-label="Vorlesen">${SPK} DE</button></div>`;
    }
    html+=`<div class="card${isNew?' new':''}">${inner}${sp2}</div>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,b.dataset.l));
  if(seen!==null&&near)window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  seen=new Set(lines.map(l=>l.id));
}
function renderBoard(){
  const b=$('s-board');
  b.innerHTML=img?`<img src="${img}" alt=""><div class="cap">${esc(T(lang).page)} ${meta?meta.pg:''}</div>`:'<div class="empty">…</div>';
}
function renderAll(){renderChips();renderUi();renderLines();if(tab==='board')renderBoard();if(tab==='cards')renderCards();if(tab==='quiz'){startQuizSt();renderQuiz();}}
function pickLang(m){
  langs=['de'].concat((m.langs||[]).filter(l=>l!=='de'));
  if(!langs.includes(lang)){
    const nav=(navigator.language||'').slice(0,2);
    lang=langs.includes(nav)?nav:(langs[1]||'de');
  }
}
async function tick(){
  if(document.hidden)return;
  try{
    const m=await get('meta');online=true;
    if(!m){meta=null;renderUi();renderLines();return;}
    const first=!meta;
    if(first||m.rev!==meta.rev||JSON.stringify(m.langs)!==JSON.stringify(meta.langs)){
      lines=arr(await get('lines'));pickLang(m);meta=m;renderAll();
    }
    if(tab==='board'&&m.img&&(imgRev!==m.imgRev)){img=await get('img');imgRev=m.imgRev;renderBoard();}
    meta=m;renderUi();
  }catch(e){
    if(online){online=false;renderUi();}
  }
}
root.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  root.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('s-text').hidden=tab!=='text';$('s-cards').hidden=tab!=='cards';$('s-quiz').hidden=tab!=='quiz';$('s-board').hidden=tab!=='board';
  if(tab==='board'){imgRev=-1;tick();renderBoard();}
  if(tab==='cards'){flip=false;renderCards();}
  if(tab==='quiz'){startQuizSt();renderQuiz();}
});
$('s-all').onchange=e=>{showAll=e.target.checked;try{localStorage.setItem('live.all',showAll?'1':'0');}catch(_){}renderLines();};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
if(!base){$('s-text').innerHTML='<div class="empty">QR-Code ungültig.</div>';return;}
if(PRACT){
  (async()=>{
    try{
      const d=await get('practice');
      if(!d){meta=null;renderUi();renderLines();return;}
      lines=arr(d.words).map((w,i)=>({id:'w'+i,p:1,de:w.de,tr:w.tr||{}}));
      practiceTitle=d.title||'';meta={img:false,langs:arr(d.langs),rev:0};pickLang(meta);renderAll();
      root.querySelector('[data-t=quiz]').click();
    }catch(e){online=false;renderUi();}
  })();
}else{renderAll();tick();setInterval(tick,2200);startLaser();}
})();
</script>
<script>
/* ================= Live-Quiz: Schüler-Handy ================= */
(()=>{
const sp=new URLSearchParams(location.search),code=sp.get('quiz');
if(!code)return;
const base=(sp.get('db')||'').replace(/\/+$/,'');
document.getElementById('app').style.display='none';
const root=document.createElement('div');root.id='liveq';document.body.appendChild(root);
document.body.style.background='#f4f6fa';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=['#dc2626','#2563eb','#d97706','#15803d'];
const RTL={ar:1};
const TX={
 de:{name:'Dein Name',go:'Los geht\'s',wait:'Warte auf den Start …',next:'Gleich geht es weiter …',sent:'Antwort gesendet!',ok:'Richtig!',bad:'Falsch',no:'Keine Antwort',pts:'Punkte',place:'Platz',done:'Fertig!',late:'Das Quiz läuft schon. Du kannst ab der nächsten Frage mitspielen.'},
 ar:{name:'اسمك',go:'ابدأ',wait:'بانتظار البدء …',next:'سنتابع بعد قليل …',sent:'تم إرسال الإجابة!',ok:'صحيح!',bad:'خطأ',no:'لا إجابة',pts:'نقاط',place:'المركز',done:'انتهى!'},
 vi:{name:'Tên của bạn',go:'Bắt đầu',wait:'Đang chờ bắt đầu …',next:'Sắp tiếp tục …',sent:'Đã gửi đáp án!',ok:'Đúng!',bad:'Sai',no:'Chưa trả lời',pts:'Điểm',place:'Hạng',done:'Xong!'},
 tr:{name:'Adın',go:'Başla',wait:'Başlaması bekleniyor …',next:'Birazdan devam …',sent:'Cevap gönderildi!',ok:'Doğru!',bad:'Yanlış',no:'Cevap yok',pts:'Puan',place:'Sıra',done:'Bitti!'},
 uk:{name:'Твоє ім\'я',go:'Почати',wait:'Чекаємо початку …',next:'Зараз продовжимо …',sent:'Відповідь надіслано!',ok:'Правильно!',bad:'Неправильно',no:'Без відповіді',pts:'Бали',place:'Місце',done:'Готово!'},
 ru:{name:'Твоё имя',go:'Начать',wait:'Ждём начала …',next:'Сейчас продолжим …',sent:'Ответ отправлен!',ok:'Верно!',bad:'Неверно',no:'Нет ответа',pts:'Баллы',place:'Место',done:'Готово!'},
 es:{name:'Tu nombre',go:'Empezar',wait:'Esperando el inicio …',next:'Enseguida seguimos …',sent:'¡Respuesta enviada!',ok:'¡Correcto!',bad:'Incorrecto',no:'Sin respuesta',pts:'Puntos',place:'Puesto',done:'¡Listo!'},
 pt:{name:'O teu nome',go:'Começar',wait:'À espera do início …',next:'Já continuamos …',sent:'Resposta enviada!',ok:'Certo!',bad:'Errado',no:'Sem resposta',pts:'Pontos',place:'Lugar',done:'Pronto!'},
 en:{name:'Your name',go:'Start',wait:'Waiting to start …',next:'Next question soon …',sent:'Answer sent!',ok:'Correct!',bad:'Wrong',no:'No answer',pts:'Points',place:'Place',done:'Done!'}
};
let langs=[];
const L=k=>[TX.de[k]].concat(langs.map(l=>(TX[l]||{})[k]).filter(Boolean)).join(' · ');
const url=p=>`${base}/rooms/${code}/${p}.json`;
const get=async p=>{const r=await fetch(url(p),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();};
const put=async(p,v)=>{const r=await fetch(url(p),{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw new Error(r.status);};
const ss={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
let quiz=null,me=ss.get('lq.'+code),myName=ss.get('lq.n.'+code)||'',shown=-1,shownAt=0,answered=-1,view='';
const css=document.createElement('style');css.textContent='#liveq{font-family:system-ui,-apple-system,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 20px;min-height:100vh;color:#0f172a;max-width:560px;margin:0 auto}#liveq button.o{display:block;width:100%;border:none;border-radius:16px;color:#fff;font-size:20px;font-weight:700;padding:18px 12px;margin:10px 0;text-align:center;cursor:pointer}#liveq .c{text-align:center}#liveq input{width:100%;font-size:22px;padding:14px;border:2px solid #cbd5e1;border-radius:12px;box-sizing:border-box;margin:12px 0}#liveq .go{background:#2563eb;color:#fff;border:none;border-radius:14px;font-size:22px;font-weight:700;padding:16px;width:100%}';
document.head.appendChild(css);
const xl=(a,sc)=>(a||[]).map(x=>`<div dir="${RTL[x.l]?'rtl':'ltr'}" style="font-size:${sc}em;font-weight:500;margin-top:3px;opacity:.95">${esc(x.t)}</div>`).join('');
function set(v,html){if(view===v)return false;view=v;root.innerHTML=html;return true;}
function nameScreen(){
  set('name',`<div class="c" style="margin-top:12vh"><div style="font-size:30px;font-weight:800">${esc(quiz?quiz.title:'Quiz')}</div><div style="margin-top:20px;font-size:18px">${L('name')}</div><input id="nm" maxlength="16" autocomplete="off" value="${esc(myName)}"><button class="go" id="ng">${L('go')}</button></div>`);
  root.querySelector('#ng').onclick=async()=>{
    const n=root.querySelector('#nm').value.trim().slice(0,16);if(!n)return;
    myName=n;me=me||(n.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)+Math.random().toString(36).slice(2,6));
    ss.set('lq.'+code,me);ss.set('lq.n.'+code,n);
    try{await put('players/'+me,{name:n,t:Date.now()});}catch(e){alert('Keine Verbindung.');return;}
    view='';tick();
  };
}
async function tick(){
  try{
    if(!quiz){quiz=await get('quiz');if(!quiz){set('w','<div class="c" style="margin-top:20vh">…</div>');return;}langs=quiz.langs||[];}
    const st=await get('state');if(!st)return;
    if(!myName){nameScreen();return;}
    if(st.phase==='lobby'){set('lobby',`<div class="c" style="margin-top:22vh"><div style="font-size:26px;font-weight:800">${esc(myName)}</div><div style="margin-top:16px;font-size:20px">${L('wait')}</div></div>`);return;}
    if(st.phase==='q'){
      const it=quiz.items[st.i];if(!it)return;
      if(shown!==st.i){shown=st.i;shownAt=performance.now();answered=-1;view='';}
      if(answered===st.i){set('sent'+st.i,`<div class="c" style="margin-top:20vh"><div style="font-size:30px;font-weight:800">${L('sent')}</div><div style="margin-top:12px;font-size:18px;color:#64748b">${L('next')}</div></div>`);return;}
      if(set('q'+st.i,`<div style="font-size:14px;color:#64748b;text-align:center">${st.i+1} / ${st.n}</div><div style="font-size:22px;font-weight:800;text-align:center;margin:8px 0 12px;line-height:1.3">${esc(it.q)}${xl(it.qx,.7)}</div>${it.opts.map((o,k)=>`<button class="o" data-k="${k}" style="background:${COLS[k]}">${esc(o)}${xl((it.ox||[])[k],.7)}</button>`).join('')}`)){
        root.querySelectorAll('button.o').forEach(b=>b.onclick=async()=>{
          if(answered===st.i)return;const ms=Math.round(performance.now()-shownAt);answered=st.i;
          set('sent'+st.i,`<div class="c" style="margin-top:20vh"><div style="font-size:30px;font-weight:800">${L('sent')}</div></div>`);
          try{await put('ans/'+st.i+'/'+me,{c:+b.dataset.k,ms});}catch(e){answered=-1;view='';}
        });
      }
      return;
    }
    if(st.phase==='rev'){
      let s=null;try{const all=await get('scores');s=all&&all[me];}catch(e){}
      const key='r'+st.i+(s?s.score:'');
      const ok=s?s.ok:false,no=s&&s.no;
      set(key,`<div class="c" style="margin-top:14vh;padding:24px;border-radius:20px;background:${ok?'#16a34a':'#dc2626'};color:#fff"><div style="font-size:42px;font-weight:800">${ok?L('ok'):(no?L('no'):L('bad'))}</div>${s?`<div style="font-size:26px;margin-top:10px">+${s.last||0} ${L('pts')}</div><div style="font-size:18px;margin-top:10px;opacity:.9">${L('pts')}: ${s.score} · ${L('place')} ${s.rank||'-'}</div>`:''}</div><div class="c" style="margin-top:14px;font-size:18px;color:#64748b">${L('next')}</div>`);
      return;
    }
    if(st.phase==='end'){
      let all={};try{all=(await get('scores'))||{};}catch(e){}
      const rank=Object.entries(all).sort((a,b)=>b[1].score-a[1].score);const mine=all[me];
      const medal=['🥇','🥈','🥉'];
      set('end'+(mine?mine.score:''),`<div class="c" style="margin-top:6vh"><div style="font-size:30px;font-weight:800">${L('done')}</div>${mine?`<div style="font-size:60px;font-weight:800;margin:8px 0">${mine.rank}.</div><div style="font-size:22px">${mine.score} ${L('pts')}</div>`:''}</div><div style="margin-top:16px">${rank.slice(0,5).map(([id,s],k)=>`<div style="display:flex;justify-content:space-between;background:${id===me?'#dbeafe':'#fff'};border-radius:12px;padding:10px 14px;margin:6px 0;font-size:18px;font-weight:600"><span>${medal[k]||(k+1)+'.'} ${esc(s.name)}</span><span>${s.score}</span></div>`).join('')}</div>`);
    }
  }catch(e){}
}
setInterval(tick,1000);tick();
})();
</script>
