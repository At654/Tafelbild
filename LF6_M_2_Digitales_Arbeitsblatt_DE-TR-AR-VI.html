<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}

main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}

.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}

.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}

.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}

.nowrap{white-space:nowrap}
#report{display:none}

@media print{
 body{background:#fff;padding:0;font-size:11pt}

 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>

höht, weil die Lieferzeit …", "items": [{"t": "calc", "id": "a4.1", "q": "Kinderschuhe: Tagesabsatz 2 Paar, Lieferzeit 3 Tage, Mindestbestand 6 Paar.", "a": 12, "unit": "Paar", "steps": ["2 × 3 = 6", "6 + 6 = 12 Paar"]}, {"t": "calc", "id": "a4.2", "q": "4.2 Laufschuhe: Absatz 15 Paar pro Tag, Lieferzeit 5 Tage, Mindestbestand 40 Paar. Ermittle den Meldebestand.", "a": 115, "unit": "Paar", "steps": ["15 × 5 = 75", "75 + 40 = 115 Paar"]}, {"t": "mc", "id": "a4.3", "q": "Die Lieferzeit für Tennisschläger verlängert sich um eine Woche. Was müssen Sie tun?", "o": ["den Meldebestand für Tennisschläger erhöhen", "die Tennisschläger mit niedrigerem Lagerkostenanteil kalkulieren", "den Mindestbestand senken", "den Meldebestand vermindern", "sofort einen anderen Lieferer suchen"], "a": 0}, {"t": "mc", "id": "a4.4", "q": "4.4 Wovon wird der Zeitpunkt einer Bestellung NICHT beeinflusst?", "o": ["vom aktuellen Warenbestand", "von offenen Bestellungen", "von den Zahlungsbedingungen des Lieferers", "von Lieferzeitschwankungen", "von Nachfrageschwankungen"], "a": 2}, {"t": "free", "id": "a4.5", "q": "4.5 Warum überwachst du, ob die bestellte Ware pünktlich kommt? Antworte in einem ganzen Satz.", "model": "Ich überwache den Liefertermin, um die Verkaufsbereitschaft zu sichern (keine leeren Regale)."}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Rückwärts rechnen und begründen", "intro": "Täglich werden 15 Stück verkauft, die Lieferzeit beträgt 8 Tage.", "tip": "Mindestbestand = Meldebestand − Tagesabsatz × Lieferzeit", "items": [{"t": "calc", "id": "a5.1", "q": "Meldebestand 160 Stück. Wie hoch ist der Mindestbestand?", "a": 40, "unit": "Stück", "steps": ["160 − 15 × 8 = 160 − 120 = 40 Stück"]}, {"t": "free", "id": "a5.2", "q": "5.2 Begründe, warum ein zu hoch eingestellter Meldebestand dem Betrieb schadet, obwohl die Regale dann nie leer sind.", "model": "Es wird zu früh bestellt; im Lager liegt dauerhaft mehr Ware als nötig. Das bindet Kapital, erhöht Lagerkosten (Zinsen, Platz, Versicherung) und das Lagerrisiko (Verderb, Mode)."}, {"t": "free", "id": "a5.3", "q": "5.3 Bei Saisonware schwankt der Tagesabsatz stark. Schlage vor, wie das WWS den Meldebestand anpassen sollte.", "model": "Den Meldebestand mit dem erwarteten (saisonalen) Tagesabsatz neu berechnen, z. B. aus den Vorjahreszahlen desselben Zeitraums – in der Saison höher, danach niedriger."}]}]};
var TR={"title": ["Lập kế hoạch thời gian – mức tồn kho báo đặt hàng", "", "", "", "", "", "تخطيط الوقت – مخزون إعادة الطلب", "Zamanı planlamak – sipariş noktası stoku"], "can.0": ["phân biệt phương pháp đặt hàng theo chu kỳ (Bestellrhythmusverfahren) và phương pháp điểm đặt hàng (Bestellpunktverfahren).", "", "", "", "", "", "التمييز بين طريقة الطلب الدوري (Bestellrhythmusverfahren) وطريقة نقطة الطلب (Bestellpunktverfahren).", "sipariş ritmi yöntemi (Bestellrhythmusverfahren) ile sipariş noktası yöntemini (Bestellpunktverfahren) ayırt etmek."], "can.1": ["tính mức tồn kho báo đặt hàng bằng công thức (lượng bán mỗi ngày × thời gian giao hàng + tồn kho tối thiểu).", "", "", "", "", "", "حساب مخزون إعادة الطلب بالمعادلة (المبيعات اليومية × مدة التوريد + الحد الأدنى للمخزون).", "sipariş noktası stokunu formülle hesaplamak (günlük satış × teslim süresi + minimum stok)."], "can.2": ["nói được điều gì xảy ra khi đạt mức tồn kho báo đặt hàng: Đặt hàng.", "", "", "", "", "", "أن أقول ماذا يحدث عند الوصول إلى مخزون إعادة الطلب: يتم الطلب.", "sipariş noktası stokuna ulaşıldığında ne olduğunu söylemek: Sipariş verilir."], "can.3": ["giải thích thời gian giao hàng dài hơn hoặc ngắn hơn ảnh hưởng thế nào đến mức tồn kho báo đặt hàng.", "", "", "", "", "", "شرح كيف تؤثر مدة توريد أطول أو أقصر على مخزون إعادة الطلب.", "daha uzun veya daha kısa bir teslim süresinin sipariş noktası stokunu nasıl etkilediğini açıklamak."], "can.4": ["giải thích tại sao phải theo dõi ngày giao hàng (đảm bảo luôn sẵn hàng để bán).", "", "", "", "", "", "تعليل لماذا تتم مراقبة موعد التوريد (ضمان الاستعداد للبيع).", "teslim tarihinin neden takip edildiğini gerekçelendirmek (satışa hazır olmayı sağlamak)."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Phần trăm: số tiền × tỷ lệ phần trăm : 100.", "", "", "", "", "", "النسبة المئوية: المبلغ × النسبة : 100.", "Yüzde: tutar × yüzde oranı : 100."], "a1.1.q": ["1.4 Em tính 15 % của 240,00 € như thế nào? (Ngân hàng câu hỏi · LF 3)", "", "", "", "", "", "1.4 كيف تحسب 15 % من 240,00 €؟ (بنك الأسئلة · LF 3)", "1.4 240,00 €'nun %15'ini nasıl hesaplarsın? (Havuz · LF 3)"], "a1.2.q": ["1.5 Em tách thuế giá trị gia tăng 19 % ra khỏi số tiền gộp 119,00 € như thế nào? (Ngân hàng câu hỏi · LF 3)", "", "", "", "", "", "1.5 كيف تستخرج ضريبة المبيعات 19 % من مبلغ إجمالي قدره 119,00 €؟ (بنك الأسئلة · LF 3)", "1.5 119,00 €'luk brüt tutardan %19 KDV'yi nasıl çıkarırsın? (Havuz · LF 3)"], "a1.2.w": ["Tính 19 % của số tiền gộp là sai: Số tiền gộp là 119 %.", "", "", "", "", "", "حساب 19 % من المبلغ الإجمالي خطأ: المبلغ الإجمالي هو 119 %.", "Brüt tutarın %19’u yanlıştır: Brüt tutar %119’dur."], "a1.3.q": ["1.1 Kể hai nhược điểm của lượng đặt hàng lớn. (Mô-đun 1)", "", "", "", "", "", "1.1 اذكر عيبين لكمية الطلب الكبيرة. (الوحدة 1)", "1.1 Büyük bir sipariş miktarının iki dezavantajını söyle. (Modül 1)"], "r1.h": ["Đọc thêm: Lập kế hoạch thời điểm đặt hàng (Sách giáo khoa tr. 19–20)", "", "", "", "", "", "للقراءة: تخطيط وقت الطلب (الكتاب ص 19–20)", "Okuma: Sipariş zamanını planlamak (Ders kitabı s. 19–20)"], "r1.s": ["Mức tồn kho báo đặt hàng = lượng bán mỗi ngày × thời gian giao hàng (tính bằng ngày) + tồn kho tối thiểu", "", "", "", "", "", "مخزون إعادة الطلب = المبيعات اليومية × مدة التوريد (بالأيام) + الحد الأدنى للمخزون", "Sipariş noktası stoku = günlük satış × teslim süresi (gün) + minimum stok"], "r1.p0": ["Với phương pháp đặt hàng theo chu kỳ, đặt hàng theo khoảng thời gian cố định. Với phương pháp điểm đặt hàng, đặt hàng khi lượng tồn đạt mức tồn kho báo đặt hàng.", "", "", "", "", "", "في طريقة الطلب الدوري يتم الطلب على فترات زمنية ثابتة. في طريقة نقطة الطلب يتم الطلب عندما يصل المخزون إلى مخزون إعادة الطلب.", "Sipariş ritmi yönteminde sabit zaman aralıklarıyla sipariş verilir. Sipariş noktası yönteminde stok, sipariş noktası stokuna ulaştığında sipariş verilir."], "r1.p1": ["Tồn kho tối thiểu là dự trữ cứng. Trong thời gian giao hàng vẫn tiếp tục bán.", "", "", "", "", "", "الحد الأدنى للمخزون هو الاحتياطي الثابت. خلال مدة التوريد يستمر البيع.", "Minimum stok demir yedektir. Teslim süresi boyunca satış devam eder."], "r1.p2": ["Nếu thời gian giao hàng dài hơn thì phải tăng mức tồn kho báo đặt hàng. Nếu ngắn hơn thì có thể giảm.", "", "", "", "", "", "إذا طالت مدة التوريد يجب رفع مخزون إعادة الطلب. وإذا قصرت يمكن خفضه.", "Teslim süresi uzarsa sipariş noktası stoku artırılmalıdır. Kısalırsa düşürülebilir."], "r1.qq": ["Điều gì xảy ra khi đạt mức tồn kho báo đặt hàng?", "", "", "", "", "", "ماذا يحدث عند الوصول إلى مخزون إعادة الطلب؟", "Sipariş noktası stokuna ulaşıldığında ne olur?"], "r1.q.o0": ["Đặt hàng.", "", "", "", "", "", "يتم الطلب.", "Sipariş verilir."], "r1.q.o1": ["Chỉ hỏi giá.", "", "", "", "", "", "يتم الاستفسار فقط.", "Sadece fiyat sorulur."], "r1.q.o2": ["Không làm gì cả.", "", "", "", "", "", "لا يتم فعل شيء.", "Hiçbir şey yapılmaz."], "a2.h": ["Mức tồn kho báo đặt hàng cho dây tập thể dục", "", "", "", "", "", "مخزون إعادة الطلب لأحزمة اللياقة", "Fitness bantları için sipariş noktası stoku"], "a2.i": ["Ở bộ phận thể thao, mỗi ngày bán được 8 dây tập thể dục.", "", "", "", "", "", "في قسم الرياضة تُباع يومياً 8 أحزمة لياقة.", "Spor bölümünde her gün 8 fitness bandı satılıyor."], "a2.t": ["Trước hết tính lượng bán trong thời gian giao hàng, sau đó cộng thêm tồn kho tối thiểu.", "", "", "", "", "", "احسب أولاً ما يُباع خلال مدة التوريد، ثم أضف الحد الأدنى للمخزون.", "Önce teslim süresi boyunca ne satıldığını hesapla, sonra minimum stoku ekle."], "a2.1.q": ["Thời gian giao hàng 3 ngày, tồn kho tối thiểu 16 cái: mức tồn kho báo đặt hàng?", "", "", "", "", "", "مدة التوريد 3 أيام، الحد الأدنى للمخزون 16 قطعة: مخزون إعادة الطلب؟", "Teslim süresi 3 gün, minimum stok 16 adet: sipariş noktası stoku?"], "a2.1.w": ["Em quên tồn kho tối thiểu.", "", "", "", "", "", "نسيت الحد الأدنى للمخزون.", "Minimum stoku unuttun."], "a3.h": ["Tính trước, rồi thay đổi thời gian giao hàng", "", "", "", "", "", "احسب أولاً، ثم غيّر مدة التوريد", "Önce hesapla, sonra teslim süresini değiştir"], "a3.i": ["Bộ phận thực phẩm mỗi ngày bán được 10 gói món ăn sẵn „Nudelpfanne“ (mì xào chảo).", "", "", "", "", "", "من الوجبات الجاهزة „مقلاة المعكرونة“ يبيع قسم المواد الغذائية يومياً 10 علب.", "Gıda bölümü hazır yemek „Nudelpfanne“dan (tavada makarna) günde 10 paket satıyor."], "a3.t": ["Thời gian giao hàng 5 ngày, tồn kho tối thiểu 40 gói.", "", "", "", "", "", "مدة التوريد 5 أيام، الحد الأدنى للمخزون 40 علبة.", "Teslim süresi 5 gün, minimum stok 40 paket."], "a3.1.q": ["Mức tồn kho báo đặt hàng khi thời gian giao hàng là 5 ngày?", "", "", "", "", "", "مخزون إعادة الطلب عند مدة توريد 5 أيام؟", "5 günlük teslim süresinde sipariş noktası stoku?"], "a3.2.q": ["3.1 Nhà cung cấp rút ngắn thời gian giao hàng xuống 2 ngày. Hãy tính mức tồn kho báo đặt hàng mới.", "", "", "", "", "", "3.1 يقصّر المورد مدة التوريد إلى يومين. احسب مخزون إعادة الطلب الجديد.", "3.1 Tedarikçi teslim süresini 2 güne kısaltıyor. Yeni sipariş noktası stokunu hesapla."], "a3.3.q": ["3.2 Thời gian giao hàng ngắn hơn có tác động gì?", "", "", "", "", "", "3.2 ما تأثير مدة التوريد الأقصر؟", "3.2 Daha kısa teslim süresinin etkisi nedir?"], "a3.3.o0": ["Phải tăng mức tồn kho báo đặt hàng. Nhờ đó vốn bị giữ lại giảm.", "", "", "", "", "", "يجب رفع مخزون إعادة الطلب. وبذلك ينخفض تجميد رأس المال.", "Sipariş noktası stoku artırılmalı. Böylece sermaye bağlama azalır."], "a3.3.o1": ["Có thể giảm lượng tồn kho. Nhờ đó rủi ro lưu kho tăng.", "", "", "", "", "", "يمكن تقليل المخزون. وبذلك تزداد مخاطر التخزين.", "Stok azaltılabilir. Böylece depolama riski artar."], "a3.3.o2": ["Phải tăng mức tồn kho báo đặt hàng. Nhờ đó vốn bị giữ lại tăng.", "", "", "", "", "", "يجب رفع مخزون إعادة الطلب. وبذلك يزداد تجميد رأس المال.", "Sipariş noktası stoku artırılmalı. Böylece sermaye bağlama artar."], "a3.3.o3": ["Có thể hạ mức tồn kho báo đặt hàng. Nhờ đó vốn bị giữ lại giảm.", "", "", "", "", "", "يمكن خفض مخزون إعادة الطلب. وبذلك ينخفض تجميد رأس المال.", "Sipariş noktası stoku düşürülebilir. Böylece sermaye bağlama azalır."], "a3.3.o4": ["Có thể giảm tồn kho tối thiểu. Nhờ đó rủi ro lưu kho tăng.", "", "", "", "", "", "يمكن تقليل الحد الأدنى للمخزون. وبذلك تزداد مخاطر التخزين.", "Minimum stok azaltılabilir. Böylece depolama riski artar."], "a4.h": ["Mức tồn kho báo đặt hàng như trong kỳ thi", "", "", "", "", "", "مخزون إعادة الطلب كما في الامتحان", "Sınavdaki gibi sipariş noktası stoku"], "a4.i": ["Tính theo sơ đồ. Ghi kết quả vào các ô – giống như phiếu trả lời của IHK.", "", "", "", "", "", "احسب باستخدام المخطط. اكتب النتيجة في المربعات – كما في ورقة الحل الخاصة بـ IHK.", "Şemayla hesapla. Sonucu kutucuklara yaz – IHK cevap kâğıdındaki gibi."], "a4.t": ["Mức tồn kho báo đặt hàng được tăng lên vì thời gian giao hàng …", "", "", "", "", "", "يُرفع مخزون إعادة الطلب لأن مدة التوريد …", "Sipariş noktası stoku artırılır, çünkü teslim süresi …"], "a4.1.q": ["Giày trẻ em: lượng bán mỗi ngày 2 đôi, thời gian giao hàng 3 ngày, tồn kho tối thiểu 6 đôi.", "", "", "", "", "", "أحذية أطفال: المبيعات اليومية زوجان، مدة التوريد 3 أيام، الحد الأدنى للمخزون 6 أزواج.", "Çocuk ayakkabısı: günlük satış 2 çift, teslim süresi 3 gün, minimum stok 6 çift."], "a4.2.q": ["4.2 Giày chạy bộ: lượng bán 15 đôi mỗi ngày, thời gian giao hàng 5 ngày, tồn kho tối thiểu 40 đôi. Hãy xác định mức tồn kho báo đặt hàng.", "", "", "", "", "", "4.2 أحذية الجري: المبيعات 15 زوجاً في اليوم، مدة التوريد 5 أيام، الحد الأدنى للمخزون 40 زوجاً. احسب مخزون إعادة الطلب.", "4.2 Koşu ayakkabısı: günde 15 çift satış, teslim süresi 5 gün, minimum stok 40 çift. Sipariş noktası stokunu belirle."], "a4.3.q": ["Thời gian giao vợt tennis kéo dài thêm một tuần. Anh/chị phải làm gì?", "", "", "", "", "", "تطول مدة توريد مضارب التنس أسبوعاً. ماذا يجب أن تفعلوا؟", "Tenis raketlerinin teslim süresi bir hafta uzuyor. Ne yapmalısınız?"], "a4.3.o0": ["tăng mức tồn kho báo đặt hàng cho vợt tennis", "", "", "", "", "", "رفع مخزون إعادة الطلب لمضارب التنس", "tenis raketleri için sipariş noktası stokunu artırmak"], "a4.3.o1": ["tính giá vợt tennis với phần chi phí lưu kho thấp hơn", "", "", "", "", "", "حساب سعر مضارب التنس بحصة أقل من تكاليف التخزين", "tenis raketlerini daha düşük depolama maliyeti payıyla hesaplamak"], "a4.3.o2": ["giảm tồn kho tối thiểu", "", "", "", "", "", "خفض الحد الأدنى للمخزون", "minimum stoku düşürmek"], "a4.3.o3": ["giảm mức tồn kho báo đặt hàng", "", "", "", "", "", "تقليل مخزون إعادة الطلب", "sipariş noktası stokunu azaltmak"], "a4.3.o4": ["ngay lập tức tìm nhà cung cấp khác", "", "", "", "", "", "البحث فوراً عن مورد آخر", "hemen başka bir tedarikçi aramak"], "a4.4.q": ["4.4 Thời điểm đặt hàng KHÔNG bị ảnh hưởng bởi điều gì?", "", "", "", "", "", "4.4 بماذا لا يتأثر وقت الطلب؟", "4.4 Bir siparişin zamanı neden ETKİLENMEZ?"], "a4.4.o0": ["bởi lượng hàng tồn hiện tại", "", "", "", "", "", "بالمخزون الحالي من البضائع", "mevcut mal stokundan"], "a4.4.o1": ["bởi các đơn hàng đang chờ", "", "", "", "", "", "بالطلبات المفتوحة", "açık siparişlerden"], "a4.4.o2": ["bởi điều kiện thanh toán của nhà cung cấp", "", "", "", "", "", "بشروط الدفع لدى المورد", "tedarikçinin ödeme koşullarından"], "a4.4.o3": ["bởi sự dao động thời gian giao hàng", "", "", "", "", "", "بتقلبات مدة التوريد", "teslim süresi dalgalanmalarından"], "a4.4.o4": ["bởi sự dao động nhu cầu", "", "", "", "", "", "بتقلبات الطلب", "talep dalgalanmalarından"], "a4.5.q": ["4.5 Tại sao em theo dõi xem hàng đã đặt có đến đúng hạn không? Trả lời bằng một câu hoàn chỉnh.", "", "", "", "", "", "4.5 لماذا تراقب ما إذا كانت البضاعة المطلوبة تصل في موعدها؟ أجب بجملة كاملة.", "4.5 Sipariş edilen malın zamanında gelip gelmediğini neden takip edersin? Tam bir cümleyle cevap ver."], "a5.h": ["Dành cho người giỏi: Tính ngược và giải thích", "", "", "", "", "", "للمحترفين: الحساب بالعكس والتعليل", "Profesyoneller için: Geriye doğru hesapla ve ge function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p,pi){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'+tlo(b.id+'.p'+pi)}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();

</script>
