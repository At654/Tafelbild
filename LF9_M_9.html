er Rechenweg · der Folgefehler · die Einheit · der Ablenker · der Grundwert</p>","vi":"Klausur = bài kiểm tra · nachschlagen = tra cứu · Werkzeugkarte = thẻ công cụ · Rechenweg = cách tính · Folgefehler = lỗi kéo theo · Einheit = đơn vị · Ablenker = đáp án gây nhiễu · Grundwert = giá trị gốc"},{"id":"r1","no":"Lesen 1","type":"read","title":{"de":"Meine Klausur-Strategie, Teil 1","vi":"Meine Klausur-Strategie, Teil 1 · Chiến lược làm bài của tôi, phần 1"},"instr":{"de":"Markiere die ersten drei Schritte in Stichworten.","vi":"Markiere die ersten drei Schritte in Stichworten.\n🇻🇳 Đánh dấu ba bước đầu tiên bằng từ khóa."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Zuerst verschaffst du dir einen [[Überblick]]: Alle Aufgaben ansehen. Erst die sicheren Aufgaben, dann die schweren. Dann musst du den [[Satz übersetzen]]: Zahlen markieren und die Kette aufschreiben. Danach musst du den [[Rechenweg hinschreiben]]. Auch bei falschem Ergebnis gibt es Punkte für den richtigen Weg. Folgefehler kosten keine Punkte. Du solltest nicht sofort losrechnen."],"vi":"Trước tiên em nắm tổng quan: xem tất cả các bài. Làm bài chắc chắn trước, bài khó sau. Sau đó em phải dịch câu đề bài: đánh dấu các số và viết ra chuỗi tính. Tiếp theo em phải viết cách tính ra. Kể cả khi kết quả sai vẫn được điểm cho cách làm đúng. Lỗi kéo theo không bị trừ điểm. Em không nên bắt tay vào tính ngay.","quiz":{"q":{"de":"Warum schreibst du den Rechenweg hin?","vi":"Warum schreibst du den Rechenweg hin?\n🇻🇳 Vì sao em viết cách tính ra?"},"o":["Weil es auch bei falschem Ergebnis Punkte für den Weg gibt.","Weil es schöner aussieht.","Weil der Taschenrechner verboten ist."],"a":0,"why":{"de":"Richtig ist: Weil es auch bei falschem Ergebnis Punkte für den Weg gibt.","vi":"Đáp án đúng: Vì kể cả khi kết quả sai vẫn được điểm cho cách làm."}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Meine Klausur-Strategie, Teil 2","vi":"Meine Klausur-Strategie, Teil 2 · Chiến lược làm bài của tôi, phần 2"},"instr":{"de":"Markiere, wie du rundest und was du prüfst.","vi":"Markiere, wie du rundest und was du prüfst.\n🇻🇳 Đánh dấu cách em làm tròn và những gì em kiểm tra."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Beim Runden gilt: Euro [[2 Stellen]], Faktor [[4 Stellen]], Prozent wie verlangt. Schreibe € oder % dazu. Dann prüfst du: Ist der Verkaufspreis [[größer als der Bezugspreis]]? Ist der Faktor [[größer als 1]]? Ist netto [[kleiner als brutto]]? Bei offenen Fragen schreibst du so viele Antworten wie Punkte. Mehr Antworten bringen keine Extrapunkte."],"vi":"Khi làm tròn: euro 2 chữ số, Faktor 4 chữ số, phần trăm theo yêu cầu. Ghi thêm € hoặc %. Sau đó em kiểm tra: giá bán có lớn hơn Bezugspreis không? Faktor có lớn hơn 1 không? Netto có nhỏ hơn brutto không? Với câu hỏi mở, em viết số ý trả lời bằng số điểm. Viết thêm không được thêm điểm.","quiz":{"q":{"de":"Eine offene Frage gibt 3 Punkte. Wie viele Antworten schreibst du?","vi":"Eine offene Frage gibt 3 Punkte. Wie viele Antworten schreibst du?\n🇻🇳 Một câu hỏi mở được 3 điểm. Em viết bao nhiêu ý trả lời?"},"o":["eine","drei","so viele wie möglich"],"a":1,"why":{"de":"Richtig ist: drei","vi":"Đáp án đúng: ba"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Meine Klausur-Strategie</h4><p>1. Überblick (2 Minuten): Alle Aufgaben ansehen. Erst die sicheren Aufgaben, dann die schweren.</p><p>2. Satz übersetzen: Zahlen markieren, Satz-Übersetzer auf der Werkzeugkarte benutzen, Kette aufschreiben.</p><p>3. Rechenweg hinschreiben: Auch bei falschem Ergebnis gibt es Punkte für den richtigen Weg. Folgefehler kosten keine Punkte.</p><p>4. Runden und Einheit: Euro 2 Stellen, Faktor 4 Stellen, Prozent wie verlangt. € oder % dazuschreiben.</p><p>5. Prüfen: Verkaufspreis größer als Bezugspreis? Faktor größer als 1? Netto kleiner als brutto?</p><p>6. Offene Fragen: So viele Antworten wie Punkte. Stichworte aus der Werkzeugkarte reichen.</p><h4>Typische Fehler (Ablenker-Detektiv)</h4><p>Bezugskosten vergessen · Gewinn auf den Bezugspreis statt auf die Selbstkosten · Handlungskosten auf den Listenpreis · Kalkulationsfaktor auf den Nettopreis bezogen · Prozent vom falschen Grundwert · Skonto vom Listenpreis statt vom Zieleinkaufspreis · Umsatzsteuer auf den Bezugspreis · Umsatzsteuer vergessen · zu früh gerundet</p><p><b>Merke:</b> Erst lesen, dann die Kette aufschreiben, dann rechnen. Rechenweg hinschreiben, am Ende runden, Einheit dazuschreiben und das Ergebnis prüfen.</p>","vi":"Chiến lược làm bài của tôi\n1. Tổng quan (2 phút): xem tất cả các bài. Làm bài chắc chắn trước, bài khó sau.\n2. Dịch câu đề bài: đánh dấu các số, dùng bộ dịch câu trên thẻ công cụ, viết ra chuỗi tính.\n3. Viết cách tính: kể cả khi kết quả sai vẫn được điểm cho cách làm đúng. Lỗi kéo theo không bị trừ điểm.\n4. Làm tròn và đơn vị: euro 2 chữ số, Faktor 4 chữ số, phần trăm theo yêu cầu. Ghi thêm € hoặc %.\n5. Kiểm tra: giá bán lớn hơn Bezugspreis? Faktor lớn hơn 1? Netto nhỏ hơn brutto?\n6. Câu hỏi mở: số ý trả lời bằng số điểm. Từ khóa trên thẻ công cụ là đủ.\nCác lỗi thường gặp (thám tử tìm đáp án gây nhiễu)\nQuên Bezugskosten · tính Gewinn trên Bezugspreis thay vì trên Selbstkosten · tính Handlungskosten trên Listenpreis · tính Kalkulationsfaktor trên giá netto · tính phần trăm trên sai giá trị gốc · tính Skonto từ Listenpreis thay vì từ Zieleinkaufspreis · tính thuế trên Bezugspreis · quên thuế · làm tròn quá sớm\nGhi nhớ: Đọc trước, rồi viết chuỗi tính, sau đó mới tính. Viết cách tính ra, làm tròn ở cuối, ghi đơn vị và kiểm tra kết quả."},{"id":"g2","no":"Aufgabe 3","title":{"de":"Prüfungstraining A: Die Hemden-Familie","vi":"Prüfungstraining A: Die Hemden-Familie · Luyện thi A: chuỗi bài áo sơ mi"},"instr":{"de":"So sieht eine typische Aufgabenkette in der Abschlussprüfung aus. Jede Teilaufgabe baut auf der vorigen auf. Situation: Die Kaufhaus Hansa GmbH erhält eine Rechnung über 250 Herrenhemden zu je 15,00 € (netto). Der Lieferer gewährt 10 % Rabatt. Für die Verpackung berechnet er 25,00 €. Auf den Gesamtbetrag kommen 19 % Umsatzsteuer.","vi":"So sieht eine typische Aufgabenkette in der Abschlussprüfung aus. Jede Teilaufgabe baut auf der vorigen auf. Situation: Die Kaufhaus Hansa GmbH erhält eine Rechnung über 250 Herrenhemden zu je 15,00 € (netto). Der Lieferer gewährt 10 % Rabatt. Für die Verpackung berechnet er 25,00 €. Auf den Gesamtbetrag kommen 19 % Umsatzsteuer.\n🇻🇳 Một chuỗi bài điển hình trong kỳ thi tốt nghiệp trông như thế này. Mỗi phần dựa trên phần trước. Tình huống: Kaufhaus Hansa GmbH nhận một hóa đơn cho 250 áo sơ mi nam, mỗi chiếc 15,00 € (netto). Nhà cung cấp giảm 10 % Rabatt. Họ tính 25,00 € cho việc đóng gói. Trên tổng số tiền cộng 19 % thuế."},"tip":{"de":"Halte die Reihenfolge ein: erst Rabatt, dann Skonto, dann Bezugskosten. Kette: Menge · Preis · Rabatt-Faktor · Skonto-Faktor + Bezugskosten. Immer ohne Umsatzsteuer. Für ein Stück: am Ende durch die Stückzahl teilen.","vi":"Giữ đúng thứ tự: trước tiên Rabatt, sau đó Skonto, rồi Bezugskosten. Chuỗi tính: số lượng · giá · hệ số Rabatt · hệ số Skonto + Bezugskosten. Luôn không có thuế. Cho một chiếc: cuối cùng chia cho số lượng."},"type":"calc","parts":[{"q":{"de":"Berechnen Sie den Bezugspreis in Euro (netto) für ein Hemd!","vi":"Berechnen Sie den Bezugspreis in Euro (netto) für ein Hemd!\n🇻🇳 Hãy tính Bezugspreis bằng euro (netto) cho một chiếc áo!"},"u":"€","a":13.6,"tol":0.005,"steps":["250 · 15 · 0,9 = 3.375,00 + 25,00 = 3.400,00 : 250 = 13,60 €"],"work":true},{"q":{"de":"Berechnen Sie den Bruttoverkaufspreis für ein Hemd, wenn Sie mit 60 % Handlungskostenzuschlag, 6 % Gewinn und 19 % Umsatzsteuer kalkulieren!","vi":"Berechnen Sie den Bruttoverkaufspreis für ein Hemd, wenn Sie mit 60 % Handlungskostenzuschlag, 6 % Gewinn und 19 % Umsatzsteuer kalkulieren!\n🇻🇳 Hãy tính Bruttoverkaufspreis cho một chiếc áo khi tính giá với 60 % Handlungskostenzuschlag, 6 % Gewinn và 19 % Umsatzsteuer!"},"u":"€","a":27.45,"tol":0.005,"steps":["13,60 · 1,6 · 1,06 · 1,19 = 27,45 €"],"work":true},{"q":{"de":"Ermitteln Sie den Kalkulationsfaktor! (4 Nachkommastellen)","vi":"Ermitteln Sie den Kalkulationsfaktor! (4 Nachkommastellen)\n🇻🇳 Hãy tính Kalkulationsfaktor! (4 chữ số sau dấu phẩy)"},"u":"","a":2.0184,"tol":5e-05,"steps":["27,45 : 13,60 = 2,0184"],"work":true},{"q":{"de":"Nachdem Sie den Preis auf 22,00 € gesenkt hatten, bieten Sie die restlichen 120 Hemden zu je 16,50 € an. Um wie viel Prozent haben Sie den Preis nochmals reduziert?","vi":"Nachdem Sie den Preis auf 22,00 € gesenkt hatten, bieten Sie die restlichen 120 Hemden zu je 16,50 € an. Um wie viel Prozent haben Sie den Preis nochmals reduziert?\n🇻🇳 Sau khi đã giảm giá xuống 22,00 €, em bán 120 chiếc áo còn lại với giá 16,50 € mỗi chiếc. Em đã giảm giá thêm bao nhiêu phần trăm?"},"u":"%","a":25,"tol":0.01,"steps":["(22,00 – 16,50) : 22,00 · 100 = 25 %"],"work":true},{"q":{"de":"Berechnen Sie den Bruttoumsatz dieser Sonderaktion!","vi":"Berechnen Sie den Bruttoumsatz dieser Sonderaktion!\n🇻🇳 Hãy tính doanh thu brutto của đợt khuyến mãi này!"},"u":"€","a":1980,"tol":0.005,"steps":["120 · 16,50 = 1.980,00 € brutto"]},{"q":{"de":"Berechnen Sie den Nettoumsatz dieser Sonderaktion!","vi":"Berechnen Sie den Nettoumsatz dieser Sonderaktion!\n🇻🇳 Hãy tính doanh thu netto của đợt khuyến mãi này!"},"u":"€","a":1663.87,"tol":0.005,"steps":["1.980,00 : 1,19 = 1.663,87 € netto"]}],"pts":4.5},{"id":"g3","no":"Aufgabe 4","title":{"de":"Prüfungstraining B: Gemischt wie in der Prüfung","vi":"Prüfungstraining B: Gemischt wie in der Prüfung · Luyện thi B: hỗn hợp như trong kỳ thi"},"instr":{"de":"Überlege zuerst, welches Werkzeug es ist (z. B. „Senkung in %“). Dann rechne.","vi":"Überlege zuerst, welches Werkzeug es ist (z. B. „Senkung in %“). Dann rechne.\n🇻🇳 Trước tiên hãy nghĩ xem đó là công cụ nào (ví dụ „mức giảm %“). Sau đó tính."},"tip":{"de":"Erkenne zuerst das Muster: Bezugspreis, netto aus brutto, Senkung in %, Prozentwert, Einheitspreis, mit Faktor oder alter Preis? Schreibe die Rechenkette auf, runde am Ende und schreibe die Einheit dazu.","vi":"Trước tiên nhận ra dạng bài: Bezugspreis, netto từ brutto, mức giảm %, giá trị phần trăm, Einheitspreis, dùng Faktor hay giá cũ? Viết chuỗi phép tính, làm tròn ở cuối và ghi đơn vị."},"type":"calc","parts":[{"q":{"de":"Schlüsselanhänger: 100 Stück zu 4,50 €, 18 % Rabatt, 2 % Skonto, Bezugskosten 45,00 €. Bezugspreis der Lieferung?","vi":"Schlüsselanhänger: 100 Stück zu 4,50 €, 18 % Rabatt, 2 % Skonto, Bezugskosten 45,00 €. Bezugspreis der Lieferung?\n🇻🇳 Móc khóa: 100 chiếc giá 4,50 €, 18 % Rabatt, 2 % Skonto, Bezugskosten 45,00 €. Bezugspreis của lô hàng?"},"u":"€","a":406.62,"tol":0.005,"steps":[{"de":"Werkzeug: Bezugspreis · 450 · 0,82 · 0,98 + 45 = 406,62 €","vi":"Công cụ: Bezugspreis · 450 · 0,82 · 0,98 + 45 = 406,62 €"}],"work":true},{"q":{"de":"Kassenabrechnung: 5.950,00 € brutto (19 %). Nettoumsatz?","vi":"Kassenabrechnung: 5.950,00 € brutto (19 %). Nettoumsatz?\n🇻🇳 Kết toán quầy thu ngân: 5.950,00 € brutto (19 %). Doanh thu netto?"},"u":"€","a":5000,"tol":0.005,"steps":[{"de":"Werkzeug: netto aus brutto · 5.950 : 1,19 = 5.000,00 €","vi":"Công cụ: netto từ brutto · 5.950 : 1,19 = 5.000,00 €"}],"work":true},{"q":{"de":"Einführungspreis 64,99 € statt kalkuliert 99,99 €. Reduzierung in % (ganze Zahl)?","vi":"Einführungspreis 64,99 € statt kalkuliert 99,99 €. Reduzierung in % (ganze Zahl)?\n🇻🇳 Giá ra mắt 64,99 € thay vì giá đã tính 99,99 €. Mức giảm theo % (số nguyên)?"},"u":"%","a":35,"tol":0.01,"steps":[{"de":"Werkzeug: Senkung in % · 35 : 99,99 · 100 = 35 %","vi":"Công cụ: mức giảm % · 35 : 99,99 · 100 = 35 %"}],"work":true},{"q":{"de":"Personalrabatt 12,5 % auf 126,00 €. Wie viel spart die Mitarbeiterin?","vi":"Personalrabatt 12,5 % auf 126,00 €. Wie viel spart die Mitarbeiterin?\n🇻🇳 Personalrabatt 12,5 % trên 126,00 €. Nhân viên tiết kiệm bao nhiêu?"},"u":"€","a":15.75,"tol":0.005,"steps":[{"de":"Werkzeug: Prozentwert · 126 · 0,125 = 15,75 €","vi":"Công cụ: giá trị phần trăm · 126 · 0,125 = 15,75 €"}],"work":true},{"q":{"de":"Restposten Halstücher: 18 Stück zu 18 €, 20 zu 16 €, 12 zu 13 €. Einheitspreis?","vi":"Restposten Halstücher: 18 Stück zu 18 €, 20 zu 16 €, 12 zu 13 €. Einheitspreis?\n🇻🇳 Hàng tồn khăn quàng cổ: 18 chiếc giá 18 €, 20 chiếc giá 16 €, 12 chiếc giá 13 €. Giá thống nhất?"},"u":"€","a":16,"tol":0.005,"steps":[{"de":"Werkzeug: Einheitspreis · (324 + 320 + 156) : 50 = 16,00 €","vi":"Công cụ: Einheitspreis · (324 + 320 + 156) : 50 = 16,00 €"}],"work":true},{"q":"Bezugspreis 13,81 €, Kalkulationsfaktor 1,8103. Bruttoverkaufspreis?","u":"€","a":25,"tol":0.005,"steps":[{"de":"Werkzeug: mit Faktor · 13,81 · 1,8103 = 25,00 €","vi":"Công cụ: dùng Faktor · 13,81 · 1,8103 = 25,00 €"}],"work":true},{"q":{"de":"Nach 15 % Rabatt zahlt eine Kundin 85,00 €. Ursprünglicher Preis?","vi":"Nach 15 % Rabatt zahlt eine Kundin 85,00 €. Ursprünglicher Preis?\n🇻🇳 Sau khi giảm 15 % Rabatt, một khách trả 85,00 €. Giá ban đầu?"},"u":"€","a":100,"tol":0.005,"steps":[{"de":"Werkzeug: alter Preis · 85 : 0,85 = 100,00 €","vi":"Công cụ: giá cũ · 85 : 0,85 = 100,00 €"}],"work":true},{"q":{"de":"Reklamation: Kaufpreisminderung 25 % von 198,00 €. Wie viel Euro erhält der Kunde zurück?","vi":"Reklamation: Kaufpreisminderung 25 % von 198,00 €. Wie viel Euro erhält der Kunde zurück?\n🇻🇳 Khiếu nại: giảm giá mua 25 % của 198,00 €. Khách nhận lại bao nhiêu euro?"},"u":"€","a":49.5,"tol":0.005,"steps":[{"de":"Werkzeug: Prozentwert · 198 · 0,25 = 49,50 €","vi":"Công cụ: giá trị phần trăm · 198 · 0,25 = 49,50 €"}],"work":true}],"pts":6},{"id":"g3_1","no":"Aufgabe 4","title":{"de":"Prüfungstraining B: Gemischt wie in der Prüfung","vi":"Prüfungstraining B: Gemischt wie in der Prüfung · Luyện thi B: hỗn hợp như trong kỳ thi"},"instr":{"de":"Überlege zuerst, welches Werkzeug es ist (z. B. „Senkung in %“). Dann rechne.","vi":"Überlege zuerst, welches Werkzeug es ist (z. B. „Senkung in %“). Dann rechne.\n🇻🇳 Trước tiên hãy nghĩ xem đó là công cụ nào (ví dụ „mức giảm %“). Sau đó tính."},"tip":{"de":"Jeder Preis hat vier Teile: Bezugspreis, Handlungskosten, Gewinn, Umsatzsteuer. Welcher Teil ist betroffen? Einkauf und Anlieferung gehören zum Bezugspreis. Kosten im eigenen Betrieb sind Handlungskosten.","vi":"Mỗi giá bán có bốn phần: Bezugspreis, Handlungskosten, Gewinn, Umsatzsteuer. Phần nào bị ảnh hưởng? Mua hàng và vận chuyển đến thuộc về Bezugspreis. Chi phí trong doanh nghiệp là Handlungskosten."},"type":"mc","qs":[{"q":{"de":"Die Kosten für die Anlieferung der Waren sind gestiegen. Welche Auswirkung hat das auf die Kalkulation?","vi":"Die Kosten für die Anlieferung der Waren sind gestiegen. Welche Auswirkung hat das auf die Kalkulation?\n🇻🇳 Chi phí giao hàng đến đã tăng. Điều đó ảnh hưởng thế nào đến việc tính giá?"},"o":["Die Handlungskosten erhöhen sich.","Der Gewinn erhöht sich.","Der Bezugspreis erhöht sich.","Die Umsatzsteuer sinkt.","Der Kalkulationsfaktor sinkt."],"a":2,"why":{"de":"Anlieferung = Bezugskosten.","vi":"Giao hàng đến = Bezugskosten."}}],"pts":0.5},{"id":"g4","no":"Aufgabe 5","title":{"de":"Ablenker-Detektiv: Welche Zahl ist richtig?","vi":"Ablenker-Detektiv: Welche Zahl ist richtig? · Thám tử tìm đáp án gây nhiễu: số nào đúng?"},"instr":{"de":"So baut die IHK ihre Antwortmöglichkeiten: Jede falsche Zahl entsteht aus einem typischen Fehler. Wähle die richtige Zahl. In der Lösung steht, welcher Fehler hinter den falschen Zahlen steckt.","vi":"So baut die IHK ihre Antwortmöglichkeiten: Jede falsche Zahl entsteht aus einem typischen Fehler. Wähle die richtige Zahl. In der Lösung steht, welcher Fehler hinter den falschen Zahlen steckt.\n🇻🇳 IHK xây dựng các đáp án như sau: mỗi số sai xuất phát từ một lỗi thường gặp. Chọn số đúng. Trong lời giải có ghi lỗi nào nằm sau các số sai."},"tip":{"de":"Rechne die Aufgabe zuerst selbst. Welche Zahl kommt bei dir heraus? Die falschen Zahlen entstehen aus typischen Fehlern: Bezugskosten vergessen, Umsatzsteuer vergessen, zu früh gerundet, falscher Grundwert.","vi":"Trước tiên hãy tự tính bài. Em ra kết quả nào? Các số sai xuất phát từ lỗi thường gặp: quên Bezugskosten, quên thuế, làm tròn quá sớm, sai giá trị gốc."},"type":"mc","qs":[{"q":{"de":"D1 Bezugspreis je Stück. Die Kaufhaus Hansa GmbH bestellt 150 Trinkflaschen zu je 8,40 € (Listeneinkaufspreis). Der Lieferant gewährt 12,5 % Rabatt und bei Zahlung innerhalb von 10 Tagen 3 % Skonto. Die Bezugskosten betragen insgesamt 45,00 €. Sie zahlen innerhalb der Skontofrist. Berechnen Sie den Bezugspreis in Euro für eine Trinkflasche!","vi":"D1 Bezugspreis je Stück. Die Kaufhaus Hansa GmbH bestellt 150 Trinkflaschen zu je 8,40 € (Listeneinkaufspreis). Der Lieferant gewährt 12,5 % Rabatt und bei Zahlung innerhalb von 10 Tagen 3 % Skonto. Die Bezugskosten betragen insgesamt 45,00 €. Sie zahlen innerhalb der Skontofrist. Berechnen Sie den Bezugspreis in Euro für eine Trinkflasche!\n🇻🇳 D1 Bezugspreis mỗi chiếc. Kaufhaus Hansa GmbH đặt 150 bình nước, mỗi chiếc 8,40 € (Listeneinkaufspreis). Nhà cung cấp giảm 12,5 % Rabatt và 3 % Skonto nếu trả trong vòng 10 ngày. Bezugskosten tổng cộng là 45,00 €. Em trả trong thời hạn Skonto. Hãy tính Bezugspreis bằng euro cho một bình nước!"},"o":["7,44 €","7,43 €","7,40 €","7,13 €","8,84 €"],"a":1,"why":{"de":"Richtig: 150 · 8,40 = 1.260,00 € · 0,875 = 1.102,50 € · 0,97 = 1.069,43 € + 45,00 € = 1.114,43 € : 150 = 7,43 €. Fehler: 7,44 € zu früh gerundet (0,85) · 7,40 € Rabatt und Skonto zusammengezählt (15,5 %) · 7,13 € Bezugskosten vergessen · 8,84 € Umsatzsteuer auf den Bezugspreis gerechnet.","vi":"Đúng: 150 · 8,40 = 1.260,00 € · 0,875 = 1.102,50 € · 0,97 = 1.069,43 € + 45,00 € = 1.114,43 € : 150 = 7,43 €. Lỗi: 7,44 € làm tròn quá sớm (0,85) · 7,40 € cộng Rabatt và Skonto lại (15,5 %) · 7,13 € quên Bezugskosten · 8,84 € tính thuế trên Bezugspreis."}},{"q":{"de":"D2 Bruttoverkaufspreis. Der Bezugspreis einer Daunenweste beträgt 36,40 €. Die Kaufhaus Hansa GmbH kalkuliert mit 45 % Handlungskostenzuschlag, 8 % Gewinn und 19 % Umsatzsteuer. Berechnen Sie den Bruttoverkaufspreis in Euro!","vi":"D2 Bruttoverkaufspreis. Der Bezugspreis einer Daunenweste beträgt 36,40 €. Die Kaufhaus Hansa GmbH kalkuliert mit 45 % Handlungskostenzuschlag, 8 % Gewinn und 19 % Umsatzsteuer. Berechnen Sie den Bruttoverkaufspreis in Euro!\n🇻🇳 D2 Bruttoverkaufspreis. Bezugspreis của một áo gi-lê phao là 36,40 €. Kaufhaus Hansa GmbH tính giá với 45 % Handlungskostenzuschlag, 8 % Gewinn và 19 % Umsatzsteuer. Hãy tính Bruttoverkaufspreis bằng euro!"},"o":["63,92 €","57,00 €","67,70 €","67,83 €","66,27 €"],"a":3,"why":{"de":"Richtig: 36,40 € · 1,45 = 52,78 € (Selbstkosten) · 1,08 = 57,00 € (Nettoverkaufspreis) · 1,19 = 67,83 €. Fehler: 63,92 € Umsatzsteuer nur vom Bezugspreis · 57,00 € Umsatzsteuer vergessen · 67,70 € Faktor zu früh auf 1,86 gerundet · 66,27 € Gewinn auf den Bezugspreis statt auf die Selbstkosten (53 %).","vi":"Đúng: 36,40 € · 1,45 = 52,78 € (Selbstkosten) · 1,08 = 57,00 € (Nettoverkaufspreis) · 1,19 = 67,83 €. Lỗi: 63,92 € thuế chỉ tính từ Bezugspreis · 57,00 € quên thuế · 67,70 € làm tròn hệ số quá sớm thành 1,86 · 66,27 € tính Gewinn trên Bezugspreis thay vì trên Selbstkosten (53 %)."}},{"q":{"de":"D3 Vom Listenpreis zum Bruttoverkaufspreis. Ein Paar Wanderschuhe kostet beim Lieferanten 60,00 € (Listeneinkaufspreis). Sie erhalten 20 % Rabatt und 2 % Skonto. Die Bezugskosten betragen 1,96 € je Paar. Kalkuliert wird mit 40 % Handlungskosten, 10 % Gewinn und 19 % Umsatzsteuer. Berechnen Sie den Bruttoverkaufspreis in Euro für ein Paar!","vi":"D3 Vom Listenpreis zum Bruttoverkaufspreis. Ein Paar Wanderschuhe kostet beim Lieferanten 60,00 € (Listeneinkaufspreis). Sie erhalten 20 % Rabatt und 2 % Skonto. Die Bezugskosten betragen 1,96 € je Paar. Kalkuliert wird mit 40 % Handlungskosten, 10 % Gewinn und 19 % Umsatzsteuer. Berechnen Sie den Bruttoverkaufspreis in Euro für ein Paar!\n🇻🇳 D3 Từ Listenpreis đến Bruttoverkaufspreis. Một đôi giày leo núi có giá 60,00 € ở nhà cung cấp (Listeneinkaufspreis). Em được 20 % Rabatt và 2 % Skonto. Bezugskosten là 1,96 € mỗi đôi. Tính giá với 40 % Handlungskosten, 10 % Gewinn và 19 % Umsatzsteuer. Hãy tính Bruttoverkaufspreis bằng euro cho một đôi!"},"o":["86,21 €","89,36 €","95,56 €","89,80 €","75,46 €"],"a":3,"why":{"de":"Richtig: Bezugspreis: 60,00 · 0,8 · 0,98 = 47,04 + 1,96 = 49,00 €; 49,00 · 1,4 · 1,1 · 1,19 = 89,80 €. Fehler: 86,21 € Bezugskosten vergessen · 89,36 € Rabatt und Skonto zusammengezählt (22 %) · 95,56 € Handlungskosten vom Listenpreis gerechnet · 75,46 € Umsatzsteuer vergessen.","vi":"Đúng: Bezugspreis: 60,00 · 0,8 · 0,98 = 47,04 + 1,96 = 49,00 €; 49,00 · 1,4 · 1,1 · 1,19 = 89,80 €. Lỗi: 86,21 € quên Bezugskosten · 89,36 € cộng Rabatt và Skonto lại (22 %) · 95,56 € tính Handlungskosten từ Listenpreis · 75,46 € quên thuế."}},{"q":{"de":"D4 Bezugspreis mit dem Kalkulationsfaktor. Ein Rucksack soll für 89,90 € verkauft werden. Die Kaufhaus Hansa GmbH kalkuliert bei Rucksäcken mit einem Kalkulationsfaktor von 1,85 (bezogen auf den Bruttoverkaufspreis). Welchen Bezugspreis in Euro darf der Rucksack höchstens haben?","vi":"D4 Bezugspreis mit dem Kalkulationsfaktor. Ein Rucksack soll für 89,90 € verkauft werden. Die Kaufhaus Hansa GmbH kalkuliert bei Rucksäcken mit einem Kalkulationsfaktor von 1,85 (bezogen auf den Bruttoverkaufspreis). Welchen Bezugspreis in Euro darf der Rucksack höchstens haben?\n🇻🇳 D4 Bezugspreis với Kalkulationsfaktor. Một chiếc ba lô sẽ được bán với giá 89,90 €. Kaufhaus Hansa GmbH tính giá ba lô với Kalkulationsfaktor 1,85 (tính trên Bruttoverkaufspreis). Chiếc ba lô được có Bezugspreis tối đa bao nhiêu euro?"},"o":["48,59 €","47,32 €","166,32 €","40,84 €","13,49 €"],"a":0,"why":{"de":"Richtig: 89,90 : 1,85 = 48,59 €. Fehler: 47,32 € Faktor zu früh auf 1,9 gerundet · 166,32 € mal statt geteilt · 40,84 € Umsatzsteuer vorher herausgerechnet (der Faktor bezieht sich aber auf den Bruttoverkaufspreis) · 13,49 € Zuschlag (85 %) vom Verkaufspreis abgezogen.","vi":"Đúng: 89,90 : 1,85 = 48,59 €. Lỗi: 47,32 € làm tròn hệ số quá sớm thành 1,9 · 166,32 € nhân thay vì chia · 40,84 € tách thuế ra trước (nhưng hệ số tính trên Bruttoverkaufspreis) · 13,49 € trừ Zuschlag (85 %) khỏi giá bán."}},{"q":{"de":"D5 Zweite Preissenkung. Sweatshirts kosteten ursprünglich 29,99 €. In einer ersten Aktion wurde der Preis auf 23,99 € gesenkt. In einer zweiten Aktion bieten Sie die restlichen Sweatshirts für 17,99 € an. Um wie viel Prozent haben Sie den Preis in der zweiten Aktion noch einmal gesenkt? (2 Nachkommastellen)","vi":"D5 Zweite Preissenkung. Sweatshirts kosteten ursprünglich 29,99 €. In einer ersten Aktion wurde der Preis auf 23,99 € gesenkt. In einer zweiten Aktion bieten Sie die restlichen Sweatshirts für 17,99 € an. Um wie viel Prozent haben Sie den Preis in der zweiten Aktion noch einmal gesenkt? (2 Nachkommastellen)\n🇻🇳 D5 Giảm giá lần hai. Áo nỉ ban đầu có giá 29,99 €. Trong đợt đầu giá được giảm xuống 23,99 €. Trong đợt thứ hai em bán các áo còn lại với giá 17,99 €. Trong đợt thứ hai em đã giảm giá thêm bao nhiêu phần trăm? (2 chữ số sau dấu phẩy)"},"o":["25,00 %","40,01 %","25,01 %","33,35 %","74,99 %"],"a":2,"why":{"de":"Richtig: (23,99 – 17,99) : 23,99 · 100 = 6,00 : 23,99 · 100 = 25,01 %. Fehler: 25,00 % zu früh gerundet · 40,01 % Grundwert ist der ursprüngliche Preis · 33,35 % durch den neuen Preis geteilt · 74,99 % das ist der Anteil, der vom Preis übrig bleibt.","vi":"Đúng: (23,99 – 17,99) : 23,99 · 100 = 6,00 : 23,99 · 100 = 25,01 %. Lỗi: 25,00 % làm tròn quá sớm · 40,01 % lấy giá ban đầu làm giá trị gốc · 33,35 % chia cho giá mới · 74,99 % đó là phần còn lại của giá."}},{"q":{"de":"D6 Nettoumsatz der Tageskasse. Die Kassenabrechnung der Spielwarena vg6","no":"Aufgabe 7","title":{"de":"Vertiefung","vi":"Vertiefung · Nâng cao"},"instr":{"de":"Nur in der Ebene „Vertiefung“. Begründe in ganzen Sätzen. Diese Aufgaben geben Bonuspunkte und senken deine 20 Punkte nie.","vi":"Nur in der Ebene „Vertiefung“. Begründe in ganzen Sätzen. Diese Aufgaben geben Bonuspunkte und senken deine 20 Punkte nie.\n🇻🇳 Chỉ ở mức „Vertiefung“. Giải thích bằng câu đầy đủ. Các bài này cho điểm thưởng và không bao giờ làm giảm 20 điểm của em."},"level":"v","tip":{"de":"Überlege: Worauf bezieht sich der Prozentsatz – was sind hier 100 %? Begründe mit „weil“ und zeige es an einem Zahlenbeispiel.","vi":"Hãy nghĩ: số phần trăm này tính trên cái gì – ở đây 100 % là gì? Giải thích bằng „weil“ và cho thấy bằng một ví dụ số."},"type":"free","parts":[{"q":{"de":"Warum kosten Folgefehler keine Punkte, wenn der Rechenweg dasteht? Begründe mit der Hemden-Familie.","vi":"Warum kosten Folgefehler keine Punkte, wenn der Rechenweg dasteht? Begründe mit der Hemden-Familie.\n🇻🇳 Vì sao lỗi kéo theo không bị trừ điểm khi cách tính được viết ra? Giải thích bằng chuỗi bài áo sơ mi."},"m":{"de":"Jede Teilaufgabe baut auf der vorigen auf. Ist z. B. der Bezugspreis falsch, aber danach richtig weitergerechnet, sieht der Prüfer am Rechenweg, dass die Methode stimmt. Ohne Rechenweg wäre nur das falsche Ergebnis zu sehen.","vi":"Jede Teilaufgabe baut auf der vorigen auf. Ist z. B. der Bezugspreis falsch, aber danach richtig weitergerechnet, sieht der Prüfer am Rechenweg, dass die Methode stimmt. Ohne Rechenweg wäre nur das falsche Ergebnis zu sehen.\n🇻🇳 Mỗi phần dựa trên phần trước. Ví dụ nếu Bezugspreis sai nhưng sau đó tính tiếp đúng thì giám khảo thấy qua cách tính rằng phương pháp là đúng. Không có cách tính thì chỉ thấy kết quả sai."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"Warum führt „zu früh gerundet“ zu einem falschen Ergebnis? Begründe mit D1 (0,875 · 0,97 = 0,84875).","vi":"Waru  if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}

 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';

  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},

 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{

window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
