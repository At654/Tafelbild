<script>
const SHEET={"id":"M2","short":"LF 9 · Modul 2","title":"Modul 2 – Vom Listenpreis zum Bezugspreis","sub":"Lernfeld 9 · Preispolitische Maßnahmen vorbereiten und durchführen","can":[{"de":"Ich kann aus einer Rechnung oder einem Angebot den Bezugspreis berechnen: erst Rabatt, dann Skonto, dann Bezugskosten.","vi":"Tôi có thể tính Bezugspreis từ một hóa đơn hoặc một bản chào giá: trước Rabatt, sau đó Skonto, rồi Bezugskosten."},{"de":"Ich kann den Bezugspreis für ein Stück berechnen und rechne dabei ohne Umsatzsteuer.","vi":"Tôi có thể tính Bezugspreis cho một chiếc và tính không có thuế."},{"de":"Ich kann zwei Angebote vergleichen und das günstigere finden.","vi":"Tôi có thể so sánh hai bản chào giá và tìm ra bản rẻ hơn."},{"de":"Ich kann Rabatt, Skonto und Bonus unterscheiden.","vi":"Tôi có thể phân biệt Rabatt, Skonto và Bonus."}],"items":[{"id":"g0","no":"Aufgabe 1","title":{"de":"Abruf: Zwei Fragen aus dem Kopf","vi":"Abruf: Zwei Fragen aus dem Kopf · Nhớ lại: hai câu hỏi trả lời bằng trí nhớ"},"instr":{"de":"Ohne Buch, ohne Heft. Fragen aus früheren Modulen und Lernfeldern – so bleibt das Wissen fürs Fachgespräch frisch. Erst danach vergleichen.","vi":"Ohne Buch, ohne Heft. Fragen aus früheren Modulen und Lernfeldern – so bleibt das Wissen fürs Fachgespräch frisch. Erst danach vergleichen.\n🇻🇳 Không dùng sách, không dùng vở. Các câu hỏi từ những mô-đun và lĩnh vực học trước – để kiến thức luôn mới cho buổi vấn đáp. Sau đó mới so đáp án."},"tip":{"de":"Das kennst du aus einem früheren Lernfeld. Was fällt dir zuerst ein? Schreibe Stichworte auf. Vergleiche erst danach mit der Lösung.","vi":"Em đã học điều này ở một lĩnh vực học trước. Em nhớ ra điều gì đầu tiên? Viết các từ khóa. Sau đó mới so với đáp án."},"type":"free","parts":[{"q":{"de":"A1 Wie lange ist die Rügefrist bei offenen Mängeln beim zweiseitigen Handelskauf? (aus LF 6)","vi":"A1 Wie lange ist die Rügefrist bei offenen Mängeln beim zweiseitigen Handelskauf? (aus LF 6)\n🇻🇳 A1 Thời hạn khiếu nại (Rügefrist) đối với lỗi nhìn thấy được trong mua bán giữa hai thương nhân là bao lâu? (từ LF 6)"},"m":{"de":"unverzüglich (sofort nach Prüfung)","vi":"unverzüglich (sofort nach Prüfung)\n🇻🇳 ngay lập tức (ngay sau khi kiểm tra)"},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]},{"q":{"de":"A2 Was ist der Unterschied zwischen Anfrage und Angebot? (aus LF 6)","vi":"A2 Was ist der Unterschied zwischen Anfrage und Angebot? (aus LF 6)\n🇻🇳 A2 Sự khác nhau giữa Anfrage (hỏi giá) và Angebot (chào giá) là gì? (từ LF 6)"},"m":{"de":"Anfrage: unverbindliche Bitte um ein Angebot; Angebot: Willenserklärung des Verkäufers, an die er gebunden ist","vi":"Anfrage: unverbindliche Bitte um ein Angebot; Angebot: Willenserklärung des Verkäufers, an die er gebunden ist\n🇻🇳 Anfrage: lời đề nghị gửi bản chào giá, không ràng buộc; Angebot: tuyên bố ý chí của người bán, người bán bị ràng buộc bởi nó"},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":0.5},{"id":"g1","no":"Aufgabe 2","title":{"de":"Ankommen: Was weißt du noch aus Modul 1?","vi":"Ankommen: Was weißt du noch aus Modul 1? · Khởi động: em còn nhớ gì từ mô-đun 1?"},"instr":{"de":"Aus dem Kopf. Schreibe nur den Faktor, z. B. 0,85.","vi":"Aus dem Kopf. Schreibe nur den Faktor, z. B. 0,85.\n🇻🇳 Trả lời bằng trí nhớ. Chỉ viết hệ số, ví dụ 0,85."},"tip":{"de":"Plus oder minus? Bei Plus wird der Faktor größer als 1, bei Minus kleiner als 1. Plus p % heißt mal (1 + p : 100). Minus p % heißt mal (1 – p : 100).","vi":"Cộng hay trừ? Khi cộng thì hệ số lớn hơn 1, khi trừ thì hệ số nhỏ hơn 1. Cộng p % nghĩa là nhân (1 + p : 100). Trừ p % nghĩa là nhân (1 – p : 100)."},"type":"calc","parts":[{"q":{"de":"a) – 15 % Rabatt → Faktor?","vi":"a) – 15 % Rabatt → Faktor?\n🇻🇳 a) – 15 % Rabatt → hệ số?"},"u":"","a":0.85,"tol":0.005,"steps":["· 0,85"]},{"q":{"de":"b) – 3 % Skonto → Faktor?","vi":"b) – 3 % Skonto → Faktor?\n🇻🇳 b) – 3 % Skonto → hệ số?"},"u":"","a":0.97,"tol":0.005,"steps":["· 0,97"]},{"q":{"de":"c) + 19 % Umsatzsteuer → Faktor?","vi":"c) + 19 % Umsatzsteuer → Faktor?\n🇻🇳 c) + 19 % thuế → hệ số?"},"u":"","a":1.19,"tol":0.005,"steps":["· 1,19"]},{"q":{"de":"d) brutto → netto (19 %): Durch welche Zahl teilst du?","vi":"d) brutto → netto (19 %): Durch welche Zahl teilst du?\n🇻🇳 d) brutto → netto (19 %): em chia cho số nào?"},"u":"","a":1.19,"tol":0.005,"steps":[": 1,19"]}],"pts":1.5},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher · Wortspeicher (kho từ)"},"html":"<p>der Listeneinkaufspreis · der Rabatt · der Zieleinkaufspreis · der Skonto · der Bareinkaufspreis · die Bezugskosten · der Bezugspreis (Einstandspreis) · der Mengenrabatt · der Bonus · frei Haus · ab Werk · netto · brutto · je Stück</p>","vi":"Listeneinkaufspreis = giá mua theo bảng giá · Rabatt = giảm giá (ngay trên hóa đơn) · Zieleinkaufspreis = giá mua sau khi trừ Rabatt · Skonto = giảm giá khi trả tiền nhanh · Bareinkaufspreis = giá mua khi trả ngay · Bezugskosten = chi phí nhập hàng (vận chuyển, đóng gói) · Bezugspreis (Einstandspreis) = giá nhập hàng thực tế · Mengenrabatt = giảm giá theo số lượng · Bonus = tiền thưởng trả sau · frei Haus = giao hàng miễn phí · ab Werk = giao tại xưởng (người mua trả vận chuyển) · netto = chưa có thuế · brutto = đã có thuế · je Stück = mỗi chiếc"},{"id":"r1","no":"Lesen 1","type":"read","title":{"de":"Das Schema der Bezugskalkulation","vi":"Das Schema der Bezugskalkulation · Sơ đồ tính giá nhập hàng"},"instr":{"de":"Markiere die vier Preise des Schemas vom Anfang bis zum Ende.","vi":"Markiere die vier Preise des Schemas vom Anfang bis zum Ende.\n🇻🇳 Đánh dấu bốn mức giá của sơ đồ từ đầu đến cuối."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Am Anfang steht der [[Listeneinkaufspreis]]. Das ist der Preis laut Liste oder Angebot des Lieferanten (netto). Davon ziehst du zuerst den Rabatt ab. Das Ergebnis ist der [[Zieleinkaufspreis]]. Dann ziehst du den Skonto ab und erhältst den [[Bareinkaufspreis]]. Zum Schluss kommen die Bezugskosten dazu. Das Ergebnis ist der [[Bezugspreis]]. Er heißt auch Einstandspreis. Der Bruttoverkaufspreis gehört nicht in dieses Schema."],"vi":"Đầu tiên là Listeneinkaufspreis. Đó là giá theo bảng giá hoặc bản chào giá của nhà cung cấp (netto). Từ đó em trừ Rabatt trước. Kết quả là Zieleinkaufspreis. Sau đó em trừ Skonto và được Bareinkaufspreis. Cuối cùng cộng thêm Bezugskosten. Kết quả là Bezugspreis. Nó còn gọi là Einstandspreis. Bruttoverkaufspreis không thuộc sơ đồ này.","quiz":{"q":{"de":"Was kommt nach dem Abzug des Rabatts heraus?","vi":"Was kommt nach dem Abzug des Rabatts heraus?\n🇻🇳 Sau khi trừ Rabatt thì được gì?"},"o":["der Bareinkaufspreis","der Zieleinkaufspreis","der Bezugspreis"],"a":1,"why":{"de":"Richtig ist: der Zieleinkaufspreis","vi":"Đáp án đúng: der Zieleinkaufspreis"}}},{"id":"r2","no":"Lesen 2","type":"read","title":{"de":"Drei wichtige Regeln","vi":"Drei wichtige Regeln · Ba quy tắc quan trọng"},"instr":{"de":"Markiere die drei Regeln in Stichworten.","vi":"Markiere die drei Regeln in Stichworten.\n🇻🇳 Đánh dấu ba quy tắc bằng từ khóa."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Rechne [[immer netto]]. Die Umsatzsteuer zählt nicht zum Bezugspreis, denn der Betrieb bekommt sie vom Finanzamt zurück. Die Reihenfolge ist: [[erst Rabatt, dann Skonto, dann Bezugskosten]]. Skonto wird vom Zieleinkaufspreis gerechnet, nicht vom Listenpreis. Wird der Bezugspreis für ein Stück gefragt, teilst du am Ende [[durch die Stückzahl]]."],"vi":"Luôn tính netto. Thuế doanh thu không tính vào Bezugspreis, vì doanh nghiệp được sở thuế hoàn lại. Thứ tự là: trước Rabatt, sau đó Skonto, rồi Bezugskosten. Skonto được tính từ Zieleinkaufspreis, không phải từ Listenpreis. Nếu đề hỏi Bezugspreis cho một chiếc thì cuối cùng em chia cho số lượng.","quiz":{"q":{"de":"Wovon wird der Skonto berechnet?","vi":"Wovon wird der Skonto berechnet?\n🇻🇳 Skonto được tính từ đâu?"},"o":["vom Listeneinkaufspreis","vom Zieleinkaufspreis","vom Bezugspreis"],"a":1,"why":{"de":"Richtig ist: vom Zieleinkaufspreis","vi":"Đáp án đúng: vom Zieleinkaufspreis"}}},{"id":"r3","no":"Lesen 3","type":"read","title":{"de":"Preisnachlässe des Lieferanten","vi":"Preisnachlässe des Lieferanten · Các khoản giảm giá của nhà cung cấp"},"instr":{"de":"Markiere die drei Nachlässe.","vi":"Markiere die drei Nachlässe.\n🇻🇳 Đánh dấu ba loại giảm giá."},"tip":{"de":"Suche die Wörter, die genau zur Aufgabe passen. Achtung: Nicht jedes Fachwort ist gesucht.","vi":"Hãy tìm những từ đúng với yêu cầu. Chú ý: không phải thuật ngữ nào cũng cần đánh dấu."},"paras":["Den [[Rabatt]] gibt es sofort auf der Rechnung, zum Beispiel als Mengenrabatt für eine große Menge. Den [[Skonto]] gibt es, wenn innerhalb einer kurzen Frist gezahlt wird. Den [[Bonus]] gibt es nachträglich, zum Beispiel am Jahresende, wenn ein bestimmter Umsatz erreicht wurde. Die Fracht ist kein Nachlass."],"vi":"Rabatt được trừ ngay trên hóa đơn, ví dụ Mengenrabatt khi mua số lượng lớn. Skonto có khi trả tiền trong một thời hạn ngắn. Bonus được trả về sau, ví dụ cuối năm, khi đạt một mức doanh thu nhất định. Fracht (cước vận chuyển) không phải là giảm giá.","quiz":{"q":{"de":"Welchen Nachlass gibt es nachträglich am Jahresende?","vi":"Welchen Nachlass gibt es nachträglich am Jahresende?\n🇻🇳 Khoản giảm giá nào được trả về sau vào cuối năm?"},"o":["Rabatt","Skonto","Bonus"],"a":2,"why":{"de":"Richtig ist: Bonus","vi":"Đáp án đúng: Bonus"}}},{"id":"w2","type":"info","title":{"de":"Zum Nachlesen: Übersicht","vi":"Zum Nachlesen: Übersicht · Để đọc lại: tổng quan"},"html":"<h4>Das Schema der Bezugskalkulation</h4><p>Listeneinkaufspreis: Preis laut Liste oder Angebot des Lieferanten (netto) · Menge · Beispiel: 100 · 20,00 = 2.000,00 €</p><p>– Rabatt: Preisnachlass, z. B. für eine große Menge – immer zuerst · Beispiel: · 0,9 → 1.800,00 €</p><p>= Zieleinkaufspreis: So viel müsste man zahlen, wenn man das Zahlungsziel (z. B. 30 Tage) ausnutzt.</p><p>– Skonto: Preisnachlass für schnelles Zahlen (z. B. innerhalb von 10 Tagen) · Beispiel: · 0,98</p><p>= Bareinkaufspreis: So viel wird bei schneller Zahlung überwiesen.</p><p>+ Bezugskosten: Fracht, Porto, Verpackung, Transportversicherung – werden nicht rabattiert · Beispiel: + 35,00 €</p><p>= Bezugspreis: Das kostet die Ware wirklich, bis sie im Lager ist. Auch: Einstandspreis.</p><p><b>Merke:</b> Listeneinkaufspreis – Rabatt – Skonto + Bezugskosten = Bezugspreis. In einer Kette: Menge · Preis · Rabatt-Faktor · Skonto-Faktor + Bezugskosten. Immer ohne Umsatzsteuer.</p>","vi":"Sơ đồ tính giá nhập hàng\nListeneinkaufspreis: giá theo bảng giá hoặc bản chào giá của nhà cung cấp (netto) · số lượng · Ví dụ: 100 · 20,00 = 2.000,00 €\n– Rabatt: giảm giá, ví dụ khi mua số lượng lớn – luôn trừ trước · Ví dụ: · 0,9 → 1.800,00 €\n= Zieleinkaufspreis: số tiền phải trả nếu tận dụng hết thời hạn thanh toán (ví dụ 30 ngày).\n– Skonto: giảm giá khi trả tiền nhanh (ví dụ trong vòng 10 ngày) · Ví dụ: · 0,98\n= Bareinkaufspreis: số tiền chuyển khoản khi trả nhanh.\n+ Bezugskosten: cước vận chuyển, bưu phí, đóng gói, bảo hiểm vận chuyển – không được giảm giá · Ví dụ: + 35,00 €\n= Bezugspreis: chi phí thực của hàng hóa cho đến khi vào kho. Còn gọi là: Einstandspreis.\nGhi nhớ: Listeneinkaufspreis – Rabatt – Skonto + Bezugskosten = Bezugspreis. Trong một chuỗi: số lượng · giá · hệ số Rabatt · hệ số Skonto + Bezugskosten. Luôn không có thuế."},{"id":"w3","type":"info","title":{"de":"Vorgemacht: der Bezugspreis für ein Hemd","vi":"Vorgemacht: der Bezugspreis für ein Hemd · Làm mẫu: Bezugspreis cho một chiếc áo sơ mi"},"html":"<p><b>Die Aufgabe:</b> Rechnung: 180 Herrenhemden zu je 16,00 €, abzüglich 10 % Rabatt, zuzüglich 18,00 € Verpackungskosten, zuzüglich 19 % Umsatzsteuer. Berechnen Sie den Bezugspreis in Euro (netto) für ein Hemd!</p><p><b>Listeneinkaufspreis:</b> 180 · 16,00 € = 2.880,00 €</p><p><b>– 10 % Rabatt:</b> 2.880,00 · 0,9 = 2.592,00 €</p><p><b>+ Verpackung:</b> 2.592,00 + 18,00 = 2.610,00 €</p><p><b>Umsatzsteuer?</b> weglassen – der Bezugspreis ist netto</p><p><b>je Hemd:</b> 2.610,00 : 180 = 14,50 €</p><p><b>Taschenrechner:</b> 180 × 16 × 0,9 + 18 = ÷ 180 = → 14,50</p>","vi":"Đề bài: Hóa đơn: 180 áo sơ mi nam, mỗi chiếc 16,00 €, trừ 10 % Rabatt, cộng 18,00 € phí đóng gói, cộng 19 % thuế. Hãy tính Bezugspreis bằng euro (netto) cho một chiếc áo!\nListeneinkaufspreis: 180 · 16,00 € = 2.880,00 €\n– 10 % Rabatt: 2.880,00 · 0,9 = 2.592,00 €\n+ Đóng gói: 2.592,00 + 18,00 = 2.610,00 €\nThuế? bỏ qua – Bezugspreis là netto\nmỗi áo: 2.610,00 : 180 = 14,50 €\nMáy tính: 180 × 16 × 0,9 + 18 = ÷ 180 = → 14,50"},{"id":"g2","no":"Aufgabe 3","title":{"de":"Geführte Übung: 50 Rucksäcke","vi":"Geführte Übung: 50 Rucksäcke · Bài tập có hướng dẫn: 50 chiếc ba lô"},"instr":{"de":"Ein Lieferant liefert 50 Rucksäcke zu je 12,00 €. Er gewährt 20 % Rabatt und bei Zahlung innerhalb von 10 Tagen 2 % Skonto. Die Fracht kostet 14,40 €. Die Kaufhaus Hansa GmbH zahlt sofort. Fülle das Schema Zeile für Zeile aus.","vi":"Ein Lieferant liefert 50 Rucksäcke zu je 12,00 €. Er gewährt 20 % Rabatt und bei Zahlung innerhalb von 10 Tagen 2 % Skonto. Die Fracht kostet 14,40 €. Die Kaufhaus Hansa GmbH zahlt sofort. Fülle das Schema Zeile für Zeile aus.\n🇻🇳 Một nhà cung cấp giao 50 chiếc ba lô, mỗi chiếc 12,00 €. Họ giảm 20 % Rabatt và 2 % Skonto nếu trả trong vòng 10 ngày. Cước vận chuyển là 14,40 €. Kaufhaus Hansa GmbH trả ngay. Điền sơ đồ theo từng dòng."},"tip":{"de":"Gehe das Schema Zeile für Zeile durch. Jede Zeile rechnet mit dem Ergebnis davor. Rabatt vom Listeneinkaufspreis, Skonto vom Zieleinkaufspreis, Bezugskosten werden addiert.","vi":"Đi theo bảng từng dòng một. Mỗi dòng tính tiếp từ kết quả của dòng trước. Rabatt tính từ Listeneinkaufspreis, Skonto tính từ Zieleinkaufspreis, Bezugskosten được cộng thêm."},"type":"calc","parts":[{"q":"Listeneinkaufspreis (50 · 12,00 €)","u":"€","a":600,"tol":0.005,"steps":["600,00 €"]},{"q":{"de":"– 20 % Rabatt: Wie viel Euro Rabatt?","vi":"– 20 % Rabatt: Wie viel Euro Rabatt?\n🇻🇳 – 20 % Rabatt: Rabatt là bao nhiêu euro?"},"u":"€","a":120,"tol":0.005,"steps":["600,00 · 0,2 = 120,00 €"]},{"q":"= Zieleinkaufspreis","u":"€","a":480,"tol":0.005,"steps":["600,00 – 120,00 = 480,00 €"]},{"q":{"de":"– 2 % Skonto: Wie viel Euro Skonto?","vi":"– 2 % Skonto: Wie viel Euro Skonto?\n🇻🇳 – 2 % Skonto: Skonto là bao nhiêu euro?"},"u":"€","a":9.6,"tol":0.005,"steps":["480,00 · 0,02 = 9,60 €"]},{"q":"= Bareinkaufspreis","u":"€","a":470.4,"tol":0.005,"steps":["480,00 – 9,60 = 470,40 €"]},{"q":{"de":"= Bezugspreis für 50 Rucksäcke (mit 14,40 € Fracht)","vi":"= Bezugspreis für 50 Rucksäcke (mit 14,40 € Fracht)\n🇻🇳 = Bezugspreis cho 50 chiếc ba lô (gồm 14,40 € cước vận chuyển)"},"u":"€","a":484.8,"tol":0.005,"steps":[{"de":"470,40 + 14,40 = 484,80 € · in einer Kette: 50 · 12,00 · 0,8 · 0,98 + 14,40 = 484,80 €","vi":"470,40 + 14,40 = 484,80 € · trong một chuỗi: 50 · 12,00 · 0,8 · 0,98 + 14,40 = 484,80 €"}]},{"q":{"de":"Bezugspreis für 1 Rucksack","vi":"Bezugspreis für 1 Rucksack\n🇻🇳 Bezugspreis cho 1 chiếc ba lô"},"u":"€","a":9.7,"tol":0.005,"steps":["484,80 : 50 = 9,70 €"]}],"pts":5.5},{"id":"g3","no":"Aufgabe 4","title":{"de":"Geführte Übung: Welcher Preisnachlass ist gemeint?","vi":"Geführte Übung: Welcher Preisnachlass ist gemeint? · Bài tập có hướng dẫn: đó là khoản giảm giá nào?"},"instr":{"de":"Ordne zu: Rabatt, Skonto oder Bonus?","vi":"Ordne zu: Rabatt, Skonto oder Bonus?\n🇻🇳 Hãy ghép: Rabatt, Skonto hay Bonus?"},"tip":{"de":"Wann bekommt man den Nachlass: sofort, bei schneller Zahlung oder nachträglich? Rabatt: sofort auf der Rechnung. Skonto: für schnelles Zahlen. Bonus: nachträglich, z. B. am Jahresende.","vi":"Khi nào được giảm giá: ngay lập tức, khi trả tiền nhanh hay về sau? Rabatt: ngay trên hóa đơn. Skonto: khi trả tiền nhanh. Bonus: về sau, ví dụ cuối năm."},"type":"match","rows":[{"l":{"de":"Der Lieferant zieht 3 % ab, weil innerhalb von 8 Tagen gezahlt wird.","vi":"Der Lieferant zieht 3 % ab, weil innerhalb von 8 Tagen gezahlt wird.\n🇻🇳 Nhà cung cấp trừ 3 % vì được trả tiền trong vòng 8 ngày."},"a":"Skonto"},{"l":{"de":"Am Jahresende schreibt der Lieferant 2 % des Jahresumsatzes gut.","vi":"Am Jahresende schreibt der Lieferant 2 % des Jahresumsatzes gut.\n🇻🇳 Cuối năm nhà cung cấp hoàn lại 2 % doanh thu cả năm."},"a":"Bonus"},{"l":{"de":"Ab 100 Stück gibt es 10 % Nachlass.","vi":"Ab 100 Stück gibt es 10 % Nachlass.\n🇻🇳 Từ 100 chiếc trở lên được giảm 10 %."},"a":"Rabatt"},{"l":{"de":"Zum Firmenjubiläum gibt es auf alle Bestellungen 5 %.","vi":"Zum Firmenjubiläum gibt es auf alle Bestellungen 5 %.\n🇻🇳 Nhân dịp kỷ niệm công ty, mọi đơn hàng được giảm 5 %."},"a":"Rabatt"}],"pts":1.5},{"id":"g4","no":"Aufgabe 5","title":{"de":"Geführte Übung: Welches Angebot ist günstiger?","vi":"Geführte Übung: Welches Angebot ist günstiger? · Bài tập có hướng dẫn: bản chào giá nào rẻ hơn?"},"instr":{"de":"Die Kaufhaus Hansa GmbH braucht 100 Deckenleuchten und zahlt immer innerhalb von 10 Tagen. Angebot A (Licht-Werk): 20,00 € je Stück, 10 % Rabatt, kein Skonto, Lieferung frei Haus. Angebot B (Lampen-Hansen): 21,00 € je Stück, 15 % Rabatt, 3 % Skonto, Fracht 35,00 €. Entscheide zuerst aus dem Bauch – dann rechne.","vi":"Die Kaufhaus Hansa GmbH braucht 100 Deckenleuchten und zahlt immer innerhalb von 10 Tagen. Angebot A (Licht-Werk): 20,00 € je Stück, 10 % Rabatt, kein Skonto, Lieferung frei Haus. Angebot B (Lampen-Hansen): 21,00 € je Stück, 15 % Rabatt, 3 % Skonto, Fracht 35,00 €. Entscheide zuerst aus dem Bauch – dann rechne.\n🇻🇳 Kaufhaus Hansa GmbH cần 100 đèn trần và luôn trả tiền trong vòng 10 ngày. Angebot A (Licht-Werk): 20,00 € mỗi chiếc, 10 % Rabatt, không có Skonto, giao hàng miễn phí (frei Haus). Angebot B (Lampen-Hansen): 21,00 € mỗi chiếc, 15 % Rabatt, 3 % Skonto, cước vận chuyển 35,00 €. Trước tiên đoán theo cảm giác – sau đó tính."},"tip":{"de":"Halte die Reihenfolge ein: erst Rabatt, dann Skonto, dann Bezugskosten. Kette: Menge · Preis · Rabatt-Faktor · Skonto-Faktor + Bezugskosten. Immer ohne Umsatzsteuer. Für ein Stück: am Ende durch die Stückzahl teilen.","vi":"Giữ đúng thứ tự: trước tiên Rabatt, sau đó Skonto, rồi Bezugskosten. Chuỗi tính: số lượng · giá · hệ số Rabatt · hệ số Skonto + Bezugskosten. Luôn không có thuế. Cho một chiếc: cuối cùng chia cho số lượng."},"type":"calc","parts":[{"q":{"de":"Bezugspreis Angebot A für 100 Stück","vi":"Bezugspreis Angebot A für 100 Stück\n🇻🇳 Bezugspreis của Angebot A cho 100 chiếc"},"u":"€","a":1800,"tol":0.005,"steps":["100 · 20,00 · 0,9 = 1.800,00 €"]},{"q":{"de":"Bezugspreis Angebot B für 100 Stück","vi":"Bezugspreis Angebot B für 100 Stück\n🇻🇳 Bezugspreis của Angebot B cho 100 chiếc"},"u":"€","a":1766.45,"tol":0.005,"steps":["100 · 21,00 · 0,85 · 0,97 + 35,00 = 1.766,45 €"]},{"q":{"de":"Um wie viel Euro ist das günstigere Angebot günstiger?","vi":"Um wie viel Euro ist das günstigere Angebot günstiger?\n🇻🇳 Bản chào giá rẻ hơn thì rẻ hơn bao nhiêu euro?"},"u":"€","a":33.55,"tol":0.005,"steps":[{"de":"1.800,00 – 1.766,45 = 33,55 € → Angebot B ist günstiger, obwohl der Listenpreis höher ist. Rabatt und Skonto machen den Unterschied.","vi":"1.800,00 – 1.766,45 = 33,55 € → Angebot B rẻ hơn, dù Listenpreis cao hơn. Rabatt và Skonto tạo ra sự khác biệt."}]}],"pts":2.5},{"id":"g5","no":"Aufgabe 6","title":{"de":"Freie Übung: Zwei Angebote vergleichen","vi":"Freie Übung: Zwei Angebote vergleichen · Bài tập tự do: so sánh hai bản chào giá"},"instr":{"de":"Ersatzangebote für 60 Rucksäcke. Angebot A (Trekking-Profi): 28,50 € je Stück, 12 % Rabatt, 2 % Skonto, frei Haus. Angebot B (Outdoor-Welt): 27,00 € je Stück, 8 % Rabatt, kein Skonto, Fracht 45,00 €. Du kannst zusätzlich zwe cht ist es um 33,55 € günstiger.\n🇻🇳 Điều quyết định là Bezugspreis, không phải Listenpreis. Angebot B có Listenpreis 21,00 € thay vì 20,00 €, nhưng nhiều Rabatt hơn (15 %) và 3 % Skonto. Dù có 35,00 € cước, nó vẫn rẻ hơn 33,55 €."},"w":["weil","deshalb","zum Beispiel","dadurch"],"s":["Der Grund ist: …","Das bedeutet: …","Zum Beispiel …"]}],"pts":3}]};

<script>

 restart:{de:'Neu starten',vi:'Làm lại từ đầu'},ask:{de:'Alles löschen und neu anfangen? Deine Antworten in diesem Arbeitsblatt gehen verloren.',vi:'Xóa hết và bắt đầu lại? Các câu trả lời của em trong phiếu này sẽ mất.'},

 of:{de:'von',vi:'trên'},right:{de:'richtig',vi:'đúng'},found:{de:'Schlüsselbegriffe gefunden',vi:'từ khóa đã tìm thấy'},extra:{de:'zu viel markiert',vi:'đánh dấu thừa'},
 allright:{de:'Alles richtig!',vi:'Tất cả đều đúng!'},notall:{de:'Noch nicht alles richtig. Rot = falsch. Versuche es noch einmal.',vi:'Chưa đúng hết. Màu đỏ = sai. Em thử lại nhé.'},

 done:{de:'bearbeitet',vi:'đã làm'},

};

if(D.ui)for(const l in D.ui)for(const k in D.ui[l]){if(UI[k])UI[k][l]=D.ui[l][k]}
const RTL={ar:1};
const u=k=>UI[k][S.lang]||UI[k].de;
const T=x=>x==null?'':typeof x==='string'?x:(x[S.lang]||x.de||'');
function def(){return{lang:'de',level:'b',name:'',date:new Date().toLocaleDateString('de-DE'),ans:{},checked:{},shown:{},can:{},sub:false}}
let S=def();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(def(),o);return true}}catch(e){}return false}
let st=null;function save(){clearTimeout(st);st=setTimeout(saveNow,400)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const A=id=>S.ans[id]||(S.ans[id]={});
function hashSeed(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9%€., ]/g,' ').replace(/\s+/g,' ').trim()}
function num(s){s=String(s==null?'':s).replace(/[€%\s]|[a-zA-Z²³]+/g,'');if(!s)return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const fnum=n=>n.toLocaleString('de-DE',{maximumFractionDigits:4});

function parts(it){switch(it.type){case'mc':return it.qs;case'tf':return it.st;case'gap':return it.gaps;case'match':return it.rows;case'table':return cells(it);case'calc':case'free':return it.parts;default:return[]}}
function matchOpts(it){return shuf([...new Set(it.rows.map(r=>r.a).concat(it.extra||[]))],it.id)}
function visible(it){return it.level==='v'?S.level==='v':true}
function scored(it){return['mc','tf','gap','match','table','calc','free'].indexOf(it.type)>=0}
function counted(it){return scored(it)||it.type==='read'}
/* ---------- Bewertung ---------- */
function mcTxt(p,idx){return String(idx).split(',').filter(x=>x!=='').map(i=>p.o[+i]).join(' / ')}
function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='de'?'Bonus':u('bonusw')):fmt(it.pts)+' '+(S.lang==='de'?(it.pts===1?'Punkt':'Punkte'):u('pts'))}
function sum(it){return (it.sum&&it.sum[S.lang])||(S.lang==='vi'?it.vi:'')||''}
function autoDir(){if(!RTL[S.lang])return;$$('p,h1,h2,h3,h4,li,summary,label,.info,.vis,.qt,.st,.instr,.opt span,.chip,.fb,.model,.sub,.cnt').forEach(e=>e.setAttribute('dir','auto'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(sum(it)?`<div class="vis" lang="${S.lang}">${rich(sum(it))}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];

  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;

   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang;
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 autoDir();progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
