<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nacht-Schicht: Laras Woche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#7a3e00;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --kauf:#1f5fae;--kauf-soft:#dde8f7;--verk:#c2410c;--verk-soft:#fbe6dc;--beob:#5b4b8a;--beob-soft:#e9e3f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk b.k{color:var(--kauf)} .merk b.v{color:var(--verk)}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.clock{font-family:var(--display);font-size:3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:.2em .7em;margin:3px;font-weight:700;font-family:var(--display)}
.chip.k{background:var(--kauf-soft);color:var(--kauf)} .chip.v{background:var(--verk-soft);color:var(--verk)}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.banner.nf{background:var(--kauf-soft);border:2px solid var(--kauf)}
.banner.af{background:var(--verk-soft);border:2px solid var(--verk)}
.banner.info{background:var(--surface);border:2px solid var(--brand)}
.satz{display:block;margin-top:6px;font-size:1rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:10px 0;font-size:1.15rem}
.hbar .t{height:34px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;transition:width .4s}
.hbar b{font-family:var(--display);font-size:1.8rem;text-align:right}
table.mt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;font-size:1.05rem}
table.mt th,table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mt th{background:var(--surface2);font-size:.9rem}
table.mt tr.cur td{outline:3px solid var(--brand);outline-offset:-3px}
table.mt tr.eq td{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:.4em .8em}
.pchips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pchips button.done{border-color:var(--ok);border-width:2px}
.scen{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line)}
.scen b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
svg text{font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.qtab{border-collapse:collapse;margin:8px 0;background:var(--surface)}
.qtab td,.qtab th{border:1px solid var(--line);padding:4px 10px;text-align:center}
@media (max-width:900px){.two,.three,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.card{border-radius:18px;padding:16px 18px;border:3px solid;margin-bottom:12px}
.card.K{background:var(--kauf-soft);border-color:var(--kauf)} .card.V{background:var(--verk-soft);border-color:var(--verk)} .card.B{background:var(--beob-soft);border-color:var(--beob)}
.card .role{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.card.K .role{color:var(--kauf)} .card.V .role{color:var(--verk)} .card.B .role{color:var(--beob)}
.card .val{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05}
.card .cd{margin-top:8px;font-size:1rem}
.card .cd b{font-family:var(--display);font-size:1.8rem;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{font-size:1.2rem;font-weight:800;padding:.5em .7em;min-width:3.2em}
.step .pv{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid var(--line)}
.yn button.sel{outline:4px solid var(--ink);outline-offset:1px}
.yn .y{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.ansage{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;margin:6px 0}
/* ---------- Erklärung ---------- */
#help{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px 16px 40px}
#help>*{max-width:760px;margin-left:auto;margin-right:auto}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding:8px 0}
.htabs{display:flex;gap:8px;margin:6px auto 12px}
.htabs button{flex:1;font-weight:700}
.htabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hbody{font-size:1.1rem;line-height:1.5}
.hs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.hs summary{font-family:var(--display);font-size:1.2rem}
.hs[open] summary{margin-bottom:6px}
.hw{background:var(--surface);border-left:6px solid var(--brand);border-radius:10px;padding:10px 14px;margin:8px 0}
.hw b{font-family:var(--display);font-size:1.15rem}
.hbtn{padding:.25em .7em;font-weight:700;border-radius:999px}
.es{font-style:italic;color:var(--muted)}
.hbtn{margin-left:6px}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px;background:var(--brand-ink)}
</style>
</head>
<body>
<div id="tafel" hidden>
  <header>
    <h1>Nacht-Schicht</h1>
    <nav class="steps" id="steps"></nav>
    <div class="mini"><canvas id="qrSmall" width="128" height="128"></canvas><div><b id="miniCode"></b><br><span id="miniN"></span><br><span id="conn"></span></div></div>
  </header>
  <main id="tMain"></main>
</div>
<div id="phone" hidden></div>

const fmtT=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function parseT(s){const m=/^(\d{1,2}):(\d{2})$/.exec(String(s));if(!m)return null;const a=+m[1],b=+m[2];return a<24&&b<60?a*60+b:null;}
function okText(Q){return Q.t==="mc"?Q.o[Q.k]:Q.t==="zahl"?Q.k+" "+Q.u:Q.t==="zeit"?fmtT(Q.k)+" Uhr":Q.k.map(i=>Q.a[i]).join(" · ");}
function okTextEs(Q){return Q.t==="mc"?Q.e.o[Q.k]:Q.t==="zahl"?Q.k+" "+Q.e.u:Q.t==="zeit"?fmtT(Q.k)+" horas":Q.k.map(i=>Q.e.a[i]).join(" · ");}
/* 50:50 – zwei falsche Antworten ausblenden (deterministisch je Frage) */
function elim(qi){const Q=SC[qi];if(Q.t!=="mc")return [];const w=Q.o.map((_,i)=>i).filter(i=>i!==Q.k);return [w[qi%3],w[(qi+1)%3]];}
/* Punkte; v = Antwort, secs = Sekunden bis zur Antwort */
function scoreOf(qi,v,secs,joker,x2){
  const Q=SC[qi],dur=durOf(Q);let ok=false,g=0;const bonus=()=>Math.round(500*Math.max(0,1-secs/dur));
  if(Q.t==="mc"){ok=v===Q.k;g=ok?1000+bonus():0;}
  else if(Q.t==="zahl"){ok=v===Q.k;g=ok?1000+bonus():0;}
  else if(Q.t==="zeit"){ok=v===Q.k;g=ok?1000+bonus():0;}
  else{let r=0,w=0;for(const i of v){if(Q.k.includes(i))r++;else w++;}
    g=Math.max(0,(r-w)*200);ok=r===Q.k.length&&w===0;if(ok)g+=bonus();}
  if(x2)g*=2;if(joker)g=Math.floor(g/2);
  return {g,ok};}
function valid(Q,v){
  if(Q.t==="mc")return Number.isInteger(v)&&v>=0&&v<Q.o.length;
  if(Q.t==="zahl")return Number.isInteger(v)&&v>=0&&v<=999;
  if(Q.t==="zeit")return Number.isInteger(v)&&v>=0&&v<1440;
  return Array.isArray(v)&&v.length<=Q.a.length&&v.every(i=>Number.isInteger(i)&&i>=0&&i<Q.a.length)&&new Set(v).size===v.length;}

  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);
  const shown=qi=>qi<T.q||(qi===T.q&&!T.qOpen&&T.m==="q");
  function pts(pid,upto){let s=T.pl[pid]?T.pl[pid].b||0:0;for(const qi in T.ans){if(+qi<=upto){const a=T.ans[qi][pid];if(a)s+=a.g;}}return s;}
  const upto=()=>T.m==="q"?(T.qOpen?T.q-1:T.q):T.m==="intro"?T.q:99;
  function chPts(pid,ch){let s=0;for(const qi in T.ans){if(SC[qi].ch===ch){const a=T.ans[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){const u=upto();return players().map(id=>({id,n:T.pl[id].n,tm:T.pl[id].tm,s:pts(id,u)})).sort((a,b)=>b.s-a.s);}
  function teamScores(){const u=upto();return TEAMS.map((t,i)=>{const ids=players().filter(id=>T.pl[id].tm===i);const sum=ids.reduce((a,id)=>a+pts(id,u),0);return {i,n:ids.length,avg:ids.length?Math.round(sum/ids.length):0};});}
  const tchip=i=>`<span class="chip" style="background:${TEAMS[i].c};color:#fff">${TEAMS[i].n}</span>`;

  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";
      if(!T.pl[pid]){T.pl[pid]={n,tm:T.nteam%TEAMS.length,jk:2,b:0};T.nteam++;}else T.pl[pid].n=n;}
    else if(!T.pl[pid])return;
    else if(p.k==="j"&&T.m==="q"&&T.qOpen&&p.q===T.q){
      const A=T.ans[T.q]||{},J=T.jok[T.q]=T.jok[T.q]||{};
      if(!A[pid]&&!J[pid]&&T.pl[pid].jk>0){J[pid]=true;T.pl[pid].jk--;}}
    else if(p.k==="a"&&T.m==="q"&&T.qOpen&&p.q===T.q){
      const A=(T.ans[T.q]=T.ans[T.q]||{});if(A[pid])return;
      const Q=SC[T.q];if(!valid(Q,p.v))return;
      const secs=(Date.now()-T.qStart)/1000,jk=!!(T.jok[T.q]&&T.jok[T.q][pid]);
      const r=scoreOf(T.q,p.v,secs,jk,!!T.x2[T.q]);
      A[pid]={v:p.v,g:r.g,ok:r.ok,t:secs};
      if(Object.keys(A).length>=players().length)T.qOpen=false;}
    else return;
    save();pub();render();}

  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const Q=T.q>=0?SC[T.q]:null,tm={},jk={};
    for(const id of players()){tm[id]=T.pl[id].tm;jk[id]=T.pl[id].jk;}
    const S={m:T.m,ch:T.ch,q:T.q,qOpen:T.qOpen,rem:T.qOpen&&Q?Math.max(0,durOf(Q)-(Date.now()-T.qStart)/1000):0,j:players(),kick:T.kick,tm,jk,
      ans:T.q>=0?Object.keys(T.ans[T.q]||{}):[],ju:T.q>=0?Object.keys(T.jok[T.q]||{}):[],x2:T.q>=0?!!T.x2[T.q]:false,ev:T.ev,np:players().length};
    if(T.m==="q"||T.m==="win"||T.m==="merk"||T.m==="intro"){const r=ranking();S.sc={};let rank=0,last=-1;
      r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=T.q>=0&&T.ans[T.q]?T.ans[T.q][x.id]:null;S.sc[x.id]=[x.s,rank,(T.m==="q"&&!T.qOpen&&a)?a.g:0];});
      S.ts=teamScores();}
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);
  function go(m,ch,q){T.m=m;if(ch!=null)T.ch=ch;if(q!=null){T.q=q;}T.qOpen=false;save();pub();render();}
  function openQ(i){T.q=i;T.ch=SC[i].ch;T.m="q";T.qOpen=true;T.qStart=Date.now();if(T.x2next){T.x2[i]=true;T.x2next=false;}save();pub();render();}
  function nextStep(){ // Weiter nach Auflösung
    const n=T.q+1;if(n>=SC.length){go("merk");return;}
    if(SC[n].ch!==T.ch){T.ch=SC[n].ch;T.m="intro";T.q=n-1;save();pub();render();}else openQ(n);}
  function drawEvent(){
    const free=EV.map((_,i)=>i).filter(i=>!T.evUsed.includes(i));const pool=free.length?free:EV.map((_,i)=>i);if(!free.length)T.evUsed=[];
    const i=pool[Math.floor(Math.random()*pool.length)];T.evUsed.push(i);T.ev={i};
    if(i===0)T.x2next=true;
    else if(i===1){const ts=teamScores().filter(t=>t.n>0).sort((a,b)=>a.avg-b.avg);if(ts.length){const lo=ts[0].i;players().forEach(id=>{if(T.pl[id].tm===lo)T.pl[id].b=(T.pl[id].b||0)+300;});}}
    else if(i===2){players().forEach(id=>T.pl[id].jk++);}
    else if(i===3){const r=ranking();if(r[0])T.pl[r[0].id].b=(T.pl[r[0].id].b||0)-200;}
    save();pub();render();}

  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}

  const curPh=()=>T.m==="start"?0:T.m==="merk"?5:T.m==="win"?6:1+T.ch;
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===curPh()?"on":""}">${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.ph;
      if(i===0)go("start");else if(i<=4)go("intro",i-1,CHFIRST[i-1]-1);else if(i===5)go("merk");else go("win");});
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    if(!$("bEs")){const b=document.createElement("button");b.id="bEs";b.className="hbtn";b.onclick=()=>{T.es=!T.es;save();render();};$("steps").after(b);}
    $("bEs").textContent=T.es?"Español: an":"Español: aus";
    drawQR($("qrSmall"),joinUrl());if(window.QRBIG)QRBIG(drawQR,joinUrl);}
  function render(){renderHead();const M=$("tMain");({start:rStart,intro:rIntro,q:rQ,merk:rMerk,win:rWin})[T.m](M);}

  function rStart(M){
    const pl=Object.entries(T.pl);
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Nacht-Schicht: Laras Woche</h2>
      <p style="font-size:1.25rem">1. QR-Code mit dem Handy scannen.<br>2. Spitznamen eingeben.<br>3. Du bist in einem Team: Kasse, Lager oder Deko.</p>
      ${es(T.es,"1. Escanea el código QR con el móvil. 2. Escribe un apodo. 3. Estás en un equipo: Caja, Almacén o Decoración.")}
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/nacht-schicht/"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}" style="border-color:${TEAMS[x.tm].c};border-width:2px">${h(x.n)}</button>`).join("")}</div>
      <div class="ctrl"><button class="pri" id="bGo">Los: Kapitel 1 →</button><button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);save();pub();render();});
    $("bGo").onclick=()=>go("intro",0,-1);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Ergebnisse werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};}

  function teamBars(){const ts=teamScores(),mx=Math.max(1,...ts.map(t=>t.avg));
    return `<h3>Team-Wertung <span class="muted" style="font-size:.9rem;font-weight:400">(Durchschnitt je Person)</span></h3>`+ts.map(t=>`<div class="hbar" style="grid-template-columns:200px 1fr 90px"><span>${tchip(t.i)}</span><div class="t"><i style="width:${Math.round(100*t.avg/mx)}%;background:${TEAMS[t.i].c}"></i></div><b>${t.avg}</b></div>`).join("");}
  function top5(){const r=ranking().slice(0,5);return `<h3>Rangliste</h3><ol class="top">${r.map((x,i)=>`<li><span>${i+1}. ${h(x.n)} ${tchip(x.tm)}</span><b>${x.s}</b></li>`).join("")}</ol>`;}

  function evBanner(){if(!T.ev)return "";const E=EV[T.ev.i];
    return `<div class="banner info" style="font-size:1.4rem"><b>Ereignis: ${h(E.t)}</b><br>${h(E.d)}${T.es?`<span class="satz es">${h(E.es)} – ${h(E.de)}</span>`:""}</div>`;}

  function rIntro(M){
    const C=CH[T.ch],first=CHFIRST[T.ch];
    M.innerHTML=`<p class="muted">Kapitel ${T.ch+1} von ${CH.length}</p><h2 class="big">${h(C.t)}</h2>${es(T.es,C.es)}
      <div class="box" style="margin-top:14px;font-size:1.3rem">${h(C.s)}${es(T.es,C.se)}</div>
      ${evBanner()}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px">${T.ch>0||T.q>=0?`<div>${top5()}</div><div>${teamBars()}</div>`:""}</div>
      <div class="ctrl"><button class="pri" id="bF">Erste Frage dieses Kapitels →</button><button id="bEv">Zufallsereignis ziehen</button></div>`;
    $("bF").onclick=()=>openQ(first);$("bEv").onclick=drawEvent;}

  function rQ(M){
    const Q=SC[T.q],A=T.ans[T.q]||{},n=Object.keys(A).length,dur=durOf(Q),np=players().length;
    let body="";
    if(Q.t==="mc"){const cnt=Q.o.map((_,i)=>Object.values(A).filter(a=>a.v===i).length);
      body=`<div class="opts">${Q.o.map((o,i)=>`<div class="opt o${i} ${!T.qOpen&&i!==Q.k?"wrong":""}">${"ABCD"[i]}: ${h(o)}${es(T.es,Q.e.o[i]).replace("satz es",'satz es" style="color:#fff;opacity:.9')}${T.qOpen?"":`<span class="cnt">${cnt[i]}</span>`}</div>`).join("")}</div>`;}
    else if(Q.t==="multi"){body=`<div class="two"><div>${planTable()}</div><div>${Q.a.map((a,i)=>`<div class="merk" style="${!T.qOpen&&Q.k.includes(i)?"border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))":""}"><b>${i+1}.</b> ${h(a)}${es(T.es,Q.e.a[i])}</div>`).join("")}</div></div>`;}
    else{const ok=Object.values(A).filter(a=>a.ok).length;body=`<div class="box" style="font-size:1.4rem;margin-top:14px">${T.qOpen?"Antwort auf dem Handy eingeben …":`<b>Richtig: ${h(okText(Q))}</b> · ${ok} von ${n} richtig`}${T.qOpen?"":es(T.es,okTextEs(Q))}</div>`;}
    M.innerHTML=`<div class="qhead"><div><p class="muted">${h(CH[Q.ch].t)} · Frage ${T.q+1} von ${SC.length}${Q.pro?' <span class="pro">Profi</span>':""} · ${n} von ${np} geantwortet${T.x2[T.q]?' · <b style="color:var(--bad)">DOPPELTE PUNKTE</b>':""}</p>
      <h2 class="big">${h(Q.q)}</h2>${es(T.es,Q.e.q)}</div>${T.qOpen?`<div class="timer" id="tm">${dur}</div>`:""}</div>
      ${body}
      ${T.qOpen?"":`<div class="merk" style="font-size:1.15rem;margin-top:14px">${h(Q.x)}${es(T.es,Q.e.x)}${Q.pz?`<br><b>Profi-Zusatz:</b> ${h(Q.pz)}${es(T.es,Q.e.pz)}`:""}</div>
        ${evBanner()}<div class="two" style="margin-top:12px"><div>${top5()}</div><div>${teamBars()}</div></div>`}
      <div class="ctrl">${T.qOpen?`<button class="pri" id="bR">Auflösen</button>`:`<button class="pri" id="bN">${T.q<SC.length-1?"Weiter →":"Zum Merkblatt →"}</button><button id="bEv">Zufallsereignis ziehen</button>`}</div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>{T.ev=null;nextStep();};
    if($("bEv"))$("bEv").onclick=drawEvent;
    if(T.qOpen){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.qOpen){T.qOpen=false;save();pub();render();}if(!T.qOpen)clearInterval(window._qt);},250);}}

  function rMerk(M){
    M.innerHTML=`<h2 class="big">Merk dir: Jugendarbeitsschutz auf einen Blick</h2>
      <table class="mt" style="text-align:left;font-size:1.05rem"><thead><tr><th style="text-align:left">Thema</th><th style="text-align:left">Regel für Jugendliche</th><th>§</th></tr></thead><tbody>
      ${MERK.map(r=>`<tr><th style="text-align:left">${h(r[0])}</th><td style="text-align:left">${h(r[1])}${es(T.es,r[2])}</td><td>${h(r[3])}</td></tr>`).join("")}</tbody></table>
      <div class="ctrl"><button class="pri" id="bW">Zur Siegerehrung →</button></div>`;
    $("bW").onclick=()=>go("win");}

  function rWin(M){
    const r=ranking(),ts=teamScores().filter(t=>t.n>0).sort((a,b)=>b.avg-a.avg);
    const bad=CH.map((_,c)=>{const l=players().map(id=>({n:T.pl[id].n,s:chPts(id,c)})).sort((a,b)=>b.s-a.s)[0];return l&&l.s>0?`<li><span>${BADGES[c]}<br><small class="muted">${BADGES_ES[c]}</small></span><b>${h(l.n)}</b></li>`:"";}).join("");
    const fast=players().map(id=>{const L=Object.values(T.ans).map(a=>a[id]).filter(a=>a&&a.ok&&a.t!=null);return {n:T.pl[id].n,c:L.length,a:L.length?L.reduce((s,x)=>s+x.t,0)/L.length:99};}).filter(x=>x.c>=5).sort((a,b)=>a.a-b.a)[0];
    M.innerHTML=`<h2 class="big">Siegerehrung</h2><div class="two"><div><h3>Rangliste</h3>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin-top:14px">${r.slice(3,8).map((x,i)=>`<li><span>${i+4}. ${h(x.n)} ${tchip(x.tm)}</span><b>${x.s}</b></li>`).join("")}</ol></div>
      <div><h3>Siegerteam${es(T.es,"Equipo ganador")}</h3>${ts.length?`<div class="banner ok" style="font-size:1.5rem">${tchip(ts[0].i)} · ${ts[0].avg} Punkte im Schnitt</div>`:""}
      ${ts.slice(1).map(t=>`<p>${tchip(t.i)} ${t.avg}</p>`).join("")}
      <h3 style="margin-top:14px">Abzeichen${es(T.es,"Insignias")}</h3><ul class="top">${bad}${fast?`<li><span>Schnelle Finger<br><small class="muted">Dedos rápidos</small></span><b>${h(fast.n)}</b></li>`:""}</ul></div></div>`;}
  render();
}

function phoneApp(){
  $("phone").hidden=false;
  const KEY="nachtschicht_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);me.es=true;store(KEY,me);}
  let S=null,lastKey="",pending=null,qEnd=0,sel={},tip={};
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.done&&!pending.done())send(pending.msg);},2500);
  function onState(p){
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8),es:me.es};store(KEY,me);lastKey="";}
    render();}
  const L=(d,e)=>me.es&&e?`${h(d)}<span class="satz es">${h(e)}</span>`:h(d);
  const tm=()=>S&&S.tm?S.tm[me.pid]:null;
  function keyOf(){if(!me.nick)return "join|"+me.es;if(!S)return "wait|"+me.es;
    return JSON.stringify([me.es,S.m,S.ch,S.q,S.qOpen,(S.ans||[]).includes(me.pid),(S.ju||[]).includes(me.pid),S.x2,S.ev,S.sc?S.sc[me.pid]:0,S.jk?S.jk[me.pid]:0,tm(),S.q>=0?(sel[S.q]!=null?1:0):0]);}
  function esBtn(){return `<button class="hbtn" data-es="1">${me.es?"Español: sí":"Español: no"}</button>`;}
  function render(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    const sc=S&&S.sc?S.sc[me.pid]:null;
    const top=`<div class="ph-top"><span>Nacht-Schicht · ${roomCode}</span><span>${h(me.nick||"")}${sc?` · ${sc[0]} P.`:""} ${esBtn()}</span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Willkommen bei Laras Woche!</h2>${es(me.es,"¡Bienvenido a la semana de Lara!")}<p>Gib einen Spitznamen ein.${es(me.es,"Escribe un apodo.")}</p>
      <input id="nk" maxlength="16" placeholder="Spitzname / Apodo" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen / Participar</button>`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;store(KEY,me);hello();lastKey="";render();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …${es(me.es,"Conectando con la pizarra…")}</p>`;return;}
    const T=tm(),head=T!=null?`<div style="margin-bottom:8px"><span class="chip" style="background:${TEAMS[T].c};color:#fff">${TEAMS[T].n}</span> <span class="muted">Joker: ${S.jk[me.pid]||0}</span></div>`:"";
    if(S.m==="start"){P.innerHTML=top+head+`<h2>Du bist dabei!</h2>${es(me.es,"¡Ya estás dentro!")}<p>Gleich geht es los. Schau auf die Tafel.${es(me.es,"Enseguida empezamos. Mira la pizarra.")}</p>`;return;}
    if(S.m==="intro"){const C=CH[S.ch];P.innerHTML=top+head+`<h2>${h(C.t)}</h2>${es(me.es,C.es)}<div class="box">${h(C.s)}${es(me.es,C.se)}</div>`+evCard()+rankBox(sc);return;}
    if(S.m==="merk"){P.innerHTML=top+head+`<h2>Merken</h2>${es(me.es,"Recordar")}<p>Schau auf die Tafel: Die wichtigsten Regeln.${es(me.es,"Mira la pizarra: las reglas más importantes.")}</p>`+rankBox(sc);return;}
    if(S.m==="win"){P.innerHTML=top+head+`<h2>Geschafft!</h2>${es(me.es,"¡Lo lograste!")}`+rankBox(sc);return;}
    rQ(P,top,head,sc);}
  function evCard(){if(!S.ev)return "";const E=EV[S.ev.i];return `<div class="banner info"><b>${h(E.t)}</b><br>${h(E.d)}${es(me.es,E.es+" – "+E.de)}</div>`;}
  function rankBox(sc){return sc?`<div class="box" style="margin-top:12px"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}${es(me.es,"Puesto "+sc[1]+" de "+(S.np||"?"))}</div>`:"";}
  function rQ(P,top,head,sc){
    const Q=SC[S.q],qi=S.q,answered=(S.ans||[]).includes(me.pid),usedJ=(S.ju||[]).includes(me.pid),dur=durOf(Q);
    const hdr=`<div class="row" style="justify-content:space-between"><span class="muted">Frage ${qi+1} von ${SC.length}${Q.pro?' <span class="pro">Profi</span>':""}${S.x2?' · <b style="color:var(--bad)">x2</b>':""}</span><b id="ptm"></b></div>`;
    if(S.qOpen){
      if(answered||sel[qi]!=null){P.innerHTML=top+head+`<h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Auflösung.${es(me.es,answered?"Respuesta guardada ✓. Espera la solución.":"Enviando…")}</div>${Q.pz?`<div class="merk"><b>Profi-Zusatz:</b> ${h(Q.pz)}${es(me.es,Q.e.pz)}</div>`:""}`;return;}
      const hid=usedJ&&Q.t==="mc"?elim(qi):[];
      let inp="";
      if(Q.t==="mc")inp=Q.o.map((o,i)=>hid.includes(i)?"":`<button class="popt o${i}" data-i="${i}">${"ABCD"[i]}: ${h(o)}${me.es?`<span class="satz" style="color:#fff;opacity:.9">${h(Q.e.o[i])}</span>`:""}</button>`).join("");
      else if(Q.t==="zahl")inp=`<div class="row"><input id="vi" type="number" inputmode="numeric" min="0" max="999" style="font-size:1.8rem;max-width:160px" placeholder="0"> <b>${h(Q.u)}</b></div><div style="height:10px"></div><button class="pri" id="bS" style="width:100%;padding:16px">Senden / Enviar</button>`;
      else if(Q.t==="zeit")inp=`<input id="vi" type="time" style="font-size:1.8rem;max-width:200px"><div style="height:10px"></div><button class="pri" id="bS" style="width:100%;padding:16px">Senden / Enviar</button>`;
      else inp=planTable()+`<div id="ms" style="margin-top:8px">${Q.a.map((a,i)=>`<button class="pbtn" data-m="${i}">${i+1}. ${h(a)}${me.es?`<span class="satz">${h(Q.e.a[i])}</span>`:""}</button>`).join("")}</div><button class="pri" id="bS" style="width:100%;padding:16px">Senden / Enviar</button>`;
      const jb=(S.jk[me.pid]>0&&!usedJ)?`<button id="bJk" style="width:100%;margin-top:10px">Joker einsetzen (${Q.t==="mc"?"50:50":"Tipp"}) – nur halbe Punkte${es(me.es,"Usar comodín: solo la mitad de los puntos")}</button>`:"";
      const tp=usedJ&&Q.t!=="mc"?`<div class="merk"><b>Tipp:</b> ${h(Q.tp)}${es(me.es,Q.e.tp)}</div>`:"";
      P.innerHTML=top+head+hdr+`<h2>${h(Q.q)}</h2>${es(me.es,Q.e.q)}${tp}${inp}${jb}`;
      const snd=v=>{pending={msg:{k:"a",q:qi,v},done:()=>S.q!==qi||!S.qOpen||(S.ans||[]).includes(me.pid)};sel[qi]=v;send(pending.msg);lastKey="";render();};
      P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>snd(+b.dataset.i));
      if(Q.t==="multi"){const set=new Set();P.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=+b.dataset.m;if(set.has(i))set.delete(i);else set.add(i);b.classList.toggle("sel");});
        $("bS").onclick=()=>snd([...set].sort((a,b)=>a-b));}
      else if(Q.t==="zahl")$("bS").onclick=()=>{const v=parseInt($("vi").value,10);if(Number.isInteger(v)&&v>=0)snd(v);};
      else if(Q.t==="zeit")$("bS").onclick=()=>{const v=parseT($("vi").value);if(v!=null)snd(v);};
      if($("bJk"))$("bJk").onclick=()=>{send({k:"j",q:qi});$("bJk").disabled=true;};
      const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    /* Auflösung */
    const A=sel[qi];let ok=null;
    if(A!=null){ok=scoreOf(qi,A,0,false,false).ok;}
    const g=sc?sc[2]:0;
    P.innerHTML=top+head+`<p class="muted">Frage ${qi+1} von ${SC.length}</p>
      <div class="status ${A==null?"":ok?"ok":(g>0?"":"bad")}">${A==null?"Keine Antwort."+es(me.es,"Sin respuesta."):ok?`<b>Richtig! +${g} Punkte</b>${es(me.es,"¡Correcto!")}`:g>0?`<b>Teilweise richtig: +${g} Punkte</b>${es(me.es,"Parcialmente correcto")}`:`<b>Leider falsch.</b>${es(me.es,"Incorrecto.")}`}</div>
      <p><b>Richtig: ${h(okText(Q))}</b>${es(me.es,okTextEs(Q))}</p><p>${h(Q.x)}${es(me.es,Q.e.x)}</p>${Q.pz?`<div class="merk"><b>Profi-Zusatz:</b> ${h(Q.pz)}${es(me.es,Q.e.pz)}</div>`:""}${evCard()}${rankBox(sc)}`;}
  $("phone").addEventListener("click",e=>{if(e.target.closest("[data-es]")){me.es=!me.es;store(KEY,me);lastKey="";render();}});
  render();
}
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
if(roomCode)phoneApp();else tafelApp();

</script>
<script src="tafel_zoom.js"></script>
