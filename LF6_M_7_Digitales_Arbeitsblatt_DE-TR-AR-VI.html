<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}

#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}

main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}

.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}

.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}

 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>

var SHEET={"id": "LF6_M_7", "mod": "Modul 7", "title": "Bezugskalkulation I – das Schema", "meta": "Lernfeld 6 · Waren beschaffen · DS 13–14 · Lehrbuch S. 38–39 · Arbeitsheft S. 26–33", "can": ["das Schema der Bezugskalkulation aufschreiben – vom Listeneinkaufspreis bis zum Bezugspreis.", "den Rabatt vom Listeneinkaufspreis und das Skonto vom Zieleinkaufspreis berechnen.", "Bezugskosten richtig addieren und den Bezugspreis für die ganze Menge und je Stück ausrechnen.", "das Ergebnis kaufmännisch auf zwei Stellen runden und in die Ergebniskästchen eintragen."], "blocks": [{"k": "task", "id": "a1", "n": "Aufgabe 1", "h": "Ankommen: Fünf Fragen aus dem Kopf", "intro": "Ohne Buch, ohne Handy.", "tip": "Skonto gibt es für vorzeitige Zahlung der Rechnung innerhalb einer vereinbarten Frist.", "items": [{"t": "mc", "id": "a1.1", "q": "1.1 Welcher Nachlass wird für schnelles Bezahlen gewährt? (Modul 6)", "o": ["Skonto", "Bonus", "Mengenrabatt"], "a": 0}, {"t": "mc", "id": "a1.2", "q": "1.2 Was bedeutet „Lieferung frei Haus“? (Modul 6)", "o": ["Der Lieferer trägt alle Transportkosten.", "Der Käufer trägt alle Transportkosten.", "Die Lieferung ist kostenlos für alle."], "a": 0}, {"t": "calc", "id": "a1.3", "q": "1.4 Wie rechnest du 19 % Umsatzsteuer aus einem Bruttobetrag von 119,00 € heraus? (Pool · LF 3)", "a": 19, "unit": "€", "steps": ["119,00 € : 119 × 19 = 19,00 € USt", "netto 100,00 €"]}]}, {"k": "read", "id": "r1", "h": "Zum Nachlesen: Die Bezugskalkulation (Lehrbuch S. 38–39)", "sum": "Zwei Grundregeln: Rabatt vom Listeneinkaufspreis – Skonto vom Zieleinkaufspreis.", "paras": ["[[Listeneinkaufspreis]] − Liefererrabatt = [[Zieleinkaufspreis]] − Liefererskonto = [[Bareinkaufspreis]] + Bezugskosten = [[Bezugspreis]].", "Der Bezugspreis ist immer [[netto]]. Erst am Ende [[kaufmännisch runden]]."], "q": {"q": "Wovon wird das Skonto berechnet?", "o": ["vom Zieleinkaufspreis", "vom Listeneinkaufspreis", "vom Bezugspreis"], "a": 0}}, {"k": "task", "id": "a2", "n": "Aufgabe 2", "h": "Was kostet uns die Jacke wirklich?", "intro": "Angebot: Winterjacke, Listenpreis 50,00 € je Stück, 10 % Rabatt, 2 % Skonto bei Zahlung innerhalb von 10 Tagen, Fracht 3,00 € je Jacke.", "tip": "Immer in derselben Reihenfolge: minus Rabatt – minus Skonto – plus Bezugskosten.", "items": [{"t": "calc", "id": "a2.1", "q": "Zieleinkaufspreis?", "a": 45, "unit": "€", "steps": ["50,00 − 5,00 = 45,00 €"]}, {"t": "calc", "id": "a2.2", "q": "Bareinkaufspreis?", "a": 44.1, "unit": "€", "steps": ["45,00 × 2 : 100 = 0,90 €", "45,00 − 0,90 = 44,10 €"], "traps": [[44.0, "Skonto vom Listenpreis gerechnet – Skonto immer vom Zieleinkaufspreis."]]}, {"t": "calc", "id": "a2.3", "q": "Bezugspreis?", "a": 47.1, "unit": "€", "steps": ["44,10 + 3,00 = 47,10 €"]}]}, {"k": "task", "id": "a3", "n": "Aufgabe 3", "h": "Schlüsselanhänger: ganze Menge und je Stück", "intro": "Sie bestellen 100 Stück und zahlen mit Skonto. Ergänze das Schema.", "tip": "Am sichersten: erst die ganze Menge rechnen, dann teilen.", "items": [{"t": "calc", "id": "a3.1", "q": "Zieleinkaufspreis gesamt?", "a": 360, "unit": "€", "steps": ["100 × 4,50 = 450,00 €", "− 20 % = 90,00 € → 360,00 €"]}, {"t": "calc", "id": "a3.2", "q": "Bezugspreis gesamt?", "a": 359.7, "unit": "€", "steps": ["360,00 − 2 % (7,20) = 352,80 €", "352,80 + 6,90 = 359,70 €"]}, {"t": "calc", "id": "a3.3", "q": "Bezugspreis je Stück?", "a": 3.6, "unit": "€", "steps": ["359,70 : 100 = 3,597 → 3,60 €"]}, {"t": "free", "id": "a3.4", "q": "3.1 Warum ist der Bezugspreis je Stück 3,60 € und nicht 3,597 €?", "model": "Kaufmännisch auf zwei Nachkommastellen gerundet: 3,597 → 3,60 €."}]}, {"k": "task", "id": "a4", "n": "Aufgabe 4", "h": "Bezugspreise wie in der Prüfung", "intro": "Rechne mit dem Schema auf dem Kästchenpapier. Trag das Ergebnis in die Kästchen ein.", "tip": "Zwei Grundregeln: Rabatt vom Listeneinkaufspreis – Skonto vom Zieleinkaufspreis.", "items": [{"t": "calc", "id": "a4.1", "q": "Fanartikel: 200 Stück à 6,00 €, 5 % Rabatt, 3 % Skonto, frei Haus. Bezugspreis gesamt?", "a": 1105.8, "unit": "€", "steps": ["200 × 6,00 = 1.200,00 €", "− 5 % = 60,00 € → 1.140,00 €", "− 3 % = 34,20 € → 1.105,80 €", "+ 0,00 € (frei Haus) = 1.105,80 €"], "traps": [[1104.0, "Skonto vom Listenpreis gerechnet – Skonto immer vom Zieleinkaufspreis."]]}, {"t": "calc", "id": "a4.2", "q": "4.2 Sweatshirt „Beta“: Listenpreis 15,95 €, 5 % Rabatt, 2 % Skonto, frei Haus. Ermitteln Sie den Bezugspreis für ein Sweatshirt.", "a": 14.85, "unit": "€", "steps": ["15,95 − 5 % (0,7975) = 15,1525", "− 2 % (0,30305) = 14,84945", "≈ 14,85 €"]}, {"t": "calc", "id": "a4.3", "q": "4.3 Für 35 Laufjacken beträgt der Listenpreis insgesamt 1.400,00 €. Der Lieferer gewährt 15 % Rabatt und 2 % Skonto. Ermitteln Sie den Bareinkaufspreis einer Jacke.", "a": 33.32, "unit": "€", "steps": ["1.400,00 − 15 % (210,00) = 1.190,00", "− 2 % (23,80) = 1.166,20 €", "1.166,20 : 35 = 33,32 €"], "traps": [[1166.2, "Das ist die ganze Menge – noch durch 35 teilen."]]}, {"t": "calc", "id": "a4.4", "q": "4.4 Sie bestellen 80 Stehlampen zu je 12,50 € (Listenpreis). Rabatt 12 %, Skonto 3 %, Fracht für die Lieferung 24,00 €. Berechnen Sie den Bezugspreis je Lampe.", "a": 10.97, "unit": "€", "steps": ["80 × 12,50 = 1.000,00", "− 12 % = 120,00 → 880,00", "− 3 % = 26,40 → 853,60", "+ 24,00 = 877,60 €", "877,60 : 80 = 10,97 €"], "traps": [[877.6, "Das ist die ganze Menge – noch durch 80 teilen."]]}]}, {"k": "task", "id": "a5", "n": "Aufgabe 5", "lvl": "v", "h": "Für Profis: Zwei Rabatte und ein Warum", "intro": "Jede Zeile bekommt einen neuen Grundwert, sobald dort „= … 100 %“ steht.", "tip": "25 % + 5 % ist nicht 30 % vom Listenpreis!", "items": [{"t": "calc", "id": "a5.1", "q": "5.1 Listenpreis 80,00 € je Stück. Der Lieferer gewährt 25 % Wiederverkäuferrabatt und zusätzlich 5 % Sonderrabatt auf den bereits reduzierten Preis, 2 % Skonto. Bezugskosten 1,20 € je Stück. Berechne den Bezugspreis je Stück.", "a": 57.06, "unit": "€", "steps": ["80,00 − 25 % = 60,00", "− 5 % = 57,00", "− 2 % = 55,86", "+ 1,20 = 57,06 €"], "traps": [[56.08, "25 % + 5 % ist nicht 30 % vom Listenpreis!"]]}, {"t": "free", "id": "a5.2", "q": "5.2 Begründe, warum das Skonto vom Zieleinkaufspreis und nicht vom Listeneinkaufspreis berechnet wird.", "model": "Skonto gibt es auf den Betrag, den wir tatsächlich zahlen müssten – und das ist nach Abzug des Rabatts der Zieleinkaufspreis (Rechnungsbetrag). Der Listenpreis wird ja gar nicht verlangt."}]}]};
var TR={"title": ["Tính giá nhập hàng I – sơ đồ", "", "", "", "", "", "حساب تكلفة الشراء I – المخطط", "Alış maliyeti hesabı I – şema"], "can.0": ["viết ra sơ đồ tính giá nhập hàng – từ giá mua niêm yết đến giá nhập.", "", "", "", "", "", "كتابة مخطط حساب تكلفة الشراء – من سعر الشراء حسب القائمة حتى سعر الشراء النهائي.", "alış maliyeti hesabının şemasını yazmak – liste alış fiyatından alış maliyetine kadar."], "can.1": ["tính giảm giá từ giá mua niêm yết và chiết khấu từ giá mua trả chậm.", "", "", "", "", "", "حساب الخصم من سعر الشراء حسب القائمة وخصم الدفع النقدي من سعر الشراء الآجل.", "indirimi liste alış fiyatından, iskontoyu vadeli alış fiyatından hesaplamak."], "can.2": ["cộng chi phí mua hàng đúng cách và tính giá nhập cho toàn bộ số lượng và cho mỗi cái.", "", "", "", "", "", "جمع تكاليف الشراء بشكل صحيح وحساب سعر الشراء النهائي للكمية كلها وللقطعة الواحدة.", "alış giderlerini doğru toplamak ve alış maliyetini tüm miktar ve adet başına hesaplamak."], "can.3": ["làm tròn kết quả theo kiểu thương mại đến hai chữ số thập phân và ghi vào các ô kết quả.", "", "", "", "", "", "تقريب النتيجة تجارياً إلى خانتين عشريتين وكتابتها في مربعات النتيجة.", "sonucu ticari olarak iki haneye yuvarlamak ve sonuç kutucuklarına yazmak."], "a1.h": ["Khởi động: Năm câu hỏi từ trí nhớ", "", "", "", "", "", "البداية: خمسة أسئلة من الذاكرة", "Başlangıç: Ezberden beş soru"], "a1.i": ["Không sách, không điện thoại.", "", "", "", "", "", "بدون كتاب، بدون هاتف.", "Kitapsız, telefonsuz."], "a1.t": ["Chiết khấu thanh toán được cho khi thanh toán hóa đơn sớm trong thời hạn đã thỏa thuận.", "", "", "", "", "", "يُمنح خصم الدفع النقدي مقابل دفع الفاتورة مبكراً خلال مهلة متفق عليها.", "İskonto, faturanın kararlaştırılan süre içinde erken ödenmesi için verilir."], "a1.1.q": ["1.1 Khoản giảm giá nào được cho khi thanh toán nhanh? (Mô-đun 6)", "", "", "", "", "", "1.1 أي خصم يُمنح مقابل الدفع السريع؟ (الوحدة 6)", "1.1 Hızlı ödeme için hangi indirim verilir? (Modül 6)"], "a1.1.o0": ["chiết khấu thanh toán", "", "", "", "", "", "خصم الدفع النقدي", "iskonto"], "a1.1.o1": ["thưởng doanh số", "", "", "", "", "", "المكافأة", "bonus"], "a1.1.o2": ["giảm giá theo số lượng", "", "", "", "", "", "خصم الكمية", "miktar indirimi"], "a1.2.q": ["1.2 „Giao tận nơi miễn phí“ nghĩa là gì? (Mô-đun 6)", "", "", "", "", "", "1.2 ماذا يعني „التوصيل مجاناً للمنزل“؟ (الوحدة 6)", "1.2 „Adrese teslim“ ne demektir? (Modül 6)"], "a1.2.o0": ["Nhà cung cấp chịu mọi chi phí vận chuyển.", "", "", "", "", "", "المورد يتحمل كل تكاليف النقل.", "Tedarikçi tüm taşıma masraflarını üstlenir."], "a1.2.o1": ["Người mua chịu mọi chi phí vận chuyển.", "", "", "", "", "", "المشتري يتحمل كل تكاليف النقل.", "Alıcı tüm taşıma masraflarını üstlenir."], "a1.2.o2": ["Giao hàng miễn phí cho mọi người.", "", "", "", "", "", "التوريد مجاني للجميع.", "Teslimat herkes için ücretsizdir."], "a1.3.q": ["1.4 Em tách thuế giá trị gia tăng 19 % ra khỏi số tiền gộp 119,00 € như thế nào? (Ngân hàng câu hỏi · LF 3)", "", "", "", "", "", "1.4 كيف تستخرج ضريبة المبيعات 19 % من مبلغ إجمالي قدره 119,00 €؟ (بنك الأسئلة · LF 3)", "1.4 119,00 €'luk brüt tutardan %19 KDV'yi nasıl çıkarırsın? (Havuz · LF 3)"], "r1.h": ["Đọc thêm: Tính giá nhập hàng (Sách giáo khoa tr. 38–39)", "", "", "", "", "", "للقراءة: حساب تكلفة الشراء (الكتاب ص 38–39)", "Okuma: Alış maliyeti hesabı (Ders kitabı s. 38–39)"], "r1.s": ["Hai quy tắc cơ bản: giảm giá tính từ giá mua niêm yết – chiết khấu tính từ giá mua trả chậm.", "", "", "", "", "", "قاعدتان أساسيتان: الخصم من سعر الشراء حسب القائمة – وخصم الدفع النقدي من سعر الشراء الآجل.", "İki temel kural: indirim liste alış fiyatından – iskonto vadeli alış fiyatından."], "r1.p0": ["Giá mua niêm yết − giảm giá = giá mua trả chậm − chiết khấu = giá mua trả tiền mặt + chi phí mua hàng = giá nhập.", "", "", "", "", "", "سعر الشراء حسب القائمة − خصم المورد = سعر الشراء الآجل − خصم الدفع النقدي = سعر الشراء النقدي + تكاليف الشراء = سعر الشراء النهائي.", "Liste alış fiyatı − tedarikçi indirimi = vadeli alış fiyatı − tedarikçi iskontosu = peşin alış fiyatı + alış giderleri = alış maliyeti."], "r1.p1": ["Giá nhập luôn là giá ròng. Chỉ làm tròn kiểu thương mại ở cuối cùng.", "", "", "", "", "", "سعر الشراء النهائي دائماً صافٍ. قرّب تجارياً في النهاية فقط.", "Alış maliyeti her zaman nettir. Ancak en sonda ticari olarak yuvarla."], "r1.qq": ["Chiết khấu được tính từ giá nào?", "", "", "", "", "", "من ماذا يُحسب خصم الدفع النقدي؟", "İskonto neyden hesaplanır?"], "r1.q.o0": ["tính từ giá mua trả chậm", "", "", "", "", "", "من سعر الشراء الآجل", "vadeli alış fiyatından"], "r1.q.o1": ["tính từ giá mua niêm yết", "", "", "", "", "", "من سعر الشراء حسب القائمة", "liste alış fiyatından"], "r1.q.o2": ["từ giá nhập", "", "", "", "", "", "من سعر الشراء النهائي", "alış maliyetinden"], "a2.h": ["Chiếc áo khoác thực sự tốn bao nhiêu?", "", "", "", "", "", "كم تكلّفنا السترة فعلاً؟", "Ceket bize gerçekte kaça mal oluyor?"], "a2.i": ["Chào giá: áo khoác mùa đông, giá niêm yết 50,00 € mỗi cái, giảm 10 %, chiết khấu 2 % nếu thanh toán trong 10 ngày, cước 3,00 € mỗi áo.", "", "", "", "", "", "العرض: سترة شتوية، سعر القائمة 50,00 € للقطعة، خصم 10 %، خصم دفع نقدي 2 % عند الدفع خلال 10 أيام، الشحن 3,00 € لكل سترة.", "Teklif: kışlık ceket, liste fiyatı tanesi 50,00 €, %10 indirim, 10 gün içinde ödemede %2 iskonto, ceket başına 3,00 € navlun."], "a2.t": ["Luôn theo cùng thứ tự: trừ giảm giá – trừ chiết khấu – cộng chi phí mua hàng.", "", "", "", "", "", "دائماً بنفس الترتيب: ناقص الخصم – ناقص خصم الدفع النقدي – زائد تكاليف الشراء.", "Her zaman aynı sırayla: eksi indirim – eksi iskonto – artı alış giderleri."], "a2.1.q": ["Giá mua trả chậm?", "", "", "", "", "", "سعر الشراء الآجل؟", "Vadeli alış fiyatı?"], "a2.2.q": ["Giá mua trả tiền mặt?", "", "", "", "", "", "سعر الشراء النقدي؟", "Peşin alış fiyatı?"], "a2.2.w": ["Em đã tính chiết khấu từ giá niêm yết – chiết khấu luôn tính từ giá mua trả chậm.", "", "", "", "", "", "حسبت الخصم من سعر القائمة – خصم الدفع النقدي دائماً من سعر الشراء الآجل.", "İskontoyu liste fiyatından hesapladın – iskonto her zaman vadeli alış fiyatından."], "a2.3.q": ["Giá nhập?", "", "", "", "", "", "سعر الشراء النهائي؟", "Alış maliyeti?"], "a3.h": ["Móc khóa: toàn bộ số lượng và mỗi cái", "", "", "", "", "", "حاملات المفاتيح: الكمية كلها وللقطعة", "Anahtarlıklar: tüm miktar ve adet başına"], "a3.i": ["Anh/chị đặt 100 cái và thanh toán có chiết khấu. Hãy hoàn thành sơ đồ.", "", "", "", "", "", "تطلبون 100 قطعة وتدفعون مع الخصم. أكمل المخطط.", "100 adet sipariş edip iskontolu ödüyorsunuz. Şemayı tamamla."], "a3.t": ["Chắc chắn nhất: tính toàn bộ số lượng trước, rồi chia.", "", "", "", "", "", "الأكثر أماناً: احسب أولاً الكمية كلها، ثم اقسم.", "En güvenlisi: önce tüm miktarı hesapla, sonra böl."], "a3.1.q": ["Tổng giá mua trả chậm?", "", "", "", "", "", "سعر الشراء الآجل الإجمالي؟", "Toplam vadeli alış fiyatı?"], "a3.2.q": ["Tổng giá nhập?", "", "", "", "", "", "سعر الشراء النهائي الإجمالي؟", "Toplam alış maliyeti?"], "a3.3.q": ["Giá nhập mỗi cái?", "", "", "", "", "", "سعر الشراء النهائي للقطعة؟", "Adet başına alış maliyeti?"], "a3.4.q": ["3.1 Tại sao giá nhập mỗi cái là 3,60 € mà không phải 3,597 €?", "", "", "", "", "", "3.1 لماذا سعر الشراء النهائي للقطعة 3,60 € وليس 3,597 €؟", "3.1 Adet başına alış maliyeti neden 3,597 € değil de 3,60 €?"], "a4.h": ["Tính giá nhập như trong kỳ thi", "", "", "", "", "", "أسعار الشراء النهائية كما في الامتحان", "Sınavdaki gibi alış maliyetleri"], "a4.i": ["Tính theo sơ đồ trên giấy ô vuông. Ghi kết quả vào các ô.", "", "", "", "", "", "احسب بالمخطط على ورق المربعات. اكتب النتيجة في المربعات.", "Kareli kâğıtta şemayla hesapla. Sonucu kutucuklara yaz."], "a4.t": ["Hai quy tắc cơ bản: giảm giá tính từ giá mua niêm yết – chiết khấu tính từ giá mua trả chậm.", "", "", "", "", "", "قاعدتان أساسيتان: الخصم من سعر الشراء حسب القائمة – وخصم الدفع النقدي من سعر الشراء الآجل.", "İki temel kural: indirim liste alış fiyatından – iskonto vadeli alış fiyatından."], "a4.1.q": ["Sản phẩm cổ động: 200 cái giá 6,00 €, giảm 5 %    return '<tr'+rc+'><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+ts(it.id+'.r'+i)+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>'+tlo(it.id+'.g');
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p,pi){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'+tlo(b.id+'.p'+pi)}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});

function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';

 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';

 document.getElementById('app').innerHTML=h;

function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.filter(function(l){return SHOW[l[0]]}).map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');

 }

function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});

document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});

/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;

if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
